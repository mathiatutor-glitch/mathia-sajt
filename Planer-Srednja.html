<title>Mathia Planer — Srednja škola · by Profesorica</title>
<meta name="description" content="Digitalni planer za srednju školu. Planiranje, praćenje učenja, navike, ciljevi i vodič dr Marine.">

<style>
  :root{
    --bg:#FBF6EE;--bg2:#F1E7D7;--card:#FFFDF8;--ink:#3a2d36;--muted:#9a8a90;--line:#EDE3D4;
    --plum:#5A1024;--plum2:#7A3346;--gold:#C6A05C;--golddk:#9C7838;--goldlt:#E7D2A2;--champ:#F7EAC9;--rose:#CC8E86;--rose-dk:#B5746C;
    --mint:#8FB99B;--sky:#86A7C6;--lilac:#B08A98;--sun:#E7C063;
    --ok:#5fa978;--warn:#d99a4e;--bad:#cc7d76;
    --rad:18px;--sh:0 1px 2px rgba(120,90,50,.05),0 16px 36px -22px rgba(120,90,50,.32);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);background-image:radial-gradient(1200px 620px at 100% -8%,rgba(231,210,162,.20),transparent 60%),radial-gradient(900px 520px at -8% 112%,rgba(204,142,134,.10),transparent 55%);background-attachment:fixed;line-height:1.55;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:'Spectral',Georgia,serif;font-weight:600;line-height:1.1;margin:0}
  a{color:var(--golddk);text-decoration:none}
  .serif{font-family:'Spectral',serif}
  /* layout */
  .app{display:grid;grid-template-columns:262px 1fr;min-height:100vh}
  .side{background:linear-gradient(180deg,#5A1024,#3F0A16);color:#f3e9da;position:sticky;top:0;height:100vh;overflow-y:auto;padding:0 0 30px}
  .side::-webkit-scrollbar{width:7px}.side::-webkit-scrollbar-thumb{background:rgba(231,210,162,.25);border-radius:9px}
  .brand{padding:20px 22px 16px;border-bottom:1px solid rgba(231,210,162,.18);position:sticky;top:0;background:linear-gradient(180deg,#5A1024,#4A0D1B);z-index:2}
  .brand b{font-family:'Spectral',serif;font-size:1.34rem;letter-spacing:.02em;display:block;color:#fff}
  .brand .by{font-family:'Pinyon Script',cursive;font-size:1.32rem;letter-spacing:.01em;text-transform:none;color:var(--goldlt);margin-top:5px;font-weight:400}
  .navgrp{padding:14px 14px 2px}
  .navgrp .gt{font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(231,210,162,.55);font-weight:800;padding:0 10px 6px}
  .navi{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:11px;cursor:pointer;color:#e9ddcf;font-weight:600;font-size:.88rem;transition:background .14s,transform .08s}
  .navi:hover{background:rgba(231,210,162,.1)}
  .navi.on{background:linear-gradient(100deg,rgba(198,160,92,.95),rgba(156,120,56,.9));color:#3a2a12;box-shadow:0 6px 16px -8px rgba(0,0,0,.5)}
  .navi .ic{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex:0 0 22px;color:inherit}.navi .ic svg{width:19px;height:19px}.card>h3 svg{width:22px;height:22px;vertical-align:-4px;margin-right:9px;color:var(--gold);flex:none}.top .mt .mt-ic{display:inline-flex;vertical-align:-5px;margin-right:9px;color:var(--gold)}.top .mt .mt-ic svg{width:25px;height:25px}.top{position:relative}.top::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#E7D2A2,#C6A05C,#FFF6D6,#C6A05C,#E7D2A2,transparent)}
  /* main */
  .main{padding:0 0 60px;min-width:0}
  .top{position:sticky;top:0;z-index:5;background:rgba(251,246,238,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 30px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .top .mt{font-family:'Spectral',serif;font-size:1.5rem;color:var(--plum);font-weight:600;flex:1;min-width:160px}
  .savei{font-size:.74rem;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
  .savei .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .tbtn{border:1.4px solid var(--line);background:var(--card);color:var(--plum2);border-radius:10px;padding:7px 13px;font-family:inherit;font-weight:700;font-size:.8rem;cursor:pointer;transition:.14s;display:inline-flex;gap:6px;align-items:center}
  .tbtn:hover{border-color:var(--gold);background:#fffdf8}
  .tbtn.danger:hover{border-color:var(--bad);color:var(--bad)}
  .wrap{max-width:980px;margin:0 auto;padding:26px 30px}
  .banner{background:linear-gradient(100deg,#FCF4E4,#F8EBD2 58%,#F7E7E1);border:1px solid var(--goldlt);border-radius:var(--rad);padding:15px 22px;margin-bottom:22px;display:flex;align-items:center;gap:14px;color:var(--plum);box-shadow:0 16px 34px -26px rgba(198,160,92,.75)}
  .banner .q{font-family:'Spectral',serif;font-size:1.32rem;font-weight:600;font-style:italic}
  /* cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh);padding:20px 22px;margin-bottom:18px}
  .card>h3{font-size:1.45rem;color:var(--plum);margin-bottom:4px;display:flex;align-items:center;gap:9px}
  .card .desc{color:var(--muted);font-size:.86rem;margin-bottom:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px}
  @media(max-width:680px){.grid2,.grid3{grid-template-columns:1fr}}
  label.f{display:block;margin-bottom:2px}
  label.f .l{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--golddk);font-weight:800;display:block;margin-bottom:4px}
  input.t,select.t,textarea.t{width:100%;border:1.4px solid var(--line);background:#fcfbf9;border-radius:11px;padding:9px 12px;font-family:inherit;font-size:.92rem;color:var(--ink);transition:.14s;resize:none}
  input.t:focus,select.t:focus,textarea.t:focus{outline:none;border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(198,160,92,.13)}
  textarea.t{line-height:1.6;min-height:46px;overflow:hidden}
  .hint{font-size:.78rem;color:var(--muted);margin-top:3px}
  /* tables */
  .tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.88rem}
  .tbl th{text-align:left;font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--golddk);font-weight:800;padding:0 8px 7px}
  .tbl td{padding:4px 6px;vertical-align:top}
  .tbl input.t,.tbl select.t,.tbl textarea.t{padding:7px 9px;font-size:.86rem;border-radius:9px}
  .tbl tr+tr td{padding-top:7px}
  .rowdel{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:6px 4px;border-radius:8px}
  .rowdel:hover{color:var(--bad);background:#fbeeee}
  .addbtn{margin-top:10px;border:1.4px dashed var(--goldlt);background:#fffdf6;color:var(--golddk);border-radius:11px;padding:9px 14px;font-family:inherit;font-weight:800;font-size:.83rem;cursor:pointer;transition:.14s;width:100%}
  .addbtn:hover{border-color:var(--gold);background:#fdf6e8}
  /* chips / checklist */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chk{display:inline-flex;align-items:center;gap:8px;border:1.4px solid var(--line);background:#fcfbf9;border-radius:100px;padding:7px 14px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--plum2);transition:.14s;user-select:none}
  .chk:hover{border-color:var(--gold)}
  .chk.on{background:linear-gradient(100deg,#eaf6ee,#dff0e6);border-color:#aed7bd;color:#2f6b46}
  .chk .bx{width:17px;height:17px;border-radius:6px;border:2px solid #cbb9c2;display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;color:#fff}
  .chk.on .bx{background:var(--ok);border-color:var(--ok)}
  /* progress */
  .bar{height:11px;background:var(--bg2);border-radius:100px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--goldlt),var(--gold));border-radius:100px;transition:width .3s}
  .stat{display:flex;flex-direction:column;gap:2px;background:#faf8f4;border:1px solid var(--line);border-radius:13px;padding:13px 15px}
  .stat .n{font-family:'Spectral',serif;font-size:1.9rem;font-weight:700;color:var(--plum);line-height:1}
  .stat .k{font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:800}
  /* misc widgets */
  .ring{--p:0;width:128px;height:128px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--bg2) 0);display:flex;align-items:center;justify-content:center}
  .ring .in{width:98px;height:98px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .in b{font-family:'Spectral',serif;font-size:1.9rem;color:var(--plum)}
  .pomo{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0}
  .pomo .time{font-family:'Spectral',serif;font-size:4.4rem;color:var(--plum);font-weight:700;letter-spacing:.02em}
  .pomo .ctl{display:flex;gap:10px}
  .bigbtn{border:none;border-radius:100px;padding:12px 30px;font-family:inherit;font-weight:800;font-size:.95rem;cursor:pointer;transition:.16s;box-shadow:0 10px 24px -12px rgba(198,160,92,.8)}
  .bigbtn.g{background:linear-gradient(180deg,#EBD49A,var(--gold));color:#4a3812}
  .bigbtn.o{background:#fff;border:1.5px solid var(--line);color:var(--plum2);box-shadow:none}
  .bigbtn:hover{transform:translateY(-2px)}
  .tom{font-size:1.5rem;letter-spacing:3px}
  .week{display:grid;grid-template-columns:1.4fr repeat(7,1fr);gap:6px;align-items:center;font-size:.82rem}
  .week .hd{font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:800;text-align:center}
  .cell{aspect-ratio:1;border-radius:9px;border:1.6px solid var(--line);background:#fcfbf9;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.9rem;transition:.12s}
  .cell.on{background:linear-gradient(120deg,var(--gold),var(--goldlt));border-color:var(--gold);color:#fff}
  .moodc{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:#fcfbf9;display:flex;align-items:center;justify-content:center;font-size:1.3rem;cursor:pointer;transition:.12s}
  .moodc:hover{border-color:var(--gold)}
  .badge{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fbfaf7;cursor:pointer;transition:.16s;opacity:.55;filter:grayscale(.7)}
  .badge.on{opacity:1;filter:none;background:linear-gradient(110deg,#fff7e6,#fdeecb);border-color:var(--goldlt);box-shadow:0 10px 22px -14px rgba(198,160,92,.7)}
  .badge .e{font-size:1.7rem}
  .badge b{font-family:'Spectral',serif;font-size:1.1rem;color:var(--plum);display:block}
  .badge small{color:var(--muted)}
  .stik{font-size:1.9rem;cursor:pointer;width:50px;height:50px;border-radius:13px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line);background:#fcfbf9;transition:.12s;position:relative}
  .stik:hover{transform:translateY(-2px) rotate(-4deg);border-color:var(--gold)}
  .stik .cnt{position:absolute;top:-7px;right:-7px;background:var(--rose);color:#fff;font-family:'Inter';font-size:.68rem;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .subtab{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .subtab .st{border:1.4px solid var(--line);background:#fcfbf9;border-radius:100px;padding:7px 15px;font-weight:800;font-size:.85rem;cursor:pointer;color:var(--plum2);transition:.14s}
  .subtab .st:hover{border-color:var(--gold)}
  .subtab .st.on{background:var(--plum);color:#fff;border-color:var(--plum)}
  .pill{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:100px;background:#f1ece6;color:var(--golddk)}
  .vimg{width:100%;border-radius:13px;border:1px solid var(--line);margin-top:8px;display:block}
  .guide h4{font-size:1.2rem;color:var(--plum);margin:16px 0 4px}
  .guide p{margin:0 0 8px;color:#4a3f4a}
  .guide ul{margin:0 0 10px;padding-left:20px;color:#4a3f4a}
  .guide li{margin:3px 0}
  .miniad{display:none}
  .scrim{display:none}   /* desktop: van grida, inace pojede sadrzajnu kolonu */
  @media(max-width:860px){
    .app{grid-template-columns:1fr}
    .side{position:fixed;left:0;top:0;width:84%;max-width:300px;transform:translateX(-103%);transition:transform .22s;z-index:60;box-shadow:0 0 60px rgba(0,0,0,.4)}
    .side.open{transform:none}
    .miniad{display:inline-flex}
    .scrim{display:block;position:fixed;inset:0;background:rgba(20,12,18,.4);z-index:55;opacity:0;pointer-events:none;transition:.2s}
    .scrim.on{opacity:1;pointer-events:auto}
  }
  @media print{
    .side,.top,.banner,.addbtn,.rowdel,.tbtn,.scrim{display:none!important}
    .app{display:block}.wrap{max-width:100%}
    .card{break-inside:avoid;box-shadow:none;border:1px solid #ddd}
    body{background:#fff}
  }
</style>

/* Luksuzni levi meni — po uzoru na prvu stranu */
.side .brand b{font-family:'Spectral',Georgia,serif!important;font-size:1.55rem!important;font-weight:600!important;letter-spacing:.01em;background:linear-gradient(100deg,#9C7838,#E7D2A2 34%,#FFF7E2 50%,#E7D2A2 66%,#C6A05C);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent!important;-webkit-text-fill-color:transparent;display:block;line-height:1.05;margin-top:2px}

<style>
.mpl-cover{margin:0 0 24px;border-radius:20px;position:relative;box-shadow:0 26px 54px -32px rgba(120,70,80,.55);overflow:hidden}
.mpl-cover-in{padding:18px 20px 22px;position:relative;z-index:2}
.mpl-cover-top{display:flex;align-items:center;justify-content:space-between}
.mpl-cover-brand{font-family:'Inter',sans-serif;font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;font-weight:800}
.mpl-theme{display:flex;gap:7px}
.mt{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:0 0 0 1px rgba(198,160,92,.5)}
.mt.on{box-shadow:0 0 0 2px #C6A05C}
.mt.champ{background:linear-gradient(135deg,#FDF8EF,#EAD6A6)}
.mt.plum{background:linear-gradient(135deg,#7A3346,#2C1A25)}
.mt.blush{background:linear-gradient(135deg,#F7E9E4,#E7C6BC)}
.mpl-cover-center{text-align:center;padding:30px 18px 34px;position:relative;margin-top:10px}
.mpl-cover-center::before{content:"";position:absolute;inset:6px;border:1px solid rgba(198,160,92,.5);border-radius:13px;pointer-events:none}
.mpl-cover-center::after{content:"";position:absolute;inset:11px;border:1px solid rgba(198,160,92,.28);border-radius:9px;pointer-events:none}
.mpl-mono{width:58px;height:58px;margin:0 auto 15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Spectral',serif;font-weight:700;font-size:1.8rem;background:radial-gradient(circle at 38% 30%,#FFF6D6,#C6A05C);color:#3a2530;box-shadow:0 12px 24px -8px rgba(198,160,92,.85)}
.mpl-cover-name{font-family:'Spectral',serif;font-size:2rem;font-weight:600;line-height:1.12}
.mpl-cover-line{width:42px;height:2px;margin:13px auto;border-radius:2px;background:linear-gradient(90deg,transparent,#C6A05C,transparent)}
.mpl-cover-sub{font-family:'Pinyon Script','Spectral',cursive;font-size:1.5rem;font-style:italic}
.mpl-cover[data-theme=champ]{background:linear-gradient(160deg,#FDF8EF,#F3E6C8 60%,#ECD9AC)}
.mpl-cover[data-theme=champ] .mpl-cover-brand,.mpl-cover[data-theme=champ] .mpl-cover-name{color:#7A3346}
.mpl-cover[data-theme=champ] .mpl-cover-sub{color:#9C7838}
.mpl-cover[data-theme=plum]{background:linear-gradient(160deg,#4A2A38,#2C1A25)}
.mpl-cover[data-theme=plum] .mpl-cover-brand{color:#E7D2A2}
.mpl-cover[data-theme=plum] .mpl-cover-name{color:#FBF6EE}
.mpl-cover[data-theme=plum] .mpl-cover-sub{color:#E7D2A2}
.mpl-cover[data-theme=plum] .mpl-cover-center::before{border-color:rgba(231,210,162,.45)}
.mpl-cover[data-theme=plum] .mpl-cover-center::after{border-color:rgba(231,210,162,.22)}
.mpl-cover[data-theme=blush]{background:linear-gradient(160deg,#F7E9E4,#F0D9D2 60%,#E7C6BC)}
.mpl-cover[data-theme=blush] .mpl-cover-brand,.mpl-cover[data-theme=blush] .mpl-cover-name{color:#7A3346}
.mpl-cover[data-theme=blush] .mpl-cover-sub{color:#B5746C}
</style>
<style>

.stkc{background:#fffdf8;border:1px solid rgba(198,160,92,.28);border-radius:16px;padding:14px 8px;text-align:center;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s,opacity .15s,filter .15s;opacity:.42;filter:grayscale(.55)}
.stkc:hover{transform:translateY(-3px);border-color:#C6A05C}
.stkc.on{opacity:1;filter:none;background:radial-gradient(circle at 50% 20%,#FFFDF6,#F3E7CE);box-shadow:0 12px 24px -12px rgba(198,160,92,.8)}
.stkc-e{font-size:1.9rem;line-height:1}
.stkc-l{font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#9C7838;margin-top:6px}

<style id="px-planer-slatki">
.eyebrow{color:#B01E48!important}
.px-foot{padding:44px 26px 24px!important;text-align:center;position:relative;overflow:hidden;background:linear-gradient(180deg,#FBF6EE,#F5EEE1);border-top:1px solid #F0DCA8;margin-top:40px}
.px-foot .pf-in{max-width:820px;margin:0 auto}

let curIdx=0;
function buildNav(){
  const groups=[];const seen={};
  SECTIONS.forEach(s=>{if(!seen[s.grp]){seen[s.grp]=[];groups.push(s.grp);}seen[s.grp].push(s);});
  let h='';
  groups.forEach(g=>{
    h+=`<div class="navgrp"><div class="gt">${g}</div>`;
    seen[g].forEach(s=>{const i=SECTIONS.indexOf(s);h+=`<div class="navi" data-i="${i}"><span class="ic">${s.ic}</span>${s.t}</div>`;});
    h+='</div>';
  });
  document.getElementById('nav').innerHTML=h;
  document.querySelectorAll('.navi').forEach(n=>n.addEventListener('click',()=>{go(+n.dataset.i);toggleSide(false);}));
}
function go(i){curIdx=i;document.querySelectorAll('.navi').forEach(n=>n.classList.toggle('on',+n.dataset.i===i));renderCurrent();window.scrollTo(0,0);}
function renderCurrent(){
  const s=SECTIONS[curIdx];
  document.getElementById('mtitle').innerHTML='<span class="mt-ic">'+s.ic+'</span> '+s.t;
  document.getElementById('content').innerHTML=s.r();
  document.querySelectorAll('#content textarea.t').forEach(autosize);
}
function rotateMotiv(){document.getElementById('motiv').textContent=MOTIV[Math.floor(Math.random()*MOTIV.length)];}

/* ---------------- events ---------------- */
document.getElementById('content').addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.path){
    let v=t.value;
    set(t.dataset.path,v);save();
    if(t.tagName==='TEXTAREA')autosize(t);
    // live update bars/rings without losing focus: only for range
    if(t.dataset.act==='range'){const bar=t.parentElement.querySelector('.bar>i');if(bar)bar.style.width=v+'%';const hb=t.parentElement.querySelector('.hint b');if(hb)hb.textContent=v+'%';}
  }
});
document.getElementById('content').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act;if(act==='stk'){const si=+b.dataset.i;DB.stickers=DB.stickers||{};DB.stickers[si]=!DB.stickers[si];save();renderCurrent();return;}
  if(act==='add'){const arr=get(b.dataset.arr)||[];arr.push(JSON.parse(decodeURIComponent(b.dataset.tpl)));set(b.dataset.arr,arr);save();renderCurrent();}
  else if(act==='del'){const arr=get(b.dataset.arr)||[];arr.splice(+b.dataset.idx,1);save();renderCurrent();}
  else if(act==='chk'){const o=get(b.dataset.obj)||{};o[b.dataset.k]=!o[b.dataset.k];set(b.dataset.obj,o);save();renderCurrent();}
  else if(act==='habit'){DB.habits[+b.dataset.i].days[+b.dataset.d]=!DB.habits[+b.dataset.i].days[+b.dataset.d];save();renderCurrent();}
  else if(act==='mood'){const i=+b.dataset.i;DB.mood[i]=((DB.mood[i]==null?-1:DB.mood[i])+1)%5;save();renderCurrent();}
  else if(act==='badge'){DB.badges[+b.dataset.i].on=!DB.badges[+b.dataset.i].on;save();renderCurrent();}
  else if(act==='stik'){const e2=b.dataset.e;DB.stickers[e2]=(DB.stickers[e2]||0)+1;save();renderCurrent();}
  else if(act==='subsel'){DB.curSub=+b.dataset.idx;save();renderCurrent();}
  else if(act==='subadd'){DB.subjects.push({name:'',prof:'',asistent:'',kabinet:'',email:'',konsultacije:'',espb:'',literatura:'',checklist:{},kontrolnii:[],ispiti:[],poneti:{},formule:'',definicije:'',greske:'',pitanja:'',ponovo:'',napredak:0});DB.curSub=DB.subjects.length-1;save();renderCurrent();}
  else if(act==='subdel'){if(confirm('Obrisati ovaj predmet?')){DB.subjects.splice(+b.dataset.idx,1);DB.curSub=0;save();renderCurrent();}}
  else if(act==='pstart'){pRun=!pRun;if(pRun){pTimer=setInterval(pTick,1000);}else{clearInterval(pTimer);}renderCurrent();}

function toggleSide(v){document.getElementById('side').classList.toggle('open',v);document.getElementById('scrim').classList.toggle('on',v);}
function expData(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='mathia-planer-'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function impData(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{DB=migrate(JSON.parse(r.result));save();renderCurrent();alert('Uvezeno! 🎉');}catch(e){alert('Greška pri uvozu fajla.');}};r.readAsText(f);
}
function resetAll(){if(confirm('Obrisati SVE podatke i početi iznova? Ovo se ne može poništiti.')){DB=defaults();save();go(0);}}

/* ---------------- init ---------------- */
(function init(){
  DB=store.load();
  DB=DB?migrate(DB):defaults();
  (async function(){try{var ok=await cloudInit();if(!ok)return;var c=await cloudLoad();if(c){DB=migrate(c);try{store.save(DB);}catch(e){}if(typeof renderCurrent==="function")renderCurrent();flag("Sačuvano u nalog");}else{cloudSave();}}catch(e){}})();

  buildNav();rotateMotiv();go(0);

})();

 za prijavu za posao ili master.": ["All in one place — ready for a job or master's application.", "Alles an einem Ort — bereit für Bewerbung oder Master.", "Tout au même endroit — prêt pour un emploi ou un master.", "Todo en un lugar — listo para empleo o máster.", "Tutto in un posto — pronto per lavoro o master.", "Всё в одном месте — готово для работы или магистратуры.", "Tudo num só lugar — pronto para emprego ou mestrado."], "Velika tabela celog roka — sve što ti treba na jednom mestu.": ["A big table for the whole term — all you need in one place.", "Große Tabelle für den ganzen Zeitraum — alles an einem Ort.", "Grand tableau de toute la session — tout au même endroit.", "Gran tabla de todo el período — todo en un lugar.", "Grande tabella dell'intero periodo — tutto in un posto.", "Большая таблица всего срока — всё в одном месте.", "Tabela grande de todo o período — tudo num só lugar."], "Beleži koliko si učio i kako si se osećao — vremenom vidiš svoj ritam.": ["Track how much you studied and how you felt — over time you see your rhythm.", "Notiere, wie viel du gelernt und wie du dich gefühlt hast — mit der Zeit siehst du deinen Rhythmus.", "Note combien tu as étudié et comment tu te sentais — tu verras ton rythme.", "Anota cuánto estudiaste y cómo te sentiste — con el tiempo ves tu ritmo.", "Annota quanto hai studiato e come ti sentivi — nel tempo vedi il tuo ritmo.", "Записывай, сколько учился и как себя чувствовал — со временем увидишь свой ритм.", "Regista quanto estudaste e como te sentiste — com o tempo vês o teu ritmo."], "Postavi jasne ciljeve za ovu godinu i dalje. Vraćaj se ovde i ažuriraj ih.": ["Set clear goals for this year and beyond. Come back and update them.", "Setze klare Ziele für dieses Jahr und darüber hinaus. Aktualisiere sie hier.", "Fixe des objectifs clairs pour cette année et au-delà. Reviens les mettre à jour.", "Fija metas claras para este año y más allá. Vuelve y actualízalas.", "Fissa obiettivi chiari per quest'anno e oltre. Torna <script>
(function(){
 function today(){return new Date().toISOString().slice(0,10);}
 function ensure(){ if(typeof DB!=='object'||!DB) return false; if(!DB.engage) DB.engage={streak:0,lastDay:'',xp:0,level:1}; return true; }
 function dbtw(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
 function tickStreak(){ if(!ensure())return; var t=today();
   if(DB.engage.lastDay!==t){
     if(DB.engage.lastDay && dbtw(DB.engage.lastDay,t)===1) DB.engage.streak=(DB.engage.streak||0)+1;
     else DB.engage.streak=1;
     DB.engage.lastDay=t; try{save();}catch(e){}
   }
 }
 function hudHTML(){ ensure(); var e=DB.engage; var pct=(e.xp||0)%100;
   return '<div class="eng-owl" aria-hidden="true">🦉</div><div class="eng-mid">'
     +'<div class="eng-row"><span class="eng-chip">🔥 <b>'+(e.streak||0)+'</b></span>'
       +'<span class="eng-chip"><span class="lbl">Nivo</span> <b>'+(e.level||1)+'</b></span></div>'
     +'<div class="eng-bar"><i style="width:'+pct+'%"></i></div>'
     +'<div class="eng-xp"><b>'+(e.xp||0)+'</b> XP</div></div>';
 }
 function updateHud(){ var w=document.querySelector('.wrap'); if(!w)return; var el=document.getElementById('eng-hud');
   if(!el){ el=document.createElement('div'); el.id='eng-hud'; el.className='eng-hud'; var c=document.getElementById('content'); w.insertBefore(el, c||null); }
   el.innerHTML=hudHTML();
   try{window.dispatchEvent(new Event('mathia:lang'));}catch(e){}
 }
 function toast(msg){ var t=document.createElement('div'); t.className='eng-toast'; t.textContent=msg; document.body.appendChild(t);
   setTimeout(function(){t.classList.add('on');},20); setTimeout(function(){t.classList.remove('on');},2600); setTimeout(function(){t.remove();},3100); }
 function confetti(n){ var box=document.getElementById('lux-conf'); if(!box){box=document.createElement('div');box.id='lux-conf';box.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden';document.body.appendChild(box);}
   var cols=['#C6A05C','#B01E48','#CC5E7E','#F0DCA8','#8FB99B','#E7D2A2'];
   for(var k=0;k<n;k++){var s=document.createElement('i');s.style.cssText='position:absolute;top:-6%;width:10px;height:14px;border-radius:2px;left:'+(Math.random()*100)+'%;background:'+cols[k%cols.length]+';animation:luxcf '+(1.5+Math.random()*1.3)+'s linear forwards;transform:rotate('+(Math.random()*360)+'deg)';box.appendChild(s);setTimeout(function(el){return function(){el.remove();};}(s),3000);} }
 var _last=0;
 window.__engAddXp=function(n){ if(!ensure())return; DB.engage.xp=(DB.engage.xp||0)+n; var nl=Math.floor(DB.engage.xp/100)+1;
   if(nl>(DB.engage.level||1)){ DB.engage.level=nl; toast('Nivo '+nl+'! 🎉'); confetti(72);} try{save();}catch(e){} updateHud(); };
 document.addEventListener('click',function(ev){ var b=ev.target.closest&&ev.target.closest('[data-act]'); if(!b)return; var a=b.dataset.act;
   if(['chk','habit','badge','stik','stk','add','subadd','pstart'].indexOf(a)>=0){ var now=Date.now(); if(now-_last<250)return; _last=now; window.__engAddXp(4); } },true);
 document.addEventListener('change',function(ev){ var t=ev.target; if(t&&t.classList&&t.classList.contains('t')){ var now=Date.now(); if(now-_last<400)return; _last=now; window.__engAddXp(2); } },true);
 function boot(){ if(!document.querySelector('.wrap')){ return setTimeout(boot,150);} tickStreak(); updateHud(); }
 boot();
})();
</script>
<script>(function(){try{var l=(localStorage.getItem("mathia_lang")||"sr").slice(0,2).toLowerCase();var s=document.getElementById("pl-lang");if(s){for(var i=0;i<s.options.length;i++){if(s.options[i].value===l){s.selectedIndex=i;break;}}}}catch(e){}})();</script>

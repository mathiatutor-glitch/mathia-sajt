<style>
:root{--cream:#FBF6EE;--ink:#5A1024;--ink2:#7A3346;--gold:#C6A05C;--goldlt:#F0DCA8;--malina:#B01E48;--malina2:#CC5E7E;--mint:#3FB98C;--muted:#8A7A80}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#43303A;min-height:100vh;
 background:radial-gradient(520px 400px at 104% -6%,#F6E1EC 0,transparent 56%),radial-gradient(500px 380px at -6% 106%,#F7ECD6 0,transparent 58%),var(--cream);overflow-x:hidden}
#fall{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fall span{position:absolute;top:-8%;font-family:'Spectral',serif;font-style:italic;color:rgba(198,160,92,.22);animation:fl linear infinite}
#fall span.m{color:rgba(176,30,72,.16)}
@keyframes fl{0%{transform:translateY(-10vh) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(112vh) rotate(24deg);opacity:0}}
.wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:14px 16px 30px}
.top{display:flex;align-items:center;gap:10px;padding:4px 2px 10px}
.top .back{color:var(--ink2);text-decoration:none;font-weight:800;font-size:1.1rem}
.top .lang{margin-left:auto;border:1px solid var(--goldlt);border-radius:100px;padding:5px 10px;font-family:inherit;font-weight:800;font-size:.72rem;color:var(--ink);background:#fff}
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:#E6D5CE;transition:.3s}
.dots i.on{background:linear-gradient(90deg,var(--gold),var(--malina));transform:scale(1.25)}
.dots i.done{background:var(--goldlt)}
.stage{position:relative;min-height:62vh}
.card{position:relative;background:linear-gradient(180deg,#FFFDF9,#FDF3EA);border:1px solid var(--goldlt);border-radius:32px;
 padding:26px 22px 22px;box-shadow:0 30px 70px -34px rgba(90,16,36,.5);animation:slidein .45s cubic-bezier(.2,.9,.2,1)}
@keyframes slidein{0%{transform:translateX(28px) scale(.97);opacity:0}100%{transform:translateX(0) scale(1);opacity:1}}
.eyebrow{text-align:center;font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:.64rem;color:var(--malina)}
.mascot{width:82px;height:82px;margin:8px auto 4px;border-radius:50%;display:grid;place-items:center;font-size:2.6rem;background:radial-gradient(circle at 40% 34%,#FFF3F7,#F6E1EC);border:2px solid var(--goldlt);box-shadow:0 14px 28px -12px rgba(176,30,72,.4);animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.tnum{text-align:center;color:var(--muted);font-weight:800;font-size:.78rem;margin-top:6px}
.ttl{font-family:'Spectral',serif;font-weight:700;color:var(--ink);font-size:1.75rem;text-align:center;line-height:1.2;margin:2px 0 8px}
.theory{color:#5a4750;font-size:1.02rem;text-align:center;line-height:1.55;margin:0 auto 14px;max-width:460px}
.theory b{color:var(--ink)}
.fx{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 4px}
.fx span{display:inline-block;background:#fff;border:1px dashed var(--goldlt);border-radius:14px;padding:9px 14px;font-family:'Spectral','Cambria Math',Georgia,serif;color:var(--ink);font-size:1.05rem;animation:pop .4s both}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.zap{margin:16px auto 2px;max-width:460px;background:linear-gradient(180deg,#FFF7FA,#FBEEF2);border:1px solid #F0D6DF;border-radius:18px;padding:13px 16px;display:flex;gap:10px;align-items:flex-start}
.zap .st{font-size:1.4rem;line-height:1}
.zap p{margin:0;color:var(--ink2);font-size:.95rem;font-weight:600}
.nav{display:flex;align-items:center;gap:12px;margin-top:16px}
.nav .prev{background:none;border:none;color:var(--ink2);font-weight:800;cursor:pointer;font-size:1rem;padding:8px}
.nav .next{flex:1;border:none;cursor:pointer;background:linear-gradient(135deg,var(--malina2),var(--malina));color:#fff;font-weight:900;font-size:1.05rem;padding:14px;border-radius:100px;box-shadow:0 16px 30px -14px rgba(176,30,72,.6);transition:transform .15s}
.nav .next:hover{transform:translateY(-2px)}
.fin{text-align:center}
.fin .big{font-size:3.4rem}
.fin h2{font-family:'Spectral',serif;color:var(--ink);font-size:1.9rem;margin:4px 0}
.fin p{color:var(--ink2)}
.fin .cta{display:block;margin-top:12px;text-decoration:none;text-align:center;background:linear-gradient(135deg,var(--malina2),var(--malina));color:#fff;font-weight:900;padding:14px;border-radius:100px;box-shadow:0 16px 30px -14px rgba(176,30,72,.6)}
.fin .cta2{display:block;margin-top:10px;text-decoration:none;color:var(--ink2);font-weight:800}
#conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#conf i{position:absolute;top:-6%;width:10px;height:14px;border-radius:2px;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(560deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
var D={"eyebrow": {"sr": "Matematika · 8. razred", "en": "Mathematics · Grade 8", "de": "Mathematik · 8. Klasse", "fr": "Mathématiques · 8e année", "es": "Matemáticas · 8.º grado", "it": "Matematica · 8ª classe", "ru": "Математика · 8 класс", "pt": "Matemática · 8.º ano"}, "topics": [{"name": {"sr": "Funkcije", "en": "Functions", "de": "Funktionen", "fr": "Fonctions", "es": "Funciones", "it": "Funzioni", "ru": "Функции", "pt": "Funções"}, "theory": {"sr": "<b>Funkcija</b> je pravilo koje svakom elementu x iz skupa A (domen) dodeljuje tačno jedan element y iz skupa B (kodomen). Zapisuje se f: A → B, a vrednost funkcije u tački x označava se sa f(x) ili y. Funkcija se može zadati tabelom, grafikom ili formulom (jednačinom). Grafik funkcije u koordinatnom sistemu je skup tačaka (x, f(x)); da bi kriva bila grafik funkcije, svaka vertikalna prava sme da je seče najviše jednom.", "en": "<b>A function</b> is a rule that assigns to every element x from set A (the domain) exactly one element y from set B (the codomain). It is written as f: A → B, and the value of the function at x is denoted f(x) or y. A function can be given by a table, a graph, or a formula (equation). The graph of a function in a coordinate system is the set of points (x, f(x)); for a curve to be the graph of a function, every vertical line may intersect it at most once.", "de": "<b>Eine Funktion</b> ist eine Vorschrift, die jedem Element x aus der Menge A (Definitionsbereich) genau ein Element y aus der Menge B (Wertebereich) zuordnet. Man schreibt f: A → B, und der Funktionswert an der Stelle x wird mit f(x) oder y bezeichnet. Eine Funktion kann durch eine Tabelle, einen Graphen oder eine Formel (Gleichung) gegeben sein. Der Graph einer Funktion im Koordinatensystem ist die Menge der Punkte (x, f(x)); damit eine Kurve der Graph einer Funktion ist, darf jede senkrechte Gerade sie höchstens einmal schneiden.", "fr": "<b>Une fonction</b> est une règle qui associe à chaque élément x de l'ensemble A (l'ensemble de départ) exactement un élément y de l'ensemble B (l'ensemble d'arrivée). On note f: A → B, et la valeur de la fonction en x se note f(x) ou y. Une fonction peut être donnée par un tableau, un graphique ou une formule (équation). Le graphique d'une fonction dans un repère est l'ensemble des points (x, f(x)) ; pour qu'une courbe soit le graphique d'une fonction, toute droite verticale ne doit la couper qu'au plus une fois.", "es": "<b>Una función</b> es una regla que asigna a cada elemento x del conjunto A (dominio) exactamente un elemento y del conjunto B (codominio). Se escribe f: A → B, y el valor de la función en x se denota f(x) o y. Una función puede darse mediante una tabla, una gráfica o una fórmula (ecuación). La gráfica de una función en un sistema de coordenadas es el conjunto de puntos (x, f(x)); para que una curva sea la gráfica de una función, toda recta vertical debe cortarla como máximo una vez.", "it": "<b>Una funzione</b> è una regola che associa a ogni elemento x dell'insieme A (dominio) esattamente un elemento y dell'insieme B (codominio). Si scrive f: A → B, e il valore della funzione in x si indica con f(x) oppure y. Una funzione può essere data tramite una tabella, un grafico o una formula (equazione). Il grafico di una funzione nel sistema di coordinate è l'insieme dei punti (x, f(x)); affinché una curva sia il grafico di una funzione, ogni retta verticale deve intersecarla al massimo una volta.", "ru": "<b>Функция</b> — это правило, которое каждому элементу x из множества A (области определения) ставит в соответствие ровно один элемент y из множества B (области значений). Записывается как f: A → B, а значение функции в точке x обозначается f(x) или y. Функцию можно задать таблицей, графиком или формулой (уравнением). График функции в системе координат — это множество точек (x, f(x)); чтобы кривая была графиком функции, любая вертикальная прямая должна пересекать её не более одного раза.", "pt": "<b>Uma função</b> é uma regra que atribui a cada elemento x do conjunto A (domínio) exatamente um elemento y do conjunto B (contradomínio). Escreve-se f: A → B, e o valor da função em x é denotado por f(x) ou y. Uma função pode ser dada por uma tabela, um gráfico ou uma fórmula (equação). O gráfico de uma função no sistema de coordenadas é o conjunto de pontos (x, f(x)); para que uma curva seja o gráfico de uma função, toda reta vertical deve cruzá-la no máximo uma vez."}, "formulas": [{"sr": "f : A → B, y = f(x)", "en": "f : A → B, y = f(x)", "de": "f : A → B, y = f(x)", "fr": "f : A → B, y = f(x)", "es": "f : A → B, y = f(x)", "it": "f : A → B, y = f(x)", "ru": "f : A → B, y = f(x)", "pt": "f : A → B, y = f(x)"}, {"sr": "D(f) = A (domen), svakom x odgovara tačno jedan y", "en": "D(f) = A (domain), each x corresponds to exactly one y", "de": "D(f) = A (Definitionsbereich), jedem x entspricht genau ein y", "fr": "D(f) = A (ensemble de définition), à chaque x correspond exactement un y", "es": "D(f) = A (dominio), a cada x le corresponde exactamente un y", "it": "D(f) = A (dominio), a ogni x corrisponde esattamente un y", "ru": "D(f) = A (область определения), каждому x соответствует ровно одно y", "pt": "D(f) = A (domínio), a cada x corresponde exatamente um y"}], "remember": {"sr": "Test vertikalne prave: ako vertikalna prava seče grafik u više od jedne tačke, to NIJE grafik funkcije.", "en": "The vertical line test: if a vertical line intersects the graph in more than one point, it is NOT the graph of a function.", "de": "Der Vertikaltest: Schneidet eine senkrechte Gerade den Graphen in mehr als einem Punkt, ist es KEIN Graph einer Funktion.", "fr": "Le test de la droite verticale : si une droite verticale coupe le graphique en plus d'un point, ce n'EST PAS le graphique d'une fonction.", "es": "La prueba de la recta vertical: si una recta vertical corta la gráfica en más de un punto, NO es la gráfica de una función.", "it": "Il test della retta verticale: se una retta verticale interseca il grafico in più di un punto, NON è il grafico di una funzione.", "ru": "Тест вертикальной прямой: если вертикальная прямая пересекает график более чем в одной точке, это НЕ график функции.", "pt": "O teste da reta vertical: se uma reta vertical cruza o gráfico em mais de um ponto, NÃO é o gráfico de uma função."}, "problem": {"statement": {"sr": "Data je funkcija f(x) = 2x − 3. Izračunaj f(0), f(2) i f(−1), a zatim odredi za koje x je f(x) = 5.", "en": "The function f(x) = 2x − 3 is given. Calculate f(0), f(2) and f(−1), then find x for which f(x) = 5.", "de": "Gegeben ist die Funktion f(x) = 2x − 3. Berechne f(0), f(2) und f(−1) und bestimme dann, für welches x gilt f(x) = 5.", "fr": "On donne la fonction f(x) = 2x − 3. Calcule f(0), f(2) et f(−1), puis détermine pour quelle valeur de x on a f(x) = 5.", "es": "Se da la función f(x) = 2x − 3. Calcula f(0), f(2) y f(−1), y luego determina para qué x se cumple f(x) = 5.", "it": "È data la funzione f(x) = 2x − 3. Calcola f(0), f(2) e f(−1), poi determina per quale x si ha f(x) = 5.", "ru": "Дана функция f(x) = 2x − 3. Вычисли f(0), f(2) и f(−1), а затем найди, при каком x выполняется f(x) = 5.", "pt": "É dada a função f(x) = 2x − 3. Calcule f(0), f(2) e f(−1) e depois determine para que x se tem f(x) = 5."}, "steps": [{"sr": "f(0) = 2·0 − 3 = −3", "en": "f(0) = 2·0 − 3 = −3", "de": "f(0) = 2·0 − 3 = −3", "fr": "f(0) = 2·0 − 3 = −3", "es": "f(0) = 2·0 − 3 = −3", "it": "f(0) = 2·0 − 3 = −3", "ru": "f(0) = 2·0 − 3 = −3", "pt": "f(0) = 2·0 − 3 = −3"}, {"sr": "f(2) = 2·2 − 3 = 1, f(−1) = 2·(−1) − 3 = −5", "en": "f(2) = 2·2 − 3 = 1, f(−1) = 2·(−1) − 3 = −5", "de": "f(2) = 2·2 − 3 = 1, f(−1) = 2·(−1) − 3 = −5", "fr": "f(2) = 2·2 − 3 = 1, f(−1) = 2·(−1) − 3 = −5", "es": "f(2) = 2·2 − 3 = 1, f(−1) = 2·(−1) − 3 = −5", "it": "f(2) = 2·2 − 3 = 1, f(−1) = 2·(−1) − 3 = −5", "ru": "f(2) = 2·2 − 3 = 1, f(−1) = 2·(−1) − 3 = −5", "pt": "f(2) = 2·2 − 3 = 1, f(−1) = 2·(−1) − 3 = −5"}, {"sr": "Iz f(x) = 5 sledi 2x − 3 = 5, 2x = 8, pa je x = 4.", "en": "From f(x) = 5 it follows that 2x − 3 = 5, 2x = 8, so x = 4.", "de": "Aus f(x) = 5 folgt 2x − 3 = 5, 2x = 8, also x = 4.", "fr": "De f(x) = 5, on tire 2x − 3 = 5, 2x = 8, donc x = 4.", "es": "De f(x) = 5 se obtiene 2x − 3 = 5, 2x = 8, por lo tanto x = 4.", "it": "Da f(x) = 5 segue 2x − 3 = 5, 2x = 8, quindi x = 4.", "ru": "Из f(x) = 5 следует 2x − 3 = 5, 2x = 8, значит x = 4.", "pt": "De f(x) = 5 obtém-se 2x − 3 = 5, 2x = 8, portanto x = 4."}]}}, {"name": {"sr": "Linearna funkcija", "en": "Linear function", "de": "Lineare Funktion", "fr": "Fonction linéaire", "es": "Función lineal", "it": "Funzione lineare", "ru": "Линейная функция", "pt": "Função linear"}, "theory": {"sr": "<b>Linearna funkcija</b> je funkcija oblika y = kx + n, gde je k koeficijent pravca (nagib), a n odsečak na y-osi (vrednost funkcije za x = 0). Njen grafik je prava linija. Ako je k > 0, funkcija raste; ako je k < 0, funkcija opada; ako je k = 0, grafik je prava paralelna sa x-osom (konstantna funkcija). Nula funkcije je vrednost x za koju je y = 0, a dobija se iz jednačine kx + n = 0.", "en": "<b>A linear function</b> is a function of the form y = kx + n, where k is the slope (rate of change), and n is the y-intercept (the value of the function at x = 0). Its graph is a straight line. If k > 0, the function is increasing; if k < 0, the function is decreasing; if k = 0, the graph is a line parallel to the x-axis (a constant function). The zero of the function is the value of x for which y = 0, obtained from the equation kx + n = 0.", "de": "<b>Eine lineare Funktion</b> ist eine Funktion der Form y = kx + n, wobei k die Steigung und n der y-Achsenabschnitt ist (der Funktionswert bei x = 0). Ihr Graph ist eine Gerade. Ist k > 0, ist die Funktion steigend; ist k < 0, ist sie fallend; ist k = 0, ist der Graph eine zur x-Achse parallele Gerade (konstante Funktion). Die Nullstelle der Funktion ist der Wert von x, für den y = 0 gilt, ermittelt aus der Gleichung kx + n = 0.", "fr": "<b>Une fonction linéaire (affine)</b> est une fonction de la forme y = kx + n, où k est le coefficient directeur (la pente) et n l'ordonnée à l'origine (la valeur de la fonction pour x = 0). Son graphique est une droite. Si k > 0, la fonction est croissante ; si k < 0, elle est décroissante ; si k = 0, le graphique est une droite parallèle à l'axe des x (fonction constante). Le zéro de la fonction est la valeur de x pour laquelle y = 0, obtenue à partir de l'équation kx + n = 0.", "es": "<b>Una función lineal</b> es una función de la forma y = kx + n, donde k es el coeficiente de pendiente y n es la ordenada en el origen (el valor de la función para x = 0). Su gráfica es una línea recta. Si k > 0, la función es creciente; si k < 0, es decreciente; si k = 0, la gráfica es una recta paralela al eje x (función constante). El cero de la función es el valor de x para el cual y = 0, que se obtiene de la ecuación kx + n = 0.", "it": "<b>Una funzione lineare</b> è una funzione della forma y = kx + n, dove k è il coefficiente angolare (la pendenza) e n è l'intercetta sull'asse y (il valore della funzione per x = 0). Il suo grafico è una retta. Se k > 0, la funzione è crescente; se k < 0, è decrescente; se k = 0, il grafico è una retta parallela all'asse x (funzione costante). Lo zero della funzione è il valore di x per cui y = 0, ottenuto dall'equazione kx + n = 0.", "ru": "<b>Линейная функция</b> — это функция вида y = kx + n, где k — угловой коэффициент (наклон), а n — значение функции при x = 0 (точка пересечения с осью y). Её график — прямая линия. Если k > 0, функция возрастает; если k < 0, функция убывает; если k = 0, график — прямая, параллельная оси x (постоянная функция). Нуль функции — это значение x, при котором y = 0, находится из уравнения kx + n = 0.", "pt": "<b>Uma função linear</b> é uma função da forma y = kx + n, onde k é o coeficiente angular (inclinação) e n é o coeficiente linear (o valor da função para x = 0). O seu gráfico é uma reta. Se k > 0, a função é crescente; se k < 0, é decrescente; se k = 0, o gráfico é uma reta paralela ao eixo x (função constante). O zero da função é o valor de x para o qual y = 0, obtido da equação kx + n = 0."}, "formulas": [{"sr": "y = kx + n", "en": "y = kx + n", "de": "y = kx + n", "fr": "y = kx + n", "es": "y = kx + n", "it": "y = kx + n", "ru": "y = kx + n", "pt": "y = kx + n"}, {"sr": "k = (y₂ − y₁) / (x₂ − x₁)", "en": "k = (y₂ − y₁) / (x₂ − x₁)", "de": "k = (y₂ − y₁) / (x₂ − x₁)", "fr": "k = (y₂ − y₁) / (x₂ − x₁)", "es": "k = (y₂ − y₁) / (x₂ − x₁)", "it": "k = (y₂ − y₁) / (x₂ − x₁)", "ru": "k = (y₂ − y₁) / (x₂ − x₁)", "pt": "k = (y₂ − y₁) / (x₂ − x₁)"}, {"sr": "Nula funkcije: x = −n / k", "en": "Zero of the function: x = −n / k", "de": "Nullstelle der Funktion: x = −n / k", "fr": "Zéro de la fonction : x = −n / k", "es": "Cero de la función: x = −n / k", "it": "Zero della funzione: x = −n / k", "ru": "Нуль функции: x = −n / k", "pt": "Zero da função: x = −n / k"}], "remember": {"sr": "Dve linearne funkcije su paralelne ako imaju isti koeficijent k, a različit n.", "en": "Two linear functions are parallel if they have the same slope k, but different n.", "de": "Zwei lineare Funktionen sind parallel, wenn sie denselben Koeffizienten k, aber unterschiedliches n haben.", "fr": "Deux fonctions linéaires sont parallèles si elles ont le même coefficient k, mais un n différent.", "es": "Dos funciones lineales son paralelas si tienen el mismo coeficiente k, pero distinto n.", "it": "Due funzioni lineari sono parallele se hanno lo stesso coefficiente k, ma n diverso.", "ru": "Две линейные функции параллельны, если у них одинаковый коэффициент k, но разные n.", "pt": "Duas funções lineares são paralelas se tiverem o mesmo coeficiente k, mas n diferente."}, "problem": {"statement": {"sr": "Odredi jednačinu linearne funkcije čiji grafik prolazi kroz tačke A(1, 3) i B(3, 7).", "en": "Determine the equation of the linear function whose graph passes through the points A(1, 3) and B(3, 7).", "de": "Bestimme die Gleichung der linearen Funktion, deren Graph durch die Punkte A(1, 3) und B(3, 7) verläuft.", "fr": "Détermine l'équation de la fonction linéaire dont le graphique passe par les points A(1, 3) et B(3, 7).", "es": "Determina la ecuación de la función lineal cuya gráfica pasa por los puntos A(1, 3) y B(3, 7).", "it": "Determina l'equazione della funzione lineare il cui grafico passa per i punti A(1, 3) e B(3, 7).", "ru": "Найди уравнение линейной функции, график которой проходит через точки A(1, 3) и B(3, 7).", "pt": "Determine a equação da função linear cujo gráfico passa pelos pontos A(1, 3) e B(3, 7)."}, "steps": [{"sr": "k = (7 − 3) / (3 − 1) = 4/2 = 2", "en": "k = (7 − 3) / (3 − 1) = 4/2 = 2", "de": "k = (7 − 3) / (3 − 1) = 4/2 = 2", "fr": "k = (7 − 3) / (3 − 1) = 4/2 = 2", "es": "k = (7 − 3) / (3 − 1) = 4/2 = 2", "it": "k = (7 − 3) / (3 − 1) = 4/2 = 2", "ru": "k = (7 − 3) / (3 − 1) = 4/2 = 2", "pt": "k = (7 − 3) / (3 − 1) = 4/2 = 2"}, {"sr": "Iz y = kx + n i tačke A(1,3): 3 = 2·1 + n, pa je n = 1.", "en": "From y = kx + n and point A(1,3): 3 = 2·1 + n, so n = 1.", "de": "Aus y = kx + n und Punkt A(1,3): 3 = 2·1 + n, also n = 1.", "fr": "À partir de y = kx + n et du point A(1,3) : 3 = 2·1 + n, donc n = 1.", "es": "A partir de y = kx + n y el punto A(1,3): 3 = 2·1 + n, por lo tanto n = 1.", "it": "Da y = kx + n e dal punto A(1,3): 3 = 2·1 + n, quindi n = 1.", "ru": "Из y = kx + n и точки A(1,3): 3 = 2·1 + n, значит n = 1.", "pt": "A partir de y = kx + n e do ponto A(1,3): 3 = 2·1 + n, portanto n = 1."}, {"sr": "Tražena jednačina je y = 2x + 1.", "en": "The required equation is y = 2x + 1.", "de": "Die gesuchte Gleichung lautet y = 2x + 1.", "fr": "L'équation recherchée est y = 2x + 1.", "es": "La ecuación buscada es y = 2x + 1.", "it": "L'equazione cercata è y = 2x + 1.", "ru": "Искомое уравнение: y = 2x + 1.", "pt": "A equação procurada é y = 2x + 1."}]}}, {"name": {"sr": "Sistemi linearnih jednačina", "en": "Systems of linear equations", "de": "Lineare Gleichungssysteme", "fr": "Systèmes d'équations linéaires", "es": "Sistemas de ecuaciones lineales", "it": "Sistemi di equazioni lineari", "ru": "Системы линейных уравнений", "pt": "Sistemas de equações lineares"}, "theory": {"sr": "<b>Sistem od dve linearne jednačine sa dve nepoznate</b> rešava se najčešće metodom zamene ili metodom suprotnih koeficijenata (eliminacije). Kod metode zamene, iz jedne jednačine izrazimo jednu nepoznatu i zamenimo je u drugu jednačinu. Kod metode eliminacije, jednačine množimo pogodnim brojevima tako da se sabiranjem ili oduzimanjem jedna nepoznata poništi. Rešenje sistema je uređeni par (x, y) koji zadovoljava obe jednačine istovremeno, a geometrijski predstavlja presek dveju pravih.", "en": "<b>A system of two linear equations with two unknowns</b> is most often solved by the substitution method or the elimination method (opposite coefficients). In the substitution method, one unknown is expressed from one equation and substituted into the other. In the elimination method, the equations are multiplied by suitable numbers so that adding or subtracting them cancels one unknown. The solution of the system is an ordered pair (x, y) that satisfies both equations simultaneously, and geometrically represents the intersection of two lines.", "de": "<b>Ein System aus zwei linearen Gleichungen mit zwei Unbekannten</b> löst man meist durch Einsetzungsverfahren oder Additionsverfahren (Eliminationsverfahren). Beim Einsetzungsverfahren wird aus einer Gleichung eine Unbekannte ausgedrückt und in die andere eingesetzt. Beim Additionsverfahren werden die Gleichungen mit passenden Zahlen multipliziert, sodass beim Addieren oder Subtrahieren eine Unbekannte wegfällt. Die Lösung des Systems ist ein geordnetes Paar (x, y), das beide Gleichungen gleichzeitig erfüllt und geometrisch den Schnittpunkt zweier Geraden darstellt.", "fr": "<b>Un système de deux équations linéaires à deux inconnues</b> se résout le plus souvent par la méthode de substitution ou la méthode de combinaison (élimination). Dans la méthode de substitution, on exprime une inconnue à partir d'une équation et on la remplace dans l'autre. Dans la méthode d'élimination, on multiplie les équations par des nombres appropriés afin qu'en les additionnant ou les soustrayant, une inconnue disparaisse. La solution du système est un couple ordonné (x, y) qui satisfait les deux équations simultanément, et représente géométriquement le point d'intersection de deux droites.", "es": "<b>Un sistema de dos ecuaciones lineales con dos incógnitas</b> se resuelve generalmente por el método de sustitución o el método de eliminación (coeficientes opuestos). En el método de sustitución, se despeja una incógnita de una ecuación y se sustituye en la otra. En el método de eliminación, las ecuaciones se multiplican por números adecuados para que, al sumarlas o restarlas, una incógnita se elimine. La solución del sistema es un par ordenado (x, y) que satisface ambas ecuaciones simultáneamente, y representa geométricamente la intersección de dos rectas.", "it": "<b>Un sistema di due equazioni lineari in due incognite</b> si risolve solitamente con il metodo di sostituzione o il metodo di eliminazione (coefficienti opposti). Nel metodo di sostituzione, si ricava un'incognita da un'equazione e la si sostituisce nell'altra. Nel metodo di eliminazione, le equazioni si moltiplicano per numeri opportuni in modo che, sommandole o sottraendole, un'incognita si annulli. La soluzione del sistema è una coppia ordinata (x, y) che soddisfa entrambe le equazioni contemporaneamente, e rappresenta geometricamente l'intersezione di due rette.", "ru": "<b>Система из двух линейных уравнений с двумя неизвестными</b> решается чаще всего методом подстановки или методом сложения (исключения). В методе подстановки одна неизвестная выражается из одного уравнения и подставляется в другое. В методе сложения уравнения умножаются на подходящие числа так, чтобы при сложении или вычитании одна неизвестная исчезла. Решение системы — это упорядоченная пара (x, y), удовлетворяющая обоим уравнениям одновременно, что геометрически представляет собой точку пересечения двух прямых.", "pt": "<b>Um sistema de duas equações lineares com duas incógnitas</b> resolve-se geralmente pelo método de substituição ou pelo método de eliminação (coeficientes opostos). No método de substituição, isola-se uma incógnita numa equação e substitui-se na outra. No método de eliminação, as equações são multiplicadas por números adequados para que, ao somá-las ou subtraí-las, uma incógnita se anule. A solução do sistema é um par ordenado (x, y) que satisfaz ambas as equações simultaneamente, representando geometricamente a interseção de duas retas."}, "formulas": [{"sr": "ax + by = c, dx + ey = f", "en": "ax + by = c, dx + ey = f", "de": "ax + by = c, dx + ey = f", "fr": "ax + by = c, dx + ey = f", "es": "ax + by = c, dx + ey = f", "it": "ax + by = c, dx + ey = f", "ru": "ax + by = c, dx + ey = f", "pt": "ax + by = c, dx + ey = f"}, {"sr": "Sabiranjem/oduzimanjem jednačina eliminiše se jedna nepoznata", "en": "Adding/subtracting the equations eliminates one unknown", "de": "Durch Addition/Subtraktion der Gleichungen wird eine Unbekannte eliminiert", "fr": "En additionnant/soustrayant les équations, une inconnue est éliminée", "es": "Al sumar/restar las ecuaciones se elimina una incógnita", "it": "Sommando/sottraendo le equazioni si elimina un'incognita", "ru": "При сложении/вычитании уравнений одна неизвестная исключается", "pt": "Ao somar/subtrair as equações, uma incógnita é eliminada"}], "remember": {"sr": "Uvek proveri rešenje uvrštavanjem dobijenih vrednosti x i y u OBE polazne jednačine.", "en": "Always check the solution by substituting the obtained values of x and y into BOTH original equations.", "de": "Überprüfe die Lösung immer, indem du die erhaltenen Werte von x und y in BEIDE Ausgangsgleichungen einsetzt.", "fr": "Vérifie toujours la solution en substituant les valeurs obtenues de x et y dans LES DEUX équations de départ.", "es": "Comprueba siempre la solución sustituyendo los valores obtenidos de x e y en AMBAS ecuaciones originales.", "it": "Verifica sempre la soluzione sostituendo i valori ottenuti di x e y in ENTRAMBE le equazioni di partenza.", "ru": "Всегда проверяй решение, подставляя найденные значения x и y в ОБА исходных уравнения.", "pt": "Verifique sempre a solução substituindo os valores obtidos de x e y em AMBAS as equações originais."}, "problem": {"statement": {"sr": "Reši sistem jednačina: x + y = 10, 2x − y = 5.", "en": "Solve the system of equations: x + y = 10, 2x − y = 5.", "de": "Löse das Gleichungssystem: x + y = 10, 2x − y = 5.", "fr": "Résous le système d'équations : x + y = 10, 2x − y = 5.", "es": "Resuelve el sistema de ecuaciones: x + y = 10, 2x − y = 5.", "it": "Risolvi il sistema di equazioni: x + y = 10, 2x − y = 5.", "ru": "Реши систему уравнений: x + y = 10, 2x − y = 5.", "pt": "Resolva o sistema de equações: x + y = 10, 2x − y = 5."}, "steps": [{"sr": "Sabiranjem jednačina: (x+y) + (2x−y) = 10+5 → 3x = 15 → x = 5.", "en": "Adding the equations: (x+y) + (2x−y) = 10+5 → 3x = 15 → x = 5.", "de": "Addition der Gleichungen: (x+y) + (2x−y) = 10+5 → 3x = 15 → x = 5.", "fr": "En additionnant les équations : (x+y) + (2x−y) = 10+5 → 3x = 15 → x = 5.", "es": "Sumando las ecuaciones: (x+y) + (2x−y) = 10+5 → 3x = 15 → x = 5.", "it": "Sommando le equazioni: (x+y) + (2x−y) = 10+5 → 3x = 15 → x = 5.", "ru": "Складывая уравнения: (x+y) + (2x−y) = 10+5 → 3x = 15 → x = 5.", "pt": "Somando as equações: (x+y) + (2x−y) = 10+5 → 3x = 15 → x = 5."}, {"sr": "Iz x + y = 10 sledi y = 10 − 5 = 5.", "en": "From x + y = 10 it follows that y = 10 − 5 = 5.", "de": "Aus x + y = 10 folgt y = 10 − 5 = 5.", "fr": "De x + y = 10, on tire y = 10 − 5 = 5.", "es": "De x + y = 10 se obtiene y = 10 − 5 = 5.", "it": "Da x + y = 10 segue y = 10 − 5 = 5.", "ru": "Из x + y = 10 следует y = 10 − 5 = 5.", "pt": "De x + y = 10 obtém-se y = 10 − 5 = 5."}, {"sr": "Rešenje je (x, y) = (5, 5); provera: 2·5 − 5 = 5. ✓", "en": "The solution is (x, y) = (5, 5); check: 2·5 − 5 = 5. ✓", "de": "Die Lösung ist (x, y) = (5, 5); Probe: 2·5 − 5 = 5. ✓", "fr": "La solution est (x, y) = (5, 5) ; vérification : 2·5 − 5 = 5. ✓", "es": "La solución es (x, y) = (5, 5); comprobación: 2·5 − 5 = 5. ✓", "it": "La soluzione è (x, y) = (5, 5); verifica: 2·5 − 5 = 5. ✓", "ru": "Решение: (x, y) = (5, 5); проверка: 2·5 − 5 = 5. ✓", "pt": "A solução é (x, y) = (5, 5); verificação: 2·5 − 5 = 5. ✓"}]}}, {"name": {"sr": "Sličnost trouglova", "en": "Similarity of triangles", "de": "Ähnlichkeit von Dreiecken", "fr": "Similitude des triangles", "es": "Semejanza de triángulos", "it": "Similitudine dei triangoli", "ru": "Подобие треугольников", "pt": "Semelhança de triângulos"}, "theory": {"sr": "<b>Dva trougla su slična</b> ako imaju jednake odgovarajuće uglove, a odgovarajuće stranice proporcionalne. Koeficijent sličnosti k je količnik odgovarajućih stranica. Osnovni stavovi sličnosti su: AA (dva jednaka ugla), SSS (sve tri stranice proporcionalne) i SAS (dve stranice proporcionalne i ugao između njih jednak). Ako je k koeficijent sličnosti, obim sličnih trouglova je u razmeri k, a površina u razmeri k².", "en": "<b>Two triangles are similar</b> if their corresponding angles are equal and their corresponding sides are proportional. The similarity ratio k is the quotient of corresponding sides. The basic similarity criteria are: AA (two equal angles), SSS (all three sides proportional), and SAS (two sides proportional and the included angle equal). If k is the similarity ratio, the perimeters of similar triangles are in ratio k, and the areas are in ratio k².", "de": "<b>Zwei Dreiecke sind ähnlich</b>, wenn ihre entsprechenden Winkel gleich und ihre entsprechenden Seiten proportional sind. Der Ähnlichkeitsfaktor k ist der Quotient entsprechender Seiten. Die grundlegenden Ähnlichkeitssätze sind: WW (zwei gleiche Winkel), SSS (alle drei Seiten proportional) und SWS (zwei Seiten proportional und der eingeschlossene Winkel gleich). Ist k der Ähnlichkeitsfaktor, stehen die Umfänge ähnlicher Dreiecke im Verhältnis k, und die Flächen im Verhältnis k².", "fr": "<b>Deux triangles sont semblables</b> si leurs angles correspondants sont égaux et leurs côtés correspondants proportionnels. Le rapport de similitude k est le quotient des côtés correspondants. Les critères de similitude de base sont : AA (deux angles égaux), SSS (les trois côtés proportionnels) et SAS (deux côtés proportionnels et l'angle compris égal). Si k est le rapport de similitude, les périmètres des triangles semblables sont dans le rapport k, et les aires dans le rapport k².", "es": "<b>Dos triángulos son semejantes</b> si sus ángulos correspondientes son iguales y sus lados correspondientes son proporcionales. La razón de semejanza k es el cociente de los lados correspondientes. Los criterios básicos de semejanza son: AA (dos ángulos iguales), LLL (los tres lados proporcionales) y LAL (dos lados proporcionales y el ángulo comprendido igual). Si k es la razón de semejanza, los perímetros de los triángulos semejantes están en razón k, y las áreas en razón k².", "it": "<b>Due triangoli sono simili</b> se i loro angoli corrispondenti sono uguali e i loro lati corrispondenti sono proporzionali. Il rapporto di similitudine k è il quoziente dei lati corrispondenti. I criteri base di similitudine sono: AA (due angoli uguali), LLL (tutti e tre i lati proporzionali) e LAL (due lati proporzionali e l'angolo compreso uguale). Se k è il rapporto di similitudine, i perimetri dei triangoli simili sono in rapporto k, e le aree in rapporto k².", "ru": "<b>Два треугольника подобны</b>, если их соответствующие углы равны, а соответствующие стороны пропорциональны. Коэффициент подобия k — это отношение соответствующих сторон. Основные признаки подобия: АА (два равных угла), ССС (все три стороны пропорциональны) и СУС (две стороны пропорциональны, а угол между ними равен). Если k — коэффициент подобия, периметры подобных треугольников относятся как k, а площади — как k².", "pt": "<b>Dois triângulos são semelhantes</b> se os seus ângulos correspondentes são iguais e os seus lados correspondentes são proporcionais. A razão de semelhança k é o quociente dos lados correspondentes. Os critérios básicos de semelhança são: AA (dois ângulos iguais), LLL (os três lados proporcionais) e LAL (dois lados proporcionais e o ângulo compreendido igual). Se k é a razão de semelhança, os perímetros dos triângulos semelhantes estão na razão k, e as áreas na razão k²."}, "formulas": [{"sr": "a/a' = b/b' = c/c' = k", "en": "a/a' = b/b' = c/c' = k", "de": "a/a' = b/b' = c/c' = k", "fr": "a/a' = b/b' = c/c' = k", "es": "a/a' = b/b' = c/c' = k", "it": "a/a' = b/b' = c/c' = k", "ru": "a/a' = b/b' = c/c' = k", "pt": "a/a' = b/b' = c/c' = k"}, {"sr": "P / P' = k²", "en": "P / P' = k²", "de": "P / P' = k²", "fr": "P / P' = k²", "es": "P / P' = k²", "it": "P / P' = k²", "ru": "P / P' = k²", "pt": "P / P' = k²"}], "remember": {"sr": "Talesova teorema: prava paralelna jednoj stranici trougla seče druge dve stranice u proporcionalnim odsečcima.", "en": "Thales' theorem: a line parallel to one side of a triangle intersects the other two sides in proportional segments.", "de": "Der Strahlensatz: Eine Gerade, die parallel zu einer Dreiecksseite verläuft, schneidet die anderen beiden Seiten in proportionalen Abschnitten.", "fr": "Théorème de Thalès : une droite parallèle à un côté d'un triangle coupe les deux autres côtés en segments proportionnels.", "es": "Teorema de Tales: una recta paralela a un lado de un triángulo corta a los otros dos lados en segmentos proporcionales.", "it": "Teorema di Talete: una retta parallela a un lato di un triangolo interseca gli altri due lati in segmenti proporzionali.", "ru": "Теорема Фалеса: прямая, параллельная одной стороне треугольника, пересекает две другие стороны в пропорциональных отрезках.", "pt": "Teorema de Tales: uma reta paralela a um lado de um triângulo corta os outros dois lados em segmentos proporcionais."}, "problem": {"statement": {"sr": "Trouglovi ABC i A'B'C' su slični sa koeficijentom sličnosti k = 3. Ako je stranica a = 4 cm, kolika je odgovarajuća stranica a' i koliki je odnos njihovih površina?", "en": "Triangles ABC and A'B'C' are similar with similarity ratio k = 3. If side a = 4 cm, what is the corresponding side a', and what is the ratio of their areas?", "de": "Die Dreiecke ABC und A'B'C' sind ähnlich mit dem Ähnlichkeitsfaktor k = 3. Wenn die Seite a = 4 cm ist, wie groß ist die entsprechende Seite a', und wie groß ist das Verhältnis ihrer Flächen?", "fr": "Les triangles ABC et A'B'C' sont semblables avec un rapport de similitude k = 3. Si le côté a = 4 cm, quel est le côté correspondant a', et quel est le rapport de leurs aires ?", "es": "Los triángulos ABC y A'B'C' son semejantes con razón de semejanza k = 3. Si el lado a = 4 cm, ¿cuál es el lado correspondiente a', y cuál es la razón de sus áreas?", "it": "I triangoli ABC e A'B'C' sono simili con rapporto di similitudine k = 3. Se il lato a = 4 cm, quanto vale il lato corrispondente a', e qual è il rapporto tra le loro aree?", "ru": "Треугольники ABC и A'B'C' подобны с коэффициентом подобия k = 3. Если сторона a = 4 см, чему равна соответствующая сторона a' и каково отношение их площадей?", "pt": "Os triângulos ABC e A'B'C' são semelhantes com razão de semelhança k = 3. Se o lado a = 4 cm, qual é o lado correspondente a', e qual é a razão entre as suas áreas?"}, "steps": [{"sr": "a' = k · a = 3 · 4 cm = 12 cm.", "en": "a' = k · a = 3 · 4 cm = 12 cm.", "de": "a' = k · a = 3 · 4 cm = 12 cm.", "fr": "a' = k · a = 3 · 4 cm = 12 cm.", "es": "a' = k · a = 3 · 4 cm = 12 cm.", "it": "a' = k · a = 3 · 4 cm = 12 cm.", "ru": "a' = k · a = 3 · 4 см = 12 см.", "pt": "a' = k · a = 3 · 4 cm = 12 cm."}, {"sr": "Odnos površina je k² = 3² = 9, tj. P' je 9 puta veća od P.", "en": "The ratio of the areas is k² = 3² = 9, i.e., P' is 9 times larger than P.", "de": "Das Flächenverhältnis ist k² = 3² = 9, d. h. P' ist 9-mal so groß wie P.", "fr": "Le rapport des aires est k² = 3² = 9, c'est-à-dire que P' est 9 fois plus grande que P.", "es": "La razón de las áreas es k² = 3² = 9, es decir, P' es 9 veces mayor que P.", "it": "Il rapporto tra le aree è k² = 3² = 9, cioè P' è 9 volte più grande di P.", "ru": "Отношение площадей равно k² = 3² = 9, то есть P' в 9 раз больше P.", "pt": "A razão entre as áreas é k² = 3² = 9, ou seja, P' é 9 vezes maior que P."}]}}, {"name": {"sr": "Prizma i piramida", "en": "Prism and pyramid", "de": "Prisma und Pyramide", "fr": "Prisme et pyramide", "es": "Prisma y pirámide", "it": "Prisma e piramide", "ru": "Призма и пирамида", "pt": "Prisma e pirâmide"}, "theory": {"sr": "<b>Prizma</b> je telo omeđeno sa dve podudarne i paralelne osnove i bočnim stranama koje su paralelogrami; kod prave prizme bočne strane su pravougaonici. <b>Piramida</b> ima jednu osnovu (mnogougao) i bočne strane koje su trouglovi sa zajedničkim temenom (vrhom). Zapremina prizme jednaka je proizvodu površine osnove i visine, dok je zapremina piramide tri puta manja od zapremine prizme sa istom osnovom i visinom. Površina oba tela računa se kao zbir površine osnove (osnova) i površine omotača (bočnih strana).", "en": "<b>A prism</b> is a solid bounded by two congruent, parallel bases and lateral faces that are parallelograms; in a right prism the lateral faces are rectangles. <b>A pyramid</b> has one base (a polygon) and lateral faces that are triangles meeting at a common vertex (apex). The volume of a prism equals the product of the base area and the height, while the volume of a pyramid is three times smaller than the volume of a prism with the same base and height. The surface area of both solids is calculated as the sum of the base area(s) and the lateral surface area.", "de": "<b>Ein Prisma</b> ist ein Körper, der von zwei kongruenten, parallelen Grundflächen und Seitenflächen begrenzt wird, die Parallelogramme sind; bei einem geraden Prisma sind die Seitenflächen Rechtecke. <b>Eine Pyramide</b> hat eine Grundfläche (ein Vieleck) und Seitenflächen, die Dreiecke mit einer gemeinsamen Spitze sind. Das Volumen eines Prismas ist gleich dem Produkt aus Grundfläche und Höhe, während das Volumen einer Pyramide dreimal kleiner ist als das Volumen eines Prismas mit gleicher Grundfläche und Höhe. Die Oberfläche beider Körper wird als Summe der Grundfläche(n) und der Mantelfläche berechnet.", "fr": "<b>Un prisme</b> est un solide délimité par deux bases congruentes et parallèles et par des faces latérales qui sont des parallélogrammes ; dans un prisme droit, les faces latérales sont des rectangles. <b>Une pyramide</b> a une base (un polygone) et des faces latérales qui sont des triangles ayant un sommet commun. Le volume d'un prisme est égal au produit de l'aire de la base par la hauteur, tandis que le volume d'une pyramide est trois fois plus petit que celui d'un prisme de même base et même hauteur. L'aire totale des deux solides se calcule comme la somme de l'aire de la base (des bases) et de l'aire latérale.", "es": "<b>Un prisma</b> es un cuerpo limitado por dos bases congruentes y paralelas y por caras laterales que son paralelogramos; en un prisma recto, las caras laterales son rectángulos. <b>Una pirámide</b> tiene una base (un polígono) y caras laterales que son triángulos con un vértice común. El volumen de un prisma es igual al producto del área de la base por la altura, mientras que el volumen de una pirámide es tres veces menor que el de un prisma con la misma base y altura. El área total de ambos cuerpos se calcula como la suma del área de la base (bases) y el área lateral.", "it": "<b>Un prisma</b> è un solido delimitato da due basi congruenti e parallele e da facce laterali che sono parallelogrammi; in un prisma retto le facce laterali sono rettangoli. <b>Una piramide</b> ha una base (un poligono) e facce laterali che sono triangoli con un vertice comune. Il volume di un prisma è uguale al prodotto dell'area di base per l'altezza, mentre il volume di una piramide è tre volte minore di quello di un prisma con la stessa base e altezza. La superficie totale di entrambi i solidi si calcola come somma dell'area di base e dell'area laterale.", "ru": "<b>Призма</b> — это тело, ограниченное двумя равными и параллельными основаниями и боковыми гранями, являющимися параллелограммами; у прямой призмы боковые грани — прямоугольники. <b>Пирамида</b> имеет одно основание (многоугольник) и боковые грани в виде треугольников с общей вершиной. Объём призмы равен произведению площади основания на высоту, а объём пирамиды в три раза меньше объёма призмы с тем же основанием и высотой. Площадь поверхности обоих тел вычисляется как сумма площади основания(й) и площади боковой поверхности.", "pt": "<b>Um prisma</b> é um sólido limitado por duas bases congruentes e paralelas e por faces laterais que são paralelogramos; num prisma reto, as faces laterais são retângulos. <b>Uma pirâmide</b> tem uma base (um polígono) e faces laterais que são triângulos com um vértice comum. O volume de um prisma é igual ao produto da área da base pela altura, enquanto o volume de uma pirâmide é três vezes menor que o de um prisma com a mesma base e altura. A área total de ambos os sólidos calcula-se como a soma da área da base e da área lateral."}, "formulas": [{"sr": "V = B · H (prizma)", "en": "V = B · H (prism)", "de": "V = B · H (Prisma)", "fr": "V = B · H (prisme)", "es": "V = B · H (prisma)", "it": "V = B · H (prisma)", "ru": "V = B · H (призма)", "pt": "V = B · H (prisma)"}, {"sr": "V = (B · H) / 3 (piramida)", "en": "V = (B · H) / 3 (pyramid)", "de": "V = (B · H) / 3 (Pyramide)", "fr": "V = (B · H) / 3 (pyramide)", "es": "V = (B · H) / 3 (pirámide)", "it": "V = (B · H) / 3 (piramide)", "ru": "V = (B · H) / 3 (пирамида)", "pt": "V = (B · H) / 3 (pirâmide)"}, {"sr": "P = 2B + M (P-površina, B-osnova, M-omotač)", "en": "P = 2B + M (P-surface area, B-base, M-lateral area)", "de": "P = 2B + M (P-Oberfläche, B-Grundfläche, M-Mantelfläche)", "fr": "P = 2B + M (P-aire totale, B-aire de la base, M-aire latérale)", "es": "P = 2B + M (P-área total, B-área de la base, M-área lateral)", "it": "P = 2B + M (P-superficie totale, B-area di base, M-area laterale)", "ru": "P = 2B + M (P-площадь поверхности, B-площадь основания, M-площадь боковой поверхности)", "pt": "P = 2B + M (P-área total, B-área da base, M-área lateral)"}], "remember": {"sr": "Zapremina piramide je uvek tri puta manja od zapremine prizme sa istom osnovom i visinom.", "en": "The volume of a pyramid is always three times smaller than the volume of a prism with the same base and height.", "de": "Das Volumen einer Pyramide ist immer dreimal kleiner als das Volumen eines Prismas mit gleicher Grundfläche und Höhe.", "fr": "Le volume d'une pyramide est toujours trois fois plus petit que celui d'un prisme de même base et même hauteur.", "es": "El volumen de una pirámide siempre es tres veces menor que el de un prisma con la misma base y altura.", "it": "Il volume di una piramide è sempre tre volte minore di quello di un prisma con la stessa base e altezza.", "ru": "Объём пирамиды всегда в три раза меньше объёма призмы с тем же основанием и высотой.", "pt": "O volume de uma pirâmide é sempre três vezes menor que o de um prisma com a mesma base e altura."}, "problem": {"statement": {"sr": "Data je pravilna četvorostrana prizma čija je osnovna ivica a = 5 cm, a visina prizme H = 10 cm. Izračunaj zapreminu prizme.", "en": "A regular quadrilateral prism is given, with base edge a = 5 cm and prism height H = 10 cm. Calculate the volume of the prism.", "de": "Gegeben ist ein reguläres vierseitiges Prisma mit Grundkante a = 5 cm und Prismenhöhe H = 10 cm. Berechne das Volumen des Prismas.", "fr": "On donne un prisme régulier à base carrée dont l'arête de base est a = 5 cm et la hauteur du prisme H = 10 cm. Calcule le volume du prisme.", "es": "Se da un prisma regular de base cuadrada con arista de la base a = 5 cm y altura del prisma H = 10 cm. Calcula el volumen del prisma.", "it": "È dato un prisma regolare a base quadrata con spigolo di base a = 5 cm e altezza del prisma H = 10 cm. Calcola il volume del prisma.", "ru": "Дана правильная четырёхугольная призма с ребром основания a = 5 см и высотой призмы H = 10 см. Вычисли объём призмы.", "pt": "É dado um prisma regular de base quadrada com aresta da base a = 5 cm e altura do prisma H = 10 cm. Calcule o volume do prisma."}, "steps": [{"sr": "Osnova je kvadrat: B = a² = 5² = 25 cm².", "en": "The base is a square: B = a² = 5² = 25 cm².", "de": "Die Grundfläche ist ein Quadrat: B = a² = 5² = 25 cm².", "fr": "La base est un carré : B = a² = 5² = 25 cm².", "es": "La base es un cuadrado: B = a² = 5² = 25 cm².", "it": "La base è un quadrato: B = a² = 5² = 25 cm².", "ru": "Основание — квадрат: B = a² = 5² = 25 см².", "pt": "A base é um quadrado: B = a² = 5² = 25 cm²."}, {"sr": "V = B · H = 25 · 10 = 250 cm³.", "en": "V = B · H = 25 · 10 = 250 cm³.", "de": "V = B · H = 25 · 10 = 250 cm³.", "fr": "V = B · H = 25 · 10 = 250 cm³.", "es": "V = B · H = 25 · 10 = 250 cm³.", "it": "V = B · H = 25 · 10 = 250 cm³.", "ru": "V = B · H = 25 · 10 = 250 см³.", "pt": "V = B · H = 25 · 10 = 250 cm³."}, {"sr": "Zapremina prizme je 250 cm³.", "en": "The volume of the prism is 250 cm³.", "de": "Das Volumen des Prismas beträgt 250 cm³.", "fr": "Le volume du prisme est de 250 cm³.", "es": "El volumen del prisma es 250 cm³.", "it": "Il volume del prisma è 250 cm³.", "ru": "Объём призмы равен 250 см³.", "pt": "O volume do prisma é 250 cm³."}]}}, {"name": {"sr": "Valjak, kupa i lopta", "en": "Cylinder, cone and sphere", "de": "Zylinder, Kegel und Kugel", "fr": "Cylindre, cône et sphère", "es": "Cilindro, cono y esfera", "it": "Cilindro, cono e sfera", "ru": "Цилиндр, конус и шар", "pt": "Cilindro, cone e esfera"}, "theory": {"sr": "<b>Obrtna (rotaciona) tela</b> nastaju obrtanjem ravne figure oko ose. Valjak nastaje obrtanjem pravougaonika oko jedne stranice, kupa obrtanjem pravouglog trougla oko jedne katete, a lopta obrtanjem polukruga oko prečnika. Osnovni elementi su poluprečnik osnove r, visina H i, kod kupe, izvodnica l (l² = r² + H²). Lopta nema osnovu ni izvodnicu — ograničena je jednom zakrivljenom površi na kojoj su sve tačke jednako udaljene od centra (ta udaljenost je poluprečnik r).", "en": "<b>Solids of revolution</b> are formed by rotating a plane figure around an axis. A cylinder is formed by rotating a rectangle around one side, a cone by rotating a right triangle around one leg, and a sphere by rotating a semicircle around its diameter. The basic elements are the base radius r, the height H, and, for the cone, the slant height l (l² = r² + H²). A sphere has neither a base nor a slant height — it is bounded by a single curved surface on which every point is equally distant from the center (that distance is the radius r).", "de": "<b>Rotationskörper</b> entstehen durch Drehung einer ebenen Figur um eine Achse. Ein Zylinder entsteht durch Drehung eines Rechtecks um eine Seite, ein Kegel durch Drehung eines rechtwinkligen Dreiecks um eine Kathete, und eine Kugel durch Drehung eines Halbkreises um den Durchmesser. Die grundlegenden Elemente sind der Grundflächenradius r, die Höhe H und beim Kegel die Mantellinie l (l² = r² + H²). Eine Kugel hat weder eine Grundfläche noch eine Mantellinie — sie wird von einer einzigen gekrümmten Fläche begrenzt, auf der alle Punkte gleich weit vom Mittelpunkt entfernt sind (dieser Abstand ist der Radius r).", "fr": "<b>Les solides de révolution</b> sont obtenus en faisant tourner une figure plane autour d'un axe. Un cylindre est obtenu en faisant tourner un rectangle autour d'un côté, un cône en faisant tourner un triangle rectangle autour d'un côté de l'angle droit, et une sphère en faisant tourner un demi-cercle autour de son diamètre. Les éléments de base sont le rayon de la base r, la hauteur H et, pour le cône, l'apothème (génératrice) l (l² = r² + H²). Une sphère n'a ni base ni génératrice — elle est délimitée par une seule surface courbe dont tous les points sont à égale distance du centre (cette distance est le rayon r).", "es": "<b>Los cuerpos de revolución</b> se generan al girar una figura plana alrededor de un eje. Un cilindro se genera girando un rectángulo alrededor de un lado, un cono girando un triángulo rectángulo alrededor de un cateto, y una esfera girando un semicírculo alrededor del diámetro. Los elementos básicos son el radio de la base r, la altura H y, en el cono, la generatriz l (l² = r² + H²). La esfera no tiene base ni generatriz: está limitada por una única superficie curva en la que todos los puntos equidistan del centro (esa distancia es el radio r).", "it": "<b>I solidi di rotazione</b> si generano ruotando una figura piana attorno a un asse. Un cilindro si genera ruotando un rettangolo attorno a un lato, un cono ruotando un triangolo rettangolo attorno a un cateto, e una sfera ruotando un semicerchio attorno al diametro. Gli elementi fondamentali sono il raggio di base r, l'altezza H e, per il cono, l'apotema (generatrice) l (l² = r² + H²). La sfera non ha né base né generatrice — è delimitata da un'unica superficie curva in cui tutti i punti sono equidistanti dal centro (tale distanza è il raggio r).", "ru": "<b>Тела вращения</b> получаются вращением плоской фигуры вокруг оси. Цилиндр получается вращением прямоугольника вокруг одной стороны, конус — вращением прямоугольного треугольника вокруг одного катета, а шар — вращением полукруга вокруг диаметра. Основные элементы: радиус основания r, высота H и, для конуса, образующая l (l² = r² + H²). У шара нет ни основания, ни образующей — он ограничен единой изогнутой поверхностью, все точки которой равноудалены от центра (это расстояние — радиус r).", "pt": "<b>Os sólidos de revolução</b> formam-se ao girar uma figura plana em torno de um eixo. Um cilindro forma-se girando um retângulo em torno de um lado, um cone girando um triângulo retângulo em torno de um cateto, e uma esfera girando um semicírculo em torno do diâmetro. Os elementos básicos são o raio da base r, a altura H e, no cone, a geratriz l (l² = r² + H²). A esfera não tem base nem geratriz — é limitada por uma única superfície curva na qual todos os pontos estão à mesma distância do centro (essa distância é o raio r)."}, "formulas": [{"sr": "V = r²π · H (valjak)", "en": "V = r²π · H (cylinder)", "de": "V = r²π · H (Zylinder)", "fr": "V = r²π · H (cylindre)", "es": "V = r²π · H (cilindro)", "it": "V = r²π · H (cilindro)", "ru": "V = r²π · H (цилиндр)", "pt": "V = r²π · H (cilindro)"}, {"sr": "V = r²π · H / 3 (kupa)", "en": "V = r²π · H / 3 (cone)", "de": "V = r²π · H / 3 (Kegel)", "fr": "V = r²π · H / 3 (cône)", "es": "V = r²π · H / 3 (cono)", "it": "V = r²π · H / 3 (cono)", "ru": "V = r²π · H / 3 (конус)", "pt": "V = r²π · H / 3 (cone)"}, {"sr": "V = 4r³π / 3, P = 4r²π (lopta)", "en": "V = 4r³π / 3, P = 4r²π (sphere)", "de": "V = 4r³π / 3, P = 4r²π (Kugel)", "fr": "V = 4r³π / 3, P = 4r²π (sphère)", "es": "V = 4r³π / 3, P = 4r²π (esfera)", "it": "V = 4r³π / 3, P = 4r²π (sfera)", "ru": "V = 4r³π / 3, P = 4r²π (шар)", "pt": "V = 4r³π / 3, P = 4r²π (esfera)"}], "remember": {"sr": "Zapremina kupe je tri puta manja od zapremine valjka sa istim r i H — isto kao piramida i prizma.", "en": "The volume of a cone is three times smaller than the volume of a cylinder with the same r and H — just like a pyramid and a prism.", "de": "Das Volumen eines Kegels ist dreimal kleiner als das Volumen eines Zylinders mit gleichem r und H — genau wie bei Pyramide und Prisma.", "fr": "Le volume d'un cône est trois fois plus petit que celui d'un cylindre de même r et H — comme pour la pyramide et le prisme.", "es": "El volumen de un cono es tres veces menor que el de un cilindro con el mismo r y H, igual que la pirámide y el prisma.", "it": "Il volume di un cono è tre volte minore di quello di un cilindro con lo stesso r e H — proprio come la piramide e il prisma.", "ru": "Объём конуса в три раза меньше объёма цилиндра с теми же r и H — так же, как у пирамиды и призмы.", "pt": "O volume de um cone é três vezes menor que o de um cilindro com o mesmo r e H — tal como a pirâmide e o prisma."}, "problem": {"statement": {"sr": "Valjak ima poluprečnik osnove r = 3 cm i visinu H = 7 cm. Izračunaj zapreminu valjka (koristi π ≈ 3,14).", "en": "A cylinder has base radius r = 3 cm and height H = 7 cm. Calculate the volume of the cylinder (use π ≈ 3.14).", "de": "Ein Zylinder hat den Grundflächenradius r = 3 cm und die Höhe H = 7 cm. Berechne das Volumen des Zylinders (verwende π ≈ 3,14).", "fr": "Un cylindre a un rayon de base r = 3 cm et une hauteur H = 7 cm. Calcule le volume du cylindre (utilise π ≈ 3,14).", "es": "Un cilindro tiene radio de la base r = 3 cm y altura H = 7 cm. Calcula el volumen del cilindro (usa π ≈ 3,14).", "it": "Un cilindro ha raggio di base r = 3 cm e altezza H = 7 cm. Calcola il volume del cilindro (usa π ≈ 3,14).", "ru": "Цилиндр имеет радиус основания r = 3 см и высоту H = 7 см. Вычисли объём цилиндра (используй π ≈ 3,14).", "pt": "Um cilindro tem raio da base r = 3 cm e altura H = 7 cm. Calcule o volume do cilindro (use π ≈ 3,14)."}, "steps": [{"sr": "r² = 3² = 9", "en": "r² = 3² = 9", "de": "r² = 3² = 9", "fr": "r² = 3² = 9", "es": "r² = 3² = 9", "it": "r² = 3² = 9", "ru": "r² = 3² = 9", "pt": "r² = 3² = 9"}, {"sr": "V = r²π · H = 9 · 3,14 · 7 = 197,82 cm³.", "en": "V = r²π · H = 9 · 3.14 · 7 = 197.82 cm³.", "de": "V = r²π · H = 9 · 3,14 · 7 = 197,82 cm³.", "fr": "V = r²π · H = 9 · 3,14 · 7 = 197,82 cm³.", "es": "V = r²π · H = 9 · 3,14 · 7 = 197,82 cm³.", "it": "V = r²π · H = 9 · 3,14 · 7 = 197,82 cm³.", "ru": "V = r²π · H = 9 · 3,14 · 7 = 197,82 см³.", "pt": "V = r²π · H = 9 · 3,14 · 7 = 197,82 cm³."}, {"sr": "Zapremina valjka je približno 197,82 cm³.", "en": "The volume of the cylinder is approximately 197.82 cm³.", "de": "Das Volumen des Zylinders beträgt etwa 197,82 cm³.", "fr": "Le volume du cylindre est d'environ 197,82 cm³.", "es": "El volumen del cilindro es aproximadamente 197,82 cm³.", "it": "Il volume del cilindro è approssimativamente 197,82 cm³.", "ru": "Объём цилиндра приблизительно равен 197,82 см³.", "pt": "O volume do cilindro é aproximadamente 197,82 cm³."}]}}], "C": {"next": {"sr": "Dalje →", "en": "Next →", "de": "Weiter →", "fr": "Suivant →", "es": "Siguiente →", "it": "Avanti →", "ru": "Дальше →", "pt": "Seguinte →"}, "prev": {"sr": "← Nazad", "en": "← Back", "de": "← Zurück", "fr": "← Retour", "es": "← Atrás", "it": "← Indietro", "ru": "← Назад", "pt": "← Voltar"}, "finish": {"sr": "Završi 🎉", "en": "Finish 🎉", "de": "Fertig 🎉", "fr": "Terminer 🎉", "es": "Terminar 🎉", "it": "Finisci 🎉", "ru": "Готово 🎉", "pt": "Terminar 🎉"}, "done": {"sr": "Bravo, prešao si skriptu! 🎉", "en": "Yay, you finished the notes! 🎉", "de": "Super, Skript geschafft! 🎉", "fr": "Bravo, cours terminé ! 🎉", "es": "¡Bien, terminaste los apuntes! 🎉", "it": "Bravo, dispensa completata! 🎉", "ru": "Ура, конспект пройден! 🎉", "pt": "Boa, terminaste os apontamentos! 🎉"}, "doneSub": {"sr": "Sad si spreman za kviz 💪", "en": "Now you're ready for the quiz 💪", "de": "Jetzt bist du bereit fürs Quiz 💪", "fr": "Tu es prêt pour le quiz 💪", "es": "Ya estás listo para el test 💪", "it": "Ora sei pronto per il quiz 💪", "ru": "Теперь ты готов к тесту 💪", "pt": "Agora estás pronto para o quiz 💪"}, "toQuiz": {"sr": "Uradi kviz 🎯", "en": "Take the quiz 🎯", "de": "Zum Quiz 🎯", "fr": "Faire le quiz 🎯", "es": "Hacer el test 🎯", "it": "Fai il quiz 🎯", "ru": "Пройти тест 🎯", "pt": "Fazer o quiz 🎯"}, "toClone": {"sr": "Uči uz Profesoricu 💛", "en": "Learn with Profesorica 💛", "de": "Mit Profesorica lernen 💛", "fr": "Apprendre avec Profesorica 💛", "es": "Aprende con Profesorica 💛", "it": "Impara con Profesorica 💛", "ru": "Учиться с Profesorica 💛", "pt": "Aprende com a Profesorica 💛"}}, "back": "osnovna-matematika-8.html", "quiz": "Provera-Matematika-8.html"};
var MAS=['🦉','🦊','🐨','🐰','🐼','🦄','🐧','🦖','🐳','🌟','🧠','✨'];
var $=function(id){return document.getElementById(id)};
function lng(){try{var s=localStorage.getItem('mathia_lang');if(s){s=s.slice(0,2).toLowerCase();if(D.C.next[s])return s;}}catch(e){}return 'sr'}
function T(o){var l=lng();return (o&&(o[l]||o.sr))||''}
var i=0,N=D.topics.length;
function dots(){var d=$('dots');d.innerHTML='';for(var k=0;k<=N;k++){var s=document.createElement('i');if(k<i)s.className='done';if(k===i)s.className='on';d.appendChild(s);}}
function render(){
 dots();var st=$('stage');
 if(i>=N){ // finale
   st.innerHTML='<section class="card fin"><div class="big">🎉</div><h2>'+T(D.C.done)+'</h2><p>'+T(D.C.doneSub)+'</p>'+
     '<a class="cta" href="'+D.quiz+'">'+T(D.C.toQuiz)+'</a><a class="cta2" href="'+D.back+'">'+T(D.C.toClone)+'</a></section>';
   bigConf();return;
 }
 var tp=D.topics[i];
 var fx=(tp.formulas||[]).map(function(f,k){return '<span style="animation-delay:'+(k*0.06)+'s">'+T(f)+'</span>'}).join('');
 var zap=tp.remember?('<div class="zap"><span class="st">💡</span><p>'+T(tp.remember)+'</p></div>'):'';
 st.innerHTML='<section class="card"><div class="eyebrow">'+T(D.eyebrow)+'</div>'+
   '<div class="mascot">'+MAS[i%MAS.length]+'</div>'+
   '<div class="tnum">'+(i+1)+' / '+N+'</div>'+
   '<h1 class="ttl">'+T(tp.name)+'</h1>'+
   '<p class="theory">'+T(tp.theory)+'</p>'+
   (fx?'<div class="fx">'+fx+'</div>':'')+zap+
   '<div class="nav">'+(i>0?'<button class="prev" id="prev">'+T(D.C.prev)+'</button>':'')+
   '<button class="next" id="next">'+(i===N-1?T(D.C.finish):T(D.C.next))+'</button></div></section>';
 var nx=$('next');if(nx)nx.onclick=function(){i++;render();sparkle()};
 var pv=$('prev');if(pv)pv.onclick=function(){i--;render()};
}
function sparkle(){spawnConf(10)}
function spawnConf(n){var box=$('conf');var cols=['#C6A05C','#B01E48','#CC5E7E','#F0DCA8','#3FB98C','#E7D2A2'];for(var k=0;k<n;k++){var s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.background=cols[k%cols.length];s.style.animationDuration=(1.6+Math.random()*1.4)+'s';if(Math.random()<.3)s.style.borderRadius='50%';box.appendChild(s);setTimeout(function(el){return function(){el.remove()}}(s),3200);}}
function bigConf(){spawnConf(80);var h=['💛','🌸','✨','🎉','⭐'];for(var k=0;k<14;k++){(function(k){setTimeout(function(){var s=document.createElement('i');s.textContent=h[k%5];s.style.cssText='position:absolute;top:-6%;font-size:22px;left:'+(Math.random()*100)+'%;animation:cf '+(1.8+Math.random())+'s linear forwards';$('conf').appendChild(s);setTimeout(function(){s.remove()},3200)},k*70)})(k);}}
(function(){var box=$('fall'),g=['π','√','∑','+','÷','½','💛','🌸','✦','⭐'];for(var k=0;k<20;k++){var s=document.createElement('span');s.textContent=g[k%g.length];if(k%3===0)s.className='m';s.style.left=Math.random()*100+'%';s.style.fontSize=(13+Math.random()*22)+'px';s.style.animationDuration=(7+Math.random()*8)+'s';s.style.animationDelay=(-Math.random()*10)+'s';box.appendChild(s);}})();
$('lang').addEventListener('change',function(){try{localStorage.setItem('mathia_lang',this.value)}catch(e){}try{document.documentElement.lang=this.value}catch(e){}try{window.dispatchEvent(new CustomEvent('mathia:lang',{detail:this.value}))}catch(e){}render();$('lang').value=this.value;});
window.addEventListener('mathia:lang',function(){var s=$('lang');if(s)s.value=lng();render();});
$('lang').value=lng();render();

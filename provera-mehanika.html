<style>

  .tb a.brand{font-family:'Spectral',serif;font-weight:700;letter-spacing:.12em;color:var(--ink);text-decoration:none}
  .tb a.brand b{color:var(--gold)}
  /* hero */
  .hero{text-align:center;padding:46px 0 8px}
  .eyebrow{font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;color:var(--malina);font-weight:800}

  .hero p{color:var(--ink2);max-width:520px;margin:0 auto;font-size:1.05rem}
  .free{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(180deg,#FFFBF3,#FBF3E2);border:1px solid var(--goldsoft);border-radius:100px;padding:6px 15px;font-weight:800;font-size:.74rem;color:var(--golddk);margin-bottom:6px}

  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--goldsoft),var(--gold));width:0;transition:width .4s ease}
  .qnum{font-size:.8rem;color:var(--muted);font-weight:800;letter-spacing:.04em;text-align:center;margin-bottom:14px}
  /* card */
  .card{background:var(--card);border:1px solid rgba(198,160,92,.26);border-radius:24px;padding:32px 30px;box-shadow:0 34px 74px -42px rgba(120,40,60,.5);position:relative;overflow:hidden}

  .q-tag{display:inline-block;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--golddk);background:#FBF3E2;border:1px solid var(--goldsoft);border-radius:100px;padding:3px 11px;margin-bottom:12px}
  .q-txt{font-family:'Spectral',serif;font-size:clamp(1.35rem,3.4vw,1.7rem);color:var(--ink);line-height:1.35}
  .opts{display:grid;gap:11px;margin-top:20px}
  .opt{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid rgba(198,160,92,.32);background:#fffdf8;border-radius:14px;padding:14px 16px;font-family:'Spectral','Cambria Math',Georgia,serif;font-size:1.08rem;color:var(--ink);cursor:pointer;transition:transform .14s,border-color .14s,background .14s}

  .opt.wrong{border-color:#D08;opacity:.85;background:#FDF2F6}

  .fb.ok{color:#2E9E6B}.fb.no{color:var(--malina)}
  .sol{max-height:0;opacity:0;overflow:hidden;transition:max-height .5s ease,opacity .4s ease,margin .4s ease;margin:0}
  .sol.on{max-height:1400px;opacity:1;margin:20px 0 0}
  .sol-in{background:linear-gradient(180deg,#FFF7FA,#FBEEF2);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  .sol-h{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.72rem;color:var(--malina);margin-bottom:8px}
  .step{display:block;font-family:'Spectral','Cambria Math',Georgia,serif;font-size:1.1rem;color:var(--ink);white-space:nowrap;overflow-x:auto;margin:11px 0;line-height:1.5}
  .res{display:inline-block;margin-top:6px;font-family:'Spectral',serif;font-weight:700;color:var(--malina);border:1.5px solid rgba(176,30,72,.35);border-radius:10px;padding:4px 14px;background:#fff}
  .note{color:#7A3346;font-size:.96rem;margin-top:8px}

  .frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .18em}
  .frac>span{display:block;line-height:1.12;padding:0 .45em}
  .frac .num{border-bottom:1.5px solid currentColor;padding-bottom:.06em}
  .frac .den{padding-top:.06em}
  .lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .18em}
  .lim .und{font-size:.58em;margin-top:.14em;font-style:normal;white-space:nowrap}

  /* controls */
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  .btn{display:inline-flex;align-items:center;gap:9px;border-radius:100px;padding:13px 26px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.94rem;cursor:pointer;text-decoration:none;border:1.5px solid transparent;transition:transform .16s,box-shadow .16s,background .16s}
  .btn-gold{background:linear-gradient(110deg,#EAD196,#C6A05C 45%,#F4E3B4 55%,#C6A05C 75%,#EAD196);background-size:240% auto;color:#3a2410;box-shadow:0 16px 30px -14px rgba(160,120,40,.7);animation:shim 7s linear infinite}

  .btn-gold:hover{transform:translateY(-2px)}
  .btn-ghost{background:transparent;border-color:rgba(198,160,92,.5);color:var(--golddk)}
  .btn-ghost:hover{background:#FBF3E2}
  .btn-mal{background:linear-gradient(160deg,#CC5E7E,#B01E48);color:#fff;box-shadow:0 14px 28px -12px rgba(176,30,72,.5)}
  .btn-mal:hover{transform:translateY(-2px)}
  .backbtn{background:none;border:none;color:var(--muted);font-family:inherit;font-weight:700;cursor:pointer;font-size:.86rem}
  /* end */
  #end{display:none;text-align:center}
  #end.on{display:block}
  #end .big{font-size:clamp(2rem,5vw,2.8rem);margin:6px 0 8px;background:linear-gradient(100deg,#9C7838,#E7D2A2 30%,#FFF7E2 48%,#E7D2A2 66%,#C6A05C);-webkit-background-clip:text;background-clip:text;color:transparent}
  .mbox{margin:22px 0 0;background:linear-gradient(160deg,#5A1024,#3A0B18);color:#fff;border-radius:20px;padding:26px;position:relative;overflow:hidden}

</style>

esorica о чём угодно по этому предмету — объяснит на твоём примере, шаг за шагом, круглосуточно.", "pt": "Pergunta à Profesorica qualquer coisa desta disciplina — explica no teu exemplo, passo a passo, 24h."}, "askBtn": {"sr": "Pitaj Profesoricu →", "en": "Ask Profesorica →", "de": "Frag Profesorica →", "fr": "Demande à Profesorica →", "es": "Pregunta a Profesorica →", "it": "Chiedi a Profesorica →", "ru": "Спроси Profesorica →", "pt": "Pergunta à Profesorica →"}, "allBtn": {"sr": "Svi predmeti →", "en": "All subjects →", "de": "Alle Fächer →", "fr": "Toutes les matières →", "es": "Todas las asignaturas →", "it": "Tutte le materie →", "ru": "Все предметы →", "pt": "Todas as disciplinas →"}, "again": {"sr": "↺ Ponovi kviz", "en": "↺ Retake the quiz", "de": "↺ Quiz wiederholen", "fr": "↺ Refaire le quiz", "es": "↺ Repetir el test", "it": "↺ Rifai il quiz", "ru": "↺ Пройти заново", "pt": "↺ Repetir o quiz"}, "back": {"sr": "← Mehanika", "en": "← Mechanics", "de": "← Mechanik", "fr": "← Mécanique", "es": "← Mecánica", "it": "← Meccanica", "ru": "← Механика", "pt": "← Mecânica"}, "eyebrow": {"sr": "Proveri znanje · Mehanika", "en": "Test yourself · Mechanics", "de": "Wissen prüfen · Mechanik", "fr": "Teste-toi · Mécanique", "es": "Ponte a prueba · Mecánica", "it": "Mettiti alla prova · Meccanica", "ru": "Проверь знания · Механика", "pt": "Testa-te · Mecânica"}};
var DATA={"sr": [{"tag": "Statika · reakcije oslonaca", "q": "Prosta greda L = 6 m (A zglobni, B cilindrični) nosi silu F = 300 N na 2 m od A. Reakcije?", "o": ["V<sub>A</sub> = 200 N, V<sub>B</sub> = 100 N", "V<sub>A</sub> = 100 N, V<sub>B</sub> = 200 N", "V<sub>A</sub> = 150 N, V<sub>B</sub> = 150 N", "V<sub>A</sub> = 300 N, V<sub>B</sub> = 0"], "c": 0, "sol": "<span class=\"step\">∑ M<sub>A</sub> = 0 → V<sub>B</sub> · 6 = 300 · 2</span><span class=\"step\">V<sub>B</sub> = <span class=\"frac\"><span class=\"num\">600</span><span class=\"den\">6</span></span> = 100 N</span><span class=\"step\">∑ F<sub>y</sub> = 0 → V<sub>A</sub> = 300 − 100 = 200 N</span><div class=\"note\">Zbir momenata oko A daje V<sub>B</sub>, pa zbir sila po y daje V<sub>A</sub>.</div><span class=\"res\">V<sub>A</sub> = 200 N, V<sub>B</sub> = 100 N</span>"}, {"tag": "Nagib sa trenjem", "q": "Telo m = 5 kg na nagibu α = 30°, μ = 0,2 (g = 10). Da li klizi i sa kojim ubrzanjem?", "o": ["Da, a ≈ 3,27 m/s²", "Ne klizi", "a = 5 m/s²", "a ≈ 1,7 m/s²"], "c": 0, "sol": "<span class=\"step\">m·g·sin α = 25 N,  μ·m·g·cos α ≈ 8,66 N</span><span class=\"step\">a = g(sin α − μ·cos α) = 10(0,5 − 0,173) = 3,27 m/s²</span><div class=\"note\">Sila niz nagib (25 N) veća je od maks. trenja (≈ 8,66 N) → telo klizi.</div><span class=\"res\">Klizi, a ≈ 3,27 m/s²</span>"}, {"tag": "Kinematika · vertikalni hitac", "q": "Telo bačeno uvis v<sub>0</sub> = 20 m/s. Visina i brzina posle t = 1,5 s? (g = 10)", "o": ["h = 18,75 m, v = 5 m/s", "h = 30 m, v = 5 m/s", "h = 11,25 m, v = 15 m/s", "h = 18,75 m, v = 15 m/s"], "c": 0, "sol": "<span class=\"step\">h = v<sub>0</sub>·t − ½·g·t² = 30 − 11,25 = 18,75 m</span><span class=\"step\">v = v<sub>0</sub> − g·t = 20 − 15 = 5 m/s</span><span class=\"res\">h = 18,75 m, v = 5 m/s</span>"}, {"tag": "II Njutnov zakon · kotur", "q": "m<sub>1</sub> = 3 kg (visi), m<sub>2</sub> = 2 kg (glatki sto) preko kotura. Ubrzanje i zatezanje? (g = 10)", "o": ["a = 6 m/s², T = 12 N", "a = 5 m/s², T = 10 N", "a = 6 m/s², T = 18 N", "a = 2 m/s², T = 4 N"], "c": 0, "sol": "<span class=\"step\">a = <span class=\"frac\"><span class=\"num\">m<sub>1</sub>·g</span><span class=\"den\">m<sub>1</sub> + m<sub>2</sub></span></span> = <span class=\"frac\"><span class=\"num\">30</span><span class=\"den\">5</span></span> = 6 m/s²</span><span class=\"step\">T = m<sub>2</sub>·a = 2·6 = 12 N</span><span class=\"res\">a = 6 m/s², T = 12 N</span>"}, {"tag": "Održanje energije", "q": "Telo klizi bez trenja niz nagib visine h = 1,8 m. Brzina na dnu? (g = 10)", "o": ["6 m/s", "3,6 m/s", "36 m/s", "4,2 m/s"], "c": 0, "sol": "<span class=\"step\">m·g·h = ½·m·v² → v = √<span class=\"rt\">2·g·h</span></span><span class=\"step\">v = √<span class=\"rt\">2·10·1,8</span> = √<span class=\"rt\">36</span> = 6 m/s</span><span class=\"res\">v = 6 m/s</span>"}, {"tag": "Održanje impulsa · sudar", "q": "Kolica m<sub>1</sub> = 2 kg, v<sub>1</sub> = 3 m/s spoje se sa mirnim m<sub>2</sub> = 1 kg. Zajednička brzina?", "o": ["2 m/s", "3 m/s", "1,5 m/s", "6 m/s"], "c": 0, "sol": "<span class=\"step\">m<sub>1</sub>·v<sub>1</sub> = (m<sub>1</sub> + m<sub>2</sub>)·v</span><span class=\"step\">v = <span class=\"frac\"><span class=\"num\">2·3</span><span class=\"den\">3</span></span> = 2 m/s</span><div class=\"note\">Neelastičan sudar — tela se kreću zajedno.</div><span class=\"res\">v = 2 m/s</span>"}, {"tag": "Rotacija tela", "q": "Pun disk m = 4 kg, R = 0,5 m rotira ω = 10 rad/s. Moment inercije i kinetička energija rotacije?", "o": ["J = 0,5 kg·m², E = 25 J", "J = 1 kg·m², E = 50 J", "J = 0,5 kg·m², E = 50 J", "J = 0,25 kg·m², E = 12,5 J"], "c": 0, "sol": "<span class=\"step\">J = ½·m·R² = ½·4·0,25 = 0,5 kg·m²</span><span class=\"step\">E<sub>rot</sub> = ½·J·ω² = ½·0,5·100 = 25 J</span><span class=\"res\">J = 0,5 kg·m², E = 25 J</span>"}], "en": [{"tag": "Statics · support reactions", "q": "A simple beam L = 6 m (A pin, B roller) carries F = 300 N at 2 m from A. Reactions?", "o": ["V<sub>A</sub> = 200 N, V<sub>B</sub> = 100 N", "V<sub>A</sub> = 100 N, V<sub>B</sub> = 200 N", "V<sub>A</sub> = 150 N, V<sub>B</sub> = 150 N", "V<sub>A</sub> = 300 N, V<sub>B</sub> = 0"], "c": 0, "sol": "<span class=\"step\">∑ M<sub>A</sub> = 0 → V<sub>B</sub> · 6 = 300 · 2</span><span class=\"step\">V<sub>B</sub> = <span class=\"frac\"><span class=\"num\">600</span><span class=\"den\">6</span></span> = 100 N</span><span class=\"step\">∑ F<sub>y</sub> = 0 → V<sub>A</sub> = 300 − 100 = 200 N</span><div class=\"note\">Sum of moments about A gives V<sub>B</sub>, then sum of vertical forces gives V<sub>A</sub>.</div><span class=\"res\">V<sub>A</sub> = 200 N, V<sub>B</sub> = 100 N</span>"}, {"tag": "Incline with friction", "q": "Body m = 5 kg on an incline α = 30°, μ = 0.2 (g = 10). Does it slide, and with what acceleration?", "o": ["Yes, a ≈ 3.27 m/s²", "It doesn't slide", "a = 5 m/s²", "a ≈ 1,7 m/s²"], "c": 0, "sol": "<span class=\"step\">m·g·sin α = 25 N,  μ·m·g·cos α ≈ 8,66 N</span><span class=\"step\">a = g(sin α − μ·cos α) = 10(0,5 − 0,173) = 3,27 m/s²</span><div class=\"note\">The down-slope force (25 N) exceeds max friction (≈ 8.66 N) → it slides.</div><span class=\"res\">Klizi, a ≈ 3,27 m/s²</span>"}, {"tag": "Kinematics · vertical throw", "q": "Body thrown up at v<sub>0</sub> = 20 m/s. Height and speed after t = 1.5 s? (g = 10)", "o": ["h = 18,75 m, v = 5 m/s", "h = 30 m, v = 5 m/s", "h = 11,25 m, v = 15 m/s", "h = 18,75 m, v = 15 m/s"], "c": 0, "sol": "<span class=\"step\">h = v<sub>0</sub>·t − ½·g·t² = 30 − 11,25 = 18,75 m</span><span class=\"step\">v = v<sub>0</sub> − g·t = 20 − 15 = 5 m/s</span><span class=\"res\">h = 18,75 m, v = 5 m/s</span>"}, {"tag": "Newton's 2nd law · pulley", "q": "m<sub>1</sub> = 3 kg (hanging), m<sub>2</sub> = 2 kg (smooth table) over a pulley. Acceleration and tension? (g = 10)", "o": ["a = 6 m/s², T = 12 N", "a = 5 m/s², T = 10 N", "a = 6 m/s², T = 18 N", "a = 2 m/s², T = 4 N"], "c": 0, "sol": "<span class=\"step\">a = <span class=\"frac\"><span class=\"num\">m<sub>1</sub>·g</span><span class=\"den\">m<sub>1</sub> + m<sub>2</sub></span></span> = <span class=\"frac\"><span class=\"num\">30</span><span class=\"den\">5</span></span> = 6 m/s²</span><span class=\"step\">T = m<sub>2</sub>·a = 2·6 = 12 N</span><span class=\"res\">a = 6 m/s², T = 12 N</span>"}, {"tag": "Energy conservation", "q": "A body slides frictionlessly down a slope of height h = 1.8 m. Speed at the bottom? (g = 10)", "o": ["6 m/s", "3,6 m/s", "36 m/s", "4,2 m/s"], "c": 0, "sol": "<span class=\"step\">m·g·h = ½·m·v² → v = √<span class=\"rt\">2·g·h</span></span><span class=\"step\">v = √<span class=\"rt\">2·10·1,8</span> = √<span class=\"rt\">36</span> = 6 m/s</span><span class=\"res\">v = 6 m/s</span>"}, {"tag": "Momentum conservation · collision", "q": "Cart m<sub>1</sub> = 2 kg, v<sub>1</sub> = 3 m/s couples with a resting m<sub>2</sub> = 1 kg. Common speed?", "o": ["2 m/s", "3 m/s", "1,5 m/s", "6 m/s"], "c": 0, "sol": "<span class=\"step\">m<sub>1</sub>·v<sub>1</sub> = (m<sub>1</sub> + m<sub>2</sub>)·v</span><span class=\"step\">v = <span class=\"frac\"><span class=\"num\">2·3</span><span class=\"den\">3</span></span> = 2 m/s</span><div class=\"note\">Inelastic collision — the bodies move together.</div><span class=\"res\">v = 2 m/s</span>"}, {"tag": "Rotation of a body", "q": "Solid disk m = 4 kg, R = 0.5 m rotates at ω = 10 rad/s. Moment of inertia and rotational kinetic energy?", "o": ["J = 0,5 kg·m², E = 25 J", "J = 1 kg·m², E = 50 J", "J = 0,5 kg·m², E = 50 J", "J = 0,25 kg·m², E = 12,5 J"], "c": 0, "sol": "<span class=\"step\">J = ½·m·R² = ½·4·0,25 = 0,5 kg·m²</span><span class=\"step\">E<sub>rot</sub> = ½·J·ω² = ½·0,5·100 = 25 J</span><span class=\"res\">J = 0,5 kg·m², E = 25 J</span>"}], "de": [{"tag": "Statik · Auflagerreaktionen", "q": "Einfacher Balken L = 6 m (A Festlager, B Loslager) trägt F = 300 N in 2 m von A. Reaktionen?", "o": ["V<sub>A</sub> = 200 N, V<sub>B</sub> = 100 N", "V<sub>A</sub> = 100 N, V<sub>B</sub> = 200 N", "V<sub>A</sub> = 150 N, V<sub>B</sub> = 150 N", "V<sub>A</sub> = 300 N, V<sub>B</sub> = 0"], "c": 0, "sol": "<span class=\"step\">∑ M<sub>A</sub> = 0 → V<sub>B</sub> · 6 = 300 · 2</span><span class=\"step\">V<sub>B</sub> = <span class=\"frac\"><span class=\"num\">600</span><span class=\"den\">6</span></span> = 100 N</span><span class=\"step\">∑ F<sub>y</sub> = 0 → V<sub>A</sub> = 300 − 100 = 200 N</span><div class=\"note\">Momentensumme um A ergibt V<sub>B</sub>, dann die Summe der Vertikalkräfte V<sub>A</sub>.</div><span class=\"res\">V<sub>A</sub> = 200 N, V<sub>B</sub> = 100 N</span>"}, {"tag": "Schiefe Ebene mit Reibung", "q": "Körper m = 5 kg auf Ebene α = 30°, μ = 0,2 (g = 10). Rutscht er, und mit welcher Beschleunigung?", "o": ["Ja, a ≈ 3,27 m/s²", "Rutscht nicht", "a = 5 m/s²", "a ≈ 1,7 m/s²"], "c": 0, "sol": "<span class=\"step\">m·g·sin α = 25 N,  μ·m·g·cos α ≈ 8,66 N</span><span class=\"step\">a = g(sin α − μ·cos α) = 10(0,5 − 0,173) = 3,27 m/s²</span><div class=\"note\">Die Hangabtriebskraft (25 N) übersteigt die max. Reibung (≈ 8,66 N) → es rutscht.</div><span class=\"res\">Klizi, a ≈ 3,27 m/s²</span>"}, {"tag": "Kinematik · senkrechter Wurf", "q": "Körper senkrecht mit v<sub>0</sub> = 20 m/s. Höhe und Geschwindigkeit nach t = 1,5 s? (g = 10)", "o": ["h = 18,75 m, v = 5 m/s", "h = 30 m, v = 5 m/s", "h = 11,25 m, v = 15 m/s", "h = 18,75 m, v = 15 m/s"], "c": 0, "sol": "<span class=\"step\">h = v<sub>0</sub>·t − ½·g·t² = 30 − 11,25 = 18,75 m</span><span class=\"step\">v = v<sub>0</sub> − g·t = 20 − 15 = 5 m/s</span><span class=\"res\">h = 18,75 m, v = 5 m/s</span>"}, {"tag": "2. Newtonsches Gesetz · Rolle", "q": "m<sub>1</sub> = 3 kg (hängt), m<sub>2</sub> = 2 kg (glatter Tisch) über Rolle. Beschleunigung und Zugkraft? (g = 10)", "o": ["a = 6 m/s², T = 12 N", "a = 5 m/s², T = 10 N", "a = 6 m/s², T = 18 N", "a = 2 m/s², T = 4 N"], "c": 0, "sol": "<span class=\"step\">a = <span class=\"frac\"><span class=\"num\">m<sub>1</sub>·g</span><span class=\"den\">m<sub>1</ rt\">2·g·h</span></span><span class=\"step\">v = √<span class=\"rt\">2·10·1,8</span> = √<span class=\"rt\">36</span> = 6 m/s</span><span class=\"res\">v = 6 m/s</span>"}, {"tag": "Conservação do momento · colisão", "q": "Carrinho m<sub>1</sub> = 2 kg, v<sub>1</sub> = 3 m/s acopla com m<sub>2</sub> = 1 kg parado. Velocidade comum?", "o": ["2 m/s", "3 m/s", "1,5 m/s", "6 m/s"], "c": 0, "sol": "<span class=\"step\">m<sub>1</sub>·v<sub>1</sub> = (m<sub>1</sub> + m<sub>2</sub>)·v</span><span class=\"step\">v = <span class=\"frac\"><span class=\"num\">2·3</span><span class=\"den\">3</span></span> = 2 m/s</span><div class=\"note\">Colisão inelástica — os corpos movem-se juntos.</div><span class=\"res\">v = 2 m/s</span>"}, {"tag": "Rotação de um corpo", "q": "Disco maciço m = 4 kg, R = 0,5 m gira a ω = 10 rad/s. Momento de inércia e energia de rotação?", "o": ["J = 0,5 kg·m², E = 25 J", "J = 1 kg·m², E = 50 J", "J = 0,5 kg·m², E = 50 J", "J = 0,25 kg·m², E = 12,5 J"], "c": 0, "sol": "<span class=\"step\">J = ½·m·R² = ½·4·0,25 = 0,5 kg·m²</span><span class=\"step\">E<sub>rot</sub> = ½·J·ω² = ½·0,5·100 = 25 J</span><span class=\"res\">J = 0,5 kg·m², E = 25 J</span>"}]};
var LANG='sr';try{LANG=(localStorage.getItem('mathia_lang')||'sr').toLowerCase();}catch(e){}if(!DATA[LANG])LANG='sr';
var Q=DATA[LANG];
function tr(l){if(!DATA[l])l='sr';LANG=l;Q=DATA[l];try{localStorage.setItem('mathia_lang',l);}catch(e){}document.documentElement.lang=l;document.querySelectorAll('[data-i18n]').forEach(function(e){var k=e.getAttribute('data-i18n');if(I18N[k]&&I18N[k][l])e.textContent=I18N[k][l];});document.querySelectorAll('[data-i18n-html]').forEach(function(e){var k=e.getAttribute('data-i18n-html');if(I18N[k]&&I18N[k][l])e.innerHTML=I18N[k][l];});var sel=document.getElementById('qlang');if(sel)sel.value=l;render();}


  var idx=0, revealed=false, L=["A","B","C","D","E"];
  var qcard=document.getElementById("qcard"),end=document.getElementById("end");
  function pick(k,el){
    var op=document.getElementById("opts"); if(op.classList.contains("locked")) return;
    op.classList.add("locked"); var it=Q[idx], nd=op.children;
    for(var j=0;j<nd.length;j++){ if(j===it.c) nd[j].classList.add("correct"); }
    var fb=document.getElementById("fb");
    if(k===it.c){ fb.className="fb ok"; fb.textContent=I18N.fbOk[LANG]; }
    else{ el.classList.add("wrong"); fb.className="fb no"; fb.textContent=I18N.fbNo[LANG]; }
    document.getElementById("nextBtn").style.display="";
  }
  function render(){
    var it=Q[idx];
    document.getElementById("tag").innerHTML=it.tag;
    document.getElementById("qtxt").innerHTML=it.q;
    var op=document.getElementById("opts"); op.className="opts"; op.innerHTML="";
    (it.o||[]).forEach(function(txt,k){ var b=document.createElement("div"); b.className="opt"; b.innerHTML='<span class="mk">'+L[k]+'</span><span>'+txt+'</span>'; b.addEventListener("click",function(){ pick(k,b); }); op.appendChild(b); });
    var fb=document.getElementById("fb"); fb.className="fb"; fb.textContent="";
    document.getElementById("solbody").innerHTML=it.sol;
    document.getElementById("sol").classList.remove("on");
    document.getElementById("revealBtn").style.display="";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("nextBtn").textContent = (idx===Q.length-1 ? I18N.nextEnd[LANG] : I18N.nextMid[LANG]);
    document.getElementById("prevBtn").style.visibility = idx>0 ? "visible":"hidden";
    document.getElementById("qnum").textContent=I18N.qnum[LANG]+" "+(idx+1)+" / "+Q.length;
    document.getElementById("bar").style.width=((idx)/Q.length*100)+"%";
    revealed=false;
    window.scrollTo({top:0,behavior:"smooth"});
  }
  document.getElementById("revealBtn").addEventListener("click",function(){
    document.getElementById("sol").classList.add("on");
    this.style.display="none";
    document.getElementById("nextBtn").style.display="";
    revealed=true;
  });
  document.getElementById("nextBtn").addEventListener("click",function(){
    if(idx<Q.length-1){idx++;render();}
    else{ // kraj
      document.getElementById("bar").style.width="100%";
      qcard.style.display="none";document.getElementById("qnum").style.display="none";document.querySelector(".prog").style.display="none";
      end.classList.add("on");window.scrollTo({top:0,behavior:"smooth"});
    }
  });
  document.getElementById("prevBtn").addEventListener("click",function(){ if(idx>0){idx--;render();} });
  document.getElementById("againBtn").addEventListener("click",function(){
    idx=0;end.classList.remove("on");qcard.style.display="";document.getElementById("qnum").style.display="";document.querySelector(".prog").style.display="";render();
  });
  var _sel=document.getElementById('qlang');if(_sel){_sel.value=LANG;_sel.addEventListener('change',function(){tr(this.value);});}
  tr(LANG);
})();

<style>

  .tb a.brand{font-family:'Spectral',serif;font-weight:700;letter-spacing:.12em;color:var(--ink);text-decoration:none}
  .tb a.brand b{color:var(--gold)}
  /* hero */
  .hero{text-align:center;padding:46px 0 8px}
  .eyebrow{font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;color:var(--malina);font-weight:800}
  .hero h1{font-size:clamp(2rem,5vw,2.9rem);margin:12px 0 8px}
  .hero p{color:var(--ink2);max-width:520px;margin:0 auto;font-size:1.05rem}
  .free{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(180deg,#FFFBF3,#FBF3E2);border:1px solid var(--goldsoft);border-radius:100px;padding:6px 15px;font-weight:800;font-size:.74rem;color:var(--golddk);margin-bottom:6px}

  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--goldsoft),var(--gold));width:0;transition:width .4s ease}
  .qnum{font-size:.8rem;color:var(--muted);font-weight:800;letter-spacing:.04em;text-align:center;margin-bottom:14px}
  /* card */

  .q-tag{display:inline-block;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--golddk);background:#FBF3E2;border:1px solid var(--goldsoft);border-radius:100px;padding:3px 11px;margin-bottom:12px}
  .q-txt{font-family:'Spectral',serif;font-size:clamp(1.35rem,3.4vw,1.7rem);color:var(--ink);line-height:1.35}
  .opts{display:grid;gap:11px;margin-top:20px}
  .opt{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid rgba(198,160,92,.32);background:#fffdf8;border-radius:14px;padding:14px 16px;font-family:'Spectral','Cambria Math',Georgia,serif;font-size:1.08rem;color:var(--ink);cursor:pointer;transition:transform .14s,border-color .14s,background .14s}

  .opt .mk{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:800;font-size:.82rem;color:var(--golddk)}

  .fb.ok{color:#2E9E6B}.fb.no{color:var(--malina)}
  .sol{max-height:0;opacity:0;overflow:hidden;transition:max-height .5s ease,opacity .4s ease,margin .4s ease;margin:0}
  .sol.on{max-height:1400px;opacity:1;margin:20px 0 0}
  .sol-in{background:linear-gradient(180deg,#FFF7FA,#FBEEF2);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  .sol-h{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.72rem;color:var(--malina);margin-bottom:8px}
  .step{display:block;font-family:'Spectral','Cambria Math',Georgia,serif;font-size:1.1rem;color:var(--ink);white-space:nowrap;overflow-x:auto;margin:11px 0;line-height:1.5}
  .res{display:inline-block;margin-top:6px;font-family:'Spectral',serif;font-weight:700;color:var(--malina);border:1.5px solid rgba(176,30,72,.35);border-radius:10px;padding:4px 14px;background:#fff}
  .note{color:#7A3346;font-size:.96rem;margin-top:8px}
  /* math bits */
  .frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .18em}
  .frac>span{display:block;line-height:1.12;padding:0 .45em}
  .frac .num{border-bottom:1.5px solid currentColor;padding-bottom:.06em}
  .frac .den{padding-top:.06em}
  .lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .18em}
  .lim .und{font-size:.58em;margin-top:.14em;font-style:normal;white-space:nowrap}
  b{color:var(--ink)}
  /* controls */
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  .btn{display:inline-flex;align-items:center;gap:9px;border-radius:100px;padding:13px 26px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.94rem;cursor:pointer;text-decoration:none;border:1.5px solid transparent;transition:transform .16s,box-shadow .16s,background .16s}
  .btn-gold{background:linear-gradient(110deg,#EAD196,#C6A05C 45%,#F4E3B4 55%,#C6A05C 75%,#EAD196);background-size:240% auto;color:#3a2410;box-shadow:0 16px 30px -14px rgba(160,120,40,.7);animation:shim 7s linear infinite}

  .btn-gold:hover{transform:translateY(-2px)}
  .btn-ghost{background:transparent;border-color:rgba(198,160,92,.5);color:var(--golddk)}
  .btn-ghost:hover{background:#FBF3E2}
  .btn-mal{background:linear-gradient(160deg,#CC5E7E,#B01E48);color:#fff;box-shadow:0 14px 28px -12px rgba(176,30,72,.5)}
  .btn-mal:hover{transform:translateY(-2px)}
  .backbtn{background:none;border:none;color:var(--muted);font-family:inherit;font-weight:700;cursor:pointer;font-size:.86rem}
  /* end */
  #end{display:none;text-align:center}
  #end.on{display:block}
  #end .big{font-size:clamp(2rem,5vw,2.8rem);margin:6px 0 8px;background:linear-gradient(100deg,#9C7838,#E7D2A2 30%,#FFF7E2 48%,#E7D2A2 66%,#C6A05C);-webkit-background-clip:text;background-clip:text;color:transparent}
  .mbox{margin:22px 0 0;background:linear-gradient(160deg,#5A1024,#3A0B18);color:#fff;border-radius:20px;padding:26px;position:relative;overflow:hidden}

</style>

var DATA={"sr": [{"tag": "Klasična verovatnoća", "q": "Bacamo dve kocke. Verovatnoća da je zbir 7?", "o": ["<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">6</span></span>", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">12</span></span>", "<span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">36</span></span>", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">8</span></span>"], "c": 0, "sol": "<span class=\"step\">Povoljni: (1,6),(2,5),(3,4),(4,3),(5,2),(6,1) → 6</span><span class=\"step\">P = <span class=\"frac\"><span class=\"num\">6</span><span class=\"den\">36</span></span> = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">6</span></span></span><div class=\"note\">6 povoljnih ishoda od ukupno 36.</div><span class=\"res\">P = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">6</span></span></span>"}, {"tag": "Komplement („bar jedan“)", "q": "Bacamo novčić 3 puta. Verovatnoća da padne bar jedno pismo?", "o": ["<span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">8</span></span>", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">8</span></span>", "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">8</span></span>", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span>"], "c": 0, "sol": "<span class=\"step\">P(nijedno pismo) = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span>³ = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">8</span></span></span><span class=\"step\">P(bar jedno) = 1 − <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">8</span></span> = <span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">8</span></span></span><div class=\"note\">Lakše preko komplementa nego sabiranjem slučajeva.</div><span class=\"res\">P = <span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">8</span></span></span>"}, {"tag": "Uslovna verovatnoća", "q": "60% žena; 20% svih nosi naočare; 12% su žene sa naočarima. Ako je izabrana žena, P(naočare)?", "o": ["0,20", "0,12", "0,32", "0,60"], "c": 0, "sol": "<span class=\"step\">P(N | Ž) = <span class=\"frac\"><span class=\"num\">P(N ∩ Ž)</span><span class=\"den\">P(Ž)</span></span> = <span class=\"frac\"><span class=\"num\">0,12</span><span class=\"den\">0,60</span></span> = 0,20</span><div class=\"note\">Uslovna: presek podeljen verovatnoćom uslova.</div><span class=\"res\">P(N | Ž) = 0,20</span>"}, {"tag": "Bajesova formula", "q": "Mašina A: 60% (2% škarta), B: 40% (5% škarta). Uzet je škart. P(potiče od A)?", "o": ["0,375", "0,60", "0,625", "0,40"], "c": 0, "sol": "<span class=\"step\">P(škart) = 0,6·0,02 + 0,4·0,05 = 0,032</span><span class=\"step\">P(A | škart) = <span class=\"frac\"><span class=\"num\">0,012</span><span class=\"den\">0,032</span></span> = 0,375</span><span class=\"res\">P(A | škart) = 0,375</span>"}, {"tag": "Binomna raspodela", "q": "Strelac pogađa sa p = 0,8, gađa 5 puta. Verovatnoća tačno 4 pogotka?", "o": ["0,4096", "0,32768", "0,2048", "0,8"], "c": 0, "sol": "<span class=\"step\">P(X = 4) = C(5,4)·0,8⁴·0,2</span><span class=\"step\">= 5 · 0,4096 · 0,2 = 0,4096</span><span class=\"res\">P(X = 4) = 0,4096</span>"}, {"tag": "Poasonova raspodela", "q": "Prosečno λ = 3 poziva na sat. Verovatnoća tačno 2 poziva u satu?", "o": ["0,224", "0,149", "0,168", "0,100"], "c": 0, "sol": "<span class=\"step\">P(X = 2) = <span class=\"frac\"><span class=\"num\">3² · e⁻³</span><span class=\"den\">2!</span></span></span><span class=\"step\">= 4,5 · 0,0498 ≈ 0,224</span><span class=\"res\">P(X = 2) ≈ 0,224</span>"}, {"tag": "Očekivanje i disperzija", "q": "X: 1, 2, 3 sa verovatnoćama 0,5; 0,3; 0,2. Nađi E(X) i D(X).", "o": ["E(X) = 1,7, D(X) = 0,61", "E(X) = 2, D(X) = 1", "E(X) = 1,7, D(X) = 2,89", "E(X) = 1,5, D(X) = 0,5"], "c": 0, "sol": "<span class=\"step\">E(X) = 1·0,5 + 2·0,3 + 3·0,2 = 1,7</span><span class=\"step\">E(X²) = 3,5</span><span class=\"step\">D(X) = 3,5 − 1,7² = 0,61</span><span class=\"res\">E(X) = 1,7, D(X) = 0,61</span>"}], "en": [{"tag": "Classical probability", "q": "We roll two dice. Probability that the sum is 7?", "o": ["<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">6</span></span>", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">12</span></span>", "<span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">36</span></span>", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">8</span></span>"], "c": 0, "sol": "<span class=\"step\">Povoljni: (1,6),(2,5),(3,4),(4,3),(5,2),(6,1) → 6</span><span class=\"step\">P = <span class=\"frac\"><span class=\"num\">6</span><span class=\"den\">36</span></span> = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">6</span></span></span><div class=\"note\">6 favourable outcomes out of 36.</div><span class=\"res\">P = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">6</span></span></span>"}, {"tag": "Complement („at least one“)", "q": "We flip a coin 3 times. Probability of at least one tails?", "o": ["<span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">8</span></span>", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">8</span></span>", "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">8</span></span>", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span>"], "c": 0, "sol": "<span class=\"step\">P(nijedno pismo) = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span>³ = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">8</span></span></span><span class=\"step\">P(bar jedno) = 1 − <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">8</span></span> = <span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">8</span></span></span><div class=\"note\">Easier via the complement than by summing cases.</div><span class=\"res\">P = <span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">8</span></span></span>"}, {"tag": "Conditional probability", "q": "60% women; 20% wear glasses; 12% are women with glasses. Given a woman, P(glasses)?", "o": ["0,20", "0,12", "0,32", "0,60"], "c": 0, "sol": "<span class=\"step\">P(N | Ž) = <span class=\"frac\"><span class=\"num\">P(N ∩ Ž)</span><span class=\"den\">P(Ž)</span></span> = <span class=\"frac\"><span class=\"num\">0,12</span><span class=\"den\">0,60</span></span> = 0,20</span><div class=\"note\">Conditional: intersection divided by the condition's probability.</div><span class=\"res\">P(N | Ž) = 0,20</span>"}, {"tag": "Bayes' formula", "q": "Machine A: 60% (2% defect), B: 40% (5% defect). A defective item is taken. P(from A)?", "o": ["0,375", "0,60", "0,625", "0,40"], "c": 0, "sol": "<span class=\"step\">P(škart) = 0,6·0,02 + 0,4·0,05 = 0,032</span><span class=\"step\">P(A | škart) = <span class=\"frac\"><span class=\"num\">0,012</span><span class=\"den\">0,032</span></span> = 0,375</span><span class=\"res\">P(A | škart) = 0,375</span>"}, {"tag": "Binomial distribution", "q": "A shooter hits with p = 0.8, fires 5 times. Probability of exactly 4 hits?", "o": ["0,4096", "0,32768", "0,2048", "0,8"], "c": 0, "sol": "<span class=\"step\">P(X = 4) = C(5,4)·0,8⁴·0,2</span><span class=\"step\">= 5 · 0,4096 · 0,2 = 0,4096</span><span class=\"res\">P(X = 4) = 0,4096</span>"}, {"tag": "Poisson distribution", "q": "On average λ = 3 calls per hour. Probability of exactly 2 calls in an hour?", "o": ["0,224", "0,149", "0,168", "0,100"], "c": 0, "sol": "<span class=\"step\">P(X = 2) = <span class=\"frac\"><span class=\"num\">3² · e⁻³</span><span class=\"den\">2!</span></span></span><span class=\"step\">= 4,5 · 0,0498 ≈ 0,224</span><span class=\"res\">P(X = 2) ≈ 0,224</span>"}, {"tag": "Expectation and variance", "q": "X: 1, 2, 3 with probabilities 0.5; 0.3; 0.2. Find E(X) and D(X).", "o": ["E(X) = 1,7, D(X) = 0,61", "E(X) = 2, D(X) = 1", "E(X) = 1,7, D(X) = 2,89", "E(X) = 1,5, D(X) = 0,5"], "c": 0, "sol": "<span class=\"step\">E(X) = 1·0,5 + 2·0,3 + 3·0,2 = 1,7</span><span class=\"step\">E(X²) = 3,5</span><span class=\"step\">D(X) = 3,5 − 1,7² = 0,61</span><span class=\"res\">E(X) = 1,7, D(X) = 0,61</span>"}], "de": [{"tag": "Klassische Wahrscheinlichkeit", "q": "Wir werfen zwei Würfel. Wahrscheinlichkeit, dass die Summe 7 ist?", "o": ["<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">6</span></span>", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">12</span></span>", "<span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">36</span></span>", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">8</span></span>"], "c": 0, "sol": "<span class=\"step\">Povoljni: (1,6),(2,5),(3,4),(4,3),(5,2),(6,1) → 6</span><span class=\"step\">P = <span class=\"frac\"><span class=\"num\">6</span><span class=\"den\">36</span></span> = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">6</span></span></span><div class=\"note\">6 günstige von insgesamt 36 Ergebnissen.</div><span class=\"res\">P = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">6</span></span></span>"}, {"tag": "Komplement („mindestens eins“)", "q": "Wir werfen eine Münze 3-mal. Wahrscheinlichkeit für mindestens einmal Zahl?", "o": ["<span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">8</span></span>", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">8</span></span>", "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">8</span></span>", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span>"], "c": 0, "sol": "<span class=\"step\">P(nijedno pismo) = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span>³ = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">8</span></span></span><span class=\"step\">P(bar jedno) = 1 − <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">8</span></span> = <span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">8</span></span></span><div class=\"note\">Über das Komplement einfacher als durch Summieren.</div><span class=\"res\">P = <span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">8</span></span></span>"}, {"tag": "Bedingte Wahrscheinlichkeit", "q": "60% Frauen; 20% tragen Brille; 12% sind Frauen mit Brille. Gegeben eine Frau, P(Brille)?", "o": ["0,20", "0,12", "0,32", "0,60"], "c": 0, "sol": "<span class=\"step\">P(N | Ž) = <span class=\"frac\"><span class=\"num\">P(N ∩ Ž)</span><span class=\"den\">P(Ž)</span></span> = <span class=\"frac\"><span class=\"num\">0,12</span><span class=\"den\">0,60</span></span> = 0,20</span><div class=\"note\">Bedingt: Schnitt geteilt durch die Wahrscheinlichkeit der Bedingung.</div><span class=\"res\">P(N | Ž) = 0,20</span>"}, {"tag": "Bayessche Formel", "q": "Maschine A: 60% (2% Ausschuss), B: 40% (5% Ausschuss). Ein Ausschussteil. P(von A)?", "o": ["0,375", "0,60", "0,625", "0,40"], "c": 0, "sol": "<span class=\"step\">P(škart) = 0,6·0,02 + 0,4·0,05 = 0,032</span><span class=\"step\">P(A | škart) = <span class=\"frac\"><span class=\"num\">0,012</span><span class=\"den\">0,032</span></span> = 0,375</span><span class=\"res\">P(A | škart) = 0,375</span>"}, {"tag": "Binomialverteilung", "q": "Ein Schütze trifft mit p = 0,8, schießt 5-mal. Wahrscheinlichkeit für genau 4 Treffer?", "o": ["0,4096", "0,32768", "0,2048", "0,8"], "c": 0, "sol": "<span class=\"step\">P(X = 4) = C(5,4)·0,8⁴·0,2</span><span class=\"step\">= 5 · 0,4096 · 0,2 = 0,4096</span><span class=\"res\">P(X = 4) = 0,4096</span>"}, {"tag": "Poisson-Verteilung", "q": "Im Mittel λ = 3 Anrufe pro Stunde. Wahrscheinlichkeit für genau 2 Anrufe?", "o": ["0,224", "0,149", "0,168", "0,100"], "c": 0, "sol": "<span class=\"step\">P(X = 2) = <span class=\"frac\"><span class=\"num\">3² · e⁻³</span><span class=\"den\">2!</span></span></span><span class=\"step\">= 4,5 · 0,0498 ≈ 0,224</span><span class=\"res\">P(X = 2) ≈ 0,224</span>"}, {"tag": "Erwartungswert und Varianz", "q": "X: 1, 2, 3 mit Wahrscheinlichkeiten 0,5; 0,3; 0,2. Bestimme E(X) und D(X).", "o": ["E(X) = 1,7, D(X) = 0,61", "E(X) = 2, D(X) = 1", "E(X) = 1,7, D(X) = 2,89", "E(X) = 1,5, D(X) = 0,5"], "c": 0, "sol": "<span class=\"step\">E(X) = 1·0,5 + 2·0,3 + 3·0,2 = 1,7</span><span class=\"step\">E(X²) = 3,5</span><span class=\"step\">D(X) = 3,5 − 1,7² = 0,61</span><span class=\"res\">E(X) = 1,7, D(X) = 0,61</span>"}], "fr": [{"tag": "Probabilité classique", "q": "On lance deux dés. Probabilité que la somme soit 7 ?", "o": ["<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">6</span></span>", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">12</span></span>", "<span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">36</span></span>", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">8</span></span>"], "c": 0, "sol": "<span class=\"step\">Povoljni: (1,6),(2,5),(3,4),(4,3),(5,2),(6,1) → 6</span><span class=\"step\">P = <span class=\"frac\"><span class=\"num\">6</span><span class=\"den\">36</span></span> = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">6</span></span></span><div class=\"note\">6 issues favorables sur 36.</div><span class=\"res\">P = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">6</span></span></span>"}, {"tag": "Complément (« au moins un »)", "q": "On lance une pièce 3 fois. Probabilité d'au moins un pile ?", "o": ["<span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">8</span></span>", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">8</span></span>", "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">8</span></span>", "<span class=\"fra ss=\"note\">Condicional: interseção a dividir pela probabilidade da condição.</div><span class=\"res\">P(N | Ž) = 0,20</span>"}, {"tag": "Fórmula de Bayes", "q": "Máquina A: 60% (2% defeito), B: 40% (5% defeito). Tomada uma defeituosa. P(de A)?", "o": ["0,375", "0,60", "0,625", "0,40"], "c": 0, "sol": "<span class=\"step\">P(škart) = 0,6·0,02 + 0,4·0,05 = 0,032</span><span class=\"step\">P(A | škart) = <span class=\"frac\"><span class=\"num\">0,012</span><span class=\"den\">0,032</span></span> = 0,375</span><span class=\"res\">P(A | škart) = 0,375</span>"}, {"tag": "Distribuição binomial", "q": "Um atirador acerta com p = 0,8, dispara 5 vezes. Probabilidade de exatamente 4 acertos?", "o": ["0,4096", "0,32768", "0,2048", "0,8"], "c": 0, "sol": "<span class=\"step\">P(X = 4) = C(5,4)·0,8⁴·0,2</span><span class=\"step\">= 5 · 0,4096 · 0,2 = 0,4096</span><span class=\"res\">P(X = 4) = 0,4096</span>"}, {"tag": "Distribuição de Poisson", "q": "Em média λ = 3 chamadas por hora. Probabilidade de exatamente 2 chamadas?", "o": ["0,224", "0,149", "0,168", "0,100"], "c": 0, "sol": "<span class=\"step\">P(X = 2) = <span class=\"frac\"><span class=\"num\">3² · e⁻³</span><span class=\"den\">2!</span></span></span><span class=\"step\">= 4,5 · 0,0498 ≈ 0,224</span><span class=\"res\">P(X = 2) ≈ 0,224</span>"}, {"tag": "Esperança e variância", "q": "X: 1, 2, 3 com probabilidades 0,5; 0,3; 0,2. Encontra E(X) e D(X).", "o": ["E(X) = 1,7, D(X) = 0,61", "E(X) = 2, D(X) = 1", "E(X) = 1,7, D(X) = 2,89", "E(X) = 1,5, D(X) = 0,5"], "c": 0, "sol": "<span class=\"step\">E(X) = 1·0,5 + 2·0,3 + 3·0,2 = 1,7</span><span class=\"step\">E(X²) = 3,5</span><span class=\"step\">D(X) = 3,5 − 1,7² = 0,61</span><span class=\"res\">E(X) = 1,7, D(X) = 0,61</span>"}]};
var LANG='sr';try{LANG=(localStorage.getItem('mathia_lang')||'sr').toLowerCase();}catch(e){}if(!DATA[LANG])LANG='sr';
var Q=DATA[LANG];
function tr(l){if(!DATA[l])l='sr';LANG=l;Q=DATA[l];try{localStorage.setItem('mathia_lang',l);}catch(e){}document.documentElement.lang=l;document.querySelectorAll('[data-i18n]').forEach(function(e){var k=e.getAttribute('data-i18n');if(I18N[k]&&I18N[k][l])e.textContent=I18N[k][l];});document.querySelectorAll('[data-i18n-html]').forEach(function(e){var k=e.getAttribute('data-i18n-html');if(I18N[k]&&I18N[k][l])e.innerHTML=I18N[k][l];});var sel=document.getElementById('qlang');if(sel)sel.value=l;render();}


  var idx=0, revealed=false, L=["A","B","C","D","E"];
  var qcard=document.getElementById("qcard"),end=document.getElementById("end");
  function pick(k,el){
    var op=document.getElementById("opts"); if(op.classList.contains("locked")) return;
    op.classList.add("locked"); var it=Q[idx], nd=op.children;
    for(var j=0;j<nd.length;j++){ if(j===it.c) nd[j].classList.add("correct"); }
    var fb=document.getElementById("fb");
    if(k===it.c){ fb.className="fb ok"; fb.textContent=I18N.fbOk[LANG]; }
    else{ el.classList.add("wrong"); fb.className="fb no"; fb.textContent=I18N.fbNo[LANG]; }
    document.getElementById("nextBtn").style.display="";
  }
  function render(){
    var it=Q[idx];
    document.getElementById("tag").innerHTML=it.tag;
    document.getElementById("qtxt").innerHTML=it.q;
    var op=document.getElementById("opts"); op.className="opts"; op.innerHTML="";
    (it.o||[]).forEach(function(txt,k){ var b=document.createElement("div"); b.className="opt"; b.innerHTML='<span class="mk">'+L[k]+'</span><span>'+txt+'</span>'; b.addEventListener("click",function(){ pick(k,b); }); op.appendChild(b); });
    var fb=document.getElementById("fb"); fb.className="fb"; fb.textContent="";
    document.getElementById("solbody").innerHTML=it.sol;
    document.getElementById("sol").classList.remove("on");
    document.getElementById("revealBtn").style.display="";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("nextBtn").textContent = (idx===Q.length-1 ? I18N.nextEnd[LANG] : I18N.nextMid[LANG]);
    document.getElementById("prevBtn").style.visibility = idx>0 ? "visible":"hidden";
    document.getElementById("qnum").textContent=I18N.qnum[LANG]+" "+(idx+1)+" / "+Q.length;
    document.getElementById("bar").style.width=((idx)/Q.length*100)+"%";
    revealed=false;
    window.scrollTo({top:0,behavior:"smooth"});
  }
  document.getElementById("revealBtn").addEventListener("click",function(){
    document.getElementById("sol").classList.add("on");
    this.style.display="none";
    document.getElementById("nextBtn").style.display="";
    revealed=true;
  });
  document.getElementById("nextBtn").addEventListener("click",function(){
    if(idx<Q.length-1){idx++;render();}
    else{ // kraj
      document.getElementById("bar").style.width="100%";
      qcard.style.display="none";document.getElementById("qnum").style.display="none";document.querySelector(".prog").style.display="none";
      end.classList.add("on");window.scrollTo({top:0,behavior:"smooth"});
    }
  });
  document.getElementById("prevBtn").addEventListener("click",function(){ if(idx>0){idx--;render();} });
  document.getElementById("againBtn").addEventListener("click",function(){
    idx=0;end.classList.remove("on");qcard.style.display="";document.getElementById("qnum").style.display="";document.querySelector(".prog").style.display="";render();
  });
  var _sel=document.getElementById('qlang');if(_sel){_sel.value=LANG;_sel.addEventListener('change',function(){tr(this.value);});}
  tr(LANG);
})();

<style>
:root{--cream:#FBF6EE;--ink:#5A1024;--ink2:#7A3346;--gold:#C6A05C;--golddk:#A6803C;--goldlt:#F0DCA8;--goldsoft:#F0DCA8;--malina:#B01E48;--malina2:#CC5E7E;--mint:#3FB98C;--muted:#8A7A80;--line:#EFE1DC}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#43303A;min-height:100vh;background:radial-gradient(520px 400px at 104% -6%,#F6E1EC 0,transparent 56%),radial-gradient(500px 380px at -6% 106%,#F7ECD6 0,transparent 58%),var(--cream);overflow-x:hidden}
h1,h2,h3{font-family:'Spectral',Georgia,serif;font-weight:700;margin:0;color:var(--ink);line-height:1.15}
#fall{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fall span{position:absolute;top:-8%;font-family:'Spectral',serif;font-style:italic;color:rgba(198,160,92,.20);animation:fl linear infinite;will-change:transform}
#fall span.m{color:rgba(176,30,72,.15)}
@keyframes fl{0%{transform:translateY(-10vh) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(112vh) rotate(24deg);opacity:0}}
@media(prefers-reduced-motion:reduce){#fall{display:none}}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:14px 18px 40px}
.top{display:flex;align-items:center;gap:12px;padding:6px 2px 14px}
.top .back{color:var(--ink2);text-decoration:none;font-weight:800;font-size:1.15rem}
.top .lang{margin-left:auto;border:1px solid var(--goldlt);border-radius:100px;padding:5px 10px;font-family:inherit;font-weight:800;font-size:.72rem;color:var(--ink);background:#fff;cursor:pointer}
.bar{flex:1;height:14px;border-radius:100px;background:#EEE1D8;overflow:hidden;box-shadow:inset 0 1px 3px rgba(120,60,70,.12)}
.bar>i{display:block;height:100%;width:0;border-radius:100px;background:linear-gradient(90deg,var(--gold),var(--malina));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hearts{font-size:1rem;white-space:nowrap}.streak{font-weight:900;color:var(--gold);font-size:.95rem;white-space:nowrap}
.hero{text-align:center;margin:2px 0 14px}
.hero .free{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(180deg,#FFFBF3,#FBF3E2);border:1px solid var(--goldsoft);border-radius:100px;padding:6px 15px;font-weight:800;font-size:.72rem;color:var(--golddk)}
.card{background:linear-gradient(180deg,#FFFDF9,#FDF3EA);border:1px solid var(--goldlt);border-radius:30px;padding:24px 22px;box-shadow:0 30px 70px -34px rgba(90,16,36,.5);animation:pop .5s cubic-bezier(.2,.9,.2,1);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),#FFF6D6,var(--gold),transparent)}
@keyframes pop{0%{transform:scale(.95) translateY(10px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.eyebrow{text-align:center;font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:.66rem;color:var(--malina)}
.qnum{display:block;text-align:center;margin:2px 0 4px;color:var(--muted);font-weight:800;font-size:.8rem}
.mascot{width:70px;height:70px;margin:4px auto 4px;border-radius:50%;display:grid;place-items:center;font-size:2.15rem;background:radial-gradient(circle at 40% 34%,#FFF3F7,#F6E1EC);border:2px solid var(--goldlt);box-shadow:0 12px 26px -12px rgba(176,30,72,.4);animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.qtag{display:block;text-align:center;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--golddk);margin:2px 0 6px}
.q{font-family:'Spectral',serif;font-weight:700;color:var(--ink);font-size:1.3rem;text-align:center;line-height:1.3;margin:4px 0 6px}
.opts{display:grid;gap:11px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #EFE0D6;border-radius:18px;padding:13px 15px;font-family:'Spectral','Cambria Math',Georgia,serif;font-weight:600;font-size:1.05rem;color:var(--ink);cursor:pointer;transition:transform .12s,border-color .15s,background .15s;text-align:left}
.opt .mk{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:900;font-size:.82rem;color:var(--golddk)}
.opt:hover{transform:translateY(-2px);border-color:var(--gold)}
.opts.locked .opt{cursor:default}
.opt.correct{border-color:var(--mint);background:linear-gradient(180deg,#F1FBF6,#E4F6EE);animation:good .5s}
.opt.correct .mk{border-color:var(--mint);background:var(--mint);color:#fff}
.opt.wrong{border-color:var(--malina);background:linear-gradient(180deg,#FDEFF3,#FBE3EA);animation:shake .4s}
.opt.wrong .mk{border-color:var(--malina);background:var(--malina);color:#fff}
@keyframes good{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:12px;text-align:center;font-weight:900;font-size:1.02rem;min-height:22px}
.fb.ok{color:var(--mint)}.fb.no{color:var(--malina)}
.sol{max-height:0;opacity:0;overflow:hidden;transition:max-height .5s ease,opacity .4s ease,margin .4s ease;margin:0}
.sol.on{max-height:1600px;opacity:1;margin:14px 0 0}
.sol-in{background:linear-gradient(180deg,#FFF7FA,#FBEEF2);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.sol-h{font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:.7rem;color:var(--malina);margin-bottom:6px;text-align:center}
.step{display:block;font-family:'Spectral','Cambria Math',Georgia,serif;font-size:1.06rem;color:var(--ink);white-space:nowrap;overflow-x:auto;margin:10px 0;line-height:1.5}
.res{display:inline-block;margin-top:6px;font-family:'Spectral',serif;font-weight:700;color:var(--malina);border:1.5px solid rgba(176,30,72,.35);border-radius:10px;padding:4px 14px;background:#fff}
.note{color:#7A3346;font-size:.94rem;margin-top:8px}
.rt{border-top:1.5px solid currentColor;padding:0 .12em}
.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .18em}
.frac>span{display:block;line-height:1.12;padding:0 .45em}
.frac .num{border-bottom:1.5px solid currentColor;padding-bottom:.06em}.frac .den{padding-top:.06em}
b{color:var(--ink)}
.cta{display:block;width:100%;margin-top:14px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--malina2),var(--malina));color:#fff;font-weight:900;font-size:1.02rem;padding:14px;border-radius:100px;box-shadow:0 16px 30px -14px rgba(176,30,72,.6);transition:transform .15s;text-decoration:none;text-align:center}
.cta:hover{transform:translateY(-2px)}
.cta.ghost{background:linear-gradient(135deg,#EAD196,#C6A05C);color:#3a2410;box-shadow:0 14px 28px -14px rgba(160,120,40,.7)}
.reveal{display:block;width:100%;margin-top:12px;border:1.5px solid rgba(198,160,92,.5);cursor:pointer;background:#fff;color:var(--golddk);font-weight:800;font-size:.95rem;padding:12px;border-radius:100px;transition:background .15s}
.reveal:hover{background:#FBF3E2}
.hidden{display:none}
.result{text-align:center}.result .big{font-size:3.2rem;margin:4px 0}.result h2{font-size:1.8rem;margin:2px 0}
.result .score{font-weight:900;color:var(--gold);font-size:1.12rem}.result .msg{color:var(--ink2);margin:8px 0 4px}
.rbadge{display:inline-flex;align-items:center;gap:8px;margin:12px auto 4px;background:linear-gradient(135deg,#FFF3D6,#F3DFA6);border:1px solid var(--goldlt);border-radius:100px;padding:10px 18px;font-weight:900;color:#8a6a1e;box-shadow:0 10px 22px -12px rgba(160,120,40,.6)}
.again{margin-top:12px;background:none;border:none;color:var(--ink2);font-weight:800;cursor:pointer;text-decoration:underline}
#conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#conf i{position:absolute;top:-6%;width:10px;height:14px;border-radius:2px;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(560deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

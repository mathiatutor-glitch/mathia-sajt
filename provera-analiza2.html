<style>

  /* topbar */

  .tb a.brand{font-family:'Spectral',serif;font-weight:700;letter-spacing:.12em;color:var(--ink);text-decoration:none}
  .tb a.brand b{color:var(--gold)}
  /* hero */
  .hero{text-align:center;padding:46px 0 8px}
  .eyebrow{font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;color:var(--malina);font-weight:800}
  .hero h1{font-size:clamp(2rem,5vw,2.9rem);margin:12px 0 8px}
  .hero p{color:var(--ink2);max-width:520px;margin:0 auto;font-size:1.05rem}
  .free{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(180deg,#FFFBF3,#FBF3E2);border:1px solid var(--goldsoft);border-radius:100px;padding:6px 15px;font-weight:800;font-size:.74rem;color:var(--golddk);margin-bottom:6px}

  .prog{height:8px;border-radius:8px;background:rgba(198,160,92,.16);overflow:hidden;margin:26px 0 6px}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--goldsoft),var(--gold));width:0;transition:width .4s ease}
  .qnum{font-size:.8rem;color:var(--muted);font-weight:800;letter-spacing:.04em;text-align:center;margin-bottom:14px}
  /* card */
  .card{background:var(--card);border:1px solid rgba(198,160,92,.26);border-radius:24px;padding:32px 30px;box-shadow:0 34px 74px -42px rgba(120,40,60,.5);position:relative;overflow:hidden}
  .card:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),#FFF6D6,var(--gold),transparent)}
  .q-tag{display:inline-block;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--golddk);background:#FBF3E2;border:1px solid var(--goldsoft);border-radius:100px;padding:3px 11px;margin-bottom:12px}
  .q-txt{font-family:'Spectral',serif;font-size:clamp(1.35rem,3.4vw,1.7rem);color:var(--ink);line-height:1.35}
  .opts{display:grid;gap:11px;margin-top:20px}
  .opt{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid rgba(198,160,92,.32);background:#fffdf8;border-radius:14px;padding:14px 16px;font-family:'Spectral','Cambria Math',Georgia,serif;font-size:1.08rem;color:var(--ink);cursor:pointer;transition:transform .14s,border-color .14s,background .14s}

  .opt .mk{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:800;font-size:.82rem;color:var(--golddk)}

  .opt.wrong{border-color:#D08;opacity:.85;background:#FDF2F6}

  .fb{text-align:center;font-weight:800;font-size:.95rem;margin-top:14px;min-height:1.2em}
  .fb.ok{color:#2E9E6B}.fb.no{color:var(--malina)}
  .sol{max-height:0;opacity:0;overflow:hidden;transition:max-height .5s ease,opacity .4s ease,margin .4s ease;margin:0}
  .sol.on{max-height:1400px;opacity:1;margin:20px 0 0}
  .sol-in{background:linear-gradient(180deg,#FFF7FA,#FBEEF2);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  .sol-h{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.72rem;color:var(--malina);margin-bottom:8px}
  .step{display:block;font-family:'Spectral','Cambria Math',Georgia,serif;font-size:1.1rem;color:var(--ink);white-space:nowrap;overflow-x:auto;margin:11px 0;line-height:1.5}
  .res{display:inline-block;margin-top:6px;font-family:'Spectral',serif;font-weight:700;color:var(--malina);border:1.5px solid rgba(176,30,72,.35);border-radius:10px;padding:4px 14px;background:#fff}
  .note{color:#5C3B49;font-size:.96rem;margin-top:8px}
  /* math bits */
  .frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .18em}
  .frac>span{display:block;line-height:1.12;padding:0 .45em}
  .frac .num{border-bottom:1.5px solid currentColor;padding-bottom:.06em}
  .frac .den{padding-top:.06em}
  .lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .18em}
  .lim .und{font-size:.58em;margin-top:.14em;font-style:normal;white-space:nowrap}
  b{color:var(--ink)}
  /* controls */
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  .btn{display:inline-flex;align-items:center;gap:9px;border-radius:100px;padding:13px 26px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.94rem;cursor:pointer;text-decoration:none;border:1.5px solid transparent;transition:transform .16s,box-shadow .16s,background .16s}
  .btn-gold{background:linear-gradient(110deg,#EAD196,#C6A05C 45%,#F4E3B4 55%,#C6A05C 75%,#EAD196);background-size:240% auto;color:#3a2410;box-shadow:0 16px 30px -14px rgba(160,120,40,.7);animation:shim 7s linear infinite}

  .btn-gold:hover{transform:translateY(-2px)}
  .btn-ghost{background:transparent;border-color:rgba(198,160,92,.5);color:var(--golddk)}
  .btn-ghost:hover{background:#FBF3E2}
  .btn-mal{background:linear-gradient(160deg,#CC5E7E,#B01E48);color:#fff;box-shadow:0 14px 28px -12px rgba(176,30,72,.5)}
  .btn-mal:hover{transform:translateY(-2px)}
  .backbtn{background:none;border:none;color:var(--muted);font-family:inherit;font-weight:700;cursor:pointer;font-size:.86rem}
  /* end */
  #end{display:none;text-align:center}
  #end.on{display:block}
  #end .big{font-size:clamp(2rem,5vw,2.8rem);margin:6px 0 8px;background:linear-gradient(100deg,#9C7838,#E7D2A2 30%,#FFF7E2 48%,#E7D2A2 66%,#C6A05C);-webkit-background-clip:text;background-clip:text;color:transparent}
  .mbox{margin:22px 0 0;background:linear-gradient(160deg,#5A1024,#3A0B18);color:#fff;border-radius:20px;padding:26px;position:relative;overflow:hidden}
  .mbox:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

  .pf{margin-top:56px;text-align:center;padding:34px 22px;color:var(--muted);font-size:.8rem;border-top:1px solid var(--goldsoft);background:linear-gradient(180deg,#FBF6EE,#F5EAD9)}

</style>

var DATA={"sr": [{"tag": "Konvergencija reda · Dalamber", "q": "Izračunaj — red ∑ <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">n!</span></span> konvergira?", "o": ["Konvergira", "Divergira", "Uslovno konvergira", "Ne može se odrediti"], "c": 0, "sol": "<span class=\"step\"><span class=\"frac\"><span class=\"num\">a<sub>n+1</sub></span><span class=\"den\">a<sub>n</sub></span></span> = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">n+1</span></span></span><span class=\"step\"><span class=\"lim\">lim<span class=\"und\">n→∞</span></span> <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">n+1</span></span> = 0 &lt; 1</span><div class=\"note\">Dalamberov kriterijum: granica &lt; 1 → red konvergira.</div><span class=\"res\">Konvergira</span>"}, {"tag": "Poluprečnik konvergencije", "q": "Nađi poluprečnik R za ∑ <span class=\"frac\"><span class=\"num\">x<sup>n</sup></span><span class=\"den\">n</span></span>.", "o": ["R = 1", "R = 0", "R = ∞", "R = 2"], "c": 0, "sol": "<span class=\"step\">R = <span class=\"lim\">lim<span class=\"und\">n→∞</span></span> <span class=\"frac\"><span class=\"num\">n+1</span><span class=\"den\">n</span></span> → 1</span><span class=\"res\">R = 1</span>"}, {"tag": "Parcijalni izvodi", "q": "Za f(x, y) = x²y + 3y³ nađi f<sub>x</sub> i f<sub>y</sub>.", "o": ["f<sub>x</sub> = 2xy, f<sub>y</sub> = x² + 9y²", "f<sub>x</sub> = x²y, f<sub>y</sub> = 9y²", "f<sub>x</sub> = 2x, f<sub>y</sub> = 9y", "f<sub>x</sub> = 2xy, f<sub>y</sub> = x² + 3y²"], "c": 0, "sol": "<span class=\"step\">f<sub>x</sub> = 2xy</span><span class=\"step\">f<sub>y</sub> = x² + 9y²</span><div class=\"note\">Po jednoj promenljivoj, druga je konstanta.</div><span class=\"res\">f<sub>x</sub> = 2xy, f<sub>y</sub> = x² + 9y²</span>"}, {"tag": "Ekstrem funkcije dve promenljive", "q": "Nađi ekstrem f(x, y) = x² + y² − 4x.", "o": ["min u (2, 0), vrednost −4", "max u (2, 0)", "sedlo u (2, 0)", "min u (0, 0)"], "c": 0, "sol": "<span class=\"step\">f<sub>x</sub> = 2x − 4 = 0 → x = 2; f<sub>y</sub> = 2y = 0 → y = 0</span><span class=\"step\">D = 4 &gt; 0, f<sub>xx</sub> = 2 &gt; 0</span><div class=\"note\">D &gt; 0 i f<sub>xx</sub> &gt; 0 → minimum.</div><span class=\"res\">min (2, 0), f = −4</span>"}, {"tag": "Dvojni integral", "q": "Izračunaj ∬ nad 0 ≤ x ≤ 1, 0 ≤ y ≤ 1 funkcije f = x + y.", "o": ["1", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span>", "2", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">4</span></span>"], "c": 0, "sol": "<span class=\"step\">∫<sub>0</sub><sup>1</sup>(x + <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span>) dx = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span> + <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span></span><span class=\"res\">= 1</span>"}, {"tag": "Polarne koordinate", "q": "Izračunaj površinu kruga x² + y² ≤ 1 (∬ f = 1).", "o": ["π", "2π", "<span class=\"frac\"><span class=\"num\">π</span><span class=\"den\">2</span></span>", "1"], "c": 0, "sol": "<span class=\"step\">∬ r dr dφ = 2π · <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span> = π</span><div class=\"note\">Površina jediničnog kruga je π.</div><span class=\"res\">= π</span>"}, {"tag": "Furijeov koeficijent", "q": "Za f(x) = x na (−π, π) nađi a<sub>0</sub>.", "o": ["0", "π", "1", "2π"], "c": 0, "sol": "<span class=\"step\">a<sub>0</sub> = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">π</span></span> ∫<sub>−π</sub><sup>π</sup> x dx = 0</span><div class=\"note\">x je neparna funkcija → integral po simetričnom intervalu je 0.</div><span class=\"res\">a<sub>0</sub> = 0</span>"}], "en": [{"tag": "Series convergence · ratio test", "q": "Compute — does the series ∑ <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">n!</span></span> converge?", "o": ["Converges", "Diverges", "Conditionally converges", "Can't be determined"], "c": 0, "sol": "<span class=\"step\"><span class=\"frac\"><span class=\"num\">a<sub>n+1</sub></span><span class=\"den\">a<sub>n</sub></span></span> = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">n+1</span></span></span><span class=\"step\"><span class=\"lim\">lim<span class=\"und\">n→∞</span></span> <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">n+1</span></span> = 0 &lt; 1</span><div class=\"note\">Ratio test: limit &lt; 1 → the series converges.</div><span class=\"res\">Converges</span>"}, {"tag": "Radius of convergence", "q": "Find the radius R of ∑ <span class=\"frac\"><span class=\"num\">x<sup>n</sup></span><span class=\"den\">n</span></span>.", "o": ["R = 1", "R = 0", "R = ∞", "R = 2"], "c": 0, "sol": "<span class=\"step\">R = <span class=\"lim\">lim<span class=\"und\">n→∞</span></span> <span class=\"frac\"><span class=\"num\">n+1</span><span class=\"den\">n</span></span> → 1</span><span class=\"res\">R = 1</span>"}, {"tag": "Partial derivatives", "q": "For f(x, y) = x²y + 3y³ find f<sub>x</sub> and f<sub>y</sub>.", "o": ["f<sub>x</sub> = 2xy, f<sub>y</sub> = x² + 9y²", "f<sub>x</sub> = x²y, f<sub>y</sub> = 9y²", "f<sub>x</sub> = 2x, f<sub>y</sub> = 9y", "f<sub>x</sub> = 2xy, f<sub>y</sub> = x² + 3y²"], "c": 0, "sol": "<span class=\"step\">f<sub>x</sub> = 2xy</span><span class=\"step\">f<sub>y</sub> = x² + 9y²</span><div class=\"note\">Differentiate w.r.t. one variable, the other is constant.</div><span class=\"res\">f<sub>x</sub> = 2xy, f<sub>y</sub> = x² + 9y²</span>"}, {"tag": "Extremum of f(x,y)", "q": "Find the extremum of f(x, y) = x² + y² − 4x.", "o": ["min at (2, 0), value −4", "max at (2, 0)", "saddle at (2, 0)", "min at (0, 0)"], "c": 0, "sol": "<span class=\"step\">f<sub>x</sub> = 2x − 4 = 0 → x = 2; f<sub>y</sub> = 2y = 0 → y = 0</span><span class=\"step\">D = 4 &gt; 0, f<sub>xx</sub> = 2 &gt; 0</span><div class=\"note\">D &gt; 0 and f<sub>xx</sub> &gt; 0 → minimum.</div><span class=\"res\">min (2, 0), f = −4</span>"}, {"tag": "Double integral", "q": "Compute ∬ of f = x + y over 0 ≤ x ≤ 1, 0 ≤ y ≤ 1.", "o": ["1", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span>", "2", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">4</span></span>"], "c": 0, "sol": "<span class=\"step\">∫<sub>0</sub><sup>1</sup>(x + <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span>) dx = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span> + <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span></span><span class=\"res\">= 1</span>"}, {"tag": "Polar coordinates", "q": "Compute the area of the disk x² + y² ≤ 1 (∬ f = 1).", "o": ["π", "2π", "<span class=\"frac\"><span class=\"num\">π</span><span class=\"den\">2</span></span>", "1"], "c": 0, "sol": "<span class=\"step\">∬ r dr dφ = 2π · <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span> = π</span><div class=\"note\">The area of the unit disk is π.</div><span class=\"res\">= π</span>"}, {"tag": "Fourier coefficient", "q": "For f(x) = x on (−π, π) find a<sub>0</sub>.", "o": ["0", "π", "1", "2π"], "c": 0, "sol": "<span class=\"step\">a<sub>0</sub> = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">π</span></span> ∫<sub>−π</sub><sup>π</sup> x dx = 0</span><div class=\"note\">x is odd → its integral over a symmetric interval is 0.</div><span class=\"res\">a<sub>0</sub> = 0</span>"}], "de": [{"tag": "Reihenkonvergenz · Quotientenkriterium", "q": "Berechne — does the series ∑ <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">n!</span></span> converge?", "o": ["Konvergiert", "Divergiert", "Bedingt konvergent", "Nicht bestimmbar"], "c": 0, "sol": "<span class=\"step\"><span class=\"frac\"><span class=\"num\">a<sub>n+1</sub></span><span class=\"den\">a<sub>n</sub></span></span> = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">n+1</span></span></span><span class=\"step\"><span class=\"lim\">lim<span class=\"und\">n→∞</span></span> <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">n+1</span></span> = 0 &lt; 1</span><div class=\"note\">Quotientenkriterium: Grenzwert &lt; 1 → Reihe konvergiert.</div><span class=\"res\">Konvergiert</span>"}, {"tag": "Konvergenzradius", "q": "Bestimme the radius R of ∑ <span class=\"frac\"><span class=\"num\">x<sup>n</sup></span><span class=\"den\">n</span></span>.", "o": ["R = 1", "R = 0", "R = ∞", "R = 2"], "c": 0, "sol": "<span class=\"step\">R = <span class=\"lim\">lim<span class=\"und\">n→∞</span></span> <span class=\"frac\"><span class=\"num\">n+1</span><span class=\"den\">n</span></span> → 1</span><span class=\"res\">R = 1</span>"}, {"tag": "Partielle Ableitungen", "q": "Für f(x, y) = x²y + 3y³ bestimme f<sub>x</sub> und f<sub>y</sub>.", "o": ["f<sub>x</sub> = 2xy, f<sub>y</sub> = x² + 9y²", "f<sub>x</sub> = x²y, f<sub>y</sub> = 9y²", "f<sub>x</sub> = 2x, f<sub>y</sub> = 9y", "f<sub>x</sub> = 2xy, f<sub>y</sub> = x² + 3y²"], "c": 0, "sol": "<span class=\"step\">f<sub>x</sub> = 2xy</span><span class=\"step\">f<sub>y</sub> = x² + 9y²</span><div class=\"note\">Nach einer Variablen ableiten, die andere ist konstant.</div><span class=\"res\">f<sub>x</sub> = 2xy, f<sub>y</sub> = x² + 9y²</span>"}, {"tag": "Extremum von f(x,y)", "q": "Bestimme das Extremum von f(x, y) = x² + y² − 4x.", "o": ["Min bei (2, 0), Wert −4", "Max bei (2, 0)", "Sattel bei (2, 0)", "Min bei (0, 0)"], "c": 0, "sol": "<span class=\"step\">f<sub>x</sub> = 2x − 4 = 0 → x = 2; f<sub>y</sub> = 2y = 0 → y = 0</span><span class=\"step\">D = 4 &gt; 0, f<sub>xx</sub> = 2 &gt; 0</span><div class=\"note\">D &gt; 0 und f<sub>xx</sub> &gt; 0 → Minimum.</div><span class=\"res\">min (2, 0), f = −4</span>"}, {"tag": "Doppelintegral", "q": "Berechne ∬ of f = x + y over 0 ≤ x ≤ 1, 0 ≤ y ≤ 1.", "o": ["1", "<span cla sub> = x²y, f<sub>y</sub> = 9y²", "f<sub>x</sub> = 2x, f<sub>y</sub> = 9y", "f<sub>x</sub> = 2xy, f<sub>y</sub> = x² + 3y²"], "c": 0, "sol": "<span class=\"step\">f<sub>x</sub> = 2xy</span><span class=\"step\">f<sub>y</sub> = x² + 9y²</span><div class=\"note\">Deriva em relação a uma variável, a outra é constante.</div><span class=\"res\">f<sub>x</sub> = 2xy, f<sub>y</sub> = x² + 9y²</span>"}, {"tag": "Extremo de f(x,y)", "q": "Encontra o extremo de f(x, y) = x² + y² − 4x.", "o": ["mín em (2, 0), valor −4", "máx em (2, 0)", "sela em (2, 0)", "mín em (0, 0)"], "c": 0, "sol": "<span class=\"step\">f<sub>x</sub> = 2x − 4 = 0 → x = 2; f<sub>y</sub> = 2y = 0 → y = 0</span><span class=\"step\">D = 4 &gt; 0, f<sub>xx</sub> = 2 &gt; 0</span><div class=\"note\">D &gt; 0 e f<sub>xx</sub> &gt; 0 → mínimo.</div><span class=\"res\">min (2, 0), f = −4</span>"}, {"tag": "Integral duplo", "q": "Calcula ∬ of f = x + y over 0 ≤ x ≤ 1, 0 ≤ y ≤ 1.", "o": ["1", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span>", "2", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">4</span></span>"], "c": 0, "sol": "<span class=\"step\">∫<sub>0</sub><sup>1</sup>(x + <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span>) dx = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span> + <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span></span><span class=\"res\">= 1</span>"}, {"tag": "Coordenadas polares", "q": "Calcula the area of the disk x² + y² ≤ 1 (∬ f = 1).", "o": ["π", "2π", "<span class=\"frac\"><span class=\"num\">π</span><span class=\"den\">2</span></span>", "1"], "c": 0, "sol": "<span class=\"step\">∬ r dr dφ = 2π · <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span> = π</span><div class=\"note\">A área do disco unitário é π.</div><span class=\"res\">= π</span>"}, {"tag": "Coeficiente de Fourier", "q": "Para f(x) = x em (−π, π) encontra a<sub>0</sub>.", "o": ["0", "π", "1", "2π"], "c": 0, "sol": "<span class=\"step\">a<sub>0</sub> = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">π</span></span> ∫<sub>−π</sub><sup>π</sup> x dx = 0</span><div class=\"note\">x é ímpar → o integral num intervalo simétrico é 0.</div><span class=\"res\">a<sub>0</sub> = 0</span>"}]};
var LANG='sr';try{LANG=(localStorage.getItem('mathia_lang')||'sr').toLowerCase();}catch(e){}if(!DATA[LANG])LANG='sr';
var Q=DATA[LANG];
function tr(l){if(!DATA[l])l='sr';LANG=l;Q=DATA[l];try{localStorage.setItem('mathia_lang',l);}catch(e){}document.documentElement.lang=l;document.querySelectorAll('[data-i18n]').forEach(function(e){var k=e.getAttribute('data-i18n');if(I18N[k]&&I18N[k][l])e.textContent=I18N[k][l];});document.querySelectorAll('[data-i18n-html]').forEach(function(e){var k=e.getAttribute('data-i18n-html');if(I18N[k]&&I18N[k][l])e.innerHTML=I18N[k][l];});var sel=document.getElementById('qlang');if(sel)sel.value=l;render();}


  var idx=0, revealed=false, L=["A","B","C","D","E"];
  var qcard=document.getElementById("qcard"),end=document.getElementById("end");
  function pick(k,el){
    var op=document.getElementById("opts"); if(op.classList.contains("locked")) return;
    op.classList.add("locked"); var it=Q[idx], nd=op.children;
    for(var j=0;j<nd.length;j++){ if(j===it.c) nd[j].classList.add("correct"); }
    var fb=document.getElementById("fb");
    if(k===it.c){ fb.className="fb ok"; fb.textContent=I18N.fbOk[LANG]; }
    else{ el.classList.add("wrong"); fb.className="fb no"; fb.textContent=I18N.fbNo[LANG]; }
    document.getElementById("nextBtn").style.display="";
  }
  function render(){
    var it=Q[idx];
    document.getElementById("tag").innerHTML=it.tag;
    document.getElementById("qtxt").innerHTML=it.q;
    var op=document.getElementById("opts"); op.className="opts"; op.innerHTML="";
    (it.o||[]).forEach(function(txt,k){ var b=document.createElement("div"); b.className="opt"; b.innerHTML='<span class="mk">'+L[k]+'</span><span>'+txt+'</span>'; b.addEventListener("click",function(){ pick(k,b); }); op.appendChild(b); });
    var fb=document.getElementById("fb"); fb.className="fb"; fb.textContent="";
    document.getElementById("solbody").innerHTML=it.sol;
    document.getElementById("sol").classList.remove("on");
    document.getElementById("revealBtn").style.display="";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("nextBtn").textContent = (idx===Q.length-1 ? I18N.nextEnd[LANG] : I18N.nextMid[LANG]);
    document.getElementById("prevBtn").style.visibility = idx>0 ? "visible":"hidden";
    document.getElementById("qnum").textContent=I18N.qnum[LANG]+" "+(idx+1)+" / "+Q.length;
    document.getElementById("bar").style.width=((idx)/Q.length*100)+"%";
    revealed=false;
    window.scrollTo({top:0,behavior:"smooth"});
  }
  document.getElementById("revealBtn").addEventListener("click",function(){
    document.getElementById("sol").classList.add("on");
    this.style.display="none";
    document.getElementById("nextBtn").style.display="";
    revealed=true;
  });
  document.getElementById("nextBtn").addEventListener("click",function(){
    if(idx<Q.length-1){idx++;render();}
    else{ // kraj
      document.getElementById("bar").style.width="100%";
      qcard.style.display="none";document.getElementById("qnum").style.display="none";document.querySelector(".prog").style.display="none";
      end.classList.add("on");window.scrollTo({top:0,behavior:"smooth"});
    }
  });
  document.getElementById("prevBtn").addEventListener("click",function(){ if(idx>0){idx--;render();} });
  document.getElementById("againBtn").addEventListener("click",function(){
    idx=0;end.classList.remove("on");qcard.style.display="";document.getElementById("qnum").style.display="";document.querySelector(".prog").style.display="";render();
  });
  var _sel=document.getElementById('qlang');if(_sel){_sel.value=LANG;_sel.addEventListener('change',function(){tr(this.value);});}
  tr(LANG);
})();
</script>

<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mathia — Provera znanja · Fizika 2 (srednja) 🎯</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--cream:#FBF6EE;--ink:#5A1024;--ink2:#7A3346;--gold:#C6A05C;--goldlt:#F0DCA8;--malina:#B01E48;--malina2:#CC5E7E;--mint:#3FB98C;--muted:#8A7A80}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#43303A;min-height:100vh;
 background:radial-gradient(520px 400px at 104% -6%,#F6E1EC 0,transparent 56%),radial-gradient(500px 380px at -6% 106%,#F7ECD6 0,transparent 58%),var(--cream);overflow-x:hidden}
#fall{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fall span{position:absolute;top:-8%;font-family:'Spectral',serif;font-style:italic;color:rgba(198,160,92,.22);animation:fl linear infinite}
#fall span.m{color:rgba(176,30,72,.16)}
@keyframes fl{0%{transform:translateY(-10vh) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(112vh) rotate(24deg);opacity:0}}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:14px 18px 40px}
.top{display:flex;align-items:center;gap:12px;padding:6px 2px 12px}
.top .back{color:var(--ink2);text-decoration:none;font-weight:800;font-size:1.1rem}
.top .lang{margin-left:auto;border:1px solid var(--goldlt);border-radius:100px;padding:5px 10px;font-family:inherit;font-weight:800;font-size:.72rem;color:var(--ink);background:#fff}
.bar{flex:1;height:14px;border-radius:100px;background:#EEE1D8;overflow:hidden;box-shadow:inset 0 1px 3px rgba(120,60,70,.12)}
.bar>i{display:block;height:100%;width:0;border-radius:100px;background:linear-gradient(90deg,var(--gold),var(--malina));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hearts{font-size:1rem;white-space:nowrap}.streak{font-weight:900;color:var(--gold);font-size:.95rem;white-space:nowrap}
.card{background:linear-gradient(180deg,#FFFDF9,#FDF3EA);border:1px solid var(--goldlt);border-radius:30px;padding:24px 22px;box-shadow:0 30px 70px -34px rgba(90,16,36,.5);animation:pop .5s cubic-bezier(.2,.9,.2,1)}
@keyframes pop{0%{transform:scale(.92) translateY(12px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.eyebrow{text-align:center;font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:.66rem;color:var(--malina)}
.qnum{display:block;text-align:center;margin:2px 0 6px;color:var(--muted);font-weight:800;font-size:.8rem}
.mascot{width:74px;height:74px;margin:2px auto 6px;border-radius:50%;display:grid;place-items:center;font-size:2.3rem;background:radial-gradient(circle at 40% 34%,#FFF3F7,#F6E1EC);border:2px solid var(--goldlt);box-shadow:0 12px 26px -12px rgba(176,30,72,.4);animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.q{font-family:'Spectral',serif;font-weight:700;color:var(--ink);font-size:1.45rem;text-align:center;line-height:1.25;margin:4px 0}
.qhint{text-align:center;color:var(--ink2);font-size:.9rem;margin:2px 0 14px}
.opts{display:grid;gap:11px}
.opt{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #EFE0D6;border-radius:18px;padding:13px 16px;font-weight:800;font-size:1.05rem;color:var(--ink);cursor:pointer;transition:transform .12s,border-color .15s,background .15s;text-align:left}
.opt .em{font-size:1.3rem}
.opt:hover{transform:translateY(-2px);border-color:var(--gold)}
.opt.correct{border-color:var(--mint);background:linear-gradient(180deg,#F1FBF6,#E4F6EE);animation:good .5s}
.opt.wrong{border-color:var(--malina);background:linear-gradient(180deg,#FDEFF3,#FBE3EA);animation:shake .4s}
@keyframes good{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:12px;text-align:center;font-weight:900;font-size:1.05rem;min-height:24px}
.fb.ok{color:var(--mint)}.fb.no{color:var(--malina)}
.cta{display:block;width:100%;margin-top:14px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--malina2),var(--malina));color:#fff;font-weight:900;font-size:1.05rem;padding:15px;border-radius:100px;box-shadow:0 16px 30px -14px rgba(176,30,72,.6);transition:transform .15s}
.cta:hover{transform:translateY(-2px)}
.hidden{display:none}
.result{text-align:center}.result .big{font-size:3.4rem;margin:4px 0}.result h2{font-family:'Spectral',serif;color:var(--ink);font-size:1.9rem;margin:2px 0}
.result .score{font-weight:900;color:var(--gold);font-size:1.15rem}.result .msg{color:var(--ink2);margin:8px 0 4px}
.badge{display:inline-flex;align-items:center;gap:8px;margin:12px auto 4px;background:linear-gradient(135deg,#FFF3D6,#F3DFA6);border:1px solid var(--goldlt);border-radius:100px;padding:10px 18px;font-weight:900;color:#8a6a1e;box-shadow:0 10px 22px -12px rgba(160,120,40,.6)}
.again{margin-top:12px;background:none;border:none;color:var(--ink2);font-weight:800;cursor:pointer;text-decoration:underline}
#conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#conf i{position:absolute;top:-6%;width:10px;height:14px;border-radius:2px;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(560deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="fall" aria-hidden="true"></div>
<div id="conf" aria-hidden="true"></div>
<main class="wrap">
  <div class="top">
    <a class="back" href="srednja-fizika-2.html">←</a>
    <div class="bar"><i id="prog"></i></div>
    <span class="hearts" id="hearts">❤️❤️❤️</span>
    <span class="streak" id="streak">🔥 0</span>
    <select class="lang" id="lang" aria-label="Jezik"><option value="sr">SR</option><option value="en">EN</option><option value="de">DE</option><option value="fr">FR</option><option value="es">ES</option><option value="it">IT</option><option value="ru">RU</option><option value="pt">PT</option></select>
  </div>
  <section class="card" id="quiz">
    <div class="eyebrow" id="eyebrow"></div>
    <span class="qnum" id="qnum"></span>
    <div class="mascot" id="mascot">🦉</div>
    <h2 class="q" id="q"></h2>
    <p class="qhint" id="qhint"></p>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
    <button class="cta hidden" id="next"></button>
  </section>
  <section class="card result hidden" id="report">
    <div class="big" id="rbig">🎉</div>
    <h2 id="rtitle"></h2>
    <div class="score" id="rscore"></div>
    <p class="msg" id="rmsg"></p>
    <div class="badge" id="rbadge"></div>
    <button class="cta" id="toClone"></button>
    <br><button class="again" id="again"></button>
  </section>
</main>
<script>

t proportional zur absoluten Temperatur (Ek = (3/2)·k·T).", "fr": "Rappel : l'énergie cinétique moyenne des molécules est proportionnelle à la température absolue (Ek = (3/2)·k·T).", "es": "Recuerda: la energía cinética media de las moléculas es proporcional a la temperatura absoluta (Ek = (3/2)·k·T).", "it": "Ricorda: l'energia cinetica media delle molecole è proporzionale alla temperatura assoluta (Ek = (3/2)·k·T).", "ru": "Вспомните: средняя кинетическая энергия молекул пропорциональна абсолютной температуре (Ek = (3/2)·k·T).", "pt": "Lembre-se: a energia cinética média das moléculas é proporcional à temperatura absoluta (Ek = (3/2)·k·T)."}, "opts": [{"em": "🔥", "t": {"sr": "Smanjuje se", "en": "It decreases", "de": "Sie nimmt ab", "fr": "Elle diminue", "es": "Disminuye", "it": "Diminuisce", "ru": "Она уменьшается", "pt": "Diminui"}}, {"em": "✨", "t": {"sr": "Ostaje nepromenjena", "en": "It stays unchanged", "de": "Sie bleibt unverändert", "fr": "Elle reste inchangée", "es": "Permanece igual", "it": "Rimane invariata", "ru": "Она остаётся неизменной", "pt": "Permanece inalterada"}}, {"em": "🌟", "t": {"sr": "Povećava se srazmerno apsolutnoj temperaturi", "en": "It increases proportionally to the absolute temperature", "de": "Sie steigt proportional zur absoluten Temperatur", "fr": "Elle augmente proportionnellement à la température absolue", "es": "Aumenta proporcionalmente a la temperatura absoluta", "it": "Aumenta proporzionalmente alla temperatura assoluta", "ru": "Она увеличивается пропорционально абсолютной температуре", "pt": "Aumenta proporcionalmente à temperatura absoluta"}}, {"em": "💫", "t": {"sr": "Postaje jednaka nuli", "en": "It becomes equal to zero", "de": "Sie wird gleich null", "fr": "Elle devient égale à zéro", "es": "Se vuelve igual a cero", "it": "Diventa uguale a zero", "ru": "Она становится равной нулю", "pt": "Torna-se igual a zero"}}], "c": 2}, {"q": {"sr": "Prvi zakon termodinamike glasi Q = ΔU + A. Šta predstavlja veličina A u ovoj jednačini?", "en": "The first law of thermodynamics states Q = ΔU + A. What does the quantity A represent in this equation?", "de": "Der erste Hauptsatz der Thermodynamik lautet Q = ΔU + A. Was stellt die Größe A in dieser Gleichung dar?", "fr": "Le premier principe de la thermodynamique s'écrit Q = ΔU + A. Que représente la grandeur A dans cette équation ?", "es": "La primera ley de la termodinámica dice Q = ΔU + A. ¿Qué representa la magnitud A en esta ecuación?", "it": "Il primo principio della termodinamica si esprime come Q = ΔU + A. Cosa rappresenta la grandezza A in questa equazione?", "ru": "Первый закон термодинамики записывается как Q = ΔU + A. Что означает величина A в этом уравнении?", "pt": "A primeira lei da termodinâmica é Q = ΔU + A. O que representa a grandeza A nesta equação?"}, "hint": {"sr": "Q je dovedena toplota, ΔU je promena unutrašnje energije gasa.", "en": "Q is the heat supplied, ΔU is the change in internal energy of the gas.", "de": "Q ist die zugeführte Wärme, ΔU ist die Änderung der inneren Energie des Gases.", "fr": "Q est la chaleur fournie, ΔU est la variation de l'énergie interne du gaz.", "es": "Q es el calor suministrado, ΔU es el cambio de energía interna del gas.", "it": "Q è il calore fornito, ΔU è la variazione dell'energia interna del gas.", "ru": "Q — подведённое тепло, ΔU — изменение внутренней энергии газа.", "pt": "Q é o calor fornecido, ΔU é a variação da energia interna do gás."}, "opts": [{"em": "🔥", "t": {"sr": "Rad koji gas izvrši nad okolinom", "en": "The work done by the gas on its surroundings", "de": "Die vom Gas an der Umgebung verrichtete Arbeit", "fr": "Le travail effectué par le gaz sur le milieu extérieur", "es": "El trabajo realizado por el gas sobre el entorno", "it": "Il lavoro compiuto dal gas sull'ambiente circostante", "ru": "Работа, совершаемая газом над окружающей средой", "pt": "O trabalho realizado pelo gás sobre o ambiente"}}, {"em": "✨", "t": {"sr": "Unutrašnja energija gasa", "en": "The internal energy of the gas", "de": "Die innere Energie des Gases", "fr": "L'énergie interne du gaz", "es": "La energía interna del gas", "it": "L'energia interna del gas", "ru": "Внутренняя энергия газа", "pt": "A energia interna do gás"}}, {"em": "🌟", "t": {"sr": "Ukupna količina toplote", "en": "The total amount of heat", "de": "Die gesamte Wärmemenge", "fr": "La quantité totale de chaleur", "es": "La cantidad total de calor", "it": "La quantità totale di calore", "ru": "Общее количество теплоты", "pt": "A quantidade total de calor"}}, {"em": "💫", "t": {"sr": "Temperatura gasa u kelvinima", "en": "The temperature of the gas in kelvins", "de": "Die Temperatur des Gases in Kelvin", "fr": "La température du gaz en kelvins", "es": "La temperatura del gas en kelvin", "it": "La temperatura del gas in kelvin", "ru": "Температура газа в кельвинах", "pt": "A temperatura do gás em kelvins"}}], "c": 0}, {"q": {"sr": "Jednačina stanja idealnog gasa glasi pV = nRT. Šta predstavlja slovo R u ovoj jednačini?", "en": "The ideal gas equation of state is pV = nRT. What does the letter R represent in this equation?", "de": "Die Zustandsgleichung des idealen Gases lautet pV = nRT. Was stellt der Buchstabe R in dieser Gleichung dar?", "fr": "L'équation d'état du gaz parfait s'écrit pV = nRT. Que représente la lettre R dans cette équation ?", "es": "La ecuación de estado del gas ideal es pV = nRT. ¿Qué representa la letra R en esta ecuación?", "it": "L'equazione di stato del gas ideale è pV = nRT. Cosa rappresenta la lettera R in questa equazione?", "ru": "Уравнение состояния идеального газа: pV = nRT. Что обозначает буква R в этом уравнении?", "pt": "A equação de estado do gás ideal é pV = nRT. O que representa a letra R nesta equação?"}, "hint": {"sr": "R je ista konstanta za sve idealne gasove, R ≈ 8,31 J/(mol·K).", "en": "R is the same constant for all ideal gases, R ≈ 8.31 J/(mol·K).", "de": "R ist für alle idealen Gase dieselbe Konstante, R ≈ 8,31 J/(mol·K).", "fr": "R est la même constante p  if(pct>=0.8){$('rbig').textContent='🏆';$('rtitle').textContent=T(D.C.rwin);$('rmsg').textContent=T(D.C.mwin);$('rbadge').style.display='';bigConf();}
 else if(pct>=0.5){$('rbig').textContent='🌟';$('rtitle').textContent=T(D.C.rmid);$('rmsg').textContent=T(D.C.mmid);$('rbadge').style.display='';bigConf();}
 else{$('rbig').textContent='🌱';$('rtitle').textContent=T(D.C.rlow);$('rmsg').textContent=T(D.C.mlow);$('rbadge').style.display='none';}
 chrome();
}
$('again').onclick=function(){i=0;score=0;hearts=3;streak=0;$('hearts').textContent='❤️❤️❤️';$('streak').textContent='🔥 0';$('report').classList.add('hidden');$('quiz').classList.remove('hidden');render();};
$('toClone').onclick=function(){location.href=D.back;};
function spawnConf(n){var box=$('conf');var cols=['#C6A05C','#B01E48','#CC5E7E','#F0DCA8','#3FB98C','#E7D2A2'];for(var k=0;k<n;k++){var s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.background=cols[k%cols.length];s.style.animationDuration=(1.6+Math.random()*1.4)+'s';s.style.transform='rotate('+Math.random()*360+'deg)';if(Math.random()<.25)s.style.borderRadius='50%';box.appendChild(s);setTimeout(function(el){return function(){el.remove()}}(s),3200);}}
function miniConf(){spawnConf(14)}
function bigConf(){spawnConf(90);var h=['💛','🌸','✨','🎉'];for(var k=0;k<16;k++){(function(k){setTimeout(function(){var s=document.createElement('i');s.textContent=h[k%4];s.style.cssText='position:absolute;top:-6%;font-size:20px;left:'+(Math.random()*100)+'%;animation:cf '+(1.8+Math.random())+'s linear forwards';$('conf').appendChild(s);setTimeout(function(){s.remove()},3200)},k*60)})(k);}}
(function(){var box=$('fall'),g=['π','√','∑','+','÷','½','💛','🌸','✦','⭐'];for(var k=0;k<22;k++){var s=document.createElement('span');s.textContent=g[k%g.length];if(k%3===0)s.className='m';s.style.left=Math.random()*100+'%';s.style.fontSize=(13+Math.random()*22)+'px';s.style.animationDuration=(7+Math.random()*8)+'s';s.style.animationDelay=(-Math.random()*10)+'s';box.appendChild(s);}})();
$('lang').addEventListener('change',function(){try{localStorage.setItem('mathia_lang',this.value);}catch(e){}try{document.documentElement.lang=this.value;}catch(e){}try{window.dispatchEvent(new CustomEvent('mathia:lang',{detail:this.value}));}catch(e){}render();});
window.addEventListener('mathia:lang',function(){if(!$('report').classList.contains('hidden'))finish();else render();});
render();

<script>
var D={"eyebrow": {"sr": "Formule ✨", "en": "Formule ✨", "de": "Formule ✨", "fr": "Formule ✨", "es": "Formule ✨", "it": "Formule ✨", "ru": "Formule ✨", "pt": "Formule ✨"}, "title": {"sr": "Fizika · 6. razred · Formule", "en": "Physics · Grade 6 · Formulas", "de": "Physik · 6. Klasse · Formeln", "fr": "Physique · 6e année · Formules", "es": "Física · 6.º grado · Fórmulas", "it": "Fisica · 6ª classe · Formule", "ru": "Физика · 6 класс · Формулы", "pt": "Física · 6.º ano · Fórmulas"}, "topics": [{"name": {"sr": "Kretanje", "en": "Motion", "de": "Bewegung", "fr": "Mouvement", "es": "Movimiento", "it": "Moto", "ru": "Движение", "pt": "Movimento"}, "theory": {"sr": "<b>Kretanje</b> tela je promena položaja tela u odnosu na druga tela tokom vremena. Put (s) je pređena dužina, a vreme (t) je trajanje kretanja. <b>Brzina</b> pokazuje koliko brzo telo menja položaj.", "en": "<b>Motion</b> is the change of an object's position relative to other objects over time. Distance (s) is the length traveled, and time (t) is the duration of the motion. <b>Speed</b> shows how quickly an object changes position.", "de": "<b>Bewegung</b> eines Körpers ist die Änderung seiner Lage gegenüber anderen Körpern im Laufe der Zeit. Der Weg (s) ist die zurückgelegte Strecke, die Zeit (t) ist die Dauer der Bewegung. Die <b>Geschwindigkeit</b> zeigt, wie schnell ein Körper seine Lage ändert.", "fr": "Le <b>mouvement</b> d'un corps est le changement de sa position par rapport à d'autres corps au fil du temps. La distance (s) est la longueur parcourue, et le temps (t) est la durée du mouvement. La <b>vitesse</b> indique à quelle rapidité un corps change de position.", "es": "El <b>movimiento</b> de un cuerpo es el cambio de su posición respecto a otros cuerpos a lo largo del tiempo. El espacio (s) es la longitud recorrida, y el tiempo (t) es la duración del movimiento. La <b>velocidad</b> indica con qué rapidez un cuerpo cambia de posición.", "it": "Il <b>moto</b> di un corpo è il cambiamento della sua posizione rispetto ad altri corpi nel tempo. Lo spazio (s) è la lunghezza percorsa, e il tempo (t) è la durata del moto. La <b>velocità</b> indica quanto velocemente un corpo cambia posizione.", "ru": "<b>Движение</b> тела — это изменение его положения относительно других тел с течением времени. Путь (s) — это пройденное расстояние, а время (t) — продолжительность движения. <b>Скорость</b> показывает, как быстро тело меняет своё положение.", "pt": "O <b>movimento</b> de um corpo é a mudança da sua posição em relação a outros corpos ao longo do tempo. O espaço (s) é a distância percorrida, e o tempo (t) é a duração do movimento. A <b>velocidade</b> indica com que rapidez um corpo muda de posição."}, "formulas": [{"sr": "v = s/t — brzina", "en": "v = s/t — speed", "de": "v = s/t — Geschwindigkeit", "fr": "v = s/t — vitesse", "es": "v = s/t — velocidad", "it": "v = s/t — velocità", "ru": "v = s/t — скорость", "pt": "v = s/t — velocidade"}, {"sr": "s = v·t — put", "en": "s = v·t — distance", "de": "s = v·t — Weg", "fr": "s = v·t — distance", "es": "s = v·t — espacio", "it": "s = v·t — spazio", "ru": "s = v·t — путь", "pt": "s = v·t — espaço"}, {"sr": "t = s/v — vreme", "en": "t = s/v — time", "de": "t = s/v — Zeit", "fr": "t = s/v — temps", "es": "t = s/v — tiempo", "it": "t = s/v — tempo", "ru": "t = s/v — время", "pt": "t = s/v — tempo"}], "remember": {"sr": "Jedinica za brzinu je m/s ili km/h. Za pretvaranje: 1 m/s ≈ 3,6 km/h.", "en": "The unit for speed is m/s or km/h. To convert: 1 m/s ≈ 3.6 km/h.", "de": "Die Einheit für Geschwindigkeit ist m/s oder km/h. Zur Umrechnung: 1 m/s ≈ 3,6 km/h.", "fr": "L'unité de vitesse est le m/s ou le km/h. Pour convertir : 1 m/s ≈ 3,6 km/h.", "es": "La unidad de velocidad es m/s o km/h. Para convertir: 1 m/s ≈ 3,6 km/h.", "it": "L'unità di misura della velocità è m/s o km/h. Per convertire: 1 m/s ≈ 3,6 km/h.", "ru": "Единица измерения скорости — m/s или km/h. Для перевода: 1 m/s ≈ 3,6 km/h.", "pt": "A unidade de velocidade é m/s ou km/h. Para converter: 1 m/s ≈ 3,6 km/h."}, "problem": {"statement": {"sr": "Automobil pređe put od 150 km za 2 sata. Kolika je njegova prosečna brzina?", "en": "A car travels a distance of 150 km in 2 hours. What is its average speed?", "de": "Ein Auto legt eine Strecke von 150 km in 2 Stunden zurück. Wie groß ist seine Durchschnittsgeschwindigkeit?", "fr": "Une voiture parcourt une distance de 150 km en 2 heures. Quelle est sa vitesse moyenne ?", "es": "Un automóvil recorre una distancia de 150 km en 2 horas. ¿Cuál es su velocidad media?", "it": "Un'automobile percorre una distanza di 150 km in 2 ore. Qual è la sua velocità media?", "ru": "Автомобиль проезжает путь 150 km за 2 часа. Какова его средняя скорость?", "pt": "Um carro percorre uma distância de 150 km em 2 horas. Qual é a sua velocidade média?"}, "steps": [{"sr": "Zapiši poznate veličine: s = 150 km, t = 2 h.", "en": "Write down the known values: s = 150 km, t = 2 h.", "de": "Schreibe die bekannten Größen auf: s = 150 km, t = 2 h.", "fr": "Note les valeurs connues : s = 150 km, t = 2 h.", "es": "Anota los valores conocidos: s = 150 km, t = 2 h.", "it": "Scrivi i valori noti: s = 150 km, t = 2 h.", "ru": "Запиши известные величины: s = 150 km, t = 2 h.", "pt": "Anota os valores conhecidos: s = 150 km, t = 2 h."}, {"sr": "Primeni formulu v = s/t.", "en": "Apply the formula v = s/t.", "de": "Wende die Formel v = s/t an.", "fr": "Applique la formule v = s/t.", "es": "Aplica la fórmula v = s/t.", "it": "Applica la formula v = s/t.", "ru": "Примени формулу v = s/t.", "pt": "Aplica a fórmula v = s/t."}, {"sr": "Izračunaj: v = 150 km / 2 h = 75 km/h.", "en": "Calculate: v = 150 km / 2 h = 75 km/h.", "de": "Berechne: v = 150 km / 2 h = 75 km/h.", "fr": "Calcule : v = 150 km / 2 h = 75 km/h.", "es": "Calcula: v = 150 km / 2 h = 75 km/h.", "it": "Calcola: v = 150 km / 2 h = 75 km/h.", "ru": "Вычисли: v = 150 km / 2 h = 75 km/h.", "pt": "Calcula: v = 150 km / 2 h = 75 km/h."}, {"sr": "Odgovor: prosečna brzina automobila je 75 km/h.", "en": "Answer: the car's average speed is 75 km/h.", "de": "Antwort: Die Durchschnittsgeschwindigkeit des Autos beträgt 75 km/h.", "fr": "Réponse : la vitesse moyenne de la voiture est de 75 km/h.", "es": "Respuesta: la velocidad media del automóvil es 75 km/h.", "it": "Risposta: la velocità media dell'automobile è 75 km/h.", "ru": "Ответ: средняя скорость автомобиля составляет 75 km/h.", "pt": "Resposta: a velocidade média do carro é 75 km/h."}]}}, {"name": {"sr": "Masa i gustina", "en": "Mass and density", "de": "Masse und Dichte", "fr": "Masse et densité", "es": "Masa y densidad", "it": "Massa e densità", "ru": "Масса и плотность", "pt": "Massa e densidade"}, "theory": {"sr": "<b>Masa</b> (m) je mera količine materije u telu i meri se u kilogramima (kg). <b>Gustina</b> (ρ) pokazuje koliko mase ima u jedinici zapremine tela.", "en": "<b>Mass</b> (m) is a measure of the amount of matter in an object and is measured in kilograms (kg). <b>Density</b> (ρ) shows how much mass is contained in a unit volume of an object.", "de": "Die <b>Masse</b> (m) ist ein Maß für die Menge an Materie in einem Körper und wird in Kilogramm (kg) gemessen. Die <b>Dichte</b> (ρ) zeigt, wie viel Masse in einer Volumeneinheit des Körpers enthalten ist.", "fr": "La <b>masse</b> (m) est une mesure de la quantité de matière d'un corps et se mesure en kilogrammes (kg). La <b>densité</b> (ρ) indique la quantité de masse contenue dans une unité de volume du corps.", "es": "La <b>masa</b> (m) es una medida de la cantidad de materia de un cuerpo y se mide en kilogramos (kg). La <b>densidad</b> (ρ) indica cuánta masa hay en una unidad de volumen del cuerpo.", "it": "La <b>massa</b> (m) è una misura della quantità di materia di un corpo e si misura in chilogrammi (kg). La <b>densità</b> (ρ) indica quanta massa è contenuta in un'unità di volume del corpo.", "ru": "<b>Масса</b> (m) — это мера количества вещества в теле, измеряется в килограммах (kg). <b>Плотность</b> (ρ) показывает, сколько массы содержится в единице объёма тела.", "pt": "A <b>massa</b> (m) é uma medida da quantidade de matéria de um corpo e mede-se em quilogramas (kg). A <b>densidade</b> (ρ) indica quanta massa há numa unidade de volume do corpo."}, "formulas": [{"sr": "ρ = m/V — gustina", "en": "ρ = m/V — density", "de": "ρ = m/V — Dichte", "fr": "ρ = m/V — densité", "es": "ρ = m/V — densidad", "it": "ρ = m/V — densità", "ru": "ρ = m/V — плотность", "pt": "ρ = m/V — densidade"}, {"sr": "m = ρ·V — masa", "en": "m = ρ·V — mass", "de": "m = ρ·V — Masse", "fr": "m = ρ·V — masse", "es": "m = ρ·V — masa", "it": "m = ρ·V — massa", "ru": "m = ρ·V — масса", "pt": "m = ρ·V — massa"}, {"sr": "V = m/ρ — zapremina", "en": "V = m/ρ — volume", "de": "V = m/ρ — Volumen", "fr": "V = m/ρ — volume", "es": "V = m/ρ — volumen", "it": "V = m/ρ — volume", "ru": "V = m/ρ — объём", "pt": "V = m/ρ — volume"}], "remember": {"sr": "Jedinica za gustinu je kg/m³ ili g/cm³. Voda ima gustinu 1000 kg/m³ (1 g/cm³).", "en": "The unit for density is kg/m³ or g/cm³. Water has a density of 1000 kg/m³ (1 g/cm³).", "de": "Die Einheit für Dichte ist kg/m³ oder g/cm³. Wasser hat eine Dichte von 1000 kg/m³ (1 g/cm³).", "fr": "L'unité de densité est le kg/m³ ou le g/cm³. L'eau a une densité de 1000 kg/m³ (1 g/cm³).", "es": "La unidad de densidad es kg/m³ o g/cm³. El agua tiene una densidad de 1000 kg/m³ (1 g/cm³).", "it": "L'unità di misura della densità è kg/m³ o g/cm³. L'acqua ha una densità di 1000 kg/m³ (1 g/cm³).", "ru": "Единица измерения плотности — kg/m³ или g/cm³. Плотность воды составляет 1000 kg/m³ (1 g/cm³).", "pt": "A unidade de densidade é kg/m³ ou g/cm³. A água tem uma densidade de 1000 kg/m³ (1 g/cm³)."}, "problem": {"statement": {"sr": "Komad metala ima masu 270 g i zapreminu 100 cm³. Odredi gustinu metala.", "en": "A piece of metal has a mass of 270 g and a volume of 100 cm³. Determine the density of the metal.", "de": "Ein Metallstück hat eine Masse von 270 g und ein Volumen von 100 cm³. Bestimme die Dichte des Metalls.", "fr": "Un morceau de métal a une masse de 270 g et un volume de 100 cm³. Détermine la densité du métal.", "es": "Un trozo de metal tiene una masa de 270 g y un volumen de 100 cm³. Determina la densidad del metal.", "it": "Un pezzo di metallo ha una massa di 270 g e un volume di 100 cm³. Determina la densità del metallo.", "ru": "Кусок металла имеет массу 270 g и объём 100 cm³. Определи плотность металла.", "pt": "Um pedaço de metal tem uma massa de 270 g e um volume de 100 cm³. Determina a densidade do metal."}, "steps": [{"sr": "Zapiši podatke: m = 270 g, V = 100 cm³.", "en": "Write down the data: m = 270 g, V = 100 cm³.", "de": "Schreibe die Daten auf: m = 270 g, V = 100 cm³.", "fr": "Note les données : m = 270 g, V = 100 cm³.", "es": "Anota los datos: m = 270 g, V = 100 cm³.", "it": "Scrivi i dati: m = 270 g, V = 100 cm³.", "ru": "Запиши данные: m = 270 g, V = 100 cm³.", "pt": "Anota os dados: m = 270 g, V = 100 cm³."}, {"sr": "Primeni formulu ρ = m/V.", "en": "Apply the formula ρ = m/V.", "de": "Wende die Formel ρ = m/V an.", "fr": "Applique la formule ρ = m/V.", "es": "Aplica la fórmula ρ = m/V.", "it": "Applica la formula ρ = m/V.", "ru": "Примени формулу ρ = m/V.", "pt": "Aplica a fórmula ρ = m/V."}, {"sr": "Izračunaj: ρ = 270 g / 100 cm³ = 2,7 g/cm³.", "en": "Calculate: ρ = 270 g / 100 cm³ = 2.7 g/cm³.", "de": "Berechne: ρ = 270 g / 100 cm³ = 2,7 g/cm³.", "fr": "Calcule : ρ = 270 g / 100 cm³ = 2,7 g/cm³.", "es": "Calcula: ρ = 270 g / 100 cm³ = 2,7 g/cm³.", "it": "Calcola: ρ = 270 g / 100 cm³ = 2,7 g/cm³.", "ru": "Вычисли: ρ = 270 g / 100 cm³ = 2,7 g/cm³.", "pt": "Calcula: ρ = 270 g / 100 cm³ = 2,7 g/cm³."}, {"sr": "Zaključak: to je gustina aluminijuma.", "en": "Conclusion: this is the density of aluminum.", "de": "Schlussfolgerung: das ist die Dichte von Aluminium.", "fr": "Conclusion : c'est la densité de l'aluminium.", "es": "Conclusión: esa es la densidad del aluminio.", "it": "Conclusione: è la densità dell'alluminio.", "ru": "Вывод: это плотность алюминия.", "pt": "Conclusão: essa é a densidade do alumínio."}]}}, {"name": {"sr": "Merenje", "en": "Measurement", "de": "Messung", "fr": "Mesure", "es": "Medición", "it": "Misura", "ru": "Измерение", "pt": "Medição"}, "theory": {"sr": "<b>Merenje</b> je postupak upoređivanja fizičke veličine sa izabranom jedinicom mere. Osnovne jedinice u fizici su metar (m) za dužinu, kilogram (kg) za masu i sekunda (s) za vreme.", "en": "<b>Measurement</b> is the process of comparing a physical quantity with a chosen unit of measure. The basic units in physics are the meter (m) for length, the kilogram (kg) for mass, and the second (s) for time.", "de": "<b>Messung</b> ist der Vorgang, bei dem eine physikalische Größe mit einer gewählten Maßeinheit verglichen wird. Die Grundeinheiten in der Physik sind der Meter (m) für die Länge, das Kilogramm (kg) für die Masse und die Sekunde (s) für die Zeit.", "fr": "La <b>mesure</b> est le procédé qui consiste à comparer une grandeur physique à une unité de mesure choisie. Les unités de base en physique sont le mètre (m) pour la longueur, le kilogramme (kg) pour la masse et la seconde (s) pour le temps.", "es": "La <b>medición</b> es el proceso de comparar una magnitud física con una unidad de medida elegida. Las unidades básicas en física son el metro (m) para la longitud, el kilogramo (kg) para la masa y el segundo (s) para el tiempo.", "it": "La <b>misura</b> è il procedimento con cui si confronta una grandezza fisica con un'unità di misura scelta. Le unità di base in fisica sono il metro (m) per la lunghezza, il chilogrammo (kg) per la massa e il secondo (s) per il tempo.", "ru": "<b>Измерение</b> — это процесс сравнения физической величины с выбранной единицей измерения. Основные единицы в физике — это метр (m) для длины, килограмм (kg) для массы и секунда (s) для времени.", "pt": "A <b>medição</b> é o processo de comparar uma grandeza física com uma unidade de medida escolhida. As unidades básicas em física são o metro (m) para o comprimento, o quilograma (kg) para a massa e o segundo (s) para o tempo."}, "formulas": [{"sr": "1 km = 1000 m — pretvaranje dužine", "en": "1 km = 1000 m — length conversion", "de": "1 km = 1000 m — Längenumrechnung", "fr": "1 km = 1000 m — conversion de longueur", "es": "1 km = 1000 m — conversión de longitud", "it": "1 km = 1000 m — conversione di lunghezza", "ru": "1 km = 1000 m — перевод длины", "pt": "1 km = 1000 m — conversão de comprimento"}, {"sr": "1 h = 3600 s — pretvaranje vremena", "en": "1 h = 3600 s — time conversion", "de": "1 h = 3600 s — Zeitumrechnung", "fr": "1 h = 3600 s — conversion de temps", "es": "1 h = 3600 s — conversión de tiempo", "it": "1 h = 3600 s — conversione di tempo", "ru": "1 h = 3600 s — перевод времени", "pt": "1 h = 3600 s — conversão de tempo"}, {"sr": "1 kg = 1000 g — pretvaranje mase", "en": "1 kg = 1000 g — mass conversion", "de": "1 kg = 1000 g — Massenumrechnung", "fr": "1 kg = 1000 g — conversion de masse", "es": "1 kg = 1000 g — conversión de masa", "it": "1 kg = 1000 g — conversione di massa", "ru": "1 kg = 1000 g — перевод массы", "pt": "1 kg = 1000 g — conversão de massa"}], "remember": {"sr": "Svako merenje ima grešku merenja. Rezultat merenja uvek zapisujemo sa odgovarajućom jedinicom.", "en": "Every measurement has a measurement error. We always write the result of a measurement together with the appropriate unit.", "de": "Jede Messung hat einen Messfehler. Das Messergebnis schreiben wir immer mit der passenden Einheit auf.", "fr": "Toute mesure comporte une erreur de mesure. On note toujours le résultat d'une mesure avec l'unité appropriée.", "es": "Toda medición tiene un error de medición. El resultado de una medición siempre se escribe con la unidad correspondiente.", "it": "Ogni misura ha un errore di misura. Il risultato di una misura va sempre scritto con l'unità di misura corrispondente.", "ru": "Каждое измерение имеет погрешность измерения. Результат измерения всегда записывается с соответствующей единицей измерения.", "pt": "Toda medição tem um erro de medição. O resultado de uma medição escreve-se sempre com a unidade correspondente."}, "problem": {"statement": {"sr": "Izrazi dužinu od 2,5 km u metrima i vreme od 1,5 h u sekundama.", "en": "Express a length of 2.5 km in meters and a time of 1.5 h in seconds.", "de": "Drücke eine Länge von 2,5 km in Metern und eine Zeit von 1,5 h in Sekunden aus.", "fr": "Exprime une longueur de 2,5 km en mètres et une durée de 1,5 h en secondes.", "es": "Expresa una longitud de 2,5 km en metros y un tiempo de 1,5 h en segundos.", "it": "Esprimi una lunghezza di 2,5 km in metri e un tempo di 1,5 h in secondi.", "ru": "Вырази длину 2,5 km в метрах и время 1,5 h в секундах.", "pt": "Expressa um comprimento de 2,5 km em metros e um tempo de 1,5 h em segundos."}, "steps": [{"sr": "Podseti se: 1 km = 1000 m i 1 h = 3600 s.", "en": "Recall that: 1 km = 1000 m and 1 h = 3600 s.", "de": "Erinnere dich: 1 km = 1000 m und 1 h = 3600 s.", "fr": "Rappelle-toi : 1 km = 1000 m et 1 h = 3600 s.", "es": "Recuerda que: 1 km = 1000 m y 1 h = 3600 s.", "it": "Ricorda che: 1 km = 1000 m e 1 h = 3600 s.", "ru": "Вспомни: 1 km = 1000 m и 1 h = 3600 s.", "pt": "Recorda que: 1 km = 1000 m e 1 h = 3600 s."}, {"sr": "Za dužinu: 2,5 km · 1000 = 2500 m.", "en": "For length: 2.5 km · 1000 = 2500 m.", "de": "Für die Länge: 2,5 km · 1000 = 2500 m.", "fr": "Pour la longueur : 2,5 km · 1000 = 2500 m.", "es": "Para la longitud: 2,5 km · 1000 = 2500 m.", "it": "Per la lunghezza: 2,5 km · 1000 = 2500 m.", "ru": "Для длины: 2,5 km · 1000 = 2500 m.", "pt": "Para o comprimento: 2,5 km · 1000 = 2500 m."}, {"sr": "Za vreme: 1,5 h · 3600 = 5400 s.", "en": "For time: 1.5 h · 3600 = 5400 s.", "de": "Für die Zeit: 1,5 h · 3600 = 5400 s.", "fr": "Pour le temps : 1,5 h · 3600 = 5400 s.", "es": "Para el tiempo: 1,5 h · 3600 = 5400 s.", "it": "Per il tempo: 1,5 h · 3600 = 5400 s.", "ru": "Для времени: 1,5 h · 3600 = 5400 s.", "pt": "Para o tempo: 1,5 h · 3600 = 5400 s."}, {"sr": "Odgovor: 2500 m i 5400 s.", "en": "Answer: 2500 m and 5400 s.", "de": "Antwort: 2500 m und 5400 s.", "fr": "Réponse : 2500 m et 5400 s.", "es": "Respuesta: 2500 m y 5400 s.", "it": "Risposta: 2500 m e 5400 s.", "ru": "Ответ: 2500 m и 5400 s.", "pt": "Resposta: 2500 m e 5400 s."}]}}, {"name": {"sr": "Pritisak — uvod", "en": "Pressure — introduction", "de": "Druck — Einführung", "fr": "Pression — introduction", "es": "Presión — introducción", "it": "Pressione — introduzione", "ru": "Давление — введение", "pt": "Pressão — introdução"}, "theory": {"sr": "<b>Pritisak</b> (p) nastaje kada sila deluje upravno na neku površinu. Što je površina manja, pritisak je veći pri istoj sili.", "en": "<b>Pressure</b> (p) occurs when a force acts perpendicular to a surface. The smaller the surface, the greater the pressure for the same force.", "de": "<b>Druck</b> (p) entsteht, wenn eine Kraft senkrecht auf eine Fläche wirkt. Je kleiner die Fläche ist, desto größer ist der Druck bei gleicher Kraft.", "fr": "La <b>pression</b> (p) apparaît lorsqu'une force agit perpendiculairement à une surface. Plus la surface est petite, plus la pression est grande pour une même force.", "es": "La <b>presión</b> (p) se produce cuando una fuerza actúa perpendicularmente sobre una superficie. Cuanto más pequeña es la superficie, mayor es la presión para la misma fuerza.", "it": "La <b>pressione</b> (p) si genera quando una forza agisce perpendicolarmente su una superficie. Quanto più piccola è la superficie, tanto maggiore è la pressione a parità di forza.", "ru": "<b>Давление</b> (p) возникает, когда сила действует перпендикулярно поверхности. Чем меньше поверхность, тем больше давление при той же силе.", "pt": "A <b>pressão</b> (p) surge quando uma força atua perpendicularmente sobre uma superfície. Quanto menor for a superfície, maior é a pressão para a mesma força."}, "formulas": [{"sr": "p = F/S — pritisak", "en": "p = F/S — pressure", "de": "p = F/S — Druck", "fr": "p = F/S — pression", "es": "p = F/S — presión", "it": "p = F/S — pressione", "ru": "p = F/S — давление", "pt": "p = F/S — pressão"}, {"sr": "F = p·S — sila", "en": "F = p·S — force", "de": "F = p·S — Kraft", "fr": "F = p·S — force", "es": "F = p·S — fuerza", "it": "F = p·S — forza", "ru": "F = p·S — сила", "pt": "F = p·S — força"}, {"sr": "S = F/p — površina", "en": "S = F/p — surface area", "de": "S = F/p — Fläche", "fr": "S = F/p — surface", "es": "S = F/p — superficie", "it": "S = F/p — superficie", "ru": "S = F/p — площадь", "pt": "S = F/p — superfície"}], "remember": {"sr": "Jedinica za pritisak je paskal (Pa). 1 Pa = 1 N/m².", "en": "The unit for pressure is the pascal (Pa). 1 Pa = 1 N/m².", "de": "Die Einheit für Druck ist das Pascal (Pa). 1 Pa = 1 N/m².", "fr": "L'unité de pression est le pascal (Pa). 1 Pa = 1 N/m².", "es": "La unidad de presión es el pascal (Pa). 1 Pa = 1 N/m².", "it": "L'unità di misura della pressione è il pascal (Pa). 1 Pa = 1 N/m².", "ru": "Единица измерения давления — паскаль (Pa). 1 Pa = 1 N/m².", "pt": "A unidade de pressão é o pascal (Pa). 1 Pa = 1 N/m²."}, "problem": {"statement": {"sr": "Sila od 200 N deluje na površinu od 0,5 m². Izračunaj pritisak.", "en": "A force of 200 N acts on a surface of 0.5 m². Calculate the pressure.", "de": "Eine Kraft von 200 N wirkt auf eine Fläche von 0,5 m². Berechne den Druck.", "fr": "Une force de 200 N agit sur une surface de 0,5 m². Calcule la pression.", "es": "Una fuerza de 200 N actúa sobre una superficie de 0,5 m². Calcula la presión.", "it": "Una forza di 200 N agisce su una superficie di 0,5 m². Calcola la pressione.", "ru": "Сила 200 N действует на поверхность 0,5 m². Вычисли давление.", "pt": "Uma força de 200 N atua sobre uma superfície de 0,5 m². Calcula a pressão."}, "steps": [{"sr": "Zapiši podatke: F = 200 N, S = 0,5 m².", "en": "Write down the data: F = 200 N, S = 0.5 m².", "de": "Schreibe die Daten auf: F = 200 N, S = 0,5 m².", "fr": "Note les données : F = 200 N, S = 0,5 m².", "es": "Anota los datos: F = 200 N, S = 0,5 m².", "it": "Scrivi i dati: F = 200 N, S = 0,5 m².", "ru": "Запиши данные: F = 200 N, S = 0,5 m².", "pt": "Anota os dados: F = 200 N, S = 0,5 m²."}, {"sr": "Primeni formulu p = F/S.", "en": "Apply the formula p = F/S.", "de": "Wende die Formel p = F/S an.", "fr": "Applique la formule p = F/S.", "es": "Aplica la fórmula p = F/S.", "it": "Applica la formula p = F/S.", "ru": "Примени формулу p = F/S.", "pt": "Aplica a fórmula p = F/S."}, {"sr": "Izračunaj: p = 200 N / 0,5 m² = 400 Pa.", "en": "Calculate: p = 200 N / 0.5 m² = 400 Pa.", "de": "Berechne: p = 200 N / 0,5 m² = 400 Pa.", "fr": "Calcule : p = 200 N / 0,5 m² = 400 Pa.", "es": "Calcula: p = 200 N / 0,5 m² = 400 Pa.", "it": "Calcola: p = 200 N / 0,5 m² = 400 Pa.", "ru": "Вычисли: p = 200 N / 0,5 m² = 400 Pa.", "pt": "Calcula: p = 200 N / 0,5 m² = 400 Pa."}, {"sr": "Odgovor: pritisak iznosi 400 Pa.", "en": "Answer: the pressure is 400 Pa.", "de": "Antwort: der Druck beträgt 400 Pa.", "fr": "Réponse : la pression est de 400 Pa.", "es": "Respuesta: la presión es de 400 Pa.", "it": "Risposta: la pressione è di 400 Pa.", "ru": "Ответ: давление составляет 400 Pa.", "pt": "Resposta: a pressão é de 400 Pa."}]}}, {"name": {"sr": "Ravnoteža", "en": "Equilibrium", "de": "Gleichgewicht", "fr": "Équilibre", "es": "Equilibrio", "it": "Equilibrio", "ru": "Равновесие", "pt": "Equilíbrio"}, "theory": {"sr": "Telo je u <b>ravnoteži</b> kada je zbir svih sila koje na njega deluju jednak nuli. Poluga je u ravnoteži kada su momenti sila sa obe strane oslonca jednaki.", "en": "An object is in <b>equilibrium</b> when the sum of all forces acting on it is equal to zero. A lever is in equilibrium when the moments of force on both sides of the pivot are equal.", "de": "Ein Körper ist im <b>Gleichgewicht</b>, wenn die Summe aller auf ihn wirkenden Kräfte gleich null ist. Ein Hebel ist im Gleichgewicht, wenn die Drehmomente auf beiden Seiten des Drehpunkts gleich groß sind.", "fr": "Un corps est en <b>équilibre</b> lorsque la somme de toutes les forces qui agissent sur lui est égale à zéro. Un levier est en équilibre lorsque les moments des forces de part et d'autre du point d'appui sont égaux.", "es": "Un cuerpo está en <b>equilibrio</b> cuando la suma de todas las fuerzas que actúan sobre él es igual a cero. Una palanca está en equilibrio cuando los momentos de las fuerzas a ambos lados del punto de apoyo son iguales.", "it": "Un corpo è in <b>equilibrio</b> quando la somma di tutte le forze che agiscono su di esso è uguale a zero. Una leva è in equilibrio quando i momenti delle forze sui due lati del fulcro sono uguali.", "ru": "Тело находится в <b>равновесии</b>, когда сумма всех действующих на него сил равна нулю. Рычаг находится в равновесии, когда моменты сил по обе стороны опоры равны.", "pt": "Um corpo está em <b>equilíbrio</b> quando a soma de todas as forças que atuam sobre ele é igual a zero. Uma alavanca está em equilíbrio quando os momentos das forças em ambos os lados do ponto de apoio são iguais."}, "formulas": [{"sr": "F1·d1 = F2·d2 — uslov ravnoteže poluge", "en": "F1·d1 = F2·d2 — lever equilibrium condition", "de": "F1·d1 = F2·d2 — Gleichgewichtsbedingung des Hebels", "fr": "F1·d1 = F2·d2 — condition d'équilibre du levier", "es": "F1·d1 = F2·d2 — condición de equilibrio de la palanca", "it": "F1·d1 = F2·d2 — condizione di equilibrio della leva", "ru": "F1·d1 = F2·d2 — условие равновесия рычага", "pt": "F1·d1 = F2·d2 — condição de equilíbrio da alavanca"}, {"sr": "ΣF = 0 — uslov ravnoteže sila", "en": "ΣF = 0 — condition for equilibrium of forces", "de": "ΣF = 0 — Gleichgewichtsbedingung der Kräfte", "fr": "ΣF = 0 — condition d'équilibre des forces", "es": "ΣF = 0 — condición de equilibrio de fuerzas", "it": "ΣF = 0 — condizione di equilibrio delle forze", "ru": "ΣF = 0 — условие равновесия сил", "pt": "ΣF = 0 — condição de equilíbrio das forças"}], "remember": {"sr": "Momenat sile zavisi od veličine sile i njenog kraka (rastojanja od oslonca).", "en": "The moment of a force depends on the size of the force and its arm (distance from the pivot).", "de": "Das Drehmoment einer Kraft hängt von der Größe der Kraft und ihrem Hebelarm (Abstand vom Drehpunkt) ab.", "fr": "Le moment d'une force dépend de l'intensité de la force et de son bras de levier (distance par rapport au point d'appui).", "es": "El momento de una fuerza depende de la magnitud de la fuerza y de su brazo (distancia al punto de apoyo).", "it": "Il momento di una forza dipende dall'intensità della forza e dal suo braccio (distanza dal fulcro).", "ru": "Момент силы зависит от величины силы и её плеча (расстояния от опоры).", "pt": "O momento de uma força depende da intensidade da força e do seu braço (distância ao ponto de apoio)."}, "problem": {"statement": {"sr": "Na polugu na rastojanju 2 m od oslonca deluje sila od 30 N. Kolika sila na rastojanju od 3 m sa druge strane održava ravnotežu?", "en": "A force of 30 N acts on a lever at a distance of 2 m from the pivot. What force at a distance of 3 m on the other side keeps it in equilibrium?", "de": "Auf einen Hebel wirkt in einem Abstand von 2 m vom Drehpunkt eine Kraft von 30 N. Welche Kraft in einem Abstand von 3 m auf der anderen Seite hält das Gleichgewicht?", "fr": "Une force de 30 N agit sur un levier à une distance de 2 m du point d'appui. Quelle force, à une distance de 3 m de l'autre côté, maintient l'équilibre ?", "es": "Sobre una palanca actúa una fuerza de 30 N a una distancia de 2 m del punto de apoyo. ¿Qué fuerza a una distancia de 3 m del otro lado mantiene el equilibrio?", "it": "Su una leva agisce una forza di 30 N a una distanza di 2 m dal fulcro. Quale forza a una distanza di 3 m dall'altra parte mantiene l'equilibrio?", "ru": "На рычаг на расстоянии 2 m от опоры действует сила 30 N. Какая сила на расстоянии 3 m с другой стороны удерживает равновесие?", "pt": "Sobre uma alavanca atua uma força de 30 N a uma distância de 2 m do ponto de apoio. Que força a uma distância de 3 m do outro lado mantém o equilíbrio?"}, "steps": [{"sr": "Zapiši podatke: F1 = 30 N, d1 = 2 m, d2 = 3 m.", "en": "Write down the data: F1 = 30 N, d1 = 2 m, d2 = 3 m.", "de": "Schreibe die Daten auf: F1 = 30 N, d1 = 2 m, d2 = 3 m.", "fr": "Note les données : F1 = 30 N, d1 = 2 m, d2 = 3 m.", "es": "Anota los datos: F1 = 30 N, d1 = 2 m, d2 = 3 m.", "it": "Scrivi i dati: F1 = 30 N, d1 = 2 m, d2 = 3 m.", "ru": "Запиши данные: F1 = 30 N, d1 = 2 m, d2 = 3 m.", "pt": "Anota os dados: F1 = 30 N, d1 = 2 m, d2 = 3 m."}, {"sr": "Primeni uslov ravnoteže: F1·d1 = F2·d2.", "en": "Apply the equilibrium condition: F1·d1 = F2·d2.", "de": "Wende die Gleichgewichtsbedingung an: F1·d1 = F2·d2.", "fr": "Applique la condition d'équilibre : F1·d1 = F2·d2.", "es": "Aplica la condición de equilibrio: F1·d1 = F2·d2.", "it": "Applica la condizione di equilibrio: F1·d1 = F2·d2.", "ru": "Примени условие равновесия: F1·d1 = F2·d2.", "pt": "Aplica a condição de equilíbrio: F1·d1 = F2·d2."}, {"sr": "Izračunaj: F2 = (30 N · 2 m) / 3 m = 20 N.", "en": "Calculate: F2 = (30 N · 2 m) / 3 m = 20 N.", "de": "Berechne: F2 = (30 N · 2 m) / 3 m = 20 N.", "fr": "Calcule : F2 = (30 N · 2 m) / 3 m = 20 N.", "es": "Calcula: F2 = (30 N · 2 m) / 3 m = 20 N.", "it": "Calcola: F2 = (30 N · 2 m) / 3 m = 20 N.", "ru": "Вычисли: F2 = (30 N · 2 m) / 3 m = 20 N.", "pt": "Calcula: F2 = (30 N · 2 m) / 3 m = 20 N."}, {"sr": "Odgovor: potrebna sila je 20 N.", "en": "Answer: the required force is 20 N.", "de": "Antwort: die erforderliche Kraft beträgt 20 N.", "fr": "Réponse : la force nécessaire est de 20 N.", "es": "Respuesta: la fuerza necesaria es de 20 N.", "it": "Risposta: la forza necessaria è di 20 N.", "ru": "Ответ: необходимая сила равна 20 N.", "pt": "Resposta: a força necessária é de 20 N."}]}}, {"name": {"sr": "Sila", "en": "Force", "de": "Kraft", "fr": "Force", "es": "Fuerza", "it": "Forza", "ru": "Сила", "pt": "Força"}, "theory": {"sr": "<b>Sila</b> je uzrok promene brzine tela ili njegovog oblika. Sila je vektorska veličina — ima pravac, smer i intenzitet. Meri se u njutnima (N).", "en": "<b>Force</b> is the cause of a change in an object's speed or shape. Force is a vector quantity — it has a direction, an orientation and a magnitude. It is measured in newtons (N).", "de": "Die <b>Kraft</b> ist die Ursache für die Änderung der Geschwindigkeit eines Körpers oder seiner Form. Die Kraft ist eine vektorielle Größe — sie hat eine Richtung, einen Richtungssinn und einen Betrag. Sie wird in Newton (N) gemessen.", "fr": "La <b>force</b> est la cause du changement de vitesse d'un corps ou de sa forme. La force est une grandeur vectorielle — elle a une direction, un sens et une intensité. Elle se mesure en newtons (N).", "es": "La <b>fuerza</b> es la causa del cambio de velocidad de un cuerpo o de su forma. La fuerza es una magnitud vectorial: tiene dirección, sentido e intensidad. Se mide en newtons (N).", "it": "La <b>forza</b> è la causa del cambiamento di velocità di un corpo o della sua forma. La forza è una grandezza vettoriale — ha una direzione, un verso e un'intensità. Si misura in newton (N).", "ru": "<b>Сила</b> — это причина изменения скорости тела или его формы. Сила — векторная величина: она имеет направление, ориентацию и величину. Измеряется в ньютонах (N).", "pt": "A <b>força</b> é a causa da mudança de velocidade de um corpo ou da sua forma. A força é uma grandeza vetorial — tem direção, sentido e intensidade. Mede-se em newtons (N)."}, "formulas": [{"sr": "F = m·a — drugi Njutnov zakon", "en": "F = m·a — Newton's second law", "de": "F = m·a — zweites Newtonsches Gesetz", "fr": "F = m·a — deuxième loi de Newton", "es": "F = m·a — segunda ley de Newton", "it": "F = m·a — secondo principio della dinamica", "ru": "F = m·a — второй закон Ньютона", "pt": "F = m·a — segunda lei de Newton"}, {"sr": "Fg = m·g — sila teže", "en": "Fg = m·g — force of gravity", "de": "Fg = m·g — Gewichtskraft", "fr": "Fg = m·g — force de pesanteur", "es": "Fg = m·g — fuerza de gravedad", "it": "Fg = m·

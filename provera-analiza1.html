<style>
  :root{--cream:#FBF6EE;--card:#FFFDFA;--ink:#5A1024;--ink2:#7A3346;--gold:#C6A05C;--golddk:#A6803C;--goldsoft:#F0DCA8;--malina:#B01E48;--muted:#8A7A80;--line:#EFE1DC}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#3E2D34;line-height:1.7;background:radial-gradient(820px 380px at 88% -6%,#FBEAEF 0,rgba(251,234,239,0) 60%),radial-gradient(680px 340px at 4% 108%,#F7ECD6 0,rgba(247,236,214,0) 62%),var(--cream);overflow-x:hidden}
  h1,h2,h3{font-family:'Spectral',Georgia,serif;font-weight:700;margin:0;color:var(--ink);line-height:1.15}
  p{margin:0}
  /* ——— padajući simboli u pozadini ——— */
  #fall{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  #fall span{position:absolute;top:-8%;font-family:'Spectral',serif;font-style:italic;color:rgba(198,160,92,.16);animation:drift linear infinite;will-change:transform}
  @keyframes drift{0%{transform:translateY(-10vh) rotate(0)}100%{transform:translateY(112vh) rotate(22deg)}}
  @media(prefers-reduced-motion:reduce){#fall{display:none}}
  .wrap{max-width:760px;margin:0 auto;padding:0 22px;position:relative;z-index:1}
  /* topbar */
  .tb{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:rgba(251,246,238,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid rgba(198,160,92,.32)}
  .tb:before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--goldsoft),var(--gold),#FFF6D6,var(--gold),var(--goldsoft),transparent)}
  .tb a.back{color:var(--ink2);text-decoration:none;font-weight:800;font-size:.9rem}
  .tb a.brand{font-family:'Spectral',serif;font-weight:700;letter-spacing:.12em;color:var(--ink);text-decoration:none}
  .tb a.brand b{color:var(--gold)}
  /* hero */
  .hero{text-align:center;padding:46px 0 8px}
  .eyebrow{font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;color:var(--malina);font-weight:800}
  .hero h1{font-size:clamp(2rem,5vw,2.9rem);margin:12px 0 8px}
  .hero p{color:var(--ink2);max-width:520px;margin:0 auto;font-size:1.05rem}
  .free{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(180deg,#FFFBF3,#FBF3E2);border:1px solid var(--goldsoft);border-radius:100px;padding:6px 15px;font-weight:800;font-size:.74rem;color:var(--golddk);margin-bottom:6px}
  /* progress */
  .prog{height:8px;border-radius:8px;background:rgba(198,160,92,.16);overflow:hidden;margin:26px 0 6px}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--goldsoft),var(--gold));width:0;transition:width .4s ease}
  .qnum{font-size:.8rem;color:var(--muted);font-weight:800;letter-spacing:.04em;text-align:center;margin-bottom:14px}
  /* card */
  .card{background:var(--card);border:1px solid rgba(198,160,92,.26);border-radius:24px;padding:32px 30px;box-shadow:0 34px 74px -42px rgba(120,40,60,.5);position:relative;overflow:hidden}
  .card:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),#FFF6D6,var(--gold),transparent)}
  .q-tag{display:inline-block;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--golddk);background:#FBF3E2;border:1px solid var(--goldsoft);border-radius:100px;padding:3px 11px;margin-bottom:12px}
  .q-txt{font-family:'Spectral',serif;font-size:clamp(1.35rem,3.4vw,1.7rem);color:var(--ink);line-height:1.35}
  .opts{display:grid;gap:11px;margin-top:20px}
  .opt{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid rgba(198,160,92,.32);background:#fffdf8;border-radius:14px;padding:14px 16px;font-family:'Spectral','Cambria Math',Georgia,serif;font-size:1.08rem;color:var(--ink);cursor:pointer;transition:transform .14s,border-color .14s,background .14s}
  .opt:hover:not(.done){border-color:var(--gold);background:#FBF3E2;transform:translateX(3px)}
  .opt .mk{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:800;font-size:.82rem;color:var(--golddk)}
  .opts.locked .opt{cursor:default}
  .opt.correct{border-color:#2E9E6B;background:linear-gradient(180deg,#F1FBF5,#E7F6EE)}
  .opt.correct .mk{border-color:#2E9E6B;background:#2E9E6B;color:#fff}
  .opt.wrong{border-color:#D08;opacity:.85;background:#FDF2F6}
  .opt.wrong .mk{border-color:#B01E48;background:#B01E48;color:#fff}
  .fb{text-align:center;font-weight:800;font-size:.95rem;margin-top:14px;min-height:1.2em}
  .fb.ok{color:#2E9E6B}.fb.no{color:var(--malina)}
  .sol{max-height:0;opacity:0;overflow:hidden;transition:max-height .5s ease,opacity .4s ease,margin .4s ease;margin:0}
  .sol.on{max-height:1400px;opacity:1;margin:20px 0 0}
  .sol-in{background:linear-gradient(180deg,#FFF7FA,#FBEEF2);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  .sol-h{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.72rem;color:var(--malina);margin-bottom:8px}
  .step{display:block;font-family:'Spectral','Cambria Math',Georgia,serif;font-size:1.1rem;color:var(--ink);white-space:nowrap;overflow-x:auto;margin:11px 0;line-height:1.5}
  .res{display:inline-block;margin-top:6px;font-family:'Spectral',serif;font-weight:700;color:var(--malina);border:1.5px solid rgba(176,30,72,.35);border-radius:10px;padding:4px 14px;background:#fff}
  .note{color:#7A3346;font-size:.96rem;margin-top:8px}
  /* math bits */
  .frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .18em}
  .frac>span{display:block;line-height:1.12;padding:0 .45em}
  .frac .num{border-bottom:1.5px solid currentColor;padding-bottom:.06em}
  .frac .den{padding-top:.06em}
  .lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .18em}
  .lim .und{font-size:.58em;margin-top:.14em;font-style:normal;white-space:nowrap}
  b{color:var(--ink)}
  /* controls */
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  .btn{display:inline-flex;align-items:center;gap:9px;border-radius:100px;padding:13px 26px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.94rem;cursor:pointer;text-decoration:none;border:1.5px solid transparent;transition:transform .16s,box-shadow .16s,background .16s}
  .btn-gold{background:linear-gradient(110deg,#EAD196,#C6A05C 45%,#F4E3B4 55%,#C6A05C 75%,#EAD196);background-size:240% auto;color:#3a2410;box-shadow:0 16px 30px -14px rgba(160,120,40,.7);animation:shim 7s linear infinite}
  @keyframes shim{to{background-position:-240% center}}
  .btn-gold:hover{transform:translateY(-2px)}
  .btn-ghost{background:transparent;border-color:rgba(198,160,92,.5);color:var(--golddk)}
  .btn-ghost:hover{background:#FBF3E2}
  .btn-mal{background:linear-gradient(160deg,#CC5E7E,#B01E48);color:#fff;box-shadow:0 14px 28px -12px rgba(176,30,72,.5)}
  .btn-mal:hover{transform:translateY(-2px)}
  .backbtn{background:none;border:none;color:var(--muted);font-family:inherit;font-weight:700;cursor:pointer;font-size:.86rem}
  /* end */
  #end{display:none;text-align:center}
  #end.on{display:block}
  #end .big{font-size:clamp(2rem,5vw,2.8rem);margin:6px 0 8px;background:linear-gradient(100deg,#9C7838,#E7D2A2 30%,#FFF7E2 48%,#E7D2A2 66%,#C6A05C);-webkit-background-clip:text;background-clip:text;color:transparent}
  .mbox{margin:22px 0 0;background:linear-gradient(160deg,#5A1024,#3A0B18);color:#fff;border-radius:20px;padding:26px;position:relative;overflow:hidden}
  .mbox:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .mbox h3{color:#fff;font-size:1.5rem;margin-bottom:6px}
  .mbox p{color:#f0dfe4;margin-bottom:16px}
  .pf{margin-top:56px;text-align:center;padding:34px 22px;color:var(--muted);font-size:.8rem;border-top:1px solid var(--goldsoft);background:linear-gradient(180deg,#FBF6EE,#F5EAD9)}
  .pf .w{font-family:'Spectral',serif;font-weight:700;font-size:1.5rem;letter-spacing:.24em;background:linear-gradient(100deg,#9C7838,#E7D2A2 32%,#FFF7E2 50%,#E7D2A2 68%,#C6A05C);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
</style>

var DATA={"sr": [{"tag": "Limes · oblik „0/0“", "q": "Izračunaj <span class=\"lim\">lim<span class=\"und\">x→3</span></span> <span class=\"frac\"><span class=\"num\">x² − 9</span><span class=\"den\">x − 3</span></span>.", "o": ["3", "6", "0", "∞"], "c": 1, "sol": "<span class=\"step\"><span class=\"lim\">lim<span class=\"und\">x→3</span></span> <span class=\"frac\"><span class=\"num\">x² − 9</span><span class=\"den\">x − 3</span></span> = <span class=\"lim\">lim<span class=\"und\">x→3</span></span> <span class=\"frac\"><span class=\"num\">(x − 3)(x + 3)</span><span class=\"den\">x − 3</span></span></span><span class=\"step\">= <span class=\"lim\">lim<span class=\"und\">x→3</span></span> (x + 3) = 3 + 3</span><div class=\"note\">Faktorišemo brojilac i skratimo (x − 3) — tako uklonimo oblik „0/0“.</div><span class=\"res\">= 6</span>"}, {"tag": "Limes · Lopitalovo pravilo", "q": "Izračunaj <span class=\"lim\">lim<span class=\"und\">x→0</span></span> <span class=\"frac\"><span class=\"num\">e<sup>x</sup> − 1</span><span class=\"den\">x</span></span>.", "o": ["0", "1", "e", "∞"], "c": 1, "sol": "<span class=\"step\"><span class=\"lim\">lim<span class=\"und\">x→0</span></span> <span class=\"frac\"><span class=\"num\">(e<sup>x</sup> − 1)′</span><span class=\"den\">(x)′</span></span> = <span class=\"lim\">lim<span class=\"und\">x→0</span></span> <span class=\"frac\"><span class=\"num\">e<sup>x</sup></span><span class=\"den\">1</span></span></span><span class=\"step\">= e<sup>0</sup></span><div class=\"note\">Uvrštavanje daje „0/0“, pa primenjujemo Lopitalovo pravilo (izvod brojioca kroz izvod imenioca).</div><span class=\"res\">= 1</span>"}, {"tag": "Izvod složene funkcije", "q": "Nađi izvod funkcije f(x) = sin(3x² + 1).", "o": ["cos(3x² + 1)", "6x·cos(3x² + 1)", "6x", "−sin(3x² + 1)"], "c": 1, "sol": "<span class=\"step\">f′(x) = cos(3x² + 1) · (3x² + 1)′</span><span class=\"step\">= cos(3x² + 1) · 6x</span><div class=\"note\">Pravilo lanca: izvod spoljašnje funkcije puta izvod unutrašnje.</div><span class=\"res\">f′(x) = 6x·cos(3x² + 1)</span>"}, {"tag": "Ekstremi funkcije", "q": "Odredi ekstreme funkcije f(x) = x³ − 3x.", "o": ["min (1, −2), max (−1, 2)", "min (−1, 2), max (1, −2)", "samo min u x = 0", "nema ekstrema"], "c": 0, "sol": "<span class=\"step\">f′(x) = 3x² − 3 = 0 ⇒ x = ±1</span><span class=\"step\">f″(x) = 6x</span><span class=\"step\">f(1) = −2, f(−1) = 2</span><div class=\"note\">f″(1) &gt; 0 → minimum; f″(−1) &lt; 0 → maksimum.</div><span class=\"res\">min (1, −2) · max (−1, 2)</span>"}, {"tag": "Neodređeni integral · smena", "q": "Izračunaj ∫ 2x · e<sup>x²</sup> dx.", "o": ["e<sup>x²</sup> + C", "2e<sup>x²</sup> + C", "x²·e<sup>x²</sup> + C", "e<sup>2x</sup> + C"], "c": 0, "sol": "<span class=\"step\">∫ 2x · e<sup>x²</sup> dx = ∫ e<sup>t</sup> dt</span><span class=\"step\">= e<sup>t</sup> + C</span><div class=\"note\">Smena: t = x², pa je dt = 2x dx — tačno ono što stoji uz eksponent.</div><span class=\"res\">= e<sup>x²</sup> + C</span>"}, {"tag": "Određeni integral · površina", "q": "Izračunaj površinu ispod krive y = x² na [0, 2].", "o": ["<span class=\"frac\"><span class=\"num\">8</span><span class=\"den\">3</span></span>", "4", "8", "2"], "c": 0, "sol": "<span class=\"step\">∫<sub>0</sub><sup>2</sup> x² dx = <span class=\"frac\"><span class=\"num\">x³</span><span class=\"den\">3</span></span> ∣<sub>0</sub><sup>2</sup></span><span class=\"step\">= <span class=\"frac\"><span class=\"num\">2³</span><span class=\"den\">3</span></span> − 0 = <span class=\"frac\"><span class=\"num\">8</span><span class=\"den\">3</span></span></span><div class=\"note\">Njutn–Lajbnicova formula: uvrsti gornju pa donju granicu i oduzmi.</div><span class=\"res\">= <span class=\"frac\"><span class=\"num\">8</span><span class=\"den\">3</span></span> ≈ 2,67</span>"}], "en": [{"tag": "Limit · „0/0“ form", "q": "Compute <span class=\"lim\">lim<span class=\"und\">x→3</span></span> <span class=\"frac\"><span class=\"num\">x² − 9</span><span class=\"den\">x − 3</span></span>.", "o": ["3", "6", "0", "∞"], "c": 1, "sol": "<span class=\"step\"><span class=\"lim\">lim<span class=\"und\">x→3</span></span> <span class=\"frac\"><span class=\"num\">x² − 9</span><span class=\"den\">x − 3</span></span> = <span class=\"lim\">lim<span class=\"und\">x→3</span></span> <span class=\"frac\"><span class=\"num\">(x − 3)(x + 3)</span><span class=\"den\">x − 3</span></span></span><span class=\"step\">= <span class=\"lim\">lim<span class=\"und\">x→3</span></span> (x + 3) = 3 + 3</span><div class=\"note\">We factor the numerator and cancel (x − 3), removing the „0/0“ form.</div><span class=\"res\">= 6</span>"}, {"tag": "Limit · L'Hôpital's rule", "q": "Compute <span class=\"lim\">lim<span class=\"und\">x→0</span></span> <span class=\"frac\"><span class=\"num\">e<sup>x</sup> − 1</span><span class=\"den\">x</span></span>.", "o": ["0", "1", "e", "∞"], "c": 1, "sol": "<span class=\"step\"><span class=\"lim\">lim<span class=\"und\">x→0</span></span> <span class=\"frac\"><span class=\"num\">(e<sup>x</sup> − 1)′</span><span class=\"den\">(x)′</span></span> = <span class=\"lim\">lim<span class=\"und\">x→0</span></span> <span class=\"frac\"><span class=\"num\">e<sup>x</sup></span><span class=\"den\">1</span></span></span><span class=\"step\">= e<sup>0</sup></span><div class=\"note\">Substitution gives „0/0“, so we apply L'Hôpital's rule (derivative of top over derivative of bottom).</div><span class=\"res\">= 1</span>"}, {"tag": "Derivative of a composite", "q": "Find the derivative of f(x) = sin(3x² + 1).", "o": ["cos(3x² + 1)", "6x·cos(3x² + 1)", "6x", "−sin(3x² + 1)"], "c": 1, "sol": "<span class=\"step\">f′(x) = cos(3x² + 1) · (3x² + 1)′</span><span class=\"step\">= cos(3x² + 1) · 6x</span><div class=\"note\">Chain rule: derivative of the outer function times derivative of the inner.</div><span class=\"res\">f′(x) = 6x·cos(3x² + 1)</span>"}, {"tag": "Extrema of a function", "q": "Find the extrema of f(x) = x³ − 3x.", "o": ["min (1, −2), max (−1, 2)", "min (−1, 2), max (1, −2)", "min only at x = 0", "no extrema"], "c": 0, "sol": "<span class=\"step\">f′(x) = 3x² − 3 = 0 ⇒ x = ±1</span><span class=\"step\">f″(x) = 6x</span><span class=\"step\">f(1) = −2, f(−1) = 2</span><div class=\"note\">f″(1) &gt; 0 → minimum; f″(−1) &lt; 0 → maximum.</div><span class=\"res\">min (1, −2) · max (−1, 2)</span>"}, {"tag": "Indefinite integral · substitution", "q": "Compute ∫ 2x · e<sup>x²</sup> dx.", "o": ["e<sup>x²</sup> + C", "2e<sup>x²</sup> + C", "x²·e<sup>x²</sup> + C", "e<sup>2x</sup> + C"], "c": 0, "sol": "<span class=\"step\">∫ 2x · e<sup>x²</sup> dx = ∫ e<sup>t</sup> dt</span><span class=\"step\">= e<sup>t</sup> + C</span><div class=\"note\">Substitution: t = x², so dt = 2x dx — exactly what sits next to the exponent.</div><span class=\"res\">= e<sup>x²</sup> + C</span>"}, {"tag": "Definite integral · area", "q": "Compute the area under y = x² on [0, 2].", "o": ["<span class=\"frac\"><span class=\"num\">8</span><span class=\"den\">3</span></span>", "4", "8", "2"], "c": 0, "sol": "<span class=\"step\">∫<sub>0</sub><sup>2</sup> x² dx = <span class=\"frac\"><span class=\"num\">x³</span><span class=\"den\">3</span></span> ∣<sub>0</sub><sup>2</sup></span><span class=\"step\">= <span class=\"frac\"><span class=\"num\">2³</span><span class=\"den\">3</span></span> − 0 = <span class=\"frac\"><span class=\"num\">8</span><span class=\"den\">3</span></span></span><div class=\"note\">Newton–Leibniz formula: plug in the upper then the lower limit and subtract.</div><span class=\"res\">= <span class=\"frac\"><span class=\"num\">8</span><span class=\"den\">3</span></span> ≈ 2,67</span>"}], "de": [{"tag": "Grenzwert · Form „0/0“", "q": "Berechne <span class=\"lim\">lim<span class=\"und\">x→3</span></span> <span class=\"frac\"><span class=\"num\">x² − 9</span><span class=\"den\">x − 3</span></span>.", "o": ["3", "6", "0", "∞"], "c": 1, "sol": "<span class=\"step\"><span class=\"lim\">lim<span class=\"und\">x→3</span></span> <span class=\"frac\"><span class=\"num\">x² − 9</span><span class=\"den\">x − 3</span></span> = <span class=\"lim\">lim<span class=\"und\">x→3</span></span> <span class=\"frac\"><span class=\"num\">(x − 3)(x + 3)</span><span class=\"den\">x − 3</span></span></span><span class=\"step\">= <span class=\"lim\">lim<span class=\"und\">x→3</span></span> (x + 3) = 3 + 3</span><div class=\"note\">Wir faktorisieren den Zähler und kürzen (x − 3) — so verschwindet die Form „0/0“.</div><span class=\"res\">= 6</span>"}, {"tag": "Grenzwert · Regel von L'Hôpital", "q": "Berechne <span class=\"lim\">lim<span class=\"und\">x→0</span></span> <span class=\"frac\"><span class=\"num\">e<sup>x</sup> − 1</span><span class=\"den\">x</span></span>.", "o": ["0", "1", "e", "∞"], "c": 1, "sol": "<span class=\"step\"><span class=\"lim\">lim<span class=\"und\">x→0</span></span> <span class=\"frac\"><span class=\"num\">(e<sup>x</sup> − 1)′</span><span class=\"den\">(x)′</span></span> = <span class=\"lim\">lim<span class=\"und\">x→0</span></span> <span class=\"frac\"><span class=\"num\">e<sup>x</sup></span><span class=\"den\">1</span></span></span><span class=\"step\">= e<sup>0</sup></span><div class=\"note\">Einsetzen ergibt „0/0“, also wenden wir die Regel von L'Hôpital an (Ableitung des Zählers durch Ableitung des Nenners).</div><span class=\"res\">= 1</span>"}, {"tag": "Ableitung einer Verkettung", "q": "Bestimme die Ableitung von f(x) = sin(3x² + 1).", "o": ["cos(3x² + 1)", "6x·cos(3x² + 1)", "6x", "−sin(3x² + 1)"], "c": 1, "sol": "<span class=\"step\">f′(x) = cos(3x² + 1) · (3x² + 1)′</span><span class=\"step\">= cos(3x² + 1) · 6x</span><div class=\"note\">Kettenregel: Ableitung der äußeren mal Ableitung der inneren Funktion.</div><span class=\"res\">f′(x) = 6x·cos(3x² + 1)</span>"}, {"tag": "Extrema einer Funktion", "q": "Bestimme die Extrema von f(x) = x³ − 3x.", "o": ["Min (1, −2), Max (−1, 2)", "min (−1, 2), max (1, −2)", "nur Min bei x = 0", "keine Extrema"], "c": 0, "sol": "<span class=\"step\">f′(x) = 3x² − 3 = 0 ⇒ x = ±1</span><span class=\"step\">f″(x) = 6x</span><span class=\"step\">f(1) = −2, f(−1) = 2</span><div class=\"note\">f″(1) &gt; 0 → Minimum; f″(−1) &lt; 0 → Maximum.</div><span class=\"res\">min (1, −2) · max (−1, 2)</span>"}, {"tag": "Unbestimmtes Integral · Substitution", "q": "Berechne ∫ 2x · e<sup>x²</sup> dx.", "o": ["e<sup>x²</sup> + C", "2e<sup>x²</sup> + C", "x²·e<sup>x²</sup> + C", "e<sup>2x</sup> + C"], "c": 0, "sol": "<span class=\"step\">∫ 2x · e<sup>x²</sup> dx = ∫ e<sup>t</sup> dt</span><span class=\"step\">= e<sup>t</sup> + C</span><div class=\"note\">Substitution: t = x², also dt = 2x dx — genau das neben dem Exponenten.</div><span class=\"res\">= e<sup>x²</sup> + C</span>"}, {"tag": "Bestimmtes Integral · Fläche", "q": "Berechne die Fläche unter y = x² auf [0, 2].", "o": ["<span class=\"frac\"><span class=\"num\">8</span><span class=\"den\">3</span></span>", "4", "8", "2"], "c": 0, "sol": "<span class=\"step\">∫<sub>0</sub><sup>2</sup> x² dx = <span class=\"frac\"><span class=\"num\">x³</span><span class=\"den\">3</span></span> ∣<sub>0</sub><sup>2</sup></span><span class=\"step\">= <span class=\"frac\"><span class=\"num\">2³</span><span class=\"den\">3</span></span> − 0 = <span class=\"frac\"><span class=\"num\">8</span><span class=\"den\">3</span></span></span><div class=\"note\">Newton–Leibniz-Formel: obere und untere Grenze einsetzen und subtrahieren.</div><span class=\"res\">= <span class=\"frac\"><span class=\"num\">8</span><span class=\"den\">3</span></span> ≈ 2,67</span>"}], "fr": [{"tag": "Limite · forme « 0/0 »", "q": "Calcule <span class=\"lim\">lim<span class=\"und\">x→3</span></span> <span class=\"frac\"><span class=\"num\">x² − 9</span><span class=\"den\">x − 3</span></span>.", "o": ["3", "6", "0", "∞"], "c": 1, "sol": "<span class=\"step\"><span class=\"lim\">lim<span class=\"und\">x→3</span></span> <span class=\"frac\"><span class=\"num\">x² − 9</span><span class=\"den\">x − 3</span></span> = <span sup> − 1</span><span class=\"den\">x</span></span>.", "o": ["0", "1", "e", "∞"], "c": 1, "sol": "<span class=\"step\"><span class=\"lim\">lim<span class=\"und\">x→0</span></span> <span class=\"frac\"><span class=\"num\">(e<sup>x</sup> − 1)′</span><span class=\"den\">(x)′</span></span> = <span class=\"lim\">lim<span class=\"und\">x→0</span></span> <span class=\"frac\"><span class=\"num\">e<sup>x</sup></span><span class=\"den\">1</span></span></span><span class=\"step\">= e<sup>0</sup></span><div class=\"note\">A substituição dá „0/0“, então aplicamos a regra de L'Hôpital (derivada de cima sobre derivada de baixo).</div><span class=\"res\">= 1</span>"}, {"tag": "Derivada de uma composta", "q": "Encontra a derivada de f(x) = sin(3x² + 1).", "o": ["cos(3x² + 1)", "6x·cos(3x² + 1)", "6x", "−sin(3x² + 1)"], "c": 1, "sol": "<span class=\"step\">f′(x) = cos(3x² + 1) · (3x² + 1)′</span><span class=\"step\">= cos(3x² + 1) · 6x</span><div class=\"note\">Regra da cadeia: derivada da externa vezes derivada da interna.</div><span class=\"res\">f′(x) = 6x·cos(3x² + 1)</span>"}, {"tag": "Extremos de uma função", "q": "Determina os extremos de f(x) = x³ − 3x.", "o": ["mín (1, −2), máx (−1, 2)", "min (−1, 2), max (1, −2)", "apenas mín em x = 0", "sem extremos"], "c": 0, "sol": "<span class=\"step\">f′(x) = 3x² − 3 = 0 ⇒ x = ±1</span><span class=\"step\">f″(x) = 6x</span><span class=\"step\">f(1) = −2, f(−1) = 2</span><div class=\"note\">f″(1) &gt; 0 → mínimo; f″(−1) &lt; 0 → máximo.</div><span class=\"res\">min (1, −2) · max (−1, 2)</span>"}, {"tag": "Integral indefinido · substituição", "q": "Calcula ∫ 2x · e<sup>x²</sup> dx.", "o": ["e<sup>x²</sup> + C", "2e<sup>x²</sup> + C", "x²·e<sup>x²</sup> + C", "e<sup>2x</sup> + C"], "c": 0, "sol": "<span class=\"step\">∫ 2x · e<sup>x²</sup> dx = ∫ e<sup>t</sup> dt</span><span class=\"step\">= e<sup>t</sup> + C</span><div class=\"note\">Substituição: t = x², logo dt = 2x dx — exatamente o que está junto ao expoente.</div><span class=\"res\">= e<sup>x²</sup> + C</span>"}, {"tag": "Integral definido · área", "q": "Calcula a área sob y = x² em [0, 2].", "o": ["<span class=\"frac\"><span class=\"num\">8</span><span class=\"den\">3</span></span>", "4", "8", "2"], "c": 0, "sol": "<span class=\"step\">∫<sub>0</sub><sup>2</sup> x² dx = <span class=\"frac\"><span class=\"num\">x³</span><span class=\"den\">3</span></span> ∣<sub>0</sub><sup>2</sup></span><span class=\"step\">= <span class=\"frac\"><span class=\"num\">2³</span><span class=\"den\">3</span></span> − 0 = <span class=\"frac\"><span class=\"num\">8</span><span class=\"den\">3</span></span></span><div class=\"note\">Fórmula de Newton–Leibniz: substitui o limite superior e o inferior e subtrai.</div><span class=\"res\">= <span class=\"frac\"><span class=\"num\">8</span><span class=\"den\">3</span></span> ≈ 2,67</span>"}]};
var LANG='sr';try{LANG=(localStorage.getItem('mathia_lang')||'sr').toLowerCase();}catch(e){}if(!DATA[LANG])LANG='sr';
var Q=DATA[LANG];
function tr(l){if(!DATA[l])l='sr';LANG=l;Q=DATA[l];try{localStorage.setItem('mathia_lang',l);}catch(e){}document.documentElement.lang=l;document.querySelectorAll('[data-i18n]').forEach(function(e){var k=e.getAttribute('data-i18n');if(I18N[k]&&I18N[k][l])e.textContent=I18N[k][l];});document.querySelectorAll('[data-i18n-html]').forEach(function(e){var k=e.getAttribute('data-i18n-html');if(I18N[k]&&I18N[k][l])e.innerHTML=I18N[k][l];});var sel=document.getElementById('qlang');if(sel)sel.value=l;render();}


  var idx=0, revealed=false, L=["A","B","C","D","E"];
  var qcard=document.getElementById("qcard"),end=document.getElementById("end");
  function pick(k,el){
    var op=document.getElementById("opts"); if(op.classList.contains("locked")) return;
    op.classList.add("locked"); var it=Q[idx], nd=op.children;
    for(var j=0;j<nd.length;j++){ if(j===it.c) nd[j].classList.add("correct"); }
    var fb=document.getElementById("fb");
    if(k===it.c){ fb.className="fb ok"; fb.textContent=I18N.fbOk[LANG]; }
    else{ el.classList.add("wrong"); fb.className="fb no"; fb.textContent=I18N.fbNo[LANG]; }
    document.getElementById("nextBtn").style.display="";
  }
  function render(){
    var it=Q[idx];
    document.getElementById("tag").innerHTML=it.tag;
    document.getElementById("qtxt").innerHTML=it.q;
    var op=document.getElementById("opts"); op.className="opts"; op.innerHTML="";
    (it.o||[]).forEach(function(txt,k){ var b=document.createElement("div"); b.className="opt"; b.innerHTML='<span class="mk">'+L[k]+'</span><span>'+txt+'</span>'; b.addEventListener("click",function(){ pick(k,b); }); op.appendChild(b); });
    var fb=document.getElementById("fb"); fb.className="fb"; fb.textContent="";
    document.getElementById("solbody").innerHTML=it.sol;
    document.getElementById("sol").classList.remove("on");
    document.getElementById("revealBtn").style.display="";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("nextBtn").textContent = (idx===Q.length-1 ? I18N.nextEnd[LANG] : I18N.nextMid[LANG]);
    document.getElementById("prevBtn").style.visibility = idx>0 ? "visible":"hidden";
    document.getElementById("qnum").textContent=I18N.qnum[LANG]+" "+(idx+1)+" / "+Q.length;
    document.getElementById("bar").style.width=((idx)/Q.length*100)+"%";
    revealed=false;
    window.scrollTo({top:0,behavior:"smooth"});
  }
  document.getElementById("revealBtn").addEventListener("click",function(){
    document.getElementById("sol").classList.add("on");
    this.style.display="none";
    document.getElementById("nextBtn").style.display="";
    revealed=true;
  });
  document.getElementById("nextBtn").addEventListener("click",function(){
    if(idx<Q.length-1){idx++;render();}
    else{ // kraj
      document.getElementById("bar").style.width="100%";
      qcard.style.display="none";document.getElementById("qnum").style.display="none";document.querySelector(".prog").style.display="none";
      end.classList.add("on");window.scrollTo({top:0,behavior:"smooth"});
    }
  });
  document.getElementById("prevBtn").addEventListener("click",function(){ if(idx>0){idx--;render();} });
  document.getElementById("againBtn").addEventListener("click",function(){
    idx=0;end.classList.remove("on");qcard.style.display="";document.getElementById("qnum").style.display="";document.querySelector(".prog").style.display="";render();
  });
  var _sel=document.getElementById('qlang');if(_sel){_sel.value=LANG;_sel.addEventListener('change',function(){tr(this.value);});}
  tr(LANG);
})();
</script>

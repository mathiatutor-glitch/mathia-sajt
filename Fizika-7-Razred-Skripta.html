<style>
:root{--cream:#FBF6EE;--ink:#5A1024;--ink2:#7A3346;--gold:#C6A05C;--goldlt:#F0DCA8;--malina:#B01E48;--malina2:#CC5E7E;--mint:#3FB98C;--muted:#8A7A80}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#43303A;min-height:100vh;
 background:radial-gradient(520px 400px at 104% -6%,#F6E1EC 0,transparent 56%),radial-gradient(500px 380px at -6% 106%,#F7ECD6 0,transparent 58%),var(--cream);overflow-x:hidden}
#fall{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fall span{position:absolute;top:-8%;font-family:'Spectral',serif;font-style:italic;color:rgba(198,160,92,.22);animation:fl linear infinite}

@keyframes fl{0%{transform:translateY(-10vh) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(112vh) rotate(24deg);opacity:0}}
.wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:14px 16px 30px}
.top{display:flex;align-items:center;gap:10px;padding:4px 2px 10px}
.top .back{color:var(--ink2);text-decoration:none;font-weight:800;font-size:1.1rem}
.top .lang{margin-left:auto;border:1px solid var(--goldlt);border-radius:100px;padding:5px 10px;font-family:inherit;font-weight:800;font-size:.72rem;color:var(--ink);background:#fff}
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:#E6D5CE;transition:.3s}
.dots i.on{background:linear-gradient(90deg,var(--gold),var(--malina));transform:scale(1.25)}
.dots i.done{background:var(--goldlt)}
.stage{position:relative;min-height:62vh}
.card{position:relative;background:linear-gradient(180deg,#FFFDF9,#FDF3EA);border:1px solid var(--goldlt);border-radius:32px;
 padding:26px 22px 22px;box-shadow:0 30px 70px -34px rgba(90,16,36,.5);animation:slidein .45s cubic-bezier(.2,.9,.2,1)}
@keyframes slidein{0%{transform:translateX(28px) scale(.97);opacity:0}100%{transform:translateX(0) scale(1);opacity:1}}
.eyebrow{text-align:center;font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:.64rem;color:var(--malina)}
.mascot{width:82px;height:82px;margin:8px auto 4px;border-radius:50%;display:grid;place-items:center;font-size:2.6rem;background:radial-gradient(circle at 40% 34%,#FFF3F7,#F6E1EC);border:2px solid var(--goldlt);box-shadow:0 14px 28px -12px rgba(176,30,72,.4);animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.tnum{text-align:center;color:var(--muted);font-weight:800;font-size:.78rem;margin-top:6px}
.ttl{font-family:'Spectral',serif;font-weight:700;color:var(--ink);font-size:1.75rem;text-align:center;line-height:1.2;margin:2px 0 8px}
.theory{color:#5a4750;font-size:1.02rem;text-align:center;line-height:1.55;margin:0 auto 14px;max-width:460px}
.theory b{color:var(--ink)}
.fx{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 4px}
.fx span{display:inline-block;background:#fff;border:1px dashed var(--goldlt);border-radius:14px;padding:9px 14px;font-family:'Spectral','Cambria Math',Georgia,serif;color:var(--ink);font-size:1.05rem;animation:pop .4s both}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.zap{margin:16px auto 2px;max-width:460px;background:linear-gradient(180deg,#FFF7FA,#FBEEF2);border:1px solid #F0D6DF;border-radius:18px;padding:13px 16px;display:flex;gap:10px;align-items:flex-start}
.zap .st{font-size:1.4rem;line-height:1}
.zap p{margin:0;color:var(--ink2);font-size:.95rem;font-weight:600}
.nav{display:flex;align-items:center;gap:12px;margin-top:16px}
.nav .prev{background:none;border:none;color:var(--ink2);font-weight:800;cursor:pointer;font-size:1rem;padding:8px}
.nav .next{flex:1;border:none;cursor:pointer;background:linear-gradient(135deg,var(--malina2),var(--malina));color:#fff;font-weight:900;font-size:1.05rem;padding:14px;border-radius:100px;box-shadow:0 16px 30px -14px rgba(176,30,72,.6);transition:transform .15s}
.nav .next:hover{transform:translateY(-2px)}
.fin{text-align:center}
.fin .big{font-size:3.4rem}
.fin h2{font-family:'Spectral',serif;color:var(--ink);font-size:1.9rem;margin:4px 0}
.fin p{color:var(--ink2)}
.fin .cta{display:block;margin-top:12px;text-decoration:none;text-align:center;background:linear-gradient(135deg,var(--malina2),var(--malina));color:#fff;font-weight:900;padding:14px;border-radius:100px;box-shadow:0 16px 30px -14px rgba(176,30,72,.6)}
.fin .cta2{display:block;margin-top:10px;text-decoration:none;color:var(--ink2);font-weight:800}
#conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#conf i{position:absolute;top:-6%;width:10px;height:14px;border-radius:2px;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(560deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
var D={"eyebrow": {"sr": "Fizika · 7. razred", "en": "Physics · Grade 7", "de": "Physik · 7. Klasse", "fr": "Physique · 7e année", "es": "Física · 7º grado", "it": "Fisica · 7ª classe", "ru": "Физика · 7 класс", "pt": "Física · 7º ano"}, "topics": [{"name": {"sr": "Sila i kretanje", "en": "Force and Motion", "de": "Kraft und Bewegung", "fr": "Force et mouvement", "es": "Fuerza y movimiento", "it": "Forza e movimento", "ru": "Сила и движение", "pt": "Força e movimento"}, "theory": {"sr": "<b>Kretanje</b> je promena položaja tela u odnosu na drugo telo (referentno telo) tokom vremena. Brzina pokazuje koliki put telo pređe u jedinici vremena i računa se kao v = s/t. Kretanje može biti <b>ravnomerno</b> (brzina se ne menja) ili <b>ubrzano</b> (brzina se menja). <b>Sila</b> je uzrok promene brzine tela — ona ga ubrzava, usporava ili menja pravac kretanja. Sila se meri u njutnima (N) i predstavlja se vektorom, jer ima intenzitet, pravac i smer.", "en": "<b>Motion</b> is the change of a body's position relative to another body (the reference body) over time. Speed shows how much distance a body covers per unit of time and is calculated as v = s/t. Motion can be <b>uniform</b> (speed stays constant) or <b>accelerated</b> (speed changes). <b>Force</b> is the cause of a change in a body's velocity — it speeds it up, slows it down, or changes its direction. Force is measured in newtons (N) and represented as a vector, since it has magnitude, direction and orientation.", "de": "<b>Bewegung</b> ist die Änderung der Lage eines Körpers gegenüber einem anderen Körper (dem Bezugskörper) im Laufe der Zeit. Die Geschwindigkeit zeigt, welchen Weg ein Körper in einer Zeiteinheit zurücklegt, und wird als v = s/t berechnet. Eine Bewegung kann <b>gleichförmig</b> (die Geschwindigkeit ändert sich nicht) oder <b>beschleunigt</b> (die Geschwindigkeit ändert sich) sein. Die <b>Kraft</b> ist die Ursache für die Änderung der Geschwindigkeit eines Körpers — sie beschleunigt ihn, bremst ihn oder ändert seine Bewegungsrichtung. Kraft wird in Newton (N) gemessen und als Vektor dargestellt, da sie Betrag, Richtung und Orientierung besitzt.", "fr": "Le <b>mouvement</b> est le changement de position d'un corps par rapport à un autre corps (le corps de référence) au fil du temps. La vitesse indique la distance parcourue par un corps par unité de temps et se calcule par v = s/t. Le mouvement peut être <b>uniforme</b> (la vitesse ne change pas) ou <b>accéléré</b> (la vitesse change). La <b>force</b> est la cause du changement de vitesse d'un corps — elle l'accélère, le ralentit ou change sa direction. La force se mesure en newtons (N) et se représente par un vecteur, car elle a une intensité, une direction et un sens.", "es": "El <b>movimiento</b> es el cambio de posición de un cuerpo respecto a otro cuerpo (el cuerpo de referencia) a lo largo del tiempo. La velocidad indica qué distancia recorre un cuerpo por unidad de tiempo y se calcula como v = s/t. El movimiento puede ser <b>uniforme</b> (la velocidad no cambia) o <b>acelerado</b> (la velocidad cambia). La <b>fuerza</b> es la causa del cambio de velocidad de un cuerpo — lo acelera, lo frena o cambia su dirección. La fuerza se mide en newtons (N) y se representa mediante un vector, ya que tiene magnitud, dirección y sentido.", "it": "Il <b>moto</b> è il cambiamento della posizione di un corpo rispetto a un altro corpo (il corpo di riferimento) nel tempo. La velocità indica quanta distanza percorre un corpo nell'unità di tempo e si calcola come v = s/t. Il moto può essere <b>uniforme</b> (la velocità non cambia) o <b>accelerato</b> (la velocità cambia). La <b>forza</b> è la causa del cambiamento di velocità di un corpo — lo accelera, lo rallenta o ne cambia la direzione. La forza si misura in newton (N) e si rappresenta con un vettore, poiché ha intensità, direzione e verso.", "ru": "<b>Движение</b> — это изменение положения тела относительно другого тела (тела отсчёта) с течением времени. Скорость показывает, какой путь проходит тело за единицу времени, и вычисляется как v = s/t. Движение может быть <b>равномерным</b> (скорость не меняется) или <b>ускоренным</b> (скорость меняется). <b>Сила</b> — причина изменения скорости тела: она разгоняет его, замедляет или меняет направление движения. Сила измеряется в ньютонах (Н) и представляется вектором, так как имеет величину, направление и ориентацию.", "pt": "O <b>movimento</b> é a mudança de posição de um corpo em relação a outro corpo (o corpo de referência) ao longo do tempo. A velocidade mostra que distância um corpo percorre por unidade de tempo e é calculada como v = s/t. O movimento pode ser <b>uniforme</b> (a velocidade não muda) ou <b>acelerado</b> (a velocidade muda). A <b>força</b> é a causa da mudança de velocidade de um corpo — ela o acelera, o desacelera ou muda sua direção. A força é medida em newtons (N) e representada por um vetor, pois tem intensidade, direção e sentido."}, "formulas": [{"sr": "v = s / t — brzina (v) je odnos pređenog puta (s) i vremena (t)", "en": "v = s / t — speed (v) is the ratio of the distance covered (s) to time (t)", "de": "v = s / t — die Geschwindigkeit (v) ist das Verhältnis des zurückgelegten Weges (s) zur Zeit (t)", "fr": "v = s / t — la vitesse (v) est le rapport entre la distance parcourue (s) et le temps (t)", "es": "v = s / t — la velocidad (v) es la relación entre la distancia recorrida (s) y el tiempo (t)", "it": "v = s / t — la velocità (v) è il rapporto tra lo spazio percorso (s) e il tempo (t)", "ru": "v = s / t — скорость (v) равна отношению пройденного пути (s) ко времени (t)", "pt": "v = s / t — a velocidade (v) é a razão entre a distância percorrida (s) e o tempo (t)"}, {"sr": "a = Δv / Δt — ubrzanje (a) je promena brzine (Δv) u jedinici vremena (Δt)", "en": "a = Δv / Δt — acceleration (a) is the change in speed (Δv) per unit of time (Δt)", "de": "a = Δv / Δt — die Beschleunigung (a) ist die Geschwindigkeitsänderung (Δv) pro Zeiteinheit (Δt)", "fr": "a = Δv / Δt — l'accélération (a) est la variation de vitesse (Δv) par unité de temps (Δt)", "es": "a = Δv / Δt — la aceleración (a) es el cambio de velocidad (Δv) por unidad de tiempo (Δt)", "it": "a = Δv / Δt — l'accelerazione (a) è la variazione di velocità (Δv) nell'unità di tempo (Δt)", "ru": "a = Δv / Δt — ускорение (a) — это изменение скорости (Δv) за единицу времени (Δt)", "pt": "a = Δv / Δt — a aceleração (a) é a variação de velocidade (Δv) por unidade de tempo (Δt)"}], "remember": {"sr": "Ne mešaj brzinu izraženu u m/s i u km/h — da bi ih uporedio, prvo ih svedi na istu jedinicu (1 m/s = 3,6 km/h).", "en": "Don't mix up speed given in m/s and in km/h — to compare them, first convert to the same unit (1 m/s = 3.6 km/h).", "de": "Verwechsle nicht Geschwindigkeiten in m/s und in km/h — um sie zu vergleichen, rechne sie zuerst in dieselbe Einheit um (1 m/s = 3,6 km/h).", "fr": "Ne confonds pas la vitesse exprimée en m/s et en km/h — pour les comparer, convertis-les d'abord dans la même unité (1 m/s = 3,6 km/h).", "es": "No confundas la velocidad expresada en m/s y en km/h — para compararlas, conviértelas primero a la misma unidad (1 m/s = 3,6 km/h).", "it": "Non confondere la velocità espressa in m/s e in km/h — per confrontarle, convertile prima nella stessa unità (1 m/s = 3,6 km/h).", "ru": "Не путай скорость в м/с и в км/ч — чтобы их сравнить, сначала переведи в одну единицу измерения (1 м/с = 3,6 км/ч).", "pt": "Não confunda a velocidade em m/s e em km/h — para compará-las, converta-as primeiro para a mesma unidade (1 m/s = 3,6 km/h)."}, "problem": {"statement": {"sr": "Automobil pređe put od 180 km za 2 sata. Kolika je njegova prosečna brzina, izražena u km/h i u m/s?", "en": "A car covers a distance of 180 km in 2 hours. What is its average speed, expressed in km/h and in m/s?", "de": "Ein Auto legt eine Strecke von 180 km in 2 Stunden zurück. Wie groß ist seine Durchschnittsgeschwindigkeit, ausgedrückt in km/h und in m/s?", "fr": "Une voiture parcourt 180 km en 2 heures. Quelle est sa vitesse moyenne, exprimée en km/h et en m/s ?", "es": "Un automóvil recorre 180 km en 2 horas. ¿Cuál es su velocidad media, expresada en km/h y en m/s?", "it": "Un'automobile percorre 180 km in 2 ore. Qual è la sua velocità media, espressa in km/h e in m/s?", "ru": "Автомобиль проезжает путь 180 км за 2 часа. Какова его средняя скорость, выраженная в км/ч и в м/с?", "pt": "Um carro percorre 180 km em 2 horas. Qual é a sua velocidade média, expressa em km/h e em m/s?"}, "steps": [{"sr": "Zapiši podatke: s = 180 km, t = 2 h. Tražimo v.", "en": "Write down the data: s = 180 km, t = 2 h. We need to find v.", "de": "Notiere die Daten: s = 180 km, t = 2 h. Gesucht ist v.", "fr": "Note les données : s = 180 km, t = 2 h. On cherche v.", "es": "Anota los datos: s = 180 km, t = 2 h. Buscamos v.", "it": "Scrivi i dati: s = 180 km, t = 2 h. Cerchiamo v.", "ru": "Запишем данные: s = 180 км, t = 2 ч. Нужно найти v.", "pt": "Anote os dados: s = 180 km, t = 2 h. Procuramos v."}, {"sr": "Primeni formulu v = s/t = 180 km / 2 h = 90 km/h.", "en": "Apply the formula v = s/t = 180 km / 2 h = 90 km/h.", "de": "Wende die Formel v = s/t = 180 km / 2 h = 90 km/h an.", "fr": "Applique la formule v = s/t = 180 km / 2 h = 90 km/h.", "es": "Aplica la fórmula v = s/t = 180 km / 2 h = 90 km/h.", "it": "Applica la formula v = s/t = 180 km / 2 h = 90 km/h.", "ru": "Применим формулу v = s/t = 180 км / 2 ч = 90 км/ч.", "pt": "Aplique a fórmula v = s/t = 180 km / 2 h = 90 km/h."}, {"sr": "Pretvori u m/s: 90 km/h : 3,6 = 25 m/s. Prosečna brzina je 90 km/h, odnosno 25 m/s.", "en": "Convert to m/s: 90 km/h : 3.6 = 25 m/s. The average speed is 90 km/h, i.e. 25 m/s.", "de": "Rechne in m/s um: 90 km/h : 3,6 = 25 m/s. Die Durchschnittsgeschwindigkeit beträgt 90 km/h bzw. 25 m/s.", "fr": "Convertis en m/s : 90 km/h : 3,6 = 25 m/s. La vitesse moyenne est de 90 km/h, soit 25 m/s.", "es": "Convierte a m/s: 90 km/h : 3,6 = 25 m/s. La velocidad media es de 90 km/h, es decir, 25 m/s.", "it": "Converti in m/s: 90 km/h : 3,6 = 25 m/s. La velocità media è 90 km/h, cioè 25 m/s.", "ru": "Переведём в м/с: 90 км/ч : 3,6 = 25 м/с. Средняя скорость составляет 90 км/ч, то есть 25 м/с.", "pt": "Converta para m/s: 90 km/h : 3,6 = 25 m/s. A velocidade média é 90 km/h, ou seja, 25 m/s."}]}}, {"name": {"sr": "Njutnovi zakoni", "en": "Newton's Laws", "de": "Newtonsche Gesetze", "fr": "Les lois de Newton", "es": "Leyes de Newton", "it": "Le leggi di Newton", "ru": "Законы Ньютона", "pt": "Leis de Newton"}, "theory": {"sr": "<b>Prvi Njutnov zakon (zakon inercije)</b> kaže da telo ostaje u stanju mirovanja ili ravnomernog pravolinijskog kretanja dok na njega ne deluje neka sila koja to stanje menja. <b>Drugi Njutnov zakon</b> povezuje silu, masu i ubrzanje: sila je proizvod mase tela i ubrzanja koje mu ta sila daje (F = m · a) — što je telo masivnije, potrebna je veća sila za isto ubrzanje. <b>Treći Njutnov zakon (akcija i reakcija)</b> kaže da kada jedno telo deluje silom na drugo, i drugo telo deluje na prvo silom istog intenziteta, ali suprotnog smera.", "en": "<b>Newton's first law (the law of inertia)</b> states that a body remains at rest or in uniform straight-line motion unless a force acts on it to change that state. <b>Newton's second law</b> connects force, mass and acceleration: force equals the product of a body's mass and the acceleration that force produces (F = m · a) — the more massive the body, the greater the force needed for the same acceleration. <b>Newton's third law (action and reaction)</b> states that when one body exerts a force on another, the second body exerts a force of equal magnitude but opposite direction back on the first.", "de": "Das <b>erste Newtonsche Gesetz (Trägheitsgesetz)</b> besagt, dass ein Körper im Zustand der Ruhe oder der gleichförmigen geradlinigen Bewegung verharrt, solange keine Kraft auf ihn einwirkt, die diesen Zustand ändert. Das <b>zweite Newtonsche Gesetz</b> verbindet Kraft, Masse und Beschleunigung: Die Kraft ist das Produkt aus der Masse des Körpers und der Beschleunigung, die diese Kraft ihm verleiht (F = m · a) — je größer die Masse, desto größer die nötige Kraft für dieselbe Beschleunigung. Das <b>dritte Newtonsche Gesetz (Aktion und Reaktion)</b> besagt, dass wenn ein Körper eine Kraft auf einen anderen ausübt, der zweite Körper eine gleich große, aber entgegengesetzt gerichtete Kraft auf den ersten ausübt.", "fr": "La <b>première loi de Newton (loi d'inertie)</b> énonce qu'un corps reste au repos ou en mouvement rectiligne uniforme tant qu'aucune force n'agit sur lui pour changer cet état. La <b>deuxième loi de Newton</b> relie la force, la masse et l'accélération : la force est le produit de la masse du corps et de l'accélération qu'elle lui donne (F = m · a) — plus un corps est massif, plus la force nécessaire pour la même accélération est grande. La <b>troisième loi de Newton (action et réaction)</b> énonce que lorsqu'un corps exerce une force sur un autre, le second exerce sur le premier une force de même intensité mais de sens opposé.", "es": "La <b>primera ley de Newton (ley de la inercia)</b> establece que un cuerpo permanece en reposo o en movimiento rectilíneo uniforme mientras no actúe sobre él una fuerza que cambie ese estado. La <b>segunda ley de Newton</b> relaciona la fuerza, la masa y la aceleración: la fuerza es el producto de la masa del cuerpo y la aceleración que esa fuerza le produce (F = m · a) — cuanto más masivo es el cuerpo, mayor es la fuerza necesaria para la misma aceleración. La <b>tercera ley de Newton (acción y reacción)</b> establece que cuando un cuerpo ejerce una fuerza sobre otro, el segundo ejerce sobre el primero una fuerza de igual intensidad pero de sentido opuesto.", "it": "La <b>prima legge di Newton (legge d'inerzia)</b> afferma che un corpo resta in stato di quiete o di moto rettilineo uniforme finché non agisce su di esso una forza che modifica tale stato. La <b>seconda legge di Newton</b> collega forza, massa e accelerazione: la forza è il prodotto della massa del corpo per l'accelerazione che tale forza gli imprime (F = m · a) — più un corpo è massiccio, maggiore è la forza necessaria per la stessa accelerazione. La <b>terza legge di Newton (azione e reazione)</b> afferma che quando un corpo esercita una forza su un altro, il secondo esercita sul primo una forza di uguale intensità ma di verso opposto.", "ru": "<b>Первый закон Ньютона (закон инерции)</b> гласит, что тело сохраняет состояние покоя или равномерного прямолинейного движения, пока на него не подействует сила, изменяющая это состояние. <b>Второй закон Ньютона</b> связывает силу, массу и ускорение: сила равна произведению массы тела на ускорение, которое эта сила ему сообщает (F = m · a) — чем больше масса тела, тем большая сила нужна для того же ускорения. <b>Третий закон Ньютона (действие и противодействие)</b> гласит, что если одно тело действует силой на другое, то второе тело действует на первое силой такой же величины, но противоположного направления.", "pt": "A <b>primeira lei de Newton (lei da inércia)</b> afirma que um corpo permanece em repouso ou em movimento retilíneo uniforme enquanto nenhuma força atuar sobre ele para mudar esse estado. A <b>segunda lei de Newton</b> relaciona força, massa e aceleração: a força é o produto da massa do corpo pela aceleração que essa força lhe imprime (F = m · a) — quanto mais massivo o corpo, maior a força necessária para a mesma aceleração. A <b>terceira lei de Newton (ação e reação)</b> afirma que quando um corpo exerce uma força sobre outro, o segundo exerce sobre o primeiro uma força de igual intensidade, mas de sentido oposto."}, "formulas": [{"sr": "F = m · a — sila (F) je proizvod mase tela (m) i ubrzanja (a)", "en": "F = m · a — force (F) is the product of the body's mass (m) and its acceleration (a)", "de": "F = m · a — die Kraft (F) ist das Produkt aus der Masse des Körpers (m) und der Beschleunigung (a)", "fr": "F = m · a — la force (F) est le produit de la masse du corps (m) et de l'accélération (a)", "es": "F = m · a — la fuerza (F) es el producto de la masa del cuerpo (m) y la aceleración (a)", "it": "F = m · a — la forza (F) è il prodotto della massa del corpo (m) per l'accelerazione (a)", "ru": "F = m · a — сила (F) равна произведению массы тела (m) на ускорение (a)", "pt": "F = m · a — a força (F) é o produto da massa do corpo (m) pela aceleração (a)"}, {"sr": "G = m · g — težina tela (G) je proizvod mase (m) i gravitacionog ubrzanja (g ≈ 9,81 m/s²)", "en": "G = m · g — the weight of a body (G) is the product of its mass (m) and the gravitational acceleration (g ≈ 9.81 m/s²)", "de": "G = m · g — die Gewichtskraft eines Körpers (G) ist das Produkt aus der Masse (m) und der Fallbeschleunigung (g ≈ 9,81 m/s²)", "fr": "G = m · g — le poids d'un corps (G) est le produit de sa masse (m) et de l'accélération de la pesanteur (g ≈ 9,81 m/s²)", "es": "G = m · g — el peso de un cuerpo (G) es el producto de su masa (m) y la aceleración de la gravedad (g ≈ 9,81 m/s²)", "it": "G = m · g — il peso di un corpo (G) è il prodotto della sua massa (m) per l'accelerazione di gravità (g ≈ 9,81 m/s²)", "ru": "G = m · g — вес тела (G) равен произведению его массы (m) на ускорение свободного падения (g ≈ 9,81 м/с²)", "pt": "G = m · g — o peso de um corpo (G) é o produto da sua massa (m) pela aceleração da gravidade (g ≈ 9,81 m/s²)"}], "remember": {"sr": "Masa (m) i težina (G) nisu isto: masa je količina materije i ne menja se, a težina zavisi od gravitacije i meri se u njutnima, ne u kilogramima.", "en": "Mass (m) and weight (G) are not the same: mass is the amount of matter and does not change, while weight depends on gravity and is measured in newtons, not kilograms.", "de": "Masse (m) und Gewicht (G) sind nicht dasselbe: Die Masse ist die Menge an Materie und ändert sich nicht, das Gewicht hängt von der Schwerkraft ab und wird in Newton, nicht in Kilogramm gemessen.", "fr": "La masse (m) et le poids (G) ne sont pas la même chose : la masse est la quantité de matière et ne change pas, tandis que le poids dépend de la gravité et se mesure en newtons, pas en kilogrammes.", "es": "La masa (m) y el peso (G) no son lo mismo: la masa es la cantidad de materia y no cambia, mientras que el peso depende de la gravedad y se mide en newtons, no en kilogramos.", "it": "Massa (m) e peso (G) non sono la stessa cosa: la massa è la quantità di materia e non cambia, mentre il peso dipende dalla gravità e si misura in newton, non in chilogrammi.", "ru": "Масса (m) и вес (G) — не одно и то же: масса — это количество вещества, она не меняется, а вес зависит от силы тяжести и измеряется в ньютонах, а не в килограммах.", "pt": "Massa (m) e peso (G) não são a mesma coisa: a massa é a quantidade de matéria e não muda, enquanto o peso depende da gravidade e é medido em newtons, não em quilogramas."}, "problem": {"statement": {"sr": "Kolika je sila potrebna da telo mase 5 kg dobije ubrzanje od 4 m/s²?", "en": "What force is needed to give a body of mass 5 kg an acceleration of 4 m/s²?", "de": "Welche Kraft ist nötig, damit ein Körper mit einer Masse von 5 kg eine Beschleunigung von 4 m/s² erhält?", "fr": "Quelle force faut-il pour donner à un corps de masse 5 kg une accélération de 4 m/s² ?", "es": "¿Qué fuerza se necesita para que un cuerpo de masa 5 kg adquiera una aceleración de 4 m/s²?", "it": "Quale forza è necessaria affinché un corpo di massa 5 kg acquisisca un'accelerazione di 4 m/s²?", "ru": "Какая сила нужна, чтобы тело массой 5 кг получило ускорение 4 м/с²?", "pt": "Que força é necessária para que um corpo de massa 5 kg adquira uma aceleração de 4 m/s²?"}, "steps": [{"sr": "Zapiši podatke: m = 5 kg, a = 4 m/s². Tražimo F.", "en": "Write down the data: m = 5 kg, a = 4 m/s². We need to find F.", "de": "Notiere die Daten: m = 5 kg, a = 4 m/s². Gesucht ist F.", "fr": "Note les données : m = 5 kg, a = 4 m/s². On cherche F.", "es": "Anota los datos: m = 5 kg, a = 4 m/s². Buscamos F.", "it": "Scrivi i dati: m = 5 kg, a = 4 m/s². Cerchiamo F.", "ru": "Запишем данные: m = 5 кг, a = 4 м/с². Нужно найти F.", "pt": "Anote os dados: m = 5 kg, a = 4 m/s². Procuramos F."}, {"sr": "Primeni drugi Njutnov zakon: F = m · a.", "en": "Apply Newton's second law: F = m · a.", "de": "Wende das zweite Newtonsche Gesetz an: F = m · a.", "fr": "Applique la deuxième loi de Newton : F = m · a.", "es": "Aplica la segunda ley de Newton: F = m · a.", "it": "Applica la seconda legge di Newton: F = m · a.", "ru": "Применим второй закон Ньютона: F = m · a.", "pt": "Aplique a segunda lei de Newton: F = m · a."}, {"sr": "Uvrsti brojeve: F = 5 kg · 4 m/s² = 20 N.", "en": "Substitute the numbers: F = 5 kg · 4 m/s² = 20 N.", "de": "Setze die Zahlen ein: F = 5 kg · 4 m/s² = 20 N.", "fr": "Remplace les valeurs : F = 5 kg · 4 m/s² = 20 N.", "es": "Sustituye los valores: F = 5 kg · 4 m/s² = 20 N.", "it": "Sostituisci i valori: F = 5 kg · 4 m/s² = 20 N.", "ru": "Подставим числа: F = 5 кг · 4 м/с² = 20 Н.", "pt": "Substitua os valores: F = 5 kg · 4 m/s² = 20 N."}]}}, {"name": {"sr": "Ravnoteža tela", "en": "Equilibrium of Bodies", "de": "Gleichgewicht von Körpern", "fr": "Équilibre des corps", "es": "Equilibrio de los cuerpos", "it": "Equilibrio dei corpi", "ru": "Равновесие тел", "pt": "Equilíbrio dos corpos"}, "theory": {"sr": "Telo je u <b>ravnoteži</b> kada je zbir svih sila koje na njega deluju jednak nuli, pa telo miruje ili se kreće ravnomerno pravolinijski. <b>Poluga</b> je prosta mašina — kruta šipka koja se obrće oko oslonca (tačke oslonca). Poluga je u ravnoteži kada je proizvod sile i njenog kraka (rastojanja od oslonca do prave linije sile) jednak na obe strane: F₁ · d₁ = F₂ · d₂. <b>Težište</b> tela je tačka u kojoj je skoncentrisano dejstvo sile teže na to telo; ravnoteža tela zavisi od položaja težišta u odnosu na oslonac.", "en": "A body is in <b>equilibrium</b> when the sum of all forces acting on it equals zero, so the body is either at rest or moving in uniform straight-line motion. A <b>lever</b> is a simple machine — a rigid bar that turns around a fulcrum (support point). A lever is in equilibrium when the product of a force and its arm (the distance from the fulcrum to the line of action of the force) is equal on both sides: F₁ · d₁ = F₂ · d₂. The <b>center of gravity</b> of a body is the point where the effect of the force of gravity on that body is concentrated; a body's equilibrium depends on the position of the center of gravity relative to the support.", "de": "Ein Körper befindet sich im <b>Gleichgewicht</b>, wenn die Summe aller auf ihn wirkenden Kräfte gleich null ist, sodass der Körper ruht oder sich gleichförmig geradlinig bewegt. Ein <b>Hebel</b> ist eine einfache Maschine — ein starrer Stab, der sich um einen Drehpunkt (Stützpunkt) dreht. Ein Hebel ist im Gleichgewicht, wenn das Produkt aus Kraft und ihrem Hebelarm (Abstand vom Drehpunkt zur Wirkungslinie der Kraft) auf beiden Seiten gleich ist: F₁ · d₁ = F₂ · d₂. Der <b>Schwerpunkt</b> eines Körpers ist der Punkt, in dem die Wirkung der Schwerkraft auf diesen Körper konzentriert ist; das Gleichgewicht eines Körpers hängt von der Lage des Schwerpunkts relativ zur Stütze ab.", "fr": "Un corps est en <b>équilibre</b> lorsque la somme de toutes les forces qui agissent sur lui est égale à zéro, de sorte que le corps reste au repos ou se déplace en mouvement rectiligne uniforme. Le <b>levier</b> est une machine simple — une barre rigide qui tourne autour d'un point d'appui. Un levier est en équilibre lorsque le produit d'une force et de son bras (la distance entre le point d'appui et la ligne d'action de la force) est égal des deux côtés : F₁ · d₁ = F₂ · d₂. Le <b>centre de gravité</b> d'un corps est le point où se concentre l'effet de la force de pesanteur sur ce corps ; l'équilibre d'un corps dépend de la position du centre de gravité par rapport à l'appui.", "es": "Un cuerpo está en <b>equilibrio</b> cuando la suma de todas las fuerzas que actúan sobre él es igual a cero, por lo que el cuerpo permanece en reposo o se mueve con movimiento rectilíneo uniforme. La <b>palanca</b> es una máquina simple — una barra rígida que gira alrededor de un punto de apoyo. Una palanca está en equilibrio cuando el producto de una fuerza por su brazo (la distancia entre el punto de apoyo y la línea de acción de la fuerza) es igual en ambos lados: F₁ · d₁ = F₂ · d₂. El <b>centro de gravedad</b> de un cuerpo es el punto donde se concentra el efecto de la fuerza de gravedad sobre ese cuerpo; el equilibrio de un cuerpo depende de la posición del centro de gravedad respecto al apoyo.", "it": "Un corpo è in <b>equilibrio</b> quando la somma di tutte le forze che agiscono su di esso è uguale a zero, per cui il corpo resta fermo o si muove di moto rettilineo uniforme. La <b>leva</b> è una macchina semplice — un'asta rigida che ruota attorno a un fulcro (punto di appoggio). Una leva è in equilibrio quando il prodotto di una forza per il suo braccio (la distanza dal fulcro alla retta d'azione della forza) è uguale su entrambi i lati: F₁ · d₁ = F₂ · d₂. Il <b>baricentro</b> di un corpo è il punto in cui è concentrato l'effetto della forza di gravità su quel corpo; l'equilibrio di un corpo dipende dalla posizione del baricentro rispetto all'appoggio.", "ru": "Тело находится в <b>равновесии</b>, когда сумма всех действующих на него сил равна нулю, поэтому тело покоится или движется равномерно прямолинейно. <b>Рычаг</b> — простой механизм: жёсткий стержень, вращающийся вокруг точки опоры. Рычаг находится в равновесии, когда произведение силы на её плечо (расстояние от точки опоры до линии действия силы) одинаково с обеих сторон: F₁ · d₁ = F₂ · d₂. <b>Центр тяжести</b> тела — точка, в которой сосредоточено действие силы тяжести на это тело; равновесие тела зависит от положения центра тяжести относительно опоры.", "pt": "Um corpo está em <b>equilíbrio</b> quando a soma de todas as forças que atuam sobre ele é igual a zero, de modo que o corpo permanece em repouso ou se move em movimento retilíneo uniforme. A <b>alavanca</b> é uma máquina simples — uma barra rígida que gira em torno de um ponto de apoio (fulcro). Uma alavanca está em equilíbrio quando o produto de uma força pelo seu braço (a distância do fulcro até a linha de ação da força) é igual dos dois lados: F₁ · d₁ = F₂ · d₂. O <b>centro de gravidade</b> de um corpo é o ponto onde se concentra o efeito da força da gravidade sobre esse corpo; o equilíbrio de um corpo depende da posição do centro de gravidade em relação ao apoio."}, "formulas": [{"sr": "F₁ · d₁ = F₂ · d₂ — uslov ravnoteže poluge: proizvod sile i njenog kraka jednak je na obe strane oslonca", "en": "F₁ · d₁ = F₂ · d₂ — the condition for lever equilibrium: the product of a force and its arm is equal on both sides of the fulcrum", "de": "F₁ · d₁ = F₂ · d₂ — die Gleichgewichtsbedingung für den Hebel: das Produkt aus Kraft und Hebelarm ist auf beiden Seiten des Drehpunkts gleich", "fr": "F₁ · d₁ = F₂ · d₂ — la condition d'équilibre du levier : le produit d'une force et de son bras est égal de part et d'autre du point d'appui", "es": "F₁ · d₁ = F₂ · d₂ — la condición de equilibrio de la palanca: el producto de una fuerza por su brazo es igual a ambos lados del punto de apoyo", "it": "F₁ · d₁ = F₂ · d₂ — la condizione di equilibrio della leva: il prodotto di una forza per il suo braccio è uguale su entrambi i lati del fulcro", "ru": "F₁ · d₁ = F₂ · d₂ — условие равновесия рычага: произведение силы на её плечо одинаково по обе стороны от точки опоры", "pt": "F₁ · d₁ = F₂ · d₂ — a condição de equilíbrio da alavanca: o produto de uma força pelo seu braço é igual nos dois lados do fulcro"}], "remember": {"sr": "Krak sile (d) meri se od oslonca do prave linije duž koje deluje sila, i to pod pravim uglom — ne od oslonca do same tačke primene sile.", "en": "The arm of a force (d) is measured from the fulcrum to the line along which the force acts, at a right angle — not from the fulcrum to the point where the force is applied.", "de": "Der Hebelarm (d) wird vom Drehpunkt bis zur Wirkungslinie der Kraft im rechten Winkel gemessen — nicht vom Drehpunkt bis zum Angriffspunkt der Kraft.", "fr": "Le bras d'une force (d) se mesure du point d'appui jusqu'à la ligne d'action de la force, à angle droit — et non du point d'appui jusqu'au point d'application de la force.", "es": "El brazo de una fuerza (d) se mide desde el punto de apoyo hasta la línea de acción de la fuerza, en ángulo recto — no desde el apoyo hasta el punto de aplicación de la fuerza.", "it": "Il braccio di una forza (d) si misura dal fulcro alla retta d'azione della forza, con angolo retto — non dal fulcro al punto di applicazione della forza.", "ru": "Плечо силы (d) измеряется от точки опоры до линии действия силы под прямым углом — а не от опоры до точки приложения силы.", "pt": "O braço de uma força (d) é medido do fulcro até a linha de ação da força, em ângulo reto — não do fulcro até o ponto de aplicação da força."}, "problem": {"statement": {"sr": "Na jednom kraju poluge, na rastojanju 0,3 m od oslonca, deluje sila od 60 N. Na kom rastojanju od oslonca treba da deluje sila od 20 N na drugom kraju, da bi poluga bila u ravnoteži?", "en": "At one end of a lever, at a distance of 0.3 m from the fulcrum, a force of 60 N acts. At what distance from the fulcrum must a force of 20 N act at the other end for the lever to be in equilibrium?", "de": "An einem Ende eines Hebels wirkt in einem Abstand von 0,3 m vom Drehpunkt eine Kraft von 60 N. In welchem Abstand vom Drehpunkt muss am anderen Ende eine Kraft von 20 N wirken, damit der Hebel im Gleichgewicht ist?", "fr": "À une extrémité d'un levier, à une distance de 0,3 m du point d'appui, agit une force de 60 N. À quelle distance du point d'appui doit agir une force de 20 N à l'autre extrémité pour que le levier soit en équilibre ?", "es": "En un extremo de una palanca, a una distancia de 0,3 m del punto de apoyo, actúa una fuerza de 60 N. ¿A qué distancia del punto de apoyo debe actuar una fuerza de 20 N en el otro extremo para que la palanca esté en equilibrio?", "it": "A un'estremità di una leva, a una distanza di 0,3 m dal fulcro, agisce una forza di 60 N. A quale distanza dal fulcro deve agire una forza di 20 N all'altra estremità affinché la leva sia in equilibrio?", "ru": "На одном конце рычага, на расстоянии 0,3 м от точки опоры, действует сила 60 Н. На каком расстоянии от точки опоры должна действовать сила 20 Н на другом конце, чтобы рычаг был в равновесии?", "pt": "Numa extremidade de uma alavanca, a uma distância de 0,3 m do fulcro, atua uma força de 60 N. A que distância do fulcro deve atuar uma força de 20 N na outra extremidade para que a alavanca esteja em equilíbrio?"}, "steps": [{"sr": "Zapiši podatke: F₁ = 60 N, d₁ = 0,3 m, F₂ = 20 N. Tražimo d₂.", "en": "Write down the data: F₁ = 60 N, d₁ = 0.3 m, F₂ = 20 N. We need to find d₂.", "de": "Notiere die Daten: F₁ = 60 N, d₁ = 0,3 m, F₂ = 20 N. Gesucht ist d₂.", "fr": "Note les données : F₁ = 60 N, d₁ = 0,3 m, F₂ = 20 N. On cherche d₂.", "es": "Anota los datos: F₁ = 60 N, d₁ = 0,3 m, F₂ = 20 N. Buscamos d₂.", "it": "Scrivi i dati: F₁ = 60 N, d₁ = 0,3 m, F₂ = 20 N. Cerchiamo d₂.", "ru": "Запишем данные: F₁ = 60 Н, d₁ = 0,3 м, F₂ = 20 Н. Нужно найти d₂.", "pt": "Anote os dados: F₁ = 60 N, d₁ = 0,3 m, F₂ = 20 N. Procuramos d₂."}, {"sr": "Primeni uslov ravnoteže poluge: F₁ · d₁ = F₂ · d₂, pa je d₂ = (F₁ · d₁) / F₂.", "en": "Apply the lever equilibrium condition: F₁ · d₁ = F₂ · d₂, so d₂ = (F₁ · d₁) / F₂.", "de": "Wende die Gleichgewichtsbedingung des Hebels an: F₁ · d₁ = F₂ · d₂, also d₂ = (F₁ · d₁) / F₂.", "fr": "Applique la condition d'équilibre du levier : F₁ · d₁ = F₂ · d₂, donc d₂ = (F₁ · d₁) / F₂.", "es": "Aplica la condición de equilibrio de la palanca: F₁ · d₁ = F₂ · d₂, entonces d₂ = (F₁ · d₁) / F₂.", "it": "Applica la condizione di equilibrio della leva: F₁ · d₁ = F₂ · d₂, quindi d₂ = (F₁ · d₁) / F₂.", "ru": "Применим условие равновесия рычага: F₁ · d₁ = F₂ · d₂, значит d₂ = (F₁ · d₁) / F₂.", "pt": "Aplique a condição de equilíbrio da alavanca: F₁ · d₁ = F₂ · d₂, logo d₂ = (F₁ · d₁) / F₂."}, {"sr": "Uvrsti brojeve: d₂ = (60 N · 0,3 m) / 20 N = 0,9 m.", "en": "Substitute the numbers: d₂ = (60 N · 0.3 m) / 20 N = 0.9 m.", "de": "Setze die Zahlen ein: d₂ = (60 N · 0,3 m) / 20 N = 0,9 m.", "fr": "Remplace les valeurs : d₂ = (60 N · 0,3 m) / 20 N = 0,9 m.", "es": "Sustituye los valores: d₂ = (60 N · 0,3 m) / 20 N = 0,9 m.", "it": "Sostituisci i valori: d₂ = (60 N · 0,3 m) / 20 N = 0,9 m.", "ru": "Подставим числа: d₂ = (60 Н · 0,3 м) / 20 Н = 0,9 м.", "pt": "Substitua os valores: d₂ = (60 N · 0,3 m) / 20 N = 0,9 m."}]}}, {"name": {"sr": "Rad i energija", "en": "Work and Energy", "de": "Arbeit und Energie", "fr": "Travail et énergie", "es": "Trabajo y energía", "it": "Lavoro ed energia", "ru": "Работа и энергия", "pt": "Trabalho e energia"}, "theory": {"sr": "<b>Mehanički rad</b> se vrši kada sila deluje na telo i pomera ga u pravcu svog dejstva; računa se kao A = F · s, a meri se u džulima (J). <b>Energija</b> je sposobnost tela da izvrši rad. <b>Kinetička energija</b> je energija kretanja i zavisi od mase i brzine tela: Ek = m · v² / 2. <b>Potencijalna energija</b> je energija položaja — telo je ima zbog visine na kojoj se nalazi u odnosu na neki nivo: Ep = m · g · h. Prema <b>zakonu održanja energije</b>, ukupna mehanička energija izolovanog sistema ostaje stalna — energija samo prelazi iz jednog oblika u drugi.", "en": "<b>Mechanical work</b> is done when a force acts on a body and moves it in the direction of that force; it is calculated as A = F · s and measured in joules (J). <b>Energy</b> is a body's ability to do work. <b>Kinetic energy</b> is the energy of motion and depends on a body's mass and speed: Ek = m · v² / 2. <b>Potential energy</b> is the energy of position — a body has it because of the height at which it is located relative to some level: Ep = m · g · h. According to the <b>law of conservation of energy</b>, the total mechanical energy of an isolated system stays constant — energy only converts from one form into another.", "de": "<b>Mechanische Arbeit</b> wird verrichtet, wenn eine Kraft auf einen Körper wirkt und ihn in Richtung ihrer Wirkung bewegt; sie wird als A = F · s berechnet und in Joule (J) gemessen. <b>Energie</b> ist die Fähigkeit eines Körpers, Arbeit zu verrichten. <b>Kinetische Energie</b> ist die Energie der Bewegung und hängt von der Masse und der Geschwindigkeit eines Körpers ab: Ek = m · v² / 2. <b>Potenzielle Energie</b> ist die Energie der Lage — ein Körper besitzt sie aufgrund der Höhe, in der er sich gegenüber einem bestimmten Niveau befindet: Ep = m · g · h. Nach dem <b>Energieerhaltungssatz</b> bleibt die gesamte mechanische Energie eines isolierten Systems konstant — Energie wandelt sich nur von einer Form in eine andere um.", "fr": "Le <b>travail mécanique</b> est effectué lorsqu'une force agit sur un corps et le déplace dans la direction de son action ; il se calcule par A = F · s et se mesure en joules (J). L'<b>énergie</b> est la capacité d'un corps à effectuer un travail. L'<b>énergie cinétique</b> est l'énergie du mouvement et dépend de la masse et de la vitesse d'un corps : Ek = m · v² / 2. L'<b>énergie potentielle</b> est l'énergie de position — un corps la possède en raison de la hauteur à laquelle il se trouve par rapport à un niveau donné : Ep = m · g · h. Selon la <b>loi de conservation de l'énergie</b>, l'énergie mécanique totale d'un système isolé reste constante — l'énergie ne fait que se transformer d'une forme en une autre.", "es": "El <b>trabajo mecánico</b> se realiza cuando una fuerza actúa sobre un cuerpo y lo desplaza en la dirección de su acción; se calcula como A = F · s y se mide en julios (J). La <b>energía</b> es la capacidad de un cuerpo para realizar trabajo. La <b>energía cinética</b> es la energía del movimiento y depende de la masa y la velocidad del cuerpo: Ek = m · v² / 2. La <b>energía potencial</b> es la energía de posición — un cuerpo la tiene debido a la altura a la que se encuentra respecto a un nivel determinado: Ep = m · g · h. Según la <b>ley de conservación de la energía</b>, la energía mecánica total de un sistema aislado permanece constante — la energía solo se transforma de una forma a otra.", "it": "Il <b>lavoro meccanico</b> viene compiuto quando una forza agisce su un corpo e lo sposta nella direzione della sua azione; si calcola come A = F · s e si misura in joule (J). L'<b>energia</b> è la capacità di un corpo di compiere lavoro. L'<b>energia cinetica</b> è l'energia del movimento e dipende dalla massa e dalla velocità del corpo: Ek = m · v² / 2. L'<b>energia potenziale</b> è l'energia di posizione — un corpo la possiede grazie all'altezza a cui si trova rispetto a un certo livello: Ep = m · g · h. Secondo la <b>legge di conservazione dell'energia</b>, l'energia meccanica totale di un sistema isolato rimane costante — l'energia si trasforma solo da una forma all'altra.", "ru": "<b>Механическая работа</b> совершается, когда сила действует на тело и перемещает его в направлении своего действия; вычисляется как A = F · s и измеряется в джоулях (Дж). <b>Энергия</b> — это способность тела совершать работу. <b>Кинетическая энергия</b> — энергия движения, зависящая от массы и скорости тела: Ek = m · v² / 2. <b>Потенциальная энергия</b> — энергия положения: тело обладает ею из-за высоты, на которой находится относительно некоторого уровня: Ep = m · g · h. Согласно <b>закону сохранения энергии</b>, полная механическая энергия изолированной системы остаётся постоянной — энергия лишь переходит из одной формы в другую.", "pt": "O <b>trabalho mecânico</b> é realizado quando uma força atua sobre um corpo e o desloca na direção de sua ação; é calculado como A = F · s e medido em joules (J). A <b>energia</b> é a capacidade de um corpo realizar trabalho. A <b>energia cinética</b> é a energia do movimento e depende da massa e da velocidade do corpo: Ek = m · v² / 2. A <b>energia potencial</b> é a energia de posição — um corpo a possui devido à altura em que se encontra em relação a um determinado nível: Ep = m · g · h. Segundo a <b>lei da conservação da energia</b>, a energia mecânica total de um sistema isolado permanece constante — a energia apenas se transforma de uma forma em outra."}, "formulas": [{"sr": "A = F · s — rad (A) je proizvod sile (F) i pređenog puta (s) u pravcu sile", "en": "A = F · s — work (A) is the product of the force (F) and the distance (s) covered in the direction of the force", "de": "A = F · s — die Arbeit (A) ist das Produkt aus der Kraft (F) und dem in Kraftrichtung zurückgelegten Weg (s)", "fr": "A = F · s — le travail (A) est le produit de la force (F) et de la distance parcourue (s) dans la direction de la force", "es": "A = F · s — el trabajo (A) es el producto de la fuerza (F) por la distancia recorrida (s) en la dirección de la fuerza", "it": "A = F · s — il lavoro (A) è il prodotto della forza (F) per lo spazio percorso (s) nella direzione della forza", "ru": "A = F · s — работа (A) равна произведению силы (F) на пройденный путь (s) в направлении силы", "pt": "A = F · s — o trabalho (A) é o produto da força (F) pela distância percorrida (s) na direção da força"}, {"sr": "Ek = m · v² / 2 — kinetička energija (Ek) zavisi od mase tela (m) i kvadrata njegove brzine (v)", "en": "Ek = m · v² / 2 — kinetic energy (Ek) depends on the body's mass (m) and the square of its speed (v)", "de": "Ek = m · v² / 2 — die kinetische Energie (Ek) hängt von der Masse des Körpers (m) und dem Quadrat seiner Geschwindigkeit (v) ab", "fr": "Ek = m · v² / 2 — l'énergie cinétique (Ek) dépend de la masse du corps (m) et du carré de sa vitesse (v)", "es": "Ek = m · v² / 2 — la energía cinética (Ek) depende de la masa del cuerpo (m) y del cuadrado de su velocidad (v)", "it": "Ek = m · v² / 2 — l'energia cinetica (Ek) dipende dalla massa del corpo (m) e dal quadrato della sua velocità (v)", "ru": "Ek = m · v² / 2 — кинетическая энергия (Ek) зависит от массы тела (m) и квадрата его скорости (v)", "pt": "Ek = m · v² / 2 — a energia cinética (Ek) depende da massa do corpo (m) e do quadrado da sua velocidade (v)"}, {"sr": "Ep = m · g · h — potencijalna energija (Ep) zavisi od mase (m), gravitacionog ubrzanja (g) i visine (h)", "en": "Ep = m · g · h — potential energy (Ep) depends on the mass (m), the gravitational acceleration (g) and the height (h)", "de": "Ep = m · g · h — die potenzielle Energie (Ep) hängt von der Masse (m), der Fallbeschleunigung (g) und der Höhe (h) ab", "fr": "Ep = m · g · h — l'énergie potentielle (Ep) dépend de la masse (m), de l'accélération de la pesanteur (g) et de la hauteur (h)", "es": "Ep = m · g · h — la energía potencial (Ep) depende de la masa (m), la aceleración de la gravedad (g) y la altura (h)", "it": "Ep = m · g · h — l'energia potenziale (Ep) dipende dalla massa (m), dall'accelerazione di gravità (g) e dall'altezza (h)", "ru": "Ep = m · g · h — потенциальная энергия (Ep) зависит от массы (m), ускорения свободного падения (g) и высоты (h)", "pt": "Ep = m · g · h — a energia potencial (Ep) depende da massa (m), da aceleração da gravidade (g) e da altura (h)"}], "remember": {"sr": "Rad se vrši samo ako pomeranje ima komponentu u pravcu sile — ako sila deluje, a telo se ne pomera (ili se pomera upravno na silu), rad je jednak nuli.", "en": "Work is done only if the displacement has a component in the direction of the force — if a force acts but the body does not move (or moves perpendicular to the force), the work equals zero.", "de": "Arbeit wird nur verrichtet, wenn die Verschiebung eine Komponente in Kraftrichtung hat — wirkt eine Kraft, ohne dass sich der Körper bewegt (oder bewegt er sich senkrecht zur Kraft), ist die Arbeit gleich null.", "fr": "Un travail n'est effectué que si le déplacement a une composante dans la direction de la force — si une force agit sans que le corps ne se déplace (ou se déplace perpendiculairement à la force), le travail est nul.", "es": "El trabajo se realiza solo si el desplazamiento tiene una componente en la dirección de la fuerza — si una fuerza actúa pero el cuerpo no se mueve (o se mueve perpendicularmente a la fuerza), el trabajo es igual a cero.", "it": "Il lavoro viene compiuto solo se lo spostamento ha una componente nella direzione della forza — se una forza agisce ma il corpo non si sposta (o si sposta perpendicolarmente alla forza), il lavoro è uguale a zero.", "ru": "Работа совершается только тогда, когда перемещение имеет составляющую в направлении силы — если сила действует, а тело не движется (или движется перпендикулярно силе), работа равна нулю.", "pt": "O trabalho só é realizado se o deslocamento tiver uma componente na direção da força — se uma força atua mas o corpo não se move (ou se move perpendicularmente à força), o trabalho é igual a zero."}, "problem": {"statement": {"sr": "Telo mase 2 kg pada slobodno sa visine 5 m. Kolika je njegova potencijalna energija na početku pada? (g = 10 m/s²)", "en": "A body of mass 2 kg falls freely from a height of 5 m. What is its potential energy at the start of the fall? (g = 10 m/s²)", "de": "Ein Körper mit einer Masse von 2 kg fällt frei aus einer Höhe von 5 m. Wie groß ist seine potenzielle Energie zu Beginn des Falls? (g = 10 m/s²)", "fr": "Un corps de masse 2 kg tombe librement d'une hauteur de 5 m. Quelle est son énergie potentielle au début de la chute ? (g = 10 m/s²)", "es": "Un cuerpo de masa 2 kg cae libremente desde una altura de 5 m. ¿Cuál es su energía potencial al inicio de la caída? (g = 10 m/s²)", "it": "Un corpo di massa 2 kg cade liberamente da un'altezza di 5 m. Qual è la sua energia potenziale all'inizio della caduta? (g = 10 m/s²)", "ru": "Тело массой 2 кг свободно падает с высоты 5 м. Какова его потенциальная энергия в начале падения? (g = 10 м/с²)", "pt": "Um corpo de massa 2 kg cai livremente de uma altura de 5 m. Qual é a sua energia potencial no início da queda? (g = 10 m/s²)"}, "steps": [{"sr": "Zapiši podatke: m = 2 kg, h = 5 m, g = 10 m/s². Tražimo Ep.", "en": "Write down the data: m = 2 kg, h = 5 m, g = 10 m/s². We need to find Ep.", "de": "Notiere die Daten: m = 2 kg, h = 5 m, g = 10 m/s². Gesucht ist Ep.", "fr": "Note les données : m = 2 kg, h = 5 m, g = 10 m/s². On cherche Ep.", "es": "Anota los datos: m = 2 kg, h = 5 m, g = 10 m/s². Buscamos Ep.", "it": "Scrivi i dati: m = 2 kg, h = 5 m, g = 10 m/s². Cerchiamo Ep.", "ru": "Запишем данные: m = 2 кг, h = 5 м, g = 10 м/с². Нужно найти Ep.", "pt": "Anote os dados: m = 2 kg, h = 5 m, g = 10 m/s². Procuramos Ep."}, {"sr": "Primeni formulu Ep = m · g · h.", "en": "Apply the formula Ep = m · g · h.", "de": "Wende die Formel Ep = m · g · h an.", "fr": "Applique la formule Ep = m · g · h.", "es": "Aplica la fórmula Ep = m · g · h.", "it": "Applica la formula Ep = m · g · h.", "ru": "Применим формулу Ep = m · g · h.", "pt": "Aplique a fórmula Ep = m · g · h."}, {"sr": "Uvrsti brojeve: Ep = 2 kg · 10 m/s² · 5 m = 100 J.", "en": "Substitute the numbers: Ep = 2 kg · 10 m/s² · 5 m = 100 J.", "de": "Setze die Zahlen ein: Ep = 2 kg · 10 m/s² · 5 m = 100 J.", "fr": "Remplace les valeurs : Ep = 2 kg · 10 m/s² · 5 m = 100 J.", "es": "Sustituye los valores: Ep = 2 kg · 10 m/s² · 5 m = 100 J.", "it": "Sostituisci i valori: Ep = 2 kg · 10 m/s² · 5 m = 100 J.", "ru": "Подставим числа: Ep = 2 кг · 10 м/с² · 5 м = 100 Дж.", "pt": "Substitua os valores: Ep = 2 kg · 10 m/s² · 5 m = 100 J."}]}}, {"name": {"sr": "Pritisak", "en": "Pressure", "de": "Druck", "fr": "La pression", "es": "Presión", "it": "Pressione", "ru": "Давление", "pt": "Pressão"}, "theory": {"sr": "<b>Pritisak</b> je fizička veličina koja pokazuje koliko sile deluje upravno na jedinicu površine: p = F / S, a meri se u paskalima (Pa). Što je površina na koju sila deluje manja, pritisak je veći — zato oštar nož lakše seče od tupog. U <b>tečnostima</b>, hidrostatički pritisak potiče od težine tečnosti iznad posmatrane tačke i zavisi od gustine tečnosti (ρ), gravitacionog ubrzanja (g) i dubine (h): p = ρ · g · h — pritisak raste sa dubinom, a ne zavisi od oblika suda. Prema <b>Paskalovom zakonu</b>, pritisak koji se izazove u tečnosti prenosi se podjednako na sve delove te tečnosti i suda u kome se ona nalazi.", "en": "<b>Pressure</b> is a physical quantity showing how much force acts perpendicularly per unit of area: p = F / S, and it is measured in pascals (Pa). The smaller the area on which a force acts, the greater the pressure — that is why a sharp knife cuts more easily than a blunt one. In <b>liquids</b>, hydrostatic pressure comes from the weight of the liquid above the point being observed and depends on the liquid's density (ρ), the gravitational acceleration (g) and the depth (h): p = ρ · g · h — pressure increases with depth and does not depend on the shape of the container. According to <b>Pascal's law</b>, pressure created in a liquid is transmitted equally to all parts of that liquid and of the vessel containing it.", "de": "<b>Druck</b> ist eine physikalische Größe, die zeigt, wie viel Kraft senkrecht auf eine Flächeneinheit wirkt: p = F / S, gemessen in Pascal (Pa). Je kleiner die Fläche ist, auf die eine Kraft wirkt, desto größer ist der Druck — deshalb schneidet ein scharfes Messer leichter als ein stumpfes. In <b>Flüssigkeiten</b> entsteht der hydrostatische Druck durch das Gewicht der Flüssigkeit über dem betrachteten Punkt und hängt von der Dichte der Flüssigkeit (ρ), der Fallbeschleunigung (g) und der Tiefe (h) ab: p = ρ · g · h — der Druck nimmt mit der Tiefe zu und hängt nicht von der Form des Gefäßes ab. Nach dem <b>Pascalschen Gesetz</b> wird ein in einer Flüssigkeit erzeugter Druck gleichmäßig auf alle Teile dieser Flüssigkeit und des sie enthaltenden Gefäßes übertragen.", "fr": "La <b>pression</b> est une grandeur physique qui indique la quantité de force agissant perpendiculairement par unité de surface : p = F / S, elle se mesure en pascals (Pa). Plus la surface sur laquelle agit une force est petite, plus la pression est grande — c'est pourquoi un couteau tranchant coupe plus facilement qu'un couteau émoussé. Dans les <b>liquides</b>, la pression hydrostatique provient du poids du liquide au-dessus du point observé et dépend de la masse volumique du liquide (ρ), de l'accélération de la pesanteur (g) et de la profondeur (h) : p = ρ · g · h — la pression augmente avec la profondeur et ne dépend pas de la forme du récipient. Selon la <b>loi de Pascal</b>, la pression créée dans un liquide se transmet également à toutes les parties de ce liquide et du récipient qui le contient.", "es": "La <b>presión</b> es una magnitud física que muestra cuánta fuerza actúa perpendicularmente por unidad de superficie: p = F / S, y se mide en pascales (Pa). Cuanto menor es la superficie sobre la que actúa una fuerza, mayor es la presión — por eso un cuchillo afilado corta más fácilmente que uno desafilado. En los <b>líquidos</b>, la presión hidrostática proviene del peso del líquido por encima del punto observado y depende de la densidad del líquido (ρ), la aceleración de la gravedad (g) y la profundidad (h): p = ρ · g · h — la presión aumenta con la profundidad y no depende de la forma del recipiente. Según la <b>ley de Pascal</b>, la presión creada en un líquido se transmite por igual a todas las partes de ese líquido y del recipiente que lo contiene.", "it": "La <b>pressione</b> è una grandezza fisica che indica quanta forza agisce perpendicolarmente per unità di superficie: p = F / S, e si misura in pascal (Pa). Minore è la superficie su cui agisce una forza, maggiore è la pressione — per questo un coltello affilato taglia più facilmente di uno smussato. Nei <b>liquidi</b>, la pressione idrostatica deriva dal peso del liquido sopra il punto osservato e dipende dalla densità del liquido (ρ), dall'accelerazione di gravità (g) e dalla profondità (h): p = ρ · g · h — la pressione aumenta con la profondità e non dipende dalla forma del recipiente. Secondo la <b>legge di Pascal</b>, la pressione creata in un liquido si trasmette in ugual misura a tutte le parti di quel liquido e del recipiente che lo contiene.", "ru": "<b>Давление</b> — физическая величина, показывающая, какая сила действует перпендикулярно на единицу площади: p = F / S, измеряется в паскалях (Па). Чем меньше площадь, на которую действует сила, тем больше давление — поэтому острый нож режет легче тупого. В <b>жидкостях</b> гидростатическое давление возникает из-за веса жидкости над рассматриваемой точкой и зависит от плотности жидкости (ρ), ускорения свободного падения (g) и глубины (h): p = ρ · g · h — давление растёт с глубиной и не зависит от формы сосуда. Согласно <b>закону Паскаля</b>, давление, создаваемое в жидкости, передаётся одинаково всем частям этой жидкости и сосуда, в котором она находится.", "pt": "A <b>pressão</b> é uma grandeza física que indica quanta força atua perpendicularmente por unidade de área: p = F / S, medida em pascals (Pa). Quanto menor a área sobre a qual uma força atua, maior a pressão — por isso uma faca afiada corta mais facilmente do que uma sem corte. Nos <b>líquidos</b>, a pressão hidrostática resulta do peso do líquido acima do ponto observado e depende da densidade do líquido (ρ), da aceleração da gravidade (g) e da profundidade (h): p = ρ · g · h — a pressão aumenta com a profundidade e não depende da forma do recipiente. Segundo a <b>lei de Pascal</b>, a pressão criada num líquido transmite-se igualmente a todas as partes desse líquido e do recipiente que o contém."}, "formulas": [{"sr": "p = F / S — pritisak (p) je odnos sile (F) koja deluje upravno na površinu i te površine (S)", "en": "p = F / S — pressure (p) is the ratio of the force (F) acting perpendicularly on a surface to that surface's area (S)", "de": "p = F / S — der Druck (p) ist das Verhältnis der senkrecht auf eine Fläche wirkenden Kraft (F) zu dieser Fläche (S)", "fr": "p = F / S — la pression (p) est le rapport entre la force (F) agissant perpendiculairement sur une surface et cette surface (S)", "es": "p = F / S — la presión (p) es la relación entre la fuerza (F) que actúa perpendicularmente sobre una superficie y esa superficie (S)", "it": "p = F / S — la pressione (p) è il rapporto tra la forza (F) che agisce perpendicolarmente su una superficie e quella superficie (S)", "ru": "p = F / S — давление (p) равно отношению силы (F), действующей перпендикулярно на поверхность, к площади этой поверхности (S)", "pt": "p = F / S — a pressão (p) é a razão entre a força (F) que atua perpendicularmente sobre uma superfície e essa superfície (S)"}, {"sr": "p = ρ · g · h — hidrostatički pritisak (p) zavisi od gustine tečnosti (ρ), gravitacionog ubrzanja (g) i dubine (h)", "en": "p = ρ · g · h — hydrostatic pressure (p) depends on the liquid's density (ρ), the gravitational acceleration (g) and the depth (h)", "de": "p = ρ · g · h — der hydrostatische Druck (p) hängt von der Dichte der Flüssigkeit (ρ), der Fallbeschleunigung (g) und der Tiefe (h) ab", "fr": "p = ρ · g · h — la pression hydrostatique (p) dépend de la masse volumique du liquide (ρ), de l'accélération de la pesanteur (g) et de la profondeur (h)", "es": "p = ρ · g · h — la presión hidrostática (p) depende de la densidad del líquido (ρ), la aceleración de la gravedad (g) y la profundidad (h)", "it": "p = ρ · g · h — la pressione idrostatica (p) dipende dalla densità del liquido (ρ), dall'accelerazione di gravità (g) e dalla profondità (h)", "ru": "p = ρ · g · h — гидростатическое давление (p) зависит от плотности жидкости (ρ), ускорения свободного падения (g) и глубины (h)", "pt": "p = ρ · g · h — a pressão hidrostática (p) depende da densidade do líquido (ρ), da aceleração da gravidade (g) e da profundidade (h)"}], "remember": {"sr": "Hidrostatički pritisak ne zavisi od oblika ni širine suda, već samo od dubine i vrste tečnosti — zato je pritisak na dnu uske i široke posude na istoj dubini isti.", "en": "Hydrostatic pressure does not depend on the shape or width of the container, only on the depth and the type of liquid — that is why the pressure at the bottom of a narrow and a wide vessel is the same at the same depth.", "de": "Der hydrostatische Druck hängt weder von der Form noch von der Breite des Gefäßes ab, sondern nur von der Tiefe und der Art der Flüssigkeit — deshalb ist der Druck am Boden eines schmalen und eines breiten Gefäßes bei gleicher Tiefe gleich.", "fr": "La pression hydrostatique ne dépend ni de la forme ni de la largeur du récipient, mais seulement de la profondeur et du type de liquide — c'est pourquoi la pression au fond d'un récipient étroit et d'un récipient large est la même à la même profondeur.", "es": "La presión hidrostática no depende de la forma ni del ancho del recipiente, sino solo de la profundidad y del tipo de líquido — por eso la presión en el fondo de un recipiente estrecho y uno ancho es la misma a la misma profundidad.", "it": "La pressione idrostatica non dipende dalla forma né dalla larghezza del recipiente, ma solo dalla profondità e dal tipo di liquido — per questo la pressione sul fondo di un recipiente stretto e di uno largo è la stessa alla stessa profondità.", "ru": "Гидростатическое давление не зависит от формы или ширины сосуда, а только от глубины и вида жидкости — поэтому давление на дне узкого и широкого сосуда на одинаковой глубине одинаково.", "pt": "A pressão hidrostática não depende da forma nem da largura do recipiente, apenas da profundidade e do tipo de líquido — por isso a pressão no fundo de um recipiente estreito e um largo é a mesma à mesma profundidade."}, "problem": {"statement": {"sr": "Kolika je hidrostatička pritisak vode na dubini od 3 m? (ρ vode = 1000 kg/m³, g = 10 m/s²)", "en": "What is the hydrostatic pressure of water at a depth of 3 m? (ρ of water = 1000 kg/m³, g = 10 m/s²)", "de": "Wie groß ist der hydrostatische Druck von Wasser in einer Tiefe von 3 m? (ρ von Wasser = 1000 kg/m³, g = 10 m/s²)", "fr": "Quelle est la pression hydrostatique de l'eau à une profondeur de 3 m ? (ρ de l'eau = 1000 kg/m³, g = 10 m/s²)", "es": "¿Cuál es la presión hidrostática del agua a una profundidad de 3 m? (ρ del agua = 1000 kg/m³, g = 10 m/s²)", "it": "Qual è la pressione idrostatica dell'acqua a una profondità di 3 m? (ρ dell'acqua = 1000 kg/m³, g = 10 m/s²)", "ru": "Каково гидростатическое давление воды на глубине 3 м? (ρ воды = 1000 кг/м³, g = 10 м/с²)", "pt": "Qual é a pressão hidrostática da água a uma profundidade de 3 m? (ρ da água = 1000 kg/m³, g = 10 m/s²)"}, "steps": [{"sr": "Zapiši podatke: ρ = 1000 kg/m³, g = 10 m/s², h = 3 m. Tražimo p.", "en": "Write down the data: ρ = 1000 kg/m³, g = 10 m/s², h = 3 m. We need to find p.", "de": "Notiere die Daten: ρ = 1000 kg/m³, g = 10 m/s², h = 3 m. Gesucht ist p.", "fr": "Note les données : ρ = 1000 kg/m³, g = 10 m/s², h = 3 m. On cherche p.", "es": "Anota los datos: ρ = 1000 kg/m³, g = 10 m/s², h = 3 m. Buscamos p.", "it": "Scrivi i dati: ρ = 1000 kg/m³, g = 10 m/s², h = 3 m. Cerchiamo p.", "ru": "Запишем данные: ρ = 1000 кг/м³, g = 10 м/с², h = 3 м. Нужно найти p.", "pt": "Anote os dados: ρ = 1000 kg/m³, g = 10 m/s², h = 3 m. Procuramos p."}, {"sr": "Primeni formulu p = ρ · g · h.", "en": "Apply the formula p = ρ · g · h.", "de": "Wende die Formel p = ρ · g · h an.", "fr": "Applique la formule p = ρ · g · h.", "es": "Aplica la fórmula p = ρ · g · h.", "it": "Applica la formula p = ρ · g · h.", "ru": "Применим формулу p = ρ · g · h.", "pt": "Aplique a fórmula p = ρ · g · h."}, {"sr": "Uvrsti brojeve: p = 1000 kg/m³ · 10 m/s² · 3 m = 30 000 Pa.", "en": "Substitute the numbers: p = 1000 kg/m³ · 10 m/s² · 3 m = 30,000 Pa.", "de": "Setze die Zahlen ein: p = 1000 kg/m³ · 10 m/s² · 3 m = 30 000 Pa.", "fr": "Remplace les valeurs : p = 1000 kg/m³ · 10 m/s² · 3 m = 30 000 Pa.", "es": "Sustituye los valores: p = 1000 kg/m³ · 10 m/s² · 3 m = 30 000 Pa.", "it": "Sostituisci i valori: p = 1000 kg/m³ · 10 m/s² · 3 m = 30 000 Pa.", "ru": "Подставим числа: p = 1000 кг/м³ · 10 м/с² · 3 м = 30 000 Па.", "pt": "Substitua os valores: p = 1000 kg/m³ · 10 m/s² · 3 m = 30 000 Pa."}]}}, {"name": {"sr": "Toplotne pojave", "en": "Thermal Phenomena", "de": "Wärmeerscheinungen", "fr": "Phénomènes thermiques", "es": "Fenómenos térmicos", "it": "Fenomeni termici", "ru": "Тепловые явления", "pt": "Fenômenos térmicos"}, "theory": {"sr": "<b>Temperatura</b> je mera zagrejanosti tela i pokazuje prosečnu kinetičku energiju čestica koje ga čine; meri se u stepenima Celzijusa (°C). <b>Toplota</b> je energija koja prelazi sa toplijeg na hladnije telo dok se temperature ne izjednače. Količina toplote potrebna da se telo zagreje ili ohladi zavisi od mase tela (m), specifičnog toplotnog kapaciteta materijala (c) i promene temperature (ΔT): Q = m · c · ΔT. Zagrevanjem se telima obično <b>povećava zapremina</b> (toplotno širenje), a pri promeni agregatnog stanja (topljenje, isparavanje) temperatura tela ostaje nepromenjena dok traje ta promena, iako se toplota i dalje dovodi.", "en": "<b>Temperature</b> is a measure of how heated a body is and shows the average kinetic energy of the particles that make it up; it is measured in degrees Celsius (°C). <b>Heat</b> is energy that transfers from a warmer to a colder body until the temperatures equalize. The amount of heat needed to warm or cool a body depends on the body's mass (m), the material's specific heat capacity (c) and the temperature change (ΔT): Q = m · c · ΔT. Heating usually causes bodies to <b>increase in volume</b> (thermal expansion), and during a change of state (melting, evaporation) a body's temperature stays constant while the change lasts, even though heat continues to be supplied.", "de": "Die <b>Temperatur</b> ist ein Maß für die Erwärmung eines Körpers und zeigt die durchschnittliche kinetische Energie der ihn bildenden Teilchen; sie wird in Grad Celsius (°C) gemessen. <b>Wärme</b> ist Energie, die von einem wärmeren zu einem kälteren Körper übergeht, bis sich die Temperaturen angleichen. Die zum Erwärmen oder Abkühlen eines Körpers nötige Wärmemenge hängt von der Masse des Körpers (m), der spezifischen Wärmekapazität des Materials (c) und der Temperaturänderung (ΔT) ab: Q = m · c · ΔT. Beim Erwärmen vergrößern sich Körper meist im <b>Volumen</b> (Wärmeausdehnung), und bei einem Aggregatzustandswechsel (Schmelzen, Verdampfen) bleibt die Temperatur eines Körpers konstant, solange dieser Vorgang andauert, obwohl weiterhin Wärme zugeführt wird.", "fr": "La <b>température</b> est une mesure de l'échauffement d'un corps et indique l'énergie cinétique moyenne des particules qui le composent ; elle se mesure en degrés Celsius (°C). La <b>chaleur</b> est l'énergie qui passe d'un corps plus chaud à un corps plus froid jusqu'à ce que les températures s'égalisent. La quantité de chaleur nécessaire pour chauffer ou refroidir un corps dépend de la masse du corps (m), de la chaleur spécifique du matériau (c) et de la variation de température (ΔT) : Q = m · c · ΔT. Le chauffage entraîne généralement une <b>augmentation du volume</b> des corps (dilatation thermique), et lors d'un changement d'état (fusion, évaporation), la température du corps reste constante pendant toute la durée du changement, bien que de la chaleur continue d'être apportée.", "es": "La <b>temperatura</b> es una medida de cuán caliente está un cuerpo y muestra la energía cinética media de las partículas que lo componen; se mide en grados Celsius (°C). El <b>calor</b> es la energía que pasa de un cuerpo más caliente a uno más frío hasta que las temperaturas se igualan. La cantidad de calor necesaria para calentar o enfriar un cuerpo depende de la masa del cuerpo (m), el calor específico del material (c) y el cambio de temperatura (ΔT): Q = m · c · ΔT. Al calentarse, los cuerpos suelen <b>aumentar de volumen</b> (dilatación térmica), y durante un cambio de estado (fusión, evaporación) la temperatura del cuerpo permanece constante mientras dura ese cambio, aunque se siga aportando calor.", "it": "La <b>temperatura</b> è una misura di quanto è riscaldato un corpo e indica l'energia cinetica media delle particelle che lo compongono; si misura in gradi Celsius (°C). Il <b>calore</b> è energia che passa da un corpo più caldo a uno più freddo finché le temperature non si eguagliano. La quantità di calore necessaria per riscaldare o raffreddare un corpo dipende dalla massa del corpo (m), dal calore specifico del materiale (c) e dalla variazione di temperatura (ΔT): Q = m · c · ΔT. Riscaldandosi, i corpi generalmente <b>aumentano di volume</b> (dilatazione termica), e durante un cambiamento di stato (fusione, evaporazione) la temperatura del corpo resta costante per tutta la durata del cambiamento, anche se il calore continua a essere fornito.", "ru": "<b>Температура</b> — мера нагретости тела, показывающая среднюю кинетическую энергию частиц, из которых оно состоит; измеряется в градусах Цельсия (°C). <b>Теплота</b> — это энергия, переходящая от более тёплого тела к более холодному, пока температуры не сравняются. Количество теплоты, необходимое для нагревания или охлаждения тела, зависит от массы тела (m), удельной теплоёмкости материала (c) и изменения температуры (ΔT): Q = m · c · ΔT. При нагревании тела обычно <b>увеличиваются в объёме</b> (тепловое расширение), а при изменении агрегатного состояния (плавление, испарение) температура тела остаётся постоянной, пока длится это изменение, хотя теплота продолжает подводиться.", "pt": "A <b>temperatura</b> é uma medida do aquecimento de um corpo e mostra a energia cinética média das partículas que o compõem; é medida em graus Celsius (°C). O <b>calor</b> é a energia que passa de um corpo mais quente para um mais frio até que as temperaturas se igualem. A quantidade de calor necessária para aquecer ou resfriar um corpo depende da massa do corpo (m), do calor específico do material (c) e da variação de temperatura (ΔT): Q = m · c · ΔT. Ao aquecer, os corpos geralmente <b>aumentam de volume</b> (dilatação térmica), e durante uma mudança de estado (fusão, evaporação) a temperatura do corpo permanece constante enquanto dura essa mudança, embora o calor continue a ser fornecido."}, "formulas": [{"sr": "Q = m · c · ΔT — količina toplote (Q) zavisi od mase tela (m), specifičnog toplotnog kapaciteta (c) i promene temperature (ΔT)", "en": "Q = m · c · ΔT — the amount of heat (Q) depends on the body's mass (m), the specific heat capacity (c) and the temperature change (ΔT)", "de": "Q = m · c · ΔT — die Wärmemenge (Q) hängt von der Masse des Körpers (m), der spezifischen Wärmekapazität (c) und der Temperaturänderung (ΔT) ab", "fr": "Q = m · c · ΔT — la quantité de chaleur (Q) dépend de la masse du corps (m), de la chaleur spécifique (c) et de la variation de température (ΔT)", "es": "Q = m · c · ΔT — la cantidad de calor (Q) depende de la masa del cuerpo (m), el calor específico (c) y el cambio de temperatura (ΔT)", "it": "Q = m · c · ΔT — la quantità di calore (Q) dipende dalla massa del corpo (m), dal calore specifico (c) e dalla variazione di temperatura (ΔT)", "ru": "Q = m · c · ΔT — количество теплоты (Q) зависит от массы тела (m), удельной теплоёмкости (c) и изменения температуры (ΔT)", "pt": "Q = m · c · ΔT — a quantidade de calor (Q) depende da massa do corpo (m), do calor específico (c) e da variação de temperatura (ΔT)"}], "remember": {"sr": "ΔT je uvek razlika konačne i početne temperature (ΔT = t₂ − t₁), a specifični toplotni kapacitet vode (c = 4200 J/(kg·°C)) je jedan od najvećih u prirodi.", "en": "ΔT is always the difference between the final and initial temperature (ΔT = t₂ − t₁), and the specific heat capacity of water (c = 4200 J/(kg·°C)) is one of the highest found in nature.", "de": "ΔT ist stets die Differenz zwischen End- und Anfangstemperatur (ΔT = t₂ − t₁), und die spezifische Wärmekapazität von Wasser (c = 4200 J/(kg·°C)) gehört zu den größten in der Natur.", "fr": "ΔT est toujours la différence entre la température finale et la température initiale (ΔT = t₂ − t₁), et la chaleur spécifique de l'eau (c = 4200 J/(kg·°C)) est l'une des plus élevées dans la nature.", "es": "ΔT es siempre la diferencia entre la temperatura final y la inicial (ΔT = t₂ − t₁), y el calor específico del agua (c = 4200 J/(kg·°C)) es uno de los más altos que existen en la naturaleza.", "it": "ΔT è sempre la differenza tra la temperatura finale e quella iniziale (ΔT = t₂ − t₁), e il calore specifico dell'acqua (c = 4200 J/(kg·°C)) è uno dei più alti presenti in natura.", "ru": "ΔT — это всегда разница между конечной и начальной температурой (ΔT = t₂ − t₁), а удельная теплоёмкость воды (c = 4200 Дж/(кг·°C)) — одна из самых высоких в природе.", "pt": "ΔT é sempre a diferença entre a temperatura final e a inicial (ΔT = t₂ − t₁), e o calor específico da água (c = 4200 J/(kg·°C)) é um dos mais altos encontrados na natureza."}, "problem": {"statement": {"sr": "Koliko je toplote potrebno da se 2 kg vode zagreje sa 20 °C na 60 °C? (c vode = 4200 J/(kg·°C))", "en": "How much heat is needed to warm 2 kg of water from 20 °C to 60 °C? (c of water = 4200 J/(kg·°C))", "de": "Wie viel Wärme ist nötig, um 2 kg Wasser von 20 °C auf 60 °C zu erwärmen? (c von Wasser = 4200 J/(kg·°C))", "fr": "Quelle quantité de chaleur faut-il pour chauffer 2 kg d'eau de 20 °C à 60 °C ? (c de l'eau = 4200 J/(kg·°C))", "es": "¿Cuánto calor se necesita para calentar 2 kg de agua de 20 °C a 60 °C? (c del agua = 4200 J/(kg·°C))", "it": "Quanto calore è necessario per riscaldare 2 kg di acqua da 20 °C a 60 °C? (c dell'acqua = 4200 J/(kg·°C))", "ru": "Сколько теплоты нужно, чтобы нагреть 2 кг воды с 20 °C до 60 °C? (c воды = 4200 Дж/(кг·°C))", "pt": "Quanto calor é necessário para aquecer 2 kg de água de 20 °C para 60 °C? (c da água = 4200 J/(kg·°C))"}, "steps": [{"sr": "Zapiši podatke: m = 2 kg, c = 4200 J/(kg·°C), t₁ = 20 °C, t₂ = 60 °C. Tražimo Q.", "en": "Write down the data: m = 2 kg, c = 4200 J/(kg·°C), t₁ = 20 °C, t₂ = 60 °C. We need to find Q.", "de": "Notiere die Daten: m = 2 kg, c = 4200 J/(kg·°C), t₁ = 20 °C, t₂ = 60 °C. Gesucht ist Q.", "fr": "Note les données : m = 2 kg, c = 4200 J/(kg·°C), t₁ = 20 °C, t₂ = 60 °C. On cherche Q.", "es": "Anota los datos: m = 2 kg, c = 4200 J/(kg·°C), t₁ = 20 °C, t₂ = 60 °C. Buscamos Q.", "it": "Scrivi i dati: m = 2 kg, c = 4200 J/(kg·°C), t₁ = 20 °C, t₂ = 60 °C. Cerchiamo Q.", "ru": "Запишем данные: m = 2 кг, c = 4200 Дж/(кг·°C), t₁ = 20 °C, t₂ = 60 °C. Нужно найти Q.", "pt": "Anote os dados: m = 2 kg, c = 4200 J/(kg·°C), t₁ = 20 °C, t₂ = 60 °C. Procuramos Q."}, {"sr": "Izračunaj promenu temperature: ΔT = t₂ − t₁ = 60 °C − 20 °C = 40 °C.", "en": "Calculate the temperature change: ΔT = t₂ − t₁ = 60 °C − 20 °C = 40 °C.", "de": "Berechne die Temperaturänderung: ΔT = t₂ − t₁ = 60 °C − 20 °C = 40 °C.", "fr": "Calcule la variation de température : ΔT = t₂ − t₁ = 60 °C − 20 °C = 40 °C.", "es": "Calcula el cambio de temperatura: ΔT = t₂ − t₁ = 60 °C − 20 °C = 40 °C.", "it": "Calcola la variazione di temperatura: ΔT = t₂ − t₁ = 60 °C − 20 °C = 40 °C.", "ru": "Вычислим изменение температуры: ΔT = t₂ − t₁ = 60 °C − 20 °C = 40 °C.", "pt": "Calcule a variação de temperatura: ΔT = t₂ − t₁ = 60 °C − 20 °C = 40 °C."}, {"sr": "Primeni formulu Q = m · c · ΔT.", "en": "Apply the formula Q = m · c · ΔT.", "de": "Wende die Formel Q = m · c · ΔT an.", "fr": "Applique la formule Q = m · c · ΔT.", "es": "Aplica la fórmula Q = m · c · ΔT.", "it": "Applica la formula Q = m · c · ΔT.", "ru": "Применим формулу Q = m · c · ΔT.", "pt": "Aplique a fórmula Q = m · c · ΔT."}, {"sr": "Uvrsti brojeve: Q = 2 kg · 4200 J/(kg·°C) · 40 °C = 336 000 J.", "en": "Substitute the numbers: Q = 2 kg · 4200 J/(kg·°C) · 40 °C = 336,000 J.", "de": "Setze die Zahlen ein: Q = 2 kg · 4200 J/(kg·°C) · 40 °C = 336 000 J.", "fr": "Remplace les valeurs : Q = 2 kg · 4200 J/(kg·°C) · 40 °C = 336 000 J.", "es": "Sustituye los valores: Q = 2 kg · 4200 J/(kg·°C) · 40 °C = 336 000 J.", "it": "Sostituisci i valori: Q = 2 kg · 4200 J/(kg·°C) · 40 °C = 336 000 J.", "ru": "Подставим числа: Q = 2 кг · 4200 Дж/(кг·°C) · 40 °C = 336 000 Дж.", "pt": "Substitua

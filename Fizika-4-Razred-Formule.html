<script>
var D={"eyebrow": {"sr": "Formule ✨", "en": "Formule ✨", "de": "Formule ✨", "fr": "Formule ✨", "es": "Formule ✨", "it": "Formule ✨", "ru": "Formule ✨", "pt": "Formule ✨"}, "title": {"sr": "Formule · Fizika 4. razred", "en": "Formulas · Physics Grade 4", "de": "Formeln · Physik 4. Klasse", "fr": "Formules · Physique 4e année", "es": "Fórmulas · Física 4º curso", "it": "Formule · Fisica 4° anno", "ru": "Формулы · Физика, 4 класс", "pt": "Fórmulas · Física, 4º ano"}, "topics": [{"name": {"sr": "Talasna optika", "en": "Wave Optics", "de": "Wellenoptik", "fr": "Optique ondulatoire", "es": "Óptica ondulatoria", "it": "Ottica ondulatoria", "ru": "Волновая оптика", "pt": "Óptica ondulatória"}, "theory": {"sr": "<b>Svetlost kao talas.</b> Talasna optika objašnjava pojave koje geometrijska optika ne može: interferenciju, difrakciju i polarizaciju svetlosti. Svetlost je elektromagnetni talas čija je brzina u vakuumu c ≈ 3·10⁸ m/s. Interferencija nastaje slaganjem koherentnih talasa – dolazi do pojačanja (konstruktivna interferencija) ili slabljenja (destruktivna interferencija) intenziteta svetlosti. Difrakcija je skretanje svetlosti oko prepreka i kroz uske otvore i izraženija je što je otvor uži. Polarizacija dokazuje da je svetlost transverzalni talas.", "en": "<b>Light as a wave.</b> Wave optics explains phenomena that geometric optics cannot: interference, diffraction and polarization of light. Light is an electromagnetic wave whose speed in vacuum is c ≈ 3·10⁸ m/s. Interference results from the superposition of coherent waves – it produces reinforcement (constructive interference) or weakening (destructive interference) of light intensity. Diffraction is the bending of light around obstacles and through narrow openings, and it is more pronounced the narrower the opening is. Polarization proves that light is a transverse wave.", "de": "<b>Licht als Welle.</b> Die Wellenoptik erklärt Erscheinungen, die die geometrische Optik nicht erklären kann: Interferenz, Beugung und Polarisation des Lichts. Licht ist eine elektromagnetische Welle, deren Geschwindigkeit im Vakuum c ≈ 3·10⁸ m/s beträgt. Interferenz entsteht durch Überlagerung kohärenter Wellen – dabei kommt es zur Verstärkung (konstruktive Interferenz) oder Abschwächung (destruktive Interferenz) der Lichtintensität. Beugung ist die Ablenkung des Lichts um Hindernisse und durch enge Öffnungen und ist umso ausgeprägter, je enger die Öffnung ist. Die Polarisation beweist, dass Licht eine Transversalwelle ist.", "fr": "<b>La lumière en tant qu'onde.</b> L'optique ondulatoire explique des phénomènes que l'optique géométrique ne peut pas expliquer : l'interférence, la diffraction et la polarisation de la lumière. La lumière est une onde électromagnétique dont la vitesse dans le vide est c ≈ 3·10⁸ m/s. L'interférence résulte de la superposition d'ondes cohérentes – elle produit un renforcement (interférence constructive) ou un affaiblissement (interférence destructive) de l'intensité lumineuse. La diffraction est la déviation de la lumière autour d'obstacles et à travers des ouvertures étroites ; elle est d'autant plus marquée que l'ouverture est étroite. La polarisation prouve que la lumière est une onde transversale.", "es": "<b>La luz como onda.</b> La óptica ondulatoria explica fenómenos que la óptica geométrica no puede explicar: la interferencia, la difracción y la polarización de la luz. La luz es una onda electromagnética cuya velocidad en el vacío es c ≈ 3·10⁸ m/s. La interferencia surge de la superposición de ondas coherentes – produce un refuerzo (interferencia constructiva) o un debilitamiento (interferencia destructiva) de la intensidad luminosa. La difracción es la desviación de la luz alrededor de obstáculos y a través de aberturas estrechas, y es más pronunciada cuanto más estrecha es la abertura. La polarización demuestra que la luz es una onda transversal.", "it": "<b>La luce come onda.</b> L'ottica ondulatoria spiega fenomeni che l'ottica geometrica non può spiegare: l'interferenza, la diffrazione e la polarizzazione della luce. La luce è un'onda elettromagnetica la cui velocità nel vuoto è c ≈ 3·10⁸ m/s. L'interferenza nasce dalla sovrapposizione di onde coerenti – produce un rafforzamento (interferenza costruttiva) o un indebolimento (interferenza distruttiva) dell'intensità luminosa. La diffrazione è la deviazione della luce attorno agli ostacoli e attraverso aperture strette, ed è tanto più marcata quanto più stretta è l'apertura. La polarizzazione dimostra che la luce è un'onda trasversale.", "ru": "<b>Свет как волна.</b> Волновая оптика объясняет явления, которые не может объяснить геометрическая оптика: интерференцию, дифракцию и поляризацию света. Свет — это электромагнитная волна, скорость которой в вакууме c ≈ 3·10⁸ м/с. Интерференция возникает при наложении когерентных волн – происходит усиление (конструктивная интерференция) или ослабление (деструктивная интерференция) интенсивности света. Дифракция — это огибание светом препятствий и прохождение через узкие отверстия, и она тем заметнее, чем уже отверстие. Поляризация доказывает, что свет — поперечная волна.", "pt": "<b>A luz como onda.</b> A óptica ondulatória explica fenómenos que a óptica geométrica não consegue explicar: a interferência, a difração e a polarização da luz. A luz é uma onda eletromagnética cuja velocidade no vácuo é c ≈ 3·10⁸ m/s. A interferência surge da sobreposição de ondas coerentes – produz um reforço (interferência construtiva) ou um enfraquecimento (interferência destrutiva) da intensidade luminosa. A difração é o desvio da luz em torno de obstáculos e através de aberturas estreitas, sendo mais pronunciada quanto mais estreita for a abertura. A polarização prova que a luz é uma onda transversal."}, "formulas": [{"sr": "Talasna dužina i frekvencija: λ = c / f", "en": "Wavelength and frequency: λ = c / f", "de": "Wellenlänge und Frequenz: λ = c / f", "fr": "Longueur d'onde et fréquence : λ = c / f", "es": "Longitud de onda y frecuencia: λ = c / f", "it": "Lunghezza d'onda e frequenza: λ = c / f", "ru": "Длина волны и частота: λ = c / f", "pt": "Comprimento de onda e frequência: λ = c / f"}, {"sr": "Rastojanje između pruga kod dvostrukog proreza: Δx = λ·L / d", "en": "Fringe spacing in a double-slit experiment: Δx = λ·L / d", "de": "Streifenabstand beim Doppelspaltversuch: Δx = λ·L / d", "fr": "Interfrange dans l'expérience des fentes de Young : Δx = λ·L / d", "es": "Separación entre franjas en la doble rendija de Young: Δx = λ·L / d", "it": "Distanza tra le frange nell'esperimento della doppia fenditura di Young: Δx = λ·L / d", "ru": "Расстояние между полосами в опыте Юнга: Δx = λ·L / d", "pt": "Distância entre franjas na experiência da fenda dupla de Young: Δx = λ·L / d"}], "remember": {"sr": "Difrakcija je izraženija kada je širina otvora bliska talasnoj dužini svetlosti.", "en": "Diffraction is more pronounced when the width of the opening is close to the wavelength of the light.", "de": "Die Beugung ist umso ausgeprägter, je näher die Öffnungsbreite an der Wellenlänge des Lichts liegt.", "fr": "La diffraction est d'autant plus marquée que la largeur de l'ouverture est proche de la longueur d'onde de la lumière.", "es": "La difracción es más pronunciada cuando el ancho de la abertura se aproxima a la longitud de onda de la luz.", "it": "La diffrazione è tanto più marcata quanto più la larghezza dell'apertura si avvicina alla lunghezza d'onda della luce.", "ru": "Дифракция тем заметнее, чем ближе ширина отверстия к длине волны света.", "pt": "A difração é mais pronunciada quando a largura da abertura se aproxima do comprimento de onda da luz."}, "problem": {"statement": {"sr": "Na Jangovom dvostrukom prorezu rastojanje između proreza je d = 0,2 mm, ekran je na L = 2 m, a rastojanje između susednih svetlih pruga na ekranu je Δx = 6 mm. Odredi talasnu dužinu svetlosti.", "en": "In Young's double-slit experiment the slit separation is d = 0.2 mm, the screen is at L = 2 m, and the spacing between adjacent bright fringes on the screen is Δx = 6 mm. Find the wavelength of the light.", "de": "Beim Doppelspaltversuch nach Young beträgt der Spaltabstand d = 0,2 mm, der Schirm steht bei L = 2 m, und der Abstand zwischen benachbarten hellen Streifen auf dem Schirm ist Δx = 6 mm. Bestimme die Wellenlänge des Lichts.", "fr": "Dans l'expérience des fentes de Young, l'écart entre les fentes est d = 0,2 mm, l'écran est à L = 2 m, et l'écart entre deux franges brillantes voisines sur l'écran est Δx = 6 mm. Détermine la longueur d'onde de la lumière.", "es": "En el experimento de la doble rendija de Young, la separación entre las rendijas es d = 0,2 mm, la pantalla está a L = 2 m, y la separación entre franjas brillantes vecinas en la pantalla es Δx = 6 mm. Determina la longitud de onda de la luz.", "it": "Nell'esperimento della doppia fenditura di Young la distanza tra le fenditure è d = 0,2 mm, lo schermo si trova a L = 2 m, e la distanza tra due frange luminose adiacenti sullo schermo è Δx = 6 mm. Determina la lunghezza d'onda della luce.", "ru": "В опыте Юнга с двумя щелями расстояние между щелями d = 0,2 мм, экран находится на расстоянии L = 2 м, а расстояние между соседними светлыми полосами на экране Δx = 6 мм. Определи длину волны света.", "pt": "Na experiência da fenda dupla de Young, a distância entre as fendas é d = 0,2 mm, o ecrã está a L = 2 m, e a distância entre franjas brilhantes vizinhas no ecrã é Δx = 6 mm. Determina o comprimento de onda da luz."}, "steps": [{"sr": "Zapiši formulu za rastojanje između pruga: Δx = λ·L / d", "en": "Write the formula for fringe spacing: Δx = λ·L / d", "de": "Formel für den Streifenabstand aufschreiben: Δx = λ·L / d", "fr": "Écris la formule de l'interfrange : Δx = λ·L / d", "es": "Escribe la fórmula de la separación entre franjas: Δx = λ·L / d", "it": "Scrivi la formula della distanza tra le frange: Δx = λ·L / d", "ru": "Запиши формулу расстояния между полосами: Δx = λ·L / d", "pt": "Escreve a fórmula da distância entre franjas: Δx = λ·L / d"}, {"sr": "Izrazi talasnu dužinu: λ = Δx·d / L", "en": "Express the wavelength: λ = Δx·d / L", "de": "Wellenlänge ausdrücken: λ = Δx·d / L", "fr": "Exprime la longueur d'onde : λ = Δx·d / L", "es": "Expresa la longitud de onda: λ = Δx·d / L", "it": "Esprimi la lunghezza d'onda: λ = Δx·d / L", "ru": "Вырази длину волны: λ = Δx·d / L", "pt": "Exprime o comprimento de onda: λ = Δx·d / L"}, {"sr": "Uvrsti vrednosti: λ = (6·10⁻³ · 2·10⁻⁴) / 2 = 6·10⁻⁷ m", "en": "Substitute the values: λ = (6·10⁻³ · 2·10⁻⁴) / 2 = 6·10⁻⁷ m", "de": "Werte einsetzen: λ = (6·10⁻³ · 2·10⁻⁴) / 2 = 6·10⁻⁷ m", "fr": "Remplace les valeurs : λ = (6·10⁻³ · 2·10⁻⁴) / 2 = 6·10⁻⁷ m", "es": "Sustituye los valores: λ = (6·10⁻³ · 2·10⁻⁴) / 2 = 6·10⁻⁷ m", "it": "Sostituisci i valori: λ = (6·10⁻³ · 2·10⁻⁴) / 2 = 6·10⁻⁷ m", "ru": "Подставь значения: λ = (6·10⁻³ · 2·10⁻⁴) / 2 = 6·10⁻⁷ м", "pt": "Substitui os valores: λ = (6·10⁻³ · 2·10⁻⁴) / 2 = 6·10⁻⁷ m"}, {"sr": "Zaključak: talasna dužina svetlosti je 600 nm (narandžasto-crvena svetlost).", "en": "Conclusion: the wavelength of the light is 600 nm (orange-red light).", "de": "Schlussfolgerung: Die Wellenlänge des Lichts beträgt 600 nm (orange-rotes Licht).", "fr": "Conclusion : la longueur d'onde de la lumière est 600 nm (lumière orange-rouge).", "es": "Conclusión: la longitud de onda de la luz es 600 nm (luz naranja-roja).", "it": "Conclusione: la lunghezza d'onda della luce è 600 nm (luce arancio-rossa).", "ru": "Вывод: длина волны света составляет 600 нм (оранжево-красный свет).", "pt": "Conclusão: o comprimento de onda da luz é 600 nm (luz laranja-avermelhada)."}]}}, {"name": {"sr": "Kvantna fizika", "en": "Quantum Physics", "de": "Quantenphysik", "fr": "Physique quantique", "es": "Física cuántica", "it": "Fisica quantistica", "ru": "Квантовая физика", "pt": "Física quântica"}, "theory": {"sr": "<b>Svetlost kao čestica.</b> Kvantna fizika pokazuje da svetlost, pored talasnih, ima i osobine čestica – fotona. Foton nosi energiju E = h·f, gde je h Plankova konstanta (h = 6,63·10⁻³⁴ J·s). Fotoefekat je izbijanje elektrona iz metala pod dejstvom svetlosti i javlja se samo ako je frekvencija svetlosti veća od granične frekvencije metala. Ajnštajnova jednačina fotoefekta glasi h·f = A + Ek, gde je A izlazni rad metala, a Ek kinetička energija izbijenog elektrona. Kvantna fizika uvodi i pojam talasno-čestične dualnosti materije.", "en": "<b>Light as a particle.</b> Quantum physics shows that light, besides its wave properties, also has particle properties – it consists of photons. A photon carries energy E = h·f, where h is Planck's constant (h = 6.63·10⁻³⁴ J·s). The photoelectric effect is the ejection of electrons from a metal under the action of light, and it occurs only if the frequency of the light is above the metal's threshold frequency. Einstein's photoelectric equation is h·f = A + Ek, where A is the work function of the metal and Ek is the kinetic energy of the ejected electron. Quantum physics also introduces the concept of the wave-particle duality of matter.", "de": "<b>Licht als Teilchen.</b> Die Quantenphysik zeigt, dass Licht neben Welleneigenschaften auch Teilcheneigenschaften besitzt – Photonen. Ein Photon trägt die Energie E = h·f, wobei h das Plancksche Wirkungsquantum ist (h = 6,63·10⁻³⁴ J·s). Der photoelektrische Effekt ist das Herausschlagen von Elektronen aus einem Metall durch Lichteinwirkung und tritt nur auf, wenn die Frequenz des Lichts über der Grenzfrequenz des Metalls liegt. Die Einsteinsche Gleichung des photoelektrischen Effekts lautet h·f = A + Ek, wobei A die Austrittsarbeit des Metalls und Ek die kinetische Energie des herausgeschlagenen Elektrons ist. Die Quantenphysik führt auch den Begriff des Welle-Teilchen-Dualismus der Materie ein.", "fr": "<b>La lumière en tant que particule.</b> La physique quantique montre qu'en plus de ses propriétés ondulatoires, la lumière possède aussi des propriétés corpusculaires – elle est constituée de photons. Un photon transporte une énergie E = h·f, où h est la constante de Planck (h = 6,63·10⁻³⁴ J·s). L'effet photoélectrique est l'éjection d'électrons d'un métal sous l'action de la lumière ; il ne se produit que si la fréquence de la lumière est supérieure à la fréquence seuil du métal. L'équation d'Einstein de l'effet photoélectrique s'écrit h·f = A + Ek, où A est le travail de sortie du métal et Ek l'énergie cinétique de l'électron éjecté. La physique quantique introduit aussi la notion de dualité onde-particule de la matière.", "es": "<b>La luz como partícula.</b> La física cuántica muestra que la luz, además de propiedades ondulatorias, tiene también propiedades de partícula – está formada por fotones. Un fotón transporta una energía E = h·f, donde h es la constante de Planck (h = 6,63·10⁻³⁴ J·s). El efecto fotoeléctrico es la expulsión de electrones de un metal por acción de la luz, y ocurre solo si la frecuencia de la luz supera la frecuencia umbral del metal. La ecuación de Einstein del efecto fotoeléctrico es h·f = A + Ek, donde A es el trabajo de extracción del metal y Ek la energía cinética del electrón expulsado. La física cuántica introduce también el concepto de dualidad onda-partícula de la materia.", "it": "<b>La luce come particella.</b> La fisica quantistica mostra che la luce, oltre alle proprietà ondulatorie, possiede anche proprietà corpuscolari – è composta da fotoni. Un fotone trasporta un'energia E = h·f, dove h è la costante di Planck (h = 6,63·10⁻³⁴ J·s). L'effetto fotoelettrico è l'espulsione di elettroni da un metallo per azione della luce e si verifica solo se la frequenza della luce supera la frequenza di soglia del metallo. L'equazione di Einstein dell'effetto fotoelettrico è h·f = A + Ek, dove A è il lavoro di estrazione del metallo ed Ek è l'energia cinetica dell'elettrone espulso. La fisica quantistica introduce anche il concetto di dualismo onda-particella della materia.", "ru": "<b>Свет как частица.</b> Квантовая физика показывает, что свет, помимо волновых свойств, обладает и корпускулярными свойствами – он состоит из фотонов. Фотон несёт энергию E = h·f, где h — постоянная Планка (h = 6,63·10⁻³⁴ Дж·с). Фотоэффект — это вырывание электронов из металла под действием света; он возникает только если частота света превышает граничную частоту металла. Уравнение Эйнштейна для фотоэффекта имеет вид h·f = A + Ek, где A — работа выхода металла, а Ek — кинетическая энергия вырванного электрона. Квантовая физика вводит также понятие корпускулярно-волнового дуализма материи.", "pt": "<b>A luz como partícula.</b> A física quântica mostra que a luz, além das propriedades ondulatórias, tem também propriedades corpusculares – é composta por fotões. Um fotão transporta uma energia E = h·f, onde h é a constante de Planck (h = 6,63·10⁻³⁴ J·s). O efeito fotoelétrico é a ejeção de eletrões de um metal sob a ação da luz e só ocorre se a frequência da luz for superior à frequência limite do metal. A equação de Einstein do efeito fotoelétrico é h·f = A + Ek, onde A é o trabalho de extração do metal e Ek é a energia cinética do eletrão ejetado. A física quântica introduz também o conceito de dualidade onda-partícula da matéria."}, "formulas": [{"sr": "Energija fotona: E = h·f", "en": "Photon energy: E = h·f", "de": "Photonenenergie: E = h·f", "fr": "Énergie du photon : E = h·f", "es": "Energía del fotón: E = h·f", "it": "Energia del fotone: E = h·f", "ru": "Энергия фотона: E = h·f", "pt": "Energia do fotão: E = h·f"}, {"sr": "Ajnštajnova jednačina fotoefekta: h·f = A + Ek", "en": "Einstein's photoelectric equation: h·f = A + Ek", "de": "Einsteinsche Gleichung des photoelektrischen Effekts: h·f = A + Ek", "fr": "Équation d'Einstein de l'effet photoélectrique : h·f = A + Ek", "es": "Ecuación de Einstein del efecto fotoeléctrico: h·f = A + Ek", "it": "Equazione di Einstein dell'effetto fotoelettrico: h·f = A + Ek", "ru": "Уравнение Эйнштейна для фотоэффекта: h·f = A + Ek", "pt": "Equação de Einstein do efeito fotoelétrico: h·f = A + Ek"}], "remember": {"sr": "Fotoefekat ne zavisi od intenziteta svetlosti, već od njene frekvencije.", "en": "The photoelectric effect does not depend on the intensity of light, but on its frequency.", "de": "Der photoelektrische Effekt hängt nicht von der Intensität des Lichts ab, sondern von seiner Frequenz.", "fr": "L'effet photoélectrique ne dépend pas de l'intensité de la lumière, mais de sa fréquence.", "es": "El efecto fotoeléctrico no depende de la intensidad de la luz, sino de su frecuencia.", "it": "L'effetto fotoelettrico non dipende dall'intensità della luce, ma dalla sua frequenza.", "ru": "Фотоэффект не зависит от интенсивности света, а зависит от его частоты.", "pt": "O efeito fotoelétrico não depende da intensidade da luz, mas sim da sua frequência."}, "problem": {"statement": {"sr": "Izlazni rad metala je A = 2 eV. Metal se osvetljava svetlošću frekvencije f = 8·10¹⁴ Hz. Odredi kinetičku energiju izbijenih fotoelektrona.", "en": "The work function of a metal is A = 2 eV. The metal is illuminated with light of frequency f = 8·10¹⁴ Hz. Find the kinetic energy of the ejected photoelectrons.", "de": "Die Austrittsarbeit eines Metalls beträgt A = 2 eV. Das Metall wird mit Licht der Frequenz f = 8·10¹⁴ Hz bestrahlt. Bestimme die kinetische Energie der herausgeschlagenen Photoelektronen.", "fr": "Le travail de sortie d'un métal est A = 2 eV. Le métal est éclairé par une lumière de fréquence f = 8·10¹⁴ Hz. Détermine l'énergie cinétique des photoélectrons éjectés.", "es": "El trabajo de extracción de un metal es A = 2 eV. El metal se ilumina con luz de frecuencia f = 8·10¹⁴ Hz. Determina la energía cinética de los fotoelectrones expulsados.", "it": "Il lavoro di estrazione di un metallo è A = 2 eV. Il metallo viene illuminato con luce di frequenza f = 8·10¹⁴ Hz. Determina l'energia cinetica dei fotoelettroni espulsi.", "ru": "Работа выхода металла A = 2 эВ. Металл освещают светом с частотой f = 8·10¹⁴ Гц. Определи кинетическую энергию вырванных фотоэлектронов.", "pt": "O trabalho de extração de um metal é A = 2 eV. O metal é iluminado com luz de frequência f = 8·10¹⁴ Hz. Determina a energia cinética dos fotoeletrões ejetados."}, "steps": [{"sr": "Pretvori izlazni rad u džule: A = 2 eV = 2 · 1,6·10⁻¹⁹ J = 3,2·10⁻¹⁹ J", "en": "Convert the work function to joules: A = 2 eV = 2 · 1.6·10⁻¹⁹ J = 3.2·10⁻¹⁹ J", "de": "Austrittsarbeit in Joule umrechnen: A = 2 eV = 2 · 1,6·10⁻¹⁹ J = 3,2·10⁻¹⁹ J", "fr": "Convertis le travail de sortie en joules : A = 2 eV = 2 · 1,6·10⁻¹⁹ J = 3,2·10⁻¹⁹ J", "es": "Convierte el trabajo de extracción a julios: A = 2 eV = 2 · 1,6·10⁻¹⁹ J = 3,2·10⁻¹⁹ J", "it": "Converti il lavoro di estrazione in joule: A = 2 eV = 2 · 1,6·10⁻¹⁹ J = 3,2·10⁻¹⁹ J", "ru": "Переведи работу выхода в джоули: A = 2 эВ = 2 · 1,6·10⁻¹⁹ Дж = 3,2·10⁻¹⁹ Дж", "pt": "Converte o trabalho de extração para joules: A = 2 eV = 2 · 1,6·10⁻¹⁹ J = 3,2·10⁻¹⁹ J"}, {"sr": "Izračunaj energiju fotona: E = h·f = 6,63·10⁻³⁴ · 8·10¹⁴ ≈ 5,3·10⁻¹⁹ J", "en": "Calculate the photon energy: E = h·f = 6.63·10⁻³⁴ · 8·10¹⁴ ≈ 5.3·10⁻¹⁹ J", "de": "Photonenenergie berechnen: E = h·f = 6,63·10⁻³⁴ · 8·10¹⁴ ≈ 5,3·10⁻¹⁹ J", "fr": "Calcule l'énergie du photon : E = h·f = 6,63·10⁻³⁴ · 8·10¹⁴ ≈ 5,3·10⁻¹⁹ J", "es": "Calcula la energía del fotón: E = h·f = 6,63·10⁻³⁴ · 8·10¹⁴ ≈ 5,3·10⁻¹⁹ J", "it": "Calcola l'energia del fotone: E = h·f = 6,63·10⁻³⁴ · 8·10¹⁴ ≈ 5,3·10⁻¹⁹ J", "ru": "Вычисли энергию фотона: E = h·f = 6,63·10⁻³⁴ · 8·10¹⁴ ≈ 5,3·10⁻¹⁹ Дж", "pt": "Calcula a energia do fotão: E = h·f = 6,63·10⁻³⁴ · 8·10¹⁴ ≈ 5,3·10⁻¹⁹ J"}, {"sr": "Primeni Ajnštajnovu jednačinu: Ek = h·f − A = 5,3·10⁻¹⁹ − 3,2·10⁻¹⁹ = 2,1·10⁻¹⁹ J", "en": "Apply Einstein's equation: Ek = h·f − A = 5.3·10⁻¹⁹ − 3.2·10⁻¹⁹ = 2.1·10⁻¹⁹ J", "de": "Einsteinsche Gleichung anwenden: Ek = h·f − A = 5,3·10⁻¹⁹ − 3,2·10⁻¹⁹ = 2,1·10⁻¹⁹ J", "fr": "Applique l'équation d'Einstein : Ek = h·f − A = 5,3·10⁻¹⁹ − 3,2·10⁻¹⁹ = 2,1·10⁻¹⁹ J", "es": "Aplica la ecuación de Einstein: Ek = h·f − A = 5,3·10⁻¹⁹ − 3,2·10⁻¹⁹ = 2,1·10⁻¹⁹ J", "it": "Applica l'equazione di Einstein: Ek = h·f − A = 5,3·10⁻¹⁹ − 3,2·10⁻¹⁹ = 2,1·10⁻¹⁹ J", "ru": "Примени уравнение Эйнштейна: Ek = h·f − A = 5,3·10⁻¹⁹ − 3,2·10⁻¹⁹ = 2,1·10⁻¹⁹ Дж", "pt": "Aplica a equação de Einstein: Ek = h·f − A = 5,3·10⁻¹⁹ − 3,2·10⁻¹⁹ = 2,1·10⁻¹⁹ J"}, {"sr": "Zaključak: kinetička energija fotoelektrona je 2,1·10⁻¹⁹ J.", "en": "Conclusion: the kinetic energy of the photoelectrons is 2.1·10⁻¹⁹ J.", "de": "Schlussfolgerung: Die kinetische Energie der Photoelektronen beträgt 2,1·10⁻¹⁹ J.", "fr": "Conclusion : l'énergie cinétique des photoélectrons est 2,1·10⁻¹⁹ J.", "es": "Conclusión: la energía cinética de los fotoelectrones es 2,1·10⁻¹⁹ J.", "it": "Conclusione: l'energia cinetica dei fotoelettroni è 2,1·10⁻¹⁹ J.", "ru": "Вывод: кинетическая энергия фотоэлектронов равна 2,1·10⁻¹⁹ Дж.", "pt": "Conclusão: a energia cinética dos fotoeletrões é 2,1·10⁻¹⁹ J."}]}}, {"name": {"sr": "Atom i jezgro", "en": "Atom and Nucleus", "de": "Atom und Kern", "fr": "Atome et noyau", "es": "Átomo y núcleo", "it": "Atomo e nucleo", "ru": "Атом и ядро", "pt": "Átomo e núcleo"}, "theory": {"sr": "<b>Građa atoma i jezgra.</b> Atom čine jezgro (protoni i neutroni) i elektronski omotač. Borov model atoma objašnjava emisione i apsorpcione spektre pomoću kvantovanih energetskih nivoa elektrona – prelaskom elektrona sa višeg na niži nivo emituje se foton energije E = h·f. Jezgro drži na okupu jaka nuklearna sila koja nadjačava elektrostatičko odbijanje protona. Radioaktivni raspad je spontana promena jezgra praćena emisijom čestica ili zračenja (alfa, beta, gama). Broj neraspadnutih jezgara opada eksponencijalno sa vremenom, a vreme za koje se raspadne polovina jezgara naziva se vreme poluraspada T.", "en": "<b>Structure of the atom and nucleus.</b> An atom consists of a nucleus (protons and neutrons) and an electron shell. Bohr's model of the atom explains emission and absorption spectra using quantized electron energy levels – when an electron falls from a higher to a lower level, it emits a photon of energy E = h·f. The nucleus is held together by the strong nuclear force, which overcomes the electrostatic repulsion of the protons. Radioactive decay is a spontaneous change of the nucleus accompanied by the emission of particles or radiation (alpha, beta, gamma). The number of undecayed nuclei decreases exponentially with time, and the time in which half of the nuclei decay is called the half-life T.", "de": "<b>Aufbau von Atom und Kern.</b> Ein Atom besteht aus einem Kern (Protonen und Neutronen) und einer Elektronenhülle. Das Bohrsche Atommodell erklärt Emissions- und Absorptionsspektren mithilfe quantisierter Energieniveaus der Elektronen – beim Übergang eines Elektrons von einem höheren auf ein niedrigeres Niveau wird ein Photon der Energie E = h·f emittiert. Der Kern wird durch die starke Kernkraft zusammengehalten, die die elektrostatische Abstoßung der Protonen überwindet. Der radioaktive Zerfall ist eine spontane Veränderung des Kerns, begleitet von der Emission von Teilchen oder Strahlung (Alpha, Beta, Gamma). Die Anzahl der unzerfallenen Kerne nimmt exponentiell mit der Zeit ab, und die Zeit, in der die Hälfte der Kerne zerfällt, wird Halbwertszeit T genannt.", "fr": "<b>Structure de l'atome et du noyau.</b> Un atome est composé d'un noyau (protons et neutrons) et d'un cortège électronique. Le modèle de Bohr explique les spectres d'émission et d'absorption grâce aux niveaux d'énergie quantifiés des électrons – lorsqu'un électron passe d'un niveau supérieur à un niveau inférieur, il émet un photon d'énergie E = h·f. Le noyau est maintenu cohésif par l'interaction nucléaire forte, qui surmonte la répulsion électrostatique des protons. La désintégration radioactive est une transformation spontanée du noyau accompagnée de l'émission de particules ou de rayonnement (alpha, bêta, gamma). Le nombre de noyaux non désintégrés diminue exponentiellement avec le temps, et le temps au bout duquel la moitié des noyaux se désintègre est appelé période de demi-vie T.", "es": "<b>Estructura del átomo y del núcleo.</b> Un átomo está formado por un núcleo (protones y neutrones) y una envoltura electrónica. El modelo de Bohr del átomo explica los espectros de emisión y absorción mediante niveles de energía cuantizados de los electrones – al pasar un electrón de un nivel superior a uno inferior, se emite un fotón de energía E = h·f. El núcleo se mantiene unido por la interacción nuclear fuerte, que supera la repulsión electrostática de los protones. La desintegración radiactiva es un cambio espontáneo del núcleo acompañado de la emisión de partículas o radiación (alfa, beta, gamma). El número de núcleos no desintegrados disminuye exponencialmente con el tiempo, y el tiempo en que se desintegra la mitad de los núcleos se llama periodo de semidesintegración T.", "it": "<b>Struttura dell'atomo e del nucleo.</b> Un atomo è formato da un nucleo (protoni e neutroni) e da un involucro elettronico. Il modello di Bohr dell'atomo spiega gli spettri di emissione e assorbimento tramite livelli energetici quantizzati degli elettroni – quando un elettrone passa da un livello superiore a uno inferiore, emette un fotone di energia E = h·f. Il nucleo è tenuto insieme dall'interazione nucleare forte, che supera la repulsione elettrostatica dei protoni. Il decadimento radioattivo è un cambiamento spontaneo del nucleo accompagnato dall'emissione di particelle o radiazioni (alfa, beta, gamma). Il numero di nuclei non decaduti diminuisce esponenzialmente nel tempo, e il tempo in cui decade metà dei nuclei si chiama tempo di dimezzamento T.", "ru": "<b>Строение атома и ядра.</b> Атом состоит из ядра (протоны и нейтроны) и электронной оболочки. Модель атома Бора объясняет спектры испускания и поглощения с помощью квантованных энергетических уровней электронов – при переходе электрона с более высокого уровня на более низкий испускается фотон энергией E = h·f. Ядро удерживается сильным ядерным взаимодействием, которое превосходит электростатическое отталкивание протонов. Радиоактивный распад — это самопроизвольное изменение ядра, сопровождающееся испусканием частиц или излучения (альфа, бета, гамма). Число нераспавшихся ядер убывает экспоненциально со временем, а время, за которое распадается половина ядер, называется периодом полураспада T.", "pt": "<b>Estrutura do átomo e do núcleo.</b> Um átomo é constituído por um núcleo (protões e neutrões) e uma nuvem eletrónica. O modelo atómico de Bohr explica os espetros de emissão e absorção através de níveis de energia quantizados dos eletrões – quando um eletrão passa de um nível superior para um inferior, emite um fotão de energia E = h·f. O núcleo é mantido coeso pela interação nuclear forte, que supera a repulsão eletrostática dos protões. O decaimento radioativo é uma alteração espontânea do núcleo acompanhada pela emissão de partículas ou radiação (alfa, beta, gama). O número de núcleos não desintegrados diminui exponencialmente com o tempo, e o tempo em que metade dos núcleos se desintegra chama-se período de semidesintegração T."}, "formulas": [{"sr": "Zakon radioaktivnog raspada: N = N₀ · (1/2)^(t/T)", "en": "Law of radioactive decay: N = N₀ · (1/2)^(t/T)", "de": "Zerfallsgesetz: N = N₀ · (1/2)^(t/T)", "fr": "Loi de la désintégration radioactive : N = N₀ · (1/2)^(t/T)", "es": "Ley de la desintegración radiactiva: N = N₀ · (1/2)^(t/T)", "it": "Legge del decadimento radioattivo: N = N₀ · (1/2)^(t/T)", "ru": "Закон радиоактивного распада: N = N₀ · (1/2)^(t/T)", "pt": "Lei do decaimento radioativo: N = N₀ · (1/2)^(t/T)"}, {"sr": "Ekvivalencija mase i energije (defekt mase): E = m·c²", "en": "Mass–energy equivalence (mass defect): E = m·c²", "de": "Masse-Energie-Äquivalenz (Massendefekt): E = m·c²", "fr": "Équivalence masse-énergie (défaut de masse) : E = m·c²", "es": "Equivalencia masa-energía (defecto de masa): E = m·c²", "it": "Equivalenza massa-energia (difetto di massa): E = m·c²", "ru": "Эквивалентность массы и энергии (дефект массы): E = m·c²", "pt": "Equivalência massa-energia (defeito de massa): E = m·c²"}], "remember": {"sr": "Za vreme jednog poluraspada T uvek se raspadne tačno polovina preostalih jezgara, bez obzira na to koliko ih je bilo.", "en": "During one half-life T exactly half of the remaining nuclei always decay, no matter how many there were.", "de": "Während einer Halbwertszeit T zerfällt immer genau die Hälfte der verbliebenen Kerne, unabhängig davon, wie viele es waren.", "fr": "Pendant une demi-vie T, exactement la moitié des noyaux restants se désintègre toujours, quel que soit leur nombre initial.", "es": "Durante un periodo de semidesintegración T siempre se desintegra exactamente la mitad de los núcleos restantes, sin importar cuántos hubiera.", "it": "Durante un tempo di dimezzamento T decade sempre esattamente la metà dei nuclei rimasti, indipendentemente da quanti fossero.", "ru": "За один период полураспада T всегда распадается ровно половина оставшихся ядер, независимо от их количества.", "pt": "Durante um período de semidesintegração T desintegra-se sempre exatamente metade dos núcleos restantes, independentemente de quantos houvesse."}, "problem": {"statement": {"sr": "Radioaktivni izotop ima vreme poluraspada T = 8 dana. Početna količina jezgara je N₀ = 4·10²⁰. Koliko jezgara ostane neraspadnuto posle 24 dana?", "en": "A radioactive isotope has a half-life of T = 8 days. The initial number of nuclei is N₀ = 4·10²⁰. How many nuclei remain undecayed after 24 days?", "de": "Ein radioaktives Isotop hat eine Halbwertszeit von T = 8 Tagen. Die anfängliche Anzahl der Kerne beträgt N₀ = 4·10²⁰. Wie viele Kerne sind nach 24 Tagen noch nicht zerfallen?", "fr": "Un isotope radioactif a une demi-vie T = 8 jours. Le nombre initial de noyaux est N₀ = 4·10²⁰. Combien de noyaux restent non désintégrés après 24 jours ?", "es": "Un isótopo radiactivo tiene un periodo de semidesintegración T = 8 días. La cantidad inicial de núcleos es N₀ = 4·10²⁰. ¿Cuántos núcleos quedan sin desintegrar después de 24 días?", "it": "Un isotopo radioattivo ha un tempo di dimezzamento T = 8 giorni. La quantità iniziale di nuclei è N₀ = 4·10²⁰. Quanti nuclei restano non decaduti dopo 24 giorni?", "ru": "Радиоактивный изотоп имеет период полураспада T = 8 дней. Начальное количество ядер N₀ = 4·10²⁰. Сколько ядер останется нераспавшимися через 24 дня?", "pt": "Um isótopo radioativo tem um período de semidesintegração T = 8 dias. A quantidade inicial de núcleos é N₀ = 4·10²⁰. Quantos núcleos permanecem por desintegrar após 24 dias?"}, "steps": [{"sr": "Odredi broj perioda poluraspada: n = t/T = 24/8 = 3", "en": "Find the number of half-lives: n = t/T = 24/8 = 3", "de": "Anzahl der Halbwertszeiten bestimmen: n = t/T = 24/8 = 3", "fr": "Détermine le nombre de demi-vies : n = t/T = 24/8 = 3", "es": "Determina el número de periodos de semidesintegración: n = t/T = 24/8 = 3", "it": "Determina il numero di tempi di dimezzamento: n = t/T = 24/8 = 3", "ru": "Определи число периодов полураспада: n = t/T = 24/8 = 3", "pt": "Determina o número de períodos de semidesintegração: n = t/T = 24/8 = 3"}, {"sr": "Zapiši zakon raspada: N = N₀ · (1/2)ⁿ", "en": "Write the decay law: N = N₀ · (1/2)ⁿ", "de": "Zerfallsgesetz aufschreiben: N = N₀ · (1/2)ⁿ", "fr": "Écris la loi de désintégration : N = N₀ · (1/2)ⁿ", "es": "Escribe la ley de desintegración: N = N₀ · (1/2)ⁿ", "it": "Scrivi la legge del decadimento: N = N₀ · (1/2)ⁿ", "ru": "Запиши закон распада: N = N₀ · (1/2)ⁿ", "pt": "Escreve a lei do decaimento: N = N₀ · (1/2)ⁿ"}, {"sr": "Izračunaj: N = 4·10²⁰ · (1/2)³ = 4·10²⁰ · 1/8 = 5·10¹⁹", "en": "Calculate: N = 4·10²⁰ · (1/2)³ = 4·10²⁰ · 1/8 = 5·10¹⁹", "de": "Berechnen: N = 4·10²⁰ · (1/2)³ = 4·10²⁰ · 1/8 = 5·10¹⁹", "fr": "Calcule : N = 4·10²⁰ · (1/2)³ = 4·10²⁰ · 1/8 = 5·10¹⁹", "es": "Calcula: N = 4·10²⁰ · (1/2)³ = 4·10²⁰ · 1/8 = 5·10¹⁹", "it": "Calcola: N = 4·10²⁰ · (1/2)³ = 4·10²⁰ · 1/8 = 5·10¹⁹", "ru": "Вычисли: N = 4·10²⁰ · (1/2)³ = 4·10²⁰ · 1/8 = 5·10¹⁹", "pt": "Calcula: N = 4·10²⁰ · (1/2)³ = 4·10²⁰ · 1/8 = 5·10¹⁹"}, {"sr": "Zaključak: posle 24 dana ostane neraspadnuto 5·10¹⁹ jezgara.", "en": "Conclusion: after 24 days, 5·10¹⁹ nuclei remain undecayed.", "de": "Schlussfolgerung: Nach 24 Tagen sind noch 5·10¹⁹ Kerne nicht zerfallen.", "fr": "Conclusion : après 24 jours, il reste 5·10¹⁹ noyaux non désintégrés.", "es": "Conclusión: después de 24 días quedan sin desintegrar 5·10¹⁹ núcleos.", "it": "Conclusione: dopo 24 giorni restano non decaduti 5·10¹⁹ nuclei.", "ru": "Вывод: через 24 дня останется нераспавшимися 5·10¹⁹ ядер.", "pt": "Conclusão: após 24 dias permanecem por desintegrar 5·10¹⁹ núcleos."}]}}, {"name": {"sr": "Relativnost", "en": "Relativity", "de": "Relativitätstheorie", "fr": "Relativité", "es": "Relatividad", "it": "Relatività", "ru": "Теория относительности", "pt": "Relatividade"}, "theory": {"sr": "<b>Ajnštajnova teorija relativnosti.</b> Specijalna teorija relativnosti zasniva se na dva postulata: zakoni fizike su isti u svim inercijalnim referentnim sistemima, a brzina svetlosti u vakuumu ista je za sve posmatrače i iznosi c ≈ 3·10⁸ m/s. Posledice su dilatacija vremena (vreme sporije protiče u sistemu koji se kreće u odnosu na posmatrača) i kontrakcija dužine (dužina tela se skraćuje u pravcu kretanja). Masa i energija su ekvivalentne prema relaciji E = m·c², što objašnjava ogromnu energiju oslobođenu u nuklearnim reakcijama.", "en": "<b>Einstein's theory of relativity.</b> Special relativity is based on two postulates: the laws of physics are the same in all inertial reference frames, and the speed of light in vacuum is the same for all observers, c ≈ 3·10⁸ m/s. Its consequences are time dilation (time runs slower in a system moving relative to an observer) and length contraction (the length of a body shortens in the direction of motion). Mass and energy are equivalent according to E = m·c², which explains the enormous energy released in nuclear reactions.", "de": "<b>Einsteins Relativitätstheorie.</b> Die spezielle Relativitätstheorie beruht auf zwei Postulaten: Die Naturgesetze sind in allen Inertialsystemen gleich, und die Lichtgeschwindigkeit im Vakuum ist für alle Beobachter gleich, c ≈ 3·10⁸ m/s. Folgen sind die Zeitdilatation (die Zeit vergeht langsamer in einem System, das sich relativ zum Beobachter bewegt) und die Längenkontraktion (die Länge eines Körpers verkürzt sich in Bewegungsrichtung). Masse und Energie sind gemäß E = m·c² äquivalent, was die enorme Energie erklärt, die bei Kernreaktionen freigesetzt wird.", "fr": "<b>La théorie de la relativité d'Einstein.</b> La relativité restreinte repose sur deux postulats : les lois de la physique sont les mêmes dans tous les référentiels inertiels, et la vitesse de la lumière dans le vide est la même pour tous les observateurs, c ≈ 3·10⁸ m/s. Les conséquences en sont la dilatation du temps (le temps s'écoule plus lentement dans un système en mouvement par rapport à l'observateur) et la contraction des longueurs (la longueur d'un corps se raccourcit dans la direction du mouvement). La masse et l'énergie sont équivalentes selon la relation E = m·c², ce qui explique l'énorme énergie libérée lors des réactions nucléaires.", "es": "<b>La teoría de la relatividad de Einstein.</b> La relatividad especial se basa en dos postulados: las leyes de la física son las mismas en todos los sistemas de referencia inerciales, y la velocidad de la luz en el vacío es la misma para todos los observadores, c ≈ 3·10⁸ m/s. Sus consecuencias son la dilatación del tiempo (el tiempo transcurre más lento en un sistema que se mueve respecto al observador) y la contracción de la longitud (la longitud de un cuerpo se acorta en la dirección del movimiento). La masa y la energía son equivalentes según la relación E = m·c², lo que explica la enorme energía liberada en las reacciones nucleares.", "it": "<b>La teoria della relatività di Einstein.</b> La relatività ristretta si basa su due postulati: le leggi della fisica sono le stesse in tutti i sistemi di riferimento inerziali, e la velocità della luce nel vuoto è la stessa per tutti gli osservatori, c ≈ 3·10⁸ m/s. Le conseguenze sono la dilatazione del tempo (il tempo scorre più lentamente in un sistema in moto rispetto all'osservatore) e la contrazione delle lunghezze (la lunghezza di un corpo si accorcia nella direzione del moto). Massa ed energia sono equivalenti secondo la relazione E = m·c², il che spiega l'enorme energia liberata nelle reazioni nucleari.", "ru": "<b>Теория относительности Эйнштейна.</b> Специальная теория относительности основана на двух постулатах: законы физики одинаковы во всех инерциальных системах отсчёта, а скорость света в вакууме одинакова для всех наблюдателей и равна c ≈ 3·10⁸ м/с. Следствиями являются замедление времени (время течёт медленнее в системе, движущейся относительно наблюдателя) и сокращение длины (длина тела уменьшается в направлении движения). Масса и энергия эквивалентны согласно соотношению E = m·c², что объясняет огромную энергию, выделяющуюся в ядерных реакциях.", "pt": "<b>A teoria da relatividade de Einstein.</b> A relatividade restrita baseia-se em dois postulados: as leis da física são as mesmas em todos os referenciais inerciais, e a velocidade da luz no vácuo é a mesma para todos os observadores, c ≈ 3·10⁸ m/s. As consequências são a dilatação do tempo (o tempo decorre mais lentamente num sistema em movimento em relação ao observador) e a contração do comprimento (o comprimento de um corpo encurta na direção do movimento). A massa e a energia são equivalentes segundo a relação E = m·c², o que explica a enorme energia libertada nas reações nucleares."}, "formulas": [{"sr": "Ekvivalencija mase i energije: E = m·c²", "en": "Mass–energy equivalence: E = m·c²", "de": "Masse-Energie-Äquivalenz: E = m·c²", "fr": "Équivalence masse-énergie : E = m·c²", "es": "Equivalencia masa-energía: E = m·c²", "it": "Equivalenza massa-energia: E = m·c²", "ru": "Эквивалентность массы и энергии: E = m·c²", "pt": "Equivalência massa-energia: E = m·c²"}, {"sr": "Dilatacija vremena: Δt = Δt₀ / √(1 − v²/c²)", "en": "Time dilation: Δt = Δt₀ / √(1 − v²/c²)", "de": "Zeitdilatation: Δt = Δt₀ / √(1 − v²/c²)", "fr": "Dilatation du temps : Δt = Δt₀ / √(1 − v²/c²)", "es": "Dilatación del tiempo: Δt = Δt₀ / √(1 − v²/c²)", "it": "Dilatazione del tempo: Δt = Δt₀ / √(1 − v²/c²)", "ru": "Замедление времени: Δt = Δt₀ / √(1 − v²/c²)", "pt": "Dilatação do tempo: Δt = Δt₀ / √(1 − v²/c²)"}], "remember": {"sr": "Brzina svetlosti c je granična brzina u prirodi – telo sa masom nikada je ne može dostići.", "en": "The speed of light c is the ultimate speed limit in nature – a body with mass can never reach it.", "de": "Die Lichtgeschwindigkeit c ist die höchste Geschwindigkeit in der Natur – ein Körper mit Masse kann sie niemals erreichen.", "fr": "La vitesse de la lumière c est la vitesse limite dans la nature – un corps possédant une masse ne peut jamais l'atteindre.", "es": "La velocidad de la luz c es la velocidad límite en la naturaleza – un cuerpo con masa nunca puede alcanzarla.", "it": "La velocità della luce c è la velocità limite in natura – un corpo dotato di massa non può mai raggiungerla.", "ru": "Скорость света c — предельная скорость в природе, тело с массой никогда не может её достичь.", "pt": "A velocidade da luz c é a velocidade limite na natureza – um corpo com massa nunca a pode atingir."}, "problem": {"statement": {"sr": "Svemirski brod kreće se brzinom v = 0,6·c u odnosu na Zemlju. Astronaut na brodu izmeri da je put trajao Δt₀ = 10 godina po njegovom časovniku. Koliko vremena je proteklo na Zemlji?", "en": "A spaceship moves at v = 0.6·c relative to Earth. An astronaut on board measures the trip to last Δt₀ = 10 years on their own clock. How much time has passed on Earth?", "de": "Ein Raumschiff bewegt sich mit v = 0,6·c relativ zur Erde. Ein Astronaut an Bord misst, dass die Reise nach seiner eigenen Uhr Δt₀ = 10 Jahre gedauert hat. Wie viel Zeit ist auf der Erde vergangen?", "fr": "Un vaisseau spatial se déplace à v = 0,6·c par rapport à la Terre. Un astronaute à bord mesure que le voyage a duré Δt₀ = 10 ans sur son horloge. Combien de temps s'est écoulé sur Terre ?", "es": "Una nave espacial se mueve a v = 0,6·c respecto a la Tierra. Un astronauta a bordo mide que el viaje duró Δt₀ = 10 años según su propio reloj. ¿Cuánto tiempo ha transcurrido en la Tierra?", "it": "Un'astronave si muove a v = 0,6·c rispetto alla Terra. Un astronauta a bordo misura che il viaggio è durato Δt₀ = 10 anni secondo il proprio orologio. Quanto tempo è trascorso sulla Terra?", "ru": "Космический корабль движется со скоростью v = 0,6·c относительно Земли. Астронавт на борту измеряет, что полёт по его часам длился Δt₀ = 10 лет. Сколько времени прошло на Земле?", "pt": "Uma nave espacial move-se a v = 0,6·c em relação à Terra. Um astronauta a bordo mede que a viagem durou Δt₀ = 10 anos no seu próprio relógio. Quanto tempo passou na Terra?"}, "steps": [{"sr": "Izračunaj odnos v²/c²: v²/c² = 0,6² = 0,36", "en": "Calculate the ratio v²/c²: v²/c² = 0.6² = 0.36", "de": "Verhältnis v²/c² berechnen: v²/c² = 0,6² = 0,36", "fr": "Calcule le rapport v²/c² : v²/c² = 0,6² = 0,36", "es": "Calcula la razón v²/c²: v²/c² = 0,6² = 0,36", "it": "Calcola il rapporto v²/c²: v²/c² = 0,6² = 0,36", "ru": "Вычисли отношение v²/c²: v²/c² = 0,6² = 0,36", "pt": "Calcula a razão v²/c²: v²/c² = 0,6² = 0,36"}, {"sr": "Izračunaj koren: √(1 − 0,36) = √0,64 = 0,8", "en": "Calculate the square root: √(1 − 0.36) = √0.64 = 0.8", "de": "Wurzel berechnen: √(1 − 0,36) = √0,64 = 0,8", "fr": "Calcule la racine carrée : √(1 − 0,36) = √0,64 = 0,8", "es": "Calcula la raíz cuadrada: √(1 − 0,36) = √0,64 = 0,8", "it": "Calcola la radice quadrata: √(1 − 0,36) = √0,64 = 0,8", "ru": "Вычисли корень: √(1 − 0,36) = √0,64 = 0,8", "pt": "Calcula a raiz quadrada: √(1 − 0,36) = √0,64 = 0,8"}, {"sr": "Primeni formulu dilatacije vremena: Δt = Δt₀ / 0,8 = 10 / 0,8 = 12,5", "en": "Apply the time-dilation formula: Δt = Δt₀ / 0.8 = 10 / 0.8 = 12.5", "de": "Formel der Zeitdilatation anwenden: Δt = Δt₀ / 0,8 = 10 / 0,8 = 12,5", "fr": "Applique la formule de dilatation du temps : Δt = Δt₀ / 0,8 = 10 / 0,8 = 12,5", "es": "Aplica la fórmula de dilatación del tiempo: Δt = Δt₀ / 0,8 = 10 / 0,8 = 12,5", "it": "Applica la formula della dilatazione del tempo: Δt = Δt₀ / 0,8 = 10 / 0,8 = 12,5", "ru": "Примени формулу замедления времени: Δt = Δt₀ / 0,8 = 10 / 0,8 = 12,5", "pt": "Aplica a fórmula da dilatação do tempo: Δt = Δt₀ / 0,8 = 10 / 0,8 = 12,5"}, {"sr": "Zaključak: na Zemlji je proteklo 12,5 godina.", "en": "Conclusion: 12.5 years have passed on Earth.", "de": "Schlussfolgerung: Auf der Erde sind 12,5 Jahre vergangen.", "fr": "Conclusion : 12,5 années se sont écoulées sur Terre.", "es": "Conclusión: en la Tierra han transcurrido 12,5 años.", "it": "Conclusione: sulla Terra sono trascorsi 12,5 anni.", "ru": "Вывод: на Земле прошло 12,5 лет.", "pt": "Conclusão: na Terra passaram-se 12,5 anos."}]}}, {"name": {"sr": "Maturski zadaci", "en": "Matura Problems", "de": "Abituraufgaben", "fr": "Exercices du baccalauréat", "es": "Problemas de selectividad", "it": "Problemi di maturità", "ru": "Задачи выпускного экзамена", "pt": "Problemas do exame final"}, "theory": {"sr": "<b>Priprema za maturu.</b> Maturski zadaci iz fizike za 4. razred objedinjuju gradivo talasne optike, kvantne fizike, fizike atoma i jezgra i teorije relativnosti. Na ispitu se najčešće traži prepoznavanje odgovarajuće formule, pažljivo sređivanje jedinica (posebno prelazak eV u J i nm u m) i logičan redosled koraka rešavanja. Korisno je zapamtiti vrednosti osnovnih konstanti: c ≈ 3·10⁸ m/s, h = 6,63·10⁻³⁴ J·s i elementarno naelektrisanje e = 1,6·10⁻¹⁹ C.", "en": "<b>Preparing for the matura.</b> Matura physics problems for Grade 4 combine material from wave optics, quantum physics, atomic and nuclear physics, and the theory of relativity. Exams usually require recognizing the right formula, carefully converting units (especially eV to J and nm to m), and following a logical sequence of solving steps. It is useful to memorize the basic constants: c ≈ 3·10⁸ m/s, h = 6.63·10⁻³⁴ J·s and the elementary charge e = 1.6·10⁻¹⁹ C.", "de": "<b>Vorbereitung auf das Abitur.</b> Abituraufgaben in Physik für die 4. Klasse verbinden Stoff aus Wellenoptik, Quantenphysik, Atom- und Kernphysik sowie Relativitätstheorie. In der Prüfung wird meist verlangt, die passende Formel zu erkennen, Einheiten sorgfältig umzurechnen (besonders eV in J und nm in m) und die Lösungsschritte in logischer Reihenfolge durchzuführen. Es lohnt sich, die grundlegenden Konstanten auswendig zu wissen: c ≈ 3·10⁸ m/s, h = 6,63·10⁻³⁴ J·s und die Elementarladung e = 1,6·10⁻¹⁹ C.", "fr": "<b>Préparation au baccalauréat.</b> Les exercices de physique du baccalauréat pour la 4e année combinent le contenu de l'optique ondulatoire, de la physique quantique, de la physique de l'atome et du noyau, et de la théorie de la relativité. L'examen demande le plus souvent de reconnaître la formule adaptée, de convertir soigneusement les unités (en particulier eV en J et nm en m), et de suivre un ordre logique des étapes de résolution. Il est utile de mémoriser les constantes de base : c ≈ 3·10⁸ m/s, h = 6,63·10⁻³⁴ J·s et la charge élémentaire e = 1,6·10⁻¹⁹ C.", "es": "<b>Preparación para la selectividad.</b> Los problemas de física de selectividad de 4º curso combinan contenidos de óptica ondulatoria, física cuántica, física del átomo y del núcleo, y teoría de la relatividad. El examen suele exigir reconocer la fórmula adecuada, convertir cuidadosamente las unidades (especialmente eV a J y nm a m) y seguir un orden lógico de los pasos de resolución. Es útil memorizar las constantes básicas: c ≈ 3·10⁸ m/s, h = 6,63·10⁻³⁴ J·s y la carga elemental e = 1,6·10⁻¹⁹ C.", "it": "<b>Preparazione alla maturità.</b> I problemi di fisica di maturità per il 4° anno combinano il contenuto di ottica ondulatoria, fisica quantistica, fisica dell'atomo e del nucleo e teoria della relatività. L'esame richiede solitamente di riconoscere la formula giusta, convertire con cura le unità di misura (in particolare eV in J e nm in m) e seguire un ordine logico dei passaggi risolutivi. È utile memorizzare le costanti fondamentali: c ≈ 3·10⁸ m/s, h = 6,63·10⁻³⁴ J·s e la carica elementare e = 1,6·10⁻¹⁹ C.", "ru": "<b>Подготовка к выпускному экзамену.</b> Задачи по физике для выпускного экзамена в 4 классе объединяют материал волновой оптики, квантовой физики, физики атома и ядра и теории относительности. На экзамене обычно требуется распознать нужную формулу, аккуратно перевести единицы измерения (особенно эВ в Дж и нм в м) и соблюдать логичный порядок шагов решения. Полезно запомнить значения основных констант: c ≈ 3·10⁸ м/с, h = 6,63·10⁻³⁴ Дж·с и элементарный заряд e = 1,6·10⁻¹⁹ Кл.", "pt": "<b>Preparação para o exame final.</b> Os problemas de física do exame final do 4º ano combinam conteúdos de óptica ondulatória, física quântica, física do átomo e do núcleo, e teoria da relatividade. O exame normalmente exige o reconhecimento da fórmula adequada, a conversão cuidadosa das unidades (especialmente eV para J e nm para m) e uma sequência lógica dos passos de resolução. É útil memorizar as constantes fundamentais: c ≈ 3·10⁸ m/s, h = 6,63·10⁻³⁴ J·s e a carga elementar e = 1,6·10⁻¹⁹ C."}, "formulas": [{"sr": "Fotoefekat: h·f = A + Ek", "en": "Photoelectric effect: h·f = A + Ek", "de": "Photoelektrischer Effekt: h·f = A + Ek", "fr": "Effet photoélectrique : h·f = A + Ek", "es": "Efecto fotoeléctrico: h·f = A + Ek", "it": "Effetto fotoelettrico: h·f = A + Ek", "ru": "Фотоэффект: h·f = A + Ek", "pt": "Efeito fotoelétrico: h·f = A + Ek"}, {"sr": "Radioaktivni raspad: N = N₀ · (1/2)^(t/T)", "en": "Radioactive decay: N = N₀ · (1/2)^(t/T)", "de": "Radioaktiver Zerfall: N = N₀ · (1/2)^(t/T)", "fr": "Désintégration radioactive : N = N₀ · (1/2)^(t/T)", "es": "Desintegración radiactiva: N = N₀ · (1/2)^(t/T)", "it": "Decadimento radioattivo: N = N₀ · (1/2)^(t/T)", "ru": "Радиоактивный распад: N = N₀ · (1/2)^(t/T)", "pt": "Decaimento radioativo: N = N₀ · (1/2)^(t/T)"}], "remember": {"sr": "Uvek prvo zapiši šta je dato i šta se traži, pa tek onda biraj formulu – to smanjuje grešku na ispitu.", "en": "Always write down what is given and what is asked for first, then choose the formula – this reduces mistakes on the exam.", "de": "Schreibe immer zuerst auf, was gegeben ist und was gesucht wird, und wähle dann die Formel – das verringert Fehler in der Prüfung.", "fr": "Écris toujours d'abord ce qui est donné et ce qui est demandé, puis choisis la formule – cela réduit les erreurs à l'examen.", "es": "Escribe siempre primero lo que se da y lo que se pide, y luego elige la fórmula – esto reduce los errores en el examen.", "it": "Scrivi sempre prima ciò che è dato e ciò che è richiesto, poi scegli la formula – questo riduce gli errori all'esame.", "ru": "Всегда сначала записывай, что дано и что требуется найти, а затем выбирай формулу – это уменьшает ошибки на экзамене.", "pt": "Escreve sempre primeiro o que é dado e o que é pedido, e só depois escolhe a fórmula – isto reduz os erros no exame."}, "problem": {"statement": {"sr": "Fotokatoda se osvetljava monohromatskom svetlošću talasne dužine λ = 300 nm. Izlazni rad metala je A = 3,1·10⁻¹⁹ J. Odredi maksimalnu kinetičku energiju fotoelektrona.", "en": "A photocathode is illuminated with monochromatic light of wavelength λ = 300 nm. The work function of the metal is A = 3.1·10⁻¹⁹ J. Find the maximum kinetic energy of the photoelectrons.", "de": "Eine Photokathode wird mit monochromatischem Licht der Wellenlänge λ = 300 nm bestrahlt. Die Austrittsarbeit des Metalls beträgt A = 3,1·10⁻¹⁹ J. Bestimme die maximale kinetische Energie der Photoelektronen.", "fr": "Une photocathode est éclairée par une lumière monochromatique de longueur d'onde λ = 300 nm. Le travail de sortie du métal est A = 3,1·10⁻¹⁹ J. Détermine l'énergie cinétique maximale des photoélectrons.", "es": "Un fotocátodo se ilumina con luz monocromática de longitud de onda λ = 300 nm. El trabajo de extracción del metal es A = 3,1·10⁻¹⁹ J. Determina la energía cinética máxima de los fotoelectrones.", "it": "Un fotocatodo viene illuminato con luce monocromatica di lunghezza d'onda λ = 300 nm. Il lavoro di estrazione del metallo è A = 3,1·10⁻¹⁹ J. Determina l'energia cinetica massima dei fotoelettroni.", "ru": "Фотокатод освещают монохроматическим светом длиной волны λ = 300 нм. Работа выхода металла A = 3,1·10⁻¹⁹ Дж. Определи максимальную кинетическую энергию фотоэлектронов.", "pt": "Um fotocátodo é iluminado com luz monocromática de comprimento de onda λ = 300 nm. O trabalho de extração do metal é A = 3,1·10⁻¹⁹ J. Determina a energia cinética máxima dos fotoeletrões."}, "steps": [{"sr": "Izračunaj frekvenciju svetlosti: f = c / λ = 3·10⁸ / 3·10⁻⁷ = 1·10¹⁵ Hz", "en": "Calculate the frequency of the light: f = c / λ = 3·10⁸ / 3·10⁻⁷ = 1·10¹⁵ Hz", "de": "Frequenz des Lichts berechnen: f = c / λ = 3·10⁸ / 3·10⁻⁷ = 1·10¹⁵ Hz", "fr": "Calcule la fréquence de la lumière : f = c / λ = 3·10⁸ / 3·10⁻⁷ = 1·10¹⁵ Hz", "es": "Calcula la frecuencia de la luz: f = c / λ = 3·10⁸ / 3·10⁻⁷ = 1·10¹⁵ Hz", "it": "Calcola la frequenza della luce: f = c / λ = 3·10⁸ / 3·10⁻⁷ = 1·10¹⁵ Hz", "ru": "Вычисли частоту света: f = c / λ = 3·10⁸ / 3·10⁻⁷ = 1·10¹⁵ Гц", "pt": "Calcula a frequência da luz: f = c / λ = 3·10⁸ / 3·10⁻⁷ = 1·10¹⁵ Hz"}, {"sr": "Izračunaj energiju fotona: E = h·f = 6,63·10⁻³⁴ · 10¹⁵ = 6,63·10⁻¹⁹ J", "en": "Calculate the photon energy: E = h·f = 6.63·10⁻³⁴ · 10¹⁵ = 6.63·10⁻¹⁹ J", "de": "Photonenenergie berechnen: E = h·f = 6,63·10⁻³⁴ · 10¹⁵ = 6,63·10⁻¹⁹ J", "fr": "Calcule l'énergie du photon : E = h·f = 6,63·10⁻³⁴ · 10¹⁵ = 6,63·10⁻¹⁹ J", "es": "Calcula la energía del fotón: E = h·f = 6,63·10⁻³⁴ · 10¹⁵ = 6,63·10⁻¹⁹ J", "it": "Calcola l'energia del fotone: E = h·f = 6,63·10⁻³⁴ · 10¹⁵ = 6,63·10⁻¹⁹ J", "ru": "Вычисли энергию фотона: E = h·f = 6,63·10⁻³⁴ · 10¹⁵ = 6,63·10⁻¹⁹ Дж", "pt": "Calcula a energia do fotão: E = h·f = 6,63·10⁻³⁴ · 10¹⁵ = 6,63·10⁻¹⁹ J"}, {"sr": "Primeni Ajnštajnovu jednačinu fotoefekta: Ek = E − A = 6,63·10⁻¹⁹ − 3,1·10⁻¹⁹ = 3,53·10⁻¹⁹ J", "en": "Apply Einstein's photoelectric equation: Ek = E − A = 6.63·10⁻¹⁹ − 3.1·10⁻¹⁹ = 3.53·10⁻¹⁹ J", "de": "Einsteinsche Gleichung des photoelektrischen Effekts anwenden: Ek = E − A = 6,63·10⁻¹⁹ − 3,1·10⁻¹⁹ = 3,53·10⁻¹⁹ J", "fr": "Applique l'équation d'Einstein de l'effet photoélectrique : Ek = E − A = 6,63·10⁻¹⁹ − 3,1·10⁻¹⁹ = 3,53·10⁻¹⁹ J", "es": "Aplica la ecuación de Einstein del efecto fotoeléctrico: Ek = E − A = 6,63·10⁻¹⁹ − 3,1·10⁻¹⁹ = 3,53·10⁻¹⁹ J", "it": "Applica l'equazione di Einstein dell'effetto fotoelettrico: Ek = E − A = 6,63·10⁻¹⁹ − 3,1·10⁻¹⁹ = 3,53·10⁻¹⁹ J", "ru": "Примени уравнение Эйнштейна для фотоэффекта: Ek = E − A = 6,63·10⁻¹⁹ − 3,1·10⁻¹⁹ = 3,53·10⁻¹⁹ Дж", "pt": "Aplica a equação de Einstein do efeito fotoelétrico: Ek = E − A = 6,63·10⁻¹⁹ − 3,1·10⁻¹⁹ = 3,53·10⁻¹⁹ J"}, {"sr": "Zaključak: maksimalna kinetička energija fotoelektrona je 3,53·10⁻¹⁹ J.", "en": "Conclusion: the maximum kinetic energy of the photoelectrons is 3.53·10⁻¹⁹ J.", "de": "Schlussfolgerung: Die maximale kinetische Energie der Photoelektronen beträgt 3,53·10⁻¹⁹ J.", "fr": "Conclusion : l'énergie cinétique maximale des photoélectrons est 3,53·10⁻¹⁹ J.", "es": "Conclusión: la energía cinética máxima de los fotoelectrones es 3,53·10⁻¹⁹ J.", "it": "Conclusione: l'energia cinetica massima dei fotoelettroni è 3,53·10⁻¹⁹ J.", "ru": "Вывод: максимальная кинетическая энергия фотоэлектронов составляет 3,53·10⁻¹⁹ Дж.", "pt": "Conclusão: a energia cinética máxima dos fotoeletrões é 3,53·10⁻¹⁹ J."}]}}, {"name": {"sr": "Sistematizacija", "en": "Systematization", "de": "Zusammenfassung", "fr": "Synthèse", "es": "Sistematización", "it": "Sistematizzazione", "ru": "Систематизация", "pt": "Sistematização"}, "theory": {"sr": "<b>Pregled celog gradiva.</b> Sistematizacija povezuje sve celine 4. razreda u jedinstvenu sliku. Talasna optika opisuje svetlost kao talas (interferencija, difrakcija, polarizacija). Kvantna fizika pokazuje da svetlost ima i osobine čestica (foton, fotoefekat). Fizika atoma i jezgra objašnjava građu materije i radioaktivnost. Teorija relativnosti menja klasične predstave o prostoru, vremenu i masi pri velikim brzinama. Sve celine povezuje ideja da su energija i materija kvantovane i međusobno ekvivalentne.", "en": "<b>Overview of the whole syllabus.</b> Systematization links all the units of Grade 4 into a single picture. Wave optics describes light as a wave (interference, diffraction, polarization). Quantum physics shows that light also has particle properties (photon, photoelectric effect). Atomic and nuclear physics explains the structure of matter and radioactivity. The theory of relativity changes the classical picture of space, time and mass at high speeds. All the units are connected by the idea that energy and matter are quantized and mutually equivalent.", "de": "<b>Überblick über den gesamten Stoff.</b> Die Zusammenfassung verbindet alle Einheiten der 4. Klasse zu einem einheitlichen Bild. Die Wellenoptik beschreibt Licht als Welle (Interferenz, Beugung, Polarisation). Die Quantenphysik zeigt, dass Licht auch Teilcheneigenschaften besitzt (Photon, photoelektrischer Effekt). Die Atom- und Kernphysik erklärt den Aufbau der Materie und die Radioaktivität. Die Relativitätstheorie verändert die klassischen Vorstellungen von Raum, Zeit und Masse bei hohen Geschwindigkeiten. Alle Einheiten verbindet die Idee, dass Energie und Materie quantisiert und zueinander äquivalent sind.", "fr": "<b>Vue d'ensemble de tout le programme.</b> La synthèse relie toutes les unités de la 4e année en une image unique. L'optique ondulatoire décrit la lumière comme une onde (interférence, diffraction, polarisation). La physique quantique montre que la lumière possède aussi des propriétés corpusculaires (photon, effet photoélectrique). La physique de l'atome et du noyau explique la structure de la matière et la radioactivité. La théorie de la relativité modifie les représentations classiques de l'espace, du temps et de la masse à grande vitesse. Toutes les unités sont reliées par l'idée que l'énergie et la matière sont quantifiées et mutuellement équivalentes.", "es": "<b>Repaso de todo el programa.</b> La sistematización conecta todas las unidades de 4º curso en una sola imagen. La óptica ondulatoria describe la luz como onda (interferencia, difracción, polarización). La física cuántica muestra que la luz también tiene propiedades de partícula (fotón, efecto fotoeléctrico). La física del átomo y del núcleo explica la estructura de la materia y la radiactividad. La teoría de la relatividad cambia las ideas clásicas sobre el espacio, el tiempo y la masa a grandes velocidades. Todas las unidades están conectadas por la idea de que la energía y la materia están cuantizadas y son mutuamente equivalentes.", "it": "<b>Panoramica di tutto il programma.</b> La sistematizzazione collega tutte le unità del 4° anno in un unico quadro. L'ottica ondulatoria descrive la luce come onda (interferenza, diffrazione, polarizzazione). La fisica quantistica mostra che la luce possiede anche proprietà corpuscolari (fotone, effetto fotoelettrico). La fisica dell'atomo e del nucleo spiega la struttura della materia e la radioattività. La teoria della relatività modifica le rappresentazioni classiche di spazio, tempo e massa alle alte velocità. Tutte le unità sono collegate dall'idea che energia e materia sono quantizzate e reciprocamente equivalenti.", "ru": "<b>Обзор всей программы.</b> Систематизация объединяет все темы 4 класса в единую картину. Волновая оптика описывает свет как волну (интерференция, дифракция, поляризация). Квантовая физика показывает, что свет обладает и корпускулярными свойствами (фотон, фотоэффект). Физика атома и ядра объясняет строение вещества и радиоактивность. Теория относительности изменяет классические представления о пространстве, времени и массе при больших скоростях. Все темы связывает идея о том, что энергия и материя квантованы и эквивалентны друг другу.", "pt": "<b>Panorama de todo o programa.</b> A sistematização liga todas as unidades do 4º ano numa imagem única. A óptica ondulatória descreve a luz como onda (interferência, difração, polarização). A física quântica mostra que a luz também tem propriedades corpusculares (fotão, efeito fotoelétrico). A física do átomo e do núcleo explica a estrutura da matéria e a radioatividade. A teoria da relatividade altera as noções clássicas de espaço, tempo e massa a grandes velocidades. Todas as unidades estão ligadas pela ideia de que a energia e a matéria são quantizadas e mutuamente equivalentes."}, "formulas": [{"sr": "Energija fotona: E = h·f", "en": "Photon energy: E = h·f", "de": "Photonenenergie: E = h·f", "fr": "Énergie du photon : E = h·f", "es": "Energía del fotón: E = h·f", "it": "Energia del fotone: E = h·f", "ru": "Энергия фотона: E = h·f", "pt": "Energia do fotão: E = h·f"}, {"sr": "Ekvivalencija mase i energije: E = m·c²", "en": "Mass–energy equivalence: E = m·c²", "de": "Masse-Energie-Äquivalenz: E = m·c²", "fr": "Équivalence masse-énergie : E = m·c²", "es": "Equivalencia masa-energía: E = m·c²", "it": "Equivalenza massa-energia: E = m·c²", "ru": "Эквивалентность массы и энергии: E = m·c²", "pt": "Equivalência massa-energia: E = m·c²"}], "remember": {"sr": "Fizika 4. razreda povezuje mikrosvet (kvanti, atomi, jezgra) sa makrosvetom velikih brzina (relativnost).", "en": "Grade 4 physics connects the microscopic world (quanta, atoms, nuclei) with the macroscopic world of high speeds (relativity).", "de": "Die Physik der 4. Klasse verbindet die Mikrowelt (Quanten, Atome, Kerne) mit der Makrowelt hoher Geschwindigkeiten (Relativitätstheorie).", "fr": "La physique de 4e année relie le monde microscopique (quanta, atomes, noyaux) au monde macroscopique des grandes vitesses (relativité).", "es": "La física de 4º curso conecta el microcosmos (cuantos, átomos, núcleos) con el macrocosmos d : "Write the mass–energy relation: m = E / c²", "de": "Masse-Energie-Beziehung aufschreiben: m = E / c²", "fr": "Écris la relation masse-énergie : m = E / c²", "es": "Escribe la relación masa-energía: m = E / c²", "it": "Scrivi la relazione massa-energia: m = E / c²", "ru": "Запиши соотношение массы и энергии: m = E / c²", "pt": "Escreve a relação massa-energia: m = E / c²"}, {"sr": "Izračunaj: m = 1,92·10⁻¹³ / (3·10⁸)² = 1,92·10⁻¹³ / 9·10¹⁶ ≈ 2,13·10⁻³⁰ kg", "en": "Calculate: m = 1.92·10⁻¹³ / (3·10⁸)² = 1.92·10⁻¹³ / 9·10¹⁶ ≈ 2.13·10⁻³⁰ kg", "de": "Berechnen: m = 1,92·10⁻¹³ / (3·10⁸)² = 1,92·10⁻¹³ / 9·10¹⁶ ≈ 2,13·10⁻³⁰ kg", "fr": "Calcule : m = 1,92·10⁻¹³ / (3·10⁸)² = 1,92·10⁻¹³ / 9·10¹⁶ ≈ 2,13·10⁻³⁰ kg", "es": "Calcula: m = 1,92·10⁻¹³ / (3·10⁸)² = 1,92·10⁻¹³ / 9·10¹⁶ ≈ 2,13·10⁻³⁰ kg", "it": "Calcola: m = 1,92·10⁻¹³ / (3·10⁸)² = 1,92·10⁻¹³ / 9·10¹⁶ ≈ 2,13·10⁻³⁰ kg", "ru": "Вычисли: m = 1,92·10⁻¹³ / (3·10⁸)² = 1,92·10⁻¹³ / 9·10¹⁶ ≈ 2,13·10⁻³⁰ кг", "pt": "Calcula: m = 1,92·10⁻¹³ / (3·10⁸)² = 1,92·10⁻¹³ / 9·10¹⁶ ≈ 2,13·10⁻³⁰ kg"}, {"sr": "Zaključak: ekvivalentna masa gama-fotona je približno 2,13·10⁻³⁰ kg.", "en": "Conclusion: the equivalent mass of the gamma photon is approximately 2.13·10⁻³⁰ kg.", "de": "Schlussfolgerung: Die äquivalente Masse des Gammaphotons beträgt etwa 2,13·10⁻³⁰ kg.", "fr": "Conclusion : la masse équivalente du photon gamma est d'environ 2,13·10⁻³⁰ kg.", "es": "Conclusión: la masa equivalente del fotón gamma es aproximadamente 2,13·10⁻³⁰ kg.", "it": "Conclusione: la massa equivalente del fotone gamma è di circa 2,13·10⁻³⁰ kg.", "ru": "Вывод: эквивалентная масса гамма-фотона составляет примерно 2,13·10⁻³⁰ кг.", "pt": "Conclusão: a massa equivalente do fotão gama é de aproximadamente 2,13·10⁻³⁰ kg."}]}}], "C": {"tap": {"sr": "Tapni 👆", "en": "Tap 👆", "de": "Tippen 👆", "fr": "Touche 👆", "es": "Toca 👆", "it": "Tocca 👆", "ru": "Нажми 👆", "pt": "Toca 👆"}, "hint": {"sr": "Tapni karticu da vidiš formule ✨", "en": "Tap a card to see the formulas ✨", "de"

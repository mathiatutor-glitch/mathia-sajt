<style>
:root{--cream:#FBF6EE;--ink:#5A1024;--ink2:#7A3346;--gold:#C6A05C;--goldlt:#F0DCA8;--malina:#B01E48;--malina2:#CC5E7E;--mint:#3FB98C;--muted:#8A7A80}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#43303A;min-height:100vh;
 background:radial-gradient(520px 400px at 104% -6%,#F6E1EC 0,transparent 56%),radial-gradient(500px 380px at -6% 106%,#F7ECD6 0,transparent 58%),var(--cream);overflow-x:hidden}
#fall{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fall span{position:absolute;top:-8%;font-family:'Spectral',serif;font-style:italic;color:rgba(198,160,92,.22);animation:fl linear infinite}
#fall span.m{color:rgba(176,30,72,.16)}
@keyframes fl{0%{transform:translateY(-10vh) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(112vh) rotate(24deg);opacity:0}}
.wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:14px 16px 30px}
.top{display:flex;align-items:center;gap:10px;padding:4px 2px 10px}
.top .back{color:var(--ink2);text-decoration:none;font-weight:800;font-size:1.1rem}
.top .lang{margin-left:auto;border:1px solid var(--goldlt);border-radius:100px;padding:5px 10px;font-family:inherit;font-weight:800;font-size:.72rem;color:var(--ink);background:#fff}
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:#E6D5CE;transition:.3s}
.dots i.on{background:linear-gradient(90deg,var(--gold),var(--malina));transform:scale(1.25)}
.dots i.done{background:var(--goldlt)}
.stage{position:relative;min-height:62vh}
.card{position:relative;background:linear-gradient(180deg,#FFFDF9,#FDF3EA);border:1px solid var(--goldlt);border-radius:32px;
 padding:26px 22px 22px;box-shadow:0 30px 70px -34px rgba(90,16,36,.5);animation:slidein .45s cubic-bezier(.2,.9,.2,1)}
@keyframes slidein{0%{transform:translateX(28px) scale(.97);opacity:0}100%{transform:translateX(0) scale(1);opacity:1}}
.eyebrow{text-align:center;font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:.64rem;color:var(--malina)}
.mascot{width:82px;height:82px;margin:8px auto 4px;border-radius:50%;display:grid;place-items:center;font-size:2.6rem;background:radial-gradient(circle at 40% 34%,#FFF3F7,#F6E1EC);border:2px solid var(--goldlt);box-shadow:0 14px 28px -12px rgba(176,30,72,.4);animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.tnum{text-align:center;color:var(--muted);font-weight:800;font-size:.78rem;margin-top:6px}
.ttl{font-family:'Spectral',serif;font-weight:700;color:var(--ink);font-size:1.75rem;text-align:center;line-height:1.2;margin:2px 0 8px}
.theory{color:#5a4750;font-size:1.02rem;text-align:center;line-height:1.55;margin:0 auto 14px;max-width:460px}
.theory b{color:var(--ink)}
.fx{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 4px}
.fx span{display:inline-block;background:#fff;border:1px dashed var(--goldlt);border-radius:14px;padding:9px 14px;font-family:'Spectral','Cambria Math',Georgia,serif;color:var(--ink);font-size:1.05rem;animation:pop .4s both}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.zap{margin:16px auto 2px;max-width:460px;background:linear-gradient(180deg,#FFF7FA,#FBEEF2);border:1px solid #F0D6DF;border-radius:18px;padding:13px 16px;display:flex;gap:10px;align-items:flex-start}
.zap .st{font-size:1.4rem;line-height:1}
.zap p{margin:0;color:var(--ink2);font-size:.95rem;font-weight:600}
.nav{display:flex;align-items:center;gap:12px;margin-top:16px}
.nav .prev{background:none;border:none;color:var(--ink2);font-weight:800;cursor:pointer;font-size:1rem;padding:8px}
.nav .next{flex:1;border:none;cursor:pointer;background:linear-gradient(135deg,var(--malina2),var(--malina));color:#fff;font-weight:900;font-size:1.05rem;padding:14px;border-radius:100px;box-shadow:0 16px 30px -14px rgba(176,30,72,.6);transition:transform .15s}
.nav .next:hover{transform:translateY(-2px)}
.fin{text-align:center}
.fin .big{font-size:3.4rem}
.fin h2{font-family:'Spectral',serif;color:var(--ink);font-size:1.9rem;margin:4px 0}
.fin p{color:var(--ink2)}
.fin .cta{display:block;margin-top:12px;text-decoration:none;text-align:center;background:linear-gradient(135deg,var(--malina2),var(--malina));color:#fff;font-weight:900;padding:14px;border-radius:100px;box-shadow:0 16px 30px -14px rgba(176,30,72,.6)}
.fin .cta2{display:block;margin-top:10px;text-decoration:none;color:var(--ink2);font-weight:800}
#conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#conf i{position:absolute;top:-6%;width:10px;height:14px;border-radius:2px;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(560deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
var D={"eyebrow": {"sr": "Fizika · 3. razred", "en": "Physics · Grade 3", "de": "Physik · 3. Klasse", "fr": "Physique · 3e année", "es": "Física · 3.º curso", "it": "Fisica · 3ª classe", "ru": "Физика · 3 класс", "pt": "Física · 3.º ano"}, "topics": [{"name": {"sr": "Oscilacije", "en": "Oscillations", "de": "Schwingungen", "fr": "Oscillations", "es": "Oscilaciones", "it": "Oscillazioni", "ru": "Колебания", "pt": "Oscilações"}, "theory": {"sr": "<b>Oscilacije</b> su periodična kretanja tela oko ravnotežnog položaja. Osnovne veličine su amplituda, period T i frekvencija f. Kod matematičkog klatna period zavisi od dužine klatna l i gravitacionog ubrzanja g, dok kod elastičnog oscilatora zavisi od mase i krutosti opruge. Energija oscilatora se periodično pretvara iz kinetičke u potencijalnu i obrnuto, dok ukupna mehanička energija ostaje konstantna ako nema prigušenja.", "en": "<b>Oscillations</b> are periodic motions of a body around an equilibrium position. The basic quantities are amplitude, period T and frequency f. For a simple pendulum the period depends on the pendulum's length l and the gravitational acceleration g, while for an elastic oscillator it depends on the mass and the stiffness of the spring. The oscillator's energy periodically converts from kinetic to potential and back, while the total mechanical energy stays constant if there is no damping.", "de": "<b>Schwingungen</b> sind periodische Bewegungen eines Körpers um eine Gleichgewichtslage. Die grundlegenden Größen sind Amplitude, Periode T und Frequenz f. Beim mathematischen Pendel hängt die Periode von der Pendellänge l und der Fallbeschleunigung g ab, während sie beim elastischen Oszillator von der Masse und der Federsteifigkeit abhängt. Die Energie des Oszillators wandelt sich periodisch von kinetischer in potenzielle Energie und umgekehrt um, während die gesamte mechanische Energie ohne Dämpfung konstant bleibt.", "fr": "<b>Les oscillations</b> sont des mouvements périodiques d'un corps autour d'une position d'équilibre. Les grandeurs de base sont l'amplitude, la période T et la fréquence f. Pour un pendule simple, la période dépend de la longueur l du pendule et de l'accélération de la pesanteur g, tandis que pour un oscillateur élastique elle dépend de la masse et de la raideur du ressort. L'énergie de l'oscillateur se transforme périodiquement d'énergie cinétique en énergie potentielle et inversement, tandis que l'énergie mécanique totale reste constante en l'absence d'amortissement.", "es": "<b>Las oscilaciones</b> son movimientos periódicos de un cuerpo alrededor de una posición de equilibrio. Las magnitudes básicas son la amplitud, el período T y la frecuencia f. En un péndulo simple, el período depende de la longitud l del péndulo y de la aceleración de la gravedad g, mientras que en un oscilador elástico depende de la masa y de la rigidez del resorte. La energía del oscilador se transforma periódicamente de cinética en potencial y viceversa, mientras que la energía mecánica total permanece constante si no hay amortiguamiento.", "it": "<b>Le oscillazioni</b> sono moti periodici di un corpo attorno a una posizione di equilibrio. Le grandezze fondamentali sono l'ampiezza, il periodo T e la frequenza f. Nel pendolo semplice il periodo dipende dalla lunghezza l del pendolo e dall'accelerazione di gravità g, mentre in un oscillatore elastico dipende dalla massa e dalla rigidità della molla. L'energia dell'oscillatore si trasforma periodicamente da cinetica a potenziale e viceversa, mentre l'energia meccanica totale resta costante in assenza di smorzamento.", "ru": "<b>Колебания</b> — это периодические движения тела вокруг положения равновесия. Основные величины — амплитуда, период T и частота f. У математического маятника период зависит от длины маятника l и ускорения свободного падения g, а у упругого осциллятора — от массы и жёсткости пружины. Энергия осциллятора периодически переходит из кинетической в потенциальную и обратно, при этом полная механическая энергия остаётся постоянной при отсутствии затухания.", "pt": "<b>As oscilações</b> são movimentos periódicos de um corpo em torno de uma posição de equilíbrio. As grandezas básicas são a amplitude, o período T e a frequência f. Num pêndulo simples, o período depende do comprimento l do pêndulo e da aceleração da gravidade g, enquanto num oscilador elástico depende da massa e da rigidez da mola. A energia do oscilador transforma-se periodicamente de cinética em potencial e vice-versa, permanecendo a energia mecânica total constante na ausência de amortecimento."}, "formulas": [{"sr": "T = 2π√(l/g) — period matematičkog klatna (l — dužina klatna, g — gravitaciono ubrzanje)", "en": "T = 2π√(l/g) — period of a simple pendulum (l — pendulum length, g — gravitational acceleration)", "de": "T = 2π√(l/g) — Periode des mathematischen Pendels (l — Pendellänge, g — Fallbeschleunigung)", "fr": "T = 2π√(l/g) — période du pendule simple (l — longueur du pendule, g — accélération de la pesanteur)", "es": "T = 2π√(l/g) — período del péndulo simple (l — longitud del péndulo, g — aceleración de la gravedad)", "it": "T = 2π√(l/g) — periodo del pendolo semplice (l — lunghezza del pendolo, g — accelerazione di gravità)", "ru": "T = 2π√(l/g) — период математического маятника (l — длина маятника, g — ускорение свободного падения)", "pt": "T = 2π√(l/g) — período do pêndulo simples (l — comprimento do pêndulo, g — aceleração da gravidade)"}, {"sr": "T = 1/f — period je recipročna vrednost frekvencije", "en": "T = 1/f — the period is the reciprocal of the frequency", "de": "T = 1/f — die Periode ist der Kehrwert der Frequenz", "fr": "T = 1/f — la période est l'inverse de la fréquence", "es": "T = 1/f — el período es el recíproco de la frecuencia", "it": "T = 1/f — il periodo è il reciproco della frequenza", "ru": "T = 1/f — период есть величина, обратная частоте", "pt": "T = 1/f — o período é o inverso da frequência"}], "remember": {"sr": "Period oscilovanja matematičkog klatna ne zavisi od amplitude ni od mase tega, već samo od dužine klatna i gravitacionog ubrzanja.", "en": "The period of a simple pendulum does not depend on the amplitude or the mass of the bob, only on the pendulum's length and the gravitational acceleration.", "de": "Die Periode des mathematischen Pendels hängt weder von der Amplitude noch von der Masse des Pendelkörpers ab, sondern nur von der Pendellänge und der Fallbeschleunigung.", "fr": "La période du pendule simple ne dépend ni de l'amplitude ni de la masse de la masselotte, mais seulement de la longueur du pendule et de l'accélération de la pesanteur.", "es": "El período del péndulo simple no depende de la amplitud ni de la masa de la lenteja, sino solo de la longitud del péndulo y de la aceleración de la gravedad.", "it": "Il periodo del pendolo semplice non dipende dall'ampiezza né dalla massa del corpo oscillante, ma solo dalla lunghezza del pendolo e dall'accelerazione di gravità.", "ru": "Период математического маятника не зависит от амплитуды и массы груза, а зависит только от длины маятника и ускорения свободного падения.", "pt": "O período do pêndulo simples não depende da amplitude nem da massa do corpo, mas apenas do comprimento do pêndulo e da aceleração da gravidade."}, "problem": {"statement": {"sr": "Matematičko klatno dužine l = 1 m osciluje u polju gravitacije g = 10 m/s². Izračunati period T i frekvenciju f oscilovanja klatna. (Uzeti π ≈ 3,14.)", "en": "A simple pendulum of length l = 1 m oscillates in a gravitational field with g = 10 m/s². Calculate the period T and the frequency f of the pendulum's oscillation. (Take π ≈ 3.14.)", "de": "Ein mathematisches Pendel der Länge l = 1 m schwingt in einem Gravitationsfeld mit g = 10 m/s². Berechne die Periode T und die Frequenz f der Pendelschwingung. (π ≈ 3,14.)", "fr": "Un pendule simple de longueur l = 1 m oscille dans un champ de gravité g = 10 m/s². Calculer la période T et la fréquence f de l'oscillation du pendule. (Prendre π ≈ 3,14.)", "es": "Un péndulo simple de longitud l = 1 m oscila en un campo gravitatorio con g = 10 m/s². Calcular el período T y la frecuencia f de la oscilación del péndulo. (Tomar π ≈ 3,14.)", "it": "Un pendolo semplice di lunghezza l = 1 m oscilla in un campo gravitazionale con g = 10 m/s². Calcolare il periodo T e la frequenza f dell'oscillazione del pendolo. (Prendere π ≈ 3,14.)", "ru": "Математический маятник длиной l = 1 м колеблется в поле тяжести с g = 10 м/с². Вычислить период T и частоту f колебаний маятника. (Принять π ≈ 3,14.)", "pt": "Um pêndulo simples de comprimento l = 1 m oscila num campo gravitacional com g = 10 m/s². Calcular o período T e a frequência f da oscilação do pêndulo. (Tomar π ≈ 3,14.)"}, "steps": [{"sr": "Zapisati formulu za period: T = 2π√(l/g).", "en": "Write down the formula for the period: T = 2π√(l/g).", "de": "Formel für die Periode notieren: T = 2π√(l/g).", "fr": "Écrire la formule de la période : T = 2π√(l/g).", "es": "Escribir la fórmula del período: T = 2π√(l/g).", "it": "Scrivere la formula del periodo: T = 2π√(l/g).", "ru": "Записать формулу периода: T = 2π√(l/g).", "pt": "Escrever a fórmula do período: T = 2π√(l/g)."}, {"sr": "Uvrstiti vrednosti: T = 2·3,14·√(1/10) = 6,28·√0,1 ≈ 6,28·0,316 ≈ 1,99 s.", "en": "Substitute the values: T = 2·3.14·√(1/10) = 6.28·√0.1 ≈ 6.28·0.316 ≈ 1.99 s.", "de": "Werte einsetzen: T = 2·3,14·√(1/10) = 6,28·√0,1 ≈ 6,28·0,316 ≈ 1,99 s.", "fr": "Remplacer les valeurs : T = 2·3,14·√(1/10) = 6,28·√0,1 ≈ 6,28·0,316 ≈ 1,99 s.", "es": "Sustituir los valores: T = 2·3,14·√(1/10) = 6,28·√0,1 ≈ 6,28·0,316 ≈ 1,99 s.", "it": "Sostituire i valori: T = 2·3,14·√(1/10) = 6,28·√0,1 ≈ 6,28·0,316 ≈ 1,99 s.", "ru": "Подставить значения: T = 2·3,14·√(1/10) = 6,28·√0,1 ≈ 6,28·0,316 ≈ 1,99 с.", "pt": "Substituir os valores: T = 2·3,14·√(1/10) = 6,28·√0,1 ≈ 6,28·0,316 ≈ 1,99 s."}, {"sr": "Izračunati frekvenciju: f = 1/T = 1/1,99 ≈ 0,50 Hz.", "en": "Calculate the frequency: f = 1/T = 1/1.99 ≈ 0.50 Hz.", "de": "Frequenz berechnen: f = 1/T = 1/1,99 ≈ 0,50 Hz.", "fr": "Calculer la fréquence : f = 1/T = 1/1,99 ≈ 0,50 Hz.", "es": "Calcular la frecuencia: f = 1/T = 1/1,99 ≈ 0,50 Hz.", "it": "Calcolare la frequenza: f = 1/T = 1/1,99 ≈ 0,50 Hz.", "ru": "Вычислить частоту: f = 1/T = 1/1,99 ≈ 0,50 Гц.", "pt": "Calcular a frequência: f = 1/T = 1/1,99 ≈ 0,50 Hz."}]}}, {"name": {"sr": "Talasi", "en": "Waves", "de": "Wellen", "fr": "Ondes", "es": "Ondas", "it": "Onde", "ru": "Волны", "pt": "Ondas"}, "theory": {"sr": "<b>Talas</b> je prostiranje oscilacije kroz prostor, pri čemu se energija prenosi bez prenosa mase. Osnovne veličine su talasna dužina λ, frekvencija f i brzina prostiranja v. Talasi mogu biti mehanički (zvuk, talasi na vodi) i elektromagnetni (svetlost, radio-talasi). Kod mehaničkih talasa razlikujemo transverzalne, kod kojih čestice osciluju upravno na pravac prostiranja, i longitudinalne, kod kojih osciluju duž pravca prostiranja.", "en": "<b>A wave</b> is the propagation of an oscillation through space, in which energy is transferred without the transfer of mass. The basic quantities are wavelength λ, frequency f and propagation speed v. Waves can be mechanical (sound, water waves) or electromagnetic (light, radio waves). Among mechanical waves we distinguish transverse waves, in which particles oscillate perpendicular to the direction of propagation, and longitudinal waves, in which they oscillate along the direction of propagation.", "de": "<b>Eine Welle</b> ist die Ausbreitung einer Schwingung im Raum, wobei Energie ohne Massentransport übertragen wird. Die grundlegenden Größen sind Wellenlänge λ, Frequenz f und Ausbreitungsgeschwindigkeit v. Wellen können mechanisch (Schall, Wasserwellen) oder elektromagnetisch (Licht, Radiowellen) sein. Bei mechanischen Wellen unterscheidet man Transversalwellen, bei denen die Teilchen senkrecht zur Ausbreitungsrichtung schwingen, und Longitudinalwellen, bei denen sie entlang der Ausbreitungsrichtung schwingen.", "fr": "<b>Une onde</b> est la propagation d'une oscillation dans l'espace, au cours de laquelle l'énergie est transférée sans transfert de masse. Les grandeurs de base sont la longueur d'onde λ, la fréquence f et la vitesse de propagation v. Les ondes peuvent être mécaniques (son, ondes à la surface de l'eau) ou électromagnétiques (lumière, ondes radio). Parmi les ondes mécaniques, on distingue les ondes transversales, où les particules oscillent perpendiculairement à la direction de propagation, et les ondes longitudinales, où elles oscillent le long de la direction de propagation.", "es": "<b>Una onda</b> es la propagación de una oscilación a través del espacio, en la cual se transfiere energía sin transferencia de masa. Las magnitudes básicas son la longitud de onda λ, la frecuencia f y la velocidad de propagación v. Las ondas pueden ser mecánicas (sonido, ondas en el agua) o electromagnéticas (luz, ondas de radio). Entre las ondas mecánicas se distinguen las transversales, en las que las partículas oscilan perpendicularmente a la dirección de propagación, y las longitudinales, en las que oscilan a lo largo de la dirección de propagación.", "it": "<b>Un'onda</b> è la propagazione di un'oscillazione nello spazio, durante la quale l'energia viene trasferita senza trasferimento di massa. Le grandezze fondamentali sono la lunghezza d'onda λ, la frequenza f e la velocità di propagazione v. Le onde possono essere meccaniche (suono, onde sull'acqua) o elettromagnetiche (luce, onde radio). Tra le onde meccaniche si distinguono quelle trasversali, in cui le particelle oscillano perpendicolarmente alla direzione di propagazione, e quelle longitudinali, in cui oscillano lungo la direzione di propagazione.", "ru": "<b>Волна</b> — это распространение колебаний в пространстве, при котором энергия передаётся без переноса вещества. Основные величины — длина волны λ, частота f и скорость распространения v. Волны бывают механическими (звук, волны на воде) и электромагнитными (свет, радиоволны). Среди механических волн различают поперечные, в которых частицы колеблются перпендикулярно направлению распространения, и продольные, в которых они колеблются вдоль направления распространения.", "pt": "<b>Uma onda</b> é a propagação de uma oscilação através do espaço, na qual a energia é transferida sem transferência de massa. As grandezas básicas são o comprimento de onda λ, a frequência f e a velocidade de propagação v. As ondas podem ser mecânicas (som, ondas na água) ou eletromagnéticas (luz, ondas de rádio). Entre as ondas mecânicas distinguem-se as transversais, nas quais as partículas oscilam perpendicularmente à direção de propagação, e as longitudinais, nas quais oscilam ao longo da direção de propagação."}, "formulas": [{"sr": "v = λ·f — brzina talasa jednaka je proizvodu talasne dužine i frekvencije", "en": "v = λ·f — the wave speed equals the product of wavelength and frequency", "de": "v = λ·f — die Wellengeschwindigkeit ist gleich dem Produkt aus Wellenlänge und Frequenz", "fr": "v = λ·f — la vitesse de l'onde est égale au produit de la longueur d'onde et de la fréquence", "es": "v = λ·f — la velocidad de la onda es igual al producto de la longitud de onda y la frecuencia", "it": "v = λ·f — la velocità dell'onda è uguale al prodotto tra lunghezza d'onda e frequenza", "ru": "v = λ·f — скорость волны равна произведению длины волны на частоту", "pt": "v = λ·f — a velocidade da onda é igual ao produto do comprimento de onda pela frequência"}], "remember": {"sr": "Brzina talasa zavisi od osobina sredine kroz koju se prostire, dok frekvencija ostaje ista kao frekvencija izvora.", "en": "The wave speed depends on the properties of the medium through which it propagates, while the frequency remains the same as the frequency of the source.", "de": "Die Wellengeschwindigkeit hängt von den Eigenschaften des Mediums ab, durch das sie sich ausbreitet, während die Frequenz gleich der Frequenz der Quelle bleibt.", "fr": "La vitesse de l'onde dépend des propriétés du milieu dans lequel elle se propage, tandis que la fréquence reste égale à celle de la source.", "es": "La velocidad de la onda depende de las propiedades del medio por el que se propaga, mientras que la frecuencia sigue siendo la misma que la de la fuente.", "it": "La velocità dell'onda dipende dalle proprietà del mezzo in cui si propaga, mentre la frequenza rimane uguale a quella della sorgente.", "ru": "Скорость волны зависит от свойств среды, через которую она распространяется, а частота остаётся такой же, как частота источника.", "pt": "A velocidade da onda depende das propriedades do meio através do qual se propaga, enquanto a frequência permanece igual à da fonte."}, "problem": {"statement": {"sr": "Zvučni talas ima frekvenciju f = 440 Hz i brzinu prostiranja kroz vazduh v = 340 m/s. Izračunati talasnu dužinu λ tog talasa.", "en": "A sound wave has a frequency f = 440 Hz and propagates through air at a speed v = 340 m/s. Calculate the wavelength λ of this wave.", "de": "Eine Schallwelle hat eine Frequenz von f = 440 Hz und breitet sich in Luft mit einer Geschwindigkeit von v = 340 m/s aus. Berechne die Wellenlänge λ dieser Welle.", "fr": "Une onde sonore a une fréquence f = 440 Hz et se propage dans l'air à une vitesse v = 340 m/s. Calculer la longueur d'onde λ de cette onde.", "es": "Una onda sonora tiene una frecuencia f = 440 Hz y se propaga por el aire a una velocidad v = 340 m/s. Calcular la longitud de onda λ de esa onda.", "it": "Un'onda sonora ha una frequenza f = 440 Hz e si propaga nell'aria a una velocità v = 340 m/s. Calcolare la lunghezza d'onda λ di quest'onda.", "ru": "Звуковая волна имеет частоту f = 440 Гц и распространяется в воздухе со скоростью v = 340 м/с. Вычислить длину волны λ этой волны.", "pt": "Uma onda sonora tem frequência f = 440 Hz e propaga-se no ar a uma velocidade v = 340 m/s. Calcular o comprimento de onda λ dessa onda."}, "steps": [{"sr": "Zapisati formulu: v = λ·f, odakle je λ = v/f.", "en": "Write down the formula: v = λ·f, so λ = v/f.", "de": "Formel notieren: v = λ·f, also λ = v/f.", "fr": "Écrire la formule : v = λ·f, d'où λ = v/f.", "es": "Escribir la fórmula: v = λ·f, de donde λ = v/f.", "it": "Scrivere la formula: v = λ·f, da cui λ = v/f.", "ru": "Записать формулу: v = λ·f, откуда λ = v/f.", "pt": "Escrever a fórmula: v = λ·f, logo λ = v/f."}, {"sr": "Uvrstiti vrednosti: λ = 340/440 ≈ 0,77 m.", "en": "Substitute the values: λ = 340/440 ≈ 0.77 m.", "de": "Werte einsetzen: λ = 340/440 ≈ 0,77 m.", "fr": "Remplacer les valeurs : λ = 340/440 ≈ 0,77 m.", "es": "Sustituir los valores: λ = 340/440 ≈ 0,77 m.", "it": "Sostituire i valori: λ = 340/440 ≈ 0,77 m.", "ru": "Подставить значения: λ = 340/440 ≈ 0,77 м.", "pt": "Substituir os valores: λ = 340/440 ≈ 0,77 m."}, {"sr": "Zaključak: talasna dužina tona je približno 0,77 m.", "en": "Conclusion: the wavelength of the tone is approximately 0.77 m.", "de": "Schlussfolgerung: Die Wellenlänge des Tons beträgt etwa 0,77 m.", "fr": "Conclusion : la longueur d'onde du son est d'environ 0,77 m.", "es": "Conclusión: la longitud de onda del tono es aproximadamente 0,77 m.", "it": "Conclusione: la lunghezza d'onda del suono è di circa 0,77 m.", "ru": "Вывод: длина волны тона составляет примерно 0,77 м.", "pt": "Conclusão: o comprimento de onda do som é de aproximadamente 0,77 m."}]}}, {"name": {"sr": "Magnetno polje", "en": "Magnetic Field", "de": "Magnetfeld", "fr": "Champ magnétique", "es": "Campo magnético", "it": "Campo magnetico", "ru": "Магнитное поле", "pt": "Campo magnético"}, "theory": {"sr": "<b>Magnetno polje</b> je prostor oko magneta ili provodnika sa strujom u kome se ispoljava magnetna sila. Opisuje se vektorom magnetne indukcije B, čija je jedinica tesla (T). Provodnik dužine L kroz koji protiče struja jačine I, postavljen u magnetno polje, trpi magnetnu silu čiji intenzitet zavisi od jačine polja, jačine struje i ugla između provodnika i polja. Pravac sile određuje se pravilom leve ruke.", "en": "<b>The magnetic field</b> is the region around a magnet or a current-carrying conductor in which a magnetic force is exerted. It is described by the magnetic flux density vector B, whose unit is the tesla (T). A conductor of length L carrying a current of strength I, placed in a magnetic field, experiences a magnetic force whose magnitude depends on the field strength, the current strength and the angle between the conductor and the field. The direction of the force is found using the left-hand rule.", "de": "<b>Das Magnetfeld</b> ist der Raum um einen Magneten oder einen stromdurchflossenen Leiter, in dem sich eine magnetische Kraft zeigt. Es wird durch den Vektor der magnetischen Flussdichte B beschrieben, dessen Einheit Tesla (T) ist. Ein Leiter der Länge L, durch den ein Strom der Stärke I fließt, erfährt in einem Magnetfeld eine magnetische Kraft, deren Betrag von der Feldstärke, der Stromstärke und dem Winkel zwischen Leiter und Feld abhängt. Die Richtung der Kraft wird mit der Linke-Hand-Regel bestimmt.", "fr": "<b>Le champ magnétique</b> est la région autour d'un aimant ou d'un conducteur parcouru par un courant, dans laquelle s'exerce une force magnétique. Il est décrit par le vecteur d'induction magnétique B, dont l'unité est le tesla (T). Un conducteur de longueur L parcouru par un courant d'intensité I, placé dans un champ magnétique, subit une force magnétique dont l'intensité dépend de la force du champ, de l'intensité du courant et de l'angle entre le conducteur et le champ. La direction de la force se détermine par la règle de la main gauche.", "es": "<b>El campo magnético</b> es la región alrededor de un imán o de un conductor recorrido por una corriente, en la que se manifiesta una fuerza magnética. Se describe mediante el vector de inducción magnética B, cuya unidad es el tesla (T). Un conductor de longitud L por el que circula una corriente de intensidad I, colocado en un campo magnético, experimenta una fuerza magnética cuya magnitud depende de la intensidad del campo, de la intensidad de la corriente y del ángulo entre el conductor y el campo. La dirección de la fuerza se determina con la regla de la mano izquierda.", "it": "<b>Il campo magnetico</b> è la regione attorno a un magnete o a un conduttore percorso da corrente in cui si manifesta una forza magnetica. È descritto dal vettore induzione magnetica B, la cui unità è il tesla (T). Un conduttore di lunghezza L percorso da una corrente di intensità I, posto in un campo magnetico, subisce una forza magnetica la cui intensità dipende dall'intensità del campo, dall'intensità della corrente e dall'angolo tra il conduttore e il campo. La direzione della forza si determina con la regola della mano sinistra.", "ru": "<b>Магнитное поле</b> — это область вокруг магнита или проводника с током, в которой проявляется магнитная сила. Оно описывается вектором магнитной индукции B, единица измерения которого — тесла (Тл). Проводник длиной L, по которому течёт ток силой I, помещённый в магнитное поле, испытывает магнитную силу, величина которой зависит от силы поля, силы тока и угла между проводником и полем. Направление силы определяется по правилу левой руки.", "pt": "<b>O campo magnético</b> é a região em torno de um íman ou de um condutor percorrido por corrente, na qual se manifesta uma força magnética. É descrito pelo vetor de indução magnética B, cuja unidade é o tesla (T). Um condutor de comprimento L percorrido por uma corrente de intensidade I, colocado num campo magnético, sofre uma força magnética cuja intensidade depende da intensidade do campo, da intensidade da corrente e do ângulo entre o condutor e o campo. A direção da força determina-se pela regra da mão esquerda."}, "formulas": [{"sr": "F = B·I·L — magnetna sila na pravolinijski provodnik upravan na polje (B — magnetna indukcija, I — jačina struje, L — dužina provodnika)", "en": "F = B·I·L — magnetic force on a straight conductor perpendicular to the field (B — magnetic flux density, I — current strength, L — conductor length)", "de": "F = B·I·L — magnetische Kraft auf einen geraden, senkrecht zum Feld stehenden Leiter (B — magnetische Flussdichte, I — Stromstärke, L — Leiterlänge)", "fr": "F = B·I·L — force magnétique sur un conducteur rectiligne perpendiculaire au champ (B — induction magnétique, I — intensité du courant, L — longueur du conducteur)", "es": "F = B·I·L — fuerza magnética sobre un conductor rectilíneo perpendicular al campo (B — inducción magnética, I — intensidad de corriente, L — longitud del conductor)", "it": "F = B·I·L — forza magnetica su un conduttore rettilineo perpendicolare al campo (B — induzione magnetica, I — intensità di corrente, L — lunghezza del conduttore)", "ru": "F = B·I·L — сила, действующая на прямой проводник, расположенный перпендикулярно полю (B — магнитная индукция, I — сила тока, L — длина проводника)", "pt": "F = B·I·L — força magnética sobre um condutor retilíneo perpendicular ao campo (B — indução magnética, I — intensidade de corrente, L — comprimento do condutor)"}], "remember": {"sr": "Magnetna sila na provodnik je najveća kada je provodnik upravan na linije magnetnog polja, a jednaka je nuli kada je provodnik paralelan sa poljem.", "en": "The magnetic force on a conductor is greatest when the conductor is perpendicular to the magnetic field lines, and equal to zero when the conductor is parallel to the field.", "de": "Die magnetische Kraft auf einen Leiter ist am größten, wenn der Leiter senkrecht zu den Feldlinien steht, und gleich null, wenn der Leiter parallel zum Feld verläuft.", "fr": "La force magnétique sur un conducteur est maximale lorsque le conducteur est perpendiculaire aux lignes de champ magnétique, et nulle lorsque le conducteur est parallèle au champ.", "es": "La fuerza magnética sobre un conductor es máxima cuando el conductor es perpendicular a las líneas del campo magnético, y nula cuando el conductor es paralelo al campo.", "it": "La forza magnetica su un conduttore è massima quando il conduttore è perpendicolare alle linee di campo magnetico, ed è nulla quando il conduttore è parallelo al campo.", "ru": "Магнитная сила, действующая на проводник, максимальна, когда проводник перпендикулярен линиям магнитного поля, и равна нулю, когда проводник параллелен полю.", "pt": "A força magnética sobre um condutor é máxima quando o condutor é perpendicular às linhas do campo magnético, e nula quando o condutor é paralelo ao campo."}, "problem": {"statement": {"sr": "Pravolinijski provodnik dužine L = 0,5 m nalazi se upravno na homogeno magnetno polje indukcije B = 0,2 T. Kroz provodnik protiče struja jačine I = 4 A. Izračunati intenzitet magnetne sile koja deluje na provodnik.", "en": "A straight conductor of length L = 0.5 m is placed perpendicular to a uniform magnetic field of flux density B = 0.2 T. A current of strength I = 4 A flows through the conductor. Calculate the magnitude of the magnetic force acting on the conductor.", "de": "Ein gerader Leiter der Länge L = 0,5 m steht senkrecht zu einem homogenen Magnetfeld der Flussdichte B = 0,2 T. Durch den Leiter fließt ein Strom der Stärke I = 4 A. Berechne den Betrag der magnetischen Kraft, die auf den Leiter wirkt.", "fr": "Un conducteur rectiligne de longueur L = 0,5 m est placé perpendiculairement à un champ magnétique uniforme d'induction B = 0,2 T. Un courant d'intensité I = 4 A traverse le conducteur. Calculer l'intensité de la force magnétique agissant sur le conducteur.", "es": "Un conductor rectilíneo de longitud L = 0,5 m se encuentra perpendicular a un campo magnético uniforme de inducción B = 0,2 T. Por el conductor circula una corriente de intensidad I = 4 A. Calcular la intensidad de la fuerza magnética que actúa sobre el conductor.", "it": "Un conduttore rettilineo di lunghezza L = 0,5 m è posto perpendicolarmente a un campo magnetico uniforme di induzione B = 0,2 T. Nel conduttore scorre una corrente di intensità I = 4 A. Calcolare l'intensità della forza magnetica che agisce sul conduttore.", "ru": "Прямой проводник длиной L = 0,5 м расположен перпендикулярно однородному магнитному полю индукцией B = 0,2 Тл. По проводнику течёт ток силой I = 4 А. Вычислить величину магнитной силы, действующей на проводник.", "pt": "Um condutor retilíneo de comprimento L = 0,5 m está colocado perpendicularmente a um campo magnético uniforme de indução B = 0,2 T. Pelo condutor circula uma corrente de intensidade I = 4 A. Calcular a intensidade da força magnética que atua sobre o condutor."}, "steps": [{"sr": "Zapisati formulu: F = B·I·L.", "en": "Write down the formula: F = B·I·L.", "de": "Formel notieren: F = B·I·L.", "fr": "Écrire la formule : F = B·I·L.", "es": "Escribir la fórmula: F = B·I·L.", "it": "Scrivere la formula: F = B·I·L.", "ru": "Записать формулу: F = B·I·L.", "pt": "Escrever a fórmula: F = B·I·L."}, {"sr": "Uvrstiti vrednosti: F = 0,2·4·0,5 = 0,4 N.", "en": "Substitute the values: F = 0.2·4·0.5 = 0.4 N.", "de": "Werte einsetzen: F = 0,2·4·0,5 = 0,4 N.", "fr": "Remplacer les valeurs : F = 0,2·4·0,5 = 0,4 N.", "es": "Sustituir los valores: F = 0,2·4·0,5 = 0,4 N.", "it": "Sostituire i valori: F = 0,2·4·0,5 = 0,4 N.", "ru": "Подставить значения: F = 0,2·4·0,5 = 0,4 Н.", "pt": "Substituir os valores: F = 0,2·4·0,5 = 0,4 N."}, {"sr": "Zaključak: na provodnik deluje magnetna sila od 0,4 N.", "en": "Conclusion: a magnetic force of 0.4 N acts on the conductor.", "de": "Schlussfolgerung: Auf den Leiter wirkt eine magnetische Kraft von 0,4 N.", "fr": "Conclusion : une force magnétique de 0,4 N agit sur le conducteur.", "es": "Conclusión: sobre el conductor actúa una fuerza magnética de 0,4 N.", "it": "Conclusione: sul conduttore agisce una forza magnetica di 0,4 N.", "ru": "Вывод: на проводник действует магнитная сила 0,4 Н.", "pt": "Conclusão: sobre o condutor atua uma força magnética de 0,4 N."}]}}, {"name": {"sr": "Indukcija", "en": "Induction", "de": "Induktion", "fr": "Induction", "es": "Inducción", "it": "Induzione", "ru": "Индукция", "pt": "Indução"}, "theory": {"sr": "<b>Elektromagnetna indukcija</b> je pojava nastanka indukovane elektromotorne sile u provodnom kolu usled promene magnetnog fluksa Φ kroz to kolo. Do promene fluksa dolazi kada se menja jačina magnetnog polja, površina kola ili ugao između polja i površine. Pravac indukovane struje određuje se Lencovim pravilom, prema kome indukovana struja svojim magnetnim poljem uvek deluje suprotno promeni koja je izaziva.", "en": "<b>Electromagnetic induction</b> is the phenomenon of an induced electromotive force arising in a conducting circuit due to a change in the magnetic flux Φ through that circuit. The flux changes when the strength of the magnetic field, the area of the circuit, or the angle between the field and the area changes. The direction of the induced current is found using Lenz's law, according to which the induced current always acts, through its own magnetic field, against the change that produced it.", "de": "<b>Die elektromagnetische Induktion</b> ist das Phänomen, dass in einem Stromkreis eine induzierte elektromotorische Kraft entsteht, wenn sich der magnetische Fluss Φ durch diesen Kreis ändert. Der Fluss ändert sich, wenn sich die Stärke des Magnetfelds, die Fläche des Kreises oder der Winkel zwischen Feld und Fläche ändert. Die Richtung des induzierten Stroms wird mit der Lenzschen Regel bestimmt, nach der der induzierte Strom mit seinem eigenen Magnetfeld stets der Änderung entgegenwirkt, die ihn hervorgerufen hat.", "fr": "<b>L'induction électromagnétique</b> est le phénomène par lequel une force électromotrice induite apparaît dans un circuit conducteur en raison d'une variation du flux magnétique Φ à travers ce circuit. Le flux varie lorsque l'intensité du champ magnétique, la surface du circuit ou l'angle entre le champ et la surface change. Le sens du courant induit est déterminé par la loi de Lenz, selon laquelle le courant induit s'oppose toujours, par son propre champ magnétique, à la variation qui l'a provoqué.", "es": "<b>La inducción electromagnética</b> es el fenómeno de aparición de una fuerza electromotriz inducida en un circuito conductor debido a un cambio del flujo magnético Φ a través de dicho circuito. El flujo cambia cuando varía la intensidad del campo magnético, el área del circuito o el ángulo entre el campo y la superficie. El sentido de la corriente inducida se determina mediante la ley de Lenz, según la cual la corriente inducida, con su propio campo magnético, siempre se opone al cambio que la provoca.", "it": "<b>L'induzione elettromagnetica</b> è il fenomeno per cui in un circuito conduttore nasce una forza elettromotrice indotta a causa di una variazione del flusso magnetico Φ attraverso quel circuito. Il flusso varia quando cambia l'intensità del campo magnetico, l'area del circuito o l'angolo tra il campo e la superficie. Il verso della corrente indotta si determina con la legge di Lenz, secondo la quale la corrente indotta si oppone sempre, con il proprio campo magnetico, alla variazione che l'ha generata.", "ru": "<b>Электромагнитная индукция</b> — это явление возникновения индуцированной электродвижущей силы в проводящем контуре вследствие изменения магнитного потока Φ через этот контур. Поток изменяется при изменении силы магнитного поля, площади контура или угла между полем и площадью. Направление индукционного тока определяется правилом Ленца, согласно которому индукционный ток своим магнитным полем всегда противодействует вызвавшему его изменению.", "pt": "<b>A indução eletromagnética</b> é o fenómeno do surgimento de uma força eletromotriz induzida num circuito condutor devido a uma variação do fluxo magnético Φ através desse circuito. O fluxo varia quando muda a intensidade do campo magnético, a área do circuito ou o ângulo entre o campo e a área. O sentido da corrente induzida determina-se pela lei de Lenz, segundo a qual a corrente induzida se opõe sempre, com o seu próprio campo magnético, à variação que a provocou."}, "formulas": [{"sr": "ε = −ΔΦ/Δt — indukovana elektromotorna sila jednaka je negativnoj brzini promene magnetnog fluksa", "en": "ε = −ΔΦ/Δt — the induced electromotive force equals the negative rate of change of the magnetic flux", "de": "ε = −ΔΦ/Δt — die induzierte elektromotorische Kraft ist gleich der negativen Änderungsgeschwindigkeit des magnetischen Flusses", "fr": "ε = −ΔΦ/Δt — la force électromotrice induite est égale à l'opposé de la vitesse de variation du flux magnétique", "es": "ε = −ΔΦ/Δt — la fuerza electromotriz inducida es igual a la velocidad de variación del flujo magnético con signo negativo", "it": "ε = −ΔΦ/Δt — la forza elettromotrice indotta è uguale alla velocità di variazione del flusso magnetico, con segno negativo", "ru": "ε = −ΔΦ/Δt — индуцированная электродвижущая сила равна взятой со знаком минус скорости изменения магнитного потока", "pt": "ε = −ΔΦ/Δt — a força eletromotriz induzida é igual à velocidade de variação do fluxo magnético com sinal negativo"}], "remember": {"sr": "Znak minus u Faradejevom zakonu izražava Lencovo pravilo — indukovana struja se uvek suprotstavlja promeni fluksa koja je izazvala.", "en": "The minus sign in Faraday's law expresses Lenz's law — the induced current always opposes the change in flux that produced it.", "de": "Das Minuszeichen im Faradayschen Gesetz drückt die Lenzsche Regel aus — der induzierte Strom wirkt stets der Flussänderung entgegen, die ihn verursacht hat.", "fr": "Le signe moins dans la loi de Faraday exprime la loi de Lenz — le courant induit s'oppose toujours à la variation de flux qui l'a provoqué.", "es": "El signo menos en la ley de Faraday expresa la ley de Lenz: la corriente inducida siempre se opone al cambio de flujo que la provocó.", "it": "Il segno meno nella legge di Faraday esprime la legge di Lenz: la corrente indotta si oppone sempre alla variazione di flusso che l'ha causata.", "ru": "Знак минус в законе Фарадея выражает правило Ленца — индукционный ток всегда противодействует вызвавшему его изменению потока.", "pt": "O sinal negativo na lei de Faraday exprime a lei de Lenz — a corrente induzida opõe-se sempre à variação de fluxo que a provocou."}, "problem": {"statement": {"sr": "Magnetni fluks kroz kalem se ravnomerno promeni od Φ₁ = 0,02 Wb do Φ₂ = 0,08 Wb za vreme Δt = 0,3 s. Izračunati intenzitet indukovane elektromotorne sile.", "en": "The magnetic flux through a coil changes uniformly from Φ₁ = 0.02 Wb to Φ₂ = 0.08 Wb over a time Δt = 0.3 s. Calculate the magnitude of the induced electromotive force.", "de": "Der magnetische Fluss durch eine Spule ändert sich gleichmäßig von Φ₁ = 0,02 Wb auf Φ₂ = 0,08 Wb in einer Zeit von Δt = 0,3 s. Berechne den Betrag der induzierten elektromotorischen Kraft.", "fr": "Le flux magnétique à travers une bobine varie uniformément de Φ₁ = 0,02 Wb à Φ₂ = 0,08 Wb en un temps Δt = 0,3 s. Calculer l'intensité de la force électromotrice induite.", "es": "El flujo magnético a través de una bobina varía uniformemente de Φ₁ = 0,02 Wb a Φ₂ = 0,08 Wb en un tiempo Δt = 0,3 s. Calcular la intensidad de la fuerza electromotriz inducida.", "it": "Il flusso magnetico attraverso una bobina varia uniformemente da Φ₁ = 0,02 Wb a Φ₂ = 0,08 Wb in un tempo Δt = 0,3 s. Calcolare l'intensità della forza elettromotrice indotta.", "ru": "Магнитный поток через катушку равномерно изменяется от Φ₁ = 0,02 Вб до Φ₂ = 0,08 Вб за время Δt = 0,3 с. Вычислить величину индуцированной электродвижущей силы.", "pt": "O fluxo magnético através de uma bobina varia uniformemente de Φ₁ = 0,02 Wb para Φ₂ = 0,08 Wb num tempo Δt = 0,3 s. Calcular a intensidade da força eletromotriz induzida."}, "steps": [{"sr": "Izračunati promenu fluksa: ΔΦ = Φ₂ − Φ₁ = 0,08 − 0,02 = 0,06 Wb.", "en": "Calculate the change in flux: ΔΦ = Φ₂ − Φ₁ = 0.08 − 0.02 = 0.06 Wb.", "de": "Flussänderung berechnen: ΔΦ = Φ₂ − Φ₁ = 0,08 − 0,02 = 0,06 Wb.", "fr": "Calculer la variation de flux : ΔΦ = Φ₂ − Φ₁ = 0,08 − 0,02 = 0,06 Wb.", "es": "Calcular la variación del flujo: ΔΦ = Φ₂ − Φ₁ = 0,08 − 0,02 = 0,06 Wb.", "it": "Calcolare la variazione di flusso: ΔΦ = Φ₂ − Φ₁ = 0,08 − 0,02 = 0,06 Wb.", "ru": "Вычислить изменение потока: ΔΦ = Φ₂ − Φ₁ = 0,08 − 0,02 = 0,06 Вб.", "pt": "Calcular a variação do fluxo: ΔΦ = Φ₂ − Φ₁ = 0,08 − 0,02 = 0,06 Wb."}, {"sr": "Primeniti formulu: ε = ΔΦ/Δt = 0,06/0,3 = 0,2 V (uzima se intenzitet, bez znaka minus).", "en": "Apply the formula: ε = ΔΦ/Δt = 0.06/0.3 = 0.2 V (magnitude is taken, without the minus sign).", "de": "Formel anwenden: ε = ΔΦ/Δt = 0,06/0,3 = 0,2 V (es wird der Betrag genommen, ohne Minuszeichen).", "fr": "Appliquer la formule : ε = ΔΦ/Δt = 0,06/0,3 = 0,2 V (on prend l'intensité, sans le signe moins).", "es": "Aplicar la fórmula: ε = ΔΦ/Δt = 0,06/0,3 = 0,2 V (se toma el valor absoluto, sin el signo menos).", "it": "Applicare la formula: ε = ΔΦ/Δt = 0,06/0,3 = 0,2 V (si considera il valore assoluto, senza il segno meno).", "ru": "Применить формулу: ε = ΔΦ/Δt = 0,06/0,3 = 0,2 В (берётся модуль, без знака минус).", "pt": "Aplicar a fórmula: ε = ΔΦ/Δt = 0,06/0,3 = 0,2 V (toma-se o valor absoluto, sem o sinal negativo)."}, {"sr": "Zaključak: indukovana elektromotorna sila iznosi 0,2 V.", "en": "Conclusion: the induced electromotive force is 0.2 V.", "de": "Schlussfolgerung: Die induzierte elektromotorische Kraft beträgt 0,2 V.", "fr": "Conclusion : la force électromotrice induite est de 0,2 V.", "es": "Conclusión: la fuerza electromotriz inducida es de 0,2 V.", "it": "Conclusione: la forza elettromotrice indotta è di 0,2 V.", "ru": "Вывод: индуцированная электродвижущая сила составляет 0,2 В.", "pt": "Conclusão: a força eletromotriz induzida é de 0,2 V."}]}}, {"name": {"sr": "Naizmenična struja", "en": "Alternating Current", "de": "Wechselstrom", "fr": "Courant alternatif", "es": "Corriente alterna", "it": "Corrente alternata", "ru": "Переменный ток", "pt": "Corrente alternada"}, "theory": {"sr": "<b>Naizmenična struja</b> periodično menja smer i intenzitet, za razliku od jednosmerne struje. Opisuje se trenutnom vrednošću koja se menja po sinusnom zakonu, kao i amplitudom (maksimalnom vrednošću) i efektivnom vrednošću, koja odgovara jednosmernoj struji istog toplotnog dejstva. Naizmenična struja se dobija u generatorima obrtanjem kalema u magnetnom polju, a njena frekvencija u elektroenergetskoj mreži iznosi 50 Hz.", "en": "<b>Alternating current</b> periodically changes direction and magnitude, unlike direct current. It is described by its instantaneous value, which varies according to a sine law, as well as by its amplitude (maximum value) and its effective (RMS) value, which corresponds to a direct current with the same heating effect. Alternating current is produced in generators by rotating a coil in a magnetic field, and its frequency in the power grid is 50 Hz.", "de": "<b>Der Wechselstrom</b> ändert im Gegensatz zum Gleichstrom periodisch Richtung und Stärke. Er wird durch seinen Augenblickswert beschrieben, der sich nach einem Sinusgesetz ändert, sowie durch seine Amplitude (den Höchstwert) und seinen Effektivwert, der einem Gleichstrom mit gleicher Wärmewirkung entspricht. Wechselstrom entsteht in Generatoren durch Drehen einer Spule in einem Magnetfeld, seine Frequenz im Stromnetz beträgt 50 Hz.", "fr": "<b>Le courant alternatif</b> change périodiquement de sens et d'intensité, contrairement au courant continu. Il est décrit par sa valeur instantanée, qui varie selon une loi sinusoïdale, ainsi que par son amplitude (valeur maximale) et sa valeur efficace, qui correspond à un courant continu produisant le même effet thermique. Le courant alternatif est produit dans les générateurs par la rotation d'une bobine dans un champ magnétique, et sa fréquence dans le réseau électrique est de 50 Hz.", "es": "<b>La corriente alterna</b> cambia periódicamente de sentido e intensidad, a diferencia de la corriente continua. Se describe mediante su valor instantáneo, que varía según una ley senoidal, así como por su amplitud (valor máximo) y su valor eficaz, que corresponde a una corriente continua con el mismo efecto térmico. La corriente alterna se genera en los generadores mediante la rotación de una bobina en un campo magnético, y su frecuencia en la red eléctrica es de 50 Hz.", "it": "<b>La corrente alternata</b> cambia periodicamente verso e intensità, a differenza della corrente continua. È descritta dal suo valore istantaneo, che varia secondo una legge sinusoidale, nonché dalla sua ampiezza (valore massimo) e dal suo valore efficace, che corrisponde a una corrente continua con lo stesso effetto termico. La corrente alternata viene prodotta nei generatori mediante la rotazione di una bobina in un campo magnetico, e la sua frequenza nella rete elettrica è di 50 Hz.", "ru": "<b>Переменный ток</b>, в отличие от постоянного, периодически меняет направление и величину. Он описывается мгновенным значением, изменяющимся по синусоидальному закону, а также амплитудой (максимальным значением) и действующим значением, которое соответствует постоянному току с таким же тепловым действием. Переменный ток вырабатывается в генераторах при вращении катушки в магнитном поле, а его частота в электросети составляет 50 Гц.", "pt": "<b>A corrente alternada</b>, ao contrário da corrente contínua, muda periodicamente de sentido e de intensidade. É descrita pelo seu valor instantâneo, que varia segundo uma lei sinusoidal, bem como pela sua amplitude (valor máximo) e pelo seu valor eficaz, que corresponde a uma corrente contínua com o mesmo efeito térmico. A corrente alternada é produzida nos geradores pela rotação de uma bobina num campo magnético, e a sua frequência na rede elétrica é de 50 Hz."}, "formulas": [{"sr": "Uef = U₀/√2 — efektivna vrednost napona jednaka je amplitudi podeljenoj sa kvadratnim korenom iz 2", "en": "Uef = U₀/√2 — the effective (RMS) voltage equals the amplitude divided by the square root of 2", "de": "Uef = U₀/√2 — der Effektivwert der Spannung ist gleich der Amplitude geteilt durch die Quadratwurzel aus 2", "fr": "Uef = U₀/√2 — la valeur efficace de la tension est égale à l'amplitude divisée par la racine carrée de 2", "es": "Uef = U₀/√2 — el valor eficaz de la tensión es igual a la amplitud dividida entre la raíz cuadrada de 2", "it": "Uef = U₀/√2 — il valore efficace della tensione è uguale all'ampiezza divisa per la radice quadrata di 2", "ru": "Uef = U₀/√2 — действующее значение напряжения равно амплитуде, делённой на квадратный корень из 2", "pt": "Uef = U₀/√2 — o valor eficaz da tensão é igual à amplitude dividida pela raiz quadrada de 2"}], "remember": {"sr": "Efektivna vrednost naizmeničnog napona ili struje je manja od amplitude i pokazana vrednost na mernim instrumentima obično je upravo efektivna vrednost.", "en": "The effective (RMS) value of an alternating voltage or current is smaller than the amplitude, and the value shown on measuring instruments is usually exactly the effective value.", "de": "Der Effektivwert einer Wechselspannung oder eines Wechselstroms ist kleiner als die Amplitude, und der auf Messgeräten angezeigte Wert ist in der Regel genau der Effektivwert.", "fr": "La valeur efficace d'une tension ou d'un courant alternatif est inférieure à l'amplitude, et la valeur affichée par les instruments de mesure est généralement précisément la valeur efficace.", "es": "El valor eficaz de una tensión o corriente alterna es menor que la amplitud, y el valor mostrado en los instrumentos de medida suele ser precisamente el valor eficaz.", "it": "Il valore efficace di una tensione o corrente alternata è minore dell'ampiezza, e il valore mostrato dagli strumenti di misura è di solito proprio il valore efficace.", "ru": "Действующее значение переменного напряжения или тока меньше амплитуды, и значение, показываемое измерительными приборами, обычно является именно действующим значением.", "pt": "O valor eficaz de uma tensão ou corrente alternada é menor do que a amplitude, e o valor apresentado nos instrumentos de medição é geralmente precisamente o valor eficaz."}, "problem": {"statement": {"sr": "Amplituda naizmeničnog napona u kolu iznosi U₀ = 311 V. Izračunati efektivnu vrednost tog napona.", "en": "The amplitude of the alternating voltage in a circuit is U₀ = 311 V. Calculate the effective (RMS) value of this voltage.", "de": "Die Amplitude der Wechselspannung in einem Stromkreis beträgt U₀ = 311 V. Berechne den Effektivwert dieser Spannung.", "fr": "L'amplitude de la tension alternative dans un circuit est U₀ = 311 V. Calculer la valeur efficace de cette tension.", "es": "La amplitud de la tensión alterna en un circuito es U₀ = 311 V. Calcular el valor eficaz de esa tensión.", "it": "L'ampiezza della tensione alternata in un circuito è U₀ = 311 V. Calcolare il valore efficace di questa tensione.", "ru": "Амплитуда переменного напряжения в цепи равна U₀ = 311 В. Вычислить действующее значение этого напряжения.", "pt": "A amplitude da tensão alternada num circuito é U₀ = 311 V. Calcular o valor eficaz dessa tensão."}, "steps": [{"sr": "Zapisati formulu: Uef = U₀/√2.", "en": "Write down the formula: Uef = U₀/√2.", "de": "Formel notieren: Ueff = U₀/√2.", "fr": "Écrire la formule : Uef = U₀/√2.", "es": "Escribir la fórmula: Uef = U₀/√2.", "it": "Scrivere la formula: Uef = U₀/√2.", "ru": "Записать формулу: Uef = U₀/√2.", "pt": "Escrever a fórmula: Uef = U₀/√2."}, {"sr": "Uvrstiti vrednost: Uef = 311/1,41 ≈ 220 V.", "en": "Substitute the value: Uef = 311/1.41 ≈ 220 V.", "de": "Wert einsetzen: Ueff = 311/1,41 ≈ 220 V.", "fr": "Remplacer la valeur : Uef = 311/1,41 ≈ 220 V.", "es": "Sustituir el valor: Uef = 311/1,41 ≈ 220 V.", "it": "Sostituire il valore: Uef = 311/1,41 ≈ 220 V.", "ru": "Подставить значение: Uef = 311/1,41 ≈ 220 В.", "pt": "Substituir o valor: Uef = 311/1,41 ≈ 220 V."}, {"sr": "Zaključak: efektivna vrednost napona iznosi približno 220 V, što odgovara standardnom naponu gradske mreže.", "en": "Conclusion: the effective voltage is approximately 220 V, which corresponds to the standard mains voltage.", "de": "Schlussfolgerung: Der Effektivwert der Spannung beträgt etwa 220 V, was der üblichen Netzspannung entspricht.", "fr": "Conclusion : la valeur efficace de la tension est d'environ 220 V, ce qui correspond à la tension standard du secteur.", "es": "Conclusión: el valor eficaz de la tensión es aproximadamente 220 V, lo que corresponde a la tensión estándar de la red eléctrica.", "it": "Conclusione: il valore efficace della tensione è di circa 220 V, che corrisponde alla tensione standard di rete.", "ru": "Вывод: действующее значение напряжения составляет примерно 220 В, что соответствует стандартному напряжению городской сети.", "pt": "Conclusão: o valor eficaz da tensão é de aproximadamente 220 V, o que corresponde à tensão padrão da rede elétrica."}]}}, {"name": {"sr": "Optika", "en": "Optics", "de": "Optik", "fr": "Optique", "es": "Óptica", "it": "Ottica", "ru": "Оптика", "pt": "Óptica"}, "theory": {"sr": "<b>Optika</b> proučava svetlost i njeno prostiranje, odbijanje i prelamanje. Sočiva su providna optička sredstva ograničena sfernim površinama koja skupljaju (sabirna) ili rasipaju (rasipna) svetlosne zrake. Položaj i veličina lika koji sočivo formira zavise od žižne daljine sočiva f, rastojanja predmeta od sočiva p i rastojanja lika od sočiva l, prema jednačini sočiva.", "en": "<b>Optics</b> studies light and its propagation, reflection and refraction. Lenses are transparent optical media bounded by spherical surfaces that converge (converging lenses) or diverge (diverging lenses) light rays. The position and size of the image formed by a lens depend on the lens's focal length f, the distance of the object from the lens p, and the distance of the image from the lens l, according to the lens equation.", "de": "<b>Die Optik</b> untersucht das Licht sowie seine Ausbreitung, Reflexion und Brechung. Linsen sind durchsichtige optische Medien, die von sphärischen Flächen begrenzt werden und Lichtstrahlen bündeln (Sammellinsen) oder zerstreuen (Zerstreuungslinsen). Die Lage und Größe des von einer Linse erzeugten Bildes hängen von der Brennweite f der Linse, dem Abstand des Gegenstands von der Linse p und dem Abstand des Bildes von der Linse l ab, gemäß der Linsengleichung.", "fr": "<b>L'optique</b> étudie la lumière ainsi que sa propagation, sa réflexion et sa réfraction. Les lentilles sont des milieux optiques transparents limités par des surfaces sphériques qui convergent (lentilles convergentes) ou divergent (lentilles divergentes) les rayons lumineux. La position et la taille de l'image formée par une lentille dépendent de la distance focale f de la lentille, de la distance de l'objet à la lentille p et de la distance de l'image à la lentille l, selon l'équation des lentilles.", "es": "<b>La óptica</b> estudia la luz y su propagación, reflexión y refracción. Las lentes son medios ópticos transparentes limitados por superficies esféricas que convergen (lentes convergentes) o divergen (lentes divergentes) los rayos de luz. La posición y el tamaño de la imagen formada por una lente dependen de la distancia focal f de la lente, de la distancia del objeto a la lente p y de la distancia de la imagen a la lente l, según la ecuación de las lentes.", "it": "<b>L'ottica</b> studia la luce e la sua propagazione, riflessione e rifrazione. Le lenti sono mezzi ottici trasparenti delimitati da superfici sferiche che convergono (lenti convergenti) o divergono (lenti divergenti) i raggi luminosi. La posizione e la dimensione dell'immagine formata da una lente dipendono dalla distanza focale f della lente, dalla distanza dell'oggetto dalla lente p e dalla distanza dell'immagine dalla lente l, secondo l'equazione delle lenti.", "ru": "<b>Оптика</b> изучает свет, его распространение, отражение и преломление. Линзы — это прозрачные оптические тела, ограниченные сферическими поверхностями, которые собирают (собирающие линзы) или рассеивают (рассеивающие линзы) световые лучи. Положение и размер изображения, создаваемого линзой, зависят от фокусного расстояния линзы f, расстояния от предмета до линзы p и расстояния от изображения до линзы l, согласно формуле линзы.", "pt": "<b>A óptica</b> estuda a luz e a sua propagação, reflexão e refração. As lentes são meios ópticos transparentes limitados por superfícies esféricas que convergem (lentes convergentes) ou divergem (lentes divergentes) os raios de luz. A posição e o tamanho da imagem formada por uma lente dependem da distância focal f da lente, da distância do objeto à lente p e da distância da imagem à lente l, de acordo com a equação das lentes."}, "formulas": [{"sr": "1/f = 1/p + 1/l — jednačina tankog sočiva (f — žižna daljina, p — rastojanje predmeta, l — rastojanje lika)", "en": "1/f = 1/p + 1/l — the thin lens equation (f — focal length, p — object distance, l — image distance)", "de": "1/f = 1/p + 1/l — Linsengleichung für dünne Linsen (f — Brennweite, p — Gegenstandsweite, l — Bildweite)", "fr": "1/f = 1/p + 1/l — équation des lentilles minces (f — distance focale, p — distance de l'objet, l — distance de l'image)", "es": "1/f = 1/p + 1/l — ecuación de la lente delgada (f — distancia focal, p — distancia del objeto, l — distancia de la imagen)", "it": "1/f = 1/p + 1/l — equazione della lente sottile (f — distanza focale, p — distanza dell'oggetto, l — distanza dell'immagine)", "ru": "1/f = 1/p + 1/l — формула тонкой линзы (f — фокусное расстояние, p — расстояние от предмета, l — расстояние до изображения)", "pt": "1/f = 1/p + 1/l — equação da lente delgada (f — distância focal, p — distância do objeto, l — distância da imagem)"}], "remember": {"sr": "Kod sabirnih sočiva žižna daljina je pozitivna, a kod rasipnih negativna; znak rastojanja lika pokazuje da li je lik realan ili imaginaran.", "en": "For converging lenses the focal length is positive, and for diverging lenses it is negative; the sign of the image distance shows whether the image is real or virtual.", "de": "Bei Sammellinsen ist die Brennweite positiv, bei Zerstreuungslinsen negativ; das Vorzeichen der Bildweite zeigt, ob das Bild reell oder virtuell ist.", "fr": "Pour les lentilles convergentes, la distance focale est positive, et pour les lentilles divergentes, elle est négative ; le signe de la distance de l'image indique si l'image est réelle ou virtuelle.", "es": "En las lentes convergentes la distancia focal es positiva, y en las divergentes es negativa; el signo de la distancia de la imagen indica si la imagen es real o virtual.", "it": "Nelle lenti convergenti la distanza focale è positiva, in quelle divergenti è negativa; il segno della distanza dell'immagine indica se l'immagine è reale o virtuale.", "ru": "У собирающих линз фокусное расстояние положительно, а у рассеивающих — отрицательно; знак расстояния до изображения показывает, является ли изображение действительным или мнимым.", "pt": "Nas lentes convergentes a distância focal é positiva, e nas divergentes é negativa; o sinal da distância da imagem indica se a imagem é real ou virtual."}, "problem": {"statement": {"sr": "Predmet se nalazi na rastojanju p = 30 cm ispred sabirnog sočiva žižne daljine f = 10 cm. Izračunati rastojanje lika l od sočiva.", "en": "An object is placed at a distance p = 30 cm in front of a converging lens with focal length f = 10 cm. Calculate the distance l of the image from the lens.", "de": "Ein Gegenstand befindet sich in einem Abstand p = 30 cm vor einer Sammellinse mit der Brennweite f = 10 cm. Berechne den Abstand l des Bildes von der Linse.", "fr": "Un objet est placé à une distance p = 30 cm devant une lentille convergente de distance focale f = 10 cm. Calculer la distance l de l'image à la lentille.", "es": "Un objeto se encuentra a una distancia p = 30 cm delante de una lente convergente de distancia focal f = 10 cm. Calcular la distancia l de la imagen a la lente.", "it": "Un oggetto si trova a una distanza p = 30 cm davanti a una lente convergente con distanza focale f = 10 cm. Calcolare la distanza l dell'immagine dalla lente.", "ru": "Предмет находится на расстоянии p = 30 см перед собирающей линзой с фокусным расстоянием f = 10 см. Вычислить расстояние l от изображения до линзы.", "pt": "Um objeto encontra-se a uma distância p = 30 cm à frente de uma lente convergente com distância focal f = 10 cm. Calcular a distância l da imagem à lente."}, "steps": [{"sr": "Zapisati jednačinu sočiva: 1/f = 1/p + 1/l, odakle je 1/l = 1/f − 1/p.", "en": "Write down the lens equation: 1/f = 1/p + 1/l, so 1/l = 1/f − 1/p.", "de": "Linsengleichung notieren: 1/f = 1/p + 1/l, also 1/l = 1/f − 1/p.", "fr": "Écrire l'équation des lentilles : 1/f = 1/p + 1/l, d'où 1/l = 1/f − 1/p.", "es": "Escribir la ecuación de la lente: 1/f = 1/p + 1/l, de donde 1/l = 1/f − 1/p.", "it": "Scrivere l'equazione della lente: 1/f = 1/p + 1/l, da cui 1/l = 1/f − 1/p.", "ru": "Записать формулу линзы: 1/f = 1/p + 1/l, откуда 1/l = 1/f − 1/p.", "pt": "Escrever a equação da lente: 1/f = 1/p + 1/l, logo 1/l = 1/f − 1/p."}, {"sr": "Uvrstiti vrednosti: 1/l = 1/10 − 1/30 = 3/30 − 1/30 = 2/30 = 1/15.", "en": "Substitute the values: 1/l = 1/10 − 1/30 = 3/30 − 1/30 = 2/30 = 1/15.", "de": "Werte einsetzen: 1/l = 1/10 − 1/30 = 3/30 − 1/30 = 2/30 = 1/15.", "fr": "Remplacer les valeurs : 1/l = 1/10 − 1/30 = 3/30 − 1/30 = 2/30 = 1/15.", "es": "Sustituir los valores: 1/l = 1/10 − 1/30 = 3/30 − 1/30 = 2/30 = 1/15.", "it": "Sostituire i valori: 1/l = 1/10 − 1/30 = 3/30 − 1/30 = 2/30 = 1/15.", "ru": "Подставить значения: 1/l = 1/10 − 1/30 = 3/30 − 1/30 = 2/30 = 1/15.", "pt": "Substituir os valores: 1/l = 1/10 − 1/30 = 3/30 − 1/30 = 2/30 = 1/15."}, {"sr": "Izračunati l: l = 15 cm. Lik se formira na rastojanju 15 cm od sočiva.", "en": "Calculate l: l = 15 cm. The image forms at a distance of 15 cm from the lens.", "de": "l berechnen: l = 15 cm. Das Bild entsteht in einem Abstand von 15 cm von der Linse.", "fr": "Calculer l : l = 15 cm. L'image se forme à une distance de 15 cm de la lentille.", "es": "Calcular l: l = 15 cm. La imagen se forma a una distancia de 15 cm de la lente.", "it": "Calcolare l: l = 15 cm. L'immagine si forma a una distanza di 15 cm dalla lente.", "ru": "

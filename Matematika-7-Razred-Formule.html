<script>
var D={"eyebrow": {"sr": "Formule ✨", "en": "Formule ✨", "de": "Formule ✨", "fr": "Formule ✨", "es": "Formule ✨", "it": "Formule ✨", "ru": "Formule ✨", "pt": "Formule ✨"}, "title": {"sr": "Formule · Matematika 7. razred", "en": "Formulas · Mathematics Grade 7", "de": "Formeln · Mathematik 7. Klasse", "fr": "Formules · Mathématiques 7e année", "es": "Fórmulas · Matemáticas 7.º grado", "it": "Formule · Matematica 7ª classe", "ru": "Формулы · Математика 7 класс", "pt": "Fórmulas · Matemática 7.º ano"}, "topics": [{"name": {"sr": "Realni brojevi", "en": "Real Numbers", "de": "Reelle Zahlen", "fr": "Nombres réels", "es": "Números reales", "it": "Numeri reali", "ru": "Действительные числа", "pt": "Números reais"}, "theory": {"sr": "<b>Realni brojevi</b> su unija racionalnih i iracionalnih brojeva. Racionalni brojevi (ℚ) mogu se zapisati kao razlomak a/b (b≠0) — to su celi brojevi, konačni i periodični decimalni brojevi. Iracionalni brojevi se ne mogu zapisati kao razlomak; njihov decimalni zapis je beskonačan i neperiodičan, npr. √2, √3, π. Svaki realan broj ima svoje mesto na brojevnoj pravoj.", "en": "<b>Real numbers</b> are the union of rational and irrational numbers. Rational numbers (ℚ) can be written as a fraction a/b (b≠0) — these are integers, terminating and repeating decimals. Irrational numbers cannot be written as a fraction; their decimal expansion is infinite and non-repeating, e.g. √2, √3, π. Every real number has its place on the number line.", "de": "<b>Reelle Zahlen</b> sind die Vereinigung der rationalen und irrationalen Zahlen. Rationale Zahlen (ℚ) lassen sich als Bruch a/b (b≠0) schreiben — das sind ganze Zahlen, endliche und periodische Dezimalzahlen. Irrationale Zahlen lassen sich nicht als Bruch schreiben; ihre Dezimaldarstellung ist unendlich und nicht periodisch, z. B. √2, √3, π. Jede reelle Zahl hat ihren Platz auf dem Zahlenstrahl.", "fr": "<b>Les nombres réels</b> sont l'union des nombres rationnels et irrationnels. Les nombres rationnels (ℚ) s'écrivent sous forme de fraction a/b (b≠0) — ce sont les entiers, les décimaux finis et périodiques. Les nombres irrationnels ne peuvent pas s'écrire sous forme de fraction ; leur écriture décimale est infinie et non périodique, par ex. √2, √3, π. Chaque nombre réel a sa place sur la droite numérique.", "es": "<b>Los números reales</b> son la unión de los números racionales e irracionales. Los números racionales (ℚ) se pueden escribir como fracción a/b (b≠0) — son los enteros, los decimales finitos y periódicos. Los números irracionales no se pueden escribir como fracción; su expresión decimal es infinita y no periódica, por ejemplo √2, √3, π. Cada número real tiene su lugar en la recta numérica.", "it": "<b>I numeri reali</b> sono l'unione dei numeri razionali e irrazionali. I numeri razionali (ℚ) si possono scrivere come frazione a/b (b≠0) — sono i numeri interi, i decimali finiti e periodici. I numeri irrazionali non si possono scrivere come frazione; la loro scrittura decimale è infinita e non periodica, ad es. √2, √3, π. Ogni numero reale ha il proprio posto sulla retta numerica.", "ru": "<b>Действительные числа</b> — это объединение рациональных и иррациональных чисел. Рациональные числа (ℚ) можно записать в виде дроби a/b (b≠0) — это целые числа, конечные и периодические десятичные дроби. Иррациональные числа нельзя записать в виде дроби; их десятичная запись бесконечна и непериодична, например √2, √3, π. Каждое действительное число имеет своё место на числовой прямой.", "pt": "<b>Os números reais</b> são a união dos números racionais e irracionais. Os números racionais (ℚ) podem ser escritos como fração a/b (b≠0) — são os números inteiros, as dízimas finitas e periódicas. Os números irracionais não podem ser escritos como fração; a sua representação decimal é infinita e não periódica, por exemplo √2, √3, π. Cada número real tem o seu lugar na reta numérica."}, "formulas": [{"sr": "ℝ = ℚ ∪ I (realni = racionalni ∪ iracionalni)", "en": "ℝ = ℚ ∪ I (real = rational ∪ irrational)", "de": "ℝ = ℚ ∪ I (reell = rational ∪ irrational)", "fr": "ℝ = ℚ ∪ I (réel = rationnel ∪ irrationnel)", "es": "ℝ = ℚ ∪ I (real = racional ∪ irracional)", "it": "ℝ = ℚ ∪ I (reale = razionale ∪ irrazionale)", "ru": "ℝ = ℚ ∪ I (действительное = рациональное ∪ иррациональное)", "pt": "ℝ = ℚ ∪ I (real = racional ∪ irracional)"}, {"sr": "|a| = a, ako je a ≥ 0; |a| = −a, ako je a < 0", "en": "|a| = a, if a ≥ 0; |a| = −a, if a < 0", "de": "|a| = a, wenn a ≥ 0; |a| = −a, wenn a < 0", "fr": "|a| = a, si a ≥ 0 ; |a| = −a, si a < 0", "es": "|a| = a, si a ≥ 0; |a| = −a, si a < 0", "it": "|a| = a, se a ≥ 0; |a| = −a, se a < 0", "ru": "|a| = a, если a ≥ 0; |a| = −a, если a < 0", "pt": "|a| = a, se a ≥ 0; |a| = −a, se a < 0"}, {"sr": "√2 ≈ 1,41; √3 ≈ 1,73; π ≈ 3,14", "en": "√2 ≈ 1.41; √3 ≈ 1.73; π ≈ 3.14", "de": "√2 ≈ 1,41; √3 ≈ 1,73; π ≈ 3,14", "fr": "√2 ≈ 1,41 ; √3 ≈ 1,73 ; π ≈ 3,14", "es": "√2 ≈ 1,41; √3 ≈ 1,73; π ≈ 3,14", "it": "√2 ≈ 1,41; √3 ≈ 1,73; π ≈ 3,14", "ru": "√2 ≈ 1,41; √3 ≈ 1,73; π ≈ 3,14", "pt": "√2 ≈ 1,41; √3 ≈ 1,73; π ≈ 3,14"}], "remember": {"sr": "Ne postoji razlomak koji tačno predstavlja iracionalan broj — možemo ga samo približno zapisati.", "en": "There is no fraction that exactly represents an irrational number — we can only write it approximately.", "de": "Es gibt keinen Bruch, der eine irrationale Zahl genau darstellt — wir können sie nur näherungsweise angeben.", "fr": "Aucune fraction ne représente exactement un nombre irrationnel — on ne peut l'écrire que de façon approximative.", "es": "No existe una fracción que represente exactamente a un número irracional — solo podemos escribirlo de forma aproximada.", "it": "Non esiste una frazione che rappresenti esattamente un numero irrazionale — possiamo scriverlo solo in modo approssimato.", "ru": "Не существует дроби, которая точно представляет иррациональное число — его можно записать лишь приближённо.", "pt": "Não existe uma fração que represente exatamente um número irracional — só podemos escrevê-lo de forma aproximada."}, "problem": {"statement": {"sr": "Odredi da li je broj √16 racionalan ili iracionalan, i uporedi brojeve √16 i √17.", "en": "Determine whether the number √16 is rational or irrational, and compare the numbers √16 and √17.", "de": "Bestimme, ob die Zahl √16 rational oder irrational ist, und vergleiche die Zahlen √16 und √17.", "fr": "Détermine si le nombre √16 est rationnel ou irrationnel, et compare les nombres √16 et √17.", "es": "Determina si el número √16 es racional o irracional, y compara los números √16 y √17.", "it": "Determina se il numero √16 è razionale o irrazionale, e confronta i numeri √16 e √17.", "ru": "Определи, является ли число √16 рациональным или иррациональным, и сравни числа √16 и √17.", "pt": "Determina se o número √16 é racional ou irracional, e compara os números √16 e √17."}, "steps": [{"sr": "√16 = 4, jer je 4² = 16 → 4 je prirodan broj, pa je √16 racionalan.", "en": "√16 = 4, since 4² = 16 → 4 is a natural number, so √16 is rational.", "de": "√16 = 4, da 4² = 16 → 4 ist eine natürliche Zahl, also ist √16 rational.", "fr": "√16 = 4, car 4² = 16 → 4 est un nombre naturel, donc √16 est rationnel.", "es": "√16 = 4, ya que 4² = 16 → 4 es un número natural, por lo que √16 es racional.", "it": "√16 = 4, poiché 4² = 16 → 4 è un numero naturale, quindi √16 è razionale.", "ru": "√16 = 4, так как 4² = 16 → 4 является натуральным числом, значит √16 рационально.", "pt": "√16 = 4, pois 4² = 16 → 4 é um número natural, logo √16 é racional."}, {"sr": "17 nije potpun kvadrat (4² = 16, 5² = 25), pa je √17 iracionalan broj, približno √17 ≈ 4,12.", "en": "17 is not a perfect square (4² = 16, 5² = 25), so √17 is irrational, approximately √17 ≈ 4.12.", "de": "17 ist keine Quadratzahl (4² = 16, 5² = 25), also ist √17 irrational, ungefähr √17 ≈ 4,12.", "fr": "17 n'est pas un carré parfait (4² = 16, 5² = 25), donc √17 est irrationnel, environ √17 ≈ 4,12.", "es": "17 no es un cuadrado perfecto (4² = 16, 5² = 25), por lo que √17 es irracional, aproximadamente √17 ≈ 4,12.", "it": "17 non è un quadrato perfetto (4² = 16, 5² = 25), quindi √17 è irrazionale, circa √17 ≈ 4,12.", "ru": "17 не является полным квадратом (4² = 16, 5² = 25), поэтому √17 иррационально, приблизительно √17 ≈ 4,12.", "pt": "17 não é um quadrado perfeito (4² = 16, 5² = 25), logo √17 é irracional, aproximadamente √17 ≈ 4,12."}, {"sr": "Pošto je 16 < 17, sledi √16 < √17, tj. 4 < √17.", "en": "Since 16 < 17, it follows that √16 < √17, i.e. 4 < √17.", "de": "Da 16 < 17 ist, folgt √16 < √17, d. h. 4 < √17.", "fr": "Puisque 16 < 17, on a √16 < √17, c'est-à-dire 4 < √17.", "es": "Como 16 < 17, se sigue que √16 < √17, es decir, 4 < √17.", "it": "Poiché 16 < 17, segue che √16 < √17, cioè 4 < √17.", "ru": "Так как 16 < 17, следует, что √16 < √17, то есть 4 < √17.", "pt": "Como 16 < 17, segue que √16 < √17, ou seja, 4 < √17."}]}}, {"name": {"sr": "Stepenovanje", "en": "Powers", "de": "Potenzen", "fr": "Puissances", "es": "Potenciación", "it": "Potenze", "ru": "Степени", "pt": "Potenciação"}, "theory": {"sr": "<b>Stepen</b> aᵐ predstavlja proizvod broja a (osnove) samog sa sobom m puta (izložilac m). Za množenje stepena iste osnove izložioci se sabiraju, a za deljenje oduzimaju. Stepen stepena se dobija množenjem izložilaca. Svaki broj različit od nule na nulti stepen jednak je 1, a negativan izložilac daje recipročnu vrednost.", "en": "<b>A power</b> aᵐ represents the product of the number a (base) multiplied by itself m times (exponent m). When multiplying powers with the same base, the exponents are added; when dividing, they are subtracted. A power of a power is obtained by multiplying the exponents. Any nonzero number raised to the power of zero equals 1, and a negative exponent gives the reciprocal value.", "de": "<b>Eine Potenz</b> aᵐ steht für das Produkt der Zahl a (Basis), die m-mal (Exponent m) mit sich selbst multipliziert wird. Bei der Multiplikation von Potenzen mit gleicher Basis werden die Exponenten addiert, bei der Division subtrahiert. Eine Potenz einer Potenz erhält man durch Multiplikation der Exponenten. Jede von null verschiedene Zahl hoch null ergibt 1, ein negativer Exponent liefert den Kehrwert.", "fr": "<b>Une puissance</b> aᵐ représente le produit du nombre a (base) multiplié par lui-même m fois (exposant m). Pour multiplier des puissances de même base, on additionne les exposants ; pour diviser, on les soustrait. Une puissance d'une puissance s'obtient en multipliant les exposants. Tout nombre non nul élevé à la puissance zéro vaut 1, et un exposant négatif donne l'inverse.", "es": "<b>Una potencia</b> aᵐ representa el producto del número a (base) multiplicado por sí mismo m veces (exponente m). Al multiplicar potencias de igual base, los exponentes se suman; al dividir, se restan. Una potencia de una potencia se obtiene multiplicando los exponentes. Todo número distinto de cero elevado a la potencia cero es igual a 1, y un exponente negativo da el valor recíproco.", "it": "<b>Una potenza</b> aᵐ rappresenta il prodotto del numero a (base) moltiplicato per sé stesso m volte (esponente m). Nella moltiplicazione di potenze con la stessa base, gli esponenti si sommano; nella divisione si sottraggono. Una potenza di potenza si ottiene moltiplicando gli esponenti. Ogni numero diverso da zero elevato alla potenza zero è uguale a 1, e un esponente negativo dà il valore reciproco.", "ru": "<b>Степень</b> aᵐ представляет собой произведение числа a (основания), умноженного само на себя m раз (показатель степени m). При умножении степеней с одинаковым основанием показатели складываются, при делении — вычитаются. Степень степени получается умножением показателей. Любое отличное от нуля число в нулевой степени равно 1, а отрицательный показатель даёт обратную величину.", "pt": "<b>Uma potência</b> aᵐ representa o produto do número a (base) multiplicado por si mesmo m vezes (expoente m). Ao multiplicar potências de mesma base, os expoentes somam-se; ao dividir, subtraem-se. Uma potência de potência obtém-se multiplicando os expoentes. Qualquer número diferente de zero elevado a zero é igual a 1, e um expoente negativo dá o valor recíproco."}, "formulas": [{"sr": "aᵐ · aⁿ = aᵐ⁺ⁿ (množenje stepena iste osnove)", "en": "aᵐ · aⁿ = aᵐ⁺ⁿ (multiplying powers with the same base)", "de": "aᵐ · aⁿ = aᵐ⁺ⁿ (Multiplikation von Potenzen mit gleicher Basis)", "fr": "aᵐ · aⁿ = aᵐ⁺ⁿ (multiplication de puissances de même base)", "es": "aᵐ · aⁿ = aᵐ⁺ⁿ (multiplicación de potencias de igual base)", "it": "aᵐ · aⁿ = aᵐ⁺ⁿ (moltiplicazione di potenze con la stessa base)", "ru": "aᵐ · aⁿ = aᵐ⁺ⁿ (умножение степеней с одинаковым основанием)", "pt": "aᵐ · aⁿ = aᵐ⁺ⁿ (multiplicação de potências de mesma base)"}, {"sr": "aᵐ : aⁿ = aᵐ⁻ⁿ, a ≠ 0 (deljenje stepena iste osnove)", "en": "aᵐ : aⁿ = aᵐ⁻ⁿ, a ≠ 0 (dividing powers with the same base)", "de": "aᵐ : aⁿ = aᵐ⁻ⁿ, a ≠ 0 (Division von Potenzen mit gleicher Basis)", "fr": "aᵐ : aⁿ = aᵐ⁻ⁿ, a ≠ 0 (division de puissances de même base)", "es": "aᵐ : aⁿ = aᵐ⁻ⁿ, a ≠ 0 (división de potencias de igual base)", "it": "aᵐ : aⁿ = aᵐ⁻ⁿ, a ≠ 0 (divisione di potenze con la stessa base)", "ru": "aᵐ : aⁿ = aᵐ⁻ⁿ, a ≠ 0 (деление степеней с одинаковым основанием)", "pt": "aᵐ : aⁿ = aᵐ⁻ⁿ, a ≠ 0 (divisão de potências de mesma base)"}, {"sr": "(aᵐ)ⁿ = aᵐ·ⁿ (stepen stepena)", "en": "(aᵐ)ⁿ = aᵐ·ⁿ (power of a power)", "de": "(aᵐ)ⁿ = aᵐ·ⁿ (Potenz einer Potenz)", "fr": "(aᵐ)ⁿ = aᵐ·ⁿ (puissance d'une puissance)", "es": "(aᵐ)ⁿ = aᵐ·ⁿ (potencia de una potencia)", "it": "(aᵐ)ⁿ = aᵐ·ⁿ (potenza di potenza)", "ru": "(aᵐ)ⁿ = aᵐ·ⁿ (степень степени)", "pt": "(aᵐ)ⁿ = aᵐ·ⁿ (potência de potência)"}], "remember": {"sr": "a⁰ = 1 (za a ≠ 0); a⁻ⁿ = 1/aⁿ — negativan izložilac ne znači negativan broj!", "en": "a⁰ = 1 (for a ≠ 0); a⁻ⁿ = 1/aⁿ — a negative exponent does not mean a negative number!", "de": "a⁰ = 1 (für a ≠ 0); a⁻ⁿ = 1/aⁿ — ein negativer Exponent bedeutet nicht, dass die Zahl negativ ist!", "fr": "a⁰ = 1 (pour a ≠ 0) ; a⁻ⁿ = 1/aⁿ — un exposant négatif ne signifie pas un nombre négatif !", "es": "a⁰ = 1 (para a ≠ 0); a⁻ⁿ = 1/aⁿ — ¡un exponente negativo no significa un número negativo!", "it": "a⁰ = 1 (per a ≠ 0); a⁻ⁿ = 1/aⁿ — un esponente negativo non significa un numero negativo!", "ru": "a⁰ = 1 (при a ≠ 0); a⁻ⁿ = 1/aⁿ — отрицательный показатель не означает отрицательное число!", "pt": "a⁰ = 1 (para a ≠ 0); a⁻ⁿ = 1/aⁿ — um expoente negativo não significa um número negativo!"}, "problem": {"statement": {"sr": "Izračunaj vrednost izraza: 2³ · 2⁴ : 2⁵.", "en": "Calculate the value of the expression: 2³ · 2⁴ : 2⁵.", "de": "Berechne den Wert des Ausdrucks: 2³ · 2⁴ : 2⁵.", "fr": "Calcule la valeur de l'expression : 2³ · 2⁴ : 2⁵.", "es": "Calcula el valor de la expresión: 2³ · 2⁴ : 2⁵.", "it": "Calcola il valore dell'espressione: 2³ · 2⁴ : 2⁵.", "ru": "Вычисли значение выражения: 2³ · 2⁴ : 2⁵.", "pt": "Calcula o valor da expressão: 2³ · 2⁴ : 2⁵."}, "steps": [{"sr": "2³ · 2⁴ = 2³⁺⁴ = 2⁷ (sabiramo izložioce jer je osnova ista).", "en": "2³ · 2⁴ = 2³⁺⁴ = 2⁷ (we add the exponents since the base is the same).", "de": "2³ · 2⁴ = 2³⁺⁴ = 2⁷ (wir addieren die Exponenten, da die Basis gleich ist).", "fr": "2³ · 2⁴ = 2³⁺⁴ = 2⁷ (on additionne les exposants car la base est identique).", "es": "2³ · 2⁴ = 2³⁺⁴ = 2⁷ (sumamos los exponentes porque la base es la misma).", "it": "2³ · 2⁴ = 2³⁺⁴ = 2⁷ (sommiamo gli esponenti perché la base è la stessa).", "ru": "2³ · 2⁴ = 2³⁺⁴ = 2⁷ (складываем показатели, так как основание одинаковое).", "pt": "2³ · 2⁴ = 2³⁺⁴ = 2⁷ (somamos os expoentes porque a base é a mesma)."}, {"sr": "2⁷ : 2⁵ = 2⁷⁻⁵ = 2² (oduzimamo izložioce pri deljenju).", "en": "2⁷ : 2⁵ = 2⁷⁻⁵ = 2² (we subtract the exponents when dividing).", "de": "2⁷ : 2⁵ = 2⁷⁻⁵ = 2² (bei der Division subtrahieren wir die Exponenten).", "fr": "2⁷ : 2⁵ = 2⁷⁻⁵ = 2² (on soustrait les exposants lors de la division).", "es": "2⁷ : 2⁵ = 2⁷⁻⁵ = 2² (restamos los exponentes al dividir).", "it": "2⁷ : 2⁵ = 2⁷⁻⁵ = 2² (sottraiamo gli esponenti nella divisione).", "ru": "2⁷ : 2⁵ = 2⁷⁻⁵ = 2² (при делении вычитаем показатели).", "pt": "2⁷ : 2⁵ = 2⁷⁻⁵ = 2² (subtraímos os expoentes na divisão)."}, {"sr": "2² = 4, pa je vrednost izraza 4.", "en": "2² = 4, so the value of the expression is 4.", "de": "2² = 4, also beträgt der Wert des Ausdrucks 4.", "fr": "2² = 4, donc la valeur de l'expression est 4.", "es": "2² = 4, por lo que el valor de la expresión es 4.", "it": "2² = 4, quindi il valore dell'espressione è 4.", "ru": "2² = 4, значит значение выражения равно 4.", "pt": "2² = 4, logo o valor da expressão é 4."}]}}, {"name": {"sr": "Algebarski izrazi", "en": "Algebraic Expressions", "de": "Algebraische Ausdrücke", "fr": "Expressions algébriques", "es": "Expresiones algebraicas", "it": "Espressioni algebriche", "ru": "Алгебраические выражения", "pt": "Expressões algébricas"}, "theory": {"sr": "<b>Algebarski izraz</b> sadrži brojeve, slova (promenljive) i računske operacije. Monomi su izrazi oblika broj·slova (npr. 3x²), a polinom je zbir monoma. Sabiranje i oduzimanje polinoma vrši se sabiranjem/oduzimanjem sličnih članova (isti stepen iste promenljive), dok se množenje vrši primenom distributivnog zakona. Skraćeno množenje koristi obrasce za kvadrat zbira i razlike.", "en": "<b>An algebraic expression</b> contains numbers, letters (variables) and arithmetic operations. Monomials are expressions of the form number·letters (e.g. 3x²), and a polynomial is a sum of monomials. Adding and subtracting polynomials is done by combining like terms (same power of the same variable), while multiplication uses the distributive law. Special products use the formulas for the square of a sum and a difference.", "de": "<b>Ein algebraischer Ausdruck</b> enthält Zahlen, Buchstaben (Variablen) und Rechenoperationen. Monome sind Ausdrücke der Form Zahl·Buchstaben (z. B. 3x²), und ein Polynom ist eine Summe von Monomen. Addition und Subtraktion von Polynomen erfolgt durch Zusammenfassen gleichartiger Glieder (gleiche Potenz derselben Variable), während bei der Multiplikation das Distributivgesetz angewendet wird. Bei besonderen Produkten werden die Formeln für das Quadrat einer Summe und einer Differenz verwendet.", "fr": "<b>Une expression algébrique</b> contient des nombres, des lettres (variables) et des opérations arithmétiques. Les monômes sont des expressions de la forme nombre·lettres (par ex. 3x²), et un polynôme est une somme de monômes. L'addition et la soustraction de polynômes se font en regroupant les termes semblables (même puissance de la même variable), tandis que la multiplication utilise la loi de distributivité. Les identités remarquables utilisent les formules du carré d'une somme et d'une différence.", "es": "<b>Una expresión algebraica</b> contiene números, letras (variables) y operaciones aritméticas. Los monomios son expresiones de la forma número·letras (por ejemplo 3x²), y un polinomio es una suma de monomios. La suma y resta de polinomios se realiza agrupando los términos semejantes (misma potencia de la misma variable), mientras que la multiplicación usa la propiedad distributiva. Los productos notables usan las fórmulas del cuadrado de una suma y de una diferencia.", "it": "<b>Un'espressione algebrica</b> contiene numeri, lettere (variabili) e operazioni aritmetiche. I monomi sono espressioni della forma numero·lettere (ad es. 3x²), e un polinomio è una somma di monomi. L'addizione e la sottrazione di polinomi si eseguono raggruppando i termini simili (stessa potenza della stessa variabile), mentre la moltiplicazione utilizza la proprietà distributiva. I prodotti notevoli usano le formule del quadrato di una somma e di una differenza.", "ru": "<b>Алгебраическое выражение</b> содержит числа, буквы (переменные) и арифметические операции. Одночлены — это выражения вида число·буквы (например, 3x²), а многочлен — сумма одночленов. Сложение и вычитание многочленов выполняется приведением подобных слагаемых (одинаковая степень одной и той же переменной), а умножение — по распределительному закону. Формулы сокращённого умножения используют квадрат суммы и разности.", "pt": "<b>Uma expressão algébrica</b> contém números, letras (variáveis) e operações aritméticas. Os monómios são expressões da forma número·letras (por exemplo 3x²), e um polinómio é uma soma de monómios. A soma e a subtração de polinómios fazem-se agrupando os termos semelhantes (mesma potência da mesma variável), enquanto a multiplicação usa a propriedade distributiva. Os produtos notáveis usam as fórmulas do quadrado da soma e da diferença."}, "formulas": [{"sr": "(a+b)² = a² + 2ab + b² (kvadrat zbira)", "en": "(a+b)² = a² + 2ab + b² (square of a sum)", "de": "(a+b)² = a² + 2ab + b² (Quadrat einer Summe)", "fr": "(a+b)² = a² + 2ab + b² (carré d'une somme)", "es": "(a+b)² = a² + 2ab + b² (cuadrado de una suma)", "it": "(a+b)² = a² + 2ab + b² (quadrato di una somma)", "ru": "(a+b)² = a² + 2ab + b² (квадрат суммы)", "pt": "(a+b)² = a² + 2ab + b² (quadrado da soma)"}, {"sr": "(a−b)² = a² − 2ab + b² (kvadrat razlike)", "en": "(a−b)² = a² − 2ab + b² (square of a difference)", "de": "(a−b)² = a² − 2ab + b² (Quadrat einer Differenz)", "fr": "(a−b)² = a² − 2ab + b² (carré d'une différence)", "es": "(a−b)² = a² − 2ab + b² (cuadrado de una diferencia)", "it": "(a−b)² = a² − 2ab + b² (quadrato di una differenza)", "ru": "(a−b)² = a² − 2ab + b² (квадрат разности)", "pt": "(a−b)² = a² − 2ab + b² (quadrado da diferença)"}, {"sr": "(a+b)(a−b) = a² − b² (razlika kvadrata)", "en": "(a+b)(a−b) = a² − b² (difference of squares)", "de": "(a+b)(a−b) = a² − b² (Differenz von Quadraten)", "fr": "(a+b)(a−b) = a² − b² (différence de carrés)", "es": "(a+b)(a−b) = a² − b² (diferencia de cuadrados)", "it": "(a+b)(a−b) = a² − b² (differenza di quadrati)", "ru": "(a+b)(a−b) = a² − b² (разность квадратов)", "pt": "(a+b)(a−b) = a² − b² (diferença de quadrados)"}], "remember": {"sr": "Slični sabirci imaju istu promenljivu na isti stepen — samo tada se njihovi koeficijenti sabiraju.", "en": "Like terms have the same variable raised to the same power — only then can their coefficients be added.", "de": "Gleichartige Glieder haben dieselbe Variable in derselben Potenz — nur dann können ihre Koeffizienten addiert werden.", "fr": "Les termes semblables ont la même variable élevée à la même puissance — seulement alors leurs coefficients peuvent être additionnés.", "es": "Los términos semejantes tienen la misma variable elevada a la misma potencia — solo entonces se pueden sumar sus coeficientes.", "it": "I termini simili hanno la stessa variabile elevata alla stessa potenza — solo allora i loro coefficienti possono essere sommati.", "ru": "Подобные слагаемые имеют одну и ту же переменную в одной и той же степени — только тогда их коэффициенты можно складывать.", "pt": "Os termos semelhantes têm a mesma variável elevada à mesma potência — só então os seus coeficientes podem ser somados."}, "problem": {"statement": {"sr": "Uprosti izraz: (x + 3)² − (x − 3)².", "en": "Simplify the expression: (x + 3)² − (x − 3)².", "de": "Vereinfache den Ausdruck: (x + 3)² − (x − 3)².", "fr": "Simplifie l'expression : (x + 3)² − (x − 3)².", "es": "Simplifica la expresión: (x + 3)² − (x − 3)².", "it": "Semplifica l'espressione: (x + 3)² − (x − 3)².", "ru": "Упрости выражение: (x + 3)² − (x − 3)².", "pt": "Simplifica a expressão: (x + 3)² − (x − 3)²."}, "steps": [{"sr": "(x+3)² = x² + 6x + 9, a (x−3)² = x² − 6x + 9 (koristimo formule kvadrata zbira i razlike).", "en": "(x+3)² = x² + 6x + 9, and (x−3)² = x² − 6x + 9 (using the formulas for the square of a sum and a difference).", "de": "(x+3)² = x² + 6x + 9, und (x−3)² = x² − 6x + 9 (unter Verwendung der Formeln für das Quadrat einer Summe und einer Differenz).", "fr": "(x+3)² = x² + 6x + 9, et (x−3)² = x² − 6x + 9 (en utilisant les formules du carré d'une somme et d'une différence).", "es": "(x+3)² = x² + 6x + 9, y (x−3)² = x² − 6x + 9 (usando las fórmulas del cuadrado de una suma y una diferencia).", "it": "(x+3)² = x² + 6x + 9, e (x−3)² = x² − 6x + 9 (usando le formule del quadrato di una somma e di una differenza).", "ru": "(x+3)² = x² + 6x + 9, а (x−3)² = x² − 6x + 9 (используем формулы квадрата суммы и разности).", "pt": "(x+3)² = x² + 6x + 9, e (x−3)² = x² − 6x + 9 (usando as fórmulas do quadrado da soma e da diferença)."}, {"sr": "(x² + 6x + 9) − (x² − 6x + 9) = x² + 6x + 9 − x² + 6x − 9.", "en": "(x² + 6x + 9) − (x² − 6x + 9) = x² + 6x + 9 − x² + 6x − 9.", "de": "(x² + 6x + 9) − (x² − 6x + 9) = x² + 6x + 9 − x² + 6x − 9.", "fr": "(x² + 6x + 9) − (x² − 6x + 9) = x² + 6x + 9 − x² + 6x − 9.", "es": "(x² + 6x + 9) − (x² − 6x + 9) = x² + 6x + 9 − x² + 6x − 9.", "it": "(x² + 6x + 9) − (x² − 6x + 9) = x² + 6x + 9 − x² + 6x − 9.", "ru": "(x² + 6x + 9) − (x² − 6x + 9) = x² + 6x + 9 − x² + 6x − 9.", "pt": "(x² + 6x + 9) − (x² − 6x + 9) = x² + 6x + 9 − x² + 6x − 9."}, {"sr": "Nakon sređivanja x² i 9 se poništavaju, ostaje 6x + 6x = 12x.", "en": "After simplifying, x² and 9 cancel out, leaving 6x + 6x = 12x.", "de": "Nach dem Vereinfachen heben sich x² und 9 auf, es bleibt 6x + 6x = 12x.", "fr": "Après simplification, x² et 9 s'annulent, il reste 6x + 6x = 12x.", "es": "Tras simplificar, x² y 9 se cancelan, quedando 6x + 6x = 12x.", "it": "Dopo la semplificazione, x² e 9 si annullano, rimane 6x + 6x = 12x.", "ru": "После упрощения x² и 9 сокращаются, остаётся 6x + 6x = 12x.", "pt": "Após simplificar, x² e 9 cancelam-se, restando 6x + 6x = 12x."}]}}, {"name": {"sr": "Pitagorina teorema", "en": "Pythagorean Theorem", "de": "Satz des Pythagoras", "fr": "Théorème de Pythagore", "es": "Teorema de Pitágoras", "it": "Teorema di Pitagora", "ru": "Теорема Пифагора", "pt": "Teorema de Pitágoras"}, "theory": {"sr": "<b>Pitagorina teorema</b> povezuje stranice pravouglog trougla: zbir kvadrata kateta jednak je kvadratu hipotenuze. Kateta je stranica uz prav ugao, a hipotenuza je stranica naspram pravog ugla (najduža stranica). Teorema se koristi za izračunavanje nepoznate stranice kada su poznate ostale dve, kao i u mnogim geometrijskim i praktičnim problemima.", "en": "<b>The Pythagorean theorem</b> relates the sides of a right triangle: the sum of the squares of the legs equals the square of the hypotenuse. A leg is a side adjacent to the right angle, and the hypotenuse is the side opposite the right angle (the longest side). The theorem is used to calculate an unknown side when the other two are known, as well as in many geometric and practical problems.", "de": "<b>Der Satz des Pythagoras</b> verbindet die Seiten eines rechtwinkligen Dreiecks: Die Summe der Kathetenquadrate ist gleich dem Quadrat der Hypotenuse. Eine Kathete ist eine Seite am rechten Winkel, die Hypotenuse ist die dem rechten Winkel gegenüberliegende Seite (die längste Seite). Der Satz wird verwendet, um eine unbekannte Seite zu berechnen, wenn die anderen beiden bekannt sind, sowie in vielen geometrischen und praktischen Problemen.", "fr": "<b>Le théorème de Pythagore</b> relie les côtés d'un triangle rectangle : la somme des carrés des cathètes est égale au carré de l'hypoténuse. Une cathète est un côté adjacent à l'angle droit, et l'hypoténuse est le côté opposé à l'angle droit (le côté le plus long). Le théorème sert à calculer un côté inconnu lorsque les deux autres sont connus, ainsi que dans de nombreux problèmes géométriques et pratiques.", "es": "<b>El teorema de Pitágoras</b> relaciona los lados de un triángulo rectángulo: la suma de los cuadrados de los catetos es igual al cuadrado de la hipotenusa. Un cateto es un lado adyacente al ángulo recto, y la hipotenusa es el lado opuesto al ángulo recto (el lado más largo). El teorema se usa para calcular un lado desconocido cuando se conocen los otros dos, así como en muchos problemas geométricos y prácticos.", "it": "<b>Il teorema di Pitagora</b> collega i lati di un triangolo rettangolo: la somma dei quadrati dei cateti è uguale al quadrato dell'ipotenusa. Un cateto è un lato adiacente all'angolo retto, e l'ipotenusa è il lato opposto all'angolo retto (il lato più lungo). Il teorema serve a calcolare un lato sconosciuto quando gli altri due sono noti, oltre che in molti problemi geometrici e pratici.", "ru": "<b>Теорема Пифагора</b> связывает стороны прямоугольного треугольника: сумма квадратов катетов равна квадрату гипотенузы. Катет — это сторона, прилежащая к прямому углу, а гипотенуза — сторона, противоположная прямому углу (самая длинная сторона). Теорема используется для вычисления неизвестной стороны, когда известны две другие, а также во многих геометрических и практических задачах.", "pt": "<b>O teorema de Pitágoras</b> relaciona os lados de um triângulo retângulo: a soma dos quadrados dos catetos é igual ao quadrado da hipotenusa. Um cateto é um lado adjacente ao ângulo reto, e a hipotenusa é o lado oposto ao ângulo reto (o lado mais longo). O teorema é usado para calcular um lado desconhecido quando os outros dois são conhecidos, bem como em muitos problemas geométricos e práticos."}, "formulas": [{"sr": "c² = a² + b² (c je hipotenuza, a i b su katete)", "en": "c² = a² + b² (c is the hypotenuse, a and b are the legs)", "de": "c² = a² + b² (c ist die Hypotenuse, a und b sind die Katheten)", "fr": "c² = a² + b² (c est l'hypoténuse, a et b sont les cathètes)", "es": "c² = a² + b² (c es la hipotenusa, a y b son los catetos)", "it": "c² = a² + b² (c è l'ipotenusa, a e b sono i cateti)", "ru": "c² = a² + b² (c — гипотенуза, a и b — катеты)", "pt": "c² = a² + b² (c é a hipotenusa, a e b são os catetos)"}, {"sr": "a = √(c² − b²) (izračunavanje katete)", "en": "a = √(c² − b²) (calculating a leg)", "de": "a = √(c² − b²) (Berechnung einer Kathete)", "fr": "a = √(c² − b²) (calcul d'une cathète)", "es": "a = √(c² − b²) (cálculo de un cateto)", "it": "a = √(c² − b²) (calcolo di un cateto)", "ru": "a = √(c² − b²) (вычисление катета)", "pt": "a = √(c² − b²) (cálculo de um cateto)"}, {"sr": "c = √(a² + b²) (izračunavanje hipotenuze)", "en": "c = √(a² + b²) (calculating the hypotenuse)", "de": "c = √(a² + b²) (Berechnung der Hypotenuse)", "fr": "c = √(a² + b²) (calcul de l'hypoténuse)", "es": "c = √(a² + b²) (cálculo de la hipotenusa)", "it": "c = √(a² + b²) (calcolo dell'ipotenusa)", "ru": "c = √(a² + b²) (вычисление гипотенузы)", "pt": "c = √(a² + b²) (cálculo da hipotenusa)"}], "remember": {"sr": "Hipotenuza je uvek najduža stranica pravouglog trougla i nalazi se naspram pravog ugla.", "en": "The hypotenuse is always the longest side of a right triangle and lies opposite the right angle.", "de": "Die Hypotenuse ist stets die längste Seite eines rechtwinkligen Dreiecks und liegt dem rechten Winkel gegenüber.", "fr": "L'hypoténuse est toujours le côté le plus long d'un triangle rectangle et se trouve en face de l'angle droit.", "es": "La hipotenusa es siempre el lado más largo de un triángulo rectángulo y se encuentra opuesta al ángulo recto.", "it": "L'ipotenusa è sempre il lato più lungo di un triangolo rettangolo e si trova di fronte all'angolo retto.", "ru": "Гипотенуза всегда является самой длинной стороной прямоугольного треугольника и лежит напротив прямого угла.", "pt": "A hipotenusa é sempre o lado mais longo de um triângulo retângulo e situa-se em frente ao ângulo reto."}, "problem": {"statement": {"sr": "Katete pravouglog trougla su 6 cm i 8 cm. Izračunaj dužinu hipotenuze.", "en": "The legs of a right triangle are 6 cm and 8 cm. Calculate the length of the hypotenuse.", "de": "Die Katheten eines rechtwinkligen Dreiecks sind 6 cm und 8 cm. Berechne die Länge der Hypotenuse.", "fr": "Les cathètes d'un triangle rectangle mesurent 6 cm et 8 cm. Calcule la longueur de l'hypoténuse.", "es": "Los catetos de un triángulo rectángulo son 6 cm y 8 cm. Calcula la longitud de la hipotenusa.", "it": "I cateti di un triangolo rettangolo sono 6 cm e 8 cm. Calcola la lunghezza dell'ipotenusa.", "ru": "Катеты прямоугольного треугольника равны 6 см и 8 см. Вычисли длину гипотенузы.", "pt": "Os catetos de um triângulo retângulo são 6 cm e 8 cm. Calcula o comprimento da hipotenusa."}, "steps": [{"sr": "Primenimo formulu c² = a² + b², gde je a = 6 cm, b = 8 cm.", "en": "We apply the formula c² = a² + b², where a = 6 cm, b = 8 cm.", "de": "Wir wenden die Formel c² = a² + b² an, wobei a = 6 cm, b = 8 cm.", "fr": "On applique la formule c² = a² + b², où a = 6 cm, b = 8 cm.", "es": "Aplicamos la fórmula c² = a² + b², donde a = 6 cm, b = 8 cm.", "it": "Applichiamo la formula c² = a² + b², dove a = 6 cm, b = 8 cm.", "ru": "Применим формулу c² = a² + b², где a = 6 см, b = 8 см.", "pt": "Aplicamos a fórmula c² = a² + b², onde a = 6 cm, b = 8 cm."}, {"sr": "c² = 6² + 8² = 36 + 64 = 100.", "en": "c² = 6² + 8² = 36 + 64 = 100.", "de": "c² = 6² + 8² = 36 + 64 = 100.", "fr": "c² = 6² + 8² = 36 + 64 = 100.", "es": "c² = 6² + 8² = 36 + 64 = 100.", "it": "c² = 6² + 8² = 36 + 64 = 100.", "ru": "c² = 6² + 8² = 36 + 64 = 100.", "pt": "c² = 6² + 8² = 36 + 64 = 100."}, {"sr": "c = √100 = 10 cm. Hipotenuza je duga 10 cm.", "en": "c = √100 = 10 cm. The hypotenuse is 10 cm long.", "de": "c = √100 = 10 cm. Die Hypotenuse ist 10 cm lang.", "fr": "c = √100 = 10 cm. L'hypoténuse mesure 10 cm.", "es": "c = √100 = 10 cm. La hipotenusa mide 10 cm.", "it": "c = √100 = 10 cm. L'ipotenusa è lunga 10 cm.", "ru": "c = √100 = 10 см. Гипотенуза равна 10 см.", "pt": "c = √100 = 10 cm. A hipotenusa tem 10 cm de comprimento."}]}}, {"name": {"sr": "Mnogougao", "en": "Polygon", "de": "Vieleck", "fr": "Polygone", "es": "Polígono", "it": "Poligono", "ru": "Многоугольник", "pt": "Polígono"}, "theory": {"sr": "<b>Mnogougao</b> je geometrijska figura ograničena sa n duži (stranica) koje se povezuju u temenima. Zbir unutrašnjih uglova mnogougla zavisi od broja stranica. Pravilan mnogougao ima sve stranice i sve uglove jednake. Dijagonala mnogougla je duž koja spaja dva nesusedna temena.", "en": "<b>A polygon</b> is a geometric figure bounded by n line segments (sides) that meet at vertices. The sum of the interior angles of a polygon depends on the number of sides. A regular polygon has all sides and all angles equal. A diagonal of a polygon is a segment connecting two non-adjacent vertices.", "de": "<b>Ein Vieleck</b> ist eine geometrische Figur, die von n Strecken (Seiten) begrenzt wird, die sich in Eckpunkten treffen. Die Summe der Innenwinkel eines Vielecks hängt von der Anzahl der Seiten ab. Ein regelmäßiges Vieleck hat alle Seiten und alle Winkel gleich. Eine Diagonale eines Vielecks ist eine Strecke, die zwei nicht benachbarte Eckpunkte verbindet.", "fr": "<b>Un polygone</b> est une figure géométrique délimitée par n segments (côtés) qui se rejoignent aux sommets. La somme des angles intérieurs d'un polygone dépend du nombre de côtés. Un polygone régulier a tous ses côtés et tous ses angles égaux. Une diagonale d'un polygone est un segment reliant deux sommets non adjacents.", "es": "<b>Un polígono</b> es una figura geométrica delimitada por n segmentos (lados) que se unen en vértices. La suma de los ángulos interiores de un polígono depende del número de lados. Un polígono regular tiene todos los lados y todos los ángulos iguales. Una diagonal de un polígono es un segmento que une dos vértices no adyacentes.", "it": "<b>Un poligono</b> è una figura geometrica delimitata da n segmenti (lati) che si incontrano nei vertici. La somma degli angoli interni di un poligono dipende dal numero dei lati. Un poligono regolare ha tutti i lati e tutti gli angoli uguali. Una diagonale di un poligono è un segmento che collega due vertici non adiacenti.", "ru": "<b>Многоугольник</b> — это геометрическая фигура, ограниченная n отрезками (сторонами), соединяющимися в вершинах. Сумма внутренних углов многоугольника зависит от числа сторон. Правильный многоугольник имеет все стороны и все углы равными. Диагональ многоугольника — это отрезок, соединяющий две несмежные вершины.", "pt": "<b>Um polígono</b> é uma figura geométrica delimitada por n segmentos (lados) que se unem em vértices. A soma dos ângulos internos de um polígono depende do número de lados. Um polígono regular tem todos os lados e todos os ângulos iguais. Uma diagonal de um polígono é um segmento que liga dois vértices não adjacentes."}, "formulas": [{"sr": "Zbir uglova = (n − 2) · 180° (n je broj stranica)", "en": "Sum of angles = (n − 2) · 180° (n is the number of sides)", "de": "Winkelsumme = (n − 2) · 180° (n ist die Anzahl der Seiten)", "fr": "Somme des angles = (n − 2) · 180° (n est le nombre de côtés)", "es": "Suma de ángulos = (n − 2) · 180° (n es el número de lados)", "it": "Somma degli angoli = (n − 2) · 180° (n è il numero dei lati)", "ru": "Сумма углов = (n − 2) · 180° (n — число сторон)", "pt": "Soma dos ângulos = (n − 2) · 180° (n é o número de lados)"}, {"sr": "Broj dijagonala d = n(n − 3) / 2", "en": "Number of diagonals d = n(n − 3) / 2", "de": "Anzahl der Diagonalen d = n(n − 3) / 2", "fr": "Nombre de diagonales d = n(n − 3) / 2", "es": "Número de diagonales d = n(n − 3) / 2", "it": "Numero di diagonali d = n(n − 3) / 2", "ru": "Число диагоналей d = n(n − 3) / 2", "pt": "Número de diagonais d = n(n − 3) / 2"}], "remember": {"sr": "Kod pravilnog mnogougla svaki unutrašnji ugao iznosi (n − 2) · 180° / n.", "en": "In a regular polygon, each interior angle equals (n − 2) · 180° / n.", "de": "Bei einem regelmäßigen Vieleck beträgt jeder Innenwinkel (n − 2) · 180° / n.", "fr": "Dans un polygone régulier, chaque angle intérieur vaut (n − 2) · 180° / n.", "es": "En un polígono regular, cada ángulo interior mide (n − 2) · 180° / n.", "it": "In un poligono regolare, ogni angolo interno misura (n − 2) · 180° / n.", "ru": "В правильном многоугольнике каждый внутренний угол равен (n − 2) · 180° / n.", "pt": "Num polígono regular, cada ângulo interno mede (n − 2) · 180° / n."}, "problem": {"statement": {"sr": "Izračunaj zbir unutrašnjih uglova šestougla i veličinu jednog ugla ako je šestougao pravilan.", "en": "Calculate the sum of the interior angles of a hexagon and the size of one angle if the hexagon is regular.", "de": "Berechne die Summe der Innenwinkel eines Sechsecks und die Größe eines Winkels, wenn das Sechseck regelmäßig ist.", "fr": "Calcule la somme des angles intérieurs d'un hexagone et la mesure d'un angle si l'hexagone est régulier.", "es": "Calcula la suma de los ángulos interiores de un hexágono y la medida de un ángulo si el hexágono es regular.", "it": "Calcola la somma degli angoli interni di un esagono e la misura di un angolo se l'esagono è regolare.", "ru": "Вычисли сумму внутренних углов шестиугольника и величину одного угла, если шестиугольник правильный.", "pt": "Calcula a soma dos ângulos internos de um hexágono e a medida de um ângulo se o hexágono for regular."}, "steps": [{"sr": "Šestougao ima n = 6 stranica, pa je zbir uglova (6 − 2) · 180° = 4 · 180° = 720°.", "en": "A hexagon has n = 6 sides, so the sum of angles is (6 − 2) · 180° = 4 · 180° = 720°.", "de": "Ein Sechseck hat n = 6 Seiten, also ist die Winkelsumme (6 − 2) · 180° = 4 · 180° = 720°.", "fr": "Un hexagone a n = 6 côtés, donc la somme des angles est (6 − 2) · 180° = 4 · 180° = 720°.", "es": "Un hexágono tiene n = 6 lados, por lo que la suma de ángulos es (6 − 2) · 180° = 4 · 180° = 720°.", "it": "Un esagono ha n = 6 lati, quindi la somma degli angoli è (6 − 2) · 180° = 4 · 180° = 720°.", "ru": "У шестиугольника n = 6 сторон, поэтому сумма углов равна (6 − 2) · 180° = 4 · 180° = 720°.", "pt": "Um hexágono tem n = 6 lados, logo a soma dos ângulos é (6 − 2) · 180° = 4 · 180° = 720°."}, {"sr": "Kod pravilnog šestougla svi uglovi su jednaki, pa jedan ugao iznosi 720° : 6 = 120°.", "en": "In a regular hexagon all angles are equal, so one angle equals 720° : 6 = 120°.", "de": "Bei einem regelmäßigen Sechseck sind alle Winkel gleich, also beträgt ein Winkel 720° : 6 = 120°.", "fr": "Dans un hexagone régulier, tous les angles sont égaux, donc un angle vaut 720° : 6 = 120°.", "es": "En un hexágono regular todos los ángulos son iguales, por lo que un ángulo mide 720° : 6 = 120°.", "it": "In un esagono regolare tutti gli angoli sono uguali, quindi un angolo misura 720° : 6 = 120°.", "ru": "В правильном шестиугольнике все углы равны, поэтому один угол составляет 720° : 6 = 120°.", "pt": "Num hexágono regular todos os ângulos são iguais, logo um ângulo mede 720° : 6 = 120°."}]}}, {"name": {"sr": "Krug", "en": "Circle", "de": "Kreis", "fr": "Cercle", "es": "Círculo", "it": "Cerchio", "ru": "Окружность", "pt": "Círculo"}, "theory": {"sr": "<b>Krug</b> je skup svih tačaka ravni koje su na istom rastojanju (poluprečniku r) od jedne tačke — centra. Kružnica je linija koja ograničava krug, dok je krug ceo deo ravni unutar nje. Obim kruga predstavlja dužinu kružnice, a površina kruga meri deo ravni koji zatvara. Broj π (pi) je odnos obima i prečnika bilo kog kruga i približno iznosi 3,14.", "en": "<b>A circle</b> is the set of all points in a plane that are the same distance (radius r) from one point — the center. The circumference is the line that bounds the circle, while the disk is the entire region of the plane inside it. The perimeter (circumference length) is the length of that boundary line, and the area measures the region of the plane it encloses. The number π (pi) is the ratio of the circumference to the diameter of any circle and is approximately 3.14.", "de": "<b>Ein Kreis</b> ist die Menge aller Punkte einer Ebene, die vom selben Punkt — dem Mittelpunkt — den gleichen Abstand (Radius r) haben. Die Kreislinie begrenzt die Kreisfläche, während die Kreisfläche der gesamte Teil der Ebene innerhalb dieser Linie ist. Der Umfang ist die Länge der Kreislinie, und der Flächeninhalt misst den von ihr eingeschlossenen Teil der Ebene. Die Zahl π (Pi) ist das Verhältnis von Umfang zu Durchmesser eines beliebigen Kreises und beträgt ungefähr 3,14.", "fr": "<b>Un cercle</b> est l'ensemble de tous les points d'un plan situés à la même distance (rayon r) d'un point — le centre. La circonférence est la ligne qui délimite le disque, tandis que le disque est toute la partie du plan à l'intérieur. Le périmètre est la longueur de cette ligne, et l'aire mesure la partie du plan qu'elle enferme. Le nombre π (pi) est le rapport entre la circonférence et le diamètre de n'importe quel cercle et vaut environ 3,14.", "es": "<b>Un círculo</b> es el conjunto de todos los puntos de un plano que están a la misma distancia (radio r) de un punto — el centro. La circunferencia es la línea que delimita el círculo, mientras que el círculo es toda la parte del plano dentro de ella. El perímetro es la longitud de esa línea, y el área mide la parte del plano que encierra. El número π (pi) es la razón entre la circunferencia y el diámetro de cualquier círculo y es aproximadamente 3,14.", "it": "<b>Un cerchio</b> è l'insieme di tutti i punti di un piano che si trovano alla stessa distanza (raggio r) da un punto — il centro. La circonferenza è la linea che delimita il cerchio, mentre il cerchio è l'intera parte di piano al suo interno. Il perimetro è la lunghezza di questa linea, e l'area misura la parte di piano che racchiude. Il numero π (pi greco) è il rapporto tra la circonferenza e il diametro di qualsiasi cerchio ed è circa 3,14.", "ru": "<b>Окружность</b> — это множество всех точек плоскости, находящихся на одинаковом расстоянии (радиус r) от одной точки — центра. Окружность — это линия, ограничивающая круг, а круг — это вся часть плоскости внутри неё. Длина окружности — это длина этой линии, а площадь измеряет часть плоскости, которую она охватывает. Число π (пи) — это отношение длины окружности к диаметру любой окружности, приблизительно равное 3,14.", "pt": "<b>Um círculo</b> é o conjunto de todos os pontos de um plano que estão à mesma distância (raio r) de um ponto — o centro. A circunferência é a linha que delimita o círculo, enquanto o círculo é toda a parte do plano no seu interior. O perímetro é o comprimento dessa linha, e a área mede a parte do plano que ela encerra. O número π (pi) é a razão entre a circunferência e o diâmetro de qualquer círculo e vale aproximadamente 3,14."}, "formulas": [{"sr":  (π ≈ 3,14).", "ru": "Радиус окружности равен 5 см. Вычисли длину окружности и площадь круга (π ≈ 3,14).", "pt": "O raio de um círculo é 5 cm. Calcula o perímetro e a área do círculo (π ≈ 3,14)."}, "steps": [{"sr": "O = 2rπ = 2 · 5 · 3,14 = 31,4 cm.", "en": "O = 2rπ = 2 · 5 · 3.14 = 31.4 cm.", "de": "O = 2rπ = 2 · 5 · 3,14 = 31,4 cm.", "fr": "O = 2rπ = 2 · 5 · 3,14 = 31,4 cm.", "es": "O = 2rπ = 2 · 5 · 3,14 = 31,4 cm.", "it": "O = 2rπ = 2 · 5 · 3,14 = 31,4 cm.", "ru": "O = 2rπ = 2 · 5 · 3,14 = 31,4 см.", "pt": "O = 2rπ = 2 · 5 · 3,14 = 31,4 cm."}, {"sr": "P = r² · π = 5² · 3,14 = 25 · 3,14 = 78,5 cm².", "en": "P = r² · π = 5² · 3.14 = 25 · 3.14 = 78.5 cm².", "de": "P = r² · π = 5² · 3,14 = 25 · 3,14 = 78,5 cm².", "fr": "P = r² · π = 5² · 3,14 = 25 · 3,14 = 78,5 cm².", "es": "P = r² · π = 5² · 3,14 = 25 · 3,14 = 78,5 cm².", "it": "P = r² · π = 5² · 3,14 = 25 · 3,14 = 78,5 cm².", "ru": "P = r² · π = 5² · 3,14 = 25 · 3,14 = 78,5 см².", "pt": "P = r² · π = 5² · 3,14 = 25 · 3,14 = 78,5 cm²."}, {"sr": "Dakle, obim kruga je 31,4 cm, a površina 78,5 cm².", "en": "So the circumference of the circle is 31.4 cm, and the area is 78.5 cm².", "de": "Der Umfang des Kreises beträgt also 31,4 cm und die Fläche 78,5 cm².", "fr": "Le périmètre du cercle est donc de 31,4 cm et l'aire de 78,5 cm².", "es": "Por lo tanto, el perímetro del círculo es 31,4 cm y el área es 78,5 cm².", "it": "Quindi il perimetro del cerchio è 31,4 cm e l'area è 78,5 cm².", "ru": "Итак, длина окружности равна 31,4 см, а площадь — 78,5 см².", "pt": "Assim, o perímetro do círculo é 31,4 cm e a área é 78,5 cm²."}]}}], "C": {"tap": {"sr": "Tapni 👆", "en": "Tap 👆", "de": "Tippen 👆", "fr": "Touche 👆", "es": "Toca 👆", "it": "Tocca 👆", "ru": "Нажми 👆", "pt": "Toca 👆"}, "hint": {"sr": "Tapni karticu da vidiš formule ✨", "en": "Tap a card to see the formulas ✨", "de": "Karte antippen für die Formeln ✨", "fr": "Touche une carte pour voir les formules ✨", "es": "Toca una tarjeta para ver las fórmulas ✨", "it": "Tocca una

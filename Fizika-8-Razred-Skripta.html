<style>
:root{--cream:#FBF6EE;--ink:#5A1024;--ink2:#7A3346;--gold:#C6A05C;--goldlt:#F0DCA8;--malina:#B01E48;--malina2:#CC5E7E;--mint:#3FB98C;--muted:#8A7A80}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#43303A;min-height:100vh;
 background:radial-gradient(520px 400px at 104% -6%,#F6E1EC 0,transparent 56%),radial-gradient(500px 380px at -6% 106%,#F7ECD6 0,transparent 58%),var(--cream);overflow-x:hidden}
#fall{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}

@keyframes fl{0%{transform:translateY(-10vh) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(112vh) rotate(24deg);opacity:0}}
.wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:14px 16px 30px}
.top{display:flex;align-items:center;gap:10px;padding:4px 2px 10px}
.top .back{color:var(--ink2);text-decoration:none;font-weight:800;font-size:1.1rem}
.top .lang{margin-left:auto;border:1px solid var(--goldlt);border-radius:100px;padding:5px 10px;font-family:inherit;font-weight:800;font-size:.72rem;color:var(--ink);background:#fff}
.dots{display:flex;gap:6px;flex:1;justify-content:center}

.dots i.on{background:linear-gradient(90deg,var(--gold),var(--malina));transform:scale(1.25)}
.dots i.done{background:var(--goldlt)}
.stage{position:relative;min-height:62vh}
.card{position:relative;background:linear-gradient(180deg,#FFFDF9,#FDF3EA);border:1px solid var(--goldlt);border-radius:32px;
 padding:26px 22px 22px;box-shadow:0 30px 70px -34px rgba(90,16,36,.5);animation:slidein .45s cubic-bezier(.2,.9,.2,1)}
@keyframes slidein{0%{transform:translateX(28px) scale(.97);opacity:0}100%{transform:translateX(0) scale(1);opacity:1}}
.eyebrow{text-align:center;font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:.64rem;color:var(--malina)}
.mascot{width:82px;height:82px;margin:8px auto 4px;border-radius:50%;display:grid;place-items:center;font-size:2.6rem;background:radial-gradient(circle at 40% 34%,#FFF3F7,#F6E1EC);border:2px solid var(--goldlt);box-shadow:0 14px 28px -12px rgba(176,30,72,.4);animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.tnum{text-align:center;color:var(--muted);font-weight:800;font-size:.78rem;margin-top:6px}
.ttl{font-family:'Spectral',serif;font-weight:700;color:var(--ink);font-size:1.75rem;text-align:center;line-height:1.2;margin:2px 0 8px}

.fx{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 4px}
.fx span{display:inline-block;background:#fff;border:1px dashed var(--goldlt);border-radius:14px;padding:9px 14px;font-family:'Spectral','Cambria Math',Georgia,serif;color:var(--ink);font-size:1.05rem;animation:pop .4s both}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.zap{margin:16px auto 2px;max-width:460px;background:linear-gradient(180deg,#FFF7FA,#FBEEF2);border:1px solid #F0D6DF;border-radius:18px;padding:13px 16px;display:flex;gap:10px;align-items:flex-start}
.zap .st{font-size:1.4rem;line-height:1}
.zap p{margin:0;color:var(--ink2);font-size:.95rem;font-weight:600}
.nav{display:flex;align-items:center;gap:12px;margin-top:16px}
.nav .prev{background:none;border:none;color:var(--ink2);font-weight:800;cursor:pointer;font-size:1rem;padding:8px}
.nav .next{flex:1;border:none;cursor:pointer;background:linear-gradient(135deg,var(--malina2),var(--malina));color:#fff;font-weight:900;font-size:1.05rem;padding:14px;border-radius:100px;box-shadow:0 16px 30px -14px rgba(176,30,72,.6);transition:transform .15s}
.nav .next:hover{transform:translateY(-2px)}
.fin{text-align:center}
.fin .big{font-size:3.4rem}
.fin h2{font-family:'Spectral',serif;color:var(--ink);font-size:1.9rem;margin:4px 0}
.fin p{color:var(--ink2)}
.fin .cta{display:block;margin-top:12px;text-decoration:none;text-align:center;background:linear-gradient(135deg,var(--malina2),var(--malina));color:#fff;font-weight:900;padding:14px;border-radius:100px;box-shadow:0 16px 30px -14px rgba(176,30,72,.6)}
.fin .cta2{display:block;margin-top:10px;text-decoration:none;color:var(--ink2);font-weight:800}

#conf i{position:absolute;top:-6%;width:10px;height:14px;border-radius:2px;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(560deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
var D={"eyebrow": {"sr": "Fizika · 8. razred — Skripta", "en": "Physics · 8th grade — Study notes", "de": "Physik · 8. Klasse — Skript", "fr": "Physique · 8e année — Cours", "es": "Física · 8.º grado — Apuntes", "it": "Fisica · 8ª classe — Dispensa", "ru": "Физика · 8 класс — Конспект", "pt": "Física · 8.º ano — Apontamentos"}, "topics": [{"name": {"sr": "Elektricitet", "en": "Electricity", "de": "Elektrizität", "fr": "Électricité", "es": "Electricidad", "it": "Elettricità", "ru": "Электричество", "pt": "Eletricidade"}, "theory": {"sr": "<b>Naelektrisanje</b> je osnovno svojstvo materije. Postoje dve vrste naelektrisanja: pozitivno i negativno. Istoimena naelektrisanja se odbijaju, a raznoimena se privlače. <b>Provodnici</b> (metali) dobro provode struju, dok <b>izolatori</b> (guma, staklo) to ne čine. <b>Električna struja</b> je usmereno kretanje naelektrisanih čestica (elektrona) kroz provodnik.", "en": "<b>Electric charge</b> is a basic property of matter. There are two types of charge: positive and negative. Like charges repel, unlike charges attract. <b>Conductors</b> (metals) carry electric current well, while <b>insulators</b> (rubber, glass) do not. <b>Electric current</b> is the directed movement of charged particles (electrons) through a conductor.", "de": "<b>Elektrische Ladung</b> ist eine grundlegende Eigenschaft der Materie. Es gibt zwei Arten von Ladung: positiv und negativ. Gleichnamige Ladungen stoßen sich ab, ungleichnamige ziehen sich an. <b>Leiter</b> (Metalle) leiten den Strom gut, während <b>Isolatoren</b> (Gummi, Glas) das nicht tun. <b>Elektrischer Strom</b> ist die gerichtete Bewegung geladener Teilchen (Elektronen) durch einen Leiter.", "fr": "La <b>charge électrique</b> est une propriété fondamentale de la matière. Il existe deux types de charges : positive et négative. Les charges de même signe se repoussent, celles de signe opposé s'attirent. Les <b>conducteurs</b> (métaux) conduisent bien le courant, tandis que les <b>isolants</b> (caoutchouc, verre) ne le conduisent pas. Le <b>courant électrique</b> est le déplacement orienté de particules chargées (électrons) à travers un conducteur.", "es": "La <b>carga eléctrica</b> es una propiedad fundamental de la materia. Existen dos tipos de carga: positiva y negativa. Las cargas del mismo signo se repelen, y las de signo opuesto se atraen. Los <b>conductores</b> (metales) conducen bien la corriente, mientras que los <b>aislantes</b> (goma, vidrio) no lo hacen. La <b>corriente eléctrica</b> es el movimiento dirigido de partículas cargadas (electrones) a través de un conductor.", "it": "La <b>carica elettrica</b> è una proprietà fondamentale della materia. Esistono due tipi di carica: positiva e negativa. Le cariche dello stesso segno si respingono, quelle di segno opposto si attraggono. I <b>conduttori</b> (metalli) conducono bene la corrente, mentre gli <b>isolanti</b> (gomma, vetro) no. La <b>corrente elettrica</b> è il movimento ordinato di particelle cariche (elettroni) attraverso un conduttore.", "ru": "<b>Электрический заряд</b> — основное свойство материи. Существует два вида зарядов: положительный и отрицательный. Одноимённые заряды отталкиваются, разноимённые — притягиваются. <b>Проводники</b> (металлы) хорошо проводят ток, а <b>изоляторы</b> (резина, стекло) — нет. <b>Электрический ток</b> — это направленное движение заряженных частиц (электронов) через проводник.", "pt": "A <b>carga elétrica</b> é uma propriedade fundamental da matéria. Existem dois tipos de carga: positiva e negativa. Cargas iguais repelem-se, cargas opostas atraem-se. Os <b>condutores</b> (metais) conduzem bem a corrente, enquanto os <b>isolantes</b> (borracha, vidro) não conduzem. A <b>corrente elétrica</b> é o movimento orientado de partículas carregadas (eletrões) através de um condutor."}, "formulas": [{"sr": "I = Q/t (jačina struje)", "en": "I = Q/t (current)", "de": "I = Q/t (Stromstärke)", "fr": "I = Q/t (intensité du courant)", "es": "I = Q/t (intensidad de corriente)", "it": "I = Q/t (intensità di corrente)", "ru": "I = Q/t (сила тока)", "pt": "I = Q/t (intensidade de corrente)"}, {"sr": "P = U·I (snaga struje)", "en": "P = U·I (electric power)", "de": "P = U·I (elektrische Leistung)", "fr": "P = U·I (puissance électrique)", "es": "P = U·I (potencia eléctrica)", "it": "P = U·I (potenza elettrica)", "ru": "P = U·I (электрическая мощность)", "pt": "P = U·I (potência elétrica)"}, {"sr": "A = U·I·t (rad struje)", "en": "A = U·I·t (electric work/energy)", "de": "A = U·I·t (elektrische Arbeit)", "fr": "A = U·I·t (travail électrique)", "es": "A = U·I·t (trabajo eléctrico)", "it": "A = U·I·t (lavoro elettrico)", "ru": "A = U·I·t (работа тока)", "pt": "A = U·I·t (trabalho elétrico)"}], "remember": {"sr": "Jačina struje se meri u amperima (A), naelektrisanje u kulonima (C), a napon u voltima (V).", "en": "Current is measured in amperes (A), charge in coulombs (C), and voltage in volts (V).", "de": "Die Stromstärke wird in Ampere (A) gemessen, die Ladung in Coulomb (C) und die Spannung in Volt (V).", "fr": "L'intensité du courant se mesure en ampères (A), la charge en coulombs (C) et la tension en volts (V).", "es": "La intensidad de corriente se mide en amperios (A), la carga en culombios (C) y el voltaje en voltios (V).", "it": "L'intensità di corrente si misura in ampere (A), la carica in coulomb (C) e la tensione in volt (V).", "ru": "Сила тока измеряется в амперах (А), заряд — в кулонах (Кл), а напряжение — в вольтах (В).", "pt": "A intensidade de corrente mede-se em amperes (A), a carga em coulombs (C) e a tensão em volts (V)."}, "problem": {"statement": {"sr": "Kroz provodnik protekne naelektrisanje od 12 C za 4 s. Izračunaj jačinu struje.", "en": "A charge of 12 C flows through a conductor in 4 s. Calculate the current.", "de": "Durch einen Leiter fließt in 4 s eine Ladung von 12 C. Berechne die Stromstärke.", "fr": "Une charge de 12 C traverse un conducteur en 4 s. Calcule l'intensité du courant.", "es": "Por un conductor circula una carga de 12 C en 4 s. Calcula la intensidad de corriente.", "it": "Attraverso un conduttore passa una carica di 12 C in 4 s. Calcola l'intensità di corrente.", "ru": "Через проводник за 4 с проходит заряд 12 Кл. Вычисли силу тока.", "pt": "Através de um condutor passa uma carga de 12 C em 4 s. Calcula a intensidade de corrente."}, "steps": [{"sr": "Zapamtimo formulu: I = Q/t", "en": "Recall the formula: I = Q/t", "de": "Wir erinnern uns an die Formel: I = Q/t", "fr": "Rappelons la formule : I = Q/t", "es": "Recordamos la fórmula: I = Q/t", "it": "Ricordiamo la formula: I = Q/t", "ru": "Вспомним формулу: I = Q/t", "pt": "Recordamos a fórmula: I = Q/t"}, {"sr": "Uvrstimo vrednosti: I = 12 C / 4 s", "en": "Substitute the values: I = 12 C / 4 s", "de": "Wir setzen die Werte ein: I = 12 C / 4 s", "fr": "Remplaçons les valeurs : I = 12 C / 4 s", "es": "Sustituimos los valores: I = 12 C / 4 s", "it": "Sostituiamo i valori: I = 12 C / 4 s", "ru": "Подставим значения: I = 12 Кл / 4 с", "pt": "Substituímos os valores: I = 12 C / 4 s"}, {"sr": "Izračunamo: I = 3 A", "en": "Calculate: I = 3 A", "de": "Wir berechnen: I = 3 A", "fr": "Calculons : I = 3 A", "es": "Calculamos: I = 3 A", "it": "Calcoliamo: I = 3 A", "ru": "Вычисляем: I = 3 А", "pt": "Calculamos: I = 3 A"}]}}, {"name": {"sr": "Strujno kolo", "en": "Electric circuit", "de": "Stromkreis", "fr": "Circuit électrique", "es": "Circuito eléctrico", "it": "Circuito elettrico", "ru": "Электрическая цепь", "pt": "Circuito elétrico"}, "theory": {"sr": "<b>Strujno kolo</b> čine izvor struje, provodnici, potrošači i prekidač, povezani u zatvorenu petlju. Otpornici se mogu vezati <b>serijski</b> (jedan za drugim) ili <b>paralelno</b> (jedan pored drugog). <b>Omov zakon</b> povezuje napon, jačinu struje i otpor u kolu.", "en": "An <b>electric circuit</b> consists of a power source, conductors, loads and a switch, connected in a closed loop. Resistors can be connected in <b>series</b> (one after another) or in <b>parallel</b> (side by side). <b>Ohm's law</b> relates voltage, current and resistance in a circuit.", "de": "Ein <b>Stromkreis</b> besteht aus einer Stromquelle, Leitern, Verbrauchern und einem Schalter, die zu einer geschlossenen Schleife verbunden sind. Widerstände können in <b>Reihe</b> (hintereinander) oder <b>parallel</b> (nebeneinander) geschaltet werden. Das <b>Ohmsche Gesetz</b> verknüpft Spannung, Stromstärke und Widerstand im Stromkreis.", "fr": "Un <b>circuit électrique</b> est constitué d'une source de courant, de conducteurs, de récepteurs et d'un interrupteur, reliés en une boucle fermée. Les résistances peuvent être branchées en <b>série</b> (l'une après l'autre) ou en <b>parallèle</b> (l'une à côté de l'autre). La <b>loi d'Ohm</b> relie la tension, l'intensité du courant et la résistance dans un circuit.", "es": "Un <b>circuito eléctrico</b> está formado por una fuente de corriente, conductores, receptores y un interruptor, conectados en un lazo cerrado. Las resistencias pueden conectarse en <b>serie</b> (una tras otra) o en <b>paralelo</b> (una junto a otra). La <b>ley de Ohm</b> relaciona el voltaje, la intensidad de corriente y la resistencia en un circuito.", "it": "Un <b>circuito elettrico</b> è formato da una sorgente di corrente, conduttori, utilizzatori e un interruttore, collegati in un anello chiuso. I resistori possono essere collegati in <b>serie</b> (uno dopo l'altro) o in <b>parallelo</b> (uno accanto all'altro). La <b>legge di Ohm</b> collega tensione, intensità di corrente e resistenza in un circuito.", "ru": "<b>Электрическая цепь</b> состоит из источника тока, проводников, потребителей и выключателя, соединённых в замкнутый контур. Резисторы можно соединять <b>последовательно</b> (один за другим) или <b>параллельно</b> (рядом друг с другом). <b>Закон Ома</b> связывает напряжение, силу тока и сопротивление в цепи.", "pt": "Um <b>circuito elétrico</b> é formado por uma fonte de corrente, condutores, recetores e um interruptor, ligados num circuito fechado. As resistências podem ligar-se em <b>série</b> (uma após a outra) ou em <b>paralelo</b> (lado a lado). A <b>lei de Ohm</b> relaciona a tensão, a intensidade de corrente e a resistência num circuito."}, "formulas": [{"sr": "U = I·R (Omov zakon)", "en": "U = I·R (Ohm's law)", "de": "U = I·R (Ohmsches Gesetz)", "fr": "U = I·R (loi d'Ohm)", "es": "U = I·R (ley de Ohm)", "it": "U = I·R (legge di Ohm)", "ru": "U = I·R (закон Ома)", "pt": "U = I·R (lei de Ohm)"}, {"sr": "R = R₁ + R₂ (serijska veza)", "en": "R = R₁ + R₂ (series connection)", "de": "R = R₁ + R₂ (Reihenschaltung)", "fr": "R = R₁ + R₂ (branchement en série)", "es": "R = R₁ + R₂ (conexión en serie)", "it": "R = R₁ + R₂ (collegamento in serie)", "ru": "R = R₁ + R₂ (последовательное соединение)", "pt": "R = R₁ + R₂ (ligação em série)"}, {"sr": "1/R = 1/R₁ + 1/R₂ (paralelna veza)", "en": "1/R = 1/R₁ + 1/R₂ (parallel connection)", "de": "1/R = 1/R₁ + 1/R₂ (Parallelschaltung)", "fr": "1/R = 1/R₁ + 1/R₂ (branchement en parallèle)", "es": "1/R = 1/R₁ + 1/R₂ (conexión en paralelo)", "it": "1/R = 1/R₁ + 1/R₂ (collegamento in parallelo)", "ru": "1/R = 1/R₁ + 1/R₂ (параллельное соединение)", "pt": "1/R = 1/R₁ + 1/R₂ (ligação em paralelo)"}], "remember": {"sr": "Kod serijske veze struja je ista kroz sve otpornike, a kod paralelne veze napon je isti na svim granama.", "en": "In a series connection the current is the same through all resistors, while in a parallel connection the voltage is the same across all branches.", "de": "Bei der Reihenschaltung ist die Stromstärke durch alle Widerstände gleich, bei der Parallelschaltung ist die Spannung an allen Zweigen gleich.", "fr": "Dans un branchement en série, l'intensité du courant est la même dans toutes les résistances, tandis que dans un branchement en parallèle, la tension est la même dans toutes les branches.", "es": "En la conexión en serie, la intensidad de corriente es la misma en todas las resistencias, mientras que en la conexión en paralelo el voltaje es el mismo en todas las ramas.", "it": "Nel collegamento in serie l'intensità di corrente è la stessa in tutti i resistori, mentre nel collegamento in parallelo la tensione è la stessa in tutti i rami.", "ru": "При последовательном соединении сила тока одинакова во всех резисторах, а при параллельном — напряжение одинаково на всех ветвях.", "pt": "Na ligação em série, a intensidade de corrente é igual em todas as resistências; na ligação em paralelo, a tensão é igual em todos os ramos."}, "problem": {"statement": {"sr": "Dva otpornika R₁ = 4 Ω i R₂ = 6 Ω vezana su serijski na napon U = 20 V. Izračunaj jačinu struje u kolu.", "en": "Two resistors, R₁ = 4 Ω and R₂ = 6 Ω, are connected in series to a voltage U = 20 V. Calculate the current in the circuit.", "de": "Zwei Widerstände, R₁ = 4 Ω und R₂ = 6 Ω, sind in Reihe an eine Spannung U = 20 V angeschlossen. Berechne die Stromstärke im Stromkreis.", "fr": "Deux résistances, R₁ = 4 Ω et R₂ = 6 Ω, sont branchées en série sous une tension U = 20 V. Calcule l'intensité du courant dans le circuit.", "es": "Dos resistencias, R₁ = 4 Ω y R₂ = 6 Ω, están conectadas en serie a un voltaje U = 20 V. Calcula la intensidad de corriente en el circuito.", "it": "Due resistori, R₁ = 4 Ω e R₂ = 6 Ω, sono collegati in serie a una tensione U = 20 V. Calcola l'intensità di corrente nel circuito.", "ru": "Два резистора, R₁ = 4 Ом и R₂ = 6 Ом, соединены последовательно и подключены к напряжению U = 20 В. Вычисли силу тока в цепи.", "pt": "Duas resistências, R₁ = 4 Ω e R₂ = 6 Ω, estão ligadas em série a uma tensão U = 20 V. Calcula a intensidade de corrente no circuito."}, "steps": [{"sr": "Izračunamo ukupan otpor: R = R₁ + R₂ = 4 Ω + 6 Ω = 10 Ω", "en": "Calculate the total resistance: R = R₁ + R₂ = 4 Ω + 6 Ω = 10 Ω", "de": "Wir berechnen den Gesamtwiderstand: R = R₁ + R₂ = 4 Ω + 6 Ω = 10 Ω", "fr": "Calculons la résistance totale : R = R₁ + R₂ = 4 Ω + 6 Ω = 10 Ω", "es": "Calculamos la resistencia total: R = R₁ + R₂ = 4 Ω + 6 Ω = 10 Ω", "it": "Calcoliamo la resistenza totale: R = R₁ + R₂ = 4 Ω + 6 Ω = 10 Ω", "ru": "Вычисляем общее сопротивление: R = R₁ + R₂ = 4 Ом + 6 Ом = 10 Ом", "pt": "Calculamos a resistência total: R = R₁ + R₂ = 4 Ω + 6 Ω = 10 Ω"}, {"sr": "Primenimo Omov zakon: I = U/R", "en": "Apply Ohm's law: I = U/R", "de": "Wir wenden das Ohmsche Gesetz an: I = U/R", "fr": "Appliquons la loi d'Ohm : I = U/R", "es": "Aplicamos la ley de Ohm: I = U/R", "it": "Applichiamo la legge di Ohm: I = U/R", "ru": "Применяем закон Ома: I = U/R", "pt": "Aplicamos a lei de Ohm: I = U/R"}, {"sr": "Uvrstimo vrednosti: I = 20 V / 10 Ω", "en": "Substitute the values: I = 20 V / 10 Ω", "de": "Wir setzen die Werte ein: I = 20 V / 10 Ω", "fr": "Remplaçons les valeurs : I = 20 V / 10 Ω", "es": "Sustituimos los valores: I = 20 V / 10 Ω", "it": "Sostituiamo i valori: I = 20 V / 10 Ω", "ru": "Подставим значения: I = 20 В / 10 Ом", "pt": "Substituímos os valores: I = 20 V / 10 Ω"}, {"sr": "Izračunamo: I = 2 A", "en": "Calculate: I = 2 A", "de": "Wir berechnen: I = 2 A", "fr": "Calculons : I = 2 A", "es": "Calculamos: I = 2 A", "it": "Calcoliamo: I = 2 A", "ru": "Вычисляем: I = 2 А", "pt": "Calculamos: I = 2 A"}]}}, {"name": {"sr": "Magnetizam", "en": "Magnetism", "de": "Magnetismus", "fr": "Magnétisme", "es": "Magnetismo", "it": "Magnetismo", "ru": "Магнетизм", "pt": "Magnetismo"}, "theory": {"sr": "<b>Magnet</b> ima dva pola: severni (N) i južni (S). Istoimeni polovi se odbijaju, a raznoimeni privlače. Oko magneta postoji <b>magnetno polje</b>, koje se prikazuje magnetnim linijama sila. Provodnik kroz koji protiče struja takođe stvara magnetno polje – to je osnova <b>elektromagneta</b>.", "en": "A <b>magnet</b> has two poles: north (N) and south (S). Like poles repel, unlike poles attract. Around a magnet there is a <b>magnetic field</b>, shown by magnetic field lines. A conductor carrying current also creates a magnetic field – this is the basis of an <b>electromagnet</b>.", "de": "Ein <b>Magnet</b> hat zwei Pole: Nordpol (N) und Südpol (S). Gleichnamige Pole stoßen sich ab, ungleichnamige ziehen sich an. Um einen Magneten herum existiert ein <b>Magnetfeld</b>, das durch Feldlinien dargestellt wird. Ein stromdurchflossener Leiter erzeugt ebenfalls ein Magnetfeld – das ist die Grundlage des <b>Elektromagneten</b>.", "fr": "Un <b>aimant</b> possède deux pôles : nord (N) et sud (S). Les pôles de même nom se repoussent, ceux de noms opposés s'attirent. Autour d'un aimant existe un <b>champ magnétique</b>, représenté par des lignes de champ. Un conducteur parcouru par un courant crée lui aussi un champ magnétique – c'est le principe de <b>l'électroaimant</b>.", "es": "Un <b>imán</b> tiene dos polos: norte (N) y sur (S). Los polos del mismo nombre se repelen, y los de nombre opuesto se atraen. Alrededor de un imán existe un <b>campo magnético</b>, representado por líneas de campo. Un conductor por el que circula corriente también crea un campo magnético; esa es la base del <b>electroimán</b>.", "it": "Un <b>magnete</b> ha due poli: nord (N) e sud (S). I poli dello stesso nome si respingono, quelli di nome opposto si attraggono. Intorno a un magnete esiste un <b>campo magnetico</b>, rappresentato da linee di campo. Anche un conduttore percorso da corrente crea un campo magnetico: è questa la base dell'<b>elettromagnete</b>.", "ru": "У <b>магнита</b> есть два полюса: северный (N) и южный (S). Одноимённые полюсы отталкиваются, разноимённые — притягиваются. Вокруг магнита существует <b>магнитное поле</b>, которое изображают линиями магнитной индукции. Проводник с током также создаёт магнитное поле — на этом основан <b>электромагнит</b>.", "pt": "Um <b>íman</b> tem dois polos: norte (N) e sul (S). Polos iguais repelem-se, polos opostos atraem-se. Em torno de um íman existe um <b>campo magnético</b>, representado por linhas de campo. Um condutor percorrido por corrente também cria um campo magnético – essa é a base do <b>eletroíman</b>."}, "formulas": [{"sr": "Istoimeni polovi (N–N, S–S): odbijanje", "en": "Like poles (N–N, S–S): repulsion", "de": "Gleichnamige Pole (N–N, S–S): Abstoßung", "fr": "Pôles de même nom (N–N, S–S) : répulsion", "es": "Polos del mismo nombre (N–N, S–S): repulsión", "it": "Poli dello stesso nome (N–N, S–S): repulsione", "ru": "Одноимённые полюсы (N–N, S–S): отталкивание", "pt": "Polos iguais (N–N, S–S): repulsão"}, {"sr": "Raznoimeni polovi (N–S): privlačenje", "en": "Unlike poles (N–S): attraction", "de": "Ungleichnamige Pole (N–S): Anziehung", "fr": "Pôles de noms opposés (N–S) : attraction", "es": "Polos de nombre opuesto (N–S): atracción", "it": "Poli di nome opposto (N–S): attrazione", "ru": "Разноимённые полюсы (N–S): притяжение", "pt": "Polos opostos (N–S): atração"}], "remember": {"sr": "Elektromagnet postaje jači sa većom jačinom struje i većim brojem navojaka žice.", "en": "An electromagnet becomes stronger with a higher current and a greater number of wire coils.", "de": "Ein Elektromagnet wird stärker mit höherer Stromstärke und mehr Drahtwindungen.", "fr": "Un électroaimant devient plus fort avec une intensité de courant plus élevée et un plus grand nombre de spires.", "es": "Un electroimán se vuelve más fuerte con una mayor intensidad de corriente y un mayor número de espiras.", "it": "Un elettromagnete diventa più forte con un'intensità di corrente maggiore e un numero maggiore di spire.", "ru": "Электромагнит становится сильнее при увеличении силы тока и числа витков провода.", "pt": "Um eletroíman torna-se mais forte com uma maior intensidade de corrente e um maior número de espiras."}, "problem": {"statement": {"sr": "Objasni zašto se dva magneta okrenuta severnim polovima jedan prema drugom odbijaju.", "en": "Explain why two magnets with their north poles facing each other repel.", "de": "Erkläre, warum sich zwei Magnete, deren Nordpole einander zugewandt sind, abstoßen.", "fr": "Explique pourquoi deux aimants dont les pôles nord se font face se repoussent.", "es": "Explica por qué dos imanes con sus polos norte enfrentados se repelen.", "it": "Spiega perché due magneti con i poli nord rivolti l'uno verso l'altro si respingono.", "ru": "Объясни, почему два магнита, обращённые друг к другу северными полюсами, отталкиваются.", "pt": "Explica por que razão dois ímanes com os polos norte virados um para o outro se repelem."}, "steps": [{"sr": "Prisetimo se pravila: istoimeni polovi se odbijaju", "en": "Recall the rule: like poles repel", "de": "Wir erinnern uns an die Regel: gleichnamige Pole stoßen sich ab", "fr": "Rappelons la règle : les pôles de même nom se repoussent", "es": "Recordamos la regla: los polos del mismo nombre se repelen", "it": "Ricordiamo la regola: i poli dello stesso nome si respingono", "ru": "Вспомним правило: одноимённые полюсы отталкиваются", "pt": "Recordamos a regra: polos iguais repelem-se"}, {"sr": "Oba magneta imaju severni pol (N) okrenut jedan ka drugom", "en": "Both magnets have their north pole (N) facing each other", "de": "Beide Magnete haben ihren Nordpol (N) einander zugewandt", "fr": "Les deux aimants ont leur pôle nord (N) tourné l'un vers l'autre", "es": "Ambos imanes tienen su polo norte (N) enfrentado entre sí", "it": "Entrambi i magneti hanno il polo nord (N) rivolto l'uno verso l'altro", "ru": "Оба магнита обращены друг к другу северным полюсом (N)", "pt": "Ambos os ímanes têm o polo norte (N) virado um para o outro"}, {"sr": "Pošto su polovi istoimeni (N–N), magneti se odbijaju", "en": "Since the poles are the same (N–N), the magnets repel", "de": "Da die Pole gleichnamig sind (N–N), stoßen sich die Magnete ab", "fr": "Comme les pôles sont de même nom (N–N), les aimants se repoussent", "es": "Como los polos son del mismo nombre (N–N), los imanes se repelen", "it": "Poiché i poli sono dello stesso nome (N–N), i magneti si respingono", "ru": "Так как полюсы одноимённые (N–N), магниты отталкиваются", "pt": "Como os polos são iguais (N–N), os ímanes repelem-se"}]}}, {"name": {"sr": "Indukcija", "en": "Induction", "de": "Induktion", "fr": "Induction", "es": "Inducción", "it": "Induzione", "ru": "Индукция", "pt": "Indução"}, "theory": {"sr": "<b>Elektromagnetna indukcija</b> je pojava nastanka električne struje u provodniku usled promene magnetnog polja kroz njega. Ovu pojavu je otkrio Majkl Faradej. Na indukciji rade <b>generatori</b> (pretvaraju mehaničku energiju u električnu) i <b>transformatori</b> (menjaju napon naizmenične struje).", "en": "<b>Electromagnetic induction</b> is the appearance of an electric current in a conductor due to a change in the magnetic field through it. This phenomenon was discovered by Michael Faraday. <b>Generators</b> (which convert mechanical energy into electrical energy) and <b>transformers</b> (which change the voltage of alternating current) work on the basis of induction.", "de": "<b>Elektromagnetische Induktion</b> ist das Entstehen eines elektrischen Stroms in einem Leiter aufgrund einer Änderung des Magnetfeldes durch ihn. Diese Erscheinung wurde von Michael Faraday entdeckt. Auf der Induktion beruhen <b>Generatoren</b> (wandeln mechanische in elektrische Energie um) und <b>Transformatoren</b> (verändern die Spannung von Wechselstrom).", "fr": "L'<b>induction électromagnétique</b> est l'apparition d'un courant électrique dans un conducteur due à une variation du champ magnétique qui le traverse. Ce phénomène a été découvert par Michael Faraday. Les <b>générateurs</b> (qui transforment l'énergie mécanique en énergie électrique) et les <b>transformateurs</b> (qui modifient la tension du courant alternatif) reposent sur l'induction.", "es": "La <b>inducción electromagnética</b> es la aparición de una corriente eléctrica en un conductor debido a un cambio en el campo magnético que lo atraviesa. Este fenómeno fue descubierto por Michael Faraday. Los <b>generadores</b> (que transforman la energía mecánica en eléctrica) y los <b>transformadores</b> (que cambian el voltaje de la corriente alterna) funcionan gracias a la inducción.", "it": "L'<b>induzione elettromagnetica</b> è la comparsa di una corrente elettrica in un conduttore a causa di una variazione del campo magnetico che lo attraversa. Questo fenomeno fu scoperto da Michael Faraday. I <b>generatori</b> (che trasformano l'energia meccanica in energia elettrica) e i <b>trasformatori</b> (che modificano la tensione della corrente alternata) funzionano grazie all'induzione.", "ru": "<b>Электромагнитная индукция</b> — это возникновение электрического тока в проводнике вследствие изменения магнитного поля, пронизывающего его. Это явление открыл Майкл Фарадей. На индукции работают <b>генераторы</b> (преобразуют механическую энергию в электрическую) и <b>трансформаторы</b> (изменяют напряжение переменного тока).", "pt": "A <b>indução eletromagnética</b> é o surgimento de uma corrente elétrica num condutor devido a uma variação do campo magnético que o atravessa. Este fenómeno foi descoberto por Michael Faraday. Os <b>geradores</b> (que transformam energia mecânica em energia elétrica) e os <b>transformadores</b> (que alteram a tensão da corrente alternada) funcionam graças à indução."}, "formulas": [{"sr": "Promena magnetnog fluksa (ΔΦ) indukuje elektromotornu silu (EMS)", "en": "A change in magnetic flux (ΔΦ) induces an electromotive force (EMF)", "de": "Eine Änderung des magnetischen Flusses (ΔΦ) induziert eine elektromotorische Kraft (EMK)", "fr": "Une variation du flux magnétique (ΔΦ) induit une force électromotrice (f.é.m.)", "es": "Un cambio en el flujo magnético (ΔΦ) induce una fuerza electromotriz (FEM)", "it": "Una variazione del flusso magnetico (ΔΦ) induce una forza elettromotrice (f.e.m.)", "ru": "Изменение магнитного потока (ΔΦ) индуцирует электродвижущую силу (ЭДС)", "pt": "Uma variação do fluxo magnético (ΔΦ) induz uma força eletromotriz (FEM)"}, {"sr": "Veći broj navojaka (N) daje veću indukovanu EMS", "en": "A greater number of coils (N) gives a greater induced EMF", "de": "Eine größere Anzahl von Windungen (N) ergibt eine größere induzierte EMK", "fr": "Un plus grand nombre de spires (N) donne une f.é.m. induite plus grande", "es": "Un mayor número de espiras (N) da una FEM inducida mayor", "it": "Un numero maggiore di spire (N) dà una f.e.m. indotta maggiore", "ru": "Чем больше число витков (N), тем больше индуцированная ЭДС", "pt": "Um maior número de espiras (N) dá uma FEM induzida maior"}], "remember": {"sr": "Indukovana struja postoji samo dok se magnetno polje menja – kod mirovanja magneta struje nema.", "en": "Induced current exists only while the magnetic field is changing – when the magnet is at rest, there is no current.", "de": "Induzierter Strom existiert nur, solange sich das Magnetfeld ändert – bei ruhendem Magneten gibt es keinen Strom.", "fr": "Le courant induit n'existe que tant que le champ magnétique varie – lorsque l'aimant est immobile, il n'y a pas de courant.", "es": "La corriente inducida existe solo mientras el campo magnético cambia; cuando el imán está en reposo, no hay corriente.", "it": "La corrente indotta esiste solo finché il campo magnetico cambia – quando il magnete è fermo, non c'è corrente.", "ru": "Индукционный ток существует только пока меняется магнитное поле — если магнит неподвижен, тока нет.", "pt": "A corrente induzida só existe enquanto o campo magnético está a mudar – quando o íman está em repouso, não há corrente."}, "problem": {"statement": {"sr": "Objasni zašto se u kalemu javlja struja kada magnet brzo uvučemo u njega, a zašto struje nema kada magnet miruje unutar kalema.", "en": "Explain why a current appears in a coil when a magnet is quickly pushed into it, and why there is no current when the magnet is at rest inside the coil.", "de": "Erkläre, warum in einer Spule ein Strom entsteht, wenn ein Magnet schnell hineingeschoben wird, und warum kein Strom fließt, wenn der Magnet ruhig in der Spule liegt.", "fr": "Explique pourquoi un courant apparaît dans une bobine lorsqu'on y insère rapidement un aimant, et pourquoi il n'y a pas de courant lorsque l'aimant est immobile à l'intérieur de la bobine.", "es": "Explica por qué aparece corriente en una bobina cuando se introduce rápidamente un imán en ella, y por qué no hay corriente cuando el imán está en reposo dentro de la bobina.", "it": "Spiega perché in una bobina compare corrente quando un magnete viene inserito rapidamente al suo interno, e perché non c'è corrente quando il magnete è fermo all'interno della bobina.", "ru": "Объясни, почему в катушке возникает ток, когда в неё быстро вдвигают магнит, и почему тока нет, когда магнит неподвижен внутри катушки.", "pt": "Explica por que razão surge corrente numa bobina quando um íman é rapidamente introduzido nela, e por que razão não há corrente quando o íman está em repouso dentro da bobina."}, "steps": [{"sr": "Setimo se uslova za indukciju: potrebna je promena magnetnog polja", "en": "Recall the condition for induction: a change in the magnetic field is required", "de": "Wir erinnern uns an die Bedingung für Induktion: es ist eine Änderung des Magnetfeldes nötig", "fr": "Rappelons la condition pour l'induction : il faut une variation du champ magnétique", "es": "Recordamos la condición para la inducción: se necesita un cambio en el campo magnético", "it": "Ricordiamo la condizione per l'induzione: è necessaria una variazione del campo magnetico", "ru": "Вспомним условие индукции: необходимо изменение магнитного поля", "pt": "Recordamos a condição para a indução: é necessária uma variação do campo magnético"}, {"sr": "Dok magnet ulazi, magnetno polje kroz kalem se menja → struja se indukuje", "en": "While the magnet is entering, the magnetic field through the coil changes → current is induced", "de": "Während der Magnet eindringt, ändert sich das Magnetfeld durch die Spule → es wird Strom induziert", "fr": "Pendant que l'aimant entre, le champ magnétique à travers la bobine change → un courant est induit", "es": "Mientras el imán entra, el campo magnético a través de la bobina cambia → se induce corriente", "it": "Mentre il magnete entra, il campo magnetico attraverso la bobina cambia → si induce corrente", "ru": "Пока магнит входит, магнитное поле через катушку меняется → индуцируется ток", "pt": "Enquanto o íman entra, o campo magnético através da bobina muda → induz-se corrente"}, {"sr": "Kada magnet miruje, polje je konstantno → nema promene → nema indukovane struje", "en": "When the magnet is at rest, the field is constant → no change → no induced current", "de": "Wenn der Magnet ruht, ist das Feld konstant → keine Änderung → kein induzierter Strom", "fr": "Lorsque l'aimant est immobile, le champ est constant → pas de variation → pas de courant induit", "es": "Cuando el imán está en reposo, el campo es constante → no hay cambio → no hay corriente inducida", "it": "Quando il magnete è fermo, il campo è costante → nessuna variazione → nessuna corrente indotta", "ru": "Когда магнит неподвижен, поле постоянно → изменений нет → индуцированного тока нет", "pt": "Quando o íman está em repouso, o campo é constante → não há variação → não há corrente induzida"}]}}, {"name": {"sr": "Optika", "en": "Optics", "de": "Optik", "fr": "Optique", "es": "Óptica", "it": "Ottica", "ru": "Оптика", "pt": "Ótica"}, "theory": {"sr": "<b>Svetlost</b> se prostire pravolinijski i najveću brzinu ima u vakuumu. Kada svetlost naiđe na prepreku, odbija se (<b>refleksija</b>) po zakonu: ugao upada jednak je uglu odbijanja. Kada svetlost prelazi iz jedne sredine u drugu, menja pravac – to je <b>prelamanje (refrakcija)</b>. Sočiva se koriste za sabiranje ili razlaganje svetlosnih zrakova.", "en": "<b>Light</b> travels in straight lines and has its greatest speed in a vacuum. When light hits an obstacle, it bounces back (<b>reflection</b>) according to the law: the angle of incidence equals the angle of reflection. When light passes from one medium to another, it changes direction – this is <b>refraction</b>. Lenses are used to converge or diverge light rays.", "de": "<b>Licht</b> breitet sich geradlinig aus und hat im Vakuum seine größte Geschwindigkeit. Trifft Licht auf ein Hindernis, wird es reflektiert (<b>Reflexion</b>) nach dem Gesetz: Einfallswinkel gleich Ausfallswinkel. Beim Übergang von einem Medium in ein anderes ändert Licht seine Richtung – das ist die <b>Brechung (Refraktion)</b>. Linsen werden verwendet, um Lichtstrahlen zu bündeln oder zu streuen.", "fr": "La <b>lumière</b> se propage en ligne droite et atteint sa vitesse maximale dans le vide. Lorsque la lumière rencontre un obstacle, elle est réfléchie (<b>réflexion</b>) selon la loi : l'angle d'incidence est égal à l'angle de réflexion. Lorsque la lumière passe d'un milieu à un autre, elle change de direction – c'est la <b>réfraction</b>. Les lentilles servent à converger ou à disperser les rayons lumineux.", "es": "La <b>luz</b> se propaga en línea recta y alcanza su mayor velocidad en el vacío. Cuando la luz choca con un obstáculo, se refleja (<b>reflexión</b>) según la ley: el ángulo de incidencia es igual al ángulo de reflexión. Cuando la luz pasa de un medio a otro, cambia de dirección; eso es la <b>refracción</b>. Las lentes se usan para converger o dispersar los rayos de luz.", "it": "La <b>luce</b> si propaga in linea retta e raggiunge la sua massima velocità nel vuoto. Quando la luce incontra un ostacolo, viene riflessa (<b>riflessione</b>) secondo la legge: l'angolo di incidenza è uguale all'angolo di riflessione. Quando la luce passa da un mezzo a un altro, cambia direzione: è la <b>rifrazione</b>. Le lenti si usano per convergere o divergere i raggi luminosi.", "ru": "<b>Свет</b> распространяется прямолинейно и имеет наибольшую скорость в вакууме. Когда свет встречает препятствие, он отражается (<b>отражение</b>) по закону: угол падения равен углу отражения. Когда свет переходит из одной среды в другую, он меняет направление — это <b>преломление (рефракция)</b>. Линзы используются для собирания или рассеивания световых лучей.", "pt": "A <b>luz</b> propaga-se em linha reta e tem a sua velocidade máxima no vácuo. Quando a luz encontra um obstáculo, é refletida (<b>reflexão</b>) segundo a lei: o ângulo de incidência é igual ao ângulo de reflexão. Quando a luz passa de um meio para outro, muda de direção – isso é a <b>refração</b>. As lentes são usadas para convergir ou dispersar os raios de luz."}, "formulas": [{"sr": "c ≈ 3·10⁸ m/s (brzina svetlosti u vakuumu)", "en": "c ≈ 3·10⁸ m/s (speed of light in vacuum)", "de": "c ≈ 3·10⁸ m/s (Lichtgeschwindigkeit im Vakuum)", "fr": "c ≈ 3·10⁸ m/s (vitesse de la lumière dans le vide)", "es": "c ≈ 3·10⁸ m/s (velocidad de la luz en el vacío)", "it": "c ≈ 3·10⁸ m/s (velocità della luce nel vuoto)", "ru": "c ≈ 3·10⁸ м/с (скорость света в вакууме)", "pt": "c ≈ 3·10⁸ m/s (velocidade da luz no vácuo)"}, {"sr": "n = c/v (indeks prelamanja sredine)", "en": "n = c/v (refractive index of the medium)", "de": "n = c/v (Brechungsindex des Mediums)", "fr": "n = c/v (indice de réfraction du milieu)", "es": "n = c/v (índice de refracción del medio)", "it": "n = c/v (indice di rifrazione del mezzo)", "ru": "n = c/v (показатель преломления среды)", "pt": "n = c/v (índice de refração do meio)"}], "remember": {"sr": "Ugao upada uvek se meri od normale na površinu, a jednak je uglu odbijanja.", "en": "The angle of incidence is always measured from the normal to the surface, and it equals the angle of reflection.", "de": "Der Einfallswinkel wird immer von der Normalen zur Oberfläche gemessen und ist gleich dem Ausfallswinkel.", "fr": "L'angle d'incidence se mesure toujours par rapport à la normale à la surface, et il est égal à l'angle de réflexion.", "es": "El ángulo de incidencia siempre se mide desde la normal a la superficie, y es igual al ángulo de reflexión.", "it": "L'angolo di incidenza si misura sempre rispetto alla normale alla superficie, ed è uguale all'angolo di riflessione.", "ru": "Угол падения всегда измеряется от нормали к поверхности и равен углу отражения.", "pt": "O ângulo de incidência mede-se sempre a partir da normal à superfície, e é igual ao ângulo de reflexão."}, "problem": {"statement": {"sr": "Svetlosni zrak pada na ravno ogledalo pod uglom od 30° u odnosu na normalu. Pod kojim uglom se odbija zrak?", "en": "A light ray hits a flat mirror at an angle of 30° from the normal. At what angle is the ray reflected?", "de": "Ein Lichtstrahl trifft in einem Winkel von 30° zur Normalen auf einen ebenen Spiegel. In welchem Winkel wird der Strahl reflektiert?", "fr": "Un rayon lumineux frappe un miroir plan avec un angle de 30° par rapport à la normale. Sous quel angle le rayon est-il réfléchi ?", "es": "Un rayo de luz incide sobre un espejo plano con un ángulo de 30° respecto a la normal. ¿Bajo qué ángulo se refleja el rayo?", "it": "Un raggio di luce colpisce uno specchio piano con un angolo di 30° rispetto alla normale. Con quale angolo viene riflesso il raggio?", "ru": "Луч света падает на плоское зеркало под углом 30° к нормали. Под каким углом отразится луч?", "pt": "Um raio de luz incide num espelho plano com um ângulo de 30° em relação à normal. Sob que ângulo é refletido o raio?"}, "steps": [{"sr": "Setimo se zakona odbijanja: ugao upada = ugao odbijanja", "en": "Recall the law of reflection: angle of incidence = angle of reflection", "de": "Wir erinnern uns an das Reflexionsgesetz: Einfallswinkel = Ausfallswinkel", "fr": "Rappelons la loi de la réflexion : angle d'incidence = angle de réflexion", "es": "Recordamos la ley de reflexión: ángulo de incidencia = ángulo de reflexión", "it": "Ricordiamo la legge della riflessione: angolo di incidenza = angolo di riflessione", "ru": "Вспомним закон отражения: угол падения = угол отражения", "pt": "Recordamos a lei da reflexão: ângulo de incidência = ângulo de reflexão"}, {"sr": "Ugao upada iznosi 30°", "en": "The angle of incidence is 30°", "de": "Der Einfallswinkel beträgt 30°", "fr": "L'angle d'incidence est de 30°", "es": "El ángulo de incidencia es de 30°", "it": "L'angolo di incidenza è di 30°", "ru": "Угол падения равен 30°", "pt": "O ângulo de incidência é de 30°"}, {"sr": "Zaključujemo: ugao odbijanja takođe iznosi 30°", "en": "We conclude: the angle of reflection is also 30°", "de": "Wir schließen daraus: der Ausfallswinkel beträgt ebenfalls 30°", "fr": "Nous concluons : l'angle de réflexion est aussi de 30°", "es": "Concluimos: el ángulo de reflexión también es de 30°", "it": "Concludiamo: anche l'angolo di riflessione è di 30°", "ru": "Заключаем: угол отражения также равен 30°", "pt": "Concluímos: o ângulo de reflexão também é de 30°"}]}}, {"name": {"sr": "Zvuk", "en": "Sound", "de": "Schall", "fr": "Son", "es": "Sonido", "it": "Suono", "ru": "Звук", "pt": "Som"}, "theory": {"sr": "<b>Zvuk</b> nastaje treperenjem (oscilovanjem) tela i prostire se kroz elastičnu sredinu (vazduh, vodu, čvrsta tela) u obliku talasa. Kroz vakuum se zvuk ne prostire. <b>Visina tona</b> zavisi od frekvencije, a <b>jačina zvuka</b> od amplitude oscilovanja. Brzina zvuka je najveća u čvrstim telima, a najmanja u gasovima.", "en": "<b>Sound</b> is produced by the vibration (oscillation) of a body and travels through an elastic medium (air, water, solids) in the form of waves. Sound cannot travel through a vacuum. <b>Pitch</b> depends on frequency, while <b>loudness</b> depends on the amplitude of the vibration. The speed of sound is greatest in solids and smallest in gases.", "de": "<b>Schall</b> entsteht durch das Schwingen (Vibrieren) eines Körpers und breitet sich in Form von Wellen durch ein elastisches Medium (Luft, Wasser, feste Körper) aus. Im Vakuum breitet sich Schall nicht aus. Die <b>Tonhöhe</b> hängt von der Frequenz ab, die <b>Lautstärke</b> von der Schwingungsamplitude. Die Schallgeschwindigkeit ist in Festkörpern am größten und in Gasen am kleinsten.", "fr": "Le <b>son</b> est produit par la vibration (oscillation) d'un corps et se propage à travers un milieu élastique (air, eau, solides) sous forme d'onde. Le son ne se propage pas dans le vide. La <b>hauteur</b> du son dépend de la fréquence, tandis que l'<b>intensité sonore</b> dépend de l'amplitude de la vibration. La vitesse du son est la plus grande dans les solides et la plus petite dans les gaz.", "es": "El <b>sonido</b> se produce por la vibración (oscilación) de un cuerpo y se propaga a través de un medio elástico (aire, agua, sólidos) en forma de ondas. El sonido no se propaga en el vacío. El <b>tono</b> depende de la frecuencia, mientras que la <b>intensidad del sonido</b> depende de la amplitud de la vibración. La velocidad del sonido es mayor en los sólidos y menor en los gases.", "it": "Il <b>suono</b> nasce dalla vibrazione (oscillazione) di un corpo e si propaga attraverso un mezzo elastico (aria, acqua, solidi) sotto forma di onde. Il suono non si propaga nel vuoto. L'<b>altezza del suono</b> dipende dalla frequenza, mentre l'<b>intensità sonora</b> dipende dall'ampiezza dell'oscillazione. La velocità del suono è massima nei solidi e minima nei gas.", "ru": "<b>Звук</b> возникает благодаря колебаниям (вибрации) тела и распространяется через упругую среду (воздух, воду, твёрдые тела) в виде волн. В вакууме звук не распространяется. <b>Высота тона</b> зависит от частоты, а <b>громкость звука</b> — от амплитуды колебаний. Скорость звука наибольшая в твёрдых телах и наименьшая в газах.", "pt": "O <b>som</b> é produzido pela vibração (oscilação) de um corpo e propaga-se através de um meio elástico (ar, água, sólidos) sob a forma de ondas. O som não se propaga no vácuo. A <b>altura do som</b> depende da frequência, enquanto a <b>intensidade sonora</b> depende da amplitude da oscilação. A velocidade do som é maior nos sólidos e menor nos gases."}, "formulas": [{"sr": "v = s/t (brzina prostiranja zvuka)", "en": "v = s/t (speed of sound propagation)", "de": "v = s/t (Ausbreitungsgeschwindigkeit des Schalls)", "fr": "v = s/t (vitesse de propagation du son)", "es": "v = s/t (velocidad de propagación del sonido)", "it": "v = s/t (velocità di propagazione del suono)", "ru": "v = s/t (скорость распространения звука)", "pt": "v = s/t (velocidade de propagação do som)"}, {"sr": "f = 1/T (učestanost i period oscilovanja)", "en": "f = 1/T (frequency and period of oscillation)", "de": "f = 1/T (Frequenz und Periode der Schwingung)", "fr": "f = 1/T (fréquence et période d'oscillation)", "es": "f = 1/T (frecuencia y período de oscilación)", "it": "f = 1/T (frequenza e periodo di oscillazione)", "ru": "f = 1/T (частота и период колебаний)", "pt": "f = 1/T (frequência e período de oscilação)"}], "remember": {"sr": "Brzina zvuka u vazduhu na 20°C iznosi približno 340 m/s.", "en": "The speed of sound in air at 20°C is approximately 340 m/s.", "de": "Die Schallgeschwindigkeit in Luft bei 20 °C beträgt etwa 340 m/s.", "fr": "La vitesse du son dans l'air à 20 °C est d'environ 340 m/s.", "es": "La velocidad del sonido en el aire a 20 °C es de aproximadamente 340 m/s.", "it": "La velocità del suono nell'aria a 20 °C è di circa 340 m/s.", "ru": "Скорость звука в воздухе при 20°C составляет примерно 340 м/с.", "pt": "A velocidade do som no ar a 20 °C é de aproximadamente 340 m/s."}, "problem": {"statement": {"sr": "Grmljavinu čujemo 6 sekundi nakon što smo videli munju. Na kojoj udaljenosti se dogodilo pražnjenje ako je brzina zvuka 340 m/s?", "en": "We hear thunder 6 seconds after seeing the lightning. At what distance did the discharge occur if the speed of sound is 340 m/s?", "de": "Wir hören den Donner 6 Sekunden, nachdem wir den Blitz gesehen haben. In welcher Entfernung fand die Entladung statt, wenn die Schallgeschwindigkeit 340 m/s beträgt?", "fr": "Nous entendons le tonnerre 6 secondes après avoir vu l'éclair. À quelle distance a eu lieu la décharge si la vitesse du son est de 340 m/s ?", "es": "Oímos el trueno 6 segundos después de ver el relámpago. ¿A qué distancia ocurrió la descarga si la velocidad del sonido es de 340 m/s?", "it": "Sentiamo il tuono 6 secondi dopo aver visto il lampo. A quale distanza è avvenuta la scarica se la velocità del suono è 340 m/s?", "ru": "Мы слышим гром через 6 секунд после того, как увидели молнию. На каком расстоянии произошёл разряд, если скорость звука 340 м/с?", "pt": "Ouvimos o trovão 6 segundos depois de vermos o relâmpago. A que distância ocorreu a descarga se a velocidade do som é de 340 m/s?"}, "steps": [{"sr": "Setimo se formule: s = v·t", "en": "Recall the formula: s = v·t", "de": "Wir erinnern uns an die Formel: s = v·t", "fr": "Rappelons la formule : s = v·t", "es": "Recordamos la fórmula: s = v·t", "it": "Ricordiamo la formula: s = v·t", "ru": "Вспомним формулу: s = v·t", "pt": "Recordamos a fórmula: s = v·t"}, {"sr": "Uvrstimo vrednosti: s = 340 m/s · 6 s", "en": "Substitute the values: s = 340 m/s · 6 s", "de": "Wir setzen die Werte ein: s = 340 m/s · 6 s", "fr": "Remplaçons les valeurs : s = 340 m/s · 6 s", "es": "Sustituimos los valores: s = 340 m/s · 6 s", "it": "Sostituiamo i valori: s = 340 m/s · 6 s", "ru": "Подставим значения: s = 340 м/с · 6 с", "pt": "Substituímos os valores: s = 340 m/s · 6 s"}, {"sr": "Izračunamo: s = 2040 m", "en": "Calculate: s = 2040 m", "de": "Wir berechnen: s = 2040 m", "fr": "Calculons : s = 2040 m", "es": "Calculamos: s = 2040 m", "it": "Calcoliamo: s = 2040 m", "ru": "Вычисляем: s = 2040 м", "pt": "Calculamos: s = 2040 m"}]}}], "C": {"next": {"sr": "Dalje →", "en": "Next →", "de": "Weiter →", "fr": "Suivant →", "es": "Siguiente →", "it": "Avanti →", "ru": "Дальше →", "pt": "Seguinte →"}, "prev": {"sr": "← Nazad", "en": "← Back", "de": "← Zurück", "fr": "← Retour", "es": "← Atrás", "it": "← Indietro", "ru": "← Назад", "pt": "← Voltar"}, "finish": {"sr": "Završi 🎉", "en": "Finish 🎉", "de": "Fertig 🎉", "fr": "Terminer 🎉", "es": "Terminar 🎉", "it": "Finisci 🎉", "ru": "Готово 🎉", "pt": "Terminar 🎉"}, "done": {"sr": "Bravo, prešao si skriptu! 🎉", "en": "Yay, you finished the notes! 🎉", "de": "Super, Skript geschafft! 🎉", "fr": "Bravo, cours terminé ! 🎉", "es": "¡Bien, terminaste los apuntes! 🎉", "it": "Bravo, dispensa completata! 🎉", "ru": "Ура, конспект пройде function render(){
 dots();var st=$('stage');
 if(i>=N){ // finale
   st.innerHTML='<section class="card fin"><div class="big">🎉</div><h2>'+T(D.C.done)+'</h2><p>'+T(D.C.doneSub)+'</p>'+
     '<a class="cta" href="'+D.quiz+'">'+T(D.C.toQuiz)+'</a><a class="cta2" href="'+D.back+'">'+T(D.C.toClone)+'</a></section>';
   bigConf();return;
 }
 var tp=D.topics[i];
 var fx=(tp.formulas||[]).map(function(f,k){return '<span style="animation-delay:'+(k*0.06)+'s">'+T(f)+'</span>'}).join('');
 var zap=tp.remember?('<div class="zap"><span class="st">💡</span><p>'+T(tp.remember)+'</p></div>'):'';
 st.innerHTML='<section class="card"><div class="eyebrow">'+T(D.eyebrow)+'</div>'+
   '<div class="mascot">'+MAS[i%MAS.length]+'</div>'+
   '<div class="tnum">'+(i+1)+' / '+N+'</div>'+
   '<h1 class="ttl">'+T(tp.name)+'</h1>'+
   '<p class="theory">'+T(tp.theory)+'</p>'+
   (fx?'<div class="fx">'+fx+'</div>':'')+zap+
   '<div class="nav">'+(i>0?'<button class="prev" id="prev">'+T(D.C.prev)+'</button>':'')+
   '<button class="next" id="next">'+(i===N-1?T(D.C.finish):T(D.C.next))+'</button></div></section>';
 var nx=$('next');if(nx)nx.onclick=function(){i++;render();sparkle()};
 var pv=$('prev');if(pv)pv.onclick=function(){i--;render()};
}
function sparkle(){spawnConf(10)}
function spawnConf(n){var box=$('conf');var cols=['#C6A05C','#B01E48','#CC5E7E','#F0DCA8','#3FB98C','#E7D2A2'];for(var k=0;k<n;k++){var s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.background=cols[k%cols.length];s.style.animationDuration=(1.6+Math.random()*1.4)+'s';if(Math.random()<.3)s.style.borderRadius='50%';box.appendChild(s);setTimeout(function(el){return function(){el.remove()}}(s),3200);}}
function bigConf(){spawnConf(80);var h=['💛','🌸','✨','🎉','⭐'];for(var k=0;k<14;k++){(function(k){setTimeout(function(){var s=document.createElement('i');s.textContent=h[k%5];s.style.cssText='position:absolute;top:-6%;font-size:22px;left:'+(Math.random()*100)+'%;animation:cf '+(1.8+Math.random())+'s linear forwards';$('conf').appendChild(s);setTimeout(function(){s.remove()},3200)},k*70)})(k);}}
(function(){var box=$('fall'),g=['π','√','∑','+','÷','½','💛','🌸','✦','⭐'];for(var k=0;k<20;k++){var s=document.createElement('span');s.textContent=g[k%g.length];if(k%3===0)s.className='m';s.style.left=Math.random()*100+'%';s.style.fontSize=(13+Math.random()*22)+'px';s.style.animationDuration=(7+Math.random()*8)+'s';s.style.animationDelay=(-Math.random()*10)+'s';box.appendChild(s);}})();
$('lang').addEventListener('change',function(){try{localStorage.setItem('mathia_lang',this.value)}catch(e){}try{document.documentElement.lang=this.value}catch(e){}try{window.dispatchEvent(new CustomEvent('mathia:lang',{detail:this.value}))}catch(e){}render();$('lang').value=this.value;});
window.addEventListener('mathia:lang',function(){var s=$('lang');if(s)s.value=lng();render();});
$('lang').value=lng();render();
</script>

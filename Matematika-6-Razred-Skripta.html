<style>
:root{--cream:#FBF6EE;--ink:#5A1024;--ink2:#7A3346;--gold:#C6A05C;--goldlt:#F0DCA8;--malina:#B01E48;--malina2:#CC5E7E;--mint:#3FB98C;--muted:#8A7A80}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#43303A;min-height:100vh;
 background:radial-gradient(520px 400px at 104% -6%,#F6E1EC 0,transparent 56%),radial-gradient(500px 380px at -6% 106%,#F7ECD6 0,transparent 58%),var(--cream);overflow-x:hidden}
#fall{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fall span{position:absolute;top:-8%;font-family:'Spectral',serif;font-style:italic;color:rgba(198,160,92,.22);animation:fl linear infinite}
#fall span.m{color:rgba(176,30,72,.16)}
@keyframes fl{0%{transform:translateY(-10vh) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(112vh) rotate(24deg);opacity:0}}
.wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:14px 16px 30px}
.top{display:flex;align-items:center;gap:10px;padding:4px 2px 10px}
.top .back{color:var(--ink2);text-decoration:none;font-weight:800;font-size:1.1rem}
.top .lang{margin-left:auto;border:1px solid var(--goldlt);border-radius:100px;padding:5px 10px;font-family:inherit;font-weight:800;font-size:.72rem;color:var(--ink);background:#fff}
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:#E6D5CE;transition:.3s}
.dots i.on{background:linear-gradient(90deg,var(--gold),var(--malina));transform:scale(1.25)}
.dots i.done{background:var(--goldlt)}
.stage{position:relative;min-height:62vh}
.card{position:relative;background:linear-gradient(180deg,#FFFDF9,#FDF3EA);border:1px solid var(--goldlt);border-radius:32px;
 padding:26px 22px 22px;box-shadow:0 30px 70px -34px rgba(90,16,36,.5);animation:slidein .45s cubic-bezier(.2,.9,.2,1)}
@keyframes slidein{0%{transform:translateX(28px) scale(.97);opacity:0}100%{transform:translateX(0) scale(1);opacity:1}}
.eyebrow{text-align:center;font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:.64rem;color:var(--malina)}
.mascot{width:82px;height:82px;margin:8px auto 4px;border-radius:50%;display:grid;place-items:center;font-size:2.6rem;background:radial-gradient(circle at 40% 34%,#FFF3F7,#F6E1EC);border:2px solid var(--goldlt);box-shadow:0 14px 28px -12px rgba(176,30,72,.4);animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.tnum{text-align:center;color:var(--muted);font-weight:800;font-size:.78rem;margin-top:6px}
.ttl{font-family:'Spectral',serif;font-weight:700;color:var(--ink);font-size:1.75rem;text-align:center;line-height:1.2;margin:2px 0 8px}
.theory{color:#5a4750;font-size:1.02rem;text-align:center;line-height:1.55;margin:0 auto 14px;max-width:460px}
.theory b{color:var(--ink)}
.fx{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 4px}
.fx span{display:inline-block;background:#fff;border:1px dashed var(--goldlt);border-radius:14px;padding:9px 14px;font-family:'Spectral','Cambria Math',Georgia,serif;color:var(--ink);font-size:1.05rem;animation:pop .4s both}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.zap{margin:16px auto 2px;max-width:460px;background:linear-gradient(180deg,#FFF7FA,#FBEEF2);border:1px solid #F0D6DF;border-radius:18px;padding:13px 16px;display:flex;gap:10px;align-items:flex-start}
.zap .st{font-size:1.4rem;line-height:1}
.zap p{margin:0;color:var(--ink2);font-size:.95rem;font-weight:600}
.nav{display:flex;align-items:center;gap:12px;margin-top:16px}
.nav .prev{background:none;border:none;color:var(--ink2);font-weight:800;cursor:pointer;font-size:1rem;padding:8px}
.nav .next{flex:1;border:none;cursor:pointer;background:linear-gradient(135deg,var(--malina2),var(--malina));color:#fff;font-weight:900;font-size:1.05rem;padding:14px;border-radius:100px;box-shadow:0 16px 30px -14px rgba(176,30,72,.6);transition:transform .15s}
.nav .next:hover{transform:translateY(-2px)}
.fin{text-align:center}
.fin .big{font-size:3.4rem}
.fin h2{font-family:'Spectral',serif;color:var(--ink);font-size:1.9rem;margin:4px 0}
.fin p{color:var(--ink2)}
.fin .cta{display:block;margin-top:12px;text-decoration:none;text-align:center;background:linear-gradient(135deg,var(--malina2),var(--malina));color:#fff;font-weight:900;padding:14px;border-radius:100px;box-shadow:0 16px 30px -14px rgba(176,30,72,.6)}
.fin .cta2{display:block;margin-top:10px;text-decoration:none;color:var(--ink2);font-weight:800}
#conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#conf i{position:absolute;top:-6%;width:10px;height:14px;border-radius:2px;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(560deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
var D={"eyebrow": {"sr": "Matematika · 6. razred", "en": "Mathematics · Grade 6", "de": "Mathematik · 6. Klasse", "fr": "Mathématiques · 6e année", "es": "Matemáticas · 6.º grado", "it": "Matematica · 6ª classe", "ru": "Математика · 6 класс", "pt": "Matemática · 6.º ano"}, "topics": [{"name": {"sr": "Celi brojevi", "en": "Integers", "de": "Ganze Zahlen", "fr": "Nombres entiers", "es": "Números enteros", "it": "Numeri interi", "ru": "Целые числа", "pt": "Números inteiros"}, "theory": {"sr": "<b>Celi brojevi</b> su brojevi ℤ = {..., −3, −2, −1, 0, 1, 2, 3, ...} - to su prirodni brojevi, njima suprotni (negativni) brojevi i nula. Na brojevnoj pravoj sabiranje pozitivnog broja znači pomeranje udesno, a sabiranje negativnog (oduzimanje) pomeranje ulevo. Kod množenja i deljenja važi pravilo znaka: isti znak (+·+ ili −·−) daje pozitivan rezultat, a različit znak (+·− ili −·+) daje negativan rezultat.", "en": "<b>Integers</b> are the numbers ℤ = {..., −3, −2, −1, 0, 1, 2, 3, ...} - the natural numbers, their opposites (negative numbers) and zero. On the number line, adding a positive number means moving right, while adding a negative number (subtracting) means moving left. For multiplication and division the sign rule applies: the same sign (+·+ or −·−) gives a positive result, while different signs (+·− or −·+) give a negative result.", "de": "<b>Ganze Zahlen</b> sind die Zahlen ℤ = {..., −3, −2, −1, 0, 1, 2, 3, ...} - die natürlichen Zahlen, ihre Gegenzahlen (negative Zahlen) und die Null. Auf dem Zahlenstrahl bedeutet das Addieren einer positiven Zahl eine Bewegung nach rechts, das Addieren einer negativen Zahl (Subtrahieren) eine Bewegung nach links. Bei Multiplikation und Division gilt die Vorzeichenregel: gleiches Vorzeichen (+·+ oder −·−) ergibt ein positives Ergebnis, verschiedenes Vorzeichen (+·− oder −·+) ergibt ein negatives Ergebnis.", "fr": "<b>Les nombres entiers</b> sont les nombres ℤ = {..., −3, −2, −1, 0, 1, 2, 3, ...} - les nombres naturels, leurs opposés (nombres négatifs) et zéro. Sur la droite numérique, ajouter un nombre positif signifie se déplacer vers la droite, tandis qu'ajouter un nombre négatif (soustraire) signifie se déplacer vers la gauche. Pour la multiplication et la division, la règle des signes s'applique : un même signe (+·+ ou −·−) donne un résultat positif, des signes différents (+·− ou −·+) donnent un résultat négatif.", "es": "<b>Los números enteros</b> son los números ℤ = {..., −3, −2, −1, 0, 1, 2, 3, ...} - los números naturales, sus opuestos (números negativos) y el cero. En la recta numérica, sumar un número positivo significa moverse a la derecha, mientras que sumar un número negativo (restar) significa moverse a la izquierda. En la multiplicación y la división se aplica la regla de los signos: el mismo signo (+·+ o −·−) da un resultado positivo, y signos diferentes (+·− o −·+) dan un resultado negativo.", "it": "<b>I numeri interi</b> sono i numeri ℤ = {..., −3, −2, −1, 0, 1, 2, 3, ...} - i numeri naturali, i loro opposti (numeri negativi) e lo zero. Sulla retta numerica, sommare un numero positivo significa spostarsi a destra, mentre sommare un numero negativo (sottrarre) significa spostarsi a sinistra. Nella moltiplicazione e nella divisione vale la regola dei segni: segno uguale (+·+ o −·−) dà un risultato positivo, segno diverso (+·− o −·+) dà un risultato negativo.", "ru": "<b>Целые числа</b> - это числа ℤ = {..., −3, −2, −1, 0, 1, 2, 3, ...} - натуральные числа, противоположные им (отрицательные) числа и ноль. На числовой прямой прибавление положительного числа означает движение вправо, а прибавление отрицательного числа (вычитание) - движение влево. При умножении и делении действует правило знаков: одинаковые знаки (+·+ или −·−) дают положительный результат, разные знаки (+·− или −·+) дают отрицательный результат.", "pt": "<b>Os números inteiros</b> são os números ℤ = {..., −3, −2, −1, 0, 1, 2, 3, ...} - os números naturais, os seus opostos (números negativos) e o zero. Na reta numérica, somar um número positivo significa deslocar-se para a direita, enquanto somar um número negativo (subtrair) significa deslocar-se para a esquerda. Na multiplicação e na divisão aplica-se a regra dos sinais: sinais iguais (+·+ ou −·−) dão resultado positivo, sinais diferentes (+·− ou −·+) dão resultado negativo."}, "formulas": [{"sr": "(+)·(+) = +,  (−)·(−) = +,  (+)·(−) = −", "en": "(+)·(+) = +,  (−)·(−) = +,  (+)·(−) = −", "de": "(+)·(+) = +,  (−)·(−) = +,  (+)·(−) = −", "fr": "(+)·(+) = +,  (−)·(−) = +,  (+)·(−) = −", "es": "(+)·(+) = +,  (−)·(−) = +,  (+)·(−) = −", "it": "(+)·(+) = +,  (−)·(−) = +,  (+)·(−) = −", "ru": "(+)·(+) = +,  (−)·(−) = +,  (+)·(−) = −", "pt": "(+)·(+) = +,  (−)·(−) = +,  (+)·(−) = −"}, {"sr": "|a| ≥ 0  (apsolutna vrednost broja a)", "en": "|a| ≥ 0  (absolute value of a)", "de": "|a| ≥ 0  (Betrag der Zahl a)", "fr": "|a| ≥ 0  (valeur absolue de a)", "es": "|a| ≥ 0  (valor absoluto de a)", "it": "|a| ≥ 0  (valore assoluto di a)", "ru": "|a| ≥ 0  (модуль числа a)", "pt": "|a| ≥ 0  (valor absoluto de a)"}, {"sr": "a + (−a) = 0  (zbir suprotnih brojeva)", "en": "a + (−a) = 0  (sum of opposite numbers)", "de": "a + (−a) = 0  (Summe entgegengesetzter Zahlen)", "fr": "a + (−a) = 0  (somme de nombres opposés)", "es": "a + (−a) = 0  (suma de números opuestos)", "it": "a + (−a) = 0  (somma di numeri opposti)", "ru": "a + (−a) = 0  (сумма противоположных чисел)", "pt": "a + (−a) = 0  (soma de números opostos)"}], "remember": {"sr": "Kod sabiranja brojeva sa istim znakom saberi apsolutne vrednosti i zadrži znak; kod različitih znakova oduzmi manju apsolutnu vrednost od veće i uzmi znak broja sa većom apsolutnom vrednošću.", "en": "When adding numbers with the same sign, add their absolute values and keep the sign; when the signs differ, subtract the smaller absolute value from the larger one and take the sign of the number with the larger absolute value.", "de": "Beim Addieren von Zahlen mit gleichem Vorzeichen addiere die Beträge und behalte das Vorzeichen bei; bei unterschiedlichen Vorzeichen subtrahiere den kleineren Betrag vom größeren und übernimm das Vorzeichen der Zahl mit dem größeren Betrag.", "fr": "Pour additionner des nombres de même signe, additionne leurs valeurs absolues et conserve le signe ; pour des signes différents, soustrais la plus petite valeur absolue de la plus grande et prends le signe du nombre ayant la plus grande valeur absolue.", "es": "Al sumar números con el mismo signo, suma sus valores absolutos y conserva el signo; con signos diferentes, resta el valor absoluto menor del mayor y toma el signo del número con mayor valor absoluto.", "it": "Quando si sommano numeri con lo stesso segno, somma i valori assoluti e mantieni il segno; con segni diversi, sottrai il valore assoluto minore da quello maggiore e prendi il segno del numero con il valore assoluto maggiore.", "ru": "При сложении чисел с одинаковыми знаками сложи их модули и сохрани знак; при разных знаках вычти меньший модуль из большего и возьми знак числа с бо́льшим модулем.", "pt": "Ao somar números com o mesmo sinal, soma os seus valores absolutos e mantém o sinal; com sinais diferentes, subtrai o valor absoluto menor do maior e usa o sinal do número com maior valor absoluto."}, "problem": {"statement": {"sr": "Izračunaj: (−7) + 12 − (−5) − 8", "en": "Calculate: (−7) + 12 − (−5) − 8", "de": "Berechne: (−7) + 12 − (−5) − 8", "fr": "Calcule : (−7) + 12 − (−5) − 8", "es": "Calcula: (−7) + 12 − (−5) − 8", "it": "Calcola: (−7) + 12 − (−5) − 8", "ru": "Вычисли: (−7) + 12 − (−5) − 8", "pt": "Calcula: (−7) + 12 − (−5) − 8"}, "steps": [{"sr": "Oduzimanje negativnog broja pretvaramo u sabiranje: −(−5) = +5, pa izraz postaje (−7) + 12 + 5 − 8.", "en": "Turn subtracting a negative number into addition: −(−5) = +5, so the expression becomes (−7) + 12 + 5 − 8.", "de": "Das Subtrahieren einer negativen Zahl wird zur Addition: −(−5) = +5, der Ausdruck wird also zu (−7) + 12 + 5 − 8.", "fr": "Soustraire un nombre négatif revient à additionner : −(−5) = +5, l'expression devient donc (−7) + 12 + 5 − 8.", "es": "Restar un número negativo se convierte en sumar: −(−5) = +5, por lo que la expresión se convierte en (−7) + 12 + 5 − 8.", "it": "Sottrarre un numero negativo diventa un'addizione: −(−5) = +5, quindi l'espressione diventa (−7) + 12 + 5 − 8.", "ru": "Вычитание отрицательного числа превращается в сложение: −(−5) = +5, поэтому выражение принимает вид (−7) + 12 + 5 − 8.", "pt": "Subtrair um número negativo transforma-se em soma: −(−5) = +5, pelo que a expressão fica (−7) + 12 + 5 − 8."}, {"sr": "Saberemo pozitivne brojeve: 12 + 5 = 17, a negativne: −7 − 8 = −15.", "en": "Add the positive numbers: 12 + 5 = 17, and the negative numbers: −7 − 8 = −15.", "de": "Addiere die positiven Zahlen: 12 + 5 = 17, und die negativen Zahlen: −7 − 8 = −15.", "fr": "Additionne les nombres positifs : 12 + 5 = 17, et les nombres négatifs : −7 − 8 = −15.", "es": "Suma los números positivos: 12 + 5 = 17, y los negativos: −7 − 8 = −15.", "it": "Somma i numeri positivi: 12 + 5 = 17, e quelli negativi: −7 − 8 = −15.", "ru": "Сложим положительные числа: 12 + 5 = 17, и отрицательные: −7 − 8 = −15.", "pt": "Soma os números positivos: 12 + 5 = 17, e os negativos: −7 − 8 = −15."}, {"sr": "Sabiramo dobijene rezultate: 17 + (−15) = 17 − 15 = 2.", "en": "Add the two results: 17 + (−15) = 17 − 15 = 2.", "de": "Addiere die beiden Ergebnisse: 17 + (−15) = 17 − 15 = 2.", "fr": "Additionne les deux résultats : 17 + (−15) = 17 − 15 = 2.", "es": "Suma los dos resultados: 17 + (−15) = 17 − 15 = 2.", "it": "Somma i due risultati: 17 + (−15) = 17 − 15 = 2.", "ru": "Сложим полученные результаты: 17 + (−15) = 17 − 15 = 2.", "pt": "Soma os dois resultados: 17 + (−15) = 17 − 15 = 2."}, {"sr": "Rešenje: (−7) + 12 − (−5) − 8 = 2.", "en": "Solution: (−7) + 12 − (−5) − 8 = 2.", "de": "Lösung: (−7) + 12 − (−5) − 8 = 2.", "fr": "Solution : (−7) + 12 − (−5) − 8 = 2.", "es": "Solución: (−7) + 12 − (−5) − 8 = 2.", "it": "Soluzione: (−7) + 12 − (−5) − 8 = 2.", "ru": "Решение: (−7) + 12 − (−5) − 8 = 2.", "pt": "Solução: (−7) + 12 − (−5) − 8 = 2."}]}}, {"name": {"sr": "Razlomci", "en": "Fractions", "de": "Brüche", "fr": "Fractions", "es": "Fracciones", "it": "Frazioni", "ru": "Дроби", "pt": "Frações"}, "theory": {"sr": "<b>Razlomak</b> a/b (b ≠ 0) predstavlja a delova celine podeljene na b jednakih delova. Da bismo sabrali ili oduzeli razlomke, prvo ih svodimo na zajednički imenilac. Množenje razlomaka radimo tako što pomnožimo brojilac sa brojiocem i imenilac sa imeniocem, a deljenje razlomka drugim razlomkom je isto što i množenje prvog razlomka recipročnom vrednošću drugog.", "en": "<b>A fraction</b> a/b (b ≠ 0) represents a parts of a whole divided into b equal parts. To add or subtract fractions, we first bring them to a common denominator. To multiply fractions, we multiply numerator by numerator and denominator by denominator, and dividing by a fraction is the same as multiplying by its reciprocal.", "de": "<b>Ein Bruch</b> a/b (b ≠ 0) stellt a Teile eines in b gleiche Teile geteilten Ganzen dar. Um Brüche zu addieren oder zu subtrahieren, bringen wir sie zunächst auf einen gemeinsamen Nenner. Brüche multipliziert man, indem man Zähler mit Zähler und Nenner mit Nenner multipliziert; das Teilen durch einen Bruch entspricht der Multiplikation mit seinem Kehrwert.", "fr": "<b>Une fraction</b> a/b (b ≠ 0) représente a parts d'un tout divisé en b parts égales. Pour additionner ou soustraire des fractions, on les met d'abord au même dénominateur. Pour multiplier des fractions, on multiplie numérateur par numérateur et dénominateur par dénominateur ; diviser par une fraction revient à multiplier par son inverse.", "es": "<b>Una fracción</b> a/b (b ≠ 0) representa a partes de un todo dividido en b partes iguales. Para sumar o restar fracciones, primero las reducimos a un denominador común. Para multiplicar fracciones, se multiplica numerador por numerador y denominador por denominador; dividir entre una fracción equivale a multiplicar por su recíproco.", "it": "<b>Una frazione</b> a/b (b ≠ 0) rappresenta a parti di un intero diviso in b parti uguali. Per sommare o sottrarre frazioni, le si riduce prima allo stesso denominatore. Per moltiplicare le frazioni si moltiplica numeratore per numeratore e denominatore per denominatore; dividere per una frazione equivale a moltiplicare per il suo reciproco.", "ru": "<b>Дробь</b> a/b (b ≠ 0) означает a частей целого, разделённого на b равных частей. Чтобы сложить или вычесть дроби, их сначала приводят к общему знаменателю. При умножении дробей числитель умножают на числитель, а знаменатель на знаменатель; деление на дробь равносильно умножению на обратную ей дробь.", "pt": "<b>Uma fração</b> a/b (b ≠ 0) representa a partes de um todo dividido em b partes iguais. Para somar ou subtrair frações, reduzimo-las primeiro ao mesmo denominador. Para multiplicar frações, multiplica-se o numerador pelo numerador e o denominador pelo denominador; dividir por uma fração equivale a multiplicar pelo seu recíproco."}, "formulas": [{"sr": "a/b + c/b = (a + c)/b  (isti imenilac)", "en": "a/b + c/b = (a + c)/b  (same denominator)", "de": "a/b + c/b = (a + c)/b  (gleicher Nenner)", "fr": "a/b + c/b = (a + c)/b  (même dénominateur)", "es": "a/b + c/b = (a + c)/b  (mismo denominador)", "it": "a/b + c/b = (a + c)/b  (stesso denominatore)", "ru": "a/b + c/b = (a + c)/b  (одинаковый знаменатель)", "pt": "a/b + c/b = (a + c)/b  (mesmo denominador)"}, {"sr": "a/b · c/d = (a·c)/(b·d)", "en": "a/b · c/d = (a·c)/(b·d)", "de": "a/b · c/d = (a·c)/(b·d)", "fr": "a/b · c/d = (a·c)/(b·d)", "es": "a/b · c/d = (a·c)/(b·d)", "it": "a/b · c/d = (a·c)/(b·d)", "ru": "a/b · c/d = (a·c)/(b·d)", "pt": "a/b · c/d = (a·c)/(b·d)"}, {"sr": "a/b ÷ c/d = a/b · d/c", "en": "a/b ÷ c/d = a/b · d/c", "de": "a/b ÷ c/d = a/b · d/c", "fr": "a/b ÷ c/d = a/b · d/c", "es": "a/b ÷ c/d = a/b · d/c", "it": "a/b ÷ c/d = a/b · d/c", "ru": "a/b ÷ c/d = a/b · d/c", "pt": "a/b ÷ c/d = a/b · d/c"}], "remember": {"sr": "Pre sabiranja ili oduzimanja razlomaka sa različitim imeniocima, nađi najmanji zajednički sadržalac imenilaca (NZS) i svedi razlomke na taj zajednički imenilac.", "en": "Before adding or subtracting fractions with different denominators, find the least common multiple (LCM) of the denominators and convert the fractions to that common denominator.", "de": "Bevor man Brüche mit unterschiedlichen Nennern addiert oder subtrahiert, bestimme das kleinste gemeinsame Vielfache (kgV) der Nenner und bringe die Brüche auf diesen gemeinsamen Nenner.", "fr": "Avant d'additionner ou de soustraire des fractions ayant des dénominateurs différents, trouve le plus petit commun multiple (PPCM) des dénominateurs et ramène les fractions à ce dénominateur commun.", "es": "Antes de sumar o restar fracciones con distinto denominador, halla el mínimo común múltiplo (m.c.m.) de los denominadores y reduce las fracciones a ese denominador común.", "it": "Prima di sommare o sottrarre frazioni con denominatori diversi, trova il minimo comune multiplo (m.c.m.) dei denominatori e riduci le frazioni a quel denominatore comune.", "ru": "Прежде чем складывать или вычитать дроби с разными знаменателями, найди наименьшее общее кратное (НОК) знаменателей и приведи дроби к этому общему знаменателю.", "pt": "Antes de somar ou subtrair frações com denominadores diferentes, encontra o mínimo múltiplo comum (m.m.c.) dos denominadores e reduz as frações a esse denominador comum."}, "problem": {"statement": {"sr": "Izračunaj: 2/3 + 1/4 − 1/6", "en": "Calculate: 2/3 + 1/4 − 1/6", "de": "Berechne: 2/3 + 1/4 − 1/6", "fr": "Calcule : 2/3 + 1/4 − 1/6", "es": "Calcula: 2/3 + 1/4 − 1/6", "it": "Calcola: 2/3 + 1/4 − 1/6", "ru": "Вычисли: 2/3 + 1/4 − 1/6", "pt": "Calcula: 2/3 + 1/4 − 1/6"}, "steps": [{"sr": "Zajednički imenilac za brojeve 3, 4 i 6 je 12 (NZS(3,4,6) = 12).", "en": "The common denominator for 3, 4 and 6 is 12 (LCM(3,4,6) = 12).", "de": "Der gemeinsame Nenner für 3, 4 und 6 ist 12 (kgV(3,4,6) = 12).", "fr": "Le dénominateur commun pour 3, 4 et 6 est 12 (PPCM(3,4,6) = 12).", "es": "El denominador común para 3, 4 y 6 es 12 (m.c.m.(3,4,6) = 12).", "it": "Il denominatore comune per 3, 4 e 6 è 12 (m.c.m.(3,4,6) = 12).", "ru": "Общий знаменатель для чисел 3, 4 и 6 равен 12 (НОК(3,4,6) = 12).", "pt": "O denominador comum para 3, 4 e 6 é 12 (m.m.c.(3,4,6) = 12)."}, {"sr": "Svedemo razlomke na imenilac 12: 2/3 = 8/12, 1/4 = 3/12, 1/6 = 2/12.", "en": "Convert the fractions to denominator 12: 2/3 = 8/12, 1/4 = 3/12, 1/6 = 2/12.", "de": "Bringe die Brüche auf den Nenner 12: 2/3 = 8/12, 1/4 = 3/12, 1/6 = 2/12.", "fr": "Ramène les fractions au dénominateur 12 : 2/3 = 8/12, 1/4 = 3/12, 1/6 = 2/12.", "es": "Reduce las fracciones al denominador 12: 2/3 = 8/12, 1/4 = 3/12, 1/6 = 2/12.", "it": "Riduci le frazioni al denominatore 12: 2/3 = 8/12, 1/4 = 3/12, 1/6 = 2/12.", "ru": "Приведём дроби к знаменателю 12: 2/3 = 8/12, 1/4 = 3/12, 1/6 = 2/12.", "pt": "Reduz as frações ao denominador 12: 2/3 = 8/12, 1/4 = 3/12, 1/6 = 2/12."}, {"sr": "Saberemo i oduzmemo brojioce: 8/12 + 3/12 − 2/12 = 9/12.", "en": "Add and subtract the numerators: 8/12 + 3/12 − 2/12 = 9/12.", "de": "Addiere und subtrahiere die Zähler: 8/12 + 3/12 − 2/12 = 9/12.", "fr": "Additionne et soustrais les numérateurs : 8/12 + 3/12 − 2/12 = 9/12.", "es": "Suma y resta los numeradores: 8/12 + 3/12 − 2/12 = 9/12.", "it": "Somma e sottrai i numeratori: 8/12 + 3/12 − 2/12 = 9/12.", "ru": "Сложим и вычтем числители: 8/12 + 3/12 − 2/12 = 9/12.", "pt": "Soma e subtrai os numeradores: 8/12 + 3/12 − 2/12 = 9/12."}, {"sr": "Skratimo razlomak sa 3: 9/12 = 3/4.", "en": "Simplify by dividing by 3: 9/12 = 3/4.", "de": "Kürze mit 3: 9/12 = 3/4.", "fr": "Simplifie en divisant par 3 : 9/12 = 3/4.", "es": "Simplifica dividiendo entre 3: 9/12 = 3/4.", "it": "Semplifica dividendo per 3: 9/12 = 3/4.", "ru": "Сократим на 3: 9/12 = 3/4.", "pt": "Simplifica dividindo por 3: 9/12 = 3/4."}]}}, {"name": {"sr": "Procenti", "en": "Percentages", "de": "Prozente", "fr": "Pourcentages", "es": "Porcentajes", "it": "Percentuali", "ru": "Проценты", "pt": "Percentagens"}, "theory": {"sr": "<b>Procenat</b> je poseban razlomak sa imeniocem 100: p% = p/100. Da izračunamo p procenata od broja N, pomnožimo N sa p/100, tj. p% od N = N·p/100. Ako znamo koliki je procenat od broja, možemo izračunati i ceo broj (100%), koristeći proporciju ili deljenje.", "en": "<b>A percentage</b> is a special fraction with denominator 100: p% = p/100. To find p percent of a number N, we multiply N by p/100, i.e. p% of N = N·p/100. If we know what percentage a part represents, we can also find the whole (100%) using a proportion or division.", "de": "<b>Ein Prozent</b> ist ein besonderer Bruch mit dem Nenner 100: p% = p/100. Um p Prozent einer Zahl N zu berechnen, multiplizieren wir N mit p/100, also p% von N = N·p/100. Kennen wir den Prozentsatz eines Teils, können wir mithilfe einer Proportion oder Division auch das Ganze (100%) berechnen.", "fr": "<b>Un pourcentage</b> est une fraction particulière de dénominateur 100 : p% = p/100. Pour calculer p pour cent d'un nombre N, on multiplie N par p/100, c'est-à-dire p% de N = N·p/100. Si l'on connaît le pourcentage que représente une partie, on peut aussi calculer le tout (100%) à l'aide d'une proportion ou d'une division.", "es": "<b>Un porcentaje</b> es una fracción especial con denominador 100: p% = p/100. Para calcular el p por ciento de un número N, multiplicamos N por p/100, es decir, p% de N = N·p/100. Si sabemos qué porcentaje representa una parte, también podemos calcular el todo (100%) usando una proporción o una división.", "it": "<b>Una percentuale</b> è una frazione particolare con denominatore 100: p% = p/100. Per calcolare il p per cento di un numero N, moltiplichiamo N per p/100, cioè p% di N = N·p/100. Se conosciamo la percentuale rappresentata da una parte, possiamo calcolare anche l'intero (100%) usando una proporzione o una divisione.", "ru": "<b>Процент</b> - это особая дробь со знаменателем 100: p% = p/100. Чтобы найти p процентов от числа N, умножаем N на p/100, то есть p% от N = N·p/100. Если известно, сколько процентов составляет часть, можно найти и целое (100%) с помощью пропорции или деления.", "pt": "<b>Uma percentagem</b> é uma fração especial com denominador 100: p% = p/100. Para calcular p por cento de um número N, multiplicamos N por p/100, ou seja, p% de N = N·p/100. Se soubermos que percentagem representa uma parte, também podemos calcular o todo (100%) usando uma proporção ou uma divisão."}, "formulas": [{"sr": "p% od N = N·p/100", "en": "p% of N = N·p/100", "de": "p% von N = N·p/100", "fr": "p% de N = N·p/100", "es": "p% de N = N·p/100", "it": "p% di N = N·p/100", "ru": "p% от N = N·p/100", "pt": "p% de N = N·p/100"}, {"sr": "p% = a/N · 100  (a je deo, N je celina)", "en": "p% = a/N · 100  (a is the part, N is the whole)", "de": "p% = a/N · 100  (a ist der Teil, N das Ganze)", "fr": "p% = a/N · 100  (a est la partie, N est le tout)", "es": "p% = a/N · 100  (a es la parte, N es el todo)", "it": "p% = a/N · 100  (a è la parte, N è l'intero)", "ru": "p% = a/N · 100  (a - часть, N - целое)", "pt": "p% = a/N · 100  (a é a parte, N é o todo)"}, {"sr": "N = a·100/p  (izračunavanje celine kada znamo deo i procenat)", "en": "N = a·100/p  (finding the whole when we know the part and the percentage)", "de": "N = a·100/p  (Berechnung des Ganzen, wenn Teil und Prozentsatz bekannt sind)", "fr": "N = a·100/p  (calcul du tout quand on connaît la partie et le pourcentage)", "es": "N = a·100/p  (cálculo del todo cuando se conocen la parte y el porcentaje)", "it": "N = a·100/p  (calcolo dell'intero conoscendo la parte e la percentuale)", "ru": "N = a·100/p  (вычисление целого, если известны часть и процент)", "pt": "N = a·100/p  (cálculo do todo quando se conhecem a parte e a percentagem)"}], "remember": {"sr": "50% je polovina, 25% je četvrtina, 10% dobijamo tako što broj podelimo sa 10 - ovo su korisne prečice za brzo procenjivanje rezultata.", "en": "50% is a half, 25% is a quarter, and 10% is found by dividing the number by 10 - these are useful shortcuts for quickly estimating the result.", "de": "50% ist die Hälfte, 25% ist ein Viertel, 10% erhält man, indem man die Zahl durch 10 teilt - das sind nützliche Abkürzungen, um Ergebnisse schnell abzuschätzen.", "fr": "50% correspond à la moitié, 25% au quart, et 10% s'obtient en divisant le nombre par 10 - ce sont des raccourcis utiles pour estimer rapidement un résultat.", "es": "El 50% es la mitad, el 25% es la cuarta parte, y el 10% se obtiene dividiendo el número entre 10 - estos son atajos útiles para estimar rápidamente un resultado.", "it": "Il 50% è la metà, il 25% è un quarto, e il 10% si ottiene dividendo il numero per 10 - queste sono scorciatoie utili per stimare rapidamente il risultato.", "ru": "50% - это половина, 25% - четверть, а 10% получают, разделив число на 10 - это полезные приёмы для быстрой оценки результата.", "pt": "50% é a metade, 25% é um quarto, e 10% obtém-se dividindo o número por 10 - estes são atalhos úteis para estimar rapidamente o resultado."}, "problem": {"statement": {"sr": "U razredu ima 25 učenika, od kojih je 40% dečaci. Koliko je dečaka u razredu?", "en": "There are 25 students in the class, of whom 40% are boys. How many boys are in the class?", "de": "In der Klasse sind 25 Schüler, davon sind 40% Jungen. Wie viele Jungen sind in der Klasse?", "fr": "Il y a 25 élèves dans la classe, dont 40% sont des garçons. Combien de garçons y a-t-il dans la classe ?", "es": "En la clase hay 25 alumnos, de los cuales el 40% son niños. ¿Cuántos niños hay en la clase?", "it": "In classe ci sono 25 alunni, di cui il 40% sono maschi. Quanti maschi ci sono in classe?", "ru": "В классе 25 учеников, из них 40% - мальчики. Сколько мальчиков в классе?", "pt": "Há 25 alunos na turma, dos quais 40% são rapazes. Quantos rapazes há na turma?"}, "steps": [{"sr": "Zapišemo 40% kao razlomak: 40% = 40/100.", "en": "Write 40% as a fraction: 40% = 40/100.", "de": "Schreibe 40% als Bruch: 40% = 40/100.", "fr": "Écris 40% sous forme de fraction : 40% = 40/100.", "es": "Escribe 40% como fracción: 40% = 40/100.", "it": "Scrivi 40% come frazione: 40% = 40/100.", "ru": "Запишем 40% в виде дроби: 40% = 40/100.", "pt": "Escreve 40% como fração: 40% = 40/100."}, {"sr": "Broj dečaka računamo kao 40% od 25: 25 · 40/100.", "en": "The number of boys is 40% of 25: 25 · 40/100.", "de": "Die Anzahl der Jungen ist 40% von 25: 25 · 40/100.", "fr": "Le nombre de garçons est 40% de 25 : 25 · 40/100.", "es": "El número de niños es el 40% de 25: 25 · 40/100.", "it": "Il numero di maschi è il 40% di 25: 25 · 40/100.", "ru": "Число мальчиков составляет 40% от 25: 25 · 40/100.", "pt": "O número de rapazes é 40% de 25: 25 · 40/100."}, {"sr": "Izračunamo: 25 · 40/100 = 1000/100 = 10.", "en": "Calculate: 25 · 40/100 = 1000/100 = 10.", "de": "Berechne: 25 · 40/100 = 1000/100 = 10.", "fr": "Calcule : 25 · 40/100 = 1000/100 = 10.", "es": "Calcula: 25 · 40/100 = 1000/100 = 10.", "it": "Calcola: 25 · 40/100 = 1000/100 = 10.", "ru": "Вычислим: 25 · 40/100 = 1000/100 = 10.", "pt": "Calcula: 25 · 40/100 = 1000/100 = 10."}, {"sr": "U razredu ima 10 dečaka.", "en": "There are 10 boys in the class.", "de": "In der Klasse sind 10 Jungen.", "fr": "Il y a 10 garçons dans la classe.", "es": "Hay 10 niños en la clase.", "it": "Nella classe ci sono 10 maschi.", "ru": "В классе 10 мальчиков.", "pt": "Há 10 rapazes na turma."}]}}, {"name": {"sr": "Proporcije", "en": "Proportions", "de": "Proportionen", "fr": "Proportions", "es": "Proporciones", "it": "Proporzioni", "ru": "Пропорции", "pt": "Proporções"}, "theory": {"sr": "<b>Proporcija</b> je jednakost dva razmera: a : b = c : d, što čitamo 'a prema b jednako je c prema d'. Osnovno svojstvo proporcije glasi: proizvod spoljašnjih članova jednak je proizvodu unutrašnjih članova, tj. a·d = b·c. Ovo svojstvo koristimo da izračunamo nepoznati član proporcije. Razlikujemo pravu (direktnu) proporcionalnost, gde veličine rastu zajedno, i obrnutu (indirektnu), gde jedna veličina raste dok druga opada.", "en": "<b>A proportion</b> is an equality of two ratios: a : b = c : d, read as 'a is to b as c is to d'. The basic property of a proportion states that the product of the outer terms equals the product of the inner terms, i.e. a·d = b·c. We use this property to find an unknown term of the proportion. We distinguish direct proportionality, where the quantities increase together, from inverse proportionality, where one quantity increases while the other decreases.", "de": "<b>Eine Proportion</b> ist die Gleichheit zweier Verhältnisse: a : b = c : d, gelesen als 'a verhält sich zu b wie c zu d'. Die Grundeigenschaft der Proportion lautet: das Produkt der äußeren Glieder ist gleich dem Produkt der inneren Glieder, also a·d = b·c. Diese Eigenschaft nutzen wir, um ein unbekanntes Glied der Proportion zu berechnen. Man unterscheidet die direkte Proportionalität, bei der die Größen gemeinsam wachsen, und die umgekehrte (indirekte) Proportionalität, bei der eine Größe wächst, während die andere abnimmt.", "fr": "<b>Une proportion</b> est l'égalité de deux rapports : a : b = c : d, qui se lit 'a est à b comme c est à d'. La propriété fondamentale d'une proportion énonce que le produit des extrêmes est égal au produit des moyens, c'est-à-dire a·d = b·c. On utilise cette propriété pour calculer un terme inconnu de la proportion. On distingue la proportionnalité directe, où les grandeurs augmentent ensemble, de la proportionnalité inverse, où une grandeur augmente tandis que l'autre diminue.", "es": "<b>Una proporción</b> es la igualdad de dos razones: a : b = c : d, que se lee 'a es a b como c es a d'. La propiedad fundamental de la proporción establece que el producto de los extremos es igual al producto de los medios, es decir, a·d = b·c. Usamos esta propiedad para calcular un término desconocido de la proporción. Distinguimos la proporcionalidad directa, en la que las magnitudes aumentan juntas, de la inversa, en la que una magnitud aumenta mientras la otra disminuye.", "it": "<b>Una proporzione</b> è l'uguaglianza di due rapporti: a : b = c : d, che si legge 'a sta a b come c sta a d'. La proprietà fondamentale della proporzione afferma che il prodotto degli estremi è uguale al prodotto dei medi, cioè a·d = b·c. Usiamo questa proprietà per calcolare un termine incognito della proporzione. Distinguiamo la proporzionalità diretta, in cui le grandezze crescono insieme, da quella inversa, in cui una grandezza cresce mentre l'altra diminuisce.", "ru": "<b>Пропорция</b> - это равенство двух отношений: a : b = c : d, читается как 'a относится к b, как c относится к d'. Основное свойство пропорции: произведение крайних членов равно произведению средних членов, то есть a·d = b·c. Это свойство используют для нахождения неизвестного члена пропорции. Различают прямую пропорциональность, при которой величины возрастают вместе, и обратную, при которой одна величина возрастает, а другая убывает.", "pt": "<b>Uma proporção</b> é a igualdade de duas razões: a : b = c : d, que se lê 'a está para b assim como c está para d'. A propriedade fundamental da proporção diz que o produto dos extremos é igual ao produto dos meios, ou seja, a·d = b·c. Usamos esta propriedade para calcular um termo desconhecido da proporção. Distinguimos a proporcionalidade direta, em que as grandezas aumentam juntas, da inversa, em que uma grandeza aumenta enquanto a outra diminui."}, "formulas": [{"sr": "a : b = c : d  ⇒  a·d = b·c", "en": "a : b = c : d  ⇒  a·d = b·c", "de": "a : b = c : d  ⇒  a·d = b·c", "fr": "a : b = c : d  ⇒  a·d = b·c", "es": "a : b = c : d  ⇒  a·d = b·c", "it": "a : b = c : d  ⇒  a·d = b·c", "ru": "a : b = c : d  ⇒  a·d = b·c", "pt": "a : b = c : d  ⇒  a·d = b·c"}, {"sr": "x = b·c/a  (nepoznati član proporcije)", "en": "x = b·c/a  (unknown term of the proportion)", "de": "x = b·c/a  (unbekanntes Glied der Proportion)", "fr": "x = b·c/a  (terme inconnu de la proportion)", "es": "x = b·c/a  (término desconocido de la proporción)", "it": "x = b·c/a  (termine incognito della proporzione)", "ru": "x = b·c/a  (неизвестный член пропорции)", "pt": "x = b·c/a  (termo desconhecido da proporção)"}, {"sr": "Direktna proporcionalnost: y = k·x  (y/x = const)", "en": "Direct proportionality: y = k·x  (y/x = const)", "de": "Direkte Proportionalität: y = k·x  (y/x = konstant)", "fr": "Proportionnalité directe : y = k·x  (y/x = constante)", "es": "Proporcionalidad directa: y = k·x  (y/x = constante)", "it": "Proporzionalità diretta: y = k·x  (y/x = costante)", "ru": "Прямая пропорциональность: y = k·x  (y/x = const)", "pt": "Proporcionalidade direta: y = k·x  (y/x = constante)"}], "remember": {"sr": "Kod obrnute proporcionalnosti proizvod odgovarajućih veličina je konstantan: x·y = const, pa se pri postavljanju proporcije jedan od razmera 'obrne'.", "en": "In inverse proportionality, the product of the corresponding quantities is constant: x·y = const, so when setting up the proportion one of the ratios is 'flipped'.", "de": "Bei umgekehrter Proportionalität ist das Produkt der entsprechenden Größen konstant: x·y = konstant, deshalb wird beim Aufstellen der Proportion eines der Verhältnisse 'umgedreht'.", "fr": "Dans la proportionnalité inverse, le produit des grandeurs correspondantes est constant : x·y = constante, donc lors de la mise en place de la proportion, l'un des rapports est 'inversé'.", "es": "En la proporcionalidad inversa, el producto de las magnitudes correspondientes es constante: x·y = constante, por lo que al plantear la proporción se 'invierte' una de las razones.", "it": "Nella proporzionalità inversa, il prodotto delle grandezze corrispondenti è costante: x·y = costante, quindi nell'impostare la proporzione uno dei rapporti viene 'invertito'.", "ru": "При обратной пропорциональности произведение соответствующих величин постоянно: x·y = const, поэтому при составлении пропорции одно из отношений 'переворачивают'.", "pt": "Na proporcionalidade inversa, o produto das grandezas correspondentes é constante: x·y = constante, por isso, ao montar a proporção, uma das razões é 'invertida'."}, "problem": {"statement": {"sr": "Za 4 radnika potrebno je 15 dana da izgrade zid. Za koliko dana bi isti zid izgradilo 6 radnika (ako rade istim tempom)?", "en": "It takes 4 workers 15 days to build a wall. How many days would it take 6 workers to build the same wall (working at the same pace)?", "de": "4 Arbeiter brauchen 15 Tage, um eine Mauer zu bauen. Wie viele Tage würden 6 Arbeiter für dieselbe Mauer brauchen (bei gleichem Arbeitstempo)?", "fr": "4 ouvriers mettent 15 jours à construire un mur. Combien de jours faudrait-il à 6 ouvriers pour construire le même mur (au même rythme) ?", "es": "4 trabajadores tardan 15 días en construir un muro. ¿Cuántos días tardarían 6 trabajadores en construir el mismo muro (trabajando al mismo ritmo)?", "it": "4 operai impiegano 15 giorni per costruire un muro. Quanti giorni impiegherebbero 6 operai per costruire lo stesso muro (lavorando allo stesso ritmo)?", "ru": "4 рабочим нужно 15 дней, чтобы построить стену. За сколько дней ту же стену построят 6 рабочих (работая в том же темпе)?", "pt": "São necessários 4 trabalhadores durante 15 dias para construir um muro. Quantos dias demorariam 6 trabalhadores a construir o mesmo muro (trabalhando ao mesmo ritmo)?"}, "steps": [{"sr": "Ovo je obrnuta proporcionalnost - što je više radnika, to je manje potrebno dana.", "en": "This is inverse proportionality - the more workers there are, the fewer days are needed.", "de": "Dies ist umgekehrte Proportionalität - je mehr Arbeiter, desto weniger Tage werden benötigt.", "fr": "Il s'agit d'une proportionnalité inverse - plus il y a d'ouvriers, moins il faut de jours.", "es": "Esta es una proporcionalidad inversa - cuantos más trabajadores haya, menos días se necesitan.", "it": "Questa è una proporzionalità inversa - più operai ci sono, meno giorni servono.", "ru": "Это обратная пропорциональность - чем больше рабочих, тем меньше дней нужно.", "pt": "Esta é uma proporcionalidade inversa - quanto mais trabalhadores houver, menos dias são necessários."}, {"sr": "Proizvod broja radnika i broja dana je konstantan: 4 · 15 = 6 · x.", "en": "The product of the number of workers and the number of days is constant: 4 · 15 = 6 · x.", "de": "Das Produkt aus Anzahl der Arbeiter und Anzahl der Tage ist konstant: 4 · 15 = 6 · x.", "fr": "Le produit du nombre d'ouvriers et du nombre de jours est constant : 4 · 15 = 6 · x.", "es": "El producto del número de trabajadores y el número de días es constante: 4 · 15 = 6 · x.", "it": "Il prodotto del numero di operai e del numero di giorni è costante: 4 · 15 = 6 · x.", "ru": "Произведение числа рабочих и числа дней постоянно: 4 · 15 = 6 · x.", "pt": "O produto do número de trabalhadores pelo número de dias é constante: 4 · 15 = 6 · x."}, {"sr": "Izračunamo: 60 = 6·x, pa je x = 60 : 6 = 10.", "en": "Calculate: 60 = 6·x, so x = 60 : 6 = 10.", "de": "Berechne: 60 = 6·x, also x = 60 : 6 = 10.", "fr": "Calcule : 60 = 6·x, donc x = 60 : 6 = 10.", "es": "Calcula: 60 = 6·x, entonces x = 60 : 6 = 10.", "it": "Calcola: 60 = 6·x, quindi x = 60 : 6 = 10.", "ru": "Вычислим: 60 = 6·x, значит x = 60 : 6 = 10.", "pt": "Calcula: 60 = 6·x, logo x = 60 : 6 = 10."}, {"sr": "Šestorici radnika bi bilo potrebno 10 dana.", "en": "Six workers would need 10 days.", "de": "Sechs Arbeiter würden 10 Tage benötigen.", "fr": "Six ouvriers auraient besoin de 10 jours.", "es": "Seis trabajadores necesitarían 10 días.", "it": "Sei operai impiegherebbero 10 giorni.", "ru": "Шести рабочим потребуется 10 дней.", "pt": "Seis trabalhadores precisariam de 10 dias."}]}}, {"name": {"sr": "Trougao i četvorougao", "en": "Triangle and quadrilateral", "de": "Dreieck und Viereck", "fr": "Triangle et quadrilatère", "es": "Triángulo y cuadrilátero", "it": "Triangolo e quadrilatero", "ru": "Треугольник и четырёхугольник", "pt": "Triângulo e quadrilátero"}, "theory": {"sr": "<b>Trougao</b> ima tri stranice i tri ugla čiji je zbir uvek 180°. Prema stranicama trouglove delimo na raznostranične, jednakokrake i jednakostranične, a prema uglovima na oštrougle, pravougle i tupougle. <b>Četvorougao</b> ima četiri stranice i četiri ugla čiji je zbir 360°. Najvažniji četvorouglovi su kvadrat, pravougaonik, paralelogram, romb i trapez, koji se razlikuju po odnosu stranica i uglova.", "en": "<b>A triangle</b> has three sides and three angles whose sum is always 180°. By their sides, triangles are divided into scalene, isosceles and equilateral, and by their angles into acute, right and obtuse. <b>A quadrilateral</b> has four sides and four angles whose sum is 360°. The most important quadrilaterals are the square, rectangle, parallelogram, rhombus and trapezoid, which differ in the relationships between their sides and angles.", "de": "<b>Ein Dreieck</b> hat drei Seiten und drei Winkel, deren Summe stets 180° beträgt. Nach den Seiten unterscheidet man ungleichseitige, gleichschenklige und gleichseitige Dreiecke, nach den Winkeln spitzwinklige, rechtwinklige und stumpfwinklige. <b>Ein Viereck</b> hat vier Seiten und vier Winkel, deren Summe 360° beträgt. Die wichtigsten Vierecke sind Quadrat, Rechteck, Parallelogramm, Raute und Trapez, die sich durch das Verhältnis ihrer Seiten und Winkel unterscheiden.", "fr": "<b>Un triangle</b> a trois côtés et trois angles dont la somme vaut toujours 180°. Selon les côtés, on distingue les triangles scalènes, isocèles et équilatéraux, et selon les angles, les triangles acutangles, rectangles et obtusangles. <b>Un quadrilatère</b> a quatre côtés et quatre angles dont la somme vaut 360°. Les quadrilatères les plus importants sont le carré, le rectangle, le parallélogramme, le losange et le trapèze, qui se distinguent par la relation entre leurs côtés et leurs angles.", "es": "<b>Un triángulo</b> tiene tres lados y tres ángulos cuya suma es siempre 180°. Según sus lados, los triángulos se clasifican en escalenos, isósceles y equiláteros, y según sus ángulos, en acutángulos, rectángulos y obtusángulos. <b>Un cuadrilátero</b> tiene cuatro lados y cuatro ángulos cuya suma es 360°. Los cuadriláteros más importantes son el cuadrado, el rectángulo, el paralelogramo, el rombo y el trapecio, que se diferencian por la relación entre sus lados y ángulos.", "it": "<b>Un triangolo</b> ha tre lati e tre angoli la cui somma è sempre 180°. In base ai lati, i triangoli si dividono in scaleni, isosceli ed equilateri, e in base agli angoli in acutangoli, rettangoli e ottusangoli. <b>Un quadrilatero</b> ha quattro lati e quattro angoli la cui somma è 360°. I quadrilateri più importanti sono il quadrato, il rettangolo, il parallelogramma, il rombo e il trapezio, che si differenziano per il rapporto tra i lati e gli angoli.", "ru": "<b>Треугольник</b> имеет три стороны и три угла, сумма которых всегда равна 180°. По сторонам треугольники делятся на разносторонние, равнобедренные и равносторонние, а по углам - на остроугольные, прямоугольные и тупоугольные. <b>Четырёхугольник</b> имеет четыре стороны и четыре угла, сумма которых равна 360°. Важнейшие четырёхугольники - квадрат, прямоугольник, параллелограмм, ромб и трапеция, которые различаются соотношением сторон и углов.", "pt": "<b>Um triângulo</b> tem três lados e três ângulos cuja soma é sempre 180°. Quanto aos lados, os triângulos dividem-se em escalenos, isósceles e equiláteros, e quanto aos ângulos, em acutângulos, retângulos e obtusângulos. <b>Um quadrilátero</b> tem quatro lados e quatro ângulos cuja soma é 360°. Os quadriláteros mais importantes são o quadrado, o retângulo, o paralelogramo, o losango e o trapézio, que se distinguem pela relação entre os seus lados e ângulos."}, "formulas": [{"sr": "α + β + γ = 180°  (zbir uglova trougla)", "en": "α + β + γ = 180°  (sum of the angles of a triangle)", "de": "α + β + γ = 180°  (Winkelsumme im Dreieck)", "fr": "α + β + γ = 180°  (somme des angles d'un triangle)", "es": "α + β + γ = 180°  (suma de los ángulos de un triángulo)", "it": "α + β + γ = 180°  (somma degli angoli di un triangolo)", "ru": "α + β + γ = 180°  (сумма углов треугольника)", "pt": "α + β + γ = 180°  (soma dos ângulos de um triângulo)"}, {"sr": "Zbir uglova četvorougla = 360°", "en": "Sum of the angles of a quadrilateral = 360°", "de": "Winkelsumme im Viereck = 360°", "fr": "Somme des angles d'un quadrilatère = 360°", "es": "Suma de los ángulos de un cuadrilátero = 360°", "it": "Somma degli angoli di un quadrilatero = 360°", "ru": "Сумма углов четырёхугольника = 360°", "pt": "Soma dos ângulos de um quadrilátero = 360°"}, {"sr": "Nejednakost trougla: a < b + c  (svaka stranica manja od zbira druge dve)", "en": "Triangle inequality: a < b + c  (each side is smaller than the sum of the other two)", "de": "Dreiecksungleichung: a < b + c  (jede Seite ist kleiner als die Summe der anderen beiden)", "fr": "Inégalité triangulaire : a < b + c  (chaque côté est inférieur à la somme des deux autres)", "es": "Desigualdad triangular: a < b + c  (cada lado es menor que la suma de los otros dos)", "it": "Disuguaglianza triangolare: a < b + c  (ogni lato è minore della somma degli altri due)", "ru": "Неравенство треугольника: a < b + c  (каждая сторона меньше суммы двух других)", "pt": "Desigualdade triangular: a < b + c  (cada lado é menor que a soma dos outros dois)"}], "remember": {"sr": "U jednakokrakom trouglu uglovi uz osnovicu su jednaki; u pravougaoniku i kvadratu svi uglovi su pravi (90°), a u paralelogramu naspramni uglovi su jednaki.", "en": "In an isosceles triangle, the angles at the base are equal; in a rectangle and a square all angles are right angles (90°), while in a parallelogram opposite angles are equal.", "de": "Im gleichschenkligen Dreieck sind die Basiswinkel gleich; im Rechteck und im Quadrat sind alle Winkel rechte Winkel (90°), im Parallelogramm sind die gegenüberliegenden Winkel gleich.", "fr": "Dans un triangle isocèle, les angles à la base sont égaux ; dans un rectangle et un carré, tous les angles sont droits (90°), tandis que dans un parallélogramme, les angles opposés sont égaux.", "es": "En un triángulo isósceles, los ángulos de la base son iguales; en un rectángulo y un cuadrado todos los ángulos son rectos (90°), mientras que en un paralelogramo los ángulos opuestos son iguales.", "it": "In un triangolo isoscele, gli angoli alla base sono uguali; in un rettangolo e in un quadrato tutti gli angoli sono retti (90°), mentre in un parallelogramma gli angoli opposti sono uguali.", "ru": "В равнобедренном треугольнике углы при основании равны; в прямоугольнике и квадрате все углы прямые (90°), а в параллелограмме противоположные углы равны.", "pt": "Num triângulo isósceles, os ângulos da base são iguais; num retângulo e num quadrado todos os ângulos são retos (90°), enquanto num paralelogramo os ângulos opostos são iguais."}, "problem": {"statement": {"sr": "U trouglu je jedan ugao 90°, a drugi 35°. Koliki je treći ugao?", "en": "In a triangle, one angle is 90° and another is 35°. What is the third angle?", "de": "In einem Dreieck beträgt ein Winkel 90° und ein anderer 35°. Wie groß ist der dritte Winkel?", "fr": "Dans un triangle, un angle mesure 90° et un autre 35°. Quelle est la mesure du troisième angle ?", "es": "En un triángulo, un ángulo mide 90° y otro 35°. ¿Cuánto mide el tercer ángulo?", "it": "In un triangolo, un angolo misura 90° e un altro 35°. Quanto misura il terzo angolo?", "ru": "В треугольнике один угол равен 90°, а другой - 35°. Чему равен третий угол?", "pt": "Num triângulo, um ângulo mede 90° e outro 35°. Quanto mede o terceiro ângulo?"}, "steps": [{"sr": "Zbir uglova trougla je uvek 180°.", "en": "The sum of the angles of a triangle is always 180°.", "de": "Die Winkelsumme im Dreieck beträgt immer 180°.", "fr": "La somme des angles d'un triangle vaut toujours 180°.", "es": "La suma de los ángulos de un triángulo siempre es 180°.", "it": "La somma degli angoli di un triangolo è sempre 180°.", "ru": "Сумма углов треугольника всегда равна 180°.", "pt": "A soma dos ângulos de um triângulo é sempre 180°."}, {"sr": "Saberemo poznata dva ugla: 90° + 35° = 125°.", "en": "Add the two known angles: 90° + 35° = 125°.", "de": "Addiere die beiden bekannten Winkel: 90° + 35° = 125°.", "fr": "Additionne les deux angles connus : 90° + 35° = 125°.", "es": "Suma los dos ángulos conocidos: 90° + 35° = 125°.", "it": "Somma i due angoli noti: 90° + 35° = 125°.", "ru": "Сложим два известных угла: 90° + 35° = 125°.", "pt": "Soma os dois ângulos conhecidos: 90° + 35° = 125°."}, {"sr": "Treći ugao je 180° − 125° = 55°.", "en": "The third angle is 180° − 125° = 55°.", "de": "Der dritte Winkel ist 180° − 125° = 55°.", "fr": "Le troisième angle est 180° − 125° = 55°.", "es": "El tercer ángulo es 180° − 125° = 55°.", "it": "Il terzo angolo è 180° − 125° = 55°.", "ru": "Третий угол равен 180° − 125° = 55°.", "pt": "O terceiro ângulo é 180° − 125° = 55°."}]}}, {"name": {"sr": "Površina i obim", "en": "Area and perimeter", "de": "Fläche und Umfang", "fr": "Aire et périmètre", "es": "Área y perímetro", "it": "Area e perimetro", "ru": "Площадь и периметр", "pt": "Área e perímetro"}, "theory": {"sr": "<b>Obim</b> je zbir dužina svih stranica lika, dok je <b>površina</b> mera dela ravni koji lik zauzima. Za pravougaonik i kvadrat postoje jednostavne formule, dok se površina trougla računa kao polovina proizvoda osnovice i visine. Površina paralelograma jednaka je proizvodu osnovice i visine na tu osnovicu, a površina trapeza zavisi od zbira osnovica i visine.", "en": "<b>The perimeter</b> is the sum of the lengths of all the sides of a shape, while <b>the area</b> measures the part of the plane the shape occupies. For a rectangle and a square there are simple formulas, while the area of a triangle is calculated as half the product of the base and the height. The area of a parallelogram equals the product of the base and the height to that base, and the area of a trapezoid depends on the sum of the bases and the height.", "de": "<b>Der Umfang</b> ist die Summe der Längen aller Seiten einer Figur, während die <b>Fläche</b> misst, welchen Teil der Ebene die Figur einnimmt. Für Rechteck und Quadrat gibt es einfache Formeln, während die Fläche eines Dreiecks als die Hälfte des Produkts aus Grundseite und Höhe berechnet wird. Die Fläche eines Parallelogramms ist gleich dem Produkt aus Grundseite und der zugehörigen Höhe, und die Fläche eines Trapezes hängt von der Summe der Grundseiten und der Höhe ab.", "fr": "<b>Le périmètre</b> est la somme des longueurs de tous les côtés d'une figure, tandis que <b>l'aire</b> mesure la partie du plan occupée par la figure. Pour le rectangle et le carré, il existe des formules simples, tandis que l'aire d'un triangle se calcule comme la moitié du produit de la base par la hauteur. L'aire d'un parallélogramme est égale au produit de la base par la hauteur relative à cette base, et l'aire d'un trapèze dépend de la somme des bases et de la hauteur.", "es": "<b>El perímetro</b> es la suma de las longitudes de todos los lados de una figura, mientras que <b>el área</b> mide la parte del plano que ocupa la figura. Para el rectángulo y el cuadrado existen fórmulas sencillas, mientras que el área de un triángulo se calcula como la mitad del producto de la base por la altura. El área de un paralelogramo es igual al producto de la base por la altura correspondiente a esa base, y el área de un trapecio depende de la suma de las bases y la altura.", "it": "<b>Il perimetro</b> è la somma delle lunghezze di tutti i lati di una figura, mentre <b>l'area</b> misura la parte di piano occupata dalla figura. Per il rettangolo e il quadrato esistono formule semplici, mentre l'area di un triangolo si calcola come metà del prodotto tra base e altezza. L'area di un parallelogramma è uguale al prodotto tra la base e l'altezza relativa a quella base, e l'area di un trapezio dipende dalla somma delle basi e dall'altezza.", "ru": "<b>Периметр</b> - это сумма длин всех сторон фигуры, а <b>площадь</b> - это мера части плоскости, которую занимает фигура. Для прямоугольника и квадрата существуют простые формулы, а площадь треугольника вычисляется как половина произведения основания на высоту. Площадь параллелограмма равна произведению основания на высоту, проведённую к этому основанию, а площадь трапеции зависит от суммы оснований и высоты.", "pt": "<b>O perímetro</b> é a soma dos comprimentos de todos os lados de uma figura, enquanto a <b>área</b> mede a parte do plano que a figura ocupa. Para o retângulo e o quadrado existem fórmulas simples, enquanto a área de um triângulo se calcula como metade do produto da base pela altura. A área de um paralelogramo é igual ao produto da base pela altura relativa a essa base, e a área de um trapézio depende da soma das bases e da altura."}, "formulas": [{"sr": "Pravougaonik: O = 2(a + b),  P = a·b", "en": "Rectangle: P = 2(a + b),  A = a·b", "de": "Rechteck: U = 2(a + b),  A = a·b", "fr": "Rectangle : P = 2(a + b),  A = a·b", "es": "Rectángulo: P = 2(a + b),  A = a·b", "it": "Rettangolo: P = 2(a + b),  A = a·b", "ru": "Прямоугольник: P = 2(a + b),  S = a·b", "pt": "Retângulo: P = 2(a + b),  A = a·b"}, {"sr": "Trougao: P = (a·h)/2", "en": "Triangle: A = (a·h)/2", "de": "Dreieck: A = (a·h)/2", "fr": "Triangle : A = (a·h)/2", "es": "Triángulo: A = (a·h)/2", "it": "Triangolo: A = (a·h)/2", "ru": "Треугольник: S = (a·h)/2", "pt": "Triângulo: A = (a·h)/2"}, {"sr": "Trapez: P = ((a + b)·h)/2", "en": "Trapezoid: A = ((a + b)·h)/2", "de": "Trapez: A = ((a + b)·h)/2", "fr": "Trapèze : A = ((a + b)·h)/2", "es": "Trapecio: A = ((a + b)·h)/2", "it": "Trapezio: A = ((a + b)·h)/2", "ru": "Трапеция: S = ((a + b)·h)/2", "pt": "Trapézio: A = ((a + b)·h)/2"}], "remember": {"sr": "Za kvadrat stranice a važi O = 4a i P = a², a kod trougla visina mora biti normalna na osnovicu na koju se odnosi.", "en": "For a square with side a, P = 4a and A = a², and for a triangle the height must be perpendicular to the base it refers to.", "de": "Für ein Quadrat mit der Seite a gilt U = 4a und A = a², und beim Dreieck muss die Höhe senkrecht zur zugehörigen Grundseite stehen.", "fr": "Pour un carré de côté a, on a P = 4a et A = a², et pour un triangle, la hauteur doit être perpendiculaire à la base à laquelle elle se rapporte.", "es": "Para un cuadrado de lado a, P = 4a y A = a², y en un triángulo la altura debe ser perpendicular a la base a la que corresponde.", "it": "Per un quadrato di lato a, P = 4a e A = a², e nel triangolo l'altezza deve essere perpendicolare alla base a cui si riferisce.", "ru": "Для квадрата со стороной a: P = 4a и S = a², а в треугольнике высота должна быть перпендикулярна основанию, к которому она проведена.", "pt": "Para um quadrado de lado a, P = 4a e A = a², e no triângulo a altura deve ser perpendicular à base a que se refere."}, "problem": {"statement": {"sr": "Pravougaonik ima stranice a = 8 cm i b = 5 cm. Izračunaj obim i površinu pravougaonika.", "en": "A rectangle has sides a = 8 cm and b = 5 cm. Calculate the perimeter and the area of the rectangle.", "de": "Ein Rechteck hat die Seiten a = 8 cm und b = 5 cm. Berechne den Umfang und die Fläche des Rechtecks.", "fr": "Un rectangle a pour côtés a = 8 cm et b = 5 cm. Calcule le périmètre et l'aire du rectangle.", "es": "Un rectángulo tiene lados a = 8 cm y b = 5 cm. Calcula el perímetro y el área del rectángulo.", "it": "Un rettangolo ha i lati a = 8 cm e b = 5 cm. Calcola il perimetro e l'area del rettangolo.", "ru": "Прямоугольник имеет стороны a = 8 см и b = 5 см. Вычисли периметр и площадь прямоугольника.", "pt": "Um retângulo tem lados a = 8 cm e b = 5 cm. Calcula o perímetro e a área do retângulo."}, "steps": [{"sr": "Obim računamo po formuli O = 2(a + b) = 2(8 + 5) = 2·13 = 26 cm.", "en": "Calculate the perimeter using P = 2(a + b) = 2(8 + 5) = 2·13 = 26 cm.", "de": "Berechne den Umfang mit U = 2(a + b) = 2(8 + 5) = 2·13 = 26 cm.", "fr": "Calcule le périmètre avec P = 2(a + b) = 2(8 + 5) = 2·13 = 26 cm.", "es": "Calcula el perímetro con P = 2(a + b) = 2(8 + 5) = 2·13 = 26 cm.", "it": "Calcola il perimetro con P = 2(a + b) = 2(8 + 5) = 2·13 = 26 cm.", "ru": "Вычислим периметр по формуле P = 2(a + b) = 2(8 + 5) = 2·13 = 26 см.", "pt": "Calcula o perímetro com P = 2(a + b) = 2(8 + 5) = 2·13 = 26 cm."}, {"sr": "Površinu računamo po formuli P = a·b = 8·5 = 40 cm².", "en": "Calculate the area using A = a·b = 8·5 = 40 cm².", "de": "Berechne die Fläche mit A = a·b = 8·5 = 40 cm².", "fr": "Calcule l'aire avec A = a·b = 8·5 = 40 cm².", "es": "Calcula el área con A = a·b = 8·5 = 40 cm².", "it": "Calcola l'area con A = a·b = 8·5 = 40 cm².", "ru": "Вычислим площадь по формуле S = a·b = 8·5 = 40 см².", "pt": "Calcula a área com A = a·b = 8·5 = 40 cm²."}, {"sr": "Obim pravougaonika je 26 cm, a površina 40 cm².", "en": "The perimeter of the rectangle is 26 cm, and the area is 40 cm².", "de": "Der Umfang des Rechtecks beträgt 26 cm, die Fläche 40 cm².", "fr": "Le périmètre du rectangle est 26 cm, et l'aire est 40 cm².", "es": "El perímetro del rectángulo es 26 cm, y el área es 40 cm².", "it": "Il perimetro del rettangolo è 26 cm, e l'area è 40 cm².", "ru": "Периметр прямоугольника равен 26 см, а площадь - 40 см².", "pt": "O perímetro do retângulo é 26 cm, e a área é 40 cm²."}]}}], "C": {"next": {"sr": "Dalje →", "en": "Next →", "de": "Weiter →", "fr": "Suivant →", "es": "Siguiente →", "it": "Avanti →", "ru": "Дальше →", "pt": "Seguinte →"}, "prev": {"sr": "← Nazad", "en": "← Back", "de": "← Zurück", "fr": "← Retour", "es": "← Atrás", "it": "← Indietro", "ru": "← Назад", "pt": "← Voltar"}, "finish": {"sr": "Završi 🎉", "en": "Finish 🎉", "de": "Fertig 🎉", "fr": "Terminer 🎉", "es": "Terminar 🎉", "it": "Finisci 🎉", "ru": "Готово 🎉", "pt": "Terminar 🎉"}, "done": {"sr": "Bravo, prešao si skriptu! 🎉", "en": "Yay, you finished the notes! 🎉", "de": "Super, Skript geschafft! 🎉", "fr": "Bravo, cours terminé ! 🎉", "es": "¡Bien, terminaste los apuntes! 🎉", "it": "Bravo, dispensa completata! 🎉", "ru": "Ура, конспект пройден! 🎉", "pt": "Boa, terminaste os apontamentos! 🎉"}, "doneSub": {"sr": "Sad si spreman za kviz 💪", "en": "Now you're ready for the quiz 💪", "de": "Jetzt bist du bereit fürs Quiz 💪", "fr": "Tu es prêt pour le quiz 💪", "es": "Ya estás listo para el test 💪", "it": "Ora sei pronto per il quiz 💪", "ru": "Теперь ты готов к тесту 💪", "pt": "Agora estás pronto para o quiz 💪"}, "toQuiz": {"sr": "Uradi kviz 🎯", "en": "Take the quiz 🎯", "de": "Zum Quiz 🎯", "fr": "Faire le quiz 🎯", "es": "Hacer el test 🎯", "it": "Fai il quiz 🎯", "ru": "Пройти тест 🎯", "pt": "Fazer o quiz 🎯"}, "toClone": {"sr": "Uči uz Profesoricu 💛", "en": "Learn with Profesorica 💛", "de": "Mit Profesorica lernen 💛", "fr": "Apprendre avec Profesorica 💛", "es": "Aprende con Profesorica 💛", "it": "Impara con Profesorica 💛", "ru": "Учиться с Profesorica 💛", "pt": "Aprende com a Profesorica 💛"}}, "back": "osnovna-matematika-6.html", "quiz": "Provera-Matematika-6.html"};

 var nx=$('next');if(nx)nx.onclick=function(){i++;render();sparkle()};

<style>
:root{--cream:#FBF6EE;--ink:#5A1024;--ink2:#7A3346;--gold:#C6A05C;--goldlt:#F0DCA8;--malina:#B01E48;--malina2:#CC5E7E;--mint:#3FB98C;--muted:#8A7A80}

 background:radial-gradient(520px 400px at 104% -6%,#F6E1EC 0,transparent 56%),radial-gradient(500px 380px at -6% 106%,#F7ECD6 0,transparent 58%),var(--cream);overflow-x:hidden}

.wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:14px 16px 30px}
.top{display:flex;align-items:center;gap:10px;padding:4px 2px 10px}
.top .back{color:var(--ink2);text-decoration:none;font-weight:800;font-size:1.1rem}
.top .lang{margin-left:auto;border:1px solid var(--goldlt);border-radius:100px;padding:5px 10px;font-family:inherit;font-weight:800;font-size:.72rem;color:var(--ink);background:#fff}

 padding:26px 22px 22px;box-shadow:0 30px 70px -34px rgba(90,16,36,.5);animation:slidein .45s cubic-bezier(.2,.9,.2,1)}

.eyebrow{text-align:center;font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:.64rem;color:var(--malina)}

@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.zap{margin:16px auto 2px;max-width:460px;background:linear-gradient(180deg,#FFF7FA,#FBEEF2);border:1px solid #F0D6DF;border-radius:18px;padding:13px 16px;display:flex;gap:10px;align-items:flex-start}

.zap p{margin:0;color:var(--ink2);font-size:.95rem;font-weight:600}
.nav{display:flex;align-items:center;gap:12px;margin-top:16px}

.nav .next{flex:1;border:none;cursor:pointer;background:linear-gradient(135deg,var(--malina2),var(--malina));color:#fff;font-weight:900;font-size:1.05rem;padding:14px;border-radius:100px;box-shadow:0 16px 30px -14px rgba(176,30,72,.6);transition:transform .15s}

#conf i{position:absolute;top:-6%;width:10px;height:14px;border-radius:2px;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(560deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

var D={"eyebrow": {"sr": "Matematika · 5. razred", "en": "Maths · Grade 5", "de": "Mathematik · 5. Klasse", "fr": "Mathématiques · 5e année", "es": "Matemáticas · 5.º grado", "it": "Matematica · Classe 5ª", "ru": "Математика · 5 класс", "pt": "Matemática · 5.º ano"}, "topics": [{"name": {"sr": "Prirodni brojevi", "en": "Natural Numbers", "de": "Natürliche Zahlen", "fr": "Nombres naturels", "es": "Números naturales", "it": "Numeri naturali", "ru": "Натуральные числа", "pt": "Números naturais"}, "theory": {"sr": "<b>Prirodni brojevi</b> su brojevi kojima brojimo predmete: 1, 2, 3, 4... Skup prirodnih brojeva je beskonačan i obeležava se sa N. Sabiranje i množenje prirodnih brojeva uvek daju prirodan broj, dok oduzimanje to ne mora.", "en": "<b>Natural numbers</b> are the numbers we use for counting objects: 1, 2, 3, 4... The set of natural numbers is infinite and is denoted by N. Adding or multiplying natural numbers always gives a natural number, but subtraction does not always.", "de": "<b>Natürliche Zahlen</b> sind die Zahlen, mit denen wir Gegenstände zählen: 1, 2, 3, 4... Die Menge der natürlichen Zahlen ist unendlich und wird mit N bezeichnet. Addition und Multiplikation natürlicher Zahlen ergeben immer eine natürliche Zahl, bei der Subtraktion ist das nicht immer der Fall.", "fr": "Les <b>nombres naturels</b> sont les nombres qui servent à compter des objets : 1, 2, 3, 4... L'ensemble des nombres naturels est infini et se note N. L'addition et la multiplication de nombres naturels donnent toujours un nombre naturel, mais la soustraction pas toujours.", "es": "Los <b>números naturales</b> son los números que usamos para contar objetos: 1, 2, 3, 4... El conjunto de los números naturales es infinito y se denota con N. La suma y la multiplicación de números naturales siempre dan un número natural, pero la resta no siempre.", "it": "I <b>numeri naturali</b> sono i numeri che usiamo per contare gli oggetti: 1, 2, 3, 4... L'insieme dei numeri naturali è infinito e si indica con N. L'addizione e la moltiplicazione di numeri naturali danno sempre un numero naturale, mentre la sottrazione non sempre.", "ru": "<b>Натуральные числа</b> — это числа, которыми мы считаем предметы: 1, 2, 3, 4... Множество натуральных чисел бесконечно и обозначается буквой N. Сложение и умножение натуральных чисел всегда дают натуральное число, а вычитание — не всегда.", "pt": "Os <b>números naturais</b> são os números que usamos para contar objetos: 1, 2, 3, 4... O conjunto dos números naturais é infinito e representa-se por N. A soma e a multiplicação de números naturais dão sempre um número natural, mas a subtração nem sempre."}, "formulas": [{"sr": "a + b = b + a  (zamena mesta sabiraka)", "en": "a + b = b + a  (commutativity of addition)", "de": "a + b = b + a  (Kommutativgesetz der Addition)", "fr": "a + b = b + a  (commutativité de l'addition)", "es": "a + b = b + a  (propiedad conmutativa de la suma)", "it": "a + b = b + a  (proprietà commutativa dell'addizione)", "ru": "a + b = b + a  (переместительное свойство сложения)", "pt": "a + b = b + a  (propriedade comutativa da adição)"}, {"sr": "a · b = b · a  (zamena mesta činilaca)", "en": "a · b = b · a  (commutativity of multiplication)", "de": "a · b = b · a  (Kommutativgesetz der Multiplikation)", "fr": "a · b = b · a  (commutativité de la multiplication)", "es": "a · b = b · a  (propiedad conmutativa de la multiplicación)", "it": "a · b = b · a  (proprietà commutativa della moltiplicazione)", "ru": "a · b = b · a  (переместительное свойство умножения)", "pt": "a · b = b · a  (propriedade comutativa da multiplicação)"}, {"sr": "a · (b + c) = a·b + a·c  (distributivni zakon)", "en": "a · (b + c) = a·b + a·c  (distributive law)", "de": "a · (b + c) = a·b + a·c  (Distributivgesetz)", "fr": "a · (b + c) = a·b + a·c  (distributivité)", "es": "a · (b + c) = a·b + a·c  (propiedad distributiva)", "it": "a · (b + c) = a·b + a·c  (proprietà distributiva)", "ru": "a · (b + c) = a·b + a·c  (распределительный закон)", "pt": "a · (b + c) = a·b + a·c  (propriedade distributiva)"}], "remember": {"sr": "Zapamti: nula nije prirodan broj u užem smislu, a najmanji prirodan broj je 1.", "en": "Remember: zero is not a natural number in the strict sense, and the smallest natural number is 1.", "de": "Merke: Null ist im engeren Sinne keine natürliche Zahl, die kleinste natürliche Zahl ist 1.", "fr": "Retiens : zéro n'est pas un nombre naturel au sens strict, le plus petit nombre naturel est 1.", "es": "Recuerda: el cero no es un número natural en sentido estricto, el número natural más pequeño es 1.", "it": "Ricorda: lo zero non è un numero naturale in senso stretto, il più piccolo numero naturale è 1.", "ru": "Запомни: ноль не является натуральным числом в узком смысле, наименьшее натуральное число — 1.", "pt": "Lembra-te: o zero não é um número natural em sentido estrito, o menor número natural é 1."}, "problem": {"statement": {"sr": "Zadatak: Izračunaj vrednost izraza 24 + 6 · (15 − 7).", "en": "Problem: Calculate the value of the expression 24 + 6 · (15 − 7).", "de": "Aufgabe: Berechne den Wert des Ausdrucks 24 + 6 · (15 − 7).", "fr": "Exercice : Calcule la valeur de l'expression 24 + 6 · (15 − 7).", "es": "Ejercicio: Calcula el valor de la expresión 24 + 6 · (15 − 7).", "it": "Esercizio: Calcola il valore dell'espressione 24 + 6 · (15 − 7).", "ru": "Задача: Вычисли значение выражения 24 + 6 · (15 − 7).", "pt": "Exercício: Calcula o valor da expressão 24 + 6 · (15 − 7)."}, "steps": [{"sr": "Prvo rešavamo zagradu: 15 − 7 = 8", "en": "First we solve the bracket: 15 − 7 = 8", "de": "Zuerst lösen wir die Klammer: 15 − 7 = 8", "fr": "On calcule d'abord la parenthèse : 15 − 7 = 8", "es": "Primero resolvemos el paréntesis: 15 − 7 = 8", "it": "Per prima cosa risolviamo la parentesi: 15 − 7 = 8", "ru": "Сначала решаем скобку: 15 − 7 = 8", "pt": "Primeiro resolvemos o parêntese: 15 − 7 = 8"}, {"sr": "Zatim množenje: 6 · 8 = 48", "en": "Then the multiplication: 6 · 8 = 48", "de": "Dann die Multiplikation: 6 · 8 = 48", "fr": "Puis la multiplication : 6 · 8 = 48", "es": "Luego la multiplicación: 6 · 8 = 48", "it": "Poi la moltiplicazione: 6 · 8 = 48", "ru": "Затем умножение: 6 · 8 = 48", "pt": "Depois a multiplicação: 6 · 8 = 48"}, {"sr": "Na kraju sabiranje: 24 + 48 = 72", "en": "Finally the addition: 24 + 48 = 72", "de": "Zum Schluss die Addition: 24 + 48 = 72", "fr": "Enfin l'addition : 24 + 48 = 72", "es": "Por último la suma: 24 + 48 = 72", "it": "Infine l'addizione: 24 + 48 = 72", "ru": "Наконец сложение: 24 + 48 = 72", "pt": "Por fim a adição: 24 + 48 = 72"}]}}, {"name": {"sr": "Deljivost", "en": "Divisibility", "de": "Teilbarkeit", "fr": "Divisibilité", "es": "Divisibilidad", "it": "Divisibilità", "ru": "Делимость", "pt": "Divisibilidade"}, "theory": {"sr": "<b>Deljivost</b> je osobina jednog broja da se drugim brojem deli bez ostatka. Brojevi 2, 3, 5, 9 i 10 imaju jednostavna pravila deljivosti koja pomažu da brzo proverimo da li je deljenje moguće. <b>Prost broj</b> ima tačno dva delioca (1 i sebe), a <b>složen broj</b> ima više od dva delioca.", "en": "<b>Divisibility</b> is the property of a number being divided by another number without a remainder. The numbers 2, 3, 5, 9 and 10 have simple divisibility rules that help us quickly check whether division is possible. A <b>prime number</b> has exactly two divisors (1 and itself), while a <b>composite number</b> has more than two divisors.", "de": "<b>Teilbarkeit</b> ist die Eigenschaft einer Zahl, durch eine andere Zahl ohne Rest teilbar zu sein. Die Zahlen 2, 3, 5, 9 und 10 haben einfache Teilbarkeitsregeln, mit denen wir schnell prüfen können, ob die Division möglich ist. Eine <b>Primzahl</b> hat genau zwei Teiler (1 und sich selbst), eine <b>zusammengesetzte Zahl</b> hat mehr als zwei Teiler.", "fr": "La <b>divisibilité</b> est la propriété d'un nombre à être divisé par un autre nombre sans reste. Les nombres 2, 3, 5, 9 et 10 ont des règles de divisibilité simples qui permettent de vérifier rapidement si la division est possible. Un <b>nombre premier</b> a exactement deux diviseurs (1 et lui-même), tandis qu'un <b>nombre composé</b> a plus de deux diviseurs.", "es": "La <b>divisibilidad</b> es la propiedad de un número de dividirse entre otro número sin dejar resto. Los números 2, 3, 5, 9 y 10 tienen reglas de divisibilidad sencillas que ayudan a comprobar rápidamente si la división es posible. Un <b>número primo</b> tiene exactamente dos divisores (1 y él mismo), mientras que un <b>número compuesto</b> tiene más de dos divisores.", "it": "La <b>divisibilità</b> è la proprietà di un numero di essere diviso per un altro numero senza resto. I numeri 2, 3, 5, 9 e 10 hanno regole di divisibilità semplici che aiutano a verificare rapidamente se la divisione è possibile. Un <b>numero primo</b> ha esattamente due divisori (1 e se stesso), mentre un <b>numero composto</b> ha più di due divisori.", "ru": "<b>Делимость</b> — это свойство числа делиться на другое число без остатка. Числа 2, 3, 5, 9 и 10 имеют простые признаки делимости, которые помогают быстро проверить, возможно ли деление. <b>Простое число</b> имеет ровно два делителя (1 и само себя), а <b>составное число</b> имеет более двух делителей.", "pt": "A <b>divisibilidade</b> é a propriedade de um número ser dividido por outro número sem deixar resto. Os números 2, 3, 5, 9 e 10 têm regras de divisibilidade simples que ajudam a verificar rapidamente se a divisão é possível. Um <b>número primo</b> tem exatamente dois divisores (1 e ele próprio), enquanto um <b>número composto</b> tem mais de dois divisores."}, "formulas": [{"sr": "Deljivo sa 2: poslednja cifra je 0, 2, 4, 6 ili 8", "en": "Divisible by 2: the last digit is 0, 2, 4, 6 or 8", "de": "Teilbar durch 2: die letzte Ziffer ist 0, 2, 4, 6 oder 8", "fr": "Divisible par 2 : le dernier chiffre est 0, 2, 4, 6 ou 8", "es": "Divisible entre 2: la última cifra es 0, 2, 4, 6 u 8", "it": "Divisibile per 2: l'ultima cifra è 0, 2, 4, 6 o 8", "ru": "Делится на 2: последняя цифра 0, 2, 4, 6 или 8", "pt": "Divisível por 2: o último algarismo é 0, 2, 4, 6 ou 8"}, {"sr": "Deljivo sa 3: zbir cifara deljiv je sa 3", "en": "Divisible by 3: the sum of the digits is divisible by 3", "de": "Teilbar durch 3: die Quersumme ist durch 3 teilbar", "fr": "Divisible par 3 : la somme des chiffres est divisible par 3", "es": "Divisible entre 3: la suma de las cifras es divisible entre 3", "it": "Divisibile per 3: la somma delle cifre è divisibile per 3", "ru": "Делится на 3: сумма цифр делится на 3", "pt": "Divisível por 3: a soma dos algarismos é divisível por 3"}, {"sr": "Deljivo sa 5: poslednja cifra je 0 ili 5", "en": "Divisible by 5: the last digit is 0 or 5", "de": "Teilbar durch 5: die letzte Ziffer ist 0 oder 5", "fr": "Divisible par 5 : le dernier chiffre est 0 ou 5", "es": "Divisible entre 5: la última cifra es 0 o 5", "it": "Divisibile per 5: l'ultima cifra è 0 o 5", "ru": "Делится на 5: последняя цифра 0 или 5", "pt": "Divisível por 5: o último algarismo é 0 ou 5"}], "remember": {"sr": "Zapamti: broj 1 nije ni prost ni složen.", "en": "Remember: the number 1 is neither prime nor composite.", "de": "Merke: die Zahl 1 ist weder eine Primzahl noch eine zusammengesetzte Zahl.", "fr": "Retiens : le nombre 1 n'est ni premier ni composé.", "es": "Recuerda: el número 1 no es ni primo ni compuesto.", "it": "Ricorda: il numero 1 non è né primo né composto.", "ru": "Запомни: число 1 не является ни простым, ни составным.", "pt": "Lembra-te: o número 1 não é primo nem composto."}, "problem": {"statement": {"sr": "Zadatak: Da li je broj 3.246 deljiv sa 2, sa 3 i sa 5?", "en": "Problem: Is the number 3,246 divisible by 2, by 3 and by 5?", "de": "Aufgabe: Ist die Zahl 3.246 durch 2, durch 3 und durch 5 teilbar?", "fr": "Exercice : Le nombre 3 246 est-il divisible par 2, par 3 et par 5 ?", "es": "Ejercicio: ¿El número 3.246 es divisible entre 2, entre 3 y entre 5?", "it": "Esercizio: Il numero 3.246 è divisibile per 2, per 3 e per 5?", "ru": "Задача: Делится ли число 3246 на 2, на 3 и на 5?", "pt": "Exercício: O número 3246 é divisível por 2, por 3 e por 5?"}, "steps": [{"sr": "Poslednja cifra je 6, pa je broj deljiv sa 2.", "en": "The last digit is 6, so the number is divisible by 2.", "de": "Die letzte Ziffer ist 6, also ist die Zahl durch 2 teilbar.", "fr": "Le dernier chiffre est 6, donc le nombre est divisible par 2.", "es": "La última cifra es 6, así que el número es divisible entre 2.", "it": "L'ultima cifra è 6, quindi il numero è divisibile per 2.", "ru": "Последняя цифра 6, значит число делится на 2.", "pt": "O último algarismo é 6, logo o número é divisível por 2."}, {"sr": "Zbir cifara: 3+2+4+6 = 15, a 15 je deljivo sa 3, pa je broj deljiv sa 3.", "en": "Sum of digits: 3+2+4+6 = 15, and 15 is divisible by 3, so the number is divisible by 3.", "de": "Quersumme: 3+2+4+6 = 15, und 15 ist durch 3 teilbar, also ist die Zahl durch 3 teilbar.", "fr": "Somme des chiffres : 3+2+4+6 = 15, et 15 est divisible par 3, donc le nombre est divisible par 3.", "es": "Suma de cifras: 3+2+4+6 = 15, y 15 es divisible entre 3, así que el número es divisible entre 3.", "it": "Somma delle cifre: 3+2+4+6 = 15, e 15 è divisibile per 3, quindi il numero è divisibile per 3.", "ru": "Сумма цифр: 3+2+4+6 = 15, а 15 делится на 3, значит число делится на 3.", "pt": "Soma dos algarismos: 3+2+4+6 = 15, e 15 é divisível por 3, logo o número é divisível por 3."}, {"sr": "Poslednja cifra nije 0 ni 5, pa broj nije deljiv sa 5.", "en": "The last digit is neither 0 nor 5, so the number is not divisible by 5.", "de": "Die letzte Ziffer ist weder 0 noch 5, also ist die Zahl nicht durch 5 teilbar.", "fr": "Le dernier chiffre n'est ni 0 ni 5, donc le nombre n'est pas divisible par 5.", "es": "La última cifra no es 0 ni 5, así que el número no es divisible entre 5.", "it": "L'ultima cifra non è né 0 né 5, quindi il numero non è divisibile per 5.", "ru": "Последняя цифра не 0 и не 5, значит число не делится на 5.", "pt": "O último algarismo não é 0 nem 5, logo o número não é divisível por 5."}]}}, {"name": {"sr": "Razlomci", "en": "Fractions", "de": "Brüche", "fr": "Fractions", "es": "Fracciones", "it": "Frazioni", "ru": "Дроби", "pt": "Frações"}, "theory": {"sr": "<b>Razlomak</b> predstavlja deo celine i zapisuje se kao a/b, gde je a brojilac, a b imenilac (b ≠ 0). Razlomci se mogu sabirati, oduzimati, množiti i deliti, a pre sabiranja i oduzimanja razlomaka sa različitim imeniocima potrebno ih je svesti na zajednički imenilac.", "en": "A <b>fraction</b> represents a part of a whole and is written as a/b, where a is the numerator and b is the denominator (b ≠ 0). Fractions can be added, subtracted, multiplied and divided; before adding or subtracting fractions with different denominators, they must be converted to a common denominator.", "de": "Ein <b>Bruch</b> stellt einen Teil eines Ganzen dar und wird als a/b geschrieben, wobei a der Zähler und b der Nenner ist (b ≠ 0). Brüche können addiert, subtrahiert, multipliziert und dividiert werden; vor der Addition oder Subtraktion von Brüchen mit unterschiedlichen Nennern müssen diese auf einen gemeinsamen Nenner gebracht werden.", "fr": "Une <b>fraction</b> représente une partie d'un tout et s'écrit a/b, où a est le numérateur et b le dénominateur (b ≠ 0). Les fractions peuvent être additionnées, soustraites, multipliées et divisées ; avant d'additionner ou de soustraire des fractions ayant des dénominateurs différents, il faut les réduire au même dénominateur.", "es": "Una <b>fracción</b> representa una parte de un todo y se escribe como a/b, donde a es el numerador y b el denominador (b ≠ 0). Las fracciones se pueden sumar, restar, multiplicar y dividir; antes de sumar o restar fracciones con distinto denominador, hay que reducirlas a un denominador común.", "it": "Una <b>frazione</b> rappresenta una parte di un intero e si scrive come a/b, dove a è il numeratore e b è il denominatore (b ≠ 0). Le frazioni si possono sommare, sottrarre, moltiplicare e dividere; prima di sommare o sottrarre frazioni con denominatori diversi, bisogna ridurle allo stesso denominatore.", "ru": "<b>Дробь</b> обозначает часть целого и записывается как a/b, где a — числитель, а b — знаменатель (b ≠ 0). Дроби можно складывать, вычитать, умножать и делить; перед сложением и вычитанием дробей с разными знаменателями их нужно привести к общему знаменателю.", "pt": "Uma <b>fração</b> representa uma parte de um todo e escreve-se como a/b, em que a é o numerador e b é o denominador (b ≠ 0). As frações podem ser somadas, subtraídas, multiplicadas e divididas; antes de somar ou subtrair frações com denominadores diferentes, é preciso reduzi-las ao mesmo denominador."}, "formulas": [{"sr": "a/b + c/b = (a+c)/b  (isti imenioci)", "en": "a/b + c/b = (a+c)/b  (same denominators)", "de": "a/b + c/b = (a+c)/b  (gleiche Nenner)", "fr": "a/b + c/b = (a+c)/b  (mêmes dénominateurs)", "es": "a/b + c/b = (a+c)/b  (mismo denominador)", "it": "a/b + c/b = (a+c)/b  (stesso denominatore)", "ru": "a/b + c/b = (a+c)/b  (одинаковые знаменатели)", "pt": "a/b + c/b = (a+c)/b  (denominadores iguais)"}, {"sr": "a/b · c/d = (a·c)/(b·d)", "en": "a/b · c/d = (a·c)/(b·d)", "de": "a/b · c/d = (a·c)/(b·d)", "fr": "a/b · c/d = (a·c)/(b·d)", "es": "a/b · c/d = (a·c)/(b·d)", "it": "a/b · c/d = (a·c)/(b·d)", "ru": "a/b · c/d = (a·c)/(b·d)", "pt": "a/b · c/d = (a·c)/(b·d)"}, {"sr": "a/b : c/d = a/b · d/c", "en": "a/b : c/d = a/b · d/c", "de": "a/b : c/d = a/b · d/c", "fr": "a/b : c/d = a/b · d/c", "es": "a/b : c/d = a/b · d/c", "it": "a/b : c/d = a/b · d/c", "ru": "a/b : c/d = a/b · d/c", "pt": "a/b : c/d = a/b · d/c"}], "remember": {"sr": "Zapamti: razlomak se ne menja ako brojilac i imenilac pomnožimo ili podelimo istim brojem.", "en": "Remember: a fraction stays the same if we multiply or divide both the numerator and the denominator by the same number.", "de": "Merke: ein Bruch ändert sich nicht, wenn wir Zähler und Nenner mit derselben Zahl multiplizieren oder dividieren.", "fr": "Retiens : une fraction ne change pas si l'on multiplie ou divise le numérateur et le dénominateur par le même nombre.", "es": "Recuerda: una fracción no cambia si multiplicamos o dividimos el numerador y el denominador por el mismo número.", "it": "Ricorda: una frazione non cambia se moltiplichiamo o dividiamo il numeratore e il denominatore per lo stesso numero.", "ru": "Запомни: дробь не меняется, если числитель и знаменатель умножить или разделить на одно и то же число.", "pt": "Lembra-te: uma fração não muda se multiplicarmos ou dividirmos o numerador e o denominador pelo mesmo número."}, "problem": {"statement": {"sr": "Zadatak: Izračunaj 1/4 + 1/6.", "en": "Problem: Calculate 1/4 + 1/6.", "de": "Aufgabe: Berechne 1/4 + 1/6.", "fr": "Exercice : Calcule 1/4 + 1/6.", "es": "Ejercicio: Calcula 1/4 + 1/6.", "it": "Esercizio: Calcola 1/4 + 1/6.", "ru": "Задача: Вычисли 1/4 + 1/6.", "pt": "Exercício: Calcula 1/4 + 1/6."}, "steps": [{"sr": "Zajednički imenilac za 4 i 6 je 12.", "en": "The common denominator for 4 and 6 is 12.", "de": "Der gemeinsame Nenner für 4 und 6 ist 12.", "fr": "Le dénominateur commun de 4 et 6 est 12.", "es": "El denominador común de 4 y 6 es 12.", "it": "Il denominatore comune di 4 e 6 è 12.", "ru": "Общий знаменатель для 4 и 6 равен 12.", "pt": "O denominador comum de 4 e 6 é 12."}, {"sr": "1/4 = 3/12, a 1/6 = 2/12.", "en": "1/4 = 3/12, and 1/6 = 2/12.", "de": "1/4 = 3/12, und 1/6 = 2/12.", "fr": "1/4 = 3/12, et 1/6 = 2/12.", "es": "1/4 = 3/12, y 1/6 = 2/12.", "it": "1/4 = 3/12, e 1/6 = 2/12.", "ru": "1/4 = 3/12, а 1/6 = 2/12.", "pt": "1/4 = 3/12, e 1/6 = 2/12."}, {"sr": "3/12 + 2/12 = 5/12.", "en": "3/12 + 2/12 = 5/12.", "de": "3/12 + 2/12 = 5/12.", "fr": "3/12 + 2/12 = 5/12.", "es": "3/12 + 2/12 = 5/12.", "it": "3/12 + 2/12 = 5/12.", "ru": "3/12 + 2/12 = 5/12.", "pt": "3/12 + 2/12 = 5/12."}]}}, {"name": {"sr": "Decimalni brojevi", "en": "Decimal Numbers", "de": "Dezimalzahlen", "fr": "Nombres décimaux", "es": "Números decimales", "it": "Numeri decimali", "ru": "Десятичные дроби", "pt": "Números decimais"}, "theory": {"sr": "<b>Decimalni broj</b> je broj zapisan pomoću decimalne zapete, kao 3,25. Cifre levo od zapete predstavljaju cele jedinice, a cifre desno predstavljaju desetine, stotine i tako dalje. Decimalni brojevi se sabiraju i oduzimaju tako što se zapeta postavlja ispod zapete.", "en": "A <b>decimal number</b> is a number written using a decimal point, such as 3.25. The digits to the left of the point represent whole units, while the digits to the right represent tenths, hundredths and so on. Decimal numbers are added and subtracted by lining up the decimal points.", "de": "Eine <b>Dezimalzahl</b> ist eine Zahl, die mit einem Dezimalkomma geschrieben wird, wie 3,25. Die Ziffern links vom Komma stellen ganze Einheiten dar, die Ziffern rechts davon Zehntel, Hundertstel und so weiter. Dezimalzahlen werden addiert und subtrahiert, indem man das Komma untereinander schreibt.", "fr": "Un <b>nombre décimal</b> est un nombre écrit avec une virgule décimale, comme 3,25. Les chiffres à gauche de la virgule représentent des unités entières, ceux à droite représentent les dixièmes, les centièmes, etc. Les nombres décimaux s'additionnent et se soustraient en alignant les virgules les unes sous les autres.", "es": "Un <b>número decimal</b> es un número escrito con una coma decimal, como 3,25. Las cifras a la izquierda de la coma representan unidades enteras, y las cifras a la derecha representan décimas, centésimas, etc. Los números decimales se suman y se restan colocando la coma debajo de la coma.", "it": "Un <b>numero decimale</b> è un numero scritto con una virgola decimale, come 3,25. Le cifre a sinistra della virgola rappresentano le unità intere, mentre le cifre a destra rappresentano i decimi, i centesimi e così via. I numeri decimali si sommano e si sottraggono allineando le virgole una sotto l'altra.", "ru": "<b>Десятичная дробь</b> — это число, записанное с помощью десятичной запятой, например 3,25. Цифры слева от запятой обозначают целые единицы, а цифры справа — десятые, сотые и так далее. Десятичные дроби складывают и вычитают, располагая запятую под запятой.", "pt": "Um <b>número decimal</b> é um número escrito com vírgula decimal, como 3,25. Os algarismos à esquerda da vírgula representam unidades inteiras, e os algarismos à direita representam décimas, centésimas, e assim por diante. Os números decimais somam-se e subtraem-se alinhando a vírgula por baixo da vírgula."}, "formulas": [{"sr": "0,1 = 1/10 ;  0,01 = 1/100", "en": "0.1 = 1/10 ;  0.01 = 1/100", "de": "0,1 = 1/10 ;  0,01 = 1/100", "fr": "0,1 = 1/10 ;  0,01 = 1/100", "es": "0,1 = 1/10 ;  0,01 = 1/100", "it": "0,1 = 1/10 ;  0,01 = 1/100", "ru": "0,1 = 1/10 ;  0,01 = 1/100", "pt": "0,1 = 1/10 ;  0,01 = 1/100"}, {"sr": "Množenje sa 10, 100...: zapeta se pomera udesno", "en": "Multiplying by 10, 100...: the decimal point moves to the right", "de": "Multiplikation mit 10, 100...: das Komma verschiebt sich nach rechts", "fr": "Multiplication par 10, 100... : la virgule se déplace vers la droite", "es": "Multiplicación por 10, 100...: la coma se desplaza hacia la derecha", "it": "Moltiplicazione per 10, 100...: la virgola si sposta verso destra", "ru": "Умножение на 10, 100...: запятая сдвигается вправо", "pt": "Multiplicação por 10, 100...: a vírgula desloca-se para a direita"}, {"sr": "Deljenje sa 10, 100...: zapeta se pomera ulevo", "en": "Dividing by 10, 100...: the decimal point moves to the left", "de": "Division durch 10, 100...: das Komma verschiebt sich nach links", "fr": "Division par 10, 100... : la virgule se déplace vers la gauche", "es": "División entre 10, 100...: la coma se desplaza hacia la izquierda", "it": "Divisione per 10, 100...: la virgola si sposta verso sinistra", "ru": "Деление на 10, 100...: запятая сдвигается влево", "pt": "Divisão por 10, 100...: a vírgula desloca-se para a esquerda"}], "remember": {"sr": "Zapamti: pri sabiranju decimalnih brojeva, zapete moraju biti poravnate jedna ispod druge.", "en": "Remember: when adding decimal numbers, the decimal points must be lined up one below the other.", "de": "Merke: beim Addieren von Dezimalzahlen müssen die Kommas genau untereinanderstehen.", "fr": "Retiens : lors de l'addition de nombres décimaux, les virgules doivent être alignées les unes sous les autres.", "es": "Recuerda: al sumar números decimales, las comas deben quedar alineadas una debajo de otra.", "it": "Ricorda: quando si sommano numeri decimali, le virgole devono essere allineate una sotto l'altra.", "ru": "Запомни: при сложении десятичных дробей запятые должны стоять точно одна под другой.", "pt": "Lembra-te: ao somar números decimais, as vírgulas devem ficar alinhadas umas por baixo das outras."}, "problem": {"statement": {"sr": "Zadatak: Izračunaj 4,35 + 2,7.", "en": "Problem: Calculate 4.35 + 2.7.", "de": "Aufgabe: Berechne 4,35 + 2,7.", "fr": "Exercice : Calcule 4,35 + 2,7.", "es": "Ejercicio: Calcula 4,35 + 2,7.", "it": "Esercizio: Calcola 4,35 + 2,7.", "ru": "Задача: Вычисли 4,35 + 2,7.", "pt": "Exercício: Calcula 4,35 + 2,7."}, "steps": [{"sr": "Izjednačimo broj decimala: 2,7 = 2,70.", "en": "Let's equalize the number of decimal places: 2.7 = 2.70.", "de": "Wir gleichen die Anzahl der Nachkommastellen an: 2,7 = 2,70.", "fr": "Égalisons le nombre de décimales : 2,7 = 2,70.", "es": "Igualamos el número de decimales: 2,7 = 2,70.", "it": "Uguagliamo il numero di decimali: 2,7 = 2,70.", "ru": "Уравняем количество десятичных знаков: 2,7 = 2,70.", "pt": "Igualamos o número de casas decimais: 2,7 = 2,70."}, {"sr": "Saberemo kao cele brojeve poravnate po zapeti: 4,35 + 2,70.", "en": "We add them like whole numbers, lined up by the decimal point: 4.35 + 2.70.", "de": "Wir addieren wie ganze Zahlen, ausgerichtet am Komma: 4,35 + 2,70.", "fr": "On additionne comme des nombres entiers, alignés sur la virgule : 4,35 + 2,70.", "es": "Sumamos como números enteros, alineados por la coma: 4,35 + 2,70.", "it": "Sommiamo come numeri interi, allineati per la virgola: 4,35 + 2,70.", "ru": "Складываем как целые числа, выровненные по запятой: 4,35 + 2,70.", "pt": "Somamos como números inteiros, alinhados pela vírgula: 4,35 + 2,70."}, {"sr": "Rezultat je 7,05.", "en": "The result is 7.05.", "de": "Das Ergebnis ist 7,05.", "fr": "Le résultat est 7,05.", "es": "El resultado es 7,05.", "it": "Il risultato è 7,05.", "ru": "Результат равен 7,05.", "pt": "O resultado é 7,05."}]}}, {"name": {"sr": "Uglovi", "en": "Angles", "de": "Winkel", "fr": "Angles", "es": "Ángulos", "it": "Angoli", "ru": "Углы", "pt": "Ângulos"}, "theory": {"sr": "<b>Ugao</b> nastaje spajanjem dve poluprave iz iste tačke koja se zove teme. Uglovi se mere u stepenima (°) pomoću uglomera. Prema veličini razlikujemo <b>oštar</b> (manji od 90°), <b>prav</b> (tačno 90°), <b>tup</b> (između 90° i 180°) i <b>opružen</b> ugao (tačno 180°).", "en": "An <b>angle</b> is formed when two rays meet at the same point, called the vertex. Angles are measured in degrees (°) using a protractor. By size we distinguish an <b>acute</b> angle (less than 90°), a <b>right</b> angle (exactly 90°), an <b>obtuse</b> angle (between 90° and 180°) and a <b>straight</b> angle (exactly 180°).", "de": "Ein <b>Winkel</b> entsteht, wenn sich zwei Halbgeraden im selben Punkt treffen, der Scheitelpunkt genannt wird. Winkel werden in Grad (°) mit einem Winkelmesser gemessen. Nach Größe unterscheiden wir einen <b>spitzen</b> Winkel (kleiner als 90°), einen <b>rechten</b> Winkel (genau 90°), einen <b>stumpfen</b> Winkel (zwischen 90° und 180°) und einen <b>gestreckten</b> Winkel (genau 180°).", "fr": "Un <b>angle</b> se forme lorsque deux demi-droites se rejoignent en un même point, appelé sommet. Les angles se mesurent en degrés (°) à l'aide d'un rapporteur. Selon leur taille, on distingue l'angle <b>aigu</b> (inférieur à 90°), l'angle <b>droit</b> (exactement 90°), l'angle <b>obtus</b> (entre 90° et 180°) et l'angle <b>plat</b> (exactement 180°).", "es": "Un <b>ángulo</b> se forma al unir dos semirrectas que parten de un mismo punto, llamado vértice. Los ángulos se miden en grados (°) con un transportador. Según su tamaño distinguimos el ángulo <b>agudo</b> (menor de 90°), el ángulo <b>recto</b> (exactamente 90°), el ángulo <b>obtuso</b> (entre 90° y 180°) y el ángulo <b>llano</b> (exactamente 180°).", "it": "Un <b>angolo</b> si forma unendo due semirette che partono dallo stesso punto, chiamato vertice. Gli angoli si misurano in gradi (°) con il goniometro. In base all'ampiezza distinguiamo l'angolo <b>acuto</b> (minore di 90°), l'angolo <b>retto</b> (esattamente 90°), l'angolo <b>ottuso</b> (tra 90° e 180°) e l'angolo <b>piatto</b> (esattamente 180°).", "ru": "<b>Угол</b> образуется при соединении двух лучей из одной точки, которая называется вершиной. Углы измеряются в градусах (°) с помощью транспортира. По величине различают <b>острый</b> угол (меньше 90°), <b>прямой</b> угол (ровно 90°), <b>тупой</b> угол (между 90° и 180°) и <b>развёрнутый</b> угол (ровно 180°).", "pt": "Um <b>ângulo</b> forma-se ao unir duas semirretas que partem do mesmo ponto, chamado vértice. Os ângulos medem-se em graus (°) com um transferidor. Quanto ao tamanho, distinguimos o ângulo <b>agudo</b> (menor que 90°), o ângulo <b>reto</b> (exatamente 90°), o ângulo <b>obtuso</b> (entre 90° e 180°) e o ângulo <b>raso</b> (exatamente 180°)."}, "formulas": [{"sr": "Pun ugao = 360°", "en": "Full angle = 360°", "de": "Vollwinkel = 360°", "fr": "Angle plein = 360°", "es": "Ángulo completo = 360°", "it": "Angolo giro = 360°", "ru": "Полный угол = 360°", "pt": "Ângulo giro = 360°"}, {"sr": "Opružen ugao = 180°", "en": "Straight angle = 180°", "de": "Gestreckter Winkel = 180°", "fr": "Angle plat = 180°", "es": "Ángulo llano = 180°", "it": "Angolo piatto = 180°", "ru": "Развёрнутый угол = 180°", "pt": "Ângulo raso = 180°"}, {"sr": "Prav ugao = 90°", "en": "Right angle = 90°", "de": "Rechter Winkel = 90°", "fr": "Angle droit = 90°", "es": "Ángulo recto = 90°", "it": "Angolo retto = 90°", "ru": "Прямой угол = 90°", "pt": "Ângulo reto = 90°"}], "remember": {"sr": "Zapamti: zbir uglova u trouglu uvek iznosi 180°.", "en": "Remember: the sum of the angles in a triangle is always 180°.", "de": "Merke: die Winkelsumme in einem Dreieck beträgt immer 180°.", "fr": "Retiens : la somme des angles d'un triangle vaut toujours 180°.", "es": "Recuerda: la suma de los ángulos de un triángulo siempre es 180°.", "it": "Ricorda: la somma degli angoli di un triangolo è sempre 180°.", "ru": "Запомни: сумма углов треугольника всегда равна 180°.", "pt": "Lembra-te: a soma dos ângulos de um triângulo é sempre 180°."}, "problem": {"statement": {"sr": "Zadatak: Ugao α iznosi 35°. Koliki je njegov komplementni ugao (do 90°)?", "en": "Problem: Angle α measures 35°. What is its complementary angle (to 90°)?", "de": "Aufgabe: Der Winkel α beträgt 35°. Wie groß ist sein Komplementärwinkel (bis 90°)?", "fr": "Exercice : L'angle α mesure 35°. Quel est son angle complémentaire (jusqu'à 90°) ?", "es": "Ejercicio: El ángulo α mide 35°. ¿Cuál es su ángulo complementario (hasta 90°)?", "it": "Esercizio: L'angolo α misura 35°. Qual è il suo angolo complementare (fino a 90°)?", "ru": "Задача: Угол α составляет 35°. Чему равен его дополнительный угол (до 90°)?", "pt": "Exercício: O ângulo α mede 35°. Qual é o seu ângulo complementar (até 90°)?"}, "steps": [{"sr": "Komplementni ugao dopunjuje dati ugao do 90°.", "en": "A complementary angle adds up with the given angle to 90°.", "de": "Ein Komplementärwinkel ergänzt den gegebenen Winkel auf 90°.", "fr": "Un angle complémentaire s'ajoute à l'angle donné pour former 90°.", "es": "Un ángulo complementario completa el ángulo dado hasta 90°.", "it": "Un angolo complementare completa l'angolo dato fino a 90°.", "ru": "Дополнительный угол в сумме с данным углом составляет 90°.", "pt": "Um ângulo complementar completa o ângulo dado até 90°."}, {"sr": "Računamo: 90° − 35° = 55°.", "en": "We calculate: 90° − 35° = 55°.", "de": "Wir berechnen: 90° − 35° = 55°.", "fr": "On calcule : 90° − 35° = 55°.", "es": "Calculamos: 90° − 35° = 55°.", "it": "Calcoliamo: 90° − 35° = 55°.", "ru": "Вычисляем: 90° − 35° = 55°.", "pt": "Calculamos: 90° − 35° = 55°."}, {"sr": "Komplementni ugao iznosi 55°.", "en": "The complementary angle is 55°.", "de": "Der Komplementärwinkel beträgt 55°.", "fr": "L'angle complémentaire est de 55°.", "es": "El ángulo complementario mide 55°.", "it": "L'angolo complementare misura 55°.", "ru": "Дополнительный угол равен 55°.", "pt": "O ângulo complementar mede 55°."}]}}, {"name": {"sr": "Površine i obim", "en": "Areas and Perimeter", "de": "Flächen und Umfang", "fr": "Aires et périmètre", "es": "Áreas y perímetro", "it": "Aree e perimetro", "ru": "Площади и периметр", "pt": "Áreas e perímetro"}, "theory": {"sr": "<b>Obim</b> je zbir dužina svih stranica figure, a <b>površina</b> je veličina prostora koji figura zauzima. Za pravougaonik i kvadrat postoje jednostavne formule koje koriste dužine stranica.", "en": "The <b>perimeter</b> is the sum of the lengths of all sides of a figure, while the <b>area</b> is the amount of space the figure covers. For a rectangle and a square there are simple formulas that use the lengths of the sides.", "de": "Der <b>Umfang</b> ist die Summe der Längen aller Seiten einer Figur, während die <b>Fläche</b> die Größe des Raums angibt, den die Figur einnimmt. Für Rechteck und Quadrat gibt es einfache Formeln, die die Seitenlängen verwenden.", "fr": "Le <b>périmètre</b> est la somme des longueurs de tous les côtés d'une figure, tandis que l'<b>aire</b> est la mesure de l'espace occupé par la figure. Pour le rectangle et le carré, il existe des formules simples utilisant les longueurs des côtés.", "es": "El <b>perímetro</b> es la suma de las longitudes de todos los lados de una figura, mientras que el <b>área</b> es el tamaño del espacio que ocupa la figura. Para el rectángulo y el cuadrado existen fórmulas sencillas que usan las longitudes de los lados.", "it": "Il <b>perimetro</b> è la somma delle lunghezze di tutti i lati di una figura, mentre l'<b>area</b> è la misura dello spazio occupato dalla figura. Per il rettangolo e il quadrato esistono formule semplici che usano le lunghezze dei lati.", "ru": "<b>Периметр</b> — это сумма длин всех сторон фигуры, а <b>площадь</b> — это величина пространства, которое занимает фигура. Для прямоугольника и квадрата существуют простые формулы, использующие длины сторон.", "pt": "O <b>perímetro</b> é a soma dos comprimentos de todos os lados de uma figura, enquanto a <b>área</b> é o tamanho do espaço que a figura ocupa. Para o retângulo e o quadrado existem fórmulas simples que usam os comprimentos dos lados."}, "formulas": [{"sr": "Pravougaonik: O = 2(a+b), P = a · b", "en": "Rectangle: P = 2(a+b), A = a · b", "de": "Rechteck: U = 2(a+b), A = a · b", "fr": "Rectangle : P = 2(a+b), A = a · b", "es": "Rectángulo: P = 2(a+b), A = a · b", "it": "Rettangolo: P = 2(a+b), A = a · b", "ru": "Прямоугольник: P = 2(a+b), S = a · b", "pt": "Retângulo: P = 2(a+b), A = a · b"}, {"sr": "Kvadrat: O = 4a, P = a²", "en": "Square: P = 4a, A = a²", "de": "Quadrat: U = 4a, A = a²", "fr": "Carré : P = 4a, A = a²", "es": "Cuadrado: P = 4a, A = a²", "it": "Quadrato: P = 4a, A = a²", "ru": "Квадрат: P = 4a, S = a²", "pt": "Quadrado: P = 4a, A = a²"}, {"sr": "Trougao: P = (a · h) / 2", "en": "Triangle: A = (a · h) / 2", "de": "Dreieck: A = (a · h) / 2", "fr": "Triangle : A = (a · h) / 2", "es": "Triángulo: A = (a · h) / 2", "it": "Triangolo: A = (a · h) / 2", "ru": "Треугольник: S = (a · h) / 2", "pt": "Triângulo: A = (a · h) / 2"}], "remember": {"sr": "Zapamti: obim se meri u jedinicama dužine (cm, m), a površina u kvadratnim jedinicama (cm², m²).", "en": "Remember: perimeter is measured in units of length (cm, m), while area is measured in square units (cm², m²).", "de": "Merke: der Umfang wird in Längeneinheiten (cm, m) gemessen, die Fläche in Flächeneinheiten (cm², m²).", "fr": "Retiens : le périmètre se mesure en unités de longueur (cm, m), l'aire se mesure en unités carrées (cm², m²).", "es": "Recuerda: el perímetro se mide en unidades de longitud (cm, m), y el área en unidades cuadradas (cm², m²).", "it": "Ricorda: il perimetro si misura in unità di lunghezza (cm, m), l'area in unità quadrate (cm², m²).", "ru": "Запомни: периметр измеряется в единицах длины (см, м), а площадь — в квадратных единицах (см², м²).", "pt": "Lembra-te: o perímetro mede-se em unidades de comprimento (cm, m), e a área em unidades quadradas (cm², m²)."}, "problem": {"statement": {"sr": "Zadatak: Pravougaonik ima stranice a = 8 cm i b = 5 cm. Izračunaj obim i površinu.", "en": "Problem: A rectangle has sides a = 8 cm and b = 5 cm. Calculate the perimeter and the area.", "de": "Aufgabe: Ein Rechteck hat die Seiten a = 8 cm und b = 5 cm. Berechne den Umfang und die Fläche.", "fr": "Exercice : Un rectangle a pour côtés a = 8 cm et b = 5 cm. Calcule le périmètre et l'aire.", "es": "Ejercicio: Un rectángulo tiene lados a = 8 cm y b = 5 cm. Calcula el perímetro y el área.", "it": "Esercizio: Un rettangolo ha i lati a = 8 cm e b = 5 cm. Calcola il perimetro e l'area.", "ru": "Задача: Прямоугольник имеет стороны a = 8 см и b = 5 см. Вычисли периметр и площадь.", "pt": "Exercício: Um retângulo tem lados a = 8 cm e b = 5 cm. Calcula o perímetro e a área."}, "steps": [{"sr": "Obim: O = 2(a+b) = 2(8+5) = 2 · 13 = 26 cm.", "en": "Perimeter: P = 2(a+b) = 2(8+5) = 2 · 13 = 26 cm.", "de": "Umfang: U = 2(a+b) = 2(8+5) = 2 · 13 = 26 cm.", "fr": "Périmètre : P = 2(a+b) = 2(8+5) = 2 · 13 = 26 cm.", "es": "Perímetro: P = 2(a+b) = 2(8+5) = 2 · 13 = 26 cm.", "it": "Perimetro: P = 2(a+b) = 2(8+5) = 2 · 13 = 26 cm.", "ru": "Периметр: P = 2(a+b) = 2(8+5) = 2 · 13 = 26 см.", "pt": "Perímetro: P = 2(a+b) = 2(8+5) = 2 · 13 = 26 cm."}, {"sr": "Površina: P = a · b = 8 · 5 = 40 cm².", "en": "Area: A = a · b = 8 · 5 = 40 cm².", "de": "Fläche: A = a · b = 8 · 5 = 40 cm².", "fr": "Aire : A = a · b = 8 · 5 = 40 cm².", "es": "Área: A = a · b = 8 · 5 = 40 cm².", "it": "Area: A = a · b = 8 · 5 = 40 cm².", "ru": "Площадь: S = a · b = 8 · 5 = 40 см².", "pt": "Área: A = a · b = 8 · 5 = 40 cm²."}, {"sr": "Dakle O = 26 cm, P = 40 cm².", "en": "So P = 26 cm, A = 40 cm².", "de": "Also U = 26 cm, A = 40 cm².", "fr": "Donc P = 26 cm, A = 40 cm².", "es": "Por tanto, P = 26 cm, A = 40 cm².", "it": "Quindi P = 26 cm, A = 40 cm².", "ru": "Итак, P = 26 см, S = 40 см².", "pt": "Logo, P = 26 cm, A = 40 cm²."}]}}], "C": {"next": {"sr": "Dalje →", "en": "Next →", "de": "Weiter →", "fr": "Suivant →", "es": "Siguiente →", "it": "Avanti →", "ru": "Дальше →", "pt": "Seguinte →"}, "prev": {"sr": "← Nazad", "en": "← Back", "de": "← Zurück", "fr": "← Retour", "es": "← Atrás", "it": "← Indietro", "ru": "← Назад", "pt": "← Voltar"}, "finish": {"sr": "Završi 🎉", "en": "Finish 🎉", "de": "Fertig 🎉", "fr": "Terminer 🎉", "es": "Terminar 🎉", "it": "Finisci 🎉", "ru": "Готово 🎉", "pt": "Terminar 🎉"}, "done": {"sr": "Bravo, prešao si skriptu! 🎉", "en": "Yay, you finished the notes! 🎉", "de": "Super, Skript geschafft! 🎉", "fr": "Bravo, cours terminé ! 🎉", "es": "¡Bien, terminaste los apuntes! 🎉", "it": "Bravo, dispensa completata! 🎉", "ru": "Ура, конспект пройден! 🎉", "pt": "Boa, terminaste os apontamentos! 🎉"}, "doneSub": {"sr": "Sad si spreman za kviz 💪", "en": "Now you're ready for the quiz 💪", "de": "Jetzt bist du bereit fürs Quiz 💪", "fr": "Tu es prêt pour le quiz 💪", "es": "Ya estás listo para el test 💪", "it": "Ora sei pronto per il quiz 💪", "ru": "Теперь ты готов к тесту 💪", "pt": "Agora estás pronto para o quiz 💪"}, "toQuiz": {"sr": "Uradi kviz 🎯", "en": "Take the quiz 🎯", "de": "Zum Quiz 🎯", "fr": "Faire le quiz 🎯", "es": "Hacer el test 🎯", "it": "Fai il quiz 🎯", "ru": "Пройти тест 🎯", "pt": "Fazer o quiz 🎯"}, "toClone": {"sr": "Uči uz Profesoricu 💛", "en": "Learn with Profesorica 💛", "de": "Mit Profesorica lernen 💛", "fr": "Apprendre avec Profesorica 💛", "es": "Aprende con Profesorica 💛

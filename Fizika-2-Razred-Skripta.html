<style>
:root{--cream:#FBF6EE;--ink:#5A1024;--ink2:#7A3346;--gold:#C6A05C;--goldlt:#F0DCA8;--malina:#B01E48;--malina2:#CC5E7E;--mint:#3FB98C;--muted:#8A7A80}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#43303A;min-height:100vh;
 background:radial-gradient(520px 400px at 104% -6%,#F6E1EC 0,transparent 56%),radial-gradient(500px 380px at -6% 106%,#F7ECD6 0,transparent 58%),var(--cream);overflow-x:hidden}
#fall{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fall span{position:absolute;top:-8%;font-family:'Spectral',serif;font-style:italic;color:rgba(198,160,92,.22);animation:fl linear infinite}
#fall span.m{color:rgba(176,30,72,.16)}
@keyframes fl{0%{transform:translateY(-10vh) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(112vh) rotate(24deg);opacity:0}}
.wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:14px 16px 30px}
.top{display:flex;align-items:center;gap:10px;padding:4px 2px 10px}
.top .back{color:var(--ink2);text-decoration:none;font-weight:800;font-size:1.1rem}
.top .lang{margin-left:auto;border:1px solid var(--goldlt);border-radius:100px;padding:5px 10px;font-family:inherit;font-weight:800;font-size:.72rem;color:var(--ink);background:#fff}
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:#E6D5CE;transition:.3s}
.dots i.on{background:linear-gradient(90deg,var(--gold),var(--malina));transform:scale(1.25)}
.dots i.done{background:var(--goldlt)}
.stage{position:relative;min-height:62vh}
.card{position:relative;background:linear-gradient(180deg,#FFFDF9,#FDF3EA);border:1px solid var(--goldlt);border-radius:32px;
 padding:26px 22px 22px;box-shadow:0 30px 70px -34px rgba(90,16,36,.5);animation:slidein .45s cubic-bezier(.2,.9,.2,1)}
@keyframes slidein{0%{transform:translateX(28px) scale(.97);opacity:0}100%{transform:translateX(0) scale(1);opacity:1}}
.eyebrow{text-align:center;font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:.64rem;color:var(--malina)}
.mascot{width:82px;height:82px;margin:8px auto 4px;border-radius:50%;display:grid;place-items:center;font-size:2.6rem;background:radial-gradient(circle at 40% 34%,#FFF3F7,#F6E1EC);border:2px solid var(--goldlt);box-shadow:0 14px 28px -12px rgba(176,30,72,.4);animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.tnum{text-align:center;color:var(--muted);font-weight:800;font-size:.78rem;margin-top:6px}
.ttl{font-family:'Spectral',serif;font-weight:700;color:var(--ink);font-size:1.75rem;text-align:center;line-height:1.2;margin:2px 0 8px}
.theory{color:#5a4750;font-size:1.02rem;text-align:center;line-height:1.55;margin:0 auto 14px;max-width:460px}
.theory b{color:var(--ink)}
.fx{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 4px}
.fx span{display:inline-block;background:#fff;border:1px dashed var(--goldlt);border-radius:14px;padding:9px 14px;font-family:'Spectral','Cambria Math',Georgia,serif;color:var(--ink);font-size:1.05rem;animation:pop .4s both}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.zap{margin:16px auto 2px;max-width:460px;background:linear-gradient(180deg,#FFF7FA,#FBEEF2);border:1px solid #F0D6DF;border-radius:18px;padding:13px 16px;display:flex;gap:10px;align-items:flex-start}
.zap .st{font-size:1.4rem;line-height:1}
.zap p{margin:0;color:var(--ink2);font-size:.95rem;font-weight:600}
.nav{display:flex;align-items:center;gap:12px;margin-top:16px}
.nav .prev{background:none;border:none;color:var(--ink2);font-weight:800;cursor:pointer;font-size:1rem;padding:8px}
.nav .next{flex:1;border:none;cursor:pointer;background:linear-gradient(135deg,var(--malina2),var(--malina));color:#fff;font-weight:900;font-size:1.05rem;padding:14px;border-radius:100px;box-shadow:0 16px 30px -14px rgba(176,30,72,.6);transition:transform .15s}
.nav .next:hover{transform:translateY(-2px)}
.fin{text-align:center}
.fin .big{font-size:3.4rem}
.fin h2{font-family:'Spectral',serif;color:var(--ink);font-size:1.9rem;margin:4px 0}
.fin p{color:var(--ink2)}
.fin .cta{display:block;margin-top:12px;text-decoration:none;text-align:center;background:linear-gradient(135deg,var(--malina2),var(--malina));color:#fff;font-weight:900;padding:14px;border-radius:100px;box-shadow:0 16px 30px -14px rgba(176,30,72,.6)}
.fin .cta2{display:block;margin-top:10px;text-decoration:none;color:var(--ink2);font-weight:800}
#conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#conf i{position:absolute;top:-6%;width:10px;height:14px;border-radius:2px;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(560deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
var D={"eyebrow": {"sr": "Fizika · 2. razred", "en": "Physics · Year 2", "de": "Physik · 2. Jahr", "fr": "Physique · 2e année", "es": "Física · 2.º año", "it": "Fisica · 2° anno", "ru": "Физика · 2 год", "pt": "Física · 2.º ano"}, "topics": [{"name": {"sr": "Molekulsko-kinetička teorija", "en": "Molecular-Kinetic Theory", "de": "Molekularkinetische Theorie", "fr": "Théorie cinétique moléculaire", "es": "Teoría cinético-molecular", "it": "Teoria cinetica molecolare", "ru": "Молекулярно-кинетическая теория", "pt": "Teoria cinético-molecular"}, "theory": {"sr": "<b>Osnovna ideja.</b> Sva tela se sastoje od sitnih čestica (atoma i molekula) koje se neprekidno i haotično kreću i međusobno deluju silama privlačenja i odbijanja. Temperatura tela je mera srednje kinetičke energije haotičnog kretanja čestica, dok pritisak gasa nastaje usled sudara čestica sa zidovima suda.", "en": "<b>Basic idea.</b> All bodies are made up of tiny particles (atoms and molecules) that move continuously and chaotically and interact through forces of attraction and repulsion. The temperature of a body is a measure of the average kinetic energy of the chaotic motion of particles, while gas pressure results from particles colliding with the walls of the container.", "de": "<b>Grundidee.</b> Alle Körper bestehen aus winzigen Teilchen (Atomen und Molekülen), die sich ständig und chaotisch bewegen und durch Anziehungs- und Abstoßungskräfte miteinander wechselwirken. Die Temperatur eines Körpers ist ein Maß für die mittlere kinetische Energie der chaotischen Teilchenbewegung, während der Gasdruck durch die Stöße der Teilchen gegen die Gefäßwände entsteht.", "fr": "<b>Idée de base.</b> Tous les corps sont constitués de particules minuscules (atomes et molécules) qui se déplacent continuellement de façon chaotique et interagissent par des forces d'attraction et de répulsion. La température d'un corps est une mesure de l'énergie cinétique moyenne du mouvement chaotique des particules, tandis que la pression d'un gaz résulte des chocs des particules contre les parois du récipient.", "es": "<b>Idea básica.</b> Todos los cuerpos están formados por partículas diminutas (átomos y moléculas) que se mueven de forma continua y caótica e interactúan mediante fuerzas de atracción y repulsión. La temperatura de un cuerpo es una medida de la energía cinética media del movimiento caótico de las partículas, mientras que la presión del gas surge de los choques de las partículas contra las paredes del recipiente.", "it": "<b>Idea di base.</b> Tutti i corpi sono costituiti da minuscole particelle (atomi e molecole) che si muovono continuamente in modo caotico e interagiscono tramite forze di attrazione e repulsione. La temperatura di un corpo è una misura dell'energia cinetica media del moto caotico delle particelle, mentre la pressione del gas deriva dagli urti delle particelle contro le pareti del recipiente.", "ru": "<b>Основная идея.</b> Все тела состоят из мельчайших частиц (атомов и молекул), которые непрерывно и хаотично движутся и взаимодействуют силами притяжения и отталкивания. Температура тела является мерой средней кинетической энергии хаотичного движения частиц, а давление газа возникает вследствие ударов частиц о стенки сосуда.", "pt": "<b>Ideia básica.</b> Todos os corpos são formados por partículas minúsculas (átomos e moléculas) que se movem de forma contínua e caótica e interagem por meio de forças de atração e repulsão. A temperatura de um corpo é uma medida da energia cinética média do movimento caótico das partículas, enquanto a pressão do gás resulta das colisões das partículas com as paredes do recipiente."}, "formulas": [{"sr": "Srednja kinetička energija molekula: Ek = (3/2)·k·T", "en": "Average kinetic energy of a molecule: Ek = (3/2)·k·T", "de": "Mittlere kinetische Energie eines Moleküls: Ek = (3/2)·k·T", "fr": "Énergie cinétique moyenne d'une molécule : Ek = (3/2)·k·T", "es": "Energía cinética media de una molécula: Ek = (3/2)·k·T", "it": "Energia cinetica media di una molecola: Ek = (3/2)·k·T", "ru": "Средняя кинетическая энергия молекулы: Ek = (3/2)·k·T", "pt": "Energia cinética média de uma molécula: Ek = (3/2)·k·T"}, {"sr": "Broj molova: n = m/M", "en": "Number of moles: n = m/M", "de": "Stoffmenge: n = m/M", "fr": "Quantité de matière : n = m/M", "es": "Número de moles: n = m/M", "it": "Numero di moli: n = m/M", "ru": "Количество вещества: n = m/M", "pt": "Número de mols: n = m/M"}], "remember": {"sr": "k je Bolcmanova konstanta (k=1,38·10⁻²³ J/K), a T se uvek izražava u kelvinima (K), ne u °C.", "en": "k is the Boltzmann constant (k=1.38·10⁻²³ J/K), and T is always expressed in kelvins (K), not in °C.", "de": "k ist die Boltzmann-Konstante (k=1,38·10⁻²³ J/K), und T wird immer in Kelvin (K) angegeben, nicht in °C.", "fr": "k est la constante de Boltzmann (k=1,38·10⁻²³ J/K), et T s'exprime toujours en kelvins (K), pas en °C.", "es": "k es la constante de Boltzmann (k=1,38·10⁻²³ J/K), y T siempre se expresa en kelvin (K), no en °C.", "it": "k è la costante di Boltzmann (k=1,38·10⁻²³ J/K), e T si esprime sempre in kelvin (K), non in °C.", "ru": "k — постоянная Больцмана (k=1,38·10⁻²³ Дж/К), а T всегда выражается в кельвинах (K), а не в °C.", "pt": "k é a constante de Boltzmann (k=1,38·10⁻²³ J/K), e T é sempre expressa em kelvins (K), não em °C."}, "problem": {"statement": {"sr": "Izračunaj srednju kinetičku energiju molekula idealnog gasa na temperaturi T=300 K. (k=1,38·10⁻²³ J/K)", "en": "Calculate the average kinetic energy of ideal gas molecules at a temperature of T=300 K. (k=1.38·10⁻²³ J/K)", "de": "Berechne die mittlere kinetische Energie der Moleküle eines idealen Gases bei einer Temperatur von T=300 K. (k=1,38·10⁻²³ J/K)", "fr": "Calcule l'énergie cinétique moyenne des molécules d'un gaz parfait à la température T=300 K. (k=1,38·10⁻²³ J/K)", "es": "Calcula la energía cinética media de las moléculas de un gas ideal a la temperatura T=300 K. (k=1,38·10⁻²³ J/K)", "it": "Calcola l'energia cinetica media delle molecole di un gas ideale alla temperatura T=300 K. (k=1,38·10⁻²³ J/K)", "ru": "Вычисли среднюю кинетическую энергию молекул идеального газа при температуре T=300 К. (k=1,38·10⁻²³ Дж/К)", "pt": "Calcule a energia cinética média das moléculas de um gás ideal à temperatura T=300 K. (k=1,38·10⁻²³ J/K)"}, "steps": [{"sr": "Zapiši formulu: Ek = (3/2)·k·T", "en": "Write the formula: Ek = (3/2)·k·T", "de": "Formel notieren: Ek = (3/2)·k·T", "fr": "Écris la formule : Ek = (3/2)·k·T", "es": "Escribe la fórmula: Ek = (3/2)·k·T", "it": "Scrivi la formula: Ek = (3/2)·k·T", "ru": "Запиши формулу: Ek = (3/2)·k·T", "pt": "Escreva a fórmula: Ek = (3/2)·k·T"}, {"sr": "Uvrsti vrednosti: Ek = 1,5 · 1,38·10⁻²³ · 300", "en": "Substitute the values: Ek = 1.5 · 1.38·10⁻²³ · 300", "de": "Werte einsetzen: Ek = 1,5 · 1,38·10⁻²³ · 300", "fr": "Remplace les valeurs : Ek = 1,5 · 1,38·10⁻²³ · 300", "es": "Sustituye los valores: Ek = 1,5 · 1,38·10⁻²³ · 300", "it": "Sostituisci i valori: Ek = 1,5 · 1,38·10⁻²³ · 300", "ru": "Подставь значения: Ek = 1,5 · 1,38·10⁻²³ · 300", "pt": "Substitua os valores: Ek = 1,5 · 1,38·10⁻²³ · 300"}, {"sr": "Izračunaj rezultat: Ek ≈ 6,21·10⁻²¹ J", "en": "Calculate the result: Ek ≈ 6.21·10⁻²¹ J", "de": "Ergebnis berechnen: Ek ≈ 6,21·10⁻²¹ J", "fr": "Calcule le résultat : Ek ≈ 6,21·10⁻²¹ J", "es": "Calcula el resultado: Ek ≈ 6,21·10⁻²¹ J", "it": "Calcola il risultato: Ek ≈ 6,21·10⁻²¹ J", "ru": "Вычисли результат: Ek ≈ 6,21·10⁻²¹ Дж", "pt": "Calcule o resultado: Ek ≈ 6,21·10⁻²¹ J"}]}}, {"name": {"sr": "Idealni gas", "en": "Ideal Gas", "de": "Ideales Gas", "fr": "Gaz parfait", "es": "Gas ideal", "it": "Gas ideale", "ru": "Идеальный газ", "pt": "Gás ideal"}, "theory": {"sr": "<b>Jednačina stanja gasa.</b> Idealni gas je model gasa kod kog se zanemaruju sopstvena zapremina čestica i sile među njima, osim pri sudarima. Stanje idealnog gasa opisuje jednačina pV=nRT, koja povezuje pritisak, zapreminu, količinu gasa i temperaturu. Kada je masa gasa stalna, iz ove jednačine se izvode gasni zakoni pri stalnoj zapremini, pritisku ili temperaturi.", "en": "<b>Equation of state.</b> An ideal gas is a model of a gas in which the particles' own volume and the forces between them are neglected, except during collisions. The state of an ideal gas is described by the equation pV=nRT, which relates pressure, volume, amount of gas and temperature. When the mass of gas is constant, this equation gives the gas laws for constant volume, pressure or temperature.", "de": "<b>Zustandsgleichung.</b> Ein ideales Gas ist ein Gasmodell, bei dem das Eigenvolumen der Teilchen und die Kräfte zwischen ihnen außer bei Stößen vernachlässigt werden. Der Zustand eines idealen Gases wird durch die Gleichung pV=nRT beschrieben, die Druck, Volumen, Gasmenge und Temperatur verknüpft. Bei konstanter Gasmasse ergeben sich daraus die Gasgesetze bei konstantem Volumen, Druck oder konstanter Temperatur.", "fr": "<b>Équation d'état.</b> Un gaz parfait est un modèle de gaz dans lequel on néglige le volume propre des particules et les forces entre elles, sauf lors des chocs. L'état d'un gaz parfait est décrit par l'équation pV=nRT, qui relie la pression, le volume, la quantité de gaz et la température. Lorsque la masse de gaz est constante, cette équation donne les lois des gaz à volume, pression ou température constants.", "es": "<b>Ecuación de estado.</b> Un gas ideal es un modelo de gas en el que se desprecian el volumen propio de las partículas y las fuerzas entre ellas, salvo durante los choques. El estado de un gas ideal se describe con la ecuación pV=nRT, que relaciona la presión, el volumen, la cantidad de gas y la temperatura. Cuando la masa del gas es constante, de esta ecuación se derivan las leyes de los gases a volumen, presión o temperatura constantes.", "it": "<b>Equazione di stato.</b> Un gas ideale è un modello di gas in cui si trascurano il volume proprio delle particelle e le forze tra esse, tranne durante gli urti. Lo stato di un gas ideale è descritto dall'equazione pV=nRT, che collega pressione, volume, quantità di gas e temperatura. Quando la massa del gas è costante, da questa equazione si ricavano le leggi dei gas a volume, pressione o temperatura costanti.", "ru": "<b>Уравнение состояния.</b> Идеальный газ — это модель газа, в которой собственный объём частиц и силы между ними не учитываются, кроме как при столкновениях. Состояние идеального газа описывается уравнением pV=nRT, связывающим давление, объём, количество газа и температуру. При постоянной массе газа из этого уравнения выводятся газовые законы при постоянном объёме, давлении или температуре.", "pt": "<b>Equação de estado.</b> Um gás ideal é um modelo de gás no qual se desprezam o volume próprio das partículas e as forças entre elas, exceto durante as colisões. O estado de um gás ideal é descrito pela equação pV=nRT, que relaciona pressão, volume, quantidade de gás e temperatura. Quando a massa do gás é constante, dessa equação derivam-se as leis dos gases a volume, pressão ou temperatura constantes."}, "formulas": [{"sr": "Jednačina stanja idealnog gasa: pV = nRT", "en": "Equation of state of an ideal gas: pV = nRT", "de": "Zustandsgleichung des idealen Gases: pV = nRT", "fr": "Équation d'état du gaz parfait : pV = nRT", "es": "Ecuación de estado del gas ideal: pV = nRT", "it": "Equazione di stato del gas ideale: pV = nRT", "ru": "Уравнение состояния идеального газа: pV = nRT", "pt": "Equação de estado do gás ideal: pV = nRT"}, {"sr": "Kombinovani gasni zakon: p·V/T = const", "en": "Combined gas law: p·V/T = const", "de": "Kombiniertes Gasgesetz: p·V/T = const", "fr": "Loi combinée des gaz : p·V/T = const", "es": "Ley combinada de los gases: p·V/T = const", "it": "Legge combinata dei gas: p·V/T = const", "ru": "Объединённый газовый закон: p·V/T = const", "pt": "Lei combinada dos gases: p·V/T = const"}], "remember": {"sr": "R je univerzalna gasna konstanta (R=8,31 J/(mol·K)), a pritisak i zapremina moraju biti u SI jedinicama (Pa i m³).", "en": "R is the universal gas constant (R=8.31 J/(mol·K)), and pressure and volume must be in SI units (Pa and m³).", "de": "R ist die universelle Gaskonstante (R=8,31 J/(mol·K)), und Druck sowie Volumen müssen in SI-Einheiten (Pa und m³) angegeben werden.", "fr": "R est la constante universelle des gaz (R=8,31 J/(mol·K)), et la pression et le volume doivent être exprimés en unités SI (Pa et m³).", "es": "R es la constante universal de los gases (R=8,31 J/(mol·K)), y la presión y el volumen deben estar en unidades SI (Pa y m³).", "it": "R è la costante universale dei gas (R=8,31 J/(mol·K)), e pressione e volume devono essere espressi in unità SI (Pa e m³).", "ru": "R — универсальная газовая постоянная (R=8,31 Дж/(моль·К)), а давление и объём должны быть в единицах СИ (Па и м³).", "pt": "R é a constante universal dos gases (R=8,31 J/(mol·K)), e a pressão e o volume devem estar em unidades SI (Pa e m³)."}, "problem": {"statement": {"sr": "Gas se nalazi u sudu zapremine V=2 L pri pritisku p₁=1·10⁵ Pa i temperaturi T₁=300 K. Gas se zagreje pri stalnoj zapremini do T₂=450 K. Izračunaj novi pritisak p₂.", "en": "A gas is contained in a vessel of volume V=2 L at pressure p₁=1·10⁵ Pa and temperature T₁=300 K. The gas is heated at constant volume to T₂=450 K. Calculate the new pressure p₂.", "de": "Ein Gas befindet sich in einem Gefäß mit dem Volumen V=2 L bei einem Druck von p₁=1·10⁵ Pa und einer Temperatur von T₁=300 K. Das Gas wird bei konstantem Volumen auf T₂=450 K erwärmt. Berechne den neuen Druck p₂.", "fr": "Un gaz se trouve dans un récipient de volume V=2 L à la pression p₁=1·10⁵ Pa et à la température T₁=300 K. Le gaz est chauffé à volume constant jusqu'à T₂=450 K. Calcule la nouvelle pression p₂.", "es": "Un gas se encuentra en un recipiente de volumen V=2 L a una presión p₁=1·10⁵ Pa y temperatura T₁=300 K. El gas se calienta a volumen constante hasta T₂=450 K. Calcula la nueva presión p₂.", "it": "Un gas si trova in un recipiente di volume V=2 L alla pressione p₁=1·10⁵ Pa e temperatura T₁=300 K. Il gas viene riscaldato a volume costante fino a T₂=450 K. Calcola la nuova pressione p₂.", "ru": "Газ находится в сосуде объёмом V=2 л при давлении p₁=1·10⁵ Па и температуре T₁=300 К. Газ нагревают при постоянном объёме до T₂=450 К. Вычисли новое давление p₂.", "pt": "Um gás está contido em um recipiente de volume V=2 L à pressão p₁=1·10⁵ Pa e temperatura T₁=300 K. O gás é aquecido a volume constante até T₂=450 K. Calcule a nova pressão p₂."}, "steps": [{"sr": "Pri stalnoj zapremini važi: p₁/T₁ = p₂/T₂", "en": "At constant volume: p₁/T₁ = p₂/T₂", "de": "Bei konstantem Volumen gilt: p₁/T₁ = p₂/T₂", "fr": "À volume constant : p₁/T₁ = p₂/T₂", "es": "A volumen constante: p₁/T₁ = p₂/T₂", "it": "A volume costante: p₁/T₁ = p₂/T₂", "ru": "При постоянном объёме: p₁/T₁ = p₂/T₂", "pt": "A volume constante: p₁/T₁ = p₂/T₂"}, {"sr": "Izrazi p₂: p₂ = p₁ · T₂/T₁", "en": "Express p₂: p₂ = p₁ · T₂/T₁", "de": "p₂ ausdrücken: p₂ = p₁ · T₂/T₁", "fr": "Exprime p₂ : p₂ = p₁ · T₂/T₁", "es": "Expresa p₂: p₂ = p₁ · T₂/T₁", "it": "Esprimi p₂: p₂ = p₁ · T₂/T₁", "ru": "Вырази p₂: p₂ = p₁ · T₂/T₁", "pt": "Expresse p₂: p₂ = p₁ · T₂/T₁"}, {"sr": "Uvrsti i izračunaj: p₂ = 1·10⁵ · 450/300 = 1,5·10⁵ Pa", "en": "Substitute and calculate: p₂ = 1·10⁵ · 450/300 = 1.5·10⁵ Pa", "de": "Einsetzen und berechnen: p₂ = 1·10⁵ · 450/300 = 1,5·10⁵ Pa", "fr": "Remplace et calcule : p₂ = 1·10⁵ · 450/300 = 1,5·10⁵ Pa", "es": "Sustituye y calcula: p₂ = 1·10⁵ · 450/300 = 1,5·10⁵ Pa", "it": "Sostituisci e calcola: p₂ = 1·10⁵ · 450/300 = 1,5·10⁵ Pa", "ru": "Подставь и вычисли: p₂ = 1·10⁵ · 450/300 = 1,5·10⁵ Па", "pt": "Substitua e calcule: p₂ = 1·10⁵ · 450/300 = 1,5·10⁵ Pa"}]}}, {"name": {"sr": "Termodinamika", "en": "Thermodynamics", "de": "Thermodynamik", "fr": "Thermodynamique", "es": "Termodinámica", "it": "Termodinamica", "ru": "Термодинамика", "pt": "Termodinâmica"}, "theory": {"sr": "<b>Prvi zakon termodinamike.</b> Toplota dovedena gasu troši se na povećanje unutrašnje energije gasa i na rad koji gas izvrši nad okolinom: Q=ΔU+A. Unutrašnja energija idealnog gasa zavisi samo od temperature, dok rad gasa zavisi od promene zapremine. Ako se proces odvija pri stalnoj zapremini (izohorno), gas ne vrši rad, pa se sva toplota troši na promenu unutrašnje energije.", "en": "<b>The first law of thermodynamics.</b> Heat supplied to a gas is spent on increasing the internal energy of the gas and on the work the gas performs on its surroundings: Q=ΔU+A. The internal energy of an ideal gas depends only on temperature, while the work done by the gas depends on the change in volume. If the process occurs at constant volume (isochoric), the gas does no work, so all the heat is spent on changing the internal energy.", "de": "<b>Der erste Hauptsatz der Thermodynamik.</b> Die einem Gas zugeführte Wärme wird zur Erhöhung der inneren Energie des Gases und zur Arbeit verwendet, die das Gas an der Umgebung verrichtet: Q=ΔU+A. Die innere Energie eines idealen Gases hängt nur von der Temperatur ab, während die vom Gas verrichtete Arbeit von der Volumenänderung abhängt. Verläuft der Prozess bei konstantem Volumen (isochor), verrichtet das Gas keine Arbeit, sodass die gesamte Wärme zur Änderung der inneren Energie verwendet wird.", "fr": "<b>Le premier principe de la thermodynamique.</b> La chaleur fournie à un gaz sert à augmenter l'énergie interne du gaz et à effectuer le travail que le gaz exerce sur le milieu extérieur : Q=ΔU+A. L'énergie interne d'un gaz parfait ne dépend que de la température, tandis que le travail du gaz dépend de la variation de volume. Si le processus se déroule à volume constant (isochore), le gaz ne fournit aucun travail, donc toute la chaleur sert à modifier l'énergie interne.", "es": "<b>La primera ley de la termodinámica.</b> El calor suministrado a un gas se emplea en aumentar la energía interna del gas y en el trabajo que el gas realiza sobre el entorno: Q=ΔU+A. La energía interna de un gas ideal depende solo de la temperatura, mientras que el trabajo del gas depende del cambio de volumen. Si el proceso ocurre a volumen constante (isocórico), el gas no realiza trabajo, por lo que todo el calor se emplea en cambiar la energía interna.", "it": "<b>Il primo principio della termodinamica.</b> Il calore fornito a un gas viene impiegato per aumentare l'energia interna del gas e per il lavoro che il gas compie sull'ambiente: Q=ΔU+A. L'energia interna di un gas ideale dipende solo dalla temperatura, mentre il lavoro del gas dipende dalla variazione di volume. Se il processo avviene a volume costante (isocoro), il gas non compie lavoro, quindi tutto il calore viene impiegato per cambiare l'energia interna.", "ru": "<b>Первый закон термодинамики.</b> Теплота, подведённая к газу, расходуется на увеличение внутренней энергии газа и на работу, которую газ совершает над окружающей средой: Q=ΔU+A. Внутренняя энергия идеального газа зависит только от температуры, тогда как работа газа зависит от изменения объёма. Если процесс происходит при постоянном объёме (изохорный), газ не совершает работы, поэтому вся теплота идёт на изменение внутренней энергии.", "pt": "<b>A primeira lei da termodinâmica.</b> O calor fornecido a um gás é usado para aumentar a energia interna do gás e para o trabalho que o gás realiza sobre o ambiente: Q=ΔU+A. A energia interna de um gás ideal depende apenas da temperatura, enquanto o trabalho do gás depende da variação de volume. Se o processo ocorre a volume constante (isocórico), o gás não realiza trabalho, portanto todo o calor é usado para alterar a energia interna."}, "formulas": [{"sr": "Prvi zakon termodinamike: Q = ΔU + A", "en": "First law of thermodynamics: Q = ΔU + A", "de": "Erster Hauptsatz der Thermodynamik: Q = ΔU + A", "fr": "Premier principe de la thermodynamique : Q = ΔU + A", "es": "Primera ley de la termodinámica: Q = ΔU + A", "it": "Primo principio della termodinamica: Q = ΔU + A", "ru": "Первый закон термодинамики: Q = ΔU + A", "pt": "Primeira lei da termodinâmica: Q = ΔU + A"}, {"sr": "Rad gasa pri stalnom pritisku: A = p·ΔV", "en": "Work done by a gas at constant pressure: A = p·ΔV", "de": "Arbeit des Gases bei konstantem Druck: A = p·ΔV", "fr": "Travail du gaz à pression constante : A = p·ΔV", "es": "Trabajo del gas a presión constante: A = p·ΔV", "it": "Lavoro del gas a pressione costante: A = p·ΔV", "ru": "Работа газа при постоянном давлении: A = p·ΔV", "pt": "Trabalho do gás a pressão constante: A = p·ΔV"}], "remember": {"sr": "Ako se gas širi, vrši pozitivan rad (A>0); ako se sabija, rad je negativan (A<0). ΔU>0 znači da se gas zagreva.", "en": "If a gas expands, it does positive work (A>0); if it is compressed, the work is negative (A<0). ΔU>0 means the gas is heating up.", "de": "Dehnt sich das Gas aus, verrichtet es positive Arbeit (A>0); wird es komprimiert, ist die Arbeit negativ (A<0). ΔU>0 bedeutet, dass sich das Gas erwärmt.", "fr": "Si un gaz se dilate, il effectue un travail positif (A>0) ; s'il est comprimé, le travail est négatif (A<0). ΔU>0 signifie que le gaz se réchauffe.", "es": "Si un gas se expande, realiza trabajo positivo (A>0); si se comprime, el trabajo es negativo (A<0). ΔU>0 significa que el gas se calienta.", "it": "Se un gas si espande, compie lavoro positivo (A>0); se viene compresso, il lavoro è negativo (A<0). ΔU>0 significa che il gas si sta riscaldando.", "ru": "Если газ расширяется, он совершает положительную работу (A>0); если сжимается — работа отрицательна (A<0). ΔU>0 означает, что газ нагревается.", "pt": "Se um gás se expande, ele realiza trabalho positivo (A>0); se é comprimido, o trabalho é negativo (A<0). ΔU>0 significa que o gás está aquecendo."}, "problem": {"statement": {"sr": "Gasu je dovedena toplota Q=500 J, pri čemu je gas izvršio rad A=200 J nad okolinom. Odredi promenu unutrašnje energije gasa ΔU.", "en": "A gas is supplied with heat Q=500 J, during which the gas performs work A=200 J on its surroundings. Determine the change in internal energy of the gas ΔU.", "de": "Einem Gas wird die Wärme Q=500 J zugeführt, wobei das Gas die Arbeit A=200 J an der Umgebung verrichtet. Bestimme die Änderung der inneren Energie des Gases ΔU.", "fr": "On fournit à un gaz une chaleur Q=500 J, le gaz effectuant un travail A=200 J sur le milieu extérieur. Détermine la variation de l'énergie interne du gaz ΔU.", "es": "A un gas se le suministra un calor Q=500 J, durante el cual el gas realiza un trabajo A=200 J sobre el entorno. Determina el cambio de energía interna del gas ΔU.", "it": "A un gas viene fornito il calore Q=500 J, durante il quale il gas compie un lavoro A=200 J sull'ambiente. Determina la variazione dell'energia interna del gas ΔU.", "ru": "Газу подведена теплота Q=500 Дж, при этом газ совершил работу A=200 Дж над окружающей средой. Определи изменение внутренней энергии газа ΔU.", "pt": "A um gás é fornecido calor Q=500 J, durante o qual o gás realiza trabalho A=200 J sobre o ambiente. Determine a variação da energia interna do gás ΔU."}, "steps": [{"sr": "Zapiši prvi zakon termodinamike: Q = ΔU + A", "en": "Write the first law of thermodynamics: Q = ΔU + A", "de": "Ersten Hauptsatz der Thermodynamik notieren: Q = ΔU + A", "fr": "Écris le premier principe de la thermodynamique : Q = ΔU + A", "es": "Escribe la primera ley de la termodinámica: Q = ΔU + A", "it": "Scrivi il primo principio della termodinamica: Q = ΔU + A", "ru": "Запиши первый закон термодинамики: Q = ΔU + A", "pt": "Escreva a primeira lei da termodinâmica: Q = ΔU + A"}, {"sr": "Izrazi ΔU: ΔU = Q − A", "en": "Express ΔU: ΔU = Q − A", "de": "ΔU ausdrücken: ΔU = Q − A", "fr": "Exprime ΔU : ΔU = Q − A", "es": "Expresa ΔU: ΔU = Q − A", "it": "Esprimi ΔU: ΔU = Q − A", "ru": "Вырази ΔU: ΔU = Q − A", "pt": "Expresse ΔU: ΔU = Q − A"}, {"sr": "Uvrsti i izračunaj: ΔU = 500 − 200 = 300 J", "en": "Substitute and calculate: ΔU = 500 − 200 = 300 J", "de": "Einsetzen und berechnen: ΔU = 500 − 200 = 300 J", "fr": "Remplace et calcule : ΔU = 500 − 200 = 300 J", "es": "Sustituye y calcula: ΔU = 500 − 200 = 300 J", "it": "Sostituisci e calcola: ΔU = 500 − 200 = 300 J", "ru": "Подставь и вычисли: ΔU = 500 − 200 = 300 Дж", "pt": "Substitua e calcule: ΔU = 500 − 200 = 300 J"}]}}, {"name": {"sr": "Elektrostatika", "en": "Electrostatics", "de": "Elektrostatik", "fr": "Électrostatique", "es": "Electrostática", "it": "Elettrostatica", "ru": "Электростатика", "pt": "Eletrostática"}, "theory": {"sr": "<b>Kulonov zakon.</b> Naelektrisana tela međusobno deluju silom koja je srazmerna proizvodu njihovih naelektrisanja, a obrnuto srazmerna kvadratu rastojanja među njima: F=k·q₁·q₂/r². Istoimena naelektrisanja se odbijaju, a raznoimena privlače. Prostor oko naelektrisanog tela u kome se oseća delovanje sile naziva se električno polje, a njegova jačina data je odnosom E=F/q.", "en": "<b>Coulomb's law.</b> Charged bodies interact with a force proportional to the product of their charges and inversely proportional to the square of the distance between them: F=k·q₁·q₂/r². Like charges repel each other, while unlike charges attract. The space around a charged body in which the force is felt is called the electric field, and its strength is given by E=F/q.", "de": "<b>Das Coulombsche Gesetz.</b> Geladene Körper wirken mit einer Kraft aufeinander, die proportional zum Produkt ihrer Ladungen und umgekehrt proportional zum Quadrat des Abstands zwischen ihnen ist: F=k·q₁·q₂/r². Gleichnamige Ladungen stoßen sich ab, ungleichnamige ziehen sich an. Der Raum um einen geladenen Körper, in dem die Kraftwirkung spürbar ist, wird elektrisches Feld genannt, und seine Stärke ist gegeben durch E=F/q.", "fr": "<b>La loi de Coulomb.</b> Les corps chargés interagissent avec une force proportionnelle au produit de leurs charges et inversement proportionnelle au carré de la distance qui les sépare : F=k·q₁·q₂/r². Les charges de même signe se repoussent, tandis que celles de signe opposé s'attirent. L'espace autour d'un corps chargé où l'on ressent l'action de la force est appelé champ électrique, et son intensité est donnée par E=F/q.", "es": "<b>La ley de Coulomb.</b> Los cuerpos cargados interactúan con una fuerza proporcional al producto de sus cargas e inversamente proporcional al cuadrado de la distancia entre ellos: F=k·q₁·q₂/r². Las cargas del mismo signo se repelen, mientras que las de signo contrario se atraen. El espacio alrededor de un cuerpo cargado donde se percibe la acción de la fuerza se llama campo eléctrico, y su intensidad viene dada por E=F/q.", "it": "<b>La legge di Coulomb.</b> I corpi carichi interagiscono con una forza proporzionale al prodotto delle loro cariche e inversamente proporzionale al quadrato della distanza tra essi: F=k·q₁·q₂/r². Le cariche dello stesso segno si respingono, mentre quelle di segno opposto si attraggono. Lo spazio attorno a un corpo carico in cui si avverte l'azione della forza è chiamato campo elettrico, e la sua intensità è data da E=F/q.", "ru": "<b>Закон Кулона.</b> Заряженные тела взаимодействуют с силой, пропорциональной произведению их зарядов и обратно пропорциональной квадрату расстояния между ними: F=k·q₁·q₂/r². Одноимённые заряды отталкиваются, а разноимённые притягиваются. Пространство вокруг заряженного тела, в котором ощущается действие силы, называется электрическим полем, а его напряжённость определяется как E=F/q.", "pt": "<b>A lei de Coulomb.</b> Corpos carregados interagem com uma força proporcional ao produto de suas cargas e inversamente proporcional ao quadrado da distância entre eles: F=k·q₁·q₂/r². Cargas de mesmo sinal se repelem, enquanto cargas de sinais opostos se atraem. O espaço ao redor de um corpo carregado no qual se sente a ação da força é chamado de campo elétrico, e sua intensidade é dada por E=F/q."}, "formulas": [{"sr": "Kulonov zakon: F = k·q₁·q₂/r²", "en": "Coulomb's law: F = k·q₁·q₂/r²", "de": "Coulombsches Gesetz: F = k·q₁·q₂/r²", "fr": "Loi de Coulomb : F = k·q₁·q₂/r²", "es": "Ley de Coulomb: F = k·q₁·q₂/r²", "it": "Legge di Coulomb: F = k·q₁·q₂/r²", "ru": "Закон Кулона: F = k·q₁·q₂/r²", "pt": "Lei de Coulomb: F = k·q₁·q₂/r²"}, {"sr": "Jačina električnog polja: E = F/q", "en": "Electric field strength: E = F/q", "de": "Elektrische Feldstärke: E = F/q", "fr": "Intensité du champ électrique : E = F/q", "es": "Intensidad del campo eléctrico: E = F/q", "it": "Intensità del campo elettrico: E = F/q", "ru": "Напряжённость электрического поля: E = F/q", "pt": "Intensidade do campo elétrico: E = F/q"}], "remember": {"sr": "k je Kulonova konstanta (k≈9·10⁹ N·m²/C²). Naelektrisanje se najčešće izražava u mikrokulonima (1 μC = 10⁻⁶ C), pa ga pre računanja pretvori u kulone.", "en": "k is Coulomb's constant (k≈9·10⁹ N·m²/C²). Charge is often given in microcoulombs (1 μC = 10⁻⁶ C), so convert it to coulombs before calculating.", "de": "k ist die Coulomb-Konstante (k≈9·10⁹ N·m²/C²). Die Ladung wird oft in Mikrocoulomb angegeben (1 μC = 10⁻⁶ C), also vor der Berechnung in Coulomb umrechnen.", "fr": "k est la constante de Coulomb (k≈9·10⁹ N·m²/C²). La charge est souvent donnée en microcoulombs (1 μC = 10⁻⁶ C), il faut donc la convertir en coulombs avant de calculer.", "es": "k es la constante de Coulomb (k≈9·10⁹ N·m²/C²). La carga suele darse en microculombios (1 μC = 10⁻⁶ C), así que conviértela a culombios antes de calcular.", "it": "k è la costante di Coulomb (k≈9·10⁹ N·m²/C²). La carica è spesso data in microcoulomb (1 μC = 10⁻⁶ C), quindi convertila in coulomb prima di calcolare.", "ru": "k — постоянная Кулона (k≈9·10⁹ Н·м²/Кл²). Заряд часто задаётся в микрокулонах (1 мкКл = 10⁻⁶ Кл), поэтому переведи его в кулоны перед вычислением.", "pt": "k é a constante de Coulomb (k≈9·10⁹ N·m²/C²). A carga costuma ser dada em microcoulombs (1 μC = 10⁻⁶ C), então converta-a para coulombs antes de calcular."}, "problem": {"statement": {"sr": "Dva naelektrisanja q₁=2 μC i q₂=3 μC nalaze se na rastojanju r=0,3 m. Izračunaj silu njihovog međusobnog odbijanja. (k=9·10⁹ N·m²/C²)", "en": "Two charges q₁=2 μC and q₂=3 μC are located at a distance r=0.3 m from each other. Calculate the force of their mutual repulsion. (k=9·10⁹ N·m²/C²)", "de": "Zwei Ladungen q₁=2 μC und q₂=3 μC befinden sich im Abstand r=0,3 m voneinander. Berechne die Kraft ihrer gegenseitigen Abstoßung. (k=9·10⁹ N·m²/C²)", "fr": "Deux charges q₁=2 μC et q₂=3 μC se trouvent à une distance r=0,3 m l'une de l'autre. Calcule la force de leur répulsion mutuelle. (k=9·10⁹ N·m²/C²)", "es": "Dos cargas q₁=2 μC y q₂=3 μC se encuentran a una distancia r=0,3 m entre sí. Calcula la fuerza de su repulsión mutua. (k=9·10⁹ N·m²/C²)", "it": "Due cariche q₁=2 μC e q₂=3 μC si trovano a una distanza r=0,3 m l'una dall'altra. Calcola la forza della loro repulsione reciproca. (k=9·10⁹ N·m²/C²)", "ru": "Два заряда q₁=2 мкКл и q₂=3 мкКл находятся на расстоянии r=0,3 м друг от друга. Вычисли силу их взаимного отталкивания. (k=9·10⁹ Н·м²/Кл²)", "pt": "Duas cargas q₁=2 μC e q₂=3 μC estão a uma distância r=0,3 m uma da outra. Calcule a força de repulsão mútua entre elas. (k=9·10⁹ N·m²/C²)"}, "steps": [{"sr": "Zapiši Kulonov zakon: F = k·q₁·q₂/r²", "en": "Write Coulomb's law: F = k·q₁·q₂/r²", "de": "Coulombsches Gesetz notieren: F = k·q₁·q₂/r²", "fr": "Écris la loi de Coulomb : F = k·q₁·q₂/r²", "es": "Escribe la ley de Coulomb: F = k·q₁·q₂/r²", "it": "Scrivi la legge di Coulomb: F = k·q₁·q₂/r²", "ru": "Запиши закон Кулона: F = k·q₁·q₂/r²", "pt": "Escreva a lei de Coulomb: F = k·q₁·q₂/r²"}, {"sr": "Pretvori naelektrisanja u kulone: q₁=2·10⁻⁶ C, q₂=3·10⁻⁶ C", "en": "Convert the charges to coulombs: q₁=2·10⁻⁶ C, q₂=3·10⁻⁶ C", "de": "Ladungen in Coulomb umrechnen: q₁=2·10⁻⁶ C, q₂=3·10⁻⁶ C", "fr": "Convertis les charges en coulombs : q₁=2·10⁻⁶ C, q₂=3·10⁻⁶ C", "es": "Convierte las cargas a culombios: q₁=2·10⁻⁶ C, q₂=3·10⁻⁶ C", "it": "Converti le cariche in coulomb: q₁=2·10⁻⁶ C, q₂=3·10⁻⁶ C", "ru": "Переведи заряды в кулоны: q₁=2·10⁻⁶ Кл, q₂=3·10⁻⁶ Кл", "pt": "Converta as cargas para coulombs: q₁=2·10⁻⁶ C, q₂=3·10⁻⁶ C"}, {"sr": "Uvrsti vrednosti: F = 9·10⁹ · (2·10⁻⁶ · 3·10⁻⁶)/0,3²", "en": "Substitute the values: F = 9·10⁹ · (2·10⁻⁶ · 3·10⁻⁶)/0.3²", "de": "Werte einsetzen: F = 9·10⁹ · (2·10⁻⁶ · 3·10⁻⁶)/0,3²", "fr": "Remplace les valeurs : F = 9·10⁹ · (2·10⁻⁶ · 3·10⁻⁶)/0,3²", "es": "Sustituye los valores: F = 9·10⁹ · (2·10⁻⁶ · 3·10⁻⁶)/0,3²", "it": "Sostituisci i valori: F = 9·10⁹ · (2·10⁻⁶ · 3·10⁻⁶)/0,3²", "ru": "Подставь значения: F = 9·10⁹ · (2·10⁻⁶ · 3·10⁻⁶)/0,3²", "pt": "Substitua os valores: F = 9·10⁹ · (2·10⁻⁶ · 3·10⁻⁶)/0,3²"}, {"sr": "Izračunaj: F ≈ 0,6 N", "en": "Calculate: F ≈ 0.6 N", "de": "Berechnen: F ≈ 0,6 N", "fr": "Calcule : F ≈ 0,6 N", "es": "Calcula: F ≈ 0,6 N", "it": "Calcola: F ≈ 0,6 N", "ru": "Вычисли: F ≈ 0,6 Н", "pt": "Calcule: F ≈ 0,6 N"}]}}, {"name": {"sr": "Jednosmerna struja", "en": "Direct Current", "de": "Gleichstrom", "fr": "Courant continu", "es": "Corriente continua", "it": "Corrente continua", "ru": "Постоянный ток", "pt": "Corrente contínua"}, "theory": {"sr": "<b>Omov zakon.</b> Jednosmerna struja predstavlja usmereno kretanje naelektrisanja kroz provodnik u samo jednom smeru. Jačina struje kroz provodnik srazmerna je naponu na njegovim krajevima, a obrnuto srazmerna njegovoj otpornosti: U=I·R. Otpornost provodnika zavisi od njegove dužine, površine poprečnog preseka i vrste materijala, a raste sa porastom temperature.", "en": "<b>Ohm's law.</b> Direct current is the directed flow of charge through a conductor in only one direction. The current through a conductor is proportional to the voltage across its ends and inversely proportional to its resistance: U=I·R. The resistance of a conductor depends on its length, cross-sectional area and the type of material, and it increases as temperature rises.", "de": "<b>Das Ohmsche Gesetz.</b> Gleichstrom ist die gerichtete Bewegung von Ladungen durch einen Leiter in nur eine Richtung. Die Stromstärke durch einen Leiter ist proportional zur Spannung an seinen Enden und umgekehrt proportional zu seinem Widerstand: U=I·R. Der Widerstand eines Leiters hängt von seiner Länge, seinem Querschnitt und der Art des Materials ab und nimmt mit steigender Temperatur zu.", "fr": "<b>La loi d'Ohm.</b> Le courant continu est le déplacement dirigé de charges à travers un conducteur dans une seule direction. L'intensité du courant traversant un conducteur est proportionnelle à la tension à ses bornes et inversement proportionnelle à sa résistance : U=I·R. La résistance d'un conducteur dépend de sa longueur, de sa section transversale et du type de matériau, et elle augmente avec la température.", "es": "<b>La ley de Ohm.</b> La corriente continua es el movimiento dirigido de cargas a través de un conductor en un solo sentido. La intensidad de corriente en un conductor es proporcional a la tensión entre sus extremos e inversamente proporcional a su resistencia: U=I·R. La resistencia de un conductor depende de su longitud, del área de su sección transversal y del tipo de material, y aumenta con la temperatura.", "it": "<b>La legge di Ohm.</b> La corrente continua è il movimento diretto di cariche attraverso un conduttore in un'unica direzione. L'intensità di corrente in un conduttore è proporzionale alla tensione ai suoi capi e inversamente proporzionale alla sua resistenza: U=I·R. La resistenza di un conduttore dipende dalla sua lunghezza, dall'area della sezione trasversale e dal tipo di materiale, e aumenta con la temperatura.", "ru": "<b>Закон Ома.</b> Постоянный ток — это направленное движение заряда через проводник только в одном направлении. Сила тока через проводник пропорциональна напряжению на его концах и обратно пропорциональна его сопротивлению: U=I·R. Сопротивление проводника зависит от его длины, площади поперечного сечения и материала, и увеличивается с ростом температуры.", "pt": "<b>A lei de Ohm.</b> A corrente contínua é o movimento direcionado de cargas através de um condutor em apenas um sentido. A intensidade da corrente em um condutor é proporcional à tensão em seus terminais e inversamente proporcional à sua resistência: U=I·R. A resistência de um condutor depende de seu comprimento, da área de sua secção transversal e do tipo de material, e aumenta com o aumento da temperatura."}, "formulas": [{"sr": "Omov zakon: U = I·R", "en": "Ohm's law: U = I·R", "de": "Ohmsches Gesetz: U = I·R", "fr": "Loi d'Ohm : U = I·R", "es": "Ley de Ohm: U = I·R", "it": "Legge di Ohm: U = I·R", "ru": "Закон Ома: U = I·R", "pt": "Lei de Ohm: U = I·R"}, {"sr": "Jačina struje: I = q/t", "en": "Electric current: I = q/t", "de": "Stromstärke: I = q/t", "fr": "Intensité du courant : I = q/t", "es": "Intensidad de corriente: I = q/t", "it": "Intensità di corrente: I = q/t", "ru": "Сила тока: I = q/t", "pt": "Intensidade de corrente: I = q/t"}], "remember": {"sr": "U se meri u voltima (V), I u amperima (A), a R u omima (Ω). Napon se ne troši, već se raspoređuje na elemente kola prema njihovoj otpornosti.", "en": "U is measured in volts (V), I in amperes (A), and R in ohms (Ω). Voltage is not consumed but is distributed across the elements of a circuit according to their resistance.", "de": "U wird in Volt (V), I in Ampere (A) und R in Ohm (Ω) gemessen. Die Spannung wird nicht verbraucht, sondern verteilt sich entsprechend dem Widerstand auf die Schaltungselemente.", "fr": "U se mesure en volts (V), I en ampères (A) et R en ohms (Ω). La tension n'est pas consommée, mais se répartit sur les éléments du circuit selon leur résistance.", "es": "U se mide en voltios (V), I en amperios (A) y R en ohmios (Ω). La tensión no se consume, sino que se distribuye entre los elementos del circuito según su resistencia.", "it": "U si misura in volt (V), I in ampere (A) e R in ohm (Ω). La tensione non si consuma, ma si distribuisce sugli elementi del circuito in base alla loro resistenza.", "ru": "U измеряется в вольтах (В), I в амперах (А), а R в омах (Ом). Напряжение не расходуется, а распределяется по элементам цепи в соответствии с их сопротивлением.", "pt": "U é medida em volts (V), I em amperes (A) e R em ohms (Ω). A tensão não é consumida, mas distribuída pelos elementos do circuito de acordo com sua resistência."}, "problem": {"statement": {"sr": "Kroz otpornik otpornosti R=4 Ω priključen je napon U=12 V. Izračunaj jačinu struje kroz otpornik.", "en": "A voltage of U=12 V is applied across a resistor of resistance R=4 Ω. Calculate the current through the resistor.", "de": "An einem Widerstand mit R=4 Ω liegt eine Spannung von U=12 V an. Berechne die Stromstärke durch den Widerstand.", "fr": "Une tension U=12 V est appliquée à une résistance R=4 Ω. Calcule l'intensité du courant traversant la résistance.", "es": "Se aplica una tensión U=12 V a una resistencia R=4 Ω. Calcula la intensidad de corriente que pasa por la resistencia.", "it": "Ai capi di un resistore di resistenza R=4 Ω è applicata una tensione U=12 V. Calcola l'intensità di corrente attraverso il resistore.", "ru": "К резистору сопротивлением R=4 Ом приложено напряжение U=12 В. Вычисли силу тока через резистор.", "pt": "Uma tensão U=12 V é aplicada a um resistor de resistência R=4 Ω. Calcule a intensidade de corrente através do resistor."}, "steps": [{"sr": "Zapiši Omov zakon: I = U/R", "en": "Write Ohm's law: I = U/R", "de": "Ohmsches Gesetz notieren: I = U/R", "fr": "Écris la loi d'Ohm : I = U/R", "es": "Escribe la ley de Ohm: I = U/R", "it": "Scrivi la legge di Ohm: I = U/R", "ru": "Запиши закон Ома: I = U/R", "pt": "Escreva a lei de Ohm: I = U/R"}, {"sr": "Uvrsti vrednosti: I = 12/4", "en": "Substitute the values: I = 12/4", "de": "Werte einsetzen: I = 12/4", "fr": "Remplace les valeurs : I = 12/4", "es": "Sustituye los valores: I = 12/4", "it": "Sostituisci i valori: I = 12/4", "ru": "Подставь значения: I = 12/4", "pt": "Substitua os valores: I = 12/4"}, {"sr": "Izračunaj: I = 3 A", "en": "Calculate: I = 3 A", "de": "Berechnen: I = 3 A", "fr": "Calcule : I = 3 A", "es": "Calcula: I = 3 A", "it": "Calcola: I = 3 A", "ru": "Вычисли: I = 3 А", "pt": "Calcule: I = 3 A"}]}}, {"name": {"sr": "Rad i snaga struje", "en": "Work and Power of Electric Current", "de": "Arbeit und Leistung des elektrischen Stroms", "fr": "Travail et puissance du courant électrique", "es": "Trabajo y potencia de la corriente eléctrica", "it": "Lavoro e potenza della corrente elettrica", "ru": "Работа и мощность электрического тока", "pt": "Trabalho e potência da corrente elétrica"}, "theory": {"sr": "<b>Energija električne struje.</b> Prolaskom struje kroz provodnik, električna energija se pretvara u druge oblike energije, najčešće u toplotu. Snaga struje pokazuje koliko se energije pretvori u jedinici vremena: P=U·I=I²·R, a ukupan rad (energija) tokom vremena t iznosi A=U·I·t. Ovaj rad se u praksi meri u kilovat-časovima (kWh) i predstavlja osnovu za obračun potrošnje električne energije.", "en": "<b>Energy of electric current.</b> As current passes through a conductor, electrical energy is converted into other forms of energy, most often heat. The power of the current shows how much energy is converted per unit of time: P=U·I=I²·R, and the total work (energy) over time t equals A=U·I·t. In practice, this work is measured in kilowatt-hours (kWh) and forms the basis for calculating electricity consumption.", "de": "<b>Energie des elektrischen Stroms.</b> Beim Durchfließen eines Leiters wird elektrische Energie in andere Energieformen umgewandelt, meist in Wärme. Die Leistung des Stroms zeigt, wie viel Energie pro Zeiteinheit umgewandelt wird: P=U·I=I²·R, und die gesamte Arbeit (Energie) über die Zeit t beträgt A=U·I·t. Diese Arbeit wird in der Praxis in Kilowattstunden (kWh) gemessen und bildet die Grundlage für die Abrechnung des Stromverbrauchs.", "fr": "<b>Énergie du courant électrique.</b> Lorsque le courant traverse un conducteur, l'énergie électrique se transforme en d'autres formes d'énergie, le plus souvent en chaleur. La puissance du courant indique la quantité d'énergie transformée par unité de temps : P=U·I=I²·R, et le travail total (énergie) pendant le temps t vaut A=U·I·t. Ce travail se mesure en pratique en kilowattheures (kWh) et constitue la base du calcul de la consommation d'électricité.", "es": "<b>Energía de la corriente eléctrica.</b> Al pasar la corriente por un conductor, la energía eléctrica se transforma en otras formas de energía, con mayor frecuencia en calor. La potencia de la corriente indica cuánta energía se transforma por unidad de tiempo: P=U·I=I²·R, y el trabajo total (energía) durante el tiempo t es A=U·I·t. En la práctica, este trabajo se mide en kilovatios-hora (kWh) y constituye la base para calcular el consumo de electricidad.", "it": "<b>Energia della corrente elettrica.</b> Quando la corrente attraversa un conduttore, l'energia elettrica si trasforma in altre forme di energia, più spesso in calore. La potenza della corrente indica quanta energia si trasforma nell'unità di tempo: P=U·I=I²·R, e il lavoro totale (energia) nel tempo t è pari a A=U·I·t. Questo lavoro si misura in pratica in chilowattora (kWh) e costituisce la base per il calcolo del consumo di energia elettrica.", "ru": "<b>Энергия электрического тока.</b> При прохождении тока через проводник электрическая энергия превращается в другие виды энергии, чаще всего в теплоту. Мощность тока показывает, сколько энергии преобразуется в единицу времени: P=U·I=I²·R, а полная работа (энергия) за время t равна A=U·I·t. На практике эту работу измеряют в киловатт-часах (кВт·ч), и она служит основой для расчёта потребления электроэнергии.", "pt": "<b>Energia da corrente elétrica.</b> Ao passar por um condutor, a energia elétrica se converte em outras formas de energia, mais frequentemente em calor. A potência da corrente mostra quanta energia é convertida por unidade de tempo: P=U·I=I²·R, e o trabalho total (energia) durante o tempo t é A=U·I·t. Na prática, esse trabalho é medido em quilowatt-hora (kWh) e constitui a base para o cálculo do consumo de energia elétrica."}, "formulas": [{"sr": "Snaga struje: P = U·I = I²·R", "en": "Power of the current: P = U·I = I²·R", "de": "Leistung des Stroms: P = U·I = I²·R", "fr": "Puissance du courant : P = U·I = I²·R", "es": "Potencia de la corriente: P = U·I = I²·R", "it": "Potenza della corrente: P = U·I = I²·R", "ru": "Мощность тока: P = U·I = I²·R", "pt": "Potência da corrente: P = U·I = I²·R"}, {"sr": "Rad (energija) struje: A = U·I·t", "en": "Work (energy) of the current: A = U·I·t", "de": "Arbeit (Energie) des Stroms: A = U·I·t", "fr": "Travail (énergie) du courant : A = U·I·t", "es": "Trabajo (energía) de la corriente: A = U·I·t", "it": "Lavoro (energia) della corrente: A = U·I·t", "ru": "Работа (энергия) тока: A = U·I·t", "pt": "Trabalho (energia) da corrente: A = U·I·t"}], "remember": {"sr": "Pre uvrštavanja u formulu, vreme t uvek pretvori u sekunde (1 min=60 s, 1 h=3600 s), jer se snaga izražava u vatima (W), a rad u džulima (J).", "en": "Before substituting into the formula, always convert the time t into seconds (1 min=60 s, 1 h=3600 s), since power is expressed in watts (W) and work in joules (J).", "de": "Vor dem Einsetzen in die Formel immer die Zeit t in Sekunden umrechnen (1 min=60 s, 1 h=3600 s), da die Leistung in Watt (W) und die Arbeit in Joule (J) angegeben wird.", "fr": "Avant de substituer dans la formule, convertis toujours le temps t en secondes (1 min=60 s, 1 h=3600 s), car la puissance s'exprime en watts (W) et le travail en joules (J).", "es": "Antes de sustituir en la fórmula, convierte siempre el tiempo t a segundos (1 min=60 s, 1 h=3600 s), ya que la potencia se expresa en vatios (W) y el trabajo en julios (J).", "it": "Prima di sostituire nella formula, converti sempre il tempo t in secondi (1 min=60 s, 1 h=3600 s), poiché la potenza si esprime in watt (W) e il lavoro in joule (J).", "ru": "Перед подстановкой в формулу всегда переводи время t в секунды (1 мин=60 с, 1 ч=3600 с), так как мощность выражается в ваттах (Вт), а работа в джоулях (Дж).", "pt": "Antes de substituir na fórmula, converta sempre o tempo t para segundos (1 min=60 s, 1 h=3600 s), pois a potência é expressa em watts pt": "Converta o tempo para segundos: t = 5 min = 300 s"}, {"sr": "Izračunaj rad: A = P·t = 40 · 300", "en": "Calculate the work: A = P·t = 40 · 300", "de": "Arbeit berechnen: A = P·t = 40 · 300", "fr": "Calcule le travail : A = P·t = 40 · 300", "es": "Calcula el trabajo: A = P·t = 40 · 300", "it": "Calcola il lavoro: A = P·t = 40 · 300", "ru": "Вычисли работу: A = P·t = 40 · 300", "pt": "Calcule o trabalho: A = P·t = 40 · 300"}, {"sr": "Rezultat: A = 12000 J = 12 kJ", "en": "Result: A = 12000 J = 12 kJ", "de": "Ergebnis: A = 12000 J = 12 kJ", "fr": "Résultat : A = 12000 J = 12 kJ", "es": "Resultado: A = 12000 J = 12 kJ", "it": "Risultato: A = 12000 J = 12 kJ", "ru": "Результат: A = 12000 Дж = 12 кДж", "pt": "Resultado: A = 12000 J = 12 kJ"}]}}], "C": {"next": {"sr": "Dalje →", "en": "Next →", "de": "Weiter →", "fr": "Suivant →", "es": "Siguiente →", "it": "Avanti →", "ru": "Дальше →", "pt": "Seguinte →"}, "prev": {"sr": "← Nazad", "en": "← Back", "de": "← Zurück", "fr": "← Retour", "es": "← Atrás", "it": "← Indietro", "ru": "← Назад", "pt": "← Voltar"}, "finish": {"sr": "Završi 🎉", "en": "Finish 🎉", "de": "Fertig 🎉", "fr": "Terminer 🎉", "es": "Terminar 🎉", "it": "Finisci 🎉", "ru": "Готово 🎉", "pt": "Terminar 🎉"}, "done": {"sr": "Bravo, prešao si skriptu! 🎉", "en": "Yay, you finished the notes! 🎉", "de": "Super, Skript geschafft! 🎉", "fr": "Bravo, cours terminé ! 🎉", "es": "¡Bien, terminaste los apuntes! 🎉", "it": "Bravo, dispensa completata! 🎉", "ru": "Ура, конспект пройден! 🎉", "pt": "Boa, terminaste os apontamentos! 🎉"}, "doneSub": {"sr": "Sad si spreman za kviz 💪", "en": "Now you're ready for the quiz 💪", "de": "Jetzt bist du bereit fürs Quiz 💪", "fr": "Tu es prêt pour le quiz 💪", "es": "Ya estás listo para el test 💪", "it": "Ora sei pronto per il quiz 💪", "ru": "Теперь ты готов к тесту 💪", "pt": "Agora estás pronto para o quiz 💪"}, "toQuiz": {"sr": "Uradi kviz 🎯", "en": "Take the quiz 🎯", "de": "Zum Quiz 🎯", "fr": "Faire le quiz 🎯", "es": "Hacer el test 🎯", "it var MAS=['🦉','🦊','🐨','🐰','🐼','🦄','🐧','🦖','🐳','🌟','🧠','✨'];

function T(o){var l=lng();return (o&&(o[l]||o.sr))||''}
var i=0,N=D.topics.length;
function dots(){var d=$('dots');d.innerHTML='';for(var k=0;k<=N;k++){var s=document.createElement('i');if(k<i)s.className='done';if(k===i)s.className='on';d.appendChild(s);}}
function render(){
 dots();var st=$('stage');
 if(i>=N){ // finale
   st.innerHTML='<section class="card fin"><div class="big">🎉</div><h2>'+T(D.C.done)+'</h2><p>'+T(D.C.doneSub)+'</p>'+
     '<a class="cta" href="'+D.quiz+'">'+T(D.C.toQuiz)+'</a><a class="cta2" href="'+D.back+'">'+T(D.C.toClone)+'</a></section>';
   bigConf();return;
 }
 var tp=D.topics[i];
 var fx=(tp.formulas||[]).map(function(f,k){return '<span style="animation-delay:'+(k*0.06)+'s">'+T(f)+'</span>'}).join('');
 var zap=tp.remember?('<div class="zap"><span class="st">💡</span><p>'+T(tp.remember)+'</p></div>'):'';
 st.innerHTML='<section class="card"><div class="eyebrow">'+T(D.eyebrow)+'</div>'+
   '<div class="mascot">'+MAS[i%MAS.length]+'</div>'+
   '<div class="tnum">'+(i+1)+' / '+N+'</div>'+
   '<h1 class="ttl">'+T(tp.name)+'</h1>'+
   '<p class="theory">'+T(tp.theory)+'</p>'+
   (fx?'<div class="fx">'+fx+'</div>':'')+zap+
   '<div class="nav">'+(i>0?'<button class="prev" id="prev">'+T(D.C.prev)+'</button>':'')+
   '<button class="next" id="next">'+(i===N-1?T(D.C.finish):T(D.C.next))+'</button></div></section>';
 var nx=$('next');if(nx)nx.onclick=function(){i++;render();sparkle()};
 var pv=$('prev');if(pv)pv.onclick=function(){i--;render()};
}
function sparkle(){spawnConf(10)}

(function(){var box=$('fall'),g=['π','√','∑','+','÷','½','💛','🌸','✦','⭐'];for(var k=0;k<20;k++){var s=document.createElement('span');s.textContent=g[k%g.length];if(k%3===0)s.className='m';s.style.left=Math.random()*100+'%';s.style.fontSize=(13+Math.random()*22)+'px';s.style.animationDuration=(7+Math.random()*8)+'s';s.style.animationDelay=(-Math.random()*10)+'s';box.appendChild(s);}})();

:root{--cream:#FBF6EE;--ink:#5A1024;--ink2:#7A3346;--gold:#C6A05C;--goldlt:#F0DCA8;--malina:#B01E48;--malina2:#CC5E7E;--mint:#3FB98C;--muted:#8A7A80}

body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#43303A;min-height:100vh;

@keyframes fl{0%{transform:translateY(-10vh) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(112vh) rotate(24deg);opacity:0}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}

.back{background:linear-gradient(180deg,#FFF7FA,#FBEEF2);border:1px solid #F0D6DF;transform:rotateY(180deg);overflow-y:auto}
.back .fxx{display:block;font-family:'Spectral','Cambria Math',Georgia,serif;color:var(--ink);font-size:1.02rem;margin:5px 0;line-height:1.4}
.back .lbl{font-size:.66rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--malina);margin-bottom:6px}

<script>
var D={"eyebrow": {"sr": "Formule ✨", "en": "Formule ✨", "de": "Formule ✨", "fr": "Formule ✨", "es": "Formule ✨", "it": "Formule ✨", "ru": "Formule ✨", "pt": "Formule ✨"}, "title": {"sr": "Formule · Matematika 3. razred", "en": "Formulas · Mathematics Grade 3", "de": "Formeln · Mathematik 3. Klasse", "fr": "Formules · Mathématiques 3e année", "es": "Fórmulas · Matemáticas 3.º curso", "it": "Formule · Matematica 3ª classe", "ru": "Формулы · Математика, 3 класс", "pt": "Fórmulas · Matemática 3.º ano"}, "topics": [{"name": {"sr": "Kompleksni brojevi", "en": "Complex Numbers", "de": "Komplexe Zahlen", "fr": "Nombres complexes", "es": "Números complejos", "it": "Numeri complessi", "ru": "Комплексные числа", "pt": "Números complexos"}, "theory": {"sr": "<b>Kompleksni broj</b> je izraz oblika z = a + bi, gde su a i b realni brojevi, a i je imaginarna jedinica za koju važi i² = -1. Broj a je realni deo, a b je imaginarni deo kompleksnog broja. Kompleksni brojevi se mogu sabirati, oduzimati, množiti i deliti, a mogu se predstaviti i u trigonometrijskom obliku pomoću modula i argumenta.", "en": "<b>A complex number</b> is an expression of the form z = a + bi, where a and b are real numbers and i is the imaginary unit for which i² = -1. The number a is the real part, and b is the imaginary part of the complex number. Complex numbers can be added, subtracted, multiplied and divided, and can also be represented in trigonometric form using the modulus and the argument.", "de": "<b>Eine komplexe Zahl</b> ist ein Ausdruck der Form z = a + bi, wobei a und b reelle Zahlen sind und i die imaginäre Einheit ist, für die i² = -1 gilt. Die Zahl a ist der Realteil, b der Imaginärteil der komplexen Zahl. Komplexe Zahlen können addiert, subtrahiert, multipliziert und dividiert werden und lassen sich auch in trigonometrischer Form mithilfe von Betrag und Argument darstellen.", "fr": "<b>Un nombre complexe</b> est une expression de la forme z = a + bi, où a et b sont des nombres réels et i est l'unité imaginaire telle que i² = -1. Le nombre a est la partie réelle et b la partie imaginaire du nombre complexe. Les nombres complexes peuvent être additionnés, soustraits, multipliés et divisés, et peuvent aussi être représentés sous forme trigonométrique à l'aide du module et de l'argument.", "es": "<b>Un número complejo</b> es una expresión de la forma z = a + bi, donde a y b son números reales e i es la unidad imaginaria para la cual i² = -1. El número a es la parte real y b la parte imaginaria del número complejo. Los números complejos se pueden sumar, restar, multiplicar y dividir, y también se pueden representar en forma trigonométrica mediante el módulo y el argumento.", "it": "<b>Un numero complesso</b> è un'espressione della forma z = a + bi, dove a e b sono numeri reali e i è l'unità immaginaria per cui i² = -1. Il numero a è la parte reale e b la parte immaginaria del numero complesso. I numeri complessi possono essere sommati, sottratti, moltiplicati e divisi, e possono anche essere rappresentati in forma trigonometrica mediante il modulo e l'argomento.", "ru": "<b>Комплексное число</b> — это выражение вида z = a + bi, где a и b — действительные числа, а i — мнимая единица, для которой i² = -1. Число a называется действительной частью, а b — мнимой частью комплексного числа. Комплексные числа можно складывать, вычитать, умножать и делить, а также представлять в тригонометрической форме с помощью модуля и аргумента.", "pt": "<b>Um número complexo</b> é uma expressão da forma z = a + bi, em que a e b são números reais e i é a unidade imaginária para a qual i² = -1. O número a é a parte real e b é a parte imaginária do número complexo. Os números complexos podem ser somados, subtraídos, multiplicados e divididos, e também podem ser representados na forma trigonométrica através do módulo e do argumento."}, "formulas": [{"sr": "z = a + bi, i² = -1", "en": "z = a + bi, i² = -1", "de": "z = a + bi, i² = -1", "fr": "z = a + bi, i² = -1", "es": "z = a + bi, i² = -1", "it": "z = a + bi, i² = -1", "ru": "z = a + bi, i² = -1", "pt": "z = a + bi, i² = -1"}, {"sr": "|z| = √(a² + b²)", "en": "|z| = √(a² + b²)", "de": "|z| = √(a² + b²)", "fr": "|z| = √(a² + b²)", "es": "|z| = √(a² + b²)", "it": "|z| = √(a² + b²)", "ru": "|z| = √(a² + b²)", "pt": "|z| = √(a² + b²)"}, {"sr": "z = |z|(cos φ + i·sin φ)", "en": "z = |z|(cos φ + i·sin φ)", "de": "z = |z|(cos φ + i·sin φ)", "fr": "z = |z|(cos φ + i·sin φ)", "es": "z = |z|(cos φ + i·sin φ)", "it": "z = |z|(cos φ + i·sin φ)", "ru": "z = |z|(cos φ + i·sin φ)", "pt": "z = |z|(cos φ + i·sin φ)"}], "remember": {"sr": "Modul kompleksnog broja je uvek nenegativan realan broj i predstavlja rastojanje tačke z od koordinatnog početka.", "en": "The modulus of a complex number is always a non-negative real number and represents the distance of the point z from the origin.", "de": "Der Betrag einer komplexen Zahl ist stets eine nichtnegative reelle Zahl und entspricht dem Abstand des Punktes z vom Koordinatenursprung.", "fr": "Le module d'un nombre complexe est toujours un nombre réel non négatif et représente la distance du point z à l'origine.", "es": "El módulo de un número complejo es siempre un número real no negativo y representa la distancia del punto z al origen de coordenadas.", "it": "Il modulo di un numero complesso è sempre un numero reale non negativo e rappresenta la distanza del punto z dall'origine.", "ru": "Модуль комплексного числа всегда является неотрицательным действительным числом и представляет собой расстояние от точки z до начала координат.", "pt": "O módulo de um número complexo é sempre um número real não negativo e representa a distância do ponto z à origem."}, "problem": {"statement": {"sr": "Izračunati zbir i moduo kompleksnih brojeva z₁ = 3 + 4i i z₂ = 1 - 2i.", "en": "Calculate the sum and the modulus of the complex numbers z₁ = 3 + 4i and z₂ = 1 - 2i.", "de": "Berechne die Summe und den Betrag der komplexen Zahlen z₁ = 3 + 4i und z₂ = 1 - 2i.", "fr": "Calculer la somme et le module des nombres complexes z₁ = 3 + 4i et z₂ = 1 - 2i.", "es": "Calcular la suma y el módulo de los números complejos z₁ = 3 + 4i y z₂ = 1 - 2i.", "it": "Calcolare la somma e il modulo dei numeri complessi z₁ = 3 + 4i e z₂ = 1 - 2i.", "ru": "Вычислить сумму и модуль комплексных чисел z₁ = 3 + 4i и z₂ = 1 - 2i.", "pt": "Calcular a soma e o módulo dos números complexos z₁ = 3 + 4i e z₂ = 1 - 2i."}, "steps": [{"sr": "Saberimo realne i imaginarne delove: z₁ + z₂ = (3+1) + (4-2)i = 4 + 2i.", "en": "Add the real and imaginary parts: z₁ + z₂ = (3+1) + (4-2)i = 4 + 2i.", "de": "Addiere die Real- und Imaginärteile: z₁ + z₂ = (3+1) + (4-2)i = 4 + 2i.", "fr": "Additionnons les parties réelles et imaginaires : z₁ + z₂ = (3+1) + (4-2)i = 4 + 2i.", "es": "Sumamos las partes reales e imaginarias: z₁ + z₂ = (3+1) + (4-2)i = 4 + 2i.", "it": "Sommiamo le parti reali e immaginarie: z₁ + z₂ = (3+1) + (4-2)i = 4 + 2i.", "ru": "Сложим действительные и мнимые части: z₁ + z₂ = (3+1) + (4-2)i = 4 + 2i.", "pt": "Somamos as partes reais e imaginárias: z₁ + z₂ = (3+1) + (4-2)i = 4 + 2i."}, {"sr": "Izračunajmo moduo zbira: |z₁+z₂| = √(4² + 2²) = √20 = 2√5.", "en": "Calculate the modulus of the sum: |z₁+z₂| = √(4² + 2²) = √20 = 2√5.", "de": "Berechne den Betrag der Summe: |z₁+z₂| = √(4² + 2²) = √20 = 2√5.", "fr": "Calculons le module de la somme : |z₁+z₂| = √(4² + 2²) = √20 = 2√5.", "es": "Calculamos el módulo de la suma: |z₁+z₂| = √(4² + 2²) = √20 = 2√5.", "it": "Calcoliamo il modulo della somma: |z₁+z₂| = √(4² + 2²) = √20 = 2√5.", "ru": "Вычислим модуль суммы: |z₁+z₂| = √(4² + 2²) = √20 = 2√5.", "pt": "Calculamos o módulo da soma: |z₁+z₂| = √(4² + 2²) = √20 = 2√5."}, {"sr": "Za poređenje, moduo z₁ je √(3²+4²) = √25 = 5.", "en": "For comparison, the modulus of z₁ is √(3²+4²) = √25 = 5.", "de": "Zum Vergleich: Der Betrag von z₁ ist √(3²+4²) = √25 = 5.", "fr": "À titre de comparaison, le module de z₁ est √(3²+4²) = √25 = 5.", "es": "A modo de comparación, el módulo de z₁ es √(3²+4²) = √25 = 5.", "it": "Per confronto, il modulo di z₁ è √(3²+4²) = √25 = 5.", "ru": "Для сравнения, модуль z₁ равен √(3²+4²) = √25 = 5.", "pt": "Para comparação, o módulo de z₁ é √(3²+4²) = √25 = 5."}]}}, {"name": {"sr": "Vektori", "en": "Vectors", "de": "Vektoren", "fr": "Vecteurs", "es": "Vectores", "it": "Vettori", "ru": "Векторы", "pt": "Vetores"}, "theory": {"sr": "<b>Vektor</b> je usmerena duž određena intenzitetom, pravcem i smerom. U ravni se vektor a = (x, y) zadaje koordinatama, a njegov intenzitet je |a| = √(x² + y²). Vektori se sabiraju, oduzimaju i množe skalarom po komponentama. Skalarni proizvod dva vektora daje broj i koristi se za određivanje ugla između vektora i uslova normalnosti.", "en": "<b>A vector</b> is a directed segment determined by magnitude, direction and orientation. In the plane, a vector a = (x, y) is given by its coordinates, and its magnitude is |a| = √(x² + y²). Vectors are added, subtracted and multiplied by a scalar component-wise. The scalar (dot) product of two vectors gives a number and is used to determine the angle between vectors and the condition of perpendicularity.", "de": "<b>Ein Vektor</b> ist eine gerichtete Strecke, die durch Betrag, Richtung und Orientierung bestimmt ist. In der Ebene wird ein Vektor a = (x, y) durch seine Koordinaten angegeben, und sein Betrag ist |a| = √(x² + y²). Vektoren werden komponentenweise addiert, subtrahiert und mit einem Skalar multipliziert. Das Skalarprodukt zweier Vektoren liefert eine Zahl und dient zur Bestimmung des Winkels zwischen Vektoren sowie der Bedingung für Orthogonalität.", "fr": "<b>Un vecteur</b> est un segment orienté déterminé par son intensité, sa direction et son sens. Dans le plan, un vecteur a = (x, y) est donné par ses coordonnées, et son intensité est |a| = √(x² + y²). Les vecteurs s'additionnent, se soustraient et se multiplient par un scalaire composante par composante. Le produit scalaire de deux vecteurs donne un nombre et sert à déterminer l'angle entre les vecteurs et la condition de perpendicularité.", "es": "<b>Un vector</b> es un segmento orientado determinado por su intensidad, dirección y sentido. En el plano, un vector a = (x, y) se da mediante sus coordenadas, y su intensidad es |a| = √(x² + y²). Los vectores se suman, se restan y se multiplican por un escalar componente a componente. El producto escalar de dos vectores da un número y se utiliza para determinar el ángulo entre vectores y la condición de perpendicularidad.", "it": "<b>Un vettore</b> è un segmento orientato determinato da intensità, direzione e verso. Nel piano, un vettore a = (x, y) è dato dalle sue coordinate, e la sua intensità è |a| = √(x² + y²). I vettori si sommano, si sottraggono e si moltiplicano per uno scalare componente per componente. Il prodotto scalare di due vettori dà un numero e si usa per determinare l'angolo tra i vettori e la condizione di perpendicolarità.", "ru": "<b>Вектор</b> — это направленный отрезок, определяемый модулем, направлением и ориентацией. На плоскости вектор a = (x, y) задаётся координатами, а его модуль равен |a| = √(x² + y²). Векторы складываются, вычитаются и умножаются на скаляр покомпонентно. Скалярное произведение двух векторов даёт число и используется для определения угла между векторами и условия перпендикулярности.", "pt": "<b>Um vetor</b> é um segmento orientado determinado pela intensidade, direção e sentido. No plano, um vetor a = (x, y) é dado pelas suas coordenadas, e a sua intensidade é |a| = √(x² + y²). Os vetores somam-se, subtraem-se e multiplicam-se por um escalar componente a componente. O produto escalar de dois vetores dá um número e é usado para determinar o ângulo entre vetores e a condição de perpendicularidade."}, "formulas": [{"sr": "a·b = x₁x₂ + y₁y₂", "en": "a·b = x₁x₂ + y₁y₂", "de": "a·b = x₁x₂ + y₁y₂", "fr": "a·b = x₁x₂ + y₁y₂", "es": "a·b = x₁x₂ + y₁y₂", "it": "a·b = x₁x₂ + y₁y₂", "ru": "a·b = x₁x₂ + y₁y₂", "pt": "a·b = x₁x₂ + y₁y₂"}, {"sr": "|a| = √(x² + y²)", "en": "|a| = √(x² + y²)", "de": "|a| = √(x² + y²)", "fr": "|a| = √(x² + y²)", "es": "|a| = √(x² + y²)", "it": "|a| = √(x² + y²)", "ru": "|a| = √(x² + y²)", "pt": "|a| = √(x² + y²)"}, {"sr": "cos φ = (a·b)/(|a|·|b|)", "en": "cos φ = (a·b)/(|a|·|b|)", "de": "cos φ = (a·b)/(|a|·|b|)", "fr": "cos φ = (a·b)/(|a|·|b|)", "es": "cos φ = (a·b)/(|a|·|b|)", "it": "cos φ = (a·b)/(|a|·|b|)", "ru": "cos φ = (a·b)/(|a|·|b|)", "pt": "cos φ = (a·b)/(|a|·|b|)"}], "remember": {"sr": "Dva vektora su normalna (upravna) ako i samo ako je njihov skalarni proizvod jednak nuli.", "en": "Two vectors are perpendicular (normal) if and only if their scalar product equals zero.", "de": "Zwei Vektoren stehen genau dann senkrecht (orthogonal) aufeinander, wenn ihr Skalarprodukt gleich null ist.", "fr": "Deux vecteurs sont perpendiculaires si et seulement si leur produit scalaire est égal à zéro.", "es": "Dos vectores son perpendiculares si y solo si su producto escalar es igual a cero.", "it": "Due vettori sono perpendicolari se e solo se il loro prodotto scalare è uguale a zero.", "ru": "Два вектора перпендикулярны тогда и только тогда, когда их скалярное произведение равно нулю.", "pt": "Dois vetores são perpendiculares se e somente se o seu produto escalar for igual a zero."}, "problem": {"statement": {"sr": "Dati su vektori a = (2, 3) i b = (-1, 4). Izračunati skalarni proizvod i proveriti da li su vektori normalni.", "en": "Given vectors a = (2, 3) and b = (-1, 4). Calculate the scalar product and check whether the vectors are perpendicular.", "de": "Gegeben sind die Vektoren a = (2, 3) und b = (-1, 4). Berechne das Skalarprodukt und prüfe, ob die Vektoren senkrecht zueinander stehen.", "fr": "On donne les vecteurs a = (2, 3) et b = (-1, 4). Calculer le produit scalaire et vérifier si les vecteurs sont perpendiculaires.", "es": "Se dan los vectores a = (2, 3) y b = (-1, 4). Calcular el producto escalar y comprobar si los vectores son perpendiculares.", "it": "Sono dati i vettori a = (2, 3) e b = (-1, 4). Calcolare il prodotto scalare e verificare se i vettori sono perpendicolari.", "ru": "Даны векторы a = (2, 3) и b = (-1, 4). Вычислить скалярное произведение и проверить, перпендикулярны ли векторы.", "pt": "São dados os vetores a = (2, 3) e b = (-1, 4). Calcular o produto escalar e verificar se os vetores são perpendiculares."}, "steps": [{"sr": "Primenimo formulu skalarnog proizvoda: a·b = 2·(-1) + 3·4 = -2 + 12 = 10.", "en": "Apply the scalar product formula: a·b = 2·(-1) + 3·4 = -2 + 12 = 10.", "de": "Wende die Formel für das Skalarprodukt an: a·b = 2·(-1) + 3·4 = -2 + 12 = 10.", "fr": "Appliquons la formule du produit scalaire : a·b = 2·(-1) + 3·4 = -2 + 12 = 10.", "es": "Aplicamos la fórmula del producto escalar: a·b = 2·(-1) + 3·4 = -2 + 12 = 10.", "it": "Applichiamo la formula del prodotto scalare: a·b = 2·(-1) + 3·4 = -2 + 12 = 10.", "ru": "Применим формулу скалярного произведения: a·b = 2·(-1) + 3·4 = -2 + 12 = 10.", "pt": "Aplicamos a fórmula do produto escalar: a·b = 2·(-1) + 3·4 = -2 + 12 = 10."}, {"sr": "Kako je a·b = 10 ≠ 0, vektori nisu normalni.", "en": "Since a·b = 10 ≠ 0, the vectors are not perpendicular.", "de": "Da a·b = 10 ≠ 0 ist, stehen die Vektoren nicht senkrecht aufeinander.", "fr": "Comme a·b = 10 ≠ 0, les vecteurs ne sont pas perpendiculaires.", "es": "Como a·b = 10 ≠ 0, los vectores no son perpendiculares.", "it": "Poiché a·b = 10 ≠ 0, i vettori non sono perpendicolari.", "ru": "Так как a·b = 10 ≠ 0, векторы не перпендикулярны.", "pt": "Como a·b = 10 ≠ 0, os vetores não são perpendiculares."}, {"sr": "Izračunajmo i intenzitete: |a| = √(4+9) = √13, |b| = √(1+16) = √17.", "en": "Let us also calculate the magnitudes: |a| = √(4+9) = √13, |b| = √(1+16) = √17.", "de": "Berechnen wir auch die Beträge: |a| = √(4+9) = √13, |b| = √(1+16) = √17.", "fr": "Calculons aussi les intensités : |a| = √(4+9) = √13, |b| = √(1+16) = √17.", "es": "Calculemos también las intensidades: |a| = √(4+9) = √13, |b| = √(1+16) = √17.", "it": "Calcoliamo anche le intensità: |a| = √(4+9) = √13, |b| = √(1+16) = √17.", "ru": "Вычислим также модули: |a| = √(4+9) = √13, |b| = √(1+16) = √17.", "pt": "Calculemos também as intensidades: |a| = √(4+9) = √13, |b| = √(1+16) = √17."}]}}, {"name": {"sr": "Analitička geometrija", "en": "Analytic Geometry", "de": "Analytische Geometrie", "fr": "Géométrie analytique", "es": "Geometría analítica", "it": "Geometria analitica", "ru": "Аналитическая геометрия", "pt": "Geometria analítica"}, "theory": {"sr": "<b>Analitička geometrija</b> proučava geometrijske objekte pomoću koordinata i algebarskih jednačina. Rastojanje između dve tačke A(x₁,y₁) i B(x₂,y₂) računa se pomoću Pitagorine teoreme. Prava linija se može zadati eksplicitnim oblikom y = kx + n, gde je k koeficijent pravca, ili opštim oblikom Ax + By + C = 0.", "en": "<b>Analytic geometry</b> studies geometric objects using coordinates and algebraic equations. The distance between two points A(x₁,y₁) and B(x₂,y₂) is calculated using the Pythagorean theorem. A straight line can be given in explicit form y = kx + n, where k is the slope, or in general form Ax + By + C = 0.", "de": "<b>Die analytische Geometrie</b> untersucht geometrische Objekte mithilfe von Koordinaten und algebraischen Gleichungen. Der Abstand zwischen zwei Punkten A(x₁,y₁) und B(x₂,y₂) wird mit dem Satz des Pythagoras berechnet. Eine Gerade kann in expliziter Form y = kx + n angegeben werden, wobei k die Steigung ist, oder in allgemeiner Form Ax + By + C = 0.", "fr": "<b>La géométrie analytique</b> étudie les objets géométriques à l'aide de coordonnées et d'équations algébriques. La distance entre deux points A(x₁,y₁) et B(x₂,y₂) se calcule à l'aide du théorème de Pythagore. Une droite peut être donnée sous forme explicite y = kx + n, où k est le coefficient directeur, ou sous forme générale Ax + By + C = 0.", "es": "<b>La geometría analítica</b> estudia los objetos geométricos mediante coordenadas y ecuaciones algebraicas. La distancia entre dos puntos A(x₁,y₁) y B(x₂,y₂) se calcula mediante el teorema de Pitágoras. Una recta puede darse en forma explícita y = kx + n, donde k es la pendiente, o en forma general Ax + By + C = 0.", "it": "<b>La geometria analitica</b> studia gli oggetti geometrici mediante coordinate ed equazioni algebriche. La distanza tra due punti A(x₁,y₁) e B(x₂,y₂) si calcola con il teorema di Pitagora. Una retta può essere data in forma esplicita y = kx + n, dove k è il coefficiente angolare, oppure in forma generale Ax + By + C = 0.", "ru": "<b>Аналитическая геометрия</b> изучает геометрические объекты с помощью координат и алгебраических уравнений. Расстояние между двумя точками A(x₁,y₁) и B(x₂,y₂) вычисляется по теореме Пифагора. Прямая может быть задана в явном виде y = kx + n, где k — угловой коэффициент, или в общем виде Ax + By + C = 0.", "pt": "<b>A geometria analítica</b> estuda objetos geométricos através de coordenadas e equações algébricas. A distância entre dois pontos A(x₁,y₁) e B(x₂,y₂) calcula-se pelo teorema de Pitágoras. Uma reta pode ser dada na forma explícita y = kx + n, em que k é o declive, ou na forma geral Ax + By + C = 0."}, "formulas": [{"sr": "d = √((x₂-x₁)² + (y₂-y₁)²)", "en": "d = √((x₂-x₁)² + (y₂-y₁)²)", "de": "d = √((x₂-x₁)² + (y₂-y₁)²)", "fr": "d = √((x₂-x₁)² + (y₂-y₁)²)", "es": "d = √((x₂-x₁)² + (y₂-y₁)²)", "it": "d = √((x₂-x₁)² + (y₂-y₁)²)", "ru": "d = √((x₂-x₁)² + (y₂-y₁)²)", "pt": "d = √((x₂-x₁)² + (y₂-y₁)²)"}, {"sr": "y - y₁ = k(x - x₁)", "en": "y - y₁ = k(x - x₁)", "de": "y - y₁ = k(x - x₁)", "fr": "y - y₁ = k(x - x₁)", "es": "y - y₁ = k(x - x₁)", "it": "y - y₁ = k(x - x₁)", "ru": "y - y₁ = k(x - x₁)", "pt": "y - y₁ = k(x - x₁)"}, {"sr": "k = (y₂-y₁)/(x₂-x₁)", "en": "k = (y₂-y₁)/(x₂-x₁)", "de": "k = (y₂-y₁)/(x₂-x₁)", "fr": "k = (y₂-y₁)/(x₂-x₁)", "es": "k = (y₂-y₁)/(x₂-x₁)", "it": "k = (y₂-y₁)/(x₂-x₁)", "ru": "k = (y₂-y₁)/(x₂-x₁)", "pt": "k = (y₂-y₁)/(x₂-x₁)"}], "remember": {"sr": "Dve prave su paralelne ako imaju jednake koeficijente pravca (k₁ = k₂), a normalne ako je k₁·k₂ = -1.", "en": "Two lines are parallel if they have equal slopes (k₁ = k₂), and perpendicular if k₁·k₂ = -1.", "de": "Zwei Geraden sind parallel, wenn sie gleiche Steigungen haben (k₁ = k₂), und senkrecht, wenn k₁·k₂ = -1 gilt.", "fr": "Deux droites sont parallèles si elles ont le même coefficient directeur (k₁ = k₂), et perpendiculaires si k₁·k₂ = -1.", "es": "Dos rectas son paralelas si tienen la misma pendiente (k₁ = k₂), y perpendiculares si k₁·k₂ = -1.", "it": "Due rette sono parallele se hanno lo stesso coefficiente angolare (k₁ = k₂), e perpendicolari se k₁·k₂ = -1.", "ru": "Две прямые параллельны, если их угловые коэффициенты равны (k₁ = k₂), и перпендикулярны, если k₁·k₂ = -1.", "pt": "Duas retas são paralelas se tiverem declives iguais (k₁ = k₂), e perpendiculares se k₁·k₂ = -1."}, "problem": {"statement": {"sr": "Naći jednačinu prave koja prolazi kroz tačke A(1, 2) i B(3, 6).", "en": "Find the equation of the line passing through the points A(1, 2) and B(3, 6).", "de": "Bestimme die Gleichung der Geraden, die durch die Punkte A(1, 2) und B(3, 6) verläuft.", "fr": "Trouver l'équation de la droite passant par les points A(1, 2) et B(3, 6).", "es": "Hallar la ecuación de la recta que pasa por los puntos A(1, 2) y B(3, 6).", "it": "Trovare l'equazione della retta passante per i punti A(1, 2) e B(3, 6).", "ru": "Найти уравнение прямой, проходящей через точки A(1, 2) и B(3, 6).", "pt": "Encontrar a equação da reta que passa pelos pontos A(1, 2) e B(3, 6)."}, "steps": [{"sr": "Izračunajmo koeficijent pravca: k = (6-2)/(3-1) = 4/2 = 2.", "en": "Calculate the slope: k = (6-2)/(3-1) = 4/2 = 2.", "de": "Berechne die Steigung: k = (6-2)/(3-1) = 4/2 = 2.", "fr": "Calculons le coefficient directeur : k = (6-2)/(3-1) = 4/2 = 2.", "es": "Calculamos la pendiente: k = (6-2)/(3-1) = 4/2 = 2.", "it": "Calcoliamo il coefficiente angolare: k = (6-2)/(3-1) = 4/2 = 2.", "ru": "Вычислим угловой коэффициент: k = (6-2)/(3-1) = 4/2 = 2.", "pt": "Calculamos o declive: k = (6-2)/(3-1) = 4/2 = 2."}, {"sr": "Primenimo jednačinu prave kroz tačku: y - 2 = 2(x - 1).", "en": "Apply the point-slope equation of the line: y - 2 = 2(x - 1).", "de": "Wende die Punkt-Steigungs-Form der Geradengleichung an: y - 2 = 2(x - 1).", "fr": "Appliquons l'équation de la droite passant par un point : y - 2 = 2(x - 1).", "es": "Aplicamos la ecuación de la recta que pasa por un punto: y - 2 = 2(x - 1).", "it": "Applichiamo l'equazione della retta passante per un punto: y - 2 = 2(x - 1).", "ru": "Применим уравнение прямой, проходящей через точку: y - 2 = 2(x - 1).", "pt": "Aplicamos a equação da reta que passa por um ponto: y - 2 = 2(x - 1)."}, {"sr": "Sredimo izraz: y = 2x - 2 + 2 = 2x, odnosno y = 2x.", "en": "Simplify the expression: y = 2x - 2 + 2 = 2x, i.e. y = 2x.", "de": "Vereinfache den Ausdruck: y = 2x - 2 + 2 = 2x, also y = 2x.", "fr": "Simplifions l'expression : y = 2x - 2 + 2 = 2x, soit y = 2x.", "es": "Simplificamos la expresión: y = 2x - 2 + 2 = 2x, es decir, y = 2x.", "it": "Semplifichiamo l'espressione: y = 2x - 2 + 2 = 2x, cioè y = 2x.", "ru": "Упростим выражение: y = 2x - 2 + 2 = 2x, то есть y = 2x.", "pt": "Simplificamos a expressão: y = 2x - 2 + 2 = 2x, ou seja, y = 2x."}]}}, {"name": {"sr": "Nizovi", "en": "Sequences", "de": "Folgen", "fr": "Suites", "es": "Sucesiones", "it": "Successioni", "ru": "Последовательности", "pt": "Sucessões"}, "theory": {"sr": "<b>Niz</b> je funkcija čiji je domen skup prirodnih brojeva. Aritmetički niz ima konstantnu razliku d između uzastopnih članova, dok geometrijski niz ima konstantan količnik q. Opšti član aritmetičkog niza računa se preko prvog člana i razlike, a zbir prvih n članova preko odgovarajuće formule.", "en": "<b>A sequence</b> is a function whose domain is the set of natural numbers. An arithmetic sequence has a constant difference d between consecutive terms, while a geometric sequence has a constant ratio q. The general term of an arithmetic sequence is calculated from the first term and the difference, and the sum of the first n terms using the corresponding formula.", "de": "<b>Eine Folge</b> ist eine Funktion, deren Definitionsbereich die Menge der natürlichen Zahlen ist. Eine arithmetische Folge hat eine konstante Differenz d zwischen aufeinanderfolgenden Gliedern, während eine geometrische Folge einen konstanten Quotienten q hat. Das allgemeine Glied einer arithmetischen Folge wird aus dem ersten Glied und der Differenz berechnet, die Summe der ersten n Glieder mithilfe der entsprechenden Formel.", "fr": "<b>Une suite</b> est une fonction dont le domaine est l'ensemble des nombres naturels. Une suite arithmétique a une différence constante d entre termes consécutifs, tandis qu'une suite géométrique a une raison constante q. Le terme général d'une suite arithmétique se calcule à partir du premier terme et de la raison, et la somme des n premiers termes à l'aide de la formule correspondante.", "es": "<b>Una sucesión</b> es una función cuyo dominio es el conjunto de los números naturales. Una sucesión aritmética tiene una diferencia constante d entre términos consecutivos, mientras que una sucesión geométrica tiene una razón constante q. El término general de una sucesión aritmética se calcula a partir del primer término y la diferencia, y la suma de los primeros n términos mediante la fórmula correspondiente.", "it": "<b>Una successione</b> è una funzione il cui dominio è l'insieme dei numeri naturali. Una successione aritmetica ha una differenza costante d tra termini consecutivi, mentre una successione geometrica ha un rapporto costante q. Il termine generale di una successione aritmetica si calcola a partire dal primo termine e dalla differenza, e la somma dei primi n termini mediante la formula corrispondente.", "ru": "<b>Последовательность</b> — это функция, областью определения которой является множество натуральных чисел. Арифметическая последовательность имеет постоянную разность d между последовательными членами, а геометрическая — постоянный знаменатель q. Общий член арифметической последовательности вычисляется через первый член и разность, а сумма первых n членов — по соответствующей формуле.", "pt": "<b>Uma sucessão</b> é uma função cujo domínio é o conjunto dos números naturais. Uma sucessão aritmética tem uma diferença constante d entre termos consecutivos, enquanto uma sucessão geométrica tem uma razão constante q. O termo geral de uma sucessão aritmética calcula-se a partir do primeiro termo e da diferença, e a soma dos primeiros n termos através da fórmula correspondente."}, "formulas": [{"sr": "aₙ = a₁ + (n-1)d", "en": "aₙ = a₁ + (n-1)d", "de": "aₙ = a₁ + (n-1)d", "fr": "aₙ = a₁ + (n-1)d", "es": "aₙ = a₁ + (n-1)d", "it": "aₙ = a₁ + (n-1)d", "ru": "aₙ = a₁ + (n-1)d", "pt": "aₙ = a₁ + (n-1)d"}, {"sr": "Sₙ = n(a₁+aₙ)/2", "en": "Sₙ = n(a₁+aₙ)/2", "de": "Sₙ = n(a₁+aₙ)/2", "fr": "Sₙ = n(a₁+aₙ)/2", "es": "Sₙ = n(a₁+aₙ)/2", "it": "Sₙ = n(a₁+aₙ)/2", "ru": "Sₙ = n(a₁+aₙ)/2", "pt": "Sₙ = n(a₁+aₙ)/2"}, {"sr": "bₙ = b₁·qⁿ⁻¹", "en": "bₙ = b₁·qⁿ⁻¹", "de": "bₙ = b₁·qⁿ⁻¹", "fr": "bₙ = b₁·qⁿ⁻¹", "es": "bₙ = b₁·qⁿ⁻¹", "it": "bₙ = b₁·qⁿ⁻¹", "ru": "bₙ = b₁·qⁿ⁻¹", "pt": "bₙ = b₁·qⁿ⁻¹"}], "remember": {"sr": "Kod geometrijskog niza svaki sledeći član dobija se množenjem prethodnog istim brojem q, koji se zove količnik niza.", "en": "In a geometric sequence, each next term is obtained by multiplying the previous one by the same number q, called the ratio of the sequence.", "de": "Bei einer geometrischen Folge erhält man jedes nächste Glied, indem man das vorherige mit derselben Zahl q multipliziert, die man den Quotienten der Folge nennt.", "fr": "Dans une suite géométrique, chaque terme suivant s'obtient en multipliant le précédent par le même nombre q, appelé raison de la suite.", "es": "En una sucesión geométrica, cada término siguiente se obtiene multiplicando el anterior por el mismo número q, llamado razón de la sucesión.", "it": "In una successione geometrica, ogni termine successivo si ottiene moltiplicando il precedente per lo stesso numero q, detto ragione della successione.", "ru": "В геометрической последовательности каждый следующий член получается умножением предыдущего на одно и то же число q, называемое знаменателем прогрессии.", "pt": "Numa sucessão geométrica, cada termo seguinte obtém-se multiplicando o anterior pelo mesmo número q, chamado razão da sucessão."}, "problem": {"statement": {"sr": "U aritmetičkom nizu prvi član je a₁ = 5, a razlika d = 3. Odrediti deseti član i zbir prvih deset članova.", "en": "In an arithmetic sequence, the first term is a₁ = 5 and the difference is d = 3. Determine the tenth term and the sum of the first ten terms.", "de": "In einer arithmetischen Folge ist das erste Glied a₁ = 5 und die Differenz d = 3. Bestimme das zehnte Glied und die Summe der ersten zehn Glieder.", "fr": "Dans une suite arithmétique, le premier terme est a₁ = 5 et la raison d = 3. Déterminer le dixième terme et la somme des dix premiers termes.", "es": "En una sucesión aritmética, el primer término es a₁ = 5 y la diferencia es d = 3. Determinar el décimo término y la suma de los primeros diez términos.", "it": "In una successione aritmetica il primo termine è a₁ = 5 e la differenza è d = 3. Determinare il decimo termine e la somma dei primi dieci termini.", "ru": "В арифметической прогрессии первый член a₁ = 5, а разность d = 3. Найти десятый член и сумму первых десяти членов.", "pt": "Numa sucessão aritmética, o primeiro termo é a₁ = 5 e a diferença é d = 3. Determinar o décimo termo e a soma dos primeiros dez termos."}, "steps": [{"sr": "Primenimo formulu za opšti član: a₁₀ = 5 + (10-1)·3 = 5 + 27 = 32.", "en": "Apply the formula for the general term: a₁₀ = 5 + (10-1)·3 = 5 + 27 = 32.", "de": "Wende die Formel für das allgemeine Glied an: a₁₀ = 5 + (10-1)·3 = 5 + 27 = 32.", "fr": "Appliquons la formule du terme général : a₁₀ = 5 + (10-1)·3 = 5 + 27 = 32.", "es": "Aplicamos la fórmula del término general: a₁₀ = 5 + (10-1)·3 = 5 + 27 = 32.", "it": "Applichiamo la formula del termine generale: a₁₀ = 5 + (10-1)·3 = 5 + 27 = 32.", "ru": "Применим формулу общего члена: a₁₀ = 5 + (10-1)·3 = 5 + 27 = 32.", "pt": "Aplicamos a fórmula do termo geral: a₁₀ = 5 + (10-1)·3 = 5 + 27 = 32."}, {"sr": "Primenimo formulu za zbir: S₁₀ = 10(5+32)/2 = 10·37/2 = 185.", "en": "Apply the formula for the sum: S₁₀ = 10(5+32)/2 = 10·37/2 = 185.", "de": "Wende die Summenformel an: S₁₀ = 10(5+32)/2 = 10·37/2 = 185.", "fr": "Appliquons la formule de la somme : S₁₀ = 10(5+32)/2 = 10·37/2 = 185.", "es": "Aplicamos la fórmula de la suma: S₁₀ = 10(5+32)/2 = 10·37/2 = 185.", "it": "Applichiamo la formula della somma: S₁₀ = 10(5+32)/2 = 10·37/2 = 185.", "ru": "Применим формулу суммы: S₁₀ = 10(5+32)/2 = 10·37/2 = 185.", "pt": "Aplicamos a fórmula da soma: S₁₀ = 10(5+32)/2 = 10·37/2 = 185."}, {"sr": "Dakle a₁₀ = 32, a S₁₀ = 185.", "en": "So a₁₀ = 32, and S₁₀ = 185.", "de": "Also ist a₁₀ = 32 und S₁₀ = 185.", "fr": "Ainsi, a₁₀ = 32 et S₁₀ = 185.", "es": "Por tanto, a₁₀ = 32 y S₁₀ = 185.", "it": "Quindi a₁₀ = 32 e S₁₀ = 185.", "ru": "Итак, a₁₀ = 32, а S₁₀ = 185.", "pt": "Assim, a₁₀ = 32 e S₁₀ = 185."}]}}, {"name": {"sr": "Granična vrednost", "en": "Limit", "de": "Grenzwert", "fr": "Limite", "es": "Límite", "it": "Limite", "ru": "Предел", "pt": "Limite"}, "theory": {"sr": "<b>Granična vrednost (limes)</b> funkcije opisuje ponašanje funkcije kada nezavisno promenljiva teži nekoj vrednosti ili beskonačnosti. Zapisuje se kao lim(x→a) f(x) = L. Za nizove, granična vrednost pokazuje kojoj vrednosti teže članovi niza kada n teži beskonačnosti. Poznavanje osnovnih graničnih vrednosti i pravila računanja (zbir, proizvod, količnik) olakšava rešavanje složenijih zadataka.", "en": "<b>The limit</b> of a function describes the behavior of the function as the independent variable approaches some value or infinity. It is written as lim(x→a) f(x) = L. For sequences, the limit shows what value the terms of the sequence approach as n tends to infinity. Knowing the basic limits and the rules of calculation (sum, product, quotient) makes it easier to solve more complex problems.", "de": "<b>Der Grenzwert (Limes)</b> einer Funktion beschreibt das Verhalten der Funktion, wenn sich die unabhängige Variable einem bestimmten Wert oder Unendlich nähert. Er wird als lim(x→a) f(x) = L geschrieben. Bei Folgen zeigt der Grenzwert, welchem Wert sich die Glieder der Folge nähern, wenn n gegen Unendlich geht. Die Kenntnis der grundlegenden Grenzwerte und der Rechenregeln (Summe, Produkt, Quotient) erleichtert das Lösen komplexerer Aufgaben.", "fr": "<b>La limite</b> d'une fonction décrit le comportement de la fonction lorsque la variable indépendante tend vers une certaine valeur ou vers l'infini. Elle s'écrit lim(x→a) f(x) = L. Pour les suites, la limite indique vers quelle valeur tendent les termes de la suite lorsque n tend vers l'infini. Connaître les limites de base et les règles de calcul (somme, produit, quotient) facilite la résolution de problèmes plus complexes.", "es": "<b>El límite</b> de una función describe el comportamiento de la función cuando la variable independiente tiende a un cierto valor o al infinito. Se escribe como lim(x→a) f(x) = L. En las sucesiones, el límite muestra a qué valor tienden los términos de la sucesión cuando n tiende a infinito. Conocer los límites básicos y las reglas de cálculo (suma, producto, cociente) facilita la resolución de problemas más complejos.", "it": "<b>Il limite</b> di una funzione descrive il comportamento della funzione quando la variabile indipendente tende a un certo valore o all'infinito. Si scrive lim(x→a) f(x) = L. Per le successioni, il limite mostra a quale valore tendono i termini della successione quando n tende all'infinito. Conoscere i limiti fondamentali e le regole di calcolo (somma, prodotto, quoziente) facilita la risoluzione di problemi più complessi.", "ru": "<b>Предел (лимит)</b> функции описывает поведение функции, когда независимая переменная стремится к некоторому значению или к бесконечности. Записывается как lim(x→a) f(x) = L. Для последовательностей предел показывает, к какому значению стремятся члены последовательности при n, стремящемся к бесконечности. Знание основных пределов и правил вычисления (суммы, произведения, частного) облегчает решение более сложных задач.", "pt": "<b>O limite</b> de uma função descreve o comportamento da função quando a variável independente tende para um determinado valor ou para infinito. Escreve-se como lim(x→a) f(x) = L. Para sucessões, o limite mostra para que valor tendem os termos da sucessão quando n tende para infinito. Conhecer os limites básicos e as regras de cálculo (soma, produto, quociente) facilita a resolução de problemas mais complexos."}, "formulas": [{"sr": "lim(x→a) f(x) = L", "en": "lim(x→a) f(x) = L", "de": "lim(x→a) f(x) = L", "fr": "lim(x→a) f(x) = L", "es": "lim(x→a) f(x) = L", "it": "lim(x→a) f(x) = L", "ru": "lim(x→a) f(x) = L", "pt": "lim(x→a) f(x) = L"}, {"sr": "lim(n→∞) (1 + 1/n)ⁿ = e", "en": "lim(n→∞) (1 + 1/n)ⁿ = e", "de": "lim(n→∞) (1 + 1/n)ⁿ = e", "fr": "lim(n→∞) (1 + 1/n)ⁿ = e", "es": "lim(n→∞) (1 + 1/n)ⁿ = e", "it": "lim(n→∞) (1 + 1/n)ⁿ = e", "ru": "lim(n→∞) (1 + 1/n)ⁿ = e", "pt": "lim(n→∞) (1 + 1/n)ⁿ = e"}, {"sr": "lim(x→0) sin x / x = 1", "en": "lim(x→0) sin x / x = 1", "de": "lim(x→0) sin x / x = 1", "fr": "lim(x→0) sin x / x = 1", "es": "lim(x→0) sin x / x = 1", "it": "lim(x→0) sin x / x = 1", "ru": "lim(x→0) sin x / x = 1", "pt": "lim(x→0) sin x / x = 1"}], "remember": {"sr": "Kada dobijemo neodređeni oblik 0/0 ili ∞/∞, potrebno je izraz transformisati (faktorisati, skratiti) pre izračunavanja granične vrednosti.", "en": "When we obtain the indeterminate form 0/0 or ∞/∞, the expression must be transformed (factored, simplified) before calculating the limit.", "de": "Erhält man die unbestimmte Form 0/0 oder ∞/∞, muss der Ausdruck vor der Berechnung des Grenzwerts umgeformt werden (faktorisiert, gekürzt).", "fr": "Lorsqu'on obtient la forme indéterminée 0/0 ou ∞/∞, il faut transformer l'expression (factoriser, simplifier) avant de calculer la limite.", "es": "Cuando se obtiene la forma indeterminada 0/0 o ∞/∞, es necesario transformar la expresión (factorizar, simplificar) antes de calcular el límite.", "it": "Quando si ottiene la forma indeterminata 0/0 oppure ∞/∞, è necessario trasformare l'espressione (scomporre, semplificare) prima di calcolare il limite.", "ru": "Когда получается неопределённость вида 0/0 или ∞/∞, выражение необходимо преобразовать (разложить на множители, сократить) перед вычислением предела.", "pt": "Quando obtemos a forma indeterminada 0/0 ou ∞/∞, é necessário transformar a expressão (fatorizar, simplificar) antes de calcular o limite."}, "problem": {"statement": {"sr": "Izračunati graničnu vrednost lim(x→2) (x² - 4)/(x - 2).", "en": "Calculate the limit lim(x→2) (x² - 4)/(x - 2).", "de": "Berechne den Grenzwert lim(x→2) (x² - 4)/(x - 2).", "fr": "Calculer la limite lim(x→2) (x² - 4)/(x - 2).", "es": "Calcular el límite lim(x→2) (x² - 4)/(x - 2).", "it": "Calcolare il limite lim(x→2) (x² - 4)/(x - 2).", "ru": "Вычислить предел lim(x→2) (x² - 4)/(x - 2).", "pt": "Calcular o limite lim(x→2) (x² - 4)/(x - 2)."}, "steps": [{"sr": "Direktnom zamenom dobijamo neodređeni oblik 0/0, pa je potrebno faktorisati brojilac.", "en": "Direct substitution gives the indeterminate form 0/0, so the numerator must be factored.", "de": "Direktes Einsetzen liefert die unbestimmte Form 0/0, daher muss der Zähler faktorisiert werden.", "fr": "La substitution directe donne la forme indéterminée 0/0, il faut donc factoriser le numérateur.", "es": "La sustitución directa da la forma indeterminada 0/0, por lo que hay que factorizar el numerador.", "it": "La sostituzione diretta dà la forma indeterminata 0/0, quindi occorre scomporre il numeratore.", "ru": "Прямая подстановка даёт неопределённость 0/0, поэтому числитель нужно разложить на множители.", "pt": "A substituição direta dá a forma indeterminada 0/0, pelo que é necessário fatorizar o numerador."}, {"sr": "Rastavimo: x² - 4 = (x-2)(x+2), pa je razlomak jednak (x-2)(x+2)/(x-2) = x+2 za x≠2.", "en": "Factor: x² - 4 = (x-2)(x+2), so the fraction equals (x-2)(x+2)/(x-2) = x+2 for x≠2.", "de": "Zerlege: x² - 4 = (x-2)(x+2), somit ist der Bruch (x-2)(x+2)/(x-2) = x+2 für x≠2.", "fr": "Factorisons : x² - 4 = (x-2)(x+2), donc la fraction devient (x-2)(x+2)/(x-2) = x+2 pour x≠2.", "es": "Factorizamos: x² - 4 = (x-2)(x+2), por lo que la fracción es igual a (x-2)(x+2)/(x-2) = x+2 para x≠2.", "it": "Scomponiamo: x² - 4 = (x-2)(x+2), quindi la frazione diventa (x-2)(x+2)/(x-2) = x+2 per x≠2.", "ru": "Разложим: x² - 4 = (x-2)(x+2), поэтому дробь равна (x-2)(x+2)/(x-2) = x+2 при x≠2.", "pt": "Fatorizamos: x² - 4 = (x-2)(x+2), pelo que a fração é igual a (x-2)(x+2)/(x-2) = x+2 para x≠2."}, {"sr": "Sada računamo graničnu vrednost: lim(x→2) (x+2) = 2+2 = 4.", "en": "Now we calculate the limit: lim(x→2) (x+2) = 2+2 = 4.", "de": "Nun berechnen wir den Grenzwert: lim(x→2) (x+2) = 2+2 = 4.", "fr": "Calculons maintenant la limite : lim(x→2) (x+2) = 2+2 = 4.", "es": "Ahora calculamos el límite: lim(x→2) (x+2) = 2+2 = 4.", "it": "Ora calcoliamo il limite: lim(x→2) (x+2) = 2+2 = 4.", "ru": "Теперь вычислим предел: lim(x→2) (x+2) = 2+2 = 4.", "pt": "Agora calculamos o limite: lim(x→2) (x+2) = 2+2 = 4."}]}}, {"name": {"sr": "Izvod funkcije", "en": "Derivative of a Function", "de": "Ableitung einer Funktion", "fr": "Dérivée d'une fonction", "es": "Derivada de una función", "it": "Derivata di una funzione", "ru": "Производная функции", "pt": "Derivada de uma função"}, "theory": {"sr": "<b>Izvod funkcije</b> u tački pokazuje brzinu promene funkcije, odnosno nagib tangente na grafik u toj tački. Izvod se definiše kao granična vrednost količnika priraštaja funkcije i priraštaja argumenta kada priraštaj argumenta teži nuli. Postoje pravila za izvod zbira, proizvoda, količnika i složene funkcije, kao i tablica izvoda osnovnih funkcija.", "en": "<b>The derivative of a function</b> at a point shows the rate of change of the function, i.e. the slope of the tangent to the graph at that point. The derivative is defined as the limit of the ratio of the increment of the function to the increment of the argument as the increment of the argument tends to zero. There are rules for the derivative of a sum, product, quotient and composite function, as well as a table of derivatives of basic functions.", "de": "<b>Die Ableitung einer Funktion</b> an einer Stelle zeigt die Änderungsrate der Funktion, also die Steigung der Tangente an den Graphen an dieser Stelle. Die Ableitung wird als Grenzwert des Verhältnisses des Zuwachses der Funktion zum Zuwachs des Arguments definiert, wenn der Zuwachs des Arguments gegen null geht. Es gibt Regeln für die Ableitung von Summe, Produkt, Quotient und verketteter Funktion sowie eine Tabelle der Ableitungen grundlegender Funktionen.", "fr": "<b>La dérivée d'une fonction</b> en un point indique la vitesse de variation de la fonction, c'est-à-dire la pente de la tangente au graphe en ce point. La dérivée est définie comme la limite du rapport de l'accroissement de la fonction à l'accroissement de la variable lorsque celui-ci tend vers zéro. Il existe des règles pour la dérivée d'une somme, d'un produit, d'un quotient et d'une fonction composée, ainsi qu'un tableau des dérivées des fonctions de base.", "es": "<b>La derivada de una función</b> en un punto muestra la velocidad de cambio de la función, es decir, la pendiente de la tangente a la gráfica en ese punto. La derivada se define como el límite del cociente entre el incremento de la función y el incremento del argumento cuando este tiende a cero. Existen reglas para la derivada de una suma, un producto, un cociente y una función compuesta, así como una tabla de derivadas de las funciones básicas.", "it": "<b>La derivata di una funzione</b> in un punto indica la velocità di variazione della funzione, cioè la pendenza della tangente al grafico in quel punto. La derivata è definita come il limite del rapporto tra l'incremento della funzione e l'incremento dell'argomento quando quest'ultimo tende a zero. Esistono regole per la derivata di somma, prodotto, quoziente e funzione composta, oltre a una tabella delle derivate delle funzioni fondamentali.", "ru": "<b>Производная функции</b> в точке показывает скорость изменения функции, то есть угловой коэффициент касательной к графику в этой точке. Производная определяется как предел отношения приращения функции к приращению аргумента, когда приращение аргумента стремится к нулю. Существуют правила для производной суммы, произведения, частного и сложной функции, а также таблица производных основных функций.", "pt": "<b>A derivada de uma função</b> num ponto mostra a taxa de variação da função, ou seja, o declive da tangente ao gráfico nesse ponto. A derivada define-se como o limite do quociente entre o acréscimo da função e o acréscimo do argumento quando este tende para zero. Existem regras para a derivada da soma, do produto, do quociente e da função composta, bem como uma tabela de derivadas das funções básicas."}, "formulas": [{"sr": "f'(x) = lim(Δx→0) [f(x+Δx)-f(x)]/Δx", "en": "f'(x) = lim(Δx→0) [f(x+Δx)-f(x)]/Δx", "de": "f'(x) = lim(Δx→0) [f(x+Δx)-f(x)]/Δx", "fr": "f'(x) = lim(Δx→0) [f(x+Δx)-f(x)]/Δx", "es": "f'(x) = lim(Δx→0) [f(x+Δx)-f(x)]/Δx", "it": "f'(x) = lim(Δx→0) [f(x+Δx)-f(x)]/Δx", "ru": "f'(x) = lim(Δx→0) [f(x+Δx)-f(x)]/Δx", "pt": "f'(x) = lim(Δx→0) [f(x+Δx)-f(x)]/Δx"}, {"sr": "(xⁿ)' = n·xⁿ⁻¹", "en": "(xⁿ)' = n·xⁿ⁻¹", "de": "(xⁿ)' = n·xⁿ⁻¹", "fr": "(xⁿ)' = n·xⁿ⁻¹", "es": "(xⁿ)' = n·xⁿ⁻¹", "it": "(xⁿ)' = n·xⁿ⁻¹", "ru": "(xⁿ)' = n·xⁿ⁻¹", "pt": "(xⁿ)' = n·xⁿ⁻¹"}, {"sr": "(u·v)' = u'v + uv'", "en": "(u·v)' = u'v + uv'", "de": "(u·v)' = u'v + uv'", "fr": "(u·v)' = u'v + uv'", "es": "(u·v)' = u'v + uv'", "it": "(u·v)' = u'v + uv'", "ru": "(u·v)' = u'v + uv'", "pt": "(u·v)' = u'v + uv'"}], "remember": {"sr": "Izvod predstavlja koeficijent pravca tangente na grafik funkcije u datoj tački.", "en": "The derivative represents the slope of the tangent to the graph of a function at a given point.", "de": "Die Ableitung entspricht der Steigung der Tangente an den Graphen der Funktion in einem gegebenen Punkt.", "fr": "La dérivée représente le coefficient directeur de la tangente au graphe de la fonction en un point donné.", "es": "La derivada representa la pendiente de la tangente a la gráfica de la función en un punto dado.", "it": "La derivata rappresenta il coefficiente angolare della tangente al grafico della funzione in un dato punto.", "ru": "Производная представляет собой угловой коэффициент касательной к графику функции в данной точке.", "pt": "A derivada representa o declive da tangente ao gráfico da função num dado ponto."}, "problem": {"statement": {"sr": "Odrediti izvod funkcije f(x) = 3x⁴ - 2x² + 5 i izračunati njegovu vrednost za x = 1.", "en": "Find the derivative of the function f(x) = 3x⁴ - 2x² + 5 and calculate its value for x = 1.", "de": "Bestimme die Ableitung der Funktion f(x) = 3x⁴ - 2x² + 5 und berechne ihren Wert für x = 1.", "fr": "Déterminer la dérivée de la fonction f(x) = 3x⁴ - 2x² + 5 et calculer sa valeur pour x = 1.", "es": "Determinar la derivada de la función f(x) = 3x⁴ - 2x² + 5 y calcular su valor para x = 1.", "it": "Determinare la derivata della funzione f(x) = 3x⁴ - 2x² + 5 e calcolarne il valore per x = 1.", "ru": "Найти производную функции f(x) = 3x⁴ - 2x² + 5 и вычислить её значение при x = 1.", "pt": "Determinar a derivada da função f(x) = 3x⁴ - 2x² + 5 e calcular o seu valor para x = 1."}, "steps": [{"sr": "Primenimo pravilo (xⁿ)' = n·xⁿ⁻¹ na svaki sabirak: f'(x) = 3·4x³ - 2·2x + 0 = 12x³ - 4x.", "en": "Apply the rule (xⁿ)' = n·xⁿ⁻¹ to each term: f'(x) = 3·4x³ - 2·2x + 0 = 12x³ - 4x.", "de": "Wende die Regel (xⁿ)' = n·xⁿ⁻¹ auf jeden Summanden an: f'(x) = 3·4x³ - 2·2x + 0 = 12x³ - 4x.", "fr": "Appliquons la règle (xⁿ)' = n·xⁿ⁻¹ à chaque terme : f'(x) = 3·4x³ - 2·2x + 0 = 12x³ - 4x.", "es": "Aplicamos la regla (xⁿ)' = n·xⁿ⁻¹ a cada término: f'(x) = 3·4x³ - 2·2x + 0 = 12x³ - 4x.", "it": "Applichiamo la regola (xⁿ)' = n·xⁿ⁻¹ a ogni termine: f'(x) = 3·4x³ - 2·2x + 0 = 12x³ - 4x.", "ru": "Применим правило (xⁿ)' = n·xⁿ⁻¹ к каждому слагаемому: f'(x) = 3·4x³ - 2·2x + 0 = 12x³ - 4x.", "pt": "Aplicamos a regra (xⁿ)' = n·xⁿ⁻¹ a cada termo: f'(x) = 3·4x³ - 2·2x + 0 = 12x³ - 4x."}, {"sr": "Uvrstimo x = 1: f'(1) = 12·1³ - 4·1 = 12 - 4 = 8.", "en": "Substitute x = 1: f'(1) = 12·1³ - 4·1 = 12 - 4 = 8.", "de": "Setze x = 1 ein: f'(1) = 12·1³ - 4·1 = 12 - 4 = 8.", "fr": "Substituons x = 1 : f'(1) = 12·1³ - 4·1 = 12 - 4 = 8.", "es": "Sustituimos x = 1: f'(1) = 12·1³ - 4·1 = 12 - 4 = 8.", "it": "Sostituiamo x = 1: f'(1) = 12·1³ - 4·1 = 12 - 4 = 8.", "ru": "Подставим x = 1: f'(1) = 12·1³ - 4·1 = 12 - 4 = 8.", "pt": "Substituímos x = 1: f'(1) = 12·1³ - 4·1 = 12 - 4 = 8."}, {"sr": "Dakle izvod funkcije je f'(x) = 12x³ - 4x, a f'(1) = 8.", "en": "So the derivative of the function is f'(x) = 12x³ - 4x, and f'(1) = 8.", "de": "Also lautet die Ableitung der Funktion f'(x) = 12x³ - 4x, und f'(1) = 8.", "fr": "Ainsi, la dérivée de la fonction est f'(x) = 12x³ - 4x, et f'(1) = 8.", "es": "Por tanto, la derivada de la función es f'(x) = 12x³ - 4x, y f'(1) = 8.", "it": "Quindi la derivata della funzione è f'(x) = 12x³ - 4x, e f'(1) = 8.", "ru": "Итак, производная функции равна f'(x) = 12x³ - 4x, а f'(1) = 8.", "pt": "Assim, a derivada da função é f'(x) = 12x³ - 4x, e f'(1) = 8."}]}}], "C": {"tap": {"sr": "Tapni 👆", "en": "Tap 👆", "de": "Tippen 👆", "fr": "Touche 👆", "es": "Toca 👆", "it": "Tocca 👆", "ru": "Нажми 👆", "pt": "Toca 👆"}, "hint": {"sr": "Tapni karticu da vidiš formule ✨", "en": "Tap a card to see the formulas ✨", "de": "Karte antippen für die Formeln ✨", "fr": "Touche une carte pour voir les formules ✨", "es": "Toca una tarjeta para ver las fórmulas ✨", "it": "Tocca una carta per le formule ✨", "ru": "Нажми на карточку — увидишь формулы ✨", "pt": "Toca num cartão para ver as fórmulas ✨"}}, "back": "srednja-matematika-3.html"};
var EM=['🔢','📐','➗','📊','🧮','📈','🔺','⭐','🎲','🧊','💠','🌀'];

function T(o){var l=lng();return (o&&(o[l]||o.sr))||''}
function render(){
 $('eyebrow').textContent=T(D.eyebrow);$('h1').textContent=T(D.title);$('sub').textContent=T(D.C.hint);
 var g=$('grid');g.innerHTML='';
 D.topics.forEach(function(tp,idx){
   var fx=(tp.formulas||[]).map(function(f){return '<span class="fxx">'+T(f)+'</span>'}).join('');
   var c=document.createElement('div');c.className='flip';
   c.innerHTML='<div class="inner"><div class="face front"><div class="em">'+EM[idx%EM.length]+'</div><h3>'+T(tp.name)+'</h3><div class="tap">'+T(D.C.tap)+'</div></div>'+
     '<div class="face back"><div class="lbl">'+T(tp.name)+'</div>'+(fx||'<span class="fxx">—</span>')+'</div></div>';
   c.onclick=function(){c.classList.toggle('on')};
   g.appendChild(c);
 });
 var s=$('lang');if(s)s.value=lng();
}

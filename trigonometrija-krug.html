<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trigonometrijski krug — MATHIA</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#FBF6EE;--card:#FFFDF9;--plum:#5A1024;--plum2:#7A3346;--ink:#43303A;--muted:#8A7A80;--gold:#C6A05C;--golddk:#9C7838;--goldlt:#E7D2A2;--malina:#B01E48;--malina2:#CC5E7E;--serif:'Spectral',Georgia,serif;--sans:'Inter',system-ui,sans-serif;
--board1:#4A0E1E;--board2:#5A1024}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--ink);background:radial-gradient(700px 420px at 88% -8%,#FBEAEF 0,transparent 55%),radial-gradient(620px 400px at -6% 108%,#F7ECD6 0,transparent 58%),var(--cream);line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding:22px 20px 60px}
.head{text-align:center;margin:6px 0 14px}
.eyebrow{font-weight:800;letter-spacing:.24em;text-transform:uppercase;font-size:.72rem;color:var(--golddk)}
h1{font-family:var(--serif);color:var(--plum);font-size:clamp(1.7rem,4.4vw,2.5rem);margin:.15em 0 .1em}
.sub{color:var(--plum2);max-width:640px;margin:0 auto;font-size:1.02rem}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start;margin-top:16px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.board{background:linear-gradient(160deg,var(--board1),var(--board2));border:2px solid var(--gold);border-radius:22px;padding:12px;box-shadow:0 30px 60px -34px rgba(90,16,36,.6);position:relative;overflow:hidden}
.board svg{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
.board svg.drag{cursor:grabbing}
.side{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--card);border:1px solid var(--goldlt);border-radius:18px;padding:16px 16px 18px;box-shadow:0 20px 44px -34px rgba(90,16,36,.4)}
.panel h3{font-family:var(--serif);color:var(--plum);margin:0 0 8px;font-size:1.05rem}
.read{display:flex;flex-direction:column;gap:10px}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FCF6EA;border:1px solid var(--goldlt);border-radius:12px;padding:9px 13px}
.rrow .lbl{font-weight:800;color:var(--golddk);font-size:.86rem;letter-spacing:.02em}
.rrow .val{font-size:1.12rem;color:var(--plum)}
.rrow.thetaline .val{color:var(--malina);font-weight:800}
.controls .crow{display:flex;align-items:center;gap:10px;margin:10px 0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:100px;background:linear-gradient(90deg,var(--goldlt),var(--gold));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#FFF3F7,var(--malina2));border:2px solid #fff;box-shadow:0 4px 12px -3px rgba(176,30,72,.6);cursor:pointer}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--malina2);border:2px solid #fff;cursor:pointer}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button.b{font-family:inherit;font-weight:800;border:none;border-radius:100px;padding:10px 16px;cursor:pointer;font-size:.9rem;transition:transform .12s}
button.b:active{transform:scale(.96)}
.b-gold{background:linear-gradient(135deg,#EAD196,var(--gold));color:#3a2410;box-shadow:0 12px 24px -12px rgba(160,120,40,.6)}
.b-ghost{background:#FFFDF9;border:1.5px solid var(--goldlt);color:var(--plum)}
.b-malina{background:linear-gradient(135deg,var(--malina2),var(--malina));color:#fff;box-shadow:0 12px 24px -12px rgba(176,30,72,.55)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:#FFFDF9;border:1px solid var(--goldlt);border-radius:100px;padding:5px 11px;font-weight:800;font-size:.8rem;color:var(--plum);cursor:pointer}
.chip:hover{border-color:var(--gold)}
.togg{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--ink);font-weight:600}
.speed{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.note{color:var(--muted);font-size:.82rem;margin-top:8px}
.katex{font-size:1.05em}
.rrow .val .katex{color:inherit}
.langsel{position:absolute;top:12px;right:14px}
.langsel select{font:inherit;font-weight:700;border:1px solid var(--goldlt);border-radius:100px;padding:5px 10px;background:#fff;color:var(--plum)}
</style>
</head>
<body>
<div class="wrap">
  <div class="langsel"><select id="lang"><option value="sr">SR</option><option value="en">EN</option><option value="de">DE</option><option value="fr">FR</option><option value="es">ES</option><option value="it">IT</option><option value="ru">RU</option><option value="pt">PT</option></select></div>
  <div class="head">
    <div class="eyebrow" id="eyebrow">interaktivno · trigonometrija</div>
    <h1 id="title">Trigonometrijski krug</h1>
    <p class="sub" id="subtitle">Prevuci ružičastu tačku ili pusti animaciju — ugao se menja polako, a vrednosti se ispisuju uživo.</p>
  </div>

  <div class="grid">
    <div class="board"><svg id="uc" viewBox="0 0 620 620" aria-label="Trigonometrijski krug"></svg></div>

    <div class="side">
      <div class="panel">
        <h3 id="valuesH">Vrednosti</h3>
        <div class="read">
          <div class="rrow thetaline"><span class="lbl" id="lblAngle">UGAO θ</span><span class="val" id="vTheta"></span></div>
          <div class="rrow"><span class="lbl">RAD</span><span class="val" id="vRad"></span></div>
          <div class="rrow"><span class="lbl">sin θ</span><span class="val" id="vSin"></span></div>
          <div class="rrow"><span class="lbl">cos θ</span><span class="val" id="vCos"></span></div>
          <div class="rrow"><span class="lbl">tan θ</span><span class="val" id="vTan"></span></div>
        </div>
      </div>

      <div class="panel controls">
        <h3 id="ctrlH">Upravljanje</h3>
        <div class="crow"><input type="range" id="slider" min="0" max="360" step="0.5" value="45"></div>
        <div class="btns">
          <button class="b b-malina" id="play">▶ <span id="playTxt">Animiraj</span></button>
          <button class="b b-ghost" id="minus">−1°</button>
          <button class="b b-ghost" id="plus">+1°</button>
          <button class="b b-gold" id="reset">↺ <span id="resetTxt">Reset</span></button>
        </div>
        <div class="crow speed"><span id="speedTxt">Brzina</span>
          <input type="range" id="speed" min="0.2" max="3" step="0.1" value="0.7" style="max-width:150px">
        </div>
        <label class="togg"><input type="checkbox" id="snap"> <span id="snapTxt">Skoči na tačne uglove</span></label>
        <div class="note" id="snapNote">Brzi izbor:</div>
        <div class="chips" id="chips"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var I18N={
    eyebrow:{sr:"interaktivno · trigonometrija",en:"interactive · trigonometry",de:"interaktiv · Trigonometrie",fr:"interactif · trigonométrie",es:"interactivo · trigonometría",it:"interattivo · trigonometria",ru:"интерактивно · тригонометрия",pt:"interativo · trigonometria"},
    title:{sr:"Trigonometrijski krug",en:"Trigonometric unit circle",de:"Trigonometrischer Einheitskreis",fr:"Cercle trigonométrique",es:"Círculo trigonométrico",it:"Cerchio trigonometrico",ru:"Тригонометрический круг",pt:"Círculo trigonométrico"},
    subtitle:{sr:"Prevuci ružičastu tačku ili pusti animaciju — ugao se menja polako, a vrednosti se ispisuju uživo.",en:"Drag the pink point or start the animation — the angle changes slowly and the values update live.",de:"Zieh den rosa Punkt oder starte die Animation — der Winkel ändert sich langsam und die Werte aktualisieren sich live.",fr:"Fais glisser le point rose ou lance l'animation — l'angle change lentement et les valeurs se mettent à jour en direct.",es:"Arrastra el punto rosa o inicia la animación — el ángulo cambia despacio y los valores se actualizan en vivo.",it:"Trascina il punto rosa o avvia l'animazione — l'angolo cambia lentamente e i valori si aggiornano in tempo reale.",ru:"Тяни розовую точку или запусти анимацию — угол меняется медленно, а значения обновляются вживую.",pt:"Arrasta o ponto rosa ou inicia a animação — o ângulo muda devagar e os valores atualizam ao vivo."},
    valuesH:{sr:"Vrednosti",en:"Values",de:"Werte",fr:"Valeurs",es:"Valores",it:"Valori",ru:"Значения",pt:"Valores"},
    ctrlH:{sr:"Upravljanje",en:"Controls",de:"Steuerung",fr:"Commandes",es:"Controles",it:"Comandi",ru:"Управление",pt:"Controlos"},
    lblAngle:{sr:"UGAO θ",en:"ANGLE θ",de:"WINKEL θ",fr:"ANGLE θ",es:"ÁNGULO θ",it:"ANGOLO θ",ru:"УГОЛ θ",pt:"ÂNGULO θ"},
    play:{sr:"Animiraj",en:"Animate",de:"Animieren",fr:"Animer",es:"Animar",it:"Anima",ru:"Анимация",pt:"Animar"},
    pause:{sr:"Pauza",en:"Pause",de:"Pause",fr:"Pause",es:"Pausa",it:"Pausa",ru:"Пауза",pt:"Pausa"},
    reset:{sr:"Reset",en:"Reset",de:"Zurücksetzen",fr:"Réinit.",es:"Reiniciar",it:"Reset",ru:"Сброс",pt:"Repor"},
    speed:{sr:"Brzina",en:"Speed",de:"Tempo",fr:"Vitesse",es:"Velocidad",it:"Velocità",ru:"Скорость",pt:"Velocidade"},
    snap:{sr:"Skoči na tačne uglove",en:"Snap to special angles",de:"An besondere Winkel einrasten",fr:"Aimanter aux angles remarquables",es:"Ajustar a ángulos notables",it:"Aggancia agli angoli notevoli",ru:"Привязка к особым углам",pt:"Ajustar aos ângulos notáveis"},
    snapNote:{sr:"Brzi izbor:",en:"Quick pick:",de:"Schnellauswahl:",fr:"Choix rapide :",es:"Selección rápida:",it:"Scelta rapida:",ru:"Быстрый выбор:",pt:"Escolha rápida:"}
  };
  function lang(){try{var s=localStorage.getItem('mathia_lang');if(s){s=s.slice(0,2).toLowerCase();if(I18N.title[s])return s;}}catch(e){}return 'sr';}

  // special angles: deg -> {rad, sin, cos} as KaTeX
  var SPEC={
    0:{r:"0",s:"0",c:"1"},30:{r:"\\tfrac{\\pi}{6}",s:"\\tfrac12",c:"\\tfrac{\\sqrt3}{2}"},
    45:{r:"\\tfrac{\\pi}{4}",s:"\\tfrac{\\sqrt2}{2}",c:"\\tfrac{\\sqrt2}{2}"},60:{r:"\\tfrac{\\pi}{3}",s:"\\tfrac{\\sqrt3}{2}",c:"\\tfrac12"},
    90:{r:"\\tfrac{\\pi}{2}",s:"1",c:"0"},120:{r:"\\tfrac{2\\pi}{3}",s:"\\tfrac{\\sqrt3}{2}",c:"-\\tfrac12"},
    135:{r:"\\tfrac{3\\pi}{4}",s:"\\tfrac{\\sqrt2}{2}",c:"-\\tfrac{\\sqrt2}{2}"},150:{r:"\\tfrac{5\\pi}{6}",s:"\\tfrac12",c:"-\\tfrac{\\sqrt3}{2}"},
    180:{r:"\\pi",s:"0",c:"-1"},210:{r:"\\tfrac{7\\pi}{6}",s:"-\\tfrac12",c:"-\\tfrac{\\sqrt3}{2}"},
    225:{r:"\\tfrac{5\\pi}{4}",s:"-\\tfrac{\\sqrt2}{2}",c:"-\\tfrac{\\sqrt2}{2}"},240:{r:"\\tfrac{4\\pi}{3}",s:"-\\tfrac{\\sqrt3}{2}",c:"-\\tfrac12"},
    270:{r:"\\tfrac{3\\pi}{2}",s:"-1",c:"0"},300:{r:"\\tfrac{5\\pi}{3}",s:"-\\tfrac{\\sqrt3}{2}",c:"\\tfrac12"},
    315:{r:"\\tfrac{7\\pi}{4}",s:"-\\tfrac{\\sqrt2}{2}",c:"\\tfrac{\\sqrt2}{2}"},330:{r:"\\tfrac{11\\pi}{6}",s:"-\\tfrac12",c:"\\tfrac{\\sqrt3}{2}"},
    360:{r:"2\\pi",s:"0",c:"1"}
  };
  var SPECDEG=[0,30,45,60,90,120,135,150,180,210,225,240,270,300,315,330];

  var C=310,R=250; // svg center + radius
  var svg=document.getElementById('uc');
  var SVGNS="http://www.w3.org/2000/svg";
  function el(n,a){var e=document.createElementNS(SVGNS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
  function P(deg){var t=deg*Math.PI/180;return {x:C+R*Math.cos(t), y:C-R*Math.sin(t)};}

  // static layer
  svg.appendChild(el('circle',{cx:C,cy:C,r:R,fill:'none',stroke:'#7FB0E8',"stroke-width":2.4,opacity:.9}));
  svg.appendChild(el('line',{x1:C-R-26,y1:C,x2:C+R+26,y2:C,stroke:'#8FA8D8',"stroke-width":1.6,opacity:.55}));
  svg.appendChild(el('line',{x1:C,y1:C-R-26,x2:C,y2:C+R+26,stroke:'#8FA8D8',"stroke-width":1.6,opacity:.55}));
  // special-angle dots + degree labels + radian labels
  SPECDEG.forEach(function(d){
    var p=P(d);
    svg.appendChild(el('circle',{cx:p.x,cy:p.y,r:5,fill:'#E85C86'}));
    var lp=P(d), rr=R+30; var t=d*Math.PI/180;
    var lx=C+rr*Math.cos(t), ly=C-rr*Math.sin(t);
    var deg=el('text',{x:lx,y:ly+4,"text-anchor":"middle","font-size":15,fill:'#F3E7C9',"font-family":"Inter,system-ui"});deg.textContent=d+'°';svg.appendChild(deg);
    var rr2=R-30; var rx=C+rr2*Math.cos(t), ry=C-rr2*Math.sin(t);
    var rad=el('text',{x:rx,y:ry+4,"text-anchor":"middle","font-size":13,fill:'#E7D2A2',"font-family":"Inter,system-ui",opacity:.9});
    rad.textContent=({0:'0',30:'π/6',45:'π/4',60:'π/3',90:'π/2',120:'2π/3',135:'3π/4',150:'5π/6',180:'π',210:'7π/6',225:'5π/4',240:'4π/3',270:'3π/2',300:'5π/3',315:'7π/4',330:'11π/6'})[d];
    svg.appendChild(rad);
  });

  // dynamic layer
  var sector=el('path',{fill:'rgba(198,160,92,.35)',stroke:'none'}); svg.appendChild(sector);
  var cosSeg=el('line',{stroke:'#F2D06A',"stroke-width":6,"stroke-linecap":"round"}); svg.appendChild(cosSeg);
  var sinSeg=el('line',{stroke:'#5FD08B',"stroke-width":4,"stroke-dasharray":"7 7","stroke-linecap":"round"}); svg.appendChild(sinSeg);
  var radius=el('line',{stroke:'#EC3F63',"stroke-width":5,"stroke-linecap":"round"}); svg.appendChild(radius);
  var handle=el('circle',{r:15,fill:'#F49CC4',stroke:'#fff',"stroke-width":3,filter:''}); svg.appendChild(handle);

  var angle=45, playing=false, raf=null;

  function fmt(x){ if(Math.abs(x)<1e-9)x=0; var v=Math.round(x*1000)/1000; return (v===Math.round(v))?String(v):v.toFixed(3); }
  function tex(id,s){var e=document.getElementById(id); try{katex.render(s,e,{throwOnError:false});}catch(_){e.textContent=s;} }
  function txt(id,s){var e=document.getElementById(id); e.textContent=s;}

  function draw(){
    var p=P(angle);
    var t=angle*Math.PI/180, s=Math.sin(t), c=Math.cos(t);
    radius.setAttribute('x1',C);radius.setAttribute('y1',C);radius.setAttribute('x2',p.x);radius.setAttribute('y2',p.y);
    cosSeg.setAttribute('x1',C);cosSeg.setAttribute('y1',C);cosSeg.setAttribute('x2',p.x);cosSeg.setAttribute('y2',C);
    sinSeg.setAttribute('x1',p.x);sinSeg.setAttribute('y1',C);sinSeg.setAttribute('x2',p.x);sinSeg.setAttribute('y2',p.y);
    handle.setAttribute('cx',p.x);handle.setAttribute('cy',p.y);
    // arc sector from 0 to angle
    var rr=64; var a=((angle%360)+360)%360; var large=a>180?1:0;
    var e0={x:C+rr,y:C}, e1={x:C+rr*Math.cos(t),y:C-rr*Math.sin(t)};
    sector.setAttribute('d','M '+C+' '+C+' L '+e0.x+' '+e0.y+' A '+rr+' '+rr+' 0 '+large+' 0 '+e1.x+' '+e1.y+' Z');
    // readouts
    var dd=Math.round(a*100)/100;
    var whole=Math.abs(dd-Math.round(dd))<1e-6?Math.round(dd):dd;
    tex('vTheta', whole+"^\\circ");
    var spec=SPEC[Math.round(a)]; var isSpec=(Math.abs(a-Math.round(a))<1e-6)&&spec;
    if(isSpec){ tex('vRad',spec.r); tex('vSin',spec.s); tex('vCos',spec.c); }
    else { tex('vRad', (a*Math.PI/180).toFixed(3)); tex('vSin', fmt(s)); tex('vCos', fmt(c)); }
    if(Math.abs(c)<1e-9){ tex('vTan','\\text{—}'); } else { tex('vTan', fmt(s/c)); }
    document.getElementById('slider').value=a;
  }

  function setAngle(a,snap){ a=((a%360)+360)%360; if(snap){var best=0,bd=999;[0,30,45,60,90,120,135,150,180,210,225,240,270,300,315,330,360].forEach(function(x){var dd=Math.abs(x-a);if(dd<bd){bd=dd;best=x;}});a=best%360;} angle=a; draw(); }

  // drag
  var dragging=false;
  function evtAngle(ev){
    var r=svg.getBoundingClientRect();
    var px=(ev.clientX-r.left)/r.width*620, py=(ev.clientY-r.top)/r.height*620;
    var dx=px-C, dy=C-py; var a=Math.atan2(dy,dx)*180/Math.PI; return ((a%360)+360)%360;
  }
  function down(ev){dragging=true;svg.classList.add('drag');stopPlay();move(ev);ev.preventDefault();}
  function move(ev){ if(!dragging)return; var e=ev.touches?ev.touches[0]:ev; setAngle(evtAngle(e), document.getElementById('snap').checked); }
  function up(){dragging=false;svg.classList.remove('drag');}
  svg.addEventListener('mousedown',down); window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  svg.addEventListener('touchstart',down,{passive:false}); window.addEventListener('touchmove',function(e){if(dragging){move(e);e.preventDefault();}},{passive:false}); window.addEventListener('touchend',up);

  // animation (slow)
  var last=0;
  function loop(ts){ if(!playing)return; if(!last)last=ts; var dt=(ts-last)/1000; last=ts; var sp=parseFloat(document.getElementById('speed').value); angle=((angle+dt*sp*40)%360+360)%360; draw(); raf=requestAnimationFrame(loop); }
  function startPlay(){ if(playing)return; playing=true; last=0; document.getElementById('playTxt').textContent=I18N.pause[lang()]; document.getElementById('play').firstChild.textContent='⏸ '; raf=requestAnimationFrame(loop); }
  function stopPlay(){ playing=false; if(raf)cancelAnimationFrame(raf); document.getElementById('playTxt').textContent=I18N.play[lang()]; document.getElementById('play').firstChild.textContent='▶ '; }
  document.getElementById('play').addEventListener('click',function(){ playing?stopPlay():startPlay(); });
  document.getElementById('plus').addEventListener('click',function(){stopPlay();setAngle(Math.round(angle)+1,false);});
  document.getElementById('minus').addEventListener('click',function(){stopPlay();setAngle(Math.round(angle)-1,false);});
  document.getElementById('reset').addEventListener('click',function(){stopPlay();setAngle(45,false);});
  document.getElementById('slider').addEventListener('input',function(){stopPlay();setAngle(parseFloat(this.value), document.getElementById('snap').checked);});

  // quick chips
  var chips=document.getElementById('chips');
  SPECDEG.forEach(function(d){ var b=document.createElement('button'); b.className='chip'; b.textContent=d+'°'; b.addEventListener('click',function(){stopPlay();setAngle(d,false);}); chips.appendChild(b); });

  function applyLang(){ var l=lang(); document.getElementById('lang').value=l;
    ['eyebrow','title','subtitle','valuesH','ctrlH','lblAngle','snapNote'].forEach(function(k){var e=document.getElementById(k);if(e&&I18N[k])e.textContent=I18N[k][l];});
    document.getElementById('playTxt').textContent=playing?I18N.pause[l]:I18N.play[l];
    document.getElementById('resetTxt').textContent=I18N.reset[l];
    document.getElementById('speedTxt').textContent=I18N.speed[l];
    document.getElementById('snapTxt').textContent=I18N.snap[l];
    document.documentElement.setAttribute('lang',l);
  }
  document.getElementById('lang').addEventListener('change',function(){try{localStorage.setItem('mathia_lang',this.value);}catch(e){}applyLang();});
  window.addEventListener('mathia:lang',applyLang);

  applyLang(); draw();   /* iscrtaj odmah — tex() ima fallback na tekst ako KaTeX još nije tu */
  if(!window.katex){var sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js';sc.onload=function(){draw();};document.head.appendChild(sc);}
})();
</script>
</body>
</html>

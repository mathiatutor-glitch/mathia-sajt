<style>
:root{--cream:#FBF6EE;--ink:#5A1024;--ink2:#7A3346;--gold:#C6A05C;--golddk:#A6803C;--goldlt:#F0DCA8;--goldsoft:#F0DCA8;--malina:#B01E48;--malina2:#CC5E7E;--mint:#3FB98C;--muted:#8A7A80;--line:#EFE1DC}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#43303A;min-height:100vh;background:radial-gradient(520px 400px at 104% -6%,#F6E1EC 0,transparent 56%),radial-gradient(500px 380px at -6% 106%,#F7ECD6 0,transparent 58%),var(--cream);overflow-x:hidden}
h1,h2,h3{font-family:'Spectral',Georgia,serif;font-weight:700;margin:0;color:var(--ink);line-height:1.15}
#fall{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fall span{position:absolute;top:-8%;font-family:'Spectral',serif;font-style:italic;color:rgba(198,160,92,.20);animation:fl linear infinite;will-change:transform}
#fall span.m{color:rgba(176,30,72,.15)}
@keyframes fl{0%{transform:translateY(-10vh) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(112vh) rotate(24deg);opacity:0}}
@media(prefers-reduced-motion:reduce){#fall{display:none}}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:14px 18px 40px}
.top{display:flex;align-items:center;gap:12px;padding:6px 2px 14px}
.top .back{color:var(--ink2);text-decoration:none;font-weight:800;font-size:1.15rem}
.top .lang{margin-left:auto;border:1px solid var(--goldlt);border-radius:100px;padding:5px 10px;font-family:inherit;font-weight:800;font-size:.72rem;color:var(--ink);background:#fff;cursor:pointer}
.bar{flex:1;height:14px;border-radius:100px;background:#EEE1D8;overflow:hidden;box-shadow:inset 0 1px 3px rgba(120,60,70,.12)}
.bar>i{display:block;height:100%;width:0;border-radius:100px;background:linear-gradient(90deg,var(--gold),var(--malina));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hearts{font-size:1rem;white-space:nowrap}.streak{font-weight:900;color:var(--gold);font-size:.95rem;white-space:nowrap}
.hero{text-align:center;margin:2px 0 14px}
.hero .free{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(180deg,#FFFBF3,#FBF3E2);border:1px solid var(--goldsoft);border-radius:100px;padding:6px 15px;font-weight:800;font-size:.72rem;color:var(--golddk)}
.card{background:linear-gradient(180deg,#FFFDF9,#FDF3EA);border:1px solid var(--goldlt);border-radius:30px;padding:24px 22px;box-shadow:0 30px 70px -34px rgba(90,16,36,.5);animation:pop .5s cubic-bezier(.2,.9,.2,1);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),#FFF6D6,var(--gold),transparent)}
@keyframes pop{0%{transform:scale(.95) translateY(10px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.eyebrow{text-align:center;font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:.66rem;color:var(--malina)}
.qnum{display:block;text-align:center;margin:2px 0 4px;color:var(--muted);font-weight:800;font-size:.8rem}
.mascot{width:70px;height:70px;margin:4px auto 4px;border-radius:50%;display:grid;place-items:center;font-size:2.15rem;background:radial-gradient(circle at 40% 34%,#FFF3F7,#F6E1EC);border:2px solid var(--goldlt);box-shadow:0 12px 26px -12px rgba(176,30,72,.4);animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.qtag{display:block;text-align:center;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--golddk);margin:2px 0 6px}
.q{font-family:'Spectral',serif;font-weight:700;color:var(--ink);font-size:1.3rem;text-align:center;line-height:1.3;margin:4px 0 6px}
.opts{display:grid;gap:11px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #EFE0D6;border-radius:18px;padding:13px 15px;font-family:'Spectral','Cambria Math',Georgia,serif;font-weight:600;font-size:1.05rem;color:var(--ink);cursor:pointer;transition:transform .12s,border-color .15s,background .15s;text-align:left}
.opt .mk{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-weight:800;font-size:.82rem;color:var(--golddk)}
.opt:hover{transform:translateY(-2px);border-color:var(--gold)}
.opts.locked .opt{cursor:default}
.opt.correct{border-color:var(--mint);background:linear-gradient(180deg,#F1FBF6,#E4F6EE);animation:good .5s}
.opt.correct .mk{border-color:var(--mint);background:var(--mint);color:#fff}
.opt.wrong{border-color:var(--malina);background:linear-gradient(180deg,#FDEFF3,#FBE3EA);animation:shake .4s}
.opt.wrong .mk{border-color:var(--malina);background:var(--malina);color:#fff}
@keyframes good{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:12px;text-align:center;font-weight:900;font-size:1.02rem;min-height:22px}
.fb.ok{color:var(--mint)}.fb.no{color:var(--malina)}
.sol{max-height:0;opacity:0;overflow:hidden;transition:max-height .5s ease,opacity .4s ease,margin .4s ease;margin:0}
.sol.on{max-height:1600px;opacity:1;margin:14px 0 0}
.sol-in{background:linear-gradient(180deg,#FFF7FA,#FBEEF2);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.sol-h{font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:.7rem;color:var(--malina);margin-bottom:6px;text-align:center}
.step{display:block;font-family:'Spectral','Cambria Math',Georgia,serif;font-size:1.06rem;color:var(--ink);white-space:normal;overflow-wrap:break-word;margin:10px 0;line-height:1.6}
.res{display:inline-block;margin-top:6px;font-family:'Spectral',serif;font-weight:700;color:var(--malina);border:1.5px solid rgba(176,30,72,.35);border-radius:10px;padding:4px 14px;background:#fff}
.note{color:#7A3346;font-size:.94rem;margin-top:8px}
.rt{border-top:2px solid currentColor;padding:.08em .2em 0;margin-left:-.04em}
.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .18em}
.frac>span{display:block;line-height:1.12;padding:0 .45em}
.frac .num{border-bottom:1.5px solid currentColor;padding-bottom:.06em}.frac .den{padding-top:.06em}
b{color:var(--ink)}
.cta{display:block;width:100%;margin-top:14px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--malina2),var(--malina));color:#fff;font-weight:900;font-size:1.02rem;padding:14px;border-radius:100px;box-shadow:0 16px 30px -14px rgba(176,30,72,.6);transition:transform .15s;text-decoration:none;text-align:center}
.cta:hover{transform:translateY(-2px)}
.cta.ghost{background:linear-gradient(135deg,#EAD196,#C6A05C);color:#3a2410;box-shadow:0 14px 28px -14px rgba(160,120,40,.7)}
.reveal{display:block;width:100%;margin-top:12px;border:1.5px solid rgba(198,160,92,.5);cursor:pointer;background:#fff;color:var(--golddk);font-weight:800;font-size:.95rem;padding:12px;border-radius:100px;transition:background .15s}
.reveal:hover{background:#FBF3E2}
.hidden{display:none}
.result{text-align:center}.result .big{font-size:3.2rem;margin:4px 0}.result h2{font-size:1.8rem;margin:2px 0}
.result .score{font-weight:900;color:var(--gold);font-size:1.12rem}.result .msg{color:var(--ink2);margin:8px 0 4px}
.rbadge{display:inline-flex;align-items:center;gap:8px;margin:12px auto 4px;background:linear-gradient(135deg,#FFF3D6,#F3DFA6);border:1px solid var(--goldlt);border-radius:100px;padding:10px 18px;font-weight:900;color:#8a6a1e;box-shadow:0 10px 22px -12px rgba(160,120,40,.6)}
.again{margin-top:12px;background:none;border:none;color:var(--ink2);font-weight:800;cursor:pointer;text-decoration:underline}
#conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#conf i{position:absolute;top:-6%;width:10px;height:14px;border-radius:2px;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(560deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style id="prov-lux">
.card{background:linear-gradient(180deg,#FFFDF9,#FBEFDA)!important;border:1.5px solid rgba(198,160,92,.4)!important;border-radius:26px!important;box-shadow:0 40px 90px -50px rgba(90,16,36,.5)!important}
.mascot{width:78px!important;height:78px!important;background:radial-gradient(circle at 40% 30%,#FFF6D6,#EAD3A0)!important;border:2px solid #C6A05C!important;box-shadow:0 16px 30px -14px rgba(198,160,92,.85)!important;font-size:2rem!important}
.bar{height:14px!important;background:#F1E7D4!important;border:1px solid rgba(198,160,92,.35)}
.bar>*{background:linear-gradient(90deg,#E7D2A2,#C6A05C)!important;transition:width .45s ease!important}
.opt{background:linear-gradient(180deg,#fff,#FBF3E4)!important;border:1.5px solid rgba(198,160,92,.42)!important;border-radius:16px!important;padding:14px 15px!important;grid-template-columns:auto 1fr!important;align-items:center;gap:12px;text-align:left;font-weight:700;color:#5A1024;transition:transform .14s,border-color .14s,box-shadow .14s;box-shadow:0 6px 16px -12px rgba(156,120,56,.5)}
.opt:hover{border-color:#C6A05C!important;transform:translateY(-2px);box-shadow:0 16px 28px -14px rgba(198,160,92,.75)}
.opt:active{transform:scale(.99)}
.opt .mk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,#FFF6D6,#E7D2A2);border:1px solid #C6A05C;font-weight:900;color:#5A1024;flex:none}
.opt.correct{border-color:#3F9A6A!important;background:linear-gradient(180deg,#F3FBF5,#E7F6EC)!important}
.opt.wrong{border-color:#CC5E7E!important;background:linear-gradient(180deg,#FFF5F8,#FBEAF0)!important}
.fb{font-size:1.08rem!important}
.heart{font-size:1.05rem!important}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.98)}100%{opacity:1;transform:none}}
@media(prefers-reduced-motion:no-preference){.mascot{animation:mbob 3s ease-in-out infinite}@keyframes mbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}}
</style>
<style id="kviz-space">
main.wrap{min-height:100dvh;display:flex;flex-direction:column;padding-bottom:56px}
.hero{margin-top:auto}
#quiz,#report{margin-bottom:auto}
.opts{gap:14px!important;margin-top:20px!important}
.opt{padding:16px 18px!important}

<style id="mathia-polish">
/* MATHIA quiz polish — nicer fonts, larger owl-side text, vertical centering, top-row spacing.
   Palette-safe only: cream #FBF6EE, card #FFFDF9, plum #5A1024, ink #43303A, gold #C6A05C/#9C7838, malina #B01E48. No purple/lavender. */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--mp-plum:#5A1024;--mp-ink:#43303A;--mp-gold:#C6A05C;--mp-golddk:#9C7838;--mp-malina:#B01E48;--mp-muted:#8A7A80}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--mp-ink)}
h1,h2,h3{font-family:'Spectral',Georgia,'Times New Roman',serif}

/* 3 + 4) Vertically center the whole quiz group and lower it — responsive, no clipping (min-height, not fixed height) */
main.wrap{min-height:100dvh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding-top:26px}
.hero{margin-top:0!important}
#quiz,#report{margin-bottom:0!important}

/* 4) Top row (hearts + streak + language) — breathing room, less cramped, lowered */
.top{padding:18px 2px 22px!important;gap:14px!important}
.top .back{font-size:1.25rem!important}
.top .lang{font-size:.8rem!important;padding:7px 13px!important;letter-spacing:.03em}
.hearts{font-size:1.12rem!important}
.streak{font-size:1.02rem!important}

/* 2) Text around the owl — enlarge eyebrow, question number and topic tag for readability */
.eyebrow{font-size:.84rem!important;letter-spacing:.16em!important;color:var(--mp-malina)}
.qnum{font-size:1rem!important;font-weight:800!important;color:var(--mp-muted)}
.qtag{font-size:.84rem!important;letter-spacing:.1em!important;color:var(--mp-golddk)}

/* 1) Fonts — elegant serif for the question, clean Inter for options/body/UI */
.q{font-family:'Spectral',Georgia,serif!important;font-weight:700;color:var(--mp-plum)}
.opt{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif!important;font-weight:600;color:var(--mp-plum)}
.opt .mk{font-family:'Inter',system-ui,sans-serif!important}
.eyebrow,.qnum,.qtag,.fb,.cta,.reveal,.top,.streak{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif!important}

/* cuter, cleaner touch */
.card{border-radius:28px!important}
.mascot{margin:8px auto 10px!important}

/* short screens: keep comfortable, never clip */
@media(max-height:680px){main.wrap{justify-content:flex-start;padding-top:14px;padding-bottom:28px}}
</style>

<style id="mathia-kviz-fix">
/* Palette: cream #FBF6EE, plum #5A1024, gold #C6A05C/#9C7838, malina #B01E48 */
/* 3) HEADER STACKING: eyebrow -> subject -> question number, nicely spaced */
.eyebrow{text-align:center!important;font-family:'Inter',system-ui,sans-serif!important;font-weight:900!important;letter-spacing:.2em!important;text-transform:uppercase;font-size:.72rem!important;color:#B01E48!important;margin:0 0 3px!important}
.subject{display:block;text-align:center;font-family:'Spectral',Georgia,'Times New Roman',serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#5A1024;font-size:1.16rem;line-height:1.12;margin:2px 0 4px}
.qnum{display:block!important;text-align:center;font-family:'Inter',system-ui,sans-serif!important;color:#8A7A80!important;font-weight:800!important;font-size:.9rem!important;margin:2px 0 4px!important}
/* 1) CRITICAL next button: vertical-centering used to push it off-screen. Anchor content to top so it is always visible & scrollable. */
main.wrap{justify-content:flex-start!important;padding-top:22px}
#next{margin-top:16px}
#next:not(.hidden){display:block!important}
/* 4) SOLUTION: clean, centered, one step per line, highlighted result */
.sol-in{text-align:center!important}
.sol-h{text-align:center!important}
.step{display:block!important;text-align:center!important;margin:10px 0!important;line-height:1.55!important}
.note{text-align:center!important;margin:10px auto!important;max-width:34em}
.res{display:inline-block!important;margin:12px auto 2px!important;padding:9px 20px!important;font-weight:800!important;color:#B01E48!important;background:#fff!important;border:1.6px solid rgba(176,30,72,.42)!important;border-radius:12px!important;box-shadow:0 10px 22px -14px rgba(176,30,72,.6)!important}
/* 2) KaTeX: proper radicals, italic i, consistent phi, real matrices */
.katex{font-size:1.05em;color:inherit;line-height:1.2}
.q .katex{font-size:1.12em}
.opt .katex,.step .katex,.res .katex,.note .katex{font-size:1.02em}
.katex-display{margin:.3em 0}
</style>

  <div class="top">
    <a class="back" id="backlink" href="predmet-web-programiranje.html">←</a>
    <div class="bar"><i id="prog"></i></div>

orica о чём угодно по этому предмету — объяснит на твоём примере, шаг за шагом, круглосуточно.", "pt": "Pergunta à Profesorica qualquer coisa desta disciplina — explica no teu exemplo, passo a passo, 24h."}, "askBtn": {"sr": "Pitaj Profesoricu →", "en": "Ask Profesorica →", "de": "Frag Profesorica →", "fr": "Demande à Profesorica →", "es": "Pregunta a Profesorica →", "it": "Chiedi a Profesorica →", "ru": "Спроси Profesorica →", "pt": "Pergunta à Profesorica →"}, "allBtn": {"sr": "Svi predmeti →", "en": "All subjects →", "de": "Alle Fächer →", "fr": "Toutes les matières →", "es": "Todas las asignaturas →", "it": "Tutte le materie →", "ru": "Все предметы →", "pt": "Todas as disciplinas →"}, "again": {"sr": "↺ Ponovi kviz", "en": "↺ Retake the quiz", "de": "↺ Quiz wiederholen", "fr": "↺ Refaire le quiz", "es": "↺ Repetir el test", "it": "↺ Rifai il quiz", "ru": "↺ Пройти заново", "pt": "↺ Repetir o quiz"}, "back": {"sr": "← Web", "en": "← Web", "de": "← Web", "fr": "← Web", "es": "← Web", "it": "← Web", "ru": "← Веб", "pt": "← Web"}, "eyebrow": {"sr": "Proveri znanje · Web", "en": "Test yourself · Web", "de": "Wissen prüfen · Web", "fr": "Teste-toi · Web", "es": "Ponte a prueba · Web", "it": "Mettiti alla prova · Web", "ru": "Проверь знания · Веб", "pt": "Testa-te · Web"}};
var DATA={"sr": [{"tag": "HTTP metode", "q": "Koja HTTP metoda kreira novi resurs na serveru?", "o": ["POST", "GET", "DELETE", "HEAD"], "c": 0, "sol": "<span class=\"res\">POST kreira resurs i menja stanje: POST /users.</span>"}, {"tag": "Statusni kod", "q": "Koji statusni kod znači „stranica nije pronađena“?", "o": ["404", "200", "500", "301"], "c": 0, "sol": "<span class=\"res\">404 = greška klijenta (4xx): resurs ne postoji.</span>"}, {"tag": "Statusni kod", "q": "Šta označava statusni kod 500?", "o": ["Internu grešku servera", "Uspešan odgovor", "Preusmerenje", "Zabranjen pristup"], "c": 0, "sol": "<span class=\"res\">5xx = greška servera; 500 je opšta interna greška.</span>"}, {"tag": "DOM", "q": "Šta je DOM?", "o": ["Stablo objekata koje predstavlja HTML dokument", "Protokol za prenos podataka", "Baza podataka u pregledaču", "Format za stilizovanje stranice"], "c": 0, "sol": "<span class=\"res\">DOM = objektni model dokumenta; JS ga koristi da čita i menja HTML.</span>"}, {"tag": "HTTP", "q": "Koja osobina najbolje opisuje HTTP protokol?", "o": ["Bez stanja (stateless)", "Uvek šifrovan", "Čuva stanje između zahteva", "Radi samo lokalno"], "c": 0, "sol": "<span class=\"res\">HTTP je bez stanja; sesije/kolačići pamte korisnika.</span>"}, {"tag": "REST i JSON", "q": "U kom formatu REST API najčešće razmenjuje podatke?", "o": ["JSON", "EXE", "MP3", "CSS"], "c": 0, "sol": "<span class=\"res\">JSON je lagan tekstualni format ključ–vrednost, idealan za API.</span>"}, {"tag": "Bezbednost", "q": "Kako se najbolje branimo od XSS napada?", "o": ["Sanitizacijom i escape-ovanjem korisničkog unosa", "Povećavanjem veličine fonta", "Korišćenjem samo GET metode", "Onemogućavanjem CSS-a"], "c": 0, "sol": "<span class=\"res\">Nikad ne veruj unosu: escapuj izlaz i sanitizuj sadržaj pre prikaza.</span>"}, {"tag": "Idempotentnost", "q": "Koja metoda je „bezbedna“ i idempotentna (ponavljanje ne menja stanje)?", "o": ["GET", "POST", "PATCH", "CONNECT"], "c": 0, "sol": "<span class=\"res\">GET samo čita — ponavljanje ne menja stanje na serveru.</span>"}, {"tag": "Kolačići i sesije", "q": "Čemu služe kolačići i sesije u web aplikaciji?", "o": ["Da pamte stanje korisnika (npr. prijavu)", "Da ubrzaju CSS animacije", "Da kompajliraju JavaScript", "Da menjaju statusne kodove"], "c": 0, "sol": "<span class=\"res\">Pošto je HTTP bez stanja, kolačić nosi ID sesije koja čuva stanje na serveru.</span>"}], "en": [{"tag": "HTTP methods", "q": "Which HTTP method creates a new resource on the server?", "o": ["POST", "GET", "DELETE", "HEAD"], "c": 0, "sol": "<span class=\"res\">POST creates a resource and changes state: POST /users.</span>"}, {"tag": "Status code", "q": "Which status code means „page not found“?", "o": ["404", "200", "500", "301"], "c": 0, "sol": "<span class=\"res\">404 = client error (4xx): the resource does not exist.</span>"}, {"tag": "Status code", "q": "What does status code 500 indicate?", "o": ["Internal server error", "A successful response", "A redirect", "Forbidden access"], "c": 0, "sol": "<span class=\"res\">5xx = server error; 500 is a generic internal error.</span>"}, {"tag": "DOM", "q": "What is the DOM?", "o": ["A tree of objects representing the HTML document", "A data transfer protocol", "A database in the browser", "A format for styling the page"], "c": 0, "sol": "<span class=\"res\">DOM = Document Object Model; JS uses it to read and change the HTML.</span>"}, {"tag": "HTTP", "q": "Which property best describes the HTTP protocol?", "o": ["Stateless", "Always encrypted", "Keeps state between requests", "Works only locally"], "c": 0, "sol": "<span class=\"res\">HTTP is stateless; sessions/cookies remember the user.</span>"}, {"tag": "REST and JSON", "q": "In which format does a REST API most often exchange data?", "o": ["JSON", "EXE", "MP3", "CSS"], "c": 0, "sol": "<span class=\"res\">JSON is a lightweight text key–value format, ideal for APIs.</span>"}, {"tag": "Security", "q": "How do we best defend against XSS attacks?", "o": ["By sanitizing and escaping user input", "By increasing the font size", "By using only the GET method", "By disabling CSS"], "c": 0, "sol": "<span class=\"res\">Never trust input: escape output and sanitize content before display.</span>"}, {"tag": "Idempotency", "q": "Which method is „safe“ and idempotent (repeating changes nothing)?", "o": ["GET", "POST", "PATCH", "CONNECT"], "c": 0, "sol": "<span class=\"res\">GET only reads — repeating does not change server state.</span>"}, {"tag": "Cookies and sessions", "q": "What are cookies and sessions for in a web app?", "o": ["To remember user state (e.g. login)", "To speed up CSS animations", "To compile JavaScript", "To change status codes"], "c": 0, "sol": "<span class=\"res\">Since HTTP is stateless, the cookie carries a session id that holds state on the server.</span>"}], "de": [{"tag": "HTTP-Methoden", "q": "Welche HTTP-Methode erstellt eine neue Ressource?", "o": ["POST", "GET", "DELETE", "HEAD"], "c": 0, "sol": "<span class=\"res\">POST erstellt eine Ressource und ändert den Zustand: POST /users.</span>"}, {"tag": "Statuscode", "q": "Welcher Statuscode bedeutet „Seite nicht gefunden“?", "o": ["404", "200", "500", "301"], "c": 0, "sol": "<span class=\"res\">404 = Client-Fehler (4xx): Ressource existiert nicht.</span>"}, {"tag": "Statuscode", "q": "Was bedeutet Statuscode 500?", "o": ["Interner Serverfehler", "Erfolgreiche Antwort", "Weiterleitung", "Zugriff verboten"], "c": 0, "sol": "<span class=\"res\">5xx = Serverfehler; 500 ist ein allgemeiner interner Fehler.</span>"}, {"tag": "DOM", "q": "Was ist das DOM?", "o": ["Ein Objektbaum, der das HTML-Dokument darstellt", "Ein Datenübertragungsprotokoll", "Eine Datenbank im Browser", "Ein Format zum Stylen der Seite"], "c": 0, "sol": "<span class=\"res\">DOM = Document Object Model; JS nutzt es, um das HTML zu lesen und zu ändern.</span>"}, {"tag": "HTTP", "q": "Welche Eigenschaft beschreibt HTTP am besten?", "o": ["Zustandslos", "Immer verschlüsselt", "Hält Zustand zwischen Anfragen", "Funktioniert nur lokal"], "c": 0, "sol": "<span class=\"res\">HTTP ist zustandslos; Sitzungen/Cookies merken den Nutzer.</span>"}, {"tag": "REST und JSON", "q": "In welchem Format tauscht eine REST-API meist Daten aus?", "o": ["JSON", "EXE", "MP3", "CSS"], "c": 0, "sol": "<span class=\"res\">JSON ist ein leichtes textuelles Schlüssel-Wert-Format, ideal für APIs.</span>"}, {"tag": "Sicherheit", "q": "Wie wehrt man XSS-Angriffe am besten ab?", "o": ["Durch Sanitisieren und Escapen der Eingaben", "Durch Vergrößern der Schrift", "Durch Nutzung nur der GET-Methode", "Durch Deaktivieren von CSS"], "c": 0, "sol": "<span class=\"res\">Traue Eingaben nie: Ausgabe escapen und Inhalt vor der Anzeige bereinigen.</span>"}, {"tag": "Idempotenz", "q": "Welche Methode ist „sicher“ und idempotent (Wiederholen ändert nichts)?", "o": ["GET", "POST", "PATCH", "CONNECT"], "c": 0, "sol": "<span class=\"res\">GET liest nur — Wiederholen ändert den Serverzustand nicht.</span>"}, {"tag": "Cookies und Sitzungen", "q": "Wozu dienen Cookies und Sitzungen in einer Web-App?", "o": ["Um den Nutzerzustand zu merken (z. B. Anmeldung)", "Um CSS-Animationen zu beschleunigen", "Um JavaScript zu kompilieren", "Um Statuscodes zu ändern"], "c": 0, "sol": "<span class=\"res\">Da HTTP zustandslos ist, trägt das Cookie eine Sitzungs-ID, die den Zustand am Server hält.</span>"}], "fr": [{"tag": "Méthodes HTTP", "q": "Quelle méthode HTTP crée une nouvelle ressource ?", "o": ["POST", "GET", "DELETE", "HEAD"], "c": 0, "sol": "<span class=\"res\">POST crée une ressource et modifie l'état : POST /users.</span>"}, {"tag": "Code de statut", "q": "Quel code de statut signifie « page introuvable » ?", "o": ["404", "200", "500", "301"], "c": 0, "sol": "<span class=\"res\">404 = erreur client (4xx) : la ressource n'existe pas.</span>"}, {"tag": "Code de statut", "q": "Que signifie le code 500 ?", "o": ["Erreur interne du serveur", "Réponse réussie", "Redirection", "Accès interdit"], "c": 0, "sol": "<span class=\"res\">5xx = erreur serveur ; 500 est une erreur interne générique.</span>"}, {"tag": "DOM", "q": "Qu'est-ce que le DOM ?", "o": ["Un arbre d'objets représentant le document HTML", "Un protocole de transfert de données", "Une base de données dans le navigateur", "Un format pour styliser la page"], "c": 0, "sol": "<span class=\"res\">DOM = Document Object Model ; JS l'utilise pour lire et modifier le HTML.</span>"}, {"tag": "HTTP", "q": "Quelle propriété décrit le mieux HTTP ?", "o": ["Sans état", "Toujours chiffré", "Garde l'état entre requêtes", "Fonctionne seulement en local"], "c": 0, "sol": "<span class=\"res\">HTTP est sans état ; sessions/cookies mémorisent l'utilisateur.</span>"}, {"tag": "REST et JSON", "q": "Dans quel format une API REST échange-t-elle le plus souvent les données ?", "o": ["JSON", "EXE", "MP3", "CSS"], "c": 0, "sol": "<span class=\"res\">JSON est un format texte clé–valeur léger, idéal pour les API.</span>"}, {"tag": "Sécurité", "q": "Comment se défendre au mieux contre les attaques XSS ?", "o": ["En assainissant et échappant les entrées", "En augmentant la taille de police", "En n'utilisant que GET", "En désactivant le CSS"], "c": 0, "sol": "<span class=\"res\">Ne fais jamais confiance aux entrées : échappe la sortie et assainis le contenu.</span>"}, {"tag": "Idempotence", "q": "Quelle méthode est « sûre » et idempotente (répéter ne change rien) ?", "o": ["GET", "POST", "PATCH", "CONNECT"], "c": 0, "sol": "<span class=\"res\">GET ne fait que lire — répéter ne change pas l'état du serveur.</span>"}, {"tag": "Cookies et sessions", "q": "À quoi servent cookies et sessions dans une app web ?", "o": ["Pour mémoriser l'état de l'utilisateur (ex. connexion)", "Pour accélérer les animations CSS", "Pour compiler le JavaScript", "Pour changer les codes de statut"], "c": 0, "sol": "<span class=\"res\">HTTP étant sans état, le cookie porte un id de session qui garde l'état sur le serveur.</span>"}], "es": [{"tag": "Métodos HTTP", function mathTT(x){return x
 .replace(/<sup>([^<]*)<\/sup>/g,'^{$1}')
 .replace(/<sub>([^<]*)<\/sub>/g,'_{$1}')
 .replace(/¹/g,'^{1}').replace(/²/g,'^{2}').replace(/³/g,'^{3}')
 .replace(/⁰/g,'^{0}').replace(/⁴/g,'^{4}').replace(/⁵/g,'^{5}').replace(/⁶/g,'^{6}').replace(/⁷/g,'^{7}').replace(/⁸/g,'^{8}').replace(/⁹/g,'^{9}').replace(/ⁿ/g,'^{n}')
 .replace(/₁/g,'_{1}').replace(/₂/g,'_{2}').replace(/₃/g,'_{3}').replace(/ₙ/g,'_{n}').replace(/ᵢ/g,'_{i}')
 .replace(/−/g,'-').replace(/·/g,' \\cdot ').replace(/×/g,' \\times ').replace(/′/g,"'")
 .replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();}
function mathBmat(inner){var rows=inner.split(';').map(function(r){return r.trim().split(/[\s,]+/).filter(Boolean).map(function(c){return mathTT(c);}).join(' & ');});return '\\begin{bmatrix}'+rows.join(' \\\\ ')+'\\end{bmatrix}';}
function mathLegacy(h){
 h=h.replace(/ϕ/g,'φ');
 h=h.replace(/√\s*<span class="rt">([\s\S]*?)<\/span>/g,function(_,g){return '\\(\\sqrt{'+mathTT(g)+'}\\)';});

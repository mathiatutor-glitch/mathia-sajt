→a) f(x) = ±∞; Waagrechte Asymptote: lim(x→±∞) f(x) = b", "fr": "Asymptote verticale : lim(x→a) f(x) = ±∞ ; Asymptote horizontale : lim(x→±∞) f(x) = b", "es": "Asíntota vertical: lim(x→a) f(x) = ±∞; Asíntota horizontal: lim(x→±∞) f(x) = b", "it": "Asintoto verticale: lim(x→a) f(x) = ±∞; Asintoto orizzontale: lim(x→±∞) f(x) = b", "ru": "Вертикальная асимптота: lim(x→a) f(x) = ±∞; Горизонтальная асимптота: lim(x→±∞) f(x) = b", "pt": "Assíntota vertical: lim(x→a) f(x) = ±∞; Assíntota horizontal: lim(x→±∞) f(x) = b"}], "remember": {"sr": "Redosled je ključan: domen → nule i znak → asimptote → f' (monotonost, ekstremi) → f'' (konveksnost, prevoji) → grafik.", "en": "Order matters: domain → zeros and sign → asymptotes → f' (monotonicity, extrema) → f'' (convexity, inflection) → graph.", "de": "Die Reihenfolge ist entscheidend: Definitionsbereich → Nullstellen und Vorzeichen → Asymptoten → f' (Monotonie, Extrema) → f'' (Konvexität, Wendepunkte) → Graph.", "fr": "L'ordre est essentiel : domaine → zéros et signe → asymptotes → f' (monotonie, extrema) → f'' (convexité, inflexions) → graphe.", "es": "El orden es clave: dominio → ceros y signo → asíntotas → f' (monotonía, extremos) → f'' (convexidad, inflexiones) → gráfica.", "it": "L'ordine è fondamentale: dominio → zeri e segno → asintoti → f' (monotonia, estremi) → f'' (convessità, flessi) → grafico.", "ru": "Порядок важен: область определения → нули и знак → асимптоты → f' (монотонность, экстремумы) → f'' (выпуклость, перегибы) → график.", "pt": "A ordem é essencial: domínio → zeros e sinal → assíntotas → f' (monotonia, extremos) → f'' (convexidade, inflexões) → gráfico."}, "problem": {"statement": {"sr": "Ispitati tok i nacrtati grafik funkcije f(x) = x³ − 3x.", "en": "Analyze and sketch the graph of the function f(x) = x³ − 3x.", "de": "Untersuche die Funktion f(x) = x³ − 3x und zeichne ihren Graphen.", "fr": "Étudier et tracer le graphe de la fonction f(x) = x³ − 3x.", "es": "Estudiar y trazar la gráfica de la función f(x) = x³ − 3x.", "it": "Studiare e tracciare il grafico della funzione f(x) = x³ − 3x.", "ru": "Исследовать функцию f(x) = x³ − 3x и построить её график.", "pt": "Estudar e esboçar o gráfico da função f(x) = x³ − 3x."}, "steps": [{"sr": "Domen: D = ℝ (funkcija je polinom). Funkcija je neparna jer je f(−x) = −f(x), pa je grafik simetričan u odnosu na koordinatni početak.", "en": "Domain: D = ℝ (the function is a polynomial). The function is odd since f(−x) = −f(x), so its graph is symmetric about the origin.", "de": "Definitionsbereich: D = ℝ (die Funktion ist ein Polynom). Die Funktion ist ungerade, da f(−x) = −f(x), also ist der Graph punktsymmetrisch zum Ursprung.", "fr": "Domaine : D = ℝ (la fonction est un polynôme). La fonction est impaire car f(−x) = −f(x), donc son graphe est symétrique par rapport à l'origine.", "es": "Dominio: D = ℝ (la función es un polinomio). La función es impar porque f(−x) = −f(x), por lo que su gráfica es simétrica respecto al origen.", "it": "Dominio: D = ℝ (la funzione è un polinomio). La funzione è dispari poiché f(−x) = −f(x), quindi il grafico è simmetrico rispetto all'origine.", "ru": "Область определения: D = ℝ (функция является многочленом). Функция нечётная, так как f(−x) = −f(x), поэтому её график симметричен относительно начала координат.", "pt": "Domínio: D = ℝ (a função é um polinómio). A função é ímpar, pois f(−x) = −f(x), logo o gráfico é simétrico em relação à origem."}, {"sr": "f'(x) = 3x² − 3. Iz f'(x) = 0 sledi x = −1 ili x = 1. Funkcija raste za x < −1 i x > 1, a opada za −1 < x < 1. Lokalni maksimum: f(−1) = 2. Lokalni minimum: f(1) = −2.", "en": "f'(x) = 3x² − 3. From f'(x) = 0 we get x = −1 or x = 1. The function increases for x < −1 and x > 1, and decreases for −1 < x < 1. Local maximum: f(−1) = 2. Local minimum: f(1) = −2.", "de": "f'(x) = 3x² − 3. Aus f'(x) = 0 folgt x = −1 oder x = 1. Die Funktion wächst für x < −1 und x > 1 und fällt für −1 < x < 1. Lokales Maximum: f(−1) = 2. Lokales Minimum: f(1) = −2.", "fr": "f'(x) = 3x² − 3. De f'(x) = 0 on tire x = −1 ou x = 1. La fonction croît pour x < −1 et x > 1, et décroît pour −1 < x < 1. Maximum local : f(−1) = 2. Minimum local : f(1) = −2.", "es": "f'(x) = 3x² − 3. De f'(x) = 0 se obtiene x = −1 o x = 1. La función crece para x < −1 y x > 1, y decrece para −1 < x < 1. Máximo local: f(−1) = 2. Mínimo local: f(1) = −2.", "it": "f'(x) = 3x² − 3. Da f'(x) = 0 si ottiene x = −1 oppure x = 1. La funzione cresce per x < −1 e x > 1, decresce per −1 < x < 1. Massimo locale: f(−1) = 2. Minimo locale: f(1) = −2.", "ru": "f'(x) = 3x² − 3. Из f'(x) = 0 получаем x = −1 или x = 1. Функция возрастает при x < −1 и x > 1, убывает при −1 < x < 1. Локальный максимум: f(−1) = 2. Локальный минимум: f(1) = −2.", "pt": "f'(x) = 3x² − 3. De f'(x) = 0 obtém-se x = −1 ou x = 1. A função cresce para x < −1 e x > 1, e decresce para −1 < x < 1. Máximo local: f(−1) = 2. Mínimo local: f(1) = −2."}, {"sr": "f''(x) = 6x. Iz f''(x) = 0 sledi x = 0. Funkcija je konkavna za x < 0, a konveksna za x > 0, pa je (0, 0) prevojna tačka.", "en": "f''(x) = 6x. From f''(x) = 0 we get x = 0. The function is concave for x < 0 and convex for x > 0, so (0, 0) is an inflection point.", "de": "f''(x) = 6x. Aus f''(x) = 0 folgt x = 0. Die Funktion ist konkav für x < 0 und konvex für x > 0, also ist (0, 0) ein Wendepunkt.", "fr": "f''(x) = 6x. De f''(x) = 0 on tire x = 0. La fonction est concave pour x < 0 et convexe pour x > 0, donc (0, 0) est un point d'inflexion.", "es": "f''(x) = 6x. De f''(x) = 0 se obtiene x = 0. La función es cóncava para x < 0 y convexa para x > 0, por lo que (0, 0) es un punto de inflexión.", "it": "f''(x) = 6x. Da f''(x) = 0 si ottiene x = 0. La funzione è concava per x < 0 e convessa per x > 0, quindi (0, 0) è un punto di flesso.", "ru": "f''(x) = 6x. Из f''(x) = 0 получаем x = 0. Функция выпукла вверх при x < 0 и выпукла вниз при x > 0, поэтому (0, 0) — точка перегиба.", "pt": "f''(x) = 6x. De f''(x) = 0 obtém-se x = 0. A função é côncava para x < 0 e convexa para x > 0, logo (0, 0) é um ponto de inflexão."}, {"sr": "Kako je f polinom, nema asimptota. Grafik prolazi kroz tačke (−1, 2), (0, 0) i (1, −2) i ima oblik tipične kubne funkcije.", "en": "Since f is a polynomial, there are no asymptotes. The graph passes through (−1, 2), (0, 0) and (1, −2), showing the typical shape of a cubic function.", "de": "Da f ein Polynom ist, gibt es keine Asymptoten. Der Graph verläuft durch (−1, 2), (0, 0) und (1, −2) und zeigt die typische Form einer kubischen Funktion.", "fr": "Comme f est un polynôme, il n'y a pas d'asymptotes. Le graphe passe par (−1, 2), (0, 0) et (1, −2), montrant la forme typique d'une fonction cubique.", "es": "Como f es un polinomio, no tiene asíntotas. La gráfica pasa por (−1, 2), (0, 0) y (1, −2), mostrando la forma típica de una función cúbica.", "it": "Poiché f è un polinomio, non ha asintoti. Il grafico passa per (−1, 2), (0, 0) e (1, −2), mostrando la forma tipica di una funzione cubica.", "ru": "Так как f — многочлен, асимптот нет. График проходит через точки (−1, 2), (0, 0) и (1, −2), имея типичную форму кубической функции.", "pt": "Como f é um polinómio, não tem assíntotas. O gráfico passa por (−1, 2), (0, 0) e (1, −2), mostrando a forma típica de uma função cúbica."}]}}, {"name": {"sr": "Neodređeni integral", "en": "Indefinite Integral", "de": "Unbestimmtes Integral", "fr": "Intégrale indéfinie", "es": "Integral indefinida", "it": "Integrale indefinito", "ru": "Неопределённый интеграл", "pt": "Integral indefinida"}, "theory": {"sr": "<b>Neodređeni integral</b> funkcije f(x) je skup svih njenih primitivnih funkcija: ∫f(x)dx = F(x) + C, gde je F'(x) = f(x), a C proizvoljna konstanta. Integracija je inverzna operacija diferenciranju. Osnovne metode integracije su: direktna integracija pomoću tablice, metoda smene (supstitucije) i parcijalna integracija.", "en": "<b>The indefinite integral</b> of a function f(x) is the set of all its antiderivatives: ∫f(x)dx = F(x) + C, where F'(x) = f(x) and C is an arbitrary constant. Integration is the inverse operation of differentiation. The basic integration methods are: direct integration using the table of integrals, the substitution method, and integration by parts.", "de": "<b>Das unbestimmte Integral</b> einer Funktion f(x) ist die Menge aller ihrer Stammfunktionen: ∫f(x)dx = F(x) + C, wobei F'(x) = f(x) und C eine beliebige Konstante ist. Die Integration ist die Umkehroperation der Differentiation. Die grundlegenden Integrationsmethoden sind: direkte Integration mithilfe der Integraltafel, die Substitutionsmethode und die partielle Integration.", "fr": "<b>L'intégrale indéfinie</b> d'une fonction f(x) est l'ensemble de ses primitives : ∫f(x)dx = F(x) + C, où F'(x) = f(x) et C est une constante arbitraire. L'intégration est l'opération inverse de la dérivation. Les méthodes de base sont : l'intégration directe à l'aide du tableau des primitives, le changement de variable (substitution) et l'intégration par parties.", "es": "<b>La integral indefinida</b> de una función f(x) es el conjunto de todas sus primitivas: ∫f(x)dx = F(x) + C, donde F'(x) = f(x) y C es una constante arbitraria. La integración es la operación inversa de la derivación. Los métodos básicos de integración son: integración directa mediante la tabla de integrales, el método de sustitución y la integración por partes.", "it": "<b>L'integrale indefinito</b> di una funzione f(x) è l'insieme di tutte le sue primitive: ∫f(x)dx = F(x) + C, dove F'(x) = f(x) e C è una costante arbitraria. L'integrazione è l'operazione inversa della derivazione. I metodi fondamentali di integrazione sono: integrazione diretta tramite la tabella degli integrali, il metodo di sostituzione e l'integrazione per parti.", "ru": "<b>Неопределённый интеграл</b> функции f(x) — это множество всех её первообразных: ∫f(x)dx = F(x) + C, где F'(x) = f(x), а C — произвольная постоянная. Интегрирование является операцией, обратной дифференцированию. Основные методы интегрирования: непосредственное интегрирование по таблице, метод замены переменной (подстановки) и интегрирование по частям.", "pt": "<b>A integral indefinida</b> de uma função f(x) é o conjunto de todas as suas primitivas: ∫f(x)dx = F(x) + C, onde F'(x) = f(x) e C é uma constante arbitrária. A integração é a operação inversa da derivação. Os métodos básicos de integração são: integração direta usando a tabela de integrais, o método de substituição e a integração por partes."}, "formulas": [{"sr": "∫xⁿ dx = xⁿ⁺¹/(n + 1) + C, n ≠ −1", "en": "∫xⁿ dx = xⁿ⁺¹/(n + 1) + C, n ≠ −1", "de": "∫xⁿ dx = xⁿ⁺¹/(n + 1) + C, n ≠ −1", "fr": "∫xⁿ dx = xⁿ⁺¹/(n + 1) + C, n ≠ −1", "es": "∫xⁿ dx = xⁿ⁺¹/(n + 1) + C, n ≠ −1", "it": "∫xⁿ dx = xⁿ⁺¹/(n + 1) + C, n ≠ −1", "ru": "∫xⁿ dx = xⁿ⁺¹/(n + 1) + C, n ≠ −1", "pt": "∫xⁿ dx = xⁿ⁺¹/(n + 1) + C, n ≠ −1"}, {"sr": "∫(1/x) dx = ln|x| + C; ∫eˣ dx = eˣ + C", "en": "∫(1/x) dx = ln|x| + C; ∫eˣ dx = eˣ + C", "de": "∫(1/x) dx = ln|x| + C; ∫eˣ dx = eˣ + C", "fr": "∫(1/x) dx = ln|x| + C ; ∫eˣ dx = eˣ + C", "es": "∫(1/x) dx = ln|x| + C; ∫eˣ dx = eˣ + C", "it": "∫(1/x) dx = ln|x| + C; ∫eˣ dx = eˣ + C", "ru": "∫(1/x) dx = ln|x| + C; ∫eˣ dx = eˣ + C", "pt": "∫(1/x) dx = ln|x| + C; ∫eˣ dx = eˣ + C"}, {"sr": "Parcijalna integracija: ∫u dv = u·v − ∫v du", "en": "Integration by parts: ∫u dv = u·v − ∫v du", "de": "Partielle Integration: ∫u dv = u·v − ∫v du", "fr": "Intégration par parties : ∫u dv = u·v − ∫v du", "es": "Integración por partes: ∫u dv = u·v − ∫v du", "it": "Integrazione per parti: ∫u dv = u·v − ∫v du", "ru": "Интегрирование по частям: ∫u dv = u·v − ∫v du", "pt": "Integração por partes: ∫u dv = u·v − ∫v du"}], "remember": {"sr": "Provera rešenja: izvod dobijene primitivne funkcije mora dati polaznu funkciju f(x). Ne zaboraviti konstantu C!", "en": "Check your answer: the derivative of the obtained antiderivative must give back the original function f(x). Never forget the constant C!", "de": "Kontrolliere das Ergebnis: Die Ableitung der gefundenen Stammfunktion muss wieder die ursprüngliche Funktion f(x) ergeben. Die Konstante C nicht vergessen!", "fr": "Vérifie ton résultat : la dérivée de la primitive obtenue doit redonner la fonction de départ f(x). N'oublie jamais la constante C !", "es": "Comprueba el resultado: la derivada de la primitiva obtenida debe dar de nuevo la función original f(x). ¡No olvides la constante C!", "it": "Verifica il risultato: la derivata della primitiva ottenuta deve ridare la funzione di partenza f(x). Non dimenticare mai la costante C!", "ru": "Проверка: производная найденной первообразной должна снова дать исходную функцию f(x). Не забывай постоянную C!", "pt": "Verifica o resultado: a derivada da primitiva obtida deve dar novamente a função original f(x). Nunca esqueças a constante C!"}, "problem": {"statement": {"sr": "Izračunati integral ∫2x·(x² + 1)³ dx metodom smene (supstitucije).", "en": "Calculate the integral ∫2x·(x² + 1)³ dx using the substitution method.", "de": "Berechne das Integral ∫2x·(x² + 1)³ dx mit der Substitutionsmethode.", "fr": "Calculer l'intégrale ∫2x·(x² + 1)³ dx par la méthode de substitution (changement de variable).", "es": "Calcular la integral ∫2x·(x² + 1)³ dx mediante el método de sustitución.", "it": "Calcolare l'integrale ∫2x·(x² + 1)³ dx con il metodo di sostituzione.", "ru": "Вычислить интеграл ∫2x·(x² + 1)³ dx методом замены переменной (подстановки).", "pt": "Calcular o integral ∫2x·(x² + 1)³ dx pelo método de substituição."}, "steps": [{"sr": "Uvodimo smenu t = x² + 1. Tada je dt = 2x dx, što se tačno poklapa sa delom podintegralnog izraza.", "en": "Introduce the substitution t = x² + 1. Then dt = 2x dx, which matches exactly the remaining part of the integrand.", "de": "Wir führen die Substitution t = x² + 1 ein. Dann ist dt = 2x dx, was genau dem übrigen Teil des Integranden entspricht.", "fr": "On introduit le changement de variable t = x² + 1. Alors dt = 2x dx, ce qui correspond exactement au reste de l'intégrande.", "es": "Introducimos la sustitución t = x² + 1. Entonces dt = 2x dx, que coincide exactamente con el resto del integrando.", "it": "Introduciamo la sostituzione t = x² + 1. Allora dt = 2x dx, che corrisponde esattamente al resto della funzione integranda.", "ru": "Вводим замену t = x² + 1. Тогда dt = 2x dx, что точно соответствует оставшейся части подынтегрального выражения.", "pt": "Introduzimos a substituição t = x² + 1. Então dt = 2x dx, o que corresponde exatamente ao resto do integrando."}, {"sr": "Integral se svodi na ∫t³ dt.", "en": "The integral reduces to ∫t³ dt.", "de": "Das Integral wird zu ∫t³ dt.", "fr": "L'intégrale devient ∫t³ dt.", "es": "La integral se reduce a ∫t³ dt.", "it": "L'integrale si riduce a ∫t³ dt.", "ru": "Интеграл сводится к ∫t³ dt.", "pt": "O integral reduz-se a ∫t³ dt."}, {"sr": "∫t³ dt = t⁴/4 + C.", "en": "∫t³ dt = t⁴/4 + C.", "de": "∫t³ dt = t⁴/4 + C.", "fr": "∫t³ dt = t⁴/4 + C.", "es": "∫t³ dt = t⁴/4 + C.", "it": "∫t³ dt = t⁴/4 + C.", "ru": "∫t³ dt = t⁴/4 + C.", "pt": "∫t³ dt = t⁴/4 + C."}, {"sr": "Vraćamo smenu t = x² + 1, pa je konačno rešenje: ∫2x·(x² + 1)³ dx = (x² + 1)⁴/4 + C.", "en": "Return to the original variable, t = x² + 1, giving the final result: ∫2x·(x² + 1)³ dx = (x² + 1)⁴/4 + C.", "de": "Rücksubstitution t = x² + 1 liefert das Endergebnis: ∫2x·(x² + 1)³ dx = (x² + 1)⁴/4 + C.", "fr": "En revenant à la variable initiale t = x² + 1, on obtient le résultat final : ∫2x·(x² + 1)³ dx = (x² + 1)⁴/4 + C.", "es": "Volviendo a la variable original t = x² + 1, se obtiene el resultado final: ∫2x·(x² + 1)³ dx = (x² + 1)⁴/4 + C.", "it": "Tornando alla variabile originale t = x² + 1, si ottiene il risultato finale: ∫2x·(x² + 1)³ dx = (x² + 1)⁴/4 + C.", "ru": "Возвращаясь к переменной t = x² + 1, получаем окончательный результат: ∫2x·(x² + 1)³ dx = (x² + 1)⁴/4 + C.", "pt": "Voltando à variável original t = x² + 1, obtemos o resultado final: ∫2x·(x² + 1)³ dx = (x² + 1)⁴/4 + C."}]}}, {"name": {"sr": "Određeni integral i primene", "en": "Definite Integral and Applications", "de": "Bestimmtes Integral und Anwendungen", "fr": "Intégrale définie et applications", "es": "Integral definida y aplicaciones", "it": "Integrale definito e applicazioni", "ru": "Определённый интеграл и его применения", "pt": "Integral definida e aplicações"}, "theory": {"sr": "<b>Određeni integral</b> funkcije f(x) na intervalu [a, b] označava se sa ∫[a,b] f(x)dx i računa se pomoću Njutn-Lajbnicove formule: ∫[a,b] f(x)dx = F(b) − F(a), gde je F primitivna funkcija od f. Geometrijski, ako je f(x) ≥ 0 na [a, b], određeni integral predstavlja površinu figure ograničene grafikom funkcije, x-osom i pravama x = a i x = b. Određeni integral se koristi i za izračunavanje površine između dve krive, kao i zapremine obrtnih tela.", "en": "<b>The definite integral</b> of a function f(x) on the interval [a, b] is denoted ∫[a,b] f(x)dx and is computed using the Newton–Leibniz formula: ∫[a,b] f(x)dx = F(b) − F(a), where F is an antiderivative of f. Geometrically, if f(x) ≥ 0 on [a, b], the definite integral represents the area of the region bounded by the graph of the function, the x-axis, and the lines x = a and x = b. The definite integral is also used to compute the area between two curves and the volume of solids of revolution.", "de": "<b>Das bestimmte Integral</b> einer Funktion f(x) auf dem Intervall [a, b] wird mit ∫[a,b] f(x)dx bezeichnet und mithilfe der Newton-Leibniz-Formel berechnet: ∫[a,b] f(x)dx = F(b) − F(a), wobei F eine Stammfunktion von f ist. Geometrisch stellt das bestimmte Integral, wenn f(x) ≥ 0 auf [a, b], den Flächeninhalt der Fläche dar, die vom Graphen der Funktion, der x-Achse und den Geraden x = a und x = b begrenzt wird. Das bestimmte Integral wird auch verwendet, um die Fläche zwischen zwei Kurven sowie das Volumen von Rotationskörpern zu berechnen.", "fr": "<b>L'intégrale définie</b> d'une fonction f(x) sur l'intervalle [a, b] se note ∫[a,b] f(x)dx et se calcule à l'aide de la formule de Newton-Leibniz : ∫[a,b] f(x)dx = F(b) − F(a), où F est une primitive de f. Géométriquement, si f(x) ≥ 0 sur [a, b], l'intégrale définie représente l'aire de la région délimitée par le graphe de la fonction, l'axe des x et les droites x = a et x = b. L'intégrale définie sert aussi à calculer l'aire entre deux courbes et le volume des solides de révolution.", "es": "<b>La integral definida</b> de una función f(x) en el intervalo [a, b] se denota ∫[a,b] f(x)dx y se calcula mediante la fórmula de Newton-Leibniz: ∫[a,b] f(x)dx = F(b) − F(a), donde F es una primitiva de f. Geométricamente, si f(x) ≥ 0 en [a, b], la integral definida representa el área de la región limitada por la gráfica de la función, el eje x y las rectas x = a y x = b. La integral definida también se usa para calcular el área entre dos curvas y el volumen de sólidos de revolución.", "it": "<b>L'integrale definito</b> di una funzione f(x) sull'intervallo [a, b] si indica con ∫[a,b] f(x)dx e si calcola con la formula di Newton-Leibniz: ∫[a,b] f(x)dx = F(b) − F(a), dove F è una primitiva di f. Geometricamente, se f(x) ≥ 0 su [a, b], l'integrale definito rappresenta l'area della regione delimitata dal grafico della funzione, dall'asse x e dalle rette x = a e x = b. L'integrale definito si usa anche per calcolare l'area tra due curve e il volume dei solidi di rotazione.", "ru": "<b>Определённый интеграл</b> функции f(x) на отрезке [a, b] обозначается ∫[a,b] f(x)dx и вычисляется по формуле Ньютона-Лейбница: ∫[a,b] f(x)dx = F(b) − F(a), где F — первообразная функции f. Геометрически, если f(x) ≥ 0 на [a, b], определённый интеграл представляет площадь фигуры, ограниченной графиком функции, осью x и прямыми x = a и x = b. Определённый интеграл также используется для вычисления площади между двумя кривыми и объёма тел вращения.", "pt": "<b>A integral definida</b> de uma função f(x) no intervalo [a, b] denota-se ∫[a,b] f(x)dx e calcula-se pela fórmula de Newton-Leibniz: ∫[a,b] f(x)dx = F(b) − F(a), onde F é uma primitiva de f. Geometricamente, se f(x) ≥ 0 em [a, b], a integral definida representa a área da região limitada pelo gráfico da função, o eixo x e as retas x = a e x = b. A integral definida também é usada para calcular a área entre duas curvas e o volume de sólidos de revolução."}, "formulas": [{"sr": "Njutn-Lajbnicova formula: ∫[a,b] f(x) dx = F(b) − F(a)", "en": "Newton–Leibniz formula: ∫[a,b] f(x) dx = F(b) − F(a)", "de": "Newton-Leibniz-Formel: ∫[a,b] f(x) dx = F(b) − F(a)", "fr": "Formule de Newton-Leibniz : ∫[a,b] f(x) dx = F(b) − F(a)", "es": "Fórmula de Newton-Leibniz: ∫[a,b] f(x) dx = F(b) − F(a)", "it": "Formula di Newton-Leibniz: ∫[a,b] f(x) dx = F(b) − F(a)", "ru": "Формула Ньютона-Лейбница: ∫[a,b] f(x) dx = F(b) − F(a)", "pt": "Fórmula de Newton-Leibniz: ∫[a,b] f(x) dx = F(b) − F(a)"}, {"sr": "Površina figure: P = ∫[a,b] f(x) dx (f(x) ≥ 0); između krivih: P = ∫[a,b] |f(x) − g(x)| dx", "en": "Area: P = ∫[a,b] f(x) dx (f(x) ≥ 0); between two curves: P = ∫[a,b] |f(x) − g(x)| dx", "de": "Flächeninhalt: P = ∫[a,b] f(x) dx (f(x) ≥ 0); zwischen zwei Kurven: P = ∫[a,b] |f(x) − g(x)| dx", "fr": "Aire : P = ∫[a,b] f(x) dx (f(x) ≥ 0) ; entre deux courbes : P = ∫[a,b] |f(x) − g(x)| dx", "es": "Área: P = ∫[a,b] f(x) dx (f(x) ≥ 0); entre dos curvas: P = ∫[a,b] |f(x) − g(x)| dx", "it": "Area: P = ∫[a,b] f(x) dx (f(x) ≥ 0); tra due curve: P = ∫[a,b] |f(x) − g(x)| dx", "ru": "Площадь: P = ∫[a,b] f(x) dx (f(x) ≥ 0); между двумя кривыми: P = ∫[a,b] |f(x) − g(x)| dx", "pt": "Área: P = ∫[a,b] f(x) dx (f(x) ≥ 0); entre duas curvas: P = ∫[a,b] |f(x) − g(x)| dx"}, {"sr": "Zapremina obrtnog tela: V = π·∫[a,b] [f(x)]² dx", "en": "Volume of a solid of revolution: V = π·∫[a,b] [f(x)]² dx", "de": "Volumen eines Rotationskörpers: V = π·∫[a,b] [f(x)]² dx", "fr": "Volume d'un solide de révolution : V = π·∫[a,b] [f(x)]² dx", "es": "Volumen de un sólido de revolución: V = π·∫[a,b] [f(x)]² dx", "it": "Volume di un solido di rotazione: V = π·∫[a,b] [f(x)]² dx", "ru": "Объём тела вращения: V = π·∫[a,b] [f(x)]² dx", "pt": "Volume de um sólido de revolução: V = π·∫[a,b] [f(x)]² dx"}], "remember": {"sr": "Pre računanja površine proveriti znak funkcije na intervalu – ako f(x) menja znak, integral se deli na delove ili se koristi apsolutna vrednost.", "en": "Before computing an area, check the sign of the function on the interval – if f(x) changes sign, split the integral into parts or use the absolute value.", "de": "Vor der Flächenberechnung das Vorzeichen der Funktion im Intervall prüfen – wechselt f(x) das Vorzeichen, das Integral in Teile zerlegen oder den Betrag verwenden.", "fr": "Avant de calculer une aire, vérifier le signe de la fonction sur l'intervalle – si f(x) change de signe, décomposer l'intégrale ou utiliser la valeur absolue.", "es": "Antes de calcular un área, comprobar el signo de la función en el intervalo – si f(x) cambia de signo, dividir la integral en partes o usar el valor absoluto.", "it": "Prima di calcolare un'area, controllare il segno della funzione nell'intervallo – se f(x) cambia segno, suddividere l'integrale o usare il valore assoluto.", "ru": "Перед вычислением площади проверь знак функции на отрезке — если f(x) меняет знак, раздели интеграл на части или используй модуль.", "pt": "Antes de calcular uma área, verificar o sinal da função no intervalo – se f(x) mudar de sinal, dividir o integral em partes ou usar o valor absoluto."}, "problem": {"statement": {"sr": "Izračunati površinu figure ograničene grafikom funkcije f(x) = 4 − x² i x-osom.", "en": "Find the area of the region bounded by the graph of f(x) = 4 − x² and the x-axis.", "de": "Berechne den Flächeninhalt der Fläche, die vom Graphen von f(x) = 4 − x² und der x-Achse begrenzt wird.", "fr": "Calculer l'aire de la figure délimitée par le graphe de f(x) = 4 − x² et l'axe des x.", "es": "Calcular el área de la figura limitada por la gráfica de f(x) = 4 − x² y el eje x.", "it": "Calcolare l'area della figura delimitata dal grafico di f(x) = 4 − x² e dall'asse x.", "ru": "Вычислить площадь фигуры, ограниченной графиком функции f(x) = 4 − x² и осью x.", "pt": "Calcular a área da figura limitada pelo gráfico de f(x) = 4 − x² e pelo eixo x."}, "steps": [{"sr": "Nule funkcije: 4 − x² = 0 daje x = −2 i x = 2 – to su granice integracije.", "en": "Zeros of the function: 4 − x² = 0 gives x = −2 and x = 2 – these are the limits of integration.", "de": "Nullstellen: 4 − x² = 0 ergibt x = −2 und x = 2 – das sind die Integrationsgrenzen.", "fr": "Zéros de la fonction : 4 − x² = 0 donne x = −2 et x = 2 – ce sont les bornes d'intégration.", "es": "Ceros de la función: 4 − x² = 0 da x = −2 y x = 2 – son los límites de integración.", "it": "Zeri della funzione: 4 − x² = 0 dà x = −2 e x = 2 – questi sono gli estremi di integrazione.", "ru": "Нули функции: 4 − x² = 0 даёт x = −2 и x = 2 – это пределы интегрирования.", "pt": "Zeros da função: 4 − x² = 0 dá x = −2 e x = 2 – são os limites de integração."}, {"sr": "Kako je f(x) ≥ 0 na intervalu [−2, 2], površina se računa kao P = ∫[−2,2] (4 − x²) dx.", "en": "Since f(x) ≥ 0 on the interval [−2, 2], the area is P = ∫[−2,2] (4 − x²) dx.", "de": "Da f(x) ≥ 0 auf dem Intervall [−2, 2] ist, gilt für die Fläche P = ∫[−2,2] (4 − x²) dx.", "fr": "Comme f(x) ≥ 0 sur l'intervalle [−2, 2], l'aire est P = ∫[−2,2] (4 − x²) dx.", "es": "Como f(x) ≥ 0 en el intervalo [−2, 2], el área es P = ∫[−2,2] (4 − x²) dx.", "it": "Poiché f(x) ≥ 0 nell'intervallo [−2, 2], l'area è P = ∫[−2,2] (4 − x²) dx.", "ru": "Так как f(x) ≥ 0 на отрезке [−2, 2], площадь равна P = ∫[−2,2] (4 − x²) dx.", "pt": "Como f(x) ≥ 0 no intervalo [−2, 2], a área é P = ∫[−2,2] (4 − x²) dx."}, {"sr": "Primitivna funkcija je F(x) = 4x − x³/3. Tada je P = F(2) − F(−2) = (8 − 8/3) − (−8 + 8/3) = 32/3.", "en": "An antiderivative is F(x) = 4x − x³/3. Then P = F(2) − F(−2) = (8 − 8/3) − (−8 + 8/3) = 32/3.", "de": "Eine Stammfunktion ist F(x) = 4x − x³/3. Dann ist P = F(2) − F(−2) = (8 − 8/3) − (−8 + 8/3) = 32/3.", "fr": "Une primitive est F(x) = 4x − x³/3. Alors P = F(2) − F(−2) = (8 − 8/3) − (−8 + 8/3) = 32/3.", "es": "Una primitiva es F(x) = 4x − x³/3. Entonces P = F(2) − F(−2) = (8 − 8/3) − (−8 + 8/3) = 32/3.", "it": "Una primitiva è F(x) = 4x − x³/3. Allora P = F(2) − F(−2) = (8 − 8/3) − (−8 + 8/3) = 32/3.", "ru": "Первообразная: F(x) = 4x − x³/3. Тогда P = F(2) − F(−2) = (8 − 8/3) − (−8 + 8/3) = 32/3.", "pt": "Uma primitiva é F(x) = 4x − x³/3. Assim, P = F(2) − F(−2) = (8 − 8/3) − (−8 + 8/3) = 32/3."}, {"sr": "Površina figure iznosi P = 32/3 kvadratnih jedinica.", "en": "The area of the region is P = 32/3 square units.", "de": "Der Flächeninhalt beträgt P = 32/3 Flächeneinheiten.", "fr": "L'aire de la figure vaut P = 32/3 unités d'aire.", "es": "El área de la figura es P = 32/3 unidades cuadradas.", "it": "L'area della figura è P = 32/3 unità quadrate.", "ru": "Площадь фигуры составляет P = 32/3 квадратных единиц.", "pt": "A área da figura é P = 32/3 unidades quadradas."}]}}, {"name": {"sr": "Kombinatorika", "en": "Combinatorics", "de": "Kombinatorik", "fr": "Combinatoire", "es": "Combinatoria", "it": "Calcolo combinatorio", "ru": "Комбинаторика", "pt": "Combinatória"}, "theory": {"sr": "<b>Kombinatorika</b> proučava prebrojavanje raspoređivanja i izbora elemenata konačnog skupa. Osnovni pojmovi su: permutacije (broj rasporeda svih n elemenata), varijacije (broj rasporeda k od n elemenata gde je redosled bitan) i kombinacije (broj izbora k od n elemenata gde redosled nije bitan). Faktorijel n! = 1·2·3·...·n predstavlja broj permutacija n različitih elemenata, uz dogovor 0! = 1.", "en": "<b>Combinatorics</b> studies the counting of arrangements and selections of elements of a finite set. The basic concepts are: permutations (the number of arrangements of all n elements), variations/arrangements (the number of ordered selections of k out of n elements, where order matters) and combinations (the number of selections of k out of n elements where order does not matter). The factorial n! = 1·2·3·...·n represents the number of permutations of n distinct elements, with the convention 0! = 1.", "de": "<b>Die Kombinatorik</b> untersucht das Abzählen von Anordnungen und Auswahlen von Elementen einer endlichen Menge. Grundbegriffe sind: Permutationen (Anzahl der Anordnungen aller n Elemente), Variationen (Anzahl der Auswahlen von k aus n Elementen, bei denen die Reihenfolge wichtig ist) und Kombinationen (Anzahl der Auswahlen von k aus n Elementen, bei denen die Reihenfolge keine Rolle spielt). Die Fakultät n! = 1·2·3·...·n gibt die Anzahl der Permutationen von n verschiedenen Elementen an, mit der Vereinbarung 0! = 1.", "fr": "<b>La combinatoire</b> étudie le dénombrement des arrangements et des choix d'éléments d'un ensemble fini. Les notions de base sont : les permutations (nombre d'arrangements de tous les n éléments), les arrangements (nombre de choix ordonnés de k éléments parmi n, où l'ordre compte) et les combinaisons (nombre de choix de k éléments parmi n, où l'ordre ne compte pas). La factorielle n! = 1·2·3·...·n représente le nombre de permutations de n éléments distincts, avec la convention 0! = 1.", "es": "<b>La combinatoria</b> estudia el recuento de disposiciones y selecciones de elementos de un conjunto finito. Los conceptos básicos son: las permutaciones (número de ordenaciones de los n elementos), las variaciones (número de selecciones ordenadas de k entre n elementos, donde el orden importa) y las combinaciones (número de selecciones de k entre n elementos donde el orden no importa). El factorial n! = 1·2·3·...·n representa el número de permutaciones de n elementos distintos, con el convenio 0! = 1.", "it": "<b>Il calcolo combinatorio</b> studia il conteggio delle disposizioni e delle scelte di elementi di un insieme finito. I concetti fondamentali sono: le permutazioni (numero di ordinamenti di tutti gli n elementi), le disposizioni (numero di scelte ordinate di k elementi su n, dove l'ordine conta) e le combinazioni (numero di scelte di k elementi su n, dove l'ordine non conta). Il fattoriale n! = 1·2·3·...·n rappresenta il numero di permutazioni di n elementi distinti, con la convenzione 0! = 1.", "ru": "<b>Комбинаторика</b> изучает подсчёт расположений и выборов элементов конечного множества. Основные понятия: перестановки (число расположений всех n элементов), размещения (число упорядоченных выборов k из n элементов, где порядок важен) и сочетания (число выборов k из n элементов, где порядок не важен). Факториал n! = 1·2·3·...·n представляет число перестановок n различных элементов, при этом 0! = 1.", "pt": "<b>A combinatória</b> estuda a contagem de disposições e escolhas de elementos de um conjunto finito. Os conceitos básicos são: as permutações (número de ordenações de todos os n elementos), os arranjos (número de escolhas ordenadas de k entre n elementos, onde a ordem importa) e as combinações (número de escolhas de k entre n elementos onde a ordem não importa). O fatorial n! = 1·2·3·...·n representa o número de permutações de n elementos distintos, com a convenção 0! = 1."}, "formulas": [{"sr": "Permutacije: P(n) = n!", "en": "Permutations: P(n) = n!", "de": "Permutationen: P(n) = n!", "fr": "Permutations : P(n) = n!", "es": "Permutaciones: P(n) = n!", "it": "Permutazioni: P(n) = n!", "ru": "Перестановки: P(n) = n!", "pt": "Permutações: P(n) = n!"}, {"sr": "Varijacije bez ponavljanja: V(n, k) = n!/(n − k)!", "en": "Variations (arrangements) without repetition: V(n, k) = n!/(n − k)!", "de": "Variationen ohne Wiederholung: V(n, k) = n!/(n − k)!", "fr": "Arrangements sans répétition : V(n, k) = n!/(n − k)!", "es": "Variaciones sin repetición: V(n, k) = n!/(n − k)!", "it": "Disposizioni semplici: V(n, k) = n!/(n − k)!", "ru": "Размещения без повторений: V(n, k) = n!/(n − k)!", "pt": "Arranjos sem repetição: V(n, k) = n!/(n − k)!"}, {"sr": "Kombinacije: C(n, k) = n!/(k!·(n − k)!)", "en": "Combinations: C(n, k) = n!/(k!·(n − k)!)", "de": "Kombinationen: C(n, k) = n!/(k!·(n − k)!)", "fr": "Combinaisons : C(n, k) = n!/(k!·(n − k)!)", "es": "Combinaciones: C(n, k) = n!/(k!·(n − k)!)", "it": "Combinazioni: C(n, k) = n!/(k!·(n − k)!)", "ru": "Сочетания: C(n, k) = n!/(k!·(n − k)!)", "pt": "Combinações: C(n, k) = n!/(k!·(n − k)!)"}], "remember": {"sr": "Ključno pitanje: da li je redosled bitan? Ako jeste – varijacije ili permutacije; ako nije – kombinacije.", "en": "Key question: does order matter? If yes – variations or permutations; if no – combinations.", "de": "Die Schlüsselfrage: Kommt es auf die Reihenfolge an? Wenn ja – Variationen oder Permutationen; wenn nein – Kombinationen.", "fr": "Question clé : l'ordre compte-t-il ? Si oui – arrangements ou permutations ; si non – combinaisons.", "es": "Pregunta clave: ¿importa el orden? Si es así – variaciones o permutaciones; si no – combinaciones.", "it": "Domanda chiave: l'ordine conta? Se sì – disposizioni o permutazioni; se no – combinazioni.", "ru": "Ключевой вопрос: важен ли порядок? Если да — размещения или перестановки; если нет — сочетания.", "pt": "Pergunta-chave: a ordem importa? Se sim – arranjos ou permutações; se não – combinações."}, "problem": {"statement": {"sr": "Iz razreda od 15 učenika bira se odbor od 4 učenika. Na koliko načina se to može učiniti?", "en": "A committee of 4 students is to be chosen from a class of 15 students. In how many ways can this be done?", "de": "Aus einer Klasse von 15 Schülern soll ein Ausschuss von 4 Schülern gewählt werden. Auf wie viele Arten ist das möglich?", "fr": "On choisit un comité de 4 élèves parmi une classe de 15 élèves. De combien de façons peut-on le faire ?", "es": "De una clase de 15 alumnos se elige un comité de 4 alumnos. ¿De cuántas formas se puede hacer esto?", "it": "Da una classe di 15 studenti si sceglie un comitato di 4 studenti. In quanti modi si può fare?", "ru": "Из класса, состоящего из 15 учеников, выбирается комитет из 4 учеников. Сколькими способами это можно сделать?", "pt": "De uma turma de 15 alunos escolhe-se uma comissão de 4 alunos. De quantas maneiras isso pode ser feito?"}, "steps": [{"sr": "Redosled izbora članova odbora nije bitan, pa se radi o kombinacijama: broj traženih izbora je C(15, 4).", "en": "The order in which the committee members are chosen does not matter, so this is a combinations problem: the number of ways is C(15, 4).", "de": "Die Reihenfolge der Auswahl der Ausschussmitglieder spielt keine Rolle, es handelt sich also um Kombinationen: Die Anzahl der Möglichkeiten ist C(15, 4).", "fr": "L'ordre de sélection des membres du comité n'a pas d'importance, il s'agit donc de combinaisons : le nombre de choix est C(15, 4).", "es": "El orden de elección de los miembros del comité no importa, por lo que se trata de combinaciones: el número de formas es C(15, 4).", "it": "L'ordine di scelta dei membri del comitato non conta, quindi si tratta di combinazioni: il numero di modi è C(15, 4).", "ru": "Порядок выбора членов комитета не важен, значит, это задача на сочетания: число способов равно C(15, 4).", "pt": "A ordem de escolha dos membros da comissão não importa, portanto trata-se de combinações: o número de maneiras é C(15, 4)."}, {"sr": "C(15, 4) = 15!/(4!·11!)", "en": "C(15, 4) = 15!/(4!·11!)", "de": "C(15, 4) = 15!/(4!·11!)", "fr": "C(15, 4) = 15!/(4!·11!)", "es": "C(15, 4) = 15!/(4!·11!)", "it": "C(15, 4) = 15!/(4!·11!)", "ru": "C(15, 4) = 15!/(4!·11!)", "pt": "C(15, 4) = 15!/(4!·11!)"}, {"sr": "= (15·14·13·12)/(4·3·2·1) = 32760/24 = 1365", "en": "= (15·14·13·12)/(4·3·2·1) = 32760/24 = 1365", "de": "= (15·14·13·12)/(4·3·2·1) = 32760/24 = 1365", "fr": "= (15·14·13·12)/(4·3·2·1) = 32760/24 = 1365", "es": "= (15·14·13·12)/(4·3·2·1) = 32760/24 = 1365", "it": "= (15·14·13·12)/(4·3·2·1) = 32760/24 = 1365", "ru": "= (15·14·13·12)/(4·3·2·1) = 32760/24 = 1365", "pt": "= (15·14·13·12)/(4·3·2·1) = 32760/24 = 1365"}, {"sr": "Odbor od 4 učenika može se izabrati na 1365 načina.", "en": "A committee of 4 students can be chosen in 1365 ways.", "de": "Ein Ausschuss von 4 Schülern kann auf 1365 Arten gewählt werden.", "fr": "Un comité de 4 élèves peut être choisi de 1365 façons.", "es": "Un comité de 4 alumnos se puede elegir de 1365 formas.", "it": "Un comitato di 4 studenti può essere scelto in 1365 modi.", "ru": "Комитет из 4 учеников можно выбрать 1365 способами.", "pt": "Uma comissão de 4 alunos pode ser escolhida de 1365 maneiras."}]}}, {"name": {"sr": "Verovatnoća i statistika", "en": "Probability and Statistics", "de": "Wahrscheinlichkeit und Statistik", "fr": "Probabilités et statistiques", "es": "Probabilidad y estadística", "it": "Probabilità e statistica", "ru": "Вероятность и статистика", "pt": "Probabilidade e estatística"}, "theory": {"sr": "<b>Verovatnoća</b> događaja A u prostoru sa jednako mogućim ishodima računa se kao P(A) = m/n, gde je m broj povoljnih, a n broj svih mogućih ishoda, pri čemu je 0 ≤ P(A) ≤ 1. Za nezavisne događaje verovatnoća da se oba dogode je P(A∩B) = P(A)·P(B). U <b>statistici</b> se skup podataka opisuje merama centralne tendencije (aritmetička sredina, medijana, mod) i merama disperzije (varijansa, standardna devijacija), koje pokazuju koliko su podaci rasuti oko srednje vrednosti.", "en": "<b>The probability</b> of an event A in a sample space with equally likely outcomes is computed as P(A) = m/n, where m is the number of favorable outcomes and n the number of all possible outcomes, with 0 ≤ P(A) ≤ 1. For independent events, the probability that both occur is P(A∩B) = P(A)·P(B). In <b>statistics</b>, a data set is described using measures of central tendency (mean, median, mode) and measures of dispersion (variance, standard deviation), which show how spread out the data are around the mean value.", "de": "<b>Die Wahrscheinlichkeit</b> eines Ereignisses A in einem Ergebnisraum mit gleichwahrscheinlichen Ausgängen wird berechnet als P(A) = m/n, wobei m die Anzahl der günstigen und n die Anzahl aller möglichen Ausgänge ist, mit 0 ≤ P(A) ≤ 1. Für unabhängige Ereignisse gilt für die Wahrscheinlichkeit, dass beide eintreten: P(A∩B) = P(A)·P(B). In der <b>Statistik</b> wird eine Datenmenge durch Lagemaße (arithmetisches Mittel, Median, Modus) und Streuungsmaße (Varianz, Standardabweichung) beschrieben, die zeigen, wie stark die Daten um den Mittelwert streuen.", "fr": "<b>La probabilité</b> d'un événement A dans un univers où les issues sont équiprobables se calcule par P(A) = m/n, où m est le nombre d'issues favorables et n le nombre total d'issues possibles, avec 0 ≤ P(A) ≤ 1. Pour des événements indépendants, la probabilité que les deux se réalisent est P(A∩B) = P(A)·P(B). En <b>statistique</b>, un ensemble de données est décrit par des mesures de tendance centrale (moyenne arithmétique, médiane, mode) et des mesures de dispersion (variance, écart-type), qui indiquent la dispersion des données autour de la valeur moyenne.", "es": "<b>La probabilidad</b> de un suceso A en un espacio muestral con resultados equiprobables se calcula como P(A) = m/n, donde m es el número de casos favorables y n el número total de casos posibles, con 0 ≤ P(A) ≤ 1. Para sucesos independientes, la probabilidad de que ambos ocurran es P(A∩B) = P(A)·P(B). En <b>estadística</b>, un conjunto de datos se describe mediante medidas de tendencia central (media aritmética, mediana, moda) y medidas de dispersión (varianza, desviación típica), que muestran cuán dispersos están los datos alrededor del valor medio.", "it": "<b>La probabilità</b> di un evento A in uno spazio campionario con esiti equiprobabili si calcola come P(A) = m/n, dove m è il numero dei casi favorevoli e n il numero totale dei casi possibili, con 0 ≤ P(A) ≤ 1. Per eventi indipendenti, la probabilità che entrambi si verifichino è P(A∩B) = P(A)·P(B). Nella <b>statistica</b>, un insieme di dati si descrive con misure di tendenza centrale (media aritmetica, mediana, moda) e misure di dispersione (varianza, deviazione standard), che indicano quanto i dati sono dispersi attorno al valore medio.", "ru": "<b>Вероятность</b> события A в пространстве с равновозможными исходами вычисляется как P(A) = m/n, где m — число благоприятных исходов, а n — число всех возможных исходов, при этом 0 ≤ P(A) ≤ 1. Для независимых событий вероятность того, что произойдут оба, равна P(A∩B) = P(A)·P(B). В <b>статистике</b> набор данных описывается мерами центральной тенденции (среднее арифметическое, медиана, мода) и мерами разброса (дисперсия, стандартное отклонение), показывающими, насколько данные рассеяны вокруг среднего значения.", "pt": "<b>A probabilidade</b> de um evento A num espaço amostral com resultados igualmente prováveis calcula-se como P(A) = m/n, onde m é o número de casos favoráveis e n o número total de casos possíveis, com 0 ≤ P(A) ≤ 1. Para eventos independentes, a probabilidade de ambos ocorrerem é P(A∩B) = P(A)·P(B). Na <b>estatística</b>, um conjunto de dados é descrito por medidas de tendência central (média aritmética, mediana, moda) e medidas de dispersão (variância, desvio padrão), que mostram o quanto os dados estão dispersos em torno do valor médio."}, "formulas": [{"sr": "Klasična verovatnoća: P(A) = m/n (m – povoljni, n – mogući ishodi), 0 ≤ P(A) ≤ 1", "en": "Classical probability: P(A) = m/n (m – favorable, n – possible outcomes), 0 ≤ P(A) ≤ 1", "de": "Klassische Wahrscheinlichkeit: P(A) = m/n (m – günstige, n – mögliche Ausgänge), 0 ≤ P(A) ≤ 1", "fr": "Probabilité classique : P(A) = m/n (m – issues favorables, n – issues possibles), 0 ≤ P(A) ≤ 1", "es": "Probabilidad clásica: P(A) = m/n (m – casos favorables, n – casos posibles), 0 ≤ P(A) ≤ 1", "it": "Probabilità classica: P(A) = m/n (m – casi favorevoli, n – casi possibili), 0 ≤ P(A) ≤ 1", "ru": "Классическая вероятность: P(A) = m/n (m — благоприятные, n — все возможные исходы), 0 ≤ P(A) ≤ 1", "pt": "Probabilidade clássica: P(A) = m/n (m – casos favoráveis, n – casos possíveis), 0 ≤ P(A) ≤ 1"}, {"sr": "Nezavisni događaji: P(A∩B) = P(A)·P(B); Zbir događaja: P(A∪B) = P(A) + P(B) − P(A∩B)", "en": "Independent events: P(A∩B) = P(A)·P(B); Union of events: P(A∪B) = P(A) + P(B) − P(A∩B)", "de": "Unabhängige Ereignisse: P(A∩B) = P(A)·P(B); Vereinigung: P(A∪B) = P(A) + P(B) − P(A∩B)", "fr": "Événements indépendants : P(A∩B) = P(A)·P(B) ; Union d'événements : P(A∪B) = P(A) + P(B) − P(A∩B)", "es": "Sucesos independientes: P(A∩B) = P(A)·P(B); Unión de sucesos: P(A∪B) = P(A) + P(B) − P(A∩B)", "it": "Eventi indipendenti: P(A∩B) = P(A)·P(B); Unione di eventi: P(A∪B) = P(A) + P(B) − P(A∩B)", "ru": "Независимые события: P(A∩B) = P(A)·P(B); Объединение событий: P(A∪B) = P(A) + P(B) − P(A∩B)", "pt": "Eventos independentes: P(A∩B) = P(A)·P(B); União de eventos: P(A∪B) = P(A) + P(B) − P(A∩B)"}, {"sr": "Aritmetička sredina: x̄ = Σxᵢ/n; Standardna devijacija: σ = √(Σ(xᵢ − x̄)²/n)", "en": "Mean: x̄ = Σxᵢ/n; Standard deviation: σ = √(Σ(xᵢ − x̄)²/n)", "de": "Arithmetisches Mittel: x̄ = Σxᵢ/n; Standardabweichung: σ = √(Σ(xᵢ − x̄)²/n)", "fr": "Moyenne arithmétique : x̄ = Σxᵢ/n ; Écart-type : σ = √(Σ(xᵢ − x̄)²/n)", "es": "Media aritmética: x̄ = Σxᵢ/n; Desviación típica: σ = √(Σ(xᵢ − x̄)²/n)", "it": "Media aritmetica: x̄ = Σxᵢ/n; Deviazione standard: σ = √(Σ(xᵢ − x̄)²/n)", "ru": "Среднее арифметическое: x̄ = Σxᵢ/n; Стандартное отклонение: σ = √(Σ(xᵢ − x̄)²/n)", "pt": "Média aritmética: x̄ = Σxᵢ/n; Desvio padrão: σ = √(Σ(xᵢ − x̄)²/n)"}], "remember": {"sr": "Uvek proveriti da li su ishodi jednako mogući pre primene formule P(A) = m/n; kod statistike medijana je otpornija na ekstremne vrednosti od aritmetičke sredine.", "en": "Always check that outcomes are equally likely before applying P(A) = m/n; in statistics, the median is more resistant to extreme values than the mean.", "de": "Vor der Anwendung von P(A) = m/n immer prüfen, ob die Ausgänge gleichwahrscheinlich sind; in der Statistik ist der Median widerstandsfähiger gegen Extremwerte als das arithmetische Mittel.", "fr": "Toujours vérifier que les issues sont équiprobables avant d'appliquer P(A) = m/n ; en statistique, la médiane résiste mieux aux valeurs extrêmes que la moyenne.", "es": "Comprueba siempre que los resultados sean equiprobables antes de aplicar P(A) = m/n; en estadística, la mediana es más resistente a los valores extremos que la media.", "it": "Verifica sempre che gli esiti siano equiprobabili prima di applicare P(A) = m/n; in statistica la mediana è più resistente ai valori estremi rispetto alla media.", "ru": "Всегда проверяй, что исходы равновозможны, прежде чем применять P(A) = m/n; в статистике медиана устойчивее к выбросам, чем среднее арифметическое.", "pt": "Verifica sempre se os resultados são igualmente prováveis antes de aplicar P(A) = m/n; em estatística, a mediana é mais resistente a valores extremos do que a média."}, "problem": {"statement": {"sr": "Bacaju se dve igraće kockice. Kolika je verovatnoća da je zbir brojeva koji padnu jednak 7?", "en": "Two dice are rolled. What is the probability that the sum of the numbers rolled equals 7?", "de": "Zwei Würfel werden geworfen. Wie groß ist die Wahrscheinlichkeit, dass die Augensumme gleich 7 ist?", "fr": "On lance deux dés. Quelle est la probabilité que la somme des nombres obtenus soit égale à 7 ?", "es": "Se lanzan dos dados. ¿Cuál es la probabilidad de que la suma de los números obtenidos sea igual a 7?", "it": "Si lanciano due dadi. Qual è la probabilità che la somma dei numeri usciti sia uguale a 7?", "ru": "Бросают две игральные кости. Какова вероятность того, что сумма выпавших чисел равна 7?", "pt": "Lançam-se dois dados. Qual é a probabilidade de a soma dos números obtidos ser igual a 7?"}, "steps": [{"sr": "Ukupan broj mogućih ishoda je n = 6·6 = 36, jer svaka kockica ima 6 strana, a ishodi su uređeni parovi (i, j).", "en": "The total number of possible outcomes is n = 6·6 = 36, since each die has 6 faces and the outcomes are ordered pairs (i, j).", "de": "Die Gesamtzahl der möglichen Ausgänge ist n = 6·6 = 36, da jeder Würfel 6 Seiten hat und die Ausgänge geordnete Paare (i, j) sind.", "fr": "Le nombre total d'issues possibles est n = 6·6 = 36, car chaque dé a 6 faces et les issues sont des couples ordonnés (i, j).", "es": "El número total de resultados posibles es n = 6·6 = 36, ya que cada dado tiene 6 caras y los resultados son pares ordenados (i, j).", "it": "Il numero totale di esiti possibili è n = 6·6 = 36, poiché ogni dado ha 6 facce e gli esiti sono coppie ordinate (i, j).", "ru": "Общее число возможных исходов равно n = 6·6 = 36, так как у каждой кости 6 граней, а исходы представляют собой упорядоченные пары (i, j).", "pt": "O número total de resultados possíveis é n = 6·6 = 36, pois cada dado tem 6 faces e os resultados são pares ordenados (i, j)."}, {"sr": "Povoljni ishodi su parovi čiji je zbir 7: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1), pa je m = 6.", "en": "The favorable outcomes are the pairs whose sum is 7: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1), so m = 6.", "de": "Die günstigen Ausgänge sind die Paare mit der Summe 7: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1), also m = 6.", "fr": "Les issues favorables sont les couples dont la somme est 7 : (1,6), (2,5), (3,4), (4,3), (5,2), (6,1), donc m = 6.", "es": "Los casos favorables son los pares cuya suma es 7: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1), por lo que m = 6.", "it": "Gli esiti favorevoli sono le coppie la cui somma è 7: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1), quindi m = 6.", "ru": "Благоприятные исходы — пары с суммой 7: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1), значит m = 6.", "pt": "Os casos favoráveis são os pares cuja soma é 7: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1), logo m = 6."}, {"sr": "Verovatnoća je P(A) = m/n = 6/36 = 1/6.", "en": "The probability is P(A) = m/n = 6/36 = 1/6.", "de": "Die Wahrscheinlichkeit ist P(A) = m/n = 6/36 = 1/6.", "fr": "La probabilité est P(A) = m/n = 6/36 = 1/6.", "es": "La probabilidad es P(A) = m/n = 6/36 = 1/6.", "it": "La probabilità è P(A) = m/n = 6/36 = 1/6.", "ru": "Вероятность равна P(A) = m/n = 6/36 = 1/6.", "pt": "A probabilidade é P(A) = m/n = 6/36 = 1/6."}, {"sr": "Verovatnoća da je zbir brojeva na kockicama jednak 7 iznosi 1/6.", "en": "The probability that the sum of the two dice equals 7 is 1/6.", "de": "Die Wahrscheinlichkeit, dass die Augensumme der beiden Würfel gleich 7 ist, beträgt 1/6.", "fr": "La probabilité que la somme des deux dés soit égale à 7 est de 1/6.", "es": "La probabilidad de que la suma de los dos dados sea igual a 7 es 1/6.", "it": "La probabilità che la somma dei due dadi sia uguale a 7 è 1/6.", "ru": "Вероятность того, что сумма чисел на костях равна 7, составляет 1/6.", "pt": "A probabilidade de a soma dos dois dados ser igual a 7 é 1/6."}]}}], "C": {"tap": {"sr": "Tapni 👆", "en": "Tap 👆", "de": "Tippen 👆", "fr": "Touche 👆", "es": "Toca 👆", "it": "Tocca 👆", "ru": "Нажми 👆", "pt": "Toca 👆"}, "hint": {"sr": "Tapni karticu da vidiš formule ✨", "en": "Tap a card to see the formulas ✨", "de": "Karte antippen für die Formeln ✨", "fr": "Touche une carte pour voir les formules ✨", "es": "Toca una tarjeta para ver las fórmulas ✨", "it": "Tocca una carta per le formule ✨", "ru": "Нажми на карточку — увидишь формулы ✨", "pt": "Toca num cartão para ver as fórmulas ✨"}}, "back": "srednja-matematika-4.html"};

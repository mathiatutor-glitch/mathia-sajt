<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--cream:#FBF6EE;--ink:#5A1024;--ink2:#7A3346;--gold:#C6A05C;--goldlt:#F0DCA8;--malina:#B01E48;--malina2:#CC5E7E;--mint:#3FB98C;--muted:#8A7A80}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#43303A;min-height:100vh;
 background:radial-gradient(520px 400px at 104% -6%,#F6E1EC 0,transparent 56%),radial-gradient(500px 380px at -6% 106%,#F7ECD6 0,transparent 58%),var(--cream);overflow-x:hidden}
#fall{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fall span{position:absolute;top:-8%;font-family:'Spectral',serif;font-style:italic;color:rgba(198,160,92,.22);animation:fl linear infinite}
#fall span.m{color:rgba(176,30,72,.16)}
@keyframes fl{0%{transform:translateY(-10vh) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(112vh) rotate(24deg);opacity:0}}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:14px 18px 40px}
.top{display:flex;align-items:center;gap:12px;padding:6px 2px 12px}
.top .back{color:var(--ink2);text-decoration:none;font-weight:800;font-size:1.1rem}
.top .lang{margin-left:auto;border:1px solid var(--goldlt);border-radius:100px;padding:5px 10px;font-family:inherit;font-weight:800;font-size:.72rem;color:var(--ink);background:#fff}
.bar{flex:1;height:14px;border-radius:100px;background:#EEE1D8;overflow:hidden;box-shadow:inset 0 1px 3px rgba(120,60,70,.12)}
.bar>i{display:block;height:100%;width:0;border-radius:100px;background:linear-gradient(90deg,var(--gold),var(--malina));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hearts{font-size:1rem;white-space:nowrap}.streak{font-weight:900;color:var(--gold);font-size:.95rem;white-space:nowrap}
.card{background:linear-gradient(180deg,#FFFDF9,#FDF3EA);border:1px solid var(--goldlt);border-radius:30px;padding:24px 22px;box-shadow:0 30px 70px -34px rgba(90,16,36,.5);animation:pop .5s cubic-bezier(.2,.9,.2,1)}
@keyframes pop{0%{transform:scale(.92) translateY(12px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.eyebrow{text-align:center;font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:.66rem;color:var(--malina)}
.qnum{display:block;text-align:center;margin:2px 0 6px;color:var(--muted);font-weight:800;font-size:.8rem}
.mascot{width:74px;height:74px;margin:2px auto 6px;border-radius:50%;display:grid;place-items:center;font-size:2.3rem;background:radial-gradient(circle at 40% 34%,#FFF3F7,#F6E1EC);border:2px solid var(--goldlt);box-shadow:0 12px 26px -12px rgba(176,30,72,.4);animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.q{font-family:'Spectral',serif;font-weight:700;color:var(--ink);font-size:1.45rem;text-align:center;line-height:1.25;margin:4px 0}
.qhint{text-align:center;color:var(--ink2);font-size:.9rem;margin:2px 0 14px}
.opts{display:grid;gap:11px}
.opt{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #EFE0D6;border-radius:18px;padding:13px 16px;font-weight:800;font-size:1.05rem;color:var(--ink);cursor:pointer;transition:transform .12s,border-color .15s,background .15s;text-align:left}
.opt .em{font-size:1.3rem}
.opt:hover{transform:translateY(-2px);border-color:var(--gold)}
.opt.correct{border-color:var(--mint);background:linear-gradient(180deg,#F1FBF6,#E4F6EE);animation:good .5s}
.opt.wrong{border-color:var(--malina);background:linear-gradient(180deg,#FDEFF3,#FBE3EA);animation:shake .4s}
@keyframes good{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:12px;text-align:center;font-weight:900;font-size:1.05rem;min-height:24px}
.fb.ok{color:var(--mint)}.fb.no{color:var(--malina)}
.cta{display:block;width:100%;margin-top:14px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--malina2),var(--malina));color:#fff;font-weight:900;font-size:1.05rem;padding:15px;border-radius:100px;box-shadow:0 16px 30px -14px rgba(176,30,72,.6);transition:transform .15s}
.cta:hover{transform:translateY(-2px)}
.hidden{display:none}
.result{text-align:center}.result .big{font-size:3.4rem;margin:4px 0}.result h2{font-family:'Spectral',serif;color:var(--ink);font-size:1.9rem;margin:2px 0}
.result .score{font-weight:900;color:var(--gold);font-size:1.15rem}.result .msg{color:var(--ink2);margin:8px 0 4px}
.badge{display:inline-flex;align-items:center;gap:8px;margin:12px auto 4px;background:linear-gradient(135deg,#FFF3D6,#F3DFA6);border:1px solid var(--goldlt);border-radius:100px;padding:10px 18px;font-weight:900;color:#8a6a1e;box-shadow:0 10px 22px -12px rgba(160,120,40,.6)}
.again{margin-top:12px;background:none;border:none;color:var(--ink2);font-weight:800;cursor:pointer;text-decoration:underline}
#conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#conf i{position:absolute;top:-6%;width:10px;height:14px;border-radius:2px;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(560deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style id="prov-lux">
.card{background:linear-gradient(180deg,#FFFDF9,#FBEFDA)!important;border:1.5px solid rgba(198,160,92,.4)!important;border-radius:26px!important;box-shadow:0 40px 90px -50px rgba(90,16,36,.5)!important}
.mascot{width:78px!important;height:78px!important;background:radial-gradient(circle at 40% 30%,#FFF6D6,#EAD3A0)!important;border:2px solid #C6A05C!important;box-shadow:0 16px 30px -14px rgba(198,160,92,.85)!important;font-size:2rem!important}
.bar{height:14px!important;background:#F1E7D4!important;border:1px solid rgba(198,160,92,.35)}
.bar>*{background:linear-gradient(90deg,#E7D2A2,#C6A05C)!important;transition:width .45s ease!important}
.opt{background:linear-gradient(180deg,#fff,#FBF3E4)!important;border:1.5px solid rgba(198,160,92,.42)!important;border-radius:16px!important;padding:14px 15px!important;grid-template-columns:auto 1fr!important;align-items:center;gap:12px;text-align:left;font-weight:700;color:#5A1024;transition:transform .14s,border-color .14s,box-shadow .14s;box-shadow:0 6px 16px -12px rgba(156,120,56,.5)}
.opt:hover{border-color:#C6A05C!important;transform:translateY(-2px);box-shadow:0 16px 28px -14px rgba(198,160,92,.75)}
.opt:active{transform:scale(.99)}
.opt .mk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,#FFF6D6,#E7D2A2);border:1px solid #C6A05C;font-weight:900;color:#5A1024;flex:none}
.opt.correct{border-color:#3F9A6A!important;background:linear-gradient(180deg,#F3FBF5,#E7F6EC)!important}
.opt.wrong{border-color:#CC5E7E!important;background:linear-gradient(180deg,#FFF5F8,#FBEAF0)!important}
.fb{font-size:1.08rem!important}
.heart{font-size:1.05rem!important}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.98)}100%{opacity:1;transform:none}}
@media(prefers-reduced-motion:no-preference){.mascot{animation:mbob 3s ease-in-out infinite}@keyframes mbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}}
</style>
<style id="mathia-polish">
/* MATHIA quiz polish — nicer fonts, larger owl-side text, vertical centering, top-row spacing.
   Palette-safe only: cream #FBF6EE, card #FFFDF9, plum #5A1024, ink #43303A, gold #C6A05C/#9C7838, malina #B01E48. No purple/lavender. */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--mp-plum:#5A1024;--mp-ink:#43303A;--mp-gold:#C6A05C;--mp-golddk:#9C7838;--mp-malina:#B01E48;--mp-muted:#8A7A80}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--mp-ink)}
h1,h2,h3{font-family:'Spectral',Georgia,'Times New Roman',serif}

/* 3 + 4) Vertically center the whole quiz group and lower it — responsive, no clipping (min-height, not fixed height) */
main.wrap{min-height:100dvh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding-top:26px}
.hero{margin-top:0!important}
#quiz,#report{margin-bottom:0!important}

/* 4) Top row (hearts + streak + language) — breathing room, less cramped, lowered */
.top{padding:18px 2px 22px!important;gap:14px!important}
.top .back{font-size:1.25rem!important}
.top .lang{font-size:.8rem!important;padding:7px 13px!important;letter-spacing:.03em}
.hearts{font-size:1.12rem!important}
.streak{font-size:1.02rem!important}

/* 2) Text around the owl — enlarge eyebrow, question number and topic tag for readability */
.eyebrow{font-size:.84rem!important;letter-spacing:.16em!important;color:var(--mp-malina)}
.qnum{font-size:1rem!important;font-weight:800!important;color:var(--mp-muted)}
.qtag{font-size:.84rem!important;letter-spacing:.1em!important;color:var(--mp-golddk)}

/* 1) Fonts — elegant serif for the question, clean Inter for options/body/UI */
.q{font-family:'Spectral',Georgia,serif!important;font-weight:700;color:var(--mp-plum)}
.opt{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif!important;font-weight:600;color:var(--mp-plum)}
.opt .mk{font-family:'Inter',system-ui,sans-serif!important}
.eyebrow,.qnum,.qtag,.fb,.cta,.reveal,.top,.streak{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif!important}

/* cuter, cleaner touch */
.card{border-radius:28px!important}
.mascot{margin:8px auto 10px!important}

/* short screens: keep comfortable, never clip */
@media(max-height:680px){main.wrap{justify-content:flex-start;padding-top:14px;padding-bottom:28px}}
</style>

<style id="mathia-kviz-fix">
/* Palette: cream #FBF6EE, plum #5A1024, gold #C6A05C/#9C7838, malina #B01E48 */
/* 3) HEADER STACKING: eyebrow -> subject -> question number, nicely spaced */
.eyebrow{text-align:center!important;font-family:'Inter',system-ui,sans-serif!important;font-weight:900!important;letter-spacing:.2em!important;text-transform:uppercase;font-size:.72rem!important;color:#B01E48!important;margin:0 0 3px!important}
.subject{display:block;text-align:center;font-family:'Spectral',Georgia,'Times New Roman',serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#5A1024;font-size:1.16rem;line-height:1.12;margin:2px 0 4px}
.qnum{display:block!important;text-align:center;font-family:'Inter',system-ui,sans-serif!important;color:#8A7A80!important;font-weight:800!important;font-size:.9rem!important;margin:2px 0 4px!important}
/* 1) CRITICAL next button: vertical-centering used to push it off-screen. Anchor content to top so it is always visible & scrollable. */
main.wrap{justify-content:flex-start!important;padding-top:22px}
#next{margin-top:16px}
#next:not(.hidden){display:block!important}
/* 4) SOLUTION: clean, centered, one step per line, highlighted result */
.sol-in{text-align:center!important}
.sol-h{text-align:center!important}
.step{display:block!important;text-align:center!important;margin:10px 0!important;line-height:1.55!important}
.note{text-align:center!important;margin:10px auto!important;max-width:34em}
.res{display:inline-block!important;margin:12px auto 2px!important;padding:9px 20px!important;font-weight:800!important;color:#B01E48!important;background:#fff!important;border:1.6px solid rgba(176,30,72,.42)!important;border-radius:12px!important;box-shadow:0 10px 22px -14px rgba(176,30,72,.6)!important}
/* 2) KaTeX: proper radicals, italic i, consistent phi, real matrices */
.katex{font-size:1.05em;color:inherit;line-height:1.2}
.q .katex{font-size:1.12em}
.opt .katex,.step .katex,.res .katex,.note .katex{font-size:1.02em}
.katex-display{margin:.3em 0}
</style>
</head>

<script>
var D={"eyebrow": {"sr": "Provera znanja · Fizika 4 (srednja) 🎯", "en": "Knowledge Check · Physics 4 (high school) 🎯", "de": "Wissenstest · Physik 4 (Gymnasium) 🎯", "fr": "Contrôle de connaissances · Physique 4 (lycée) 🎯", "es": "Prueba de conocimientos · Física 4 (bachillerato) 🎯", "it": "Verifica delle conoscenze · Fisica 4 (liceo) 🎯", "ru": "Проверка знаний · Физика 4 (старшая школа) 🎯", "pt": "Verificação de conhecimentos · Física 4 (ensino médio) 🎯"}, "badge": {"sr": "🏅 Bedž: Fizika 4", "en": "🏅 Badge: Physics 4", "de": "🏅 Abzeichen: Physik 4", "fr": "🏅 Badge : Physique 4", "es": "🏅 Insignia: Física 4", "it": "🏅 Badge: Fisica 4", "ru": "🏅 Значок: Физика 4", "pt": "🏅 Emblema: Física 4"}, "questions": [{"q": {"sr": "Kada se svetlosni talasi iz dva bliska izvora susretnu i stvore naizmenične svetle i tamne pruge, reč je o pojavi:", "en": "When light waves from two nearby sources meet and produce alternating bright and dark fringes, this phenomenon is called:", "de": "Wenn sich Lichtwellen aus zwei nahen Quellen treffen und abwechselnd helle und dunkle Streifen erzeugen, spricht man von:", "fr": "Lorsque des ondes lumineuses provenant de deux sources proches se rencontrent et créent des franges claires et sombres alternées, ce phénomène s'appelle :", "es": "Cuando las ondas de luz de dos fuentes cercanas se encuentran y producen franjas claras y oscuras alternadas, este fenómeno se llama:", "it": "Quando le onde luminose provenienti da due sorgenti vicine si incontrano e creano frange chiare e scure alternate, questo fenomeno si chiama:", "ru": "Когда световые волны от двух близких источников встречаются и образуют чередующиеся светлые и тёмные полосы, это явление называется:", "pt": "Quando as ondas de luz de duas fontes próximas se encontram e produzem franjas claras e escuras alternadas, esse fenômeno é chamado de:"}, "hint": {"sr": "Podsetnik: Jangov ogled sa dva proreza (double-slit) je klasičan primer ove pojave.", "en": "Reminder: Young's double-slit experim function mathTT(x){return x

 .replace(/¹/g,'^{1}').replace(/²/g,'^{2}').replace(/³/g,'^{3}')

 .replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();}

function mathLegacy(h){

 h=h.replace(/\[([^\[\]]*;[^\[\]]*)\]/g,function(_,g){return '\\('+mathBmat(g)+'\\)';});
 return h;}

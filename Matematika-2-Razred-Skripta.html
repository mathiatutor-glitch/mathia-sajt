<style>

<script>
var D={"eyebrow": {"sr": "Matematika · 2. razred", "en": "Mathematics · Grade 2", "de": "Mathematik · 2. Klasse", "fr": "Mathématiques · 2e année", "es": "Matemáticas · 2.º curso", "it": "Matematica · 2ª classe", "ru": "Математика · 2 класс", "pt": "Matemática · 2.º ano"}, "topics": [{"name": {"sr": "Stepeni i koreni", "en": "Powers and Roots", "de": "Potenzen und Wurzeln", "fr": "Puissances et racines", "es": "Potencias y raíces", "it": "Potenze e radici", "ru": "Степени и корни", "pt": "Potências e raízes"}, "theory": {"sr": "<b>Stepen</b> aⁿ predstavlja proizvod n jednakih činilaca a. Za a≠0 važi a⁰=1, a za ceo broj n<0 važi a⁻ⁿ=1/aⁿ. <b>Koren</b> ⁿ√a je broj čiji je n-ti stepen jednak a; specijalno √a=a^(1/2). Stepen sa racionalnim izložiocem definiše se kao a^(m/n)=ⁿ√(a^m), za a>0. Osnovna pravila: aᵐ·aⁿ=aᵐ⁺ⁿ, aᵐ:aⁿ=aᵐ⁻ⁿ, (aᵐ)ⁿ=aᵐⁿ, (a·b)ⁿ=aⁿ·bⁿ. Racionalisanje imenioca uklanja koren iz razlomka množenjem odgovarajućim izrazom.", "en": "A <b>power</b> aⁿ represents the product of n equal factors a. For a≠0, a⁰=1, and for an integer n<0, a⁻ⁿ=1/aⁿ. A <b>root</b> ⁿ√a is a number whose n-th power equals a; in particular √a=a^(1/2). A power with a rational exponent is defined as a^(m/n)=ⁿ√(a^m), for a>0. Basic rules: aᵐ·aⁿ=aᵐ⁺ⁿ, aᵐ:aⁿ=aᵐ⁻ⁿ, (aᵐ)ⁿ=aᵐⁿ, (a·b)ⁿ=aⁿ·bⁿ. Rationalizing the denominator removes the root from a fraction by multiplying with a suitable expression.", "de": "Eine <b>Potenz</b> aⁿ stellt das Produkt von n gleichen Faktoren a dar. Für a≠0 gilt a⁰=1, und für eine ganze Zahl n<0 gilt a⁻ⁿ=1/aⁿ. Eine <b>Wurzel</b> ⁿ√a ist eine Zahl, deren n-te Potenz gleich a ist; insbesondere √a=a^(1/2). Eine Potenz mit rationalem Exponenten wird definiert als a^(m/n)=ⁿ√(a^m), für a>0. Grundregeln: aᵐ·aⁿ=aᵐ⁺ⁿ, aᵐ:aⁿ=aᵐ⁻ⁿ, (aᵐ)ⁿ=aᵐⁿ, (a·b)ⁿ=aⁿ·bⁿ. Durch Rationalisierung des Nenners wird die Wurzel aus einem Bruch entfernt, indem mit einem geeigneten Ausdruck multipliziert wird.", "fr": "La <b>puissance</b> aⁿ représente le produit de n facteurs égaux a. Pour a≠0, a⁰=1, et pour un entier n<0, a⁻ⁿ=1/aⁿ. Une <b>racine</b> ⁿ√a est un nombre dont la n-ième puissance est égale à a ; en particulier √a=a^(1/2). Une puissance à exposant rationnel est définie par a^(m/n)=ⁿ√(a^m), pour a>0. Règles de base : aᵐ·aⁿ=aᵐ⁺ⁿ, aᵐ:aⁿ=aᵐ⁻ⁿ, (aᵐ)ⁿ=aᵐⁿ, (a·b)ⁿ=aⁿ·bⁿ. Rationaliser le dénominateur consiste à éliminer la racine d'une fraction en multipliant par une expression appropriée.", "es": "La <b>potencia</b> aⁿ representa el producto de n factores iguales a. Para a≠0, a⁰=1, y para un entero n<0, a⁻ⁿ=1/aⁿ. Una <b>raíz</b> ⁿ√a es un número cuya n-ésima potencia es igual a a; en particular √a=a^(1/2). Una potencia con exponente racional se define como a^(m/n)=ⁿ√(a^m), para a>0. Reglas básicas: aᵐ·aⁿ=aᵐ⁺ⁿ, aᵐ:aⁿ=aᵐ⁻ⁿ, (aᵐ)ⁿ=aᵐⁿ, (a·b)ⁿ=aⁿ·bⁿ. Racionalizar el denominador elimina la raíz de una fracción multiplicando por una expresión adecuada.", "it": "La <b>potenza</b> aⁿ rappresenta il prodotto di n fattori uguali a. Per a≠0, a⁰=1, e per un intero n<0, a⁻ⁿ=1/aⁿ. Una <b>radice</b> ⁿ√a è un numero la cui n-esima potenza è uguale ad a; in particolare √a=a^(1/2). Una potenza con esponente razionale è definita come a^(m/n)=ⁿ√(a^m), per a>0. Regole di base: aᵐ·aⁿ=aᵐ⁺ⁿ, aᵐ:aⁿ=aᵐ⁻ⁿ, (aᵐ)ⁿ=aᵐⁿ, (a·b)ⁿ=aⁿ·bⁿ. Razionalizzare il denominatore elimina la radice da una frazione moltiplicando per un'espressione opportuna.", "ru": "<b>Степень</b> aⁿ представляет собой произведение n одинаковых множителей a. При a≠0 верно a⁰=1, а для целого n<0 верно a⁻ⁿ=1/aⁿ. <b>Корень</b> ⁿ√a — это число, чья n-я степень равна a; в частности √a=a^(1/2). Степень с рациональным показателем определяется как a^(m/n)=ⁿ√(a^m), при a>0. Основные правила: aᵐ·aⁿ=aᵐ⁺ⁿ, aᵐ:aⁿ=aᵐ⁻ⁿ, (aᵐ)ⁿ=aᵐⁿ, (a·b)ⁿ=aⁿ·bⁿ. Освобождение от иррациональности в знаменателе устраняет корень из дроби путём умножения на подходящее выражение.", "pt": "A <b>potência</b> aⁿ representa o produto de n fatores iguais a. Para a≠0, a⁰=1, e para um inteiro n<0, a⁻ⁿ=1/aⁿ. Uma <b>raiz</b> ⁿ√a é um número cuja n-ésima potência é igual a a; em particular √a=a^(1/2). Uma potência com expoente racional é definida como a^(m/n)=ⁿ√(a^m), para a>0. Regras básicas: aᵐ·aⁿ=aᵐ⁺ⁿ, aᵐ:aⁿ=aᵐ⁻ⁿ, (aᵐ)ⁿ=aᵐⁿ, (a·b)ⁿ=aⁿ·bⁿ. Racionalizar o denominador elimina a raiz de uma fração multiplicando por uma expressão adequada."}, "formulas": [{"sr": "aᵐ · aⁿ = aᵐ⁺ⁿ,  aᵐ : aⁿ = aᵐ⁻ⁿ", "en": "aᵐ · aⁿ = aᵐ⁺ⁿ,  aᵐ : aⁿ = aᵐ⁻ⁿ", "de": "aᵐ · aⁿ = aᵐ⁺ⁿ,  aᵐ : aⁿ = aᵐ⁻ⁿ", "fr": "aᵐ · aⁿ = aᵐ⁺ⁿ,  aᵐ : aⁿ = aᵐ⁻ⁿ", "es": "aᵐ · aⁿ = aᵐ⁺ⁿ,  aᵐ : aⁿ = aᵐ⁻ⁿ", "it": "aᵐ · aⁿ = aᵐ⁺ⁿ,  aᵐ : aⁿ = aᵐ⁻ⁿ", "ru": "aᵐ · aⁿ = aᵐ⁺ⁿ,  aᵐ : aⁿ = aᵐ⁻ⁿ", "pt": "aᵐ · aⁿ = aᵐ⁺ⁿ,  aᵐ : aⁿ = aᵐ⁻ⁿ"}, {"sr": "(aᵐ)ⁿ = aᵐ·ⁿ,  a⁻ⁿ = 1/aⁿ", "en": "(aᵐ)ⁿ = aᵐ·ⁿ,  a⁻ⁿ = 1/aⁿ", "de": "(aᵐ)ⁿ = aᵐ·ⁿ,  a⁻ⁿ = 1/aⁿ", "fr": "(aᵐ)ⁿ = aᵐ·ⁿ,  a⁻ⁿ = 1/aⁿ", "es": "(aᵐ)ⁿ = aᵐ·ⁿ,  a⁻ⁿ = 1/aⁿ", "it": "(aᵐ)ⁿ = aᵐ·ⁿ,  a⁻ⁿ = 1/aⁿ", "ru": "(aᵐ)ⁿ = aᵐ·ⁿ,  a⁻ⁿ = 1/aⁿ", "pt": "(aᵐ)ⁿ = aᵐ·ⁿ,  a⁻ⁿ = 1/aⁿ"}, {"sr": "ⁿ√a = a^(1/n),  ⁿ√(aᵐ) = a^(m/n)", "en": "ⁿ√a = a^(1/n),  ⁿ√(aᵐ) = a^(m/n)", "de": "ⁿ√a = a^(1/n),  ⁿ√(aᵐ) = a^(m/n)", "fr": "ⁿ√a = a^(1/n),  ⁿ√(aᵐ) = a^(m/n)", "es": "ⁿ√a = a^(1/n),  ⁿ√(aᵐ) = a^(m/n)", "it": "ⁿ√a = a^(1/n),  ⁿ√(aᵐ) = a^(m/n)", "ru": "ⁿ√a = a^(1/n),  ⁿ√(aᵐ) = a^(m/n)", "pt": "ⁿ√a = a^(1/n),  ⁿ√(aᵐ) = a^(m/n)"}], "remember": {"sr": "Deljenje nulom nije definisano, a paran koren negativnog broja nije realan broj. Uvek proveri domen izraza pre računanja.", "en": "Division by zero is undefined, and an even root of a negative number is not a real number. Always check the domain of an expression before calculating.", "de": "Die Division durch null ist nicht definiert, und eine gerade Wurzel einer negativen Zahl ist keine reelle Zahl. Prüfe stets den Definitionsbereich eines Ausdrucks, bevor du rechnest.", "fr": "La division par zéro n'est pas définie, et une racine paire d'un nombre négatif n'est pas un nombre réel. Vérifie toujours le domaine d'une expression avant de calculer.", "es": "La división entre cero no está definida, y una raíz par de un número negativo no es un número real. Comprueba siempre el dominio de una expresión antes de calcular.", "it": "La divisione per zero non è definita, e una radice pari di un numero negativo non è un numero reale. Controlla sempre il dominio di un'espressione prima di calcolare.", "ru": "Деление на ноль не определено, а чётный корень из отрицательного числа не является действительным числом. Всегда проверяй область определения выражения перед вычислением.", "pt": "A divisão por zero não é definida, e uma raiz par de um número negativo não é um número real. Verifica sempre o domínio de uma expressão antes de calcular."}, "problem": {"statement": {"sr": "Uprosti izraz i racionališi imenilac: (2√3)/(√3−1).", "en": "Simplify the expression and rationalize the denominator: (2√3)/(√3−1).", "de": "Vereinfache den Ausdruck und rationalisiere den Nenner: (2√3)/(√3−1).", "fr": "Simplifie l'expression et rationalise le dénominateur : (2√3)/(√3−1).", "es": "Simplifica la expresión y racionaliza el denominador: (2√3)/(√3−1).", "it": "Semplifica l'espressione e razionalizza il denominatore: (2√3)/(√3−1).", "ru": "Упрости выражение и освободись от иррациональности в знаменателе: (2√3)/(√3−1).", "pt": "Simplifica a expressão e racionaliza o denominador: (2√3)/(√3−1)."}, "steps": [{"sr": "Pomnožimo brojilac i imenilac konjugovanim izrazom (√3+1): (2√3(√3+1))/((√3−1)(√3+1)).", "en": "Multiply the numerator and denominator by the conjugate (√3+1): (2√3(√3+1))/((√3−1)(√3+1)).", "de": "Multipliziere Zähler und Nenner mit dem konjugierten Ausdruck (√3+1): (2√3(√3+1))/((√3−1)(√3+1)).", "fr": "Multiplie le numérateur et le dénominateur par l'expression conjuguée (√3+1) : (2√3(√3+1))/((√3−1)(√3+1)).", "es": "Multiplica el numerador y el denominador por la expresión conjugada (√3+1): (2√3(√3+1))/((√3−1)(√3+1)).", "it": "Moltiplica numeratore e denominatore per l'espressione coniugata (√3+1): (2√3(√3+1))/((√3−1)(√3+1)).", "ru": "Умножим числитель и знаменатель на сопряжённое выражение (√3+1): (2√3(√3+1))/((√3−1)(√3+1)).", "pt": "Multiplica o numerador e o denominador pela expressão conjugada (√3+1): (2√3(√3+1))/((√3−1)(√3+1))."}, {"sr": "Imenilac: (√3−1)(√3+1)=3−1=2.", "en": "Denominator: (√3−1)(√3+1)=3−1=2.", "de": "Nenner: (√3−1)(√3+1)=3−1=2.", "fr": "Dénominateur : (√3−1)(√3+1)=3−1=2.", "es": "Denominador: (√3−1)(√3+1)=3−1=2.", "it": "Denominatore: (√3−1)(√3+1)=3−1=2.", "ru": "Знаменатель: (√3−1)(√3+1)=3−1=2.", "pt": "Denominador: (√3−1)(√3+1)=3−1=2."}, {"sr": "Brojilac: 2√3·√3+2√3·1=2·3+2√3=6+2√3.", "en": "Numerator: 2√3·√3+2√3·1=2·3+2√3=6+2√3.", "de": "Zähler: 2√3·√3+2√3·1=2·3+2√3=6+2√3.", "fr": "Numérateur : 2√3·√3+2√3·1=2·3+2√3=6+2√3.", "es": "Numerador: 2√3·√3+2√3·1=2·3+2√3=6+2√3.", "it": "Numeratore: 2√3·√3+2√3·1=2·3+2√3=6+2√3.", "ru": "Числитель: 2√3·√3+2√3·1=2·3+2√3=6+2√3.", "pt": "Numerador: 2√3·√3+2√3·1=2·3+2√3=6+2√3."}, {"sr": "Rezultat: (6+2√3)/2=3+√3.", "en": "Result: (6+2√3)/2=3+√3.", "de": "Ergebnis: (6+2√3)/2=3+√3.", "fr": "Résultat : (6+2√3)/2=3+√3.", "es": "Resultado: (6+2√3)/2=3+√3.", "it": "Risultato: (6+2√3)/2=3+√3.", "ru": "Результат: (6+2√3)/2=3+√3.", "pt": "Resultado: (6+2√3)/2=3+√3."}]}}, {"name": {"sr": "Kvadratna jednačina i funkcija", "en": "Quadratic Equation and Function", "de": "Quadratische Gleichung und Funktion", "fr": "Équation et fonction du second degré", "es": "Ecuación y función cuadrática", "it": "Equazione e funzione quadratica", "ru": "Квадратное уравнение и функция", "pt": "Equação e função quadrática"}, "theory": {"sr": "<b>Kvadratna jednačina</b> ax²+bx+c=0 (a≠0) rešava se pomoću diskriminante D=b²−4ac. Ako je D>0, postoje dva realna rešenja; ako je D=0, jedno (dvostruko) rešenje; ako je D<0, rešenja nisu realna. Rešenja se dobijaju formulom x=(−b±√D)/2a. <b>Vietove formule</b> povezuju koeficijente i rešenja: x₁+x₂=−b/a i x₁·x₂=c/a. <b>Kvadratna funkcija</b> y=ax²+bx+c ima grafik parabolu čije se teme nalazi u tački x₀=−b/2a, y₀=−D/4a; parabola je okrenuta na gore ako je a>0, a na dole ako je a<0.", "en": "A <b>quadratic equation</b> ax²+bx+c=0 (a≠0) is solved using the discriminant D=b²−4ac. If D>0, there are two real solutions; if D=0, one (double) solution; if D<0, the solutions are not real. The solutions are given by x=(−b±√D)/2a. <b>Vieta's formulas</b> relate the coefficients and the solutions: x₁+x₂=−b/a and x₁·x₂=c/a. A <b>quadratic function</b> y=ax²+bx+c has a parabola as its graph, whose vertex is at x₀=−b/2a, y₀=−D/4a; the parabola opens upward if a>0, and downward if a<0.", "de": "Eine <b>quadratische Gleichung</b> ax²+bx+c=0 (a≠0) wird mithilfe der Diskriminante D=b²−4ac gelöst. Ist D>0, gibt es zwei reelle Lösungen; ist D=0, eine (doppelte) Lösung; ist D<0, sind die Lösungen nicht reell. Die Lösungen ergeben sich aus x=(−b±√D)/2a. Die <b>Vieta-Formeln</b> verbinden die Koeffizienten und die Lösungen: x₁+x₂=−b/a und x₁·x₂=c/a. Eine <b>quadratische Funktion</b> y=ax²+bx+c hat als Graph eine Parabel, deren Scheitelpunkt bei x₀=−b/2a, y₀=−D/4a liegt; die Parabel ist nach oben geöffnet, wenn a>0, und nach unten, wenn a<0.", "fr": "Une <b>équation du second degré</b> ax²+bx+c=0 (a≠0) se résout à l'aide du discriminant D=b²−4ac. Si D>0, il y a deux solutions réelles ; si D=0, une seule solution (double) ; si D<0, les solutions ne sont pas réelles. Les solutions sont données par x=(−b±√D)/2a. Les <b>formules de Viète</b> relient les coefficients et les solutions : x₁+x₂=−b/a et x₁·x₂=c/a. Une <b>fonction du second degré</b> y=ax²+bx+c a pour graphe une parabole dont le sommet est au point x₀=−b/2a, y₀=−D/4a ; la parabole est tournée vers le haut si a>0, et vers le bas si a<0.", "es": "Una <b>ecuación cuadrática</b> ax²+bx+c=0 (a≠0) se resuelve mediante el discriminante D=b²−4ac. Si D>0, hay dos soluciones reales; si D=0, una solución (doble); si D<0, las soluciones no son reales. Las soluciones se obtienen con x=(−b±√D)/2a. Las <b>fórmulas de Vieta</b> relacionan los coeficientes y las soluciones: x₁+x₂=−b/a y x₁·x₂=c/a. Una <b>función cuadrática</b> y=ax²+bx+c tiene como gráfica una parábola cuyo vértice se encuentra en x₀=−b/2a, y₀=−D/4a; la parábola se abre hacia arriba si a>0, y hacia abajo si a<0.", "it": "Un'<b>equazione di secondo grado</b> ax²+bx+c=0 (a≠0) si risolve tramite il discriminante D=b²−4ac. Se D>0, ci sono due soluzioni reali; se D=0, una soluzione (doppia); se D<0, le soluzioni non sono reali. Le soluzioni si ottengono con x=(−b±√D)/2a. Le <b>formule di Viète</b> collegano i coefficienti e le soluzioni: x₁+x₂=−b/a e x₁·x₂=c/a. Una <b>funzione quadratica</b> y=ax²+bx+c ha come grafico una parabola il cui vertice si trova in x₀=−b/2a, y₀=−D/4a; la parabola è rivolta verso l'alto se a>0, e verso il basso se a<0.", "ru": "<b>Квадратное уравнение</b> ax²+bx+c=0 (a≠0) решается с помощью дискриминанта D=b²−4ac. Если D>0, есть два действительных решения; если D=0, одно (двойное) решение; если D<0, решения не являются действительными. Решения находятся по формуле x=(−b±√D)/2a. <b>Формулы Виета</b> связывают коэффициенты и решения: x₁+x₂=−b/a и x₁·x₂=c/a. <b>Квадратичная функция</b> y=ax²+bx+c имеет графиком параболу, вершина которой находится в точке x₀=−b/2a, y₀=−D/4a; парабола направлена вверх, если a>0, и вниз, если a<0.", "pt": "Uma <b>equação quadrática</b> ax²+bx+c=0 (a≠0) resolve-se através do discriminante D=b²−4ac. Se D>0, existem duas soluções reais; se D=0, uma solução (dupla); se D<0, as soluções não são reais. As soluções obtêm-se por x=(−b±√D)/2a. As <b>fórmulas de Vieta</b> relacionam os coeficientes e as soluções: x₁+x₂=−b/a e x₁·x₂=c/a. Uma <b>função quadrática</b> y=ax²+bx+c tem como gráfico uma parábola cujo vértice está em x₀=−b/2a, y₀=−D/4a; a parábola abre para cima se a>0, e para baixo se a<0."}, "formulas": [{"sr": "x = (−b ± √(b²−4ac)) / 2a,  D = b²−4ac", "en": "x = (−b ± √(b²−4ac)) / 2a,  D = b²−4ac", "de": "x = (−b ± √(b²−4ac)) / 2a,  D = b²−4ac", "fr": "x = (−b ± √(b²−4ac)) / 2a,  D = b²−4ac", "es": "x = (−b ± √(b²−4ac)) / 2a,  D = b²−4ac", "it": "x = (−b ± √(b²−4ac)) / 2a,  D = b²−4ac", "ru": "x = (−b ± √(b²−4ac)) / 2a,  D = b²−4ac", "pt": "x = (−b ± √(b²−4ac)) / 2a,  D = b²−4ac"}, {"sr": "x₁ + x₂ = −b/a,  x₁ · x₂ = c/a", "en": "x₁ + x₂ = −b/a,  x₁ · x₂ = c/a", "de": "x₁ + x₂ = −b/a,  x₁ · x₂ = c/a", "fr": "x₁ + x₂ = −b/a,  x₁ · x₂ = c/a", "es": "x₁ + x₂ = −b/a,  x₁ · x₂ = c/a", "it": "x₁ + x₂ = −b/a,  x₁ · x₂ = c/a", "ru": "x₁ + x₂ = −b/a,  x₁ · x₂ = c/a", "pt": "x₁ + x₂ = −b/a,  x₁ · x₂ = c/a"}, {"sr": "x₀ = −b/2a,  y₀ = −D/4a", "en": "x₀ = −b/2a,  y₀ = −D/4a", "de": "x₀ = −b/2a,  y₀ = −D/4a", "fr": "x₀ = −b/2a,  y₀ = −D/4a", "es": "x₀ = −b/2a,  y₀ = −D/4a", "it": "x₀ = −b/2a,  y₀ = −D/4a", "ru": "x₀ = −b/2a,  y₀ = −D/4a", "pt": "x₀ = −b/2a,  y₀ = −D/4a"}], "remember": {"sr": "Znak diskriminante D odmah govori koliko realnih rešenja jednačina ima, bez potrebe da se ona i izračunaju.", "en": "The sign of the discriminant D immediately tells how many real solutions the equation has, without needing to calculate them.", "de": "Das Vorzeichen der Diskriminante D verrät sofort, wie viele reelle Lösungen die Gleichung hat, ohne dass man sie berechnen muss.", "fr": "Le signe du discriminant D indique immédiatement le nombre de solutions réelles de l'équation, sans avoir besoin de les calculer.", "es": "El signo del discriminante D indica de inmediato cuántas soluciones reales tiene la ecuación, sin necesidad de calcularlas.", "it": "Il segno del discriminante D indica subito quante soluzioni reali ha l'equazione, senza doverle calcolare.", "ru": "Знак дискриминанта D сразу показывает, сколько действительных решений имеет уравнение, без необходимости их вычислять.", "pt": "O sinal do discriminante D indica de imediato quantas soluções reais tem a equação, sem ser preciso calculá-las."}, "problem": {"statement": {"sr": "Reši jednačinu x²−5x+6=0 i odredi teme odgovarajuće parabole.", "en": "Solve the equation x²−5x+6=0 and find the vertex of the corresponding parabola.", "de": "Löse die Gleichung x²−5x+6=0 und bestimme den Scheitelpunkt der zugehörigen Parabel.", "fr": "Résous l'équation x²−5x+6=0 et détermine le sommet de la parabole correspondante.", "es": "Resuelve la ecuación x²−5x+6=0 y determina el vértice de la parábola correspondiente.", "it": "Risolvi l'equazione x²−5x+6=0 e determina il vertice della parabola corrispondente.", "ru": "Реши уравнение x²−5x+6=0 и найди вершину соответствующей параболы.", "pt": "Resolve a equação x²−5x+6=0 e determina o vértice da parábola correspondente."}, "steps": [{"sr": "Diskriminanta: D=(−5)²−4·1·6=25−24=1.", "en": "Discriminant: D=(−5)²−4·1·6=25−24=1.", "de": "Diskriminante: D=(−5)²−4·1·6=25−24=1.", "fr": "Discriminant : D=(−5)²−4·1·6=25−24=1.", "es": "Discriminante: D=(−5)²−4·1·6=25−24=1.", "it": "Discriminante: D=(−5)²−4·1·6=25−24=1.", "ru": "Дискриминант: D=(−5)²−4·1·6=25−24=1.", "pt": "Discriminante: D=(−5)²−4·1·6=25−24=1."}, {"sr": "Rešenja: x=(5±√1)/2, pa je x₁=3, x₂=2.", "en": "Solutions: x=(5±√1)/2, so x₁=3, x₂=2.", "de": "Lösungen: x=(5±√1)/2, also x₁=3, x₂=2.", "fr": "Solutions : x=(5±√1)/2, donc x₁=3, x₂=2.", "es": "Soluciones: x=(5±√1)/2, entonces x₁=3, x₂=2.", "it": "Soluzioni: x=(5±√1)/2, quindi x₁=3, x₂=2.", "ru": "Решения: x=(5±√1)/2, значит x₁=3, x₂=2.", "pt": "Soluções: x=(5±√1)/2, logo x₁=3, x₂=2."}, {"sr": "Teme parabole: x₀=−b/2a=5/2=2,5; y₀=−D/4a=−1/4=−0,25.", "en": "Vertex of the parabola: x₀=−b/2a=5/2=2.5; y₀=−D/4a=−1/4=−0.25.", "de": "Scheitelpunkt der Parabel: x₀=−b/2a=5/2=2,5; y₀=−D/4a=−1/4=−0,25.", "fr": "Sommet de la parabole : x₀=−b/2a=5/2=2,5 ; y₀=−D/4a=−1/4=−0,25.", "es": "Vértice de la parábola: x₀=−b/2a=5/2=2,5; y₀=−D/4a=−1/4=−0,25.", "it": "Vertice della parabola: x₀=−b/2a=5/2=2,5; y₀=−D/4a=−1/4=−0,25.", "ru": "Вершина параболы: x₀=−b/2a=5/2=2,5; y₀=−D/4a=−1/4=−0,25.", "pt": "Vértice da parábola: x₀=−b/2a=5/2=2,5; y₀=−D/4a=−1/4=−0,25."}, {"sr": "Odgovor: rešenja su x₁=3, x₂=2, a teme parabole je T(2,5;−0,25).", "en": "Answer: the solutions are x₁=3, x₂=2, and the vertex of the parabola is V(2.5, −0.25).", "de": "Antwort: die Lösungen sind x₁=3, x₂=2, und der Scheitelpunkt der Parabel ist S(2,5; −0,25).", "fr": "Réponse : les solutions sont x₁=3, x₂=2, et le sommet de la parabole est S(2,5 ; −0,25).", "es": "Respuesta: las soluciones son x₁=3, x₂=2, y el vértice de la parábola es V(2,5; −0,25).", "it": "Risposta: le soluzioni sono x₁=3, x₂=2, e il vertice della parabola è V(2,5; −0,25).", "ru": "Ответ: решения x₁=3, x₂=2, а вершина параболы В(2,5; −0,25).", "pt": "Resposta: as soluções são x₁=3, x₂=2, e o vértice da parábola é V(2,5; −0,25)."}]}}, {"name": {"sr": "Eksponencijalna i logaritamska funkcija", "en": "Exponential and Logarithmic Function", "de": "Exponential- und Logarithmusfunktion", "fr": "Fonction exponentielle et logarithmique", "es": "Función exponencial y logarítmica", "it": "Funzione esponenziale e logaritmica", "ru": "Показательная и логарифмическая функция", "pt": "Função exponencial e logarítmica"}, "theory": {"sr": "<b>Eksponencijalna funkcija</b> y=aˣ (a>0, a≠1) definisana je za svaki realan broj x, uvek je pozitivna i raste ako je a>1, a opada ako je 0<a<1. <b>Logaritam</b> log_a x (a>0, a≠1, x>0) je inverzna operacija stepenovanja: log_a x=y znači aʸ=x. <b>Logaritamska funkcija</b> y=log_a x definisana je samo za x>0. Osnovna pravila logaritama: log_a(xy)=log_a x+log_a y, log_a(x/y)=log_a x−log_a y, log_a(xⁿ)=n·log_a x. Formula za promenu osnove glasi log_a x=log_b x/log_b a.", "en": "The <b>exponential function</b> y=aˣ (a>0, a≠1) is defined for every real number x, is always positive, and increases if a>1, or decreases if 0<a<1. A <b>logarithm</b> log_a x (a>0, a≠1, x>0) is the inverse operation of exponentiation: log_a x=y means aʸ=x. The <b>logarithmic function</b> y=log_a x is defined only for x>0. Basic logarithm rules: log_a(xy)=log_a x+log_a y, log_a(x/y)=log_a x−log_a y, log_a(xⁿ)=n·log_a x. The change-of-base formula is log_a x=log_b x/log_b a.", "de": "Die <b>Exponentialfunktion</b> y=aˣ (a>0, a≠1) ist für jede reelle Zahl x definiert, stets positiv und wachsend, wenn a>1, bzw. fallend, wenn 0<a<1. Ein <b>Logarithmus</b> log_a x (a>0, a≠1, x>0) ist die Umkehroperation des Potenzierens: log_a x=y bedeutet aʸ=x. Die <b>Logarithmusfunktion</b> y=log_a x ist nur für x>0 definiert. Grundregeln der Logarithmen: log_a(xy)=log_a x+log_a y, log_a(x/y)=log_a x−log_a y, log_a(xⁿ)=n·log_a x. Die Basiswechselformel lautet log_a x=log_b x/log_b a.", "fr": "La <b>fonction exponentielle</b> y=aˣ (a>0, a≠1) est définie pour tout nombre réel x, toujours positive, et croissante si a>1, décroissante si 0<a<1. Un <b>logarithme</b> log_a x (a>0, a≠1, x>0) est l'opération inverse de l'exponentiation : log_a x=y signifie aʸ=x. La <b>fonction logarithmique</b> y=log_a x n'est définie que pour x>0. Règles de base des logarithmes : log_a(xy)=log_a x+log_a y, log_a(x/y)=log_a x−log_a y, log_a(xⁿ)=n·log_a x. La formule de changement de base est log_a x=log_b x/log_b a.", "es": "La <b>función exponencial</b> y=aˣ (a>0, a≠1) está definida para todo número real x, siempre es positiva y crece si a>1, o decrece si 0<a<1. Un <b>logaritmo</b> log_a x (a>0, a≠1, x>0) es la operación inversa de la potenciación: log_a x=y significa aʸ=x. La <b>función logarítmica</b> y=log_a x solo está definida para x>0. Reglas básicas de los logaritmos: log_a(xy)=log_a x+log_a y, log_a(x/y)=log_a x−log_a y, log_a(xⁿ)=n·log_a x. La fórmula de cambio de base es log_a x=log_b x/log_b a.", "it": "La <b>funzione esponenziale</b> y=aˣ (a>0, a≠1) è definita per ogni numero reale x, è sempre positiva e cresce se a>1, oppure decresce se 0<a<1. Un <b>logaritmo</b> log_a x (a>0, a≠1, x>0) è l'operazione inversa dell'elevamento a potenza: log_a x=y significa aʸ=x. La <b>funzione logaritmica</b> y=log_a x è definita solo per x>0. Regole di base dei logaritmi: log_a(xy)=log_a x+log_a y, log_a(x/y)=log_a x−log_a y, log_a(xⁿ)=n·log_a x. La formula del cambiamento di base è log_a x=log_b x/log_b a.", "ru": "<b>Показательная функция</b> y=aˣ (a>0, a≠1) определена для любого действительного x, всегда положительна и возрастает, если a>1, или убывает, если 0<a<1. <b>Логарифм</b> log_a x (a>0, a≠1, x>0) — это операция, обратная возведению в степень: log_a x=y означает aʸ=x. <b>Логарифмическая функция</b> y=log_a x определена только при x>0. Основные правила логарифмов: log_a(xy)=log_a x+log_a y, log_a(x/y)=log_a x−log_a y, log_a(xⁿ)=n·log_a x. Формула перехода к новому основанию: log_a x=log_b x/log_b a.", "pt": "A <b>função exponencial</b> y=aˣ (a>0, a≠1) está definida para todo número real x, é sempre positiva e cresce se a>1, ou decresce se 0<a<1. Um <b>logaritmo</b> log_a x (a>0, a≠1, x>0) é a operação inversa da potenciação: log_a x=y significa aʸ=x. A <b>função logarítmica</b> y=log_a x só está definida para x>0. Regras básicas dos logaritmos: log_a(xy)=log_a x+log_a y, log_a(x/y)=log_a x−log_a y, log_a(xⁿ)=n·log_a x. A fórmula de mudança de base é log_a x=log_b x/log_b a."}, "formulas": [{"sr": "log_a(xy) = log_a x + log_a y", "en": "log_a(xy) = log_a x + log_a y", "de": "log_a(xy) = log_a x + log_a y", "fr": "log_a(xy) = log_a x + log_a y", "es": "log_a(xy) = log_a x + log_a y", "it": "log_a(xy) = log_a x + log_a y", "ru": "log_a(xy) = log_a x + log_a y", "pt": "log_a(xy) = log_a x + log_a y"}, {"sr": "log_a(x/y) = log_a x − log_a y,  log_a(xⁿ) = n·log_a x", "en": "log_a(x/y) = log_a x − log_a y,  log_a(xⁿ) = n·log_a x", "de": "log_a(x/y) = log_a x − log_a y,  log_a(xⁿ) = n·log_a x", "fr": "log_a(x/y) = log_a x − log_a y,  log_a(xⁿ) = n·log_a x", "es": "log_a(x/y) = log_a x − log_a y,  log_a(xⁿ) = n·log_a x", "it": "log_a(x/y) = log_a x − log_a y,  log_a(xⁿ) = n·log_a x", "ru": "log_a(x/y) = log_a x − log_a y,  log_a(xⁿ) = n·log_a x", "pt": "log_a(x/y) = log_a x − log_a y,  log_a(xⁿ) = n·log_a x"}, {"sr": "log_a x = log_b x / log_b a", "en": "log_a x = log_b x / log_b a", "de": "log_a x = log_b x / log_b a", "fr": "log_a x = log_b x / log_b a", "es": "log_a x = log_b x / log_b a", "it": "log_a x = log_b x / log_b a", "ru": "log_a x = log_b x / log_b a", "pt": "log_a x = log_b x / log_b a"}], "remember": {"sr": "Logaritam se može računati samo za pozitivne brojeve, a osnova logaritma mora biti pozitivna i različita od 1.", "en": "A logarithm can only be calculated for positive numbers, and the base of the logarithm must be positive and different from 1.", "de": "Ein Logarithmus lässt sich nur für positive Zahlen berechnen, und die Basis des Logarithmus muss positiv und ungleich 1 sein.", "fr": "Un logarithme ne peut être calculé que pour des nombres positifs, et la base du logarithme doit être positive et différente de 1.", "es": "Un logaritmo solo puede calcularse para números positivos, y la base del logaritmo debe ser positiva y distinta de 1.", "it": "Un logaritmo può essere calcolato solo per numeri positivi, e la base del logaritmo deve essere positiva e diversa da 1.", "ru": "Логарифм можно вычислить только для положительных чисел, а основание логарифма должно быть положительным и отличным от 1.", "pt": "Um logaritmo só pode ser calculado para números positivos, e a base do logaritmo deve ser positiva e diferente de 1."}, "problem": {"statement": {"sr": "Reši jednačinu log₂(x)+log₂(x−2)=3.", "en": "Solve the equation log₂(x)+log₂(x−2)=3.", "de": "Löse die Gleichung log₂(x)+log₂(x−2)=3.", "fr": "Résous l'équation log₂(x)+log₂(x−2)=3.", "es": "Resuelve la ecuación log₂(x)+log₂(x−2)=3.", "it": "Risolvi l'equazione log₂(x)+log₂(x−2)=3.", "ru": "Реши уравнение log₂(x)+log₂(x−2)=3.", "pt": "Resolve a equação log₂(x)+log₂(x−2)=3."}, "steps": [{"sr": "Uslov: x>0 i x−2>0, pa je x>2.", "en": "Condition: x>0 and x−2>0, so x>2.", "de": "Bedingung: x>0 und x−2>0, also x>2.", "fr": "Condition : x>0 et x−2>0, donc x>2.", "es": "Condición: x>0 y x−2>0, entonces x>2.", "it": "Condizione: x>0 e x−2>0, quindi x>2.", "ru": "Условие: x>0 и x−2>0, значит x>2.", "pt": "Condição: x>0 e x−2>0, logo x>2."}, {"sr": "Primenimo pravilo zbira: log₂(x(x−2))=3, odnosno x(x−2)=2³=8.", "en": "Apply the sum rule: log₂(x(x−2))=3, that is x(x−2)=2³=8.", "de": "Wende die Summenregel an: log₂(x(x−2))=3, das heißt x(x−2)=2³=8.", "fr": "Applique la règle de la somme : log₂(x(x−2))=3, c'est-à-dire x(x−2)=2³=8.", "es": "Aplica la regla de la suma: log₂(x(x−2))=3, es decir x(x−2)=2³=8.", "it": "Applica la regola della somma: log₂(x(x−2))=3, cioè x(x−2)=2³=8.", "ru": "Применим правило суммы: log₂(x(x−2))=3, то есть x(x−2)=2³=8.", "pt": "Aplica a regra da soma: log₂(x(x−2))=3, ou seja x(x−2)=2³=8."}, {"sr": "Rešimo kvadratnu jednačinu: x²−2x−8=0, pa je (x−4)(x+2)=0, dakle x=4 ili x=−2.", "en": "Solve the quadratic equation: x²−2x−8=0, so (x−4)(x+2)=0, hence x=4 or x=−2.", "de": "Löse die quadratische Gleichung: x²−2x−8=0, also (x−4)(x+2)=0, somit x=4 oder x=−2.", "fr": "Résous l'équation du second degré : x²−2x−8=0, donc (x−4)(x+2)=0, d'où x=4 ou x=−2.", "es": "Resuelve la ecuación cuadrática: x²−2x−8=0, entonces (x−4)(x+2)=0, por lo tanto x=4 o x=−2.", "it": "Risolvi l'equazione di secondo grado: x²−2x−8=0, quindi (x−4)(x+2)=0, dunque x=4 oppure x=−2.", "ru": "Решим квадратное уравнение: x²−2x−8=0, значит (x−4)(x+2)=0, откуда x=4 или x=−2.", "pt": "Resolve a equação quadrática: x²−2x−8=0, logo (x−4)(x+2)=0, portanto x=4 ou x=−2."}, {"sr": "Kako mora biti x>2, jedino rešenje je x=4.", "en": "Since x>2 is required, the only solution is x=4.", "de": "Da x>2 gelten muss, ist die einzige Lösung x=4.", "fr": "Comme x>2 est requis, la seule solution est x=4.", "es": "Como se requiere x>2, la única solución es x=4.", "it": "Poiché deve essere x>2, l'unica soluzione è x=4.", "ru": "Так как требуется x>2, единственное решение x=4.", "pt": "Como é necessário x>2, a única solução é x=4."}]}}, {"name": {"sr": "Trigonometrijske funkcije", "en": "Trigonometric Functions", "de": "Trigonometrische Funktionen", "fr": "Fonctions trigonométriques", "es": "Funciones trigonométricas", "it": "Funzioni trigonometriche", "ru": "Тригонометрические функции", "pt": "Funções trigonométricas"}, "theory": {"sr": "Za ugao x definišu se funkcije sin x, cos x, tg x=sin x/cos x i ctg x=cos x/sin x. Osnovni trigonometrijski identitet glasi sin²x+cos²x=1. Funkcije sin x i cos x periodične su sa periodom 2π (360°), a njihove vrednosti se kreću u intervalu [−1,1]. Funkcije tg x i ctg x imaju period π (180°). Ugao se može izraziti u stepenima ili radijanima, pri čemu važi π rad=180°. Formule sabiranja: sin(α+β)=sin α cos β+cos α sin β, cos(α+β)=cos α cos β−sin α sin β.", "en": "For an angle x, the functions sin x, cos x, tan x=sin x/cos x and cot x=cos x/sin x are defined. The basic trigonometric identity is sin²x+cos²x=1. The functions sin x and cos x are periodic with period 2π (360°), and their values lie in the interval [−1,1]. The functions tan x and cot x have period π (180°). An angle can be expressed in degrees or radians, where π rad=180°. Addition formulas: sin(α+β)=sin α cos β+cos α sin β, cos(α+β)=cos α cos β−sin α sin β.", "de": "Für einen Winkel x werden die Funktionen sin x, cos x, tan x=sin x/cos x und cot x=cos x/sin x definiert. Die grundlegende trigonometrische Identität lautet sin²x+cos²x=1. Die Funktionen sin x und cos x sind periodisch mit der Periode 2π (360°), und ihre Werte liegen im Intervall [−1,1]. Die Funktionen tan x und cot x haben die Periode π (180°). Ein Winkel kann in Grad oder Radiant angegeben werden, wobei π rad=180° gilt. Additionsformeln: sin(α+β)=sin α cos β+cos α sin β, cos(α+β)=cos α cos β−sin α sin β.", "fr": "Pour un angle x, on définit les fonctions sin x, cos x, tan x=sin x/cos x et cot x=cos x/sin x. L'identité trigonométrique fondamentale est sin²x+cos²x=1. Les fonctions sin x et cos x sont périodiques de période 2π (360°), et leurs valeurs se situent dans l'intervalle [−1,1]. Les fonctions tan x et cot x ont pour période π (180°). Un angle peut être exprimé en degrés ou en radians, avec π rad=180°. Formules d'addition : sin(α+β)=sin α cos β+cos α sin β, cos(α+β)=cos α cos β−sin α sin β.", "es": "Para un ángulo x se definen las funciones sin x, cos x, tan x=sin x/cos x y cot x=cos x/sin x. La identidad trigonométrica fundamental es sin²x+cos²x=1. Las funciones sin x y cos x son periódicas con período 2π (360°), y sus valores están en el intervalo [−1,1]. Las funciones tan x y cot x tienen período π (180°). Un ángulo puede expresarse en grados o radianes, donde π rad=180°. Fórmulas de adición: sin(α+β)=sin α cos β+cos α sin β, cos(α+β)=cos α cos β−sin α sin β.", "it": "Per un angolo x si definiscono le funzioni sin x, cos x, tan x=sin x/cos x e cot x=cos x/sin x. L'identità trigonometrica fondamentale è sin²x+cos²x=1. Le funzioni sin x e cos x sono periodiche con periodo 2π (360°), e i loro valori sono compresi nell'intervallo [−1,1]. Le funzioni tan x e cot x hanno periodo π (180°). Un angolo può essere espresso in gradi o radianti, dove π rad=180°. Formule di addizione: sin(α+β)=sin α cos β+cos α sin β, cos(α+β)=cos α cos β−sin α sin β.", "ru": "Для угла x определяются функции sin x, cos x, tg x=sin x/cos x и ctg x=cos x/sin x. Основное тригонометрическое тождество: sin²x+cos²x=1. Функции sin x и cos x периодичны с периодом 2π (360°), их значения лежат в интервале [−1,1]. Функции tg x и ctg x имеют период π (180°). Угол можно выразить в градусах или радианах, при этом π рад=180°. Формулы сложения: sin(α+β)=sin α cos β+cos α sin β, cos(α+β)=cos α cos β−sin α sin β.", "pt": "Para um ângulo x definem-se as funções sin x, cos x, tan x=sin x/cos x e cot x=cos x/sin x. A identidade trigonométrica fundamental é sin²x+cos²x=1. As funções sin x e cos x são periódicas com período 2π (360°), e os seus valores situam-se no intervalo [−1,1]. As funções tan x e cot x têm período π (180°). Um ângulo pode ser expresso em graus ou radianos, sendo π rad=180°. Fórmulas de adição: sin(α+β)=sin α cos β+cos α sin β, cos(α+β)=cos α cos β−sin α sin β."}, "formulas": [{"sr": "sin²x + cos²x = 1", "en": "sin²x + cos²x = 1", "de": "sin²x + cos²x = 1", "fr": "sin²x + cos²x = 1", "es": "sin²x + cos²x = 1", "it": "sin²x + cos²x = 1", "ru": "sin²x + cos²x = 1", "pt": "sin²x + cos²x = 1"}, {"sr": "tg x = sin x / cos x,  ctg x = cos x / sin x", "en": "tg x = sin x / cos x,  ctg x = cos x / sin x", "de": "tg x = sin x / cos x,  ctg x = cos x / sin x", "fr": "tg x = sin x / cos x,  ctg x = cos x / sin x", "es": "tg x = sin x / cos x,  ctg x = cos x / sin x", "it": "tg x = sin x / cos x,  ctg x = cos x / sin x", "ru": "tg x = sin x / cos x,  ctg x = cos x / sin x", "pt": "tg x = sin x / cos x,  ctg x = cos x / sin x"}, {"sr": "sin(α+β) = sin α cos β + cos α sin β", "en": "sin(α+β) = sin α cos β + cos α sin β", "de": "sin(α+β) = sin α cos β + cos α sin β", "fr": "sin(α+β) = sin α cos β + cos α sin β", "es": "sin(α+β) = sin α cos β + cos α sin β", "it": "sin(α+β) = sin α cos β + cos α sin β", "ru": "sin(α+β) = sin α cos β + cos α sin β", "pt": "sin(α+β) = sin α cos β + cos α sin β"}], "remember": {"sr": "Znak trigonometrijske funkcije zavisi od kvadranta u kome se ugao nalazi – to je ključno pri rešavanju trigonometrijskih jednačina.", "en": "The sign of a trigonometric function depends on the quadrant in which the angle lies – this is key when solving trigonometric equations.", "de": "Das Vorzeichen einer trigonometrischen Funktion hängt vom Quadranten ab, in dem der Winkel liegt – das ist entscheidend beim Lösen trigonometrischer Gleichungen.", "fr": "Le signe d'une fonction trigonométrique dépend du quadrant où se trouve l'angle – c'est essentiel pour résoudre les équations trigonométriques.", "es": "El signo de una función trigonométrica depende del cuadrante en el que se encuentra el ángulo; esto es clave al resolver ecuaciones trigonométricas.", "it": "Il segno di una funzione trigonometrica dipende dal quadrante in cui si trova l'angolo: questo è fondamentale per risolvere le equazioni trigonometriche.", "ru": "Знак тригонометрической функции зависит от четверти, в которой находится угол — это ключевой момент при решении тригонометрических уравнений.", "pt": "O sinal de uma função trigonométrica depende do quadrante em que o ângulo se encontra – isso é essencial para resolver equações trigonométricas."}, "problem": {"statement": {"sr": "Ako je sin x=3/5 i x je ugao iz prvog kvadranta, izračunaj cos x i tg x.", "en": "If sin x=3/5 and x is an angle in the first quadrant, calculate cos x and tan x.", "de": "Wenn sin x=3/5 und x ein Winkel im ersten Quadranten ist, berechne cos x und tan x.", "fr": "Si sin x=3/5 et que x est un angle du premier quadrant, calcule cos x et tan x.", "es": "Si sin x=3/5 y x es un ángulo del primer cuadrante, calcula cos x y tan x.", "it": "Se sin x=3/5 e x è un angolo del primo quadrante, calcola cos x e tan x.", "ru": "Если sin x=3/5 и x — угол первой четверти, вычисли cos x и tg x.", "pt": "Se sin x=3/5 e x é um ângulo do primeiro quadrante, calcula cos x e tan x."}, "steps": [{"sr": "Iz identiteta sin²x+cos²x=1 sledi cos²x=1−(3/5)²=1−9/25=16/25.", "en": "From the identity sin²x+cos²x=1 it follows that cos²x=1−(3/5)²=1−9/25=16/25.", "de": "Aus der Identität sin²x+cos²x=1 folgt cos²x=1−(3/5)²=1−9/25=16/25.", "fr": "De l'identité sin²x+cos²x=1 découle cos²x=1−(3/5)²=1−9/25=16/25.", "es": "De la identidad sin²x+cos²x=1 se sigue que cos²x=1−(3/5)²=1−9/25=16/25.", "it": "Dall'identità sin²x+cos²x=1 segue cos²x=1−(3/5)²=1−9/25=16/25.", "ru": "Из тождества sin²x+cos²x=1 следует cos²x=1−(3/5)²=1−9/25=16/25.", "pt": "Da identidade sin²x+cos²x=1 resulta cos²x=1−(3/5)²=1−9/25=16/25."}, {"sr": "Kako je x u prvom kvadrantu, cos x je pozitivan: cos x=√(16/25)=4/5.", "en": "Since x is in the first quadrant, cos x is positive: cos x=√(16/25)=4/5.", "de": "Da x im ersten Quadranten liegt, ist cos x positiv: cos x=√(16/25)=4/5.", "fr": "Comme x est dans le premier quadrant, cos x est positif : cos x=√(16/25)=4/5.", "es": "Como x está en el primer cuadrante, cos x es positivo: cos x=√(16/25)=4/5.", "it": "Poiché x è nel primo quadrante, cos x è positivo: cos x=√(16/25)=4/5.", "ru": "Так как x в первой четверти, cos x положителен: cos x=√(16/25)=4/5.", "pt": "Como x está no primeiro quadrante, cos x é positivo: cos x=√(16/25)=4/5."}, {"sr": "Tangens se računa kao tg x=sin x/cos x=(3/5)/(4/5)=3/4.", "en": "The tangent is calculated as tan x=sin x/cos x=(3/5)/(4/5)=3/4.", "de": "Der Tangens wird berechnet als tan x=sin x/cos x=(3/5)/(4/5)=3/4.", "fr": "La tangente se calcule par tan x=sin x/cos x=(3/5)/(4/5)=3/4.", "es": "La tangente se calcula como tan x=sin x/cos x=(3/5)/(4/5)=3/4.", "it": "La tangente si calcola come tan x=sin x/cos x=(3/5)/(4/5)=3/4.", "ru": "Тангенс вычисляется как tg x=sin x/cos x=(3/5)/(4/5)=3/4.", "pt": "A tangente calcula-se como tan x=sin x/cos x=(3/5)/(4/5)=3/4."}, {"sr": "Odgovor: cos x=4/5, tg x=3/4.", "en": "Answer: cos x=4/5, tan x=3/4.", "de": "Antwort: cos x=4/5, tan x=3/4.", "fr": "Réponse : cos x=4/5, tan x=3/4.", "es": "Respuesta: cos x=4/5, tan x=3/4.", "it": "Risposta: cos x=4/5, tan x=3/4.", "ru": "Ответ: cos x=4/5, tg x=3/4.", "pt": "Resposta: cos x=4/5, tan x=3/4."}]}}, {"name": {"sr": "Sličnost", "en": "Similarity", "de": "Ähnlichkeit", "fr": "Similitude", "es": "Semejanza", "it": "Similitudine", "ru": "Подобие", "pt": "Semelhança"}, "theory": {"sr": "Dva trougla su <b>slična</b> (oznaka ∼) ako imaju jednake odgovarajuće uglove, a odgovarajuće stranice proporcionalne. Osnovni stavovi o sličnosti: UU (dva para uglova jednaka), SUS (dve stranice proporcionalne i ugao između njih jednak) i SSS (sve tri stranice proporcionalne). Koeficijent sličnosti k je količnik odgovarajućih stranica. Ako je k koeficijent sličnosti, odnos obima sličnih figura jednak je k, a odnos površina jednak je k². <b>Talesova teorema</b> kaže da paralelne prave koje seku krake ugla odsecaju na njima proporcionalne odsečke.", "en": "Two triangles are <b>similar</b> (notation ∼) if their corresponding angles are equal and their corresponding sides are proportional. Basic similarity criteria: AA (two pairs of angles equal), SAS (two sides proportional and the angle between them equal), and SSS (all three sides proportional). The similarity ratio k is the quotient of corresponding sides. If k is the similarity ratio, the ratio of the perimeters of similar figures equals k, and the ratio of the areas equals k². <b>Thales's theorem</b> states that parallel lines intersecting the sides of an angle cut off proportional segments on them.", "de": "Zwei Dreiecke sind <b>ähnlich</b> (Zeichen ∼), wenn ihre entsprechenden Winkel gleich sind und ihre entsprechenden Seiten proportional sind. Grundlegende Ähnlichkeitssätze: WW (zwei Winkelpaare gleich), SWS (zwei Seiten proportional und der eingeschlossene Winkel gleich) und SSS (alle drei Seiten proportional). Der Ähnlichkeitsfaktor k ist der Quotient entsprechender Seiten. Ist k der Ähnlichkeitsfaktor, so ist das Verhältnis der Umfänge ähnlicher Figuren gleich k, und das Verhältnis der Flächen gleich k². Der <b>Strahlensatz</b> besagt, dass parallele Geraden, die die Schenkel eines Winkels schneiden, auf ihnen proportionale Abschnitte abschneiden.", "fr": "Deux triangles sont <b>semblables</b> (notation ∼) si leurs angles correspondants sont égaux et leurs côtés correspondants proportionnels. Critères de base de similitude : AA (deux paires d'angles égaux), SAS (deux côtés proportionnels et l'angle compris égal), et SSS (les trois côtés proportionnels). Le coefficient de similitude k est le rapport des côtés correspondants. Si k est le coefficient de similitude, le rapport des périmètres de figures semblables est égal à k, et le rapport des aires est égal à k². Le <b>théorème de Thalès</b> énonce que des droites parallèles coupant les côtés d'un angle y déterminent des segments proportionnels.", "es": "Dos triángulos son <b>semejantes</b> (notación ∼) si sus ángulos correspondientes son iguales y sus lados correspondientes son proporcionales. Criterios básicos de semejanza: AA (dos pares de ángulos iguales), LAL (dos lados proporcionales y el ángulo entre ellos igual), y LLL (los tres lados proporcionales). El coeficiente de semejanza k es el cociente de los lados correspondientes. Si k es el coeficiente de semejanza, la razón de los perímetros de figuras semejantes es igual a k, y la razón de las áreas es igual a k². El <b>teorema de Tales</b> establece que las rectas paralelas que cortan los lados de un ángulo determinan en ellos segmentos proporcionales.", "it": "Due triangoli sono <b>simili</b> (notazione ∼) se hanno gli angoli corrispondenti uguali e i lati corrispondenti proporzionali. Criteri di base della similitudine: AA (due coppie di angoli uguali), LAL (due lati proporzionali e l'angolo compreso uguale), e LLL (tutti e tre i lati proporzionali). Il coefficiente di similitudine k è il rapporto tra i lati corrispondenti. Se k è il coefficiente di similitudine, il rapporto tra i perimetri di figure simili è uguale a k, e il rapporto tra le aree è uguale a k². Il <b>teorema di Talete</b> afferma che rette parallele che intersecano i lati di un angolo staccano su di essi segmenti proporzionali.", "ru": "Два треугольника <b>подобны</b> (обозначение ∼), если их соответствующие углы равны, а соответствующие стороны пропорциональны. Основные признаки подобия: УУ (две пары углов равны), СУС (две стороны пропорциональны и угол между ними равен) и ССС (все три стороны пропорциональны). Коэффициент подобия k — это отношение соответствующих сторон. Если k — коэффициент подобия, то отношение периметров подобных фигур равно k, а отношение площадей равно k². <b>Теорема Фалеса</b> утверждает, что параллельные прямые, пересекающие стороны угла, отсекают на них пропорциональные отрезки.", "pt": "Dois triângulos são <b>semelhantes</b> (notação ∼) se os seus ângulos correspondentes são iguais e os lados correspondentes são proporcionais. Critérios básicos de semelhança: AA (dois pares de ângulos iguais), LAL (dois lados proporcionais e o ângulo entre eles igual), e LLL (os três lados proporcionais). O coeficiente de semelhança k é o quociente dos lados correspondentes. Se k é o coeficiente de semelhança, a razão dos perímetros de figuras semelhantes é igual a k, e a razão das áreas é igual a k². O <b>teorema de Tales</b> afirma que retas paralelas que cortam os lados de um ângulo determinam nele segmentos proporcionais."}, "formulas": [{"sr": "a′/a = b′/b = c′/c = k", "en": "a′/a = b′/b = c′/c = k", "de": "a′/a = b′/b = c′/c = k", "fr": "a′/a = b′/b = c′/c = k", "es": "a′/a = b′/b = c′/c = k", "it": "a′/a = b′/b = c′/c = k", "ru": "a′/a = b′/b = c′/c = k", "pt": "a′/a = b′/b = c′/c = k"}, {"sr": "O′/O = k", "en": "O′/O = k", "de": "O′/O = k", "fr": "O′/O = k", "es": "O′/O = k", "it": "O′/O = k", "ru": "O′/O = k", "pt": "O′/O = k"}, {"sr": "P′/P = k²", "en": "P′/P = k²", "de": "P′/P = k²", "fr": "P′/P = k²", "es": "P′/P = k²", "it": "P′/P = k²", "ru": "P′/P = k²", "pt": "P′/P = k²"}], "remember": {"sr": "Kod sličnih figura uglovi ostaju jednaki, dok se sve dužine menjaju u istom razmeru k, a površine u razmeri k².", "en": "In similar figures the angles stay equal, while all lengths change by the same ratio k, and the areas change by the ratio k².", "de": "Bei ähnlichen Figuren bleiben die Winkel gleich, während sich alle Längen im gleichen Verhältnis k ändern und die Flächen im Verhältnis k².", "fr": "Dans des figures semblables, les angles restent égaux, tandis que toutes les longueurs changent dans le même rapport k, et les aires dans le rapport k².", "es": "En figuras semejantes los ángulos permanecen iguales, mientras que todas las longitudes cambian en la misma razón k, y las áreas en la razón k².", "it": "Nelle figure simili gli angoli restano uguali, mentre tutte le lunghezze cambiano nello stesso rapporto k, e le aree nel rapporto k².", "ru": "У подобных фигур углы остаются равными, тогда как все длины изменяются в одинаковом отношении k, а площади — в отношении k².", "pt": "Em figuras semelhantes os ângulos permanecem iguais, enquanto todos os comprimentos mudam na mesma razão k, e as áreas na razão k²."}, "problem": {"statement": {"sr": "Trouglovi ABC i A′B′C′ su slični sa koeficijentom sličnosti k=3. Ako je obim trougla ABC jednak 12 cm, a njegova površina 6 cm², odredi obim i površinu trougla A′B′C′.", "en": "Triangles ABC and A′B′C′ are similar with similarity ratio k=3. If the perimeter of triangle ABC is 12 cm and its area is 6 cm², find the perimeter and area of triangle A′B′C′.", "de": "Die Dreiecke ABC und A′B′C′ sind ähnlich mit dem Ähnlichkeitsfaktor k=3. Wenn der Umfang des Dreiecks ABC 12 cm und seine Fläche 6 cm² beträgt, bestimme Umfang und Fläche des Dreiecks A′B′C′.", "fr": "Les triangles ABC et A′B′C′ sont semblables avec un coefficient de similitude k=3. Si le périmètre du triangle ABC est de 12 cm et son aire de 6 cm², détermine le périmètre et l'aire du triangle A′B′C′.", "es": "Los triángulos ABC y A′B′C′ son semejantes con coeficiente de semejanza k=3. Si el perímetro del triángulo ABC es 12 cm y su área es 6 cm², determina el perímetro y el área del triángulo A′B′C′.", "it": "I triangoli ABC e A′B′C′ sono simili con coefficiente di similitudine k=3. Se il perimetro del triangolo ABC è 12 cm e la sua area è 6 cm², determina il perimetro e l'area del triangolo A′B′C′.", "ru": "Треугольники ABC и A′B′C′ подобны с коэффициентом подобия k=3. Если периметр треугольника ABC равен 12 см, а его площадь 6 см², найди периметр и площадь треугольника A′B′C′.", "pt": "Os triângulos ABC e A′B′C′ são semelhantes com coeficiente de semelhança k=3. Se o perímetro do triângulo ABC é 12 cm e a sua área é 6 cm², determina o perímetro e a área do triângulo A′B′C′."}, "steps": [{"sr": "Obim se skalira sa koeficijentom k: O′=k·O=3·12=36 cm.", "en": "The perimeter scales with the ratio k: O′=k·O=3·12=36 cm.", "de": "Der Umfang skaliert mit dem Faktor k: O′=k·O=3·12=36 cm.", "fr": "Le périmètre change avec le coefficient k : O′=k·O=3·12=36 cm.", "es": "El perímetro se escala con el coeficiente k: O′=k·O=3·12=36 cm.", "it": "Il perimetro si scala con il coefficiente k: O′=k·O=3·12=36 cm.", "ru": "Периметр масштабируется с коэффициентом k: O′=k·O=3·12=36 см.", "pt": "O perímetro escala com o coeficiente k: O′=k·O=3·12=36 cm."}, {"sr": "Površina se skalira sa k²: P′=k²·P=9·6=54 cm².", "en": "The area scales with k²: P′=k²·P=9·6=54 cm².", "de": "Die Fläche skaliert mit k²: P′=k²·P=9·6=54 cm².", "fr": "L'aire change avec k² : P′=k²·P=9·6=54 cm².", "es": "El área se escala con k²: P′=k²·P=9·6=54 cm².", "it": "L'area si scala con k²: P′=k²·P=9·6=54 cm².", "ru": "Площадь масштабируется с k²: P′=k²·P=9·6=54 см².", "pt": "A área escala com k²: P′=k²·P=9·6=54 cm²."}, {"sr": "Odgovor: obim trougla A′B′C′ je 36 cm, a površina 54 cm².", "en": "Answer: the perimeter of triangle A′B′C′ is 36 cm, and the area is 54 cm².", "de": "Antwort: der Umfang des Dreiecks A′B′C′ beträgt 36 cm, die Fläche 54 cm².", "fr": "Réponse : le périmètre du triangle A′B′C′ est 36 cm, et l'aire est 54 cm².", "es": "Respuesta: el perímetro del triángulo A′B′C′ es 36 cm, y el área es 54 cm².", "it": "Risposta: il perimetro del triangolo A′B′C′ è 36 cm, e l'area è 54 cm².", "ru": "Ответ: периметр треугольника A′B′C′ равен 36 см, а площадь 54 см².", "pt": "Resposta: o perímetro do triângulo A′B′C′ é 36 cm, e a área é 54 cm²."}]}}, {"name": {"sr": "Sinusna i kosinusna teorema", "en": "Law of Sines and Cosines", "de": "Sinus- und Kosinussatz", "fr": "Théorème du sinus et du cosinus", "es": "Teorema del seno y del coseno", "it": "Teorema del seno e del coseno", "ru": "Теорема синусов и косинусов", "pt": "Teorema do seno e do cosseno"}, "theory": {"sr": "U proizvoljnom trouglu sa stranicama a, b, c i naspramnim uglovima α, β, γ, <b>sinusna teorema</b> glasi a/sin α=b/sin β=c/sin γ=2R, gde je R poluprečnik opisane kružnice; koristi se kada su poznata dva ugla i jedna stranica, ili dve stranice i ugao naspram jedne od njih. <b>Kosinusna teorema</b> glasi c²=a²+b²−2ab·cos γ (i analogno za ostale stranice); koristi se kada su poznate dve stranice i ugao između njih, ili sve tri stranice. Površina trougla može se izračunati i preko dve stranice i ugla između njih: P=(1/2)·a·b·sin γ.", "en": "In an arbitrary triangle with sides a, b, c and opposite angles α, β, γ, the <b>law of sines</b> states a/sin α=b/sin β=c/sin γ=2R, where R is the radius of the circumscribed circle; it is used when two angles and one side are known, or two sides and the angle opposite one of them. The <b>law of cosines</b> states c²=a²+b²−2ab·cos γ (and analogously for the other sides); it is used when two sides and the angle between them are known, or all three sides. The area of a triangle can also be calculated from two sides and the angle between them: P=(1/2)·a·b·sin γ.", "de": "In einem beliebigen Dreieck mit den Seiten a, b, c und den gegenüberliegenden Winkeln α, β, γ lautet der <b>Sinussatz</b> a/sin α=b/sin β=c/sin γ=2R, wobei R der Radius des Umkreises ist; er wird verwendet, wenn zwei Winkel und eine Seite bekannt sind, oder zwei Seiten und der Winkel gegenüber einer von ihnen. Der <b>Kosinussatz</b> lautet c²=a²+b²−2ab·cos γ (analog für die anderen Seiten); er wird verwendet, wenn zwei Seiten und der eingeschlossene Winkel bekannt sind, oder alle drei Seiten. Die Fläche eines Dreiecks kann auch aus zwei Seiten und dem eingeschlossenen Winkel berechnet werden: P=(1/2)·a·b·sin γ.", "fr": "Dans un triangle quelconque de côtés a, b, c et d'angles opposés α, β, γ, le <b>théorème du sinus</b> s'écrit a/sin α=b/sin β=c/sin γ=2R, où R est le rayon du cercle circonscrit ; il s'utilise quand deux angles et un côté sont connus, ou deux côtés et l'angle opposé à l'un d'eux. Le <b>théorème du cosinus</b> s'écrit c²=a²+b²−2ab·cos γ (et de même pour les autres côtés) ; il s'utilise quand deux côtés et l'angle compris entre eux sont connus, ou les trois côtés. L'aire d'un triangle peut aussi se calculer à partir de deux côtés et de l'angle compris : P=(1/2)·a·b·sin γ.", "es": "En un triángulo cualquiera con lados a, b, c y ángulos opuestos α, β, γ, el <b>teorema del seno</b> establece a/sin α=b/sin β=c/sin γ=2R, donde R es el radio de la circunferencia circunscrita; se usa cuando se conocen dos ángulos y un lado, o dos lados y el ángulo opuesto a uno de ellos. El <b>teorema del coseno</b> establece c²=a²+b²−2ab·cos γ (y análogamente para los otros lados); se usa cuando se conocen dos lados y el ángulo entre ellos, o los tres lados. El área de un triángulo también puede calcularse a partir de dos lados y el ángulo entre ellos: P=(1/2)·a·b·sin γ.", "it": "In un triangolo qualsiasi con lati a, b, c e angoli opposti α, β, γ, il <b>teorema del seno</b> afferma a/sin α=b/sin β=c/sin γ=2R, dove R è il raggio della circonferenza circoscritta; si usa quando sono noti due angoli e un lato, oppure due lati e l'angolo opposto a uno di essi. Il <b>teorema del coseno</b> afferma c²=a²+b²−2ab·cos γ (e analogamente per gli altri lati); si usa quando sono noti due lati e l'angolo compreso, oppure tutti e tre i lati. L'area di un triangolo si può calcolare anche da due lati e l'angolo compreso: P=(1/2)·a·b·sin γ.", "ru": "В произвольном треугольнике со сторонами a, b, c и противолежащими углами α, β, γ <b>теорема синусов</b> гласит a/sin α=b/sin β=c/sin γ=2R, где R — радиус описанной окружности; она применяется, когда известны два угла и одна сторона, или две стороны и угол, противолежащий одной из них. <b>Теорема косинусов</b> гласит c²=a²+b²−2ab·cos γ (и аналогично для других сторон); она применяется, когда известны две стороны и угол между ними, или все три стороны. Площадь треугольника можно вычислить также по двум сторонам и углу между ними: P=(1/2)·a·b·sin γ.", "pt": "Num triângulo qualquer com lados a, b, c e ângulos opostos α, β, γ, o <b>teorema do seno</b> estabelece a/sin α=b/sin β=c/sin γ=2R, onde R é o raio da circunferência circunscrita; usa-se quando se conhecem dois ângulos e um lado, ou dois lados e o ângulo oposto a um deles. O <b>teorema do cosseno</b> estabelece c²=a²+b²−2ab·cos γ (e de forma análoga para os outros lados); usa-se quando se conhecem dois lados e o ângulo entre eles, ou os três lados. A área de um triângulo também pode ser calculada a partir de dois lados e do ângulo entre eles: P=(1/2)·a·b·sin γ."}, "formulas": [{"sr": "a/sin α = b/sin β = c/sin γ = 2R", "en": "a/sin α = b/sin β = c/sin γ = 2R", "de": "a/sin α = b/sin β = c/sin γ = 2R", "fr": "a/sin α = b/sin β = c/sin γ = 2R", "es": "a/sin α = b/sin β = c/sin γ = 2R", "it": "a/sin α = b/sin β = c/sin γ = 2R", "ru": "a/sin α = b/sin β = c/sin γ = 2R", "pt": "a/sin α = b/sin β = c/sin γ = 2R"}, {"sr": "c² = a² + b² − 2ab·cos γ", "en": "c² = a² + b² − 2ab·cos γ", "de": "c² = a² + b² − 2ab·cos γ", "fr": "c² = a² + b² − 2ab·cos γ", "es": "c² = a² + b² − 2ab·cos γ", "it": "c² = a² + b² − 2ab·cos γ", "ru": "c² = a² + b² − 2ab·cos γ", "pt": "c² = a² + b² − 2ab·cos γ"}, {"sr": "P = (1/2)·a·b·sin γ", "en": "P = (1/2)·a·b·sin γ", "de": "P = (1/2)·a·b·sin γ", "fr": "P = (1/2)·a·b·sin γ", "es": "P = (1/2)·a·b·sin γ", "it": "P = (1/2)·a·b·sin γ", "ru": "P = (1/2)·a·b·sin γ", "pt": "P = (1/2)·a·b·sin γ"}], "remember": {"sr": "Kosinusnu teoremu biraj kad su poznate dve stranice i ugao između njih ili sve tri stranice; sinusnu teoremu kad su poznati uglovi i naspramne stranice.", "en": "Choose the law of cosines when two sides and the angle between them, or all three sides, are known; choose the law of sines when angles and opposite sides are known.", "de": "Wähle den Kosinussatz, wenn zwei Seiten und der eingeschlossene Winkel oder alle drei Seiten bekannt sind; wähle den Sinussatz, wenn Winkel und gegenüberliegende Seiten bekannt sind.", "fr": "Choisis le théorème du cosinus quand deux côtés et l'angle compris, ou les trois côtés, sont connus ; choisis le théorème du sinus quand des angles et les côtés opposés sont connus.", "es": "Elige el teorema del coseno cuando se conocen dos lados y el ángulo entre ellos, o los tres lados; elige el teorema del seno cuando se conocen ángulos y lados opuestos.", "it": "Scegli il teorema del coseno quando sono noti due lati e l'angolo compreso, o tutti e tre i lati; sc valeurs : c²=7²+5²−2·7·5·cos 60°=49+25−70·0,5.", "es": "Sustituye los valores: c²=7²+5²−2·7·5·cos 60°=49+25−70·0,5.", "it": "Sostituisci i valori: c²=7²+5²−2·7·5·cos 60°=49+25−70·0,5.", "ru": "Подставим значения: c²=7²+5²−2·7·5·cos 60°=49+25−70·0,5.", "pt": "Substitui os valores: c²=7²+5²−2·7·5·cos 60°=49+25−70·0,5."}, {"sr": "Izračunamo: c²=74−35=39.", "en": "Calculate: c²=74−35=39.", "de": "Berechne: c²=74−35=39.", "fr": "Calcule : c²=74−35=39.", "es": "Calcula: c²=74−35=39.", "it": "Calcola: c²=74−35=39.", "ru": "Вычислим: c²=74−35=39.", "pt": "Calcula: c²=74−35=39."}, {"sr": "Odgovor: c=√39 cm≈6,24 cm.", "en": "Answer: c=√39 cm≈6.24 cm.", "de": "Antwort: c=√39 cm≈6,24 cm.", "fr": "Réponse : c=√39 cm≈6,24 cm.", "es": "Respuesta: c=√39 cm≈6,24 cm.", "it": "Risposta: c=√39 cm≈6,24 cm.", "ru": "Ответ: c=√39 см≈6,24 см.", "pt": "Resposta: c=√39 cm≈6,24 cm."}]}}], "C": {"next": {"sr": "Dalje →", "en": "Next →", "de": "Weiter →", "fr": "Suivant →", "es": "Siguiente →", "it": "Avanti →", "ru": "Дальше →", "pt": "Seguinte →"}, "prev": {"sr": "← Nazad", "en": "← Back", "de": "← Zurück", "fr": "← Retour", "es": "← Atrás", "it": "← Indietro", "ru": "← Назад", "pt": "← Voltar"}, "finish": {"sr": "Završi 🎉", "en": "Finish 🎉", "de": "Fertig 🎉", "fr": "Terminer 🎉", "es": "Terminar 🎉", "it": "Finisci 🎉", "ru": "Готово 🎉", "pt": "Terminar 🎉"}, "done": {"sr": "Bravo, prešao si skriptu! 🎉", "en": "Yay, you finished the notes! 🎉", "de": "Super, Skript geschafft! 🎉", "fr": "Bravo, cours terminé ! 🎉", "es": "¡Bien, terminaste los apuntes! 🎉", "it": "Bravo, dispensa completata! 🎉", "ru": "Ура, конспект пройден! 🎉", "pt": "Boa, terminaste os apontamentos! 🎉"}, "doneSub": {"sr": "Sad si spreman za kviz 💪", "en": "Now you're ready for the quiz 💪", "de": "Jetzt bist du bereit fürs Quiz 💪", "fr": "Tu es prêt pour le quiz 💪", "es": "Ya estás listo para el test 💪", "it": "Ora sei pronto per il quiz 💪", "ru": "Теперь ты готов к тесту 💪", "pt": "Agora estás pronto para o quiz 💪"}, "toQuiz": {"s var MAS=['🦉','🦊','🐨','🐰','🐼','🦄','🐧','🦖','🐳','🌟','🧠','✨'];
var $=function(id){return document.getElementById(id)};
function lng(){try{var s=localStorage.getItem('mathia_lang');if(s){s=s.slice(0,2).toLowerCase();if(D.C.next[s])return s;}}catch(e){}return 'sr'}
function T(o){var l=lng();return (o&&(o[l]||o.sr))||''}
var i=0,N=D.topics.length;
function dots(){var d=$('dots');d.innerHTML='';for(var k=0;k<=N;k++){var s=document.createElement('i');if(k<i)s.className='done';if(k===i)s.className='on';d.appendChild(s);}}
function render(){
 dots();var st=$('stage');
 if(i>=N){ // finale
   st.innerHTML='<section class="card fin"><div class="big">🎉</div><h2>'+T(D.C.done)+'</h2><p>'+T(D.C.doneSub)+'</p>'+
     '<a class="cta" href="'+D.quiz+'">'+T(D.C.toQuiz)+'</a><a class="cta2" href="'+D.back+'">'+T(D.C.toClone)+'</a></section>';
   bigConf();return;
 }
 var tp=D.topics[i];
 var fx=(tp.formulas||[]).map(function(f,k){return '<span style="animation-delay:'+(k*0.06)+'s">'+T(f)+'</span>'}).join('');
 var zap=tp.remember?('<div class="zap"><span class="st">💡</span><p>'+T(tp.remember)+'</p></div>'):'';
 st.innerHTML='<section class="card"><div class="eyebrow">'+T(D.eyebrow)+'</div>'+
   '<div class="mascot">'+MAS[i%MAS.length]+'</div>'+
   '<div class="tnum">'+(i+1)+' / '+N+'</div>'+
   '<h1 class="ttl">'+T(tp.name)+'</h1>'+
   '<p class="theory">'+T(tp.theory)+'</p>'+
   (fx?'<div class="fx">'+fx+'</div>':'')+zap+
   '<div class="nav">'+(i>0?'<button class="prev" id="prev">'+T(D.C.prev)+'</button>':'')+
   '<button class="next" id="next">'+(i===N-1?T(D.C.finish):T(D.C.next))+'</button></div></section>';
 var nx=$('next');if(nx)nx.onclick=function(){i++;render();sparkle()};
 var pv=$('prev');if(pv)pv.onclick=function(){i--;render()};
}
function sparkle(){spawnConf(10)}
function spawnConf(n){var box=$('conf');var cols=['#C6A05C','#B01E48','#CC5E7E','#F0DCA8','#3FB98C','#E7D2A2'];for(var k=0;k<n;k++){var s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.background=cols[k%cols.length];s.style.animationDuration=(1.6+Math.random()*1.4)+'s';if(Math.random()<.3)s.style.borderRadius='50%';box.appendChild(s);setTimeout(function(el){return function(){el.remove()}}(s),3200);}}
function bigConf(){spawnConf(80);var h=['💛','🌸','✨','🎉','⭐'];for(var k=0;k<14;k++){(function(k){setTimeout(function(){var s=document.createElement('i');s.textContent=h[k%5];s.style.cssText='position:absolute;top:-6%;font-size:22px;left:'+(Math.random()*100)+'%;animation:cf '+(1.8+Math.random())+'s linear forwards';$('conf').appendChild(s);setTimeout(function(){s.remove()},3200)},k*70)})(k);}}
(function(){var box=$('fall'),g=['π','√','∑','+','÷','½','💛','🌸','✦','⭐'];for(var k=0;k<20;k++){var s=document.createElement('span');s.textContent=g[k%g.length];if(k%3===0)s.className='m';s.style.left=Math.random()*100+'%';s.style.fontSize=(13+Math.random()*22)+'px';s.style.animationDuration=(7+Math.random()*8)+'s';s.style.animationDelay=(-Math.random()*10)+'s';box.appendChild(s);}})();
$('lang').addEventListener('change',function(){try{localStorage.setItem('mathia_lang',this.value)}catch(e){}try{document.documentElement.lang=this.value}catch(e){}try{window.dispatchEvent(new CustomEvent('mathia:lang',{detail:this.value}))}catch(e){}render();$('lang').value=this.value;});
window.addEventListener('mathia:lang',function(){var s=$('lang');if(s)s.value=lng();render();});
$('lang').value=lng();render();
</script>

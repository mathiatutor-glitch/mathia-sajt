<style>
:root{--cream:#FBF6EE;--ink:#5A1024;--ink2:#7A3346;--gold:#C6A05C;--goldlt:#F0DCA8;--malina:#B01E48;--malina2:#CC5E7E;--mint:#3FB98C;--muted:#8A7A80}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#43303A;min-height:100vh;
 background:radial-gradient(520px 400px at 104% -6%,#F6E1EC 0,transparent 56%),radial-gradient(500px 380px at -6% 106%,#F7ECD6 0,transparent 58%),var(--cream);overflow-x:hidden}
#fall{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fall span{position:absolute;top:-8%;font-family:'Spectral',serif;font-style:italic;color:rgba(198,160,92,.22);animation:fl linear infinite}
#fall span.m{color:rgba(176,30,72,.16)}
@keyframes fl{0%{transform:translateY(-10vh) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(112vh) rotate(24deg);opacity:0}}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:14px 18px 40px}
.top{display:flex;align-items:center;gap:10px;padding:4px 2px 8px}
.top .back{color:var(--ink2);text-decoration:none;font-weight:800;font-size:1.1rem}
.top .lang{margin-left:auto;border:1px solid var(--goldlt);border-radius:100px;padding:5px 10px;font-family:inherit;font-weight:800;font-size:.72rem;color:var(--ink);background:#fff}
.head{text-align:center;margin:6px 0 14px}
.head .eyebrow{font-weight:900;letter-spacing:.22em;text-transform:uppercase;font-size:.66rem;color:var(--malina)}
.head h1{font-family:'Spectral',serif;color:var(--ink);font-size:1.8rem;margin:4px 0 2px}
.head p{color:var(--ink2);font-size:.92rem;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.flip{perspective:1000px;min-height:190px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;min-height:190px;transition:transform .6s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d;animation:pop .4s both}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:18px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 20px 44px -30px rgba(90,16,36,.5)}
.front{background:linear-gradient(180deg,#FFFDF9,#FBF1E4);border:1px solid var(--goldlt)}
.front .em{font-size:2.3rem;margin-bottom:6px}
.front h3{font-family:'Spectral',serif;color:var(--ink);font-size:1.2rem;margin:0}
.front .tap{margin-top:10px;font-size:.76rem;font-weight:800;color:var(--gold);letter-spacing:.04em}
.back{background:linear-gradient(180deg,#FFF7FA,#FBEEF2);border:1px solid #F0D6DF;transform:rotateY(180deg);overflow-y:auto}
.back .fxx{display:block;font-family:'Spectral','Cambria Math',Georgia,serif;color:var(--ink);font-size:1.02rem;margin:5px 0;line-height:1.4}
.back .lbl{font-size:.66rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--malina);margin-bottom:6px}
@media(prefers-reduced-motion:reduce){.inner{transition:none}*{animation:none!important}}
</style>

<script>
var D={"eyebrow": {"sr": "Formule ✨", "en": "Formule ✨", "de": "Formule ✨", "fr": "Formule ✨", "es": "Formule ✨", "it": "Formule ✨", "ru": "Formule ✨", "pt": "Formule ✨"}, "title": {"sr": "Fizika · 1. razred · Formule", "en": "Physics · Grade 1 · Formulas", "de": "Physik · 1. Klasse · Formeln", "fr": "Physique · 1re année · Formules", "es": "Física · 1.º curso · Fórmulas", "it": "Fisica · 1° anno · Formule", "ru": "Физика · 1 класс · Формулы", "pt": "Física · 1.º ano · Fórmulas"}, "topics": [{"name": {"sr": "Kinematika", "en": "Kinematics", "de": "Kinematik", "fr": "Cinématique", "es": "Cinemática", "it": "Cinematica", "ru": "Кинематика", "pt": "Cinemática"}, "theory": {"sr": "<b>Kinematika</b> proučava kretanje tela ne uzimajući u obzir uzroke koji ga izazivaju. Osnovne veličine su put, pomeraj, brzina i ubrzanje. Kod ravnomerno ubrzanog kretanja brzina se menja linearno sa vremenom, a pređeni put zavisi od početne brzine, ubrzanja i vremena.", "en": "<b>Kinematics</b> studies the motion of bodies without considering the causes that produce it. The basic quantities are path, displacement, velocity and acceleration. In uniformly accelerated motion the velocity changes linearly with time, and the distance travelled depends on the initial velocity, acceleration and time.", "de": "<b>Die Kinematik</b> untersucht die Bewegung von Körpern, ohne die Ursachen dafür zu betrachten. Grundgrößen sind Weg, Verschiebung, Geschwindigkeit und Beschleunigung. Bei gleichmäßig beschleunigter Bewegung ändert sich die Geschwindigkeit linear mit der Zeit, und der zurückgelegte Weg hängt von Anfangsgeschwindigkeit, Beschleunigung und Zeit ab.", "fr": "<b>La cinématique</b> étudie le mouvement des corps sans tenir compte des causes qui le produisent. Les grandeurs de base sont la trajectoire, le déplacement, la vitesse et l'accélération. Dans un mouvement uniformément accéléré, la vitesse varie linéairement avec le temps, et la distance parcourue dépend de la vitesse initiale, de l'accélération et du temps.", "es": "<b>La cinemática</b> estudia el movimiento de los cuerpos sin considerar las causas que lo producen. Las magnitudes básicas son el espacio recorrido, el desplazamiento, la velocidad y la aceleración. En el movimiento uniformemente acelerado, la velocidad cambia linealmente con el tiempo, y la distancia recorrida depende de la velocidad inicial, la aceleración y el tiempo.", "it": "<b>La cinematica</b> studia il moto dei corpi senza considerare le cause che lo producono. Le grandezze fondamentali sono lo spazio percorso, lo spostamento, la velocità e l'accelerazione. Nel moto uniformemente accelerato la velocità varia linearmente nel tempo, e lo spazio percorso dipende dalla velocità iniziale, dall'accelerazione e dal tempo.", "ru": "<b>Кинематика</b> изучает движение тел, не рассматривая причины, которые его вызывают. Основные величины — путь, перемещение, скорость и ускорение. При равноускоренном движении скорость меняется линейно со временем, а пройденный путь зависит от начальной скорости, ускорения и времени.", "pt": "<b>A cinemática</b> estuda o movimento dos corpos sem considerar as causas que o provocam. As grandezas básicas são a distância percorrida, o deslocamento, a velocidade e a aceleração. No movimento uniformemente acelerado, a velocidade varia linearmente com o tempo, e a distância percorrida depende da velocidade inicial, da aceleração e do tempo."}, "formulas": [{"sr": "Brzina: v = v₀ + a·t", "en": "Velocity: v = v₀ + a·t", "de": "Geschwindigkeit: v = v₀ + a·t", "fr": "Vitesse : v = v₀ + a·t", "es": "Velocidad: v = v₀ + a·t", "it": "Velocità: v = v₀ + a·t", "ru": "Скорость: v = v₀ + a·t", "pt": "Velocidade: v = v₀ + a·t"}, {"sr": "Pređeni put: s = v₀·t + a·t²/2", "en": "Distance travelled: s = v₀·t + a·t²/2", "de": "Zurückgelegter Weg: s = v₀·t + a·t²/2", "fr": "Distance parcourue : s = v₀·t + a·t²/2", "es": "Distancia recorrida: s = v₀·t + a·t²/2", "it": "Spazio percorso: s = v₀·t + a·t²/2", "ru": "Пройденный путь: s = v₀·t + a·t²/2", "pt": "Distância percorrida: s = v₀·t + a·t²/2"}], "remember": {"sr": "Ne meši put (skalar) i pomeraj (vektor) — kod pravolinijskog kretanja u jednom smeru oni se poklapaju po iznosu.", "en": "Do not confuse path length (scalar) with displacement (vector) — for straight-line motion in one direction they coincide in magnitude.", "de": "Verwechsle nicht Weg (Skalar) und Verschiebung (Vektor) — bei geradliniger Bewegung in eine Richtung stimmen sie im Betrag überein.", "fr": "Ne confonds pas la distance parcourue (scalaire) et le déplacement (vecteur) — pour un mouvement rectiligne dans un seul sens, ils coïncident en valeur.", "es": "No confundas el espacio recorrido (escalar) con el desplazamiento (vector) — en un movimiento rectilíneo en un solo sentido coinciden en valor.", "it": "Non confondere lo spazio percorso (scalare) con lo spostamento (vettore) — nel moto rettilineo in un solo verso coincidono in valore.", "ru": "Не путай путь (скаляр) с перемещением (вектор) — при прямолинейном движении в одном направлении они совпадают по модулю.", "pt": "Não confundas a distância percorrida (escalar) com o deslocamento (vetor) — num movimento retilíneo num só sentido, coincidem em valor."}, "problem": {"statement": {"sr": "Automobil kreće iz mirovanja i ravnomerno se ubrzava sa a = 2 m/s². Koliku brzinu i koliki put ima posle t = 5 s?", "en": "A car starts from rest and accelerates uniformly at a = 2 m/s². What is its velocity and distance travelled after t = 5 s?", "de": "Ein Auto startet aus dem Stillstand und beschleunigt gleichmäßig mit a = 2 m/s². Welche Geschwindigkeit und welchen Weg hat es nach t = 5 s?", "fr": "Une voiture part du repos et accélère uniformément à a = 2 m/s². Quelle est sa vitesse et la distance parcourue après t = 5 s ?", "es": "Un coche parte del reposo y acelera uniformemente con a = 2 m/s². ¿Qué velocidad tiene y qué distancia ha recorrido después de t = 5 s?", "it": "Un'auto parte da ferma e accelera uniformemente con a = 2 m/s². Quale velocità e quale spazio percorso ha dopo t = 5 s?", "ru": "Автомобиль трогается с места и равноускоренно движется с a = 2 м/с². Какова его скорость и пройденный путь через t = 5 с?", "pt": "Um carro parte do repouso e acelera uniformemente com a = 2 m/s². Qual é a sua velocidade e a distância percorrida após t = 5 s?"}, "steps": [{"sr": "Poznato: v₀ = 0, a = 2 m/s², t = 5 s.", "en": "Given: v₀ = 0, a = 2 m/s², t = 5 s.", "de": "Gegeben: v₀ = 0, a = 2 m/s², t = 5 s.", "fr": "Données : v₀ = 0, a = 2 m/s², t = 5 s.", "es": "Datos: v₀ = 0, a = 2 m/s², t = 5 s.", "it": "Dati: v₀ = 0, a = 2 m/s², t = 5 s.", "ru": "Дано: v₀ = 0, a = 2 м/с², t = 5 с.", "pt": "Dados: v₀ = 0, a = 2 m/s², t = 5 s."}, {"sr": "Brzina: v = v₀ + a·t = 0 + 2·5 = 10 m/s.", "en": "Velocity: v = v₀ + a·t = 0 + 2·5 = 10 m/s.", "de": "Geschwindigkeit: v = v₀ + a·t = 0 + 2·5 = 10 m/s.", "fr": "Vitesse : v = v₀ + a·t = 0 + 2·5 = 10 m/s.", "es": "Velocidad: v = v₀ + a·t = 0 + 2·5 = 10 m/s.", "it": "Velocità: v = v₀ + a·t = 0 + 2·5 = 10 m/s.", "ru": "Скорость: v = v₀ + a·t = 0 + 2·5 = 10 м/с.", "pt": "Velocidade: v = v₀ + a·t = 0 + 2·5 = 10 m/s."}, {"sr": "Put: s = v₀·t + a·t²/2 = 0 + 2·5²/2 = 25 m.", "en": "Distance: s = v₀·t + a·t²/2 = 0 + 2·5²/2 = 25 m.", "de": "Weg: s = v₀·t + a·t²/2 = 0 + 2·5²/2 = 25 m.", "fr": "Distance : s = v₀·t + a·t²/2 = 0 + 2·5²/2 = 25 m.", "es": "Distancia: s = v₀·t + a·t²/2 = 0 + 2·5²/2 = 25 m.", "it": "Spazio: s = v₀·t + a·t²/2 = 0 + 2·5²/2 = 25 m.", "ru": "Путь: s = v₀·t + a·t²/2 = 0 + 2·5²/2 = 25 м.", "pt": "Distância: s = v₀·t + a·t²/2 = 0 + 2·5²/2 = 25 m."}, {"sr": "Odgovor: posle 5 s automobil ima brzinu 10 m/s i prešao je 25 m.", "en": "Answer: after 5 s the car has a velocity of 10 m/s and has travelled 25 m.", "de": "Antwort: Nach 5 s hat das Auto eine Geschwindigkeit von 10 m/s und einen Weg von 25 m zurückgelegt.", "fr": "Réponse : après 5 s, la voiture a une vitesse de 10 m/s et a parcouru 25 m.", "es": "Respuesta: después de 5 s, el coche tiene una velocidad de 10 m/s y ha recorrido 25 m.", "it": "Risposta: dopo 5 s l'auto ha una velocità di 10 m/s e ha percorso 25 m.", "ru": "Ответ: через 5 с автомобиль имеет скорость 10 м/с и прошёл путь 25 м.", "pt": "Resposta: após 5 s, o carro tem uma velocidade de 10 m/s e percorreu 25 m."}]}}, {"name": {"sr": "Dinamika", "en": "Dynamics", "de": "Dynamik", "fr": "Dynamique", "es": "Dinámica", "it": "Dinamica", "ru": "Динамика", "pt": "Dinâmica"}, "theory": {"sr": "<b>Dinamika</b> proučava uzroke kretanja — sile koje deluju na telo. Sila je vektorska veličina koja menja brzinu tela ili ga deformiše. Pored sile teže, na tela često deluju normalna sila podloge i sila trenja, koja se suprotstavlja relativnom klizanju površina.", "en": "<b>Dynamics</b> studies the causes of motion — the forces acting on a body. Force is a vector quantity that changes a body's velocity or deforms it. Besides gravitational force, bodies are often acted on by the normal force of a surface and friction force, which opposes the relative sliding of surfaces.", "de": "<b>Die Dynamik</b> untersucht die Ursachen der Bewegung — die Kräfte, die auf einen Körper wirken. Die Kraft ist eine vektorielle Größe, die die Geschwindigkeit eines Körpers ändert oder ihn verformt. Neben der Schwerkraft wirken auf Körper oft die Normalkraft der Unterlage und die Reibungskraft, die dem relativen Gleiten der Oberflächen entgegenwirkt.", "fr": "<b>La dynamique</b> étudie les causes du mouvement — les forces qui agissent sur un corps. La force est une grandeur vectorielle qui modifie la vitesse d'un corps ou le déforme. Outre la force de pesanteur, les corps subissent souvent la force normale du support et la force de frottement, qui s'oppose au glissement relatif des surfaces.", "es": "<b>La dinámica</b> estudia las causas del movimiento — las fuerzas que actúan sobre un cuerpo. La fuerza es una magnitud vectorial que cambia la velocidad de un cuerpo o lo deforma. Además de la fuerza de gravedad, sobre los cuerpos suelen actuar la fuerza normal de la superficie y la fuerza de rozamiento, que se opone al deslizamiento relativo de las superficies.", "it": "<b>La dinamica</b> studia le cause del moto — le forze che agiscono su un corpo. La forza è una grandezza vettoriale che modifica la velocità di un corpo o lo deforma. Oltre alla forza di gravità, sui corpi agiscono spesso la forza normale della superficie e la forza di attrito, che si oppone allo scorrimento relativo delle superfici.", "ru": "<b>Динамика</b> изучает причины движения — силы, действующие на тело. Сила — векторная величина, изменяющая скорость тела или деформирующая его. Помимо силы тяжести, на тела часто действуют нормальная сила опоры и сила трения, противодействующая относительному скольжению поверхностей.", "pt": "<b>A dinâmica</b> estuda as causas do movimento — as forças que atuam sobre um corpo. A força é uma grandeza vetorial que altera a velocidade de um corpo ou o deforma. Além da força da gravidade, sobre os corpos atuam frequentemente a força normal da superfície e a força de atrito, que se opõe ao deslizamento relativo das superfícies."}, "formulas": [{"sr": "Sila trenja: Ftr = μ·N", "en": "Friction force: Ftr = μ·N", "de": "Reibungskraft: Ftr = μ·N", "fr": "Force de frottement : Ftr = μ·N", "es": "Fuerza de rozamiento: Ftr = μ·N", "it": "Forza di attrito: Ftr = μ·N", "ru": "Сила трения: Fтр = μ·N", "pt": "Força de atrito: Fat = μ·N"}, {"sr": "Impuls tela: p = m·v", "en": "Momentum: p = m·v", "de": "Impuls: p = m·v", "fr": "Quantité de mouvement : p = m·v", "es": "Cantidad de movimiento: p = m·v", "it": "Quantità di moto: p = m·v", "ru": "Импульс тела: p = m·v", "pt": "Quantidade de movimento: p = m·v"}], "remember": {"sr": "Sila trenja ne zavisi od površine dodira, već od normalne sile i vrste površina (koeficijenta trenja μ).", "en": "The friction force does not depend on the contact area, but on the normal force and the type of surfaces (the coefficient of friction μ).", "de": "Die Reibungskraft hängt nicht von der Kontaktfläche ab, sondern von der Normalkraft und der Art der Oberflächen (dem Reibungskoeffizienten μ).", "fr": "La force de frottement ne dépend pas de la surface de contact, mais de la force normale et du type de surfaces (le coefficient de frottement μ).", "es": "La fuerza de rozamiento no depende del área de contacto, sino de la fuerza normal y del tipo de superficies (el coeficiente de rozamiento μ).", "it": "La forza di attrito non dipende dall'area di contatto, ma dalla forza normale e dal tipo di superfici (il coefficiente di attrito μ).", "ru": "Сила трения не зависит от площади соприкосновения, а зависит от нормальной силы и вида поверхностей (коэффициента трения μ).", "pt": "A força de atrito não depende da área de contacto, mas sim da força normal e do tipo de superfícies (o coeficiente de atrito μ)."}, "problem": {"statement": {"sr": "Sanke mase m = 10 kg kreću se po snegu. Koeficijent trenja je μ = 0,1. Kolika je sila trenja koja deluje na sanke? (g = 10 m/s²)", "en": "A sled of mass m = 10 kg moves over snow. The coefficient of friction is μ = 0.1. What is the friction force acting on the sled? (g = 10 m/s²)", "de": "Ein Schlitten mit der Masse m = 10 kg bewegt sich über Schnee. Der Reibungskoeffizient beträgt μ = 0,1. Wie groß ist die Reibungskraft, die auf den Schlitten wirkt? (g = 10 m/s²)", "fr": "Une luge de masse m = 10 kg se déplace sur la neige. Le coefficient de frottement est μ = 0,1. Quelle est la force de frottement qui agit sur la luge ? (g = 10 m/s²)", "es": "Un trineo de masa m = 10 kg se mueve sobre la nieve. El coeficiente de rozamiento es μ = 0,1. ¿Cuál es la fuerza de rozamiento que actúa sobre el trineo? (g = 10 m/s²)", "it": "Una slitta di massa m = 10 kg si muove sulla neve. Il coefficiente di attrito è μ = 0,1. Qual è la forza di attrito che agisce sulla slitta? (g = 10 m/s²)", "ru": "Санки массой m = 10 кг движутся по снегу. Коэффициент трения μ = 0,1. Чему равна сила трения, действующая на санки? (g = 10 м/с²)", "pt": "Um trenó de massa m = 10 kg move-se sobre a neve. O coeficiente de atrito é μ = 0,1. Qual é a força de atrito que atua sobre o trenó? (g = 10 m/s²)"}, "steps": [{"sr": "Normalna sila: N = m·g = 10·10 = 100 N.", "en": "Normal force: N = m·g = 10·10 = 100 N.", "de": "Normalkraft: N = m·g = 10·10 = 100 N.", "fr": "Force normale : N = m·g = 10·10 = 100 N.", "es": "Fuerza normal: N = m·g = 10·10 = 100 N.", "it": "Forza normale: N = m·g = 10·10 = 100 N.", "ru": "Нормальная сила: N = m·g = 10·10 = 100 Н.", "pt": "Força normal: N = m·g = 10·10 = 100 N."}, {"sr": "Sila trenja: Ftr = μ·N = 0,1·100 = 10 N.", "en": "Friction force: Ftr = μ·N = 0.1·100 = 10 N.", "de": "Reibungskraft: Ftr = μ·N = 0,1·100 = 10 N.", "fr": "Force de frottement : Ftr = μ·N = 0,1·100 = 10 N.", "es": "Fuerza de rozamiento: Ftr = μ·N = 0,1·100 = 10 N.", "it": "Forza di attrito: Ftr = μ·N = 0,1·100 = 10 N.", "ru": "Сила трения: Fтр = μ·N = 0,1·100 = 10 Н.", "pt": "Força de atrito: Fat = μ·N = 0,1·100 = 10 N."}, {"sr": "Odgovor: sila trenja iznosi 10 N i usmerena je suprotno kretanju sanki.", "en": "Answer: the friction force is 10 N and is directed opposite to the sled's motion.", "de": "Antwort: Die Reibungskraft beträgt 10 N und ist der Bewegung des Schlittens entgegengesetzt gerichtet.", "fr": "Réponse : la force de frottement est de 10 N et est dirigée à l'opposé du mouvement de la luge.", "es": "Respuesta: la fuerza de rozamiento es de 10 N y está dirigida en sentido contrario al movimiento del trineo.", "it": "Risposta: la forza di attrito è pari a 10 N ed è diretta in verso opposto al moto della slitta.", "ru": "Ответ: сила трения равна 10 Н и направлена противоположно движению санок.", "pt": "Resposta: a força de atrito é de 10 N e está orientada em sentido contrário ao movimento do trenó."}]}}, {"name": {"sr": "Njutnovi zakoni", "en": "Newton's Laws", "de": "Newtonsche Gesetze", "fr": "Lois de Newton", "es": "Leyes de Newton", "it": "Leggi di Newton", "ru": "Законы Ньютона", "pt": "Leis de Newton"}, "theory": {"sr": "<b>Njutnovi zakoni</b> su temelj klasične mehanike. Prvi zakon (zakon inercije) kaže da telo ostaje u mirovanju ili ravnomernom pravolinijskom kretanju dok na njega ne deluje sila. Drugi zakon povezuje silu, masu i ubrzanje. Treći zakon kaže da sile akcije i reakcije imaju jednak intenzitet, a suprotan smer.", "en": "<b>Newton's laws</b> are the foundation of classical mechanics. The first law (the law of inertia) states that a body remains at rest or in uniform straight-line motion unless acted on by a force. The second law relates force, mass and acceleration. The third law states that action and reaction forces have equal magnitude but opposite direction.", "de": "<b>Die Newtonschen Gesetze</b> sind die Grundlage der klassischen Mechanik. Das erste Gesetz (Trägheitsgesetz) besagt, dass ein Körper in Ruhe bleibt oder sich gleichförmig geradlinig bewegt, solange keine Kraft auf ihn wirkt. Das zweite Gesetz verknüpft Kraft, Masse und Beschleunigung. Das dritte Gesetz besagt, dass Aktions- und Reaktionskraft gleich groß, aber entgegengesetzt gerichtet sind.", "fr": "<b>Les lois de Newton</b> sont le fondement de la mécanique classique. La première loi (loi d'inertie) énonce qu'un corps reste au repos ou en mouvement rectiligne uniforme tant qu'aucune force n'agit sur lui. La deuxième loi relie la force, la masse et l'accélération. La troisième loi énonce que les forces d'action et de réaction ont la même intensité mais des sens opposés.", "es": "<b>Las leyes de Newton</b> son la base de la mecánica clásica. La primera ley (ley de la inercia) establece que un cuerpo permanece en reposo o en movimiento rectilíneo uniforme mientras no actúe sobre él ninguna fuerza. La segunda ley relaciona la fuerza, la masa y la aceleración. La tercera ley establece que las fuerzas de acción y reacción tienen igual intensidad y sentido opuesto.", "it": "<b>Le leggi di Newton</b> sono il fondamento della meccanica classica. La prima legge (legge d'inerzia) afferma che un corpo rimane in quiete o in moto rettilineo uniforme finché non agisce su di esso una forza. La seconda legge lega forza, massa e accelerazione. La terza legge afferma che le forze di azione e reazione hanno uguale intensità ma verso opposto.", "ru": "<b>Законы Ньютона</b> — основа классической механики. Первый закон (закон инерции) гласит, что тело сохраняет состояние покоя или равномерного прямолинейного движения, пока на него не подействует сила. Второй закон связывает силу, массу и ускорение. Третий закон гласит, что силы действия и противодействия равны по модулю и противоположны по направлению.", "pt": "<b>As leis de Newton</b> são a base da mecânica clássica. A primeira lei (lei da inércia) afirma que um corpo permanece em repouso ou em movimento retilíneo uniforme enquanto nenhuma força atuar sobre ele. A segunda lei relaciona a força, a massa e a aceleração. A terceira lei afirma que as forças de ação e reação têm igual intensidade e sentidos opostos."}, "formulas": [{"sr": "Drugi Njutnov zakon: F = m·a", "en": "Newton's second law: F = m·a", "de": "Zweites Newtonsches Gesetz: F = m·a", "fr": "Deuxième loi de Newton : F = m·a", "es": "Segunda ley de Newton: F = m·a", "it": "Seconda legge di Newton: F = m·a", "ru": "Второй закон Ньютона: F = m·a", "pt": "Segunda lei de Newton: F = m·a"}, {"sr": "Treći Njutnov zakon: F₁₂ = −F₂₁", "en": "Newton's third law: F₁₂ = −F₂₁", "de": "Drittes Newtonsches Gesetz: F₁₂ = −F₂₁", "fr": "Troisième loi de Newton : F₁₂ = −F₂₁", "es": "Tercera ley de Newton: F₁₂ = −F₂₁", "it": "Terza legge di Newton: F₁₂ = −F₂₁", "ru": "Третий закон Ньютона: F₁₂ = −F₂₁", "pt": "Terceira lei de Newton: F₁₂ = −F₂₁"}], "remember": {"sr": "Ubrzanje je uvek u smeru rezultujuće sile, a ne u smeru brzine — telo se može usporavati iako je sila stalna.", "en": "Acceleration is always in the direction of the resultant force, not necessarily of the velocity — a body can be slowing down even with a constant force.", "de": "Die Beschleunigung zeigt immer in Richtung der resultierenden Kraft, nicht unbedingt in Richtung der Geschwindigkeit — ein Körper kann trotz konstanter Kraft langsamer werden.", "fr": "L'accélération est toujours dans la direction de la force résultante, pas nécessairement de la vitesse — un corps peut ralentir même avec une force constante.", "es": "La aceleración siempre tiene la dirección de la fuerza resultante, no necesariamente de la velocidad — un cuerpo puede frenar aunque la fuerza sea constante.", "it": "L'accelerazione ha sempre la direzione della forza risultante, non necessariamente della velocità — un corpo può rallentare anche con una forza costante.", "ru": "Ускорение всегда направлено в сторону равнодействующей силы, а не обязательно скорости — тело может замедляться даже при постоянной силе.", "pt": "A aceleração tem sempre a direção da força resultante, não necessariamente da velocidade — um corpo pode estar a abrandar mesmo com uma força constante."}, "problem": {"statement": {"sr": "Na telo mase m = 4 kg deluje stalna sila F = 20 N. Koliko je ubrzanje tela?", "en": "A constant force F = 20 N acts on a body of mass m = 4 kg. What is the body's acceleration?", "de": "Auf einen Körper der Masse m = 4 kg wirkt eine konstante Kraft F = 20 N. Wie groß ist die Beschleunigung des Körpers?", "fr": "Une force constante F = 20 N agit sur un corps de masse m = 4 kg. Quelle est l'accélération du corps ?", "es": "Sobre un cuerpo de masa m = 4 kg actúa una fuerza constante F = 20 N. ¿Cuál es la aceleración del cuerpo?", "it": "Su un corpo di massa m = 4 kg agisce una forza costante F = 20 N. Qual è l'accelerazione del corpo?", "ru": "На тело массой m = 4 кг действует постоянная сила F = 20 Н. Чему равно ускорение тела?", "pt": "Sobre um corpo de massa m = 4 kg atua uma força constante F = 20 N. Qual é a aceleração do corpo?"}, "steps": [{"sr": "Iz drugog Njutnovog zakona: a = F/m.", "en": "From Newton's second law: a = F/m.", "de": "Aus dem zweiten Newtonschen Gesetz: a = F/m.", "fr": "D'après la deuxième loi de Newton : a = F/m.", "es": "De la segunda ley de Newton: a = F/m.", "it": "Dalla seconda legge di Newton: a = F/m.", "ru": "Из второго закона Ньютона: a = F/m.", "pt": "Da segunda lei de Newton: a = F/m."}, {"sr": "a = 20/4 = 5 m/s². Odgovor: telo se kreće sa ubrzanjem 5 m/s².", "en": "a = 20/4 = 5 m/s². Answer: the body moves with an acceleration of 5 m/s².", "de": "a = 20/4 = 5 m/s². Antwort: Der Körper bewegt sich mit einer Beschleunigung von 5 m/s².", "fr": "a = 20/4 = 5 m/s². Réponse : le corps se déplace avec une accélération de 5 m/s².", "es": "a = 20/4 = 5 m/s². Respuesta: el cuerpo se mueve con una aceleración de 5 m/s².", "it": "a = 20/4 = 5 m/s². Risposta: il corpo si muove con un'accelerazione di 5 m/s².", "ru": "a = 20/4 = 5 м/с². Ответ: тело движется с ускорением 5 м/с².", "pt": "a = 20/4 = 5 m/s². Resposta: o corpo move-se com uma aceleração de 5 m/s²."}]}}, {"name": {"sr": "Rad i energija", "en": "Work and Energy", "de": "Arbeit und Energie", "fr": "Travail et énergie", "es": "Trabajo y energía", "it": "Lavoro ed energia", "ru": "Работа и энергия", "pt": "Trabalho e energia"}, "theory": {"sr": "<b>Mehanički rad</b> vrši sila kada pomera telo duž nekog puta. Rad zavisi od intenziteta sile, pređenog puta i ugla između njih. <b>Energija</b> je sposobnost tela da izvrši rad — telo u kretanju poseduje kinetičku energiju, a telo na visini poseduje potencijalnu energiju. U odsustvu trenja, ukupna mehanička energija sistema se održava.", "en": "<b>Mechanical work</b> is done by a force when it moves a body along a path. The work depends on the magnitude of the force, the distance travelled and the angle between them. <b>Energy</b> is a body's ability to do work — a moving body possesses kinetic energy, while a body at a height possesses potential energy. In the absence of friction, the total mechanical energy of a system is conserved.", "de": "<b>Mechanische Arbeit</b> verrichtet eine Kraft, wenn sie einen Körper entlang eines Weges bewegt. Die Arbeit hängt vom Betrag der Kraft, dem zurückgelegten Weg und dem Winkel zwischen beiden ab. <b>Energie</b> ist die Fähigkeit eines Körpers, Arbeit zu verrichten — ein sich bewegender Körper besitzt kinetische Energie, ein Körper in einer bestimmten Höhe besitzt potentielle Energie. Ohne Reibung bleibt die gesamte mechanische Energie eines Systems erhalten.", "fr": "<b>Le travail mécanique</b> est effectué par une force lorsqu'elle déplace un corps le long d'un trajet. Le travail dépend de l'intensité de la force, de la distance parcourue et de l'angle entre elles. <b>L'énergie</b> est la capacité d'un corps à effectuer un travail — un corps en mouvement possède une énergie cinétique, tandis qu'un corps en hauteur possède une énergie potentielle. En l'absence de frottement, l'énergie mécanique totale d'un système se conserve.", "es": "<b>El trabajo mecánico</b> lo realiza una fuerza cuando desplaza un cuerpo a lo largo de un trayecto. El trabajo depende de la intensidad de la fuerza, la distancia recorrida y el ángulo entre ambas. <b>La energía</b> es la capacidad de un cuerpo para realizar trabajo — un cuerpo en movimiento posee energía cinética, mientras que un cuerpo a cierta altura posee energía potencial. En ausencia de rozamiento, la energía mecánica total de un sistema se conserva.", "it": "<b>Il lavoro meccanico</b> è compiuto da una forza quando sposta un corpo lungo un percorso. Il lavoro dipende dall'intensità della forza, dallo spazio percorso e dall'angolo tra essi. <b>L'energia</b> è la capacità di un corpo di compiere lavoro — un corpo in movimento possiede energia cinetica, mentre un corpo a una certa altezza possiede energia potenziale. In assenza di attrito, l'energia meccanica totale di un sistema si conserva.", "ru": "<b>Механическая работа</b> совершается силой, когда она перемещает тело вдоль пути. Работа зависит от модуля силы, пройденного пути и угла между ними. <b>Энергия</b> — способность тела совершать работу: движущееся тело обладает кинетической энергией, а тело на высоте — потенциальной энергией. При отсутствии трения полная механическая энергия системы сохраняется.", "pt": "<b>O trabalho mecânico</b> é realizado por uma força quando desloca um corpo ao longo de um percurso. O trabalho depende da intensidade da força, da distância percorrida e do ângulo entre elas. <b>A energia</b> é a capacidade de um corpo realizar trabalho — um corpo em movimento possui energia cinética, enquanto um corpo a certa altura possui energia potencial. Na ausência de atrito, a energia mecânica total de um sistema conserva-se."}, "formulas": [{"sr": "Rad sile: A = F·s·cosα", "en": "Work done by a force: A = F·s·cosα", "de": "Arbeit einer Kraft: A = F·s·cosα", "fr": "Travail d'une force : A = F·s·cosα", "es": "Trabajo de una fuerza: A = F·s·cosα", "it": "Lavoro di una forza: A = F·s·cosα", "ru": "Работа силы: A = F·s·cosα", "pt": "Trabalho de uma força: A = F·s·cosα"}, {"sr": "Kinetička energija: Ek = m·v²/2", "en": "Kinetic energy: Ek = m·v²/2", "de": "Kinetische Energie: Ek = m·v²/2", "fr": "Énergie cinétique : Ek = m·v²/2", "es": "Energía cinética: Ek = m·v²/2", "it": "Energia cinetica: Ek = m·v²/2", "ru": "Кинетическая энергия: Ek = m·v²/2", "pt": "Energia cinética: Ec = m·v²/2"}, {"sr": "Potencijalna energija: Ep = m·g·h", "en": "Potential energy: Ep = m·g·h", "de": "Potentielle Energie: Ep = m·g·h", "fr": "Énergie potentielle : Ep = m·g·h", "es": "Energía potencial: Ep = m·g·h", "it": "Energia potenziale: Ep = m·g·h", "ru": "Потенциальная энергия: Ep = m·g·h", "pt": "Energia potencial: Ep = m·g·h"}], "remember": {"sr": "Kada je sila upravna na pravac kretanja (α = 90°), njen rad je jednak nuli, jer je cos90° = 0.", "en": "When a force is perpendicular to the direction of motion (α = 90°), its work equals zero, because cos90° = 0.", "de": "Wenn eine Kraft senkrecht zur Bewegungsrichtung steht (α = 90°), ist ihre Arbeit gleich null, da cos90° = 0.", "fr": "Lorsqu'une force est perpendiculaire à la direction du mouvement (α = 90°), son travail est nul, car cos90° = 0.", "es": "Cuando una fuerza es perpendicular a la dirección del movimiento (α = 90°), su trabajo es igual a cero, porque cos90° = 0.", "it": "Quando una forza è perpendicolare alla direzione del moto (α = 90°), il suo lavoro è nullo, poiché cos90° = 0.", "ru": "Когда сила перпендикулярна направлению движения (α = 90°), её работа равна нулю, так как cos90° = 0.", "pt": "Quando uma força é perpendicular à direção do movimento (α = 90°), o seu trabalho é igual a zero, porque cos90° = 0."}, "problem": {"statement": {"sr": "Telo mase m = 2 kg pada sa visine h = 5 m. Kolika je njegova potencijalna energija na početku i kinetička energija neposredno pre udara o zemlju? (g = 10 m/s²)", "en": "A body of mass m = 2 kg falls from a height h = 5 m. What is its potential energy at the start and its kinetic energy just before hitting the ground? (g = 10 m/s²)", "de": "Ein Körper der Masse m = 2 kg fällt aus einer Höhe h = 5 m. Wie groß ist seine potentielle Energie zu Beginn und seine kinetische Energie unmittelbar vor dem Aufprall auf den Boden? (g = 10 m/s²)", "fr": "Un corps de masse m = 2 kg tombe d'une hauteur h = 5 m. Quelle est son énergie potentielle au départ et son énergie cinétique juste avant de toucher le sol ? (g = 10 m/s²)", "es": "Un cuerpo de masa m = 2 kg cae desde una altura h = 5 m. ¿Cuál es su energía potencial al inicio y su energía cinética justo antes de tocar el suelo? (g = 10 m/s²)", "it": "Un corpo di massa m = 2 kg cade da un'altezza h = 5 m. Qual è la sua energia potenziale all'inizio e la sua energia cinetica appena prima di toccare il suolo? (g = 10 m/s²)", "ru": "Тело массой m = 2 кг падает с высоты h = 5 м. Чему равна его потенциальная энергия в начале и кинетическая энергия непосредственно перед ударом о землю? (g = 10 м/с²)", "pt": "Um corpo de massa m = 2 kg cai de uma altura h = 5 m. Qual é a sua energia potencial no início e a sua energia cinética imediatamente antes de tocar o solo? (g = 10 m/s²)"}, "steps": [{"sr": "Ep = m·g·h = 2·10·5 = 100 J.", "en": "Ep = m·g·h = 2·10·5 = 100 J.", "de": "Ep = m·g·h = 2·10·5 = 100 J.", "fr": "Ep = m·g·h = 2·10·5 = 100 J.", "es": "Ep = m·g·h = 2·10·5 = 100 J.", "it": "Ep = m·g·h = 2·10·5 = 100 J.", "ru": "Ep = m·g·h = 2·10·5 = 100 Дж.", "pt": "Ep = m·g·h = 2·10·5 = 100 J."}, {"sr": "Prema zakonu održanja energije, sva potencijalna energija se pretvara u kinetičku: Ek = Ep = 100 J.", "en": "By the law of conservation of energy, all the potential energy converts into kinetic energy: Ek = Ep = 100 J.", "de": "Nach dem Energieerhaltungssatz wandelt sich die gesamte potentielle Energie in kinetische Energie um: Ek = Ep = 100 J.", "fr": "D'après la loi de conservation de l'énergie, toute l'énergie potentielle se transforme en énergie cinétique : Ek = Ep = 100 J.", "es": "Según la ley de conservación de la energía, toda la energía potencial se transforma en energía cinética: Ek = Ep = 100 J.", "it": "Secondo la legge di conservazione dell'energia, tutta l'energia potenziale si trasforma in energia cinetica: Ek = Ep = 100 J.", "ru": "По закону сохранения энергии вся потенциальная энергия переходит в кинетическую: Ek = Ep = 100 Дж.", "pt": "Pela lei da conservação da energia, toda a energia potencial converte-se em energia cinética: Ec = Ep = 100 J."}, {"sr": "Odgovor: početna potencijalna energija je 100 J, a kinetička energija tik pred udar takođe iznosi 100 J.", "en": "Answer: the initial potential energy is 100 J, and the kinetic energy just before impact is also 100 J.", "de": "Antwort: Die anfängliche potentielle Energie beträgt 100 J, und die kinetische Energie unmittelbar vor dem Aufprall beträgt ebenfalls 100 J.", "fr": "Réponse : l'énergie potentielle initiale est de 100 J, et l'énergie cinétique juste avant l'impact est également de 100 J.", "es": "Respuesta: la energía potencial inicial es de 100 J, y la energía cinética justo antes del impacto también es de 100 J.", "it": "Risposta: l'energia potenziale iniziale è di 100 J, e anche l'energia cinetica appena prima dell'impatto è di 100 J.", "ru": "Ответ: начальная потенциальная энергия равна 100 Дж, а кинетическая энергия непосредственно перед ударом также равна 100 Дж.", "pt": "Resposta: a energia potencial inicial é de 100 J, e a energia cinética imediatamente antes do impacto também é de 100 J."}]}}, {"name": {"sr": "Statika", "en": "Statics", "de": "Statik", "fr": "Statique", "es": "Estática", "it": "Statica", "ru": "Статика", "pt": "Estática"}, "theory": {"sr": "<b>Statika</b> proučava uslove ravnoteže tela koja miruju. Telo je u ravnoteži ako je zbir svih sila koje na njega deluju jednak nuli i ako je zbir svih momenata sila jednak nuli. Moment sile zavisi od intenziteta sile i kraka — najkraćeg rastojanja od ose obrtanja do pravca dejstva sile.", "en": "<b>Statics</b> studies the equilibrium conditions of bodies at rest. A body is in equilibrium if the sum of all forces acting on it equals zero and the sum of all moments of force equals zero. The moment of a force depends on the magnitude of the force and the arm — the shortest distance from the axis of rotation to the line of action of the force.", "de": "<b>Die Statik</b> untersucht die Gleichgewichtsbedingungen ruhender Körper. Ein Körper ist im Gleichgewicht, wenn die Summe aller auf ihn wirkenden Kräfte gleich null ist und die Summe aller Drehmomente gleich null ist. Das Drehmoment einer Kraft hängt vom Betrag der Kraft und dem Hebelarm ab — dem kürzesten Abstand von der Drehachse zur Wirkungslinie der Kraft.", "fr": "<b>La statique</b> étudie les conditions d'équilibre des corps au repos. Un corps est en équilibre si la somme de toutes les forces qui agissent sur lui est nulle et si la somme de tous les moments de force est nulle. Le moment d'une force dépend de l'intensité de la force et du bras de levier — la distance la plus courte entre l'axe de rotation et la ligne d'action de la force.", "es": "<b>La estática</b> estudia las condiciones de equilibrio de los cuerpos en reposo. Un cuerpo está en equilibrio si la suma de todas las fuerzas que actúan sobre él es igual a cero y la suma de todos los momentos de fuerza es igual a cero. El momento de una fuerza depende de la intensidad de la fuerza y del brazo — la distancia más corta desde el eje de rotación hasta la línea de acción de la fuerza.", "it": "<b>La statica</b> studia le condizioni di equilibrio dei corpi in quiete. Un corpo è in equilibrio se la somma di tutte le forze che agiscono su di esso è uguale a zero e la somma di tutti i momenti delle forze è uguale a zero. Il momento di una forza dipende dall'intensità della forza e dal braccio — la distanza più breve dall'asse di rotazione alla retta d'azione della forza.", "ru": "<b>Статика</b> изучает условия равновесия покоящихся тел. Тело находится в равновесии, если сумма всех действующих на него сил равна нулю и сумма всех моментов сил равна нулю. Момент силы зависит от модуля силы и плеча — кратчайшего расстояния от оси вращения до линии действия силы.", "pt": "<b>A estática</b> estuda as condições de equilíbrio dos corpos em repouso. Um corpo está em equilíbrio se a soma de todas as forças que atuam sobre ele for igual a zero e a soma de todos os momentos de força for igual a zero. O momento de uma força depende da intensidade da força e do braço — a distância mais curta entre o eixo de rotação e a linha de ação da força."}, "formulas": [{"sr": "Uslov ravnoteže sila: ΣF = 0", "en": "Force equilibrium condition: ΣF = 0", "de": "Kräftegleichgewichtsbedingung: ΣF = 0", "fr": "Condition d'équilibre des forces : ΣF = 0", "es": "Condición de equilibrio de fuerzas: ΣF = 0", "it": "Condizione di equilibrio delle forze: ΣF = 0", "ru": "Условие равновесия сил: ΣF = 0", "pt": "Condição de equilíbrio de forças: ΣF = 0"}, {"sr": "Moment sile: M = F·d", "en": "Moment of force: M = F·d", "de": "Drehmoment: M = F·d", "fr": "Moment de force : M = F·d", "es": "Momento de fuerza: M = F·d", "it": "Momento della forza: M = F·d", "ru": "Момент силы: M = F·d", "pt": "Momento de força: M = F·d"}], "remember": {"sr": "Krak sile d meri se kao najkraće (upravno) rastojanje od ose obrtanja do pravca sile, ne od ose do napadne tačke.", "en": "The force arm d is measured as the shortest (perpendicular) distance from the axis of rotation to the line of action of the force, not from the axis to the point of application.", "de": "Der Hebelarm d wird als kürzester (senkrechter) Abstand von der Drehachse zur Wirkungslinie der Kraft gemessen, nicht von der Achse zum Angriffspunkt.", "fr": "Le bras de levier d se mesure comme la distance la plus courte (perpendiculaire) entre l'axe de rotation et la ligne d'action de la force, et non entre l'axe et le point d'application.", "es": "El brazo de la fuerza d se mide como la distancia más corta (perpendicular) desde el eje de rotación hasta la línea de acción de la fuerza, no desde el eje hasta el punto de aplicación.", "it": "Il braccio della forza d si misura come la distanza più breve (perpendicolare) dall'asse di rotazione alla retta d'azione della forza, non dall'asse al punto di applicazione.", "ru": "Плечо силы d измеряется как кратчайшее (перпендикулярное) расстояние от оси вращения до линии действия силы, а не от оси до точки приложения.", "pt": "O braço da força d mede-se como a distância mais curta (perpendicular) entre o eixo de rotação e a linha de ação da força, e não entre o eixo e o ponto de aplicação."}, "problem": {"statement": {"sr": "Na polugu deluje sila F = 40 N na kraku d = 0,5 m od oslonca. Kolika sila F₂ na drugom kraku d₂ = 1 m drži polugu u ravnoteži?", "en": "A force F = 40 N acts on a lever at an arm d = 0.5 m from the pivot. What force F₂ at the other arm d₂ = 1 m keeps the lever in equilibrium?", "de": "Auf einen Hebel wirkt eine Kraft F = 40 N an einem Hebelarm d = 0,5 m vom Drehpunkt. Welche Kraft F₂ am anderen Hebelarm d₂ = 1 m hält den Hebel im Gleichgewicht?", "fr": "Une force F = 40 N agit sur un levier à un bras d = 0,5 m du point d'appui. Quelle force F₂ à l'autre bras d₂ = 1 m maintient le levier en équilibre ?", "es": "Sobre una palanca actúa una fuerza F = 40 N en un brazo d = 0,5 m desde el punto de apoyo. ¿Qué fuerza F₂ en el otro brazo d₂ = 1 m mantiene la palanca en equilibrio?", "it": "Su una leva agisce una forza F = 40 N a un braccio d = 0,5 m dal fulcro. Quale forza F₂ sull'altro braccio d₂ = 1 m mantiene la leva in equilibrio?", "ru": "На рычаг действует сила F = 40 Н на плече d = 0,5 м от точки опоры. Какая сила F₂ на другом плече d₂ = 1 м удерживает рычаг в равновесии?", "pt": "Sobre uma alavanca atua uma força F = 40 N a um braço d = 0,5 m do ponto de apoio. Que força F₂ no outro braço d₂ = 1 m mantém a alavanca em equilíbrio?"}, "steps": [{"sr": "Uslov ravnoteže poluge: F·d = F₂·d₂.", "en": "Lever equilibrium condition: F·d = F₂·d₂.", "de": "Gleichgewichtsbedingung des Hebels: F·d = F₂·d₂.", "fr": "Condition d'équilibre du levier : F·d = F₂·d₂.", "es": "Condición de equilibrio de la palanca: F·d = F₂·d₂.", "it": "Condizione di equilibrio della leva: F·d = F₂·d₂.", "ru": "Условие равновесия рычага: F·d = F₂·d₂.", "pt": "Condição de equilíbrio da alavanca: F·d = F₂·d₂."}, {"sr": "F₂ = F·d/d₂ = 40·0,5/1 = 20 N.", "en": "F₂ = F·d/d₂ = 40·0.5/1 = 20 N.", "de": "F₂ = F·d/d₂ = 40·0,5/1 = 20 N.", "fr": "F₂ = F·d/d₂ = 40·0,5/1 = 20 N.", "es": "F₂ = F·d/d₂ = 40·0,5/1 = 20 N.", "it": "F₂ = F·d/d₂ = 40·0,5/1 = 20 N.", "ru": "F₂ = F·d/d₂ = 40·0,5/1 = 20 Н.", "pt": "F₂ = F·d/d₂ = 40·0,5/1 = 20 N."}, {"sr": "Odgovor: potrebna sila na drugom kraku iznosi 20 N.", "en": "Answer: the required force at the other arm is 20 N.", "de": "Antwort: Die erforderliche Kraft am anderen Hebelarm beträgt 20 N.", "fr": "Réponse : la force requise à l'autre bras est de 20 N.", "es": "Respuesta: la fuerza necesaria en el otro brazo es de 20 N.", "it": "Risposta: la forza necessaria sull'altro braccio è di 20 N.", "ru": "Ответ: требуемая сила на другом плече составляет 20 Н.", "pt": "Resposta: a força necessária no outro braço é de 20 N."}]}}, {"name": {"sr": "Gravitacija", "en": "Gravitation", "de": "Gravitation", "fr": "Gravitation", "es": "Gravitación", "it": "Gravitazione", "ru": "Гравитация", "pt": "Gravitação"}, "theory": {"sr": "<b>Njutnov zakon gravitacije</b> kaže da se svaka dva tela privlače silom srazmernom proizvodu njihovih masa, a obrnuto srazmernom kvadratu rastojanja između njih. Ova sila je odgovorna za kretanje planeta oko Sunca, kao i za silu teže na površini Zemlje.", "en": "<b>Newton's law of gravitation</b> states that any two bodies attract each other with a force proportional to the product of their masses and inversely proportional to the square of the distance between them. This force is responsible for the motion of planets around the Sun, as well as for gravity at the Earth's surface.", "de": "<b>Das Newtonsche Gravitationsgesetz</b> besagt, dass sich zwei beliebige Körper mit einer Kraft anziehen, die proportional zum Produkt ihrer Massen und umgekehrt proportional zum Quadrat des Abstands zwischen ihnen ist. Diese Kraft ist verantwortlich für die Bewegung der Planeten um die Sonne sowie für die Schwerkraft an der Erdoberfläche.", "fr": "<b>La loi de gravitation de Newton</b> énonce que deux corps quelconques s'attirent avec une force proportionnelle au produit de leurs masses et inversement proportionnelle au carré de la distance qui les sépare. Cette force est responsable du mouvement des planètes autour du Soleil, ainsi que de la pesanteur à la surface de la Terre.", "es": "<b>La ley de gravitación de Newton</b> establece que dos cuerpos cualesquiera se atraen con una fuerza proporcional al producto de sus masas e inversamente proporcional al cuadrado de la distancia entre ellos. Esta fuerza es responsable del movimiento de los planetas alrededor del Sol, así como de la gravedad en la superficie de la Tierra.", "it": "<b>La legge di gravitazione di Newton</b> afferma che due corpi qualsiasi si attraggono con una forza proporzionale al prodotto delle loro masse e inversamente proporzionale al quadrato della distanza tra essi. Questa forza è responsabile del moto dei pianeti intorno al Sole, nonché della forza di gravità sulla superficie terrestre.", "ru": "<b>Закон всемирного тяготения Ньютона</b> гласит, что любые два тела притягиваются с силой, пропорциональной произведению их масс и обратно пропорциональной квадрату расстояния между ними. Эта сила отвечает за движение планет вокруг Солнца, а также за силу тяжести на поверхности Земли.", "pt": "<b>A lei da gravitação de Newton</b> afirma que quaisquer dois corpos se atraem com uma força proporcional ao produto das suas massas e inversamente proporcional ao quadrado da distância entre eles. Esta força é responsável pelo movimento dos planetas em torno do Sol, bem como pela gravidade à superfície da Terra."}, "formulas": [{"sr": "Gravitaciona sila: F = G·m₁·m₂/r²", "en": "Gravitational force: F = G·m₁·m₂/r²", "de": "Gravitationskraft: F = G·m₁·m₂/r²", "fr": "Force gravitationnelle : F = G·m₁·m₂/r²", "es": "Fuerza gravitacional: F = G·m₁·m₂/r²", "it": "Forza gravitazionale: F = G·m₁·m₂/r²", "ru": "Сила гравитации: F = G·m₁·m₂/r²", "pt": "Força gravitacional: F = G·m₁·m₂/r²"}, {"sr": "Gravitaciono ubrzanje: g = G·M/r²", "en": "Gravitational acceleration: g = G·M/r²", "de": "Fallbeschleunigung: g = G·M/r²", "fr": "Accélération gravitationnelle : g = G·M/r²", "es": "Aceleración gravitacional: g = G·M/r²", "it": "Accelerazione di gravità: g = G·M/r²", "ru": "Ускорение свободного падения: g = G·M/r²", "pt": "Aceleração gravitacional: g = G·M/r²"}], "remember": {"sr": "Gravitaciona konstanta G = 6,67·10⁻¹¹ N·m²/kg² je ista svuda u Vasioni, dok se g menja u zavisnosti od mase i poluprečnika nebeskog tela.", "en": "The gravitational constant G = 6.67·10⁻¹¹ N·m²/kg² is the same everywhere in the Universe, while g varies depending on the mass and radius of the celestial body.", "de": "Die Gravitationskonstante G = 6,67·10⁻¹¹ N·m²/kg² ist überall im Universum gleich, während g von Masse und Radius des Himmelskörpers abhängt und sich ändert.", "fr": "La constante de gravitation G = 6,67·10⁻¹¹ N·m²/kg² est la même partout dans l'Univers, tandis que g varie selon la masse et le rayon du corps céleste.", "es": "La constante de gravitación G = 6,67·10⁻¹¹ N·m²/kg² es la misma en todo el Universo, mientras que g varía según la masa y el radio del cuerpo celeste.", "it": "La costante di gravitazione G = 6,67·10⁻¹¹ N·m²/kg² è la stessa in tutto l'Universo, mentre g varia in base alla massa e al raggio del corpo celeste.", "ru": "Гравитационная постоянная G = 6,67·10⁻¹¹ Н·м²/кг² одинакова везде во Вселенной, тогда как g изменяется в зависимости от массы и радиуса небесного тела.", "pt": "A constante gravitacional G = 6,67·10⁻¹¹ N·m²/kg² é a mesma em todo o Universo, enquanto g varia consoante a massa e o raio do corpo celeste."}, "problem": {"statement": {"sr": "Masa Zemlje je M = 6·10²⁴ kg, a njen poluprečnik R = 6,4·10⁶ m. Izračunaj gravitaciono ubrzanje na površini Zemlje. (G = 6,67·10⁻¹¹ N·m²/kg²)", "en": "The mass of the Earth is M = 6·10²⁴ kg, and its radius is R = 6.4·10⁶ m. Calculate the gravitational acceleration at the Earth's surface. (G = 6.67·10⁻¹¹ N·m²/kg²)", "de": "Die Masse der Erde beträgt M = 6·10²⁴ kg und ihr Radius R = 6,4·10⁶ m. Berechne die Fallbeschleunigung an der Erdoberfläche. (G = 6,67·10⁻¹¹ N·m²/kg²)", "fr": "La masse de la Terre est M = 6·10²⁴ kg et son rayon R = 6,4·10⁶ m. Calcule l'accélération gravitationnelle à la surface de la Terre. (G = 6,67·10⁻¹¹ N·m²/kg²)", "es": "La masa de la Tierra es M = 6·10²⁴ kg, y su radio es R = 6,4·10⁶ m. Calcula la aceleración gravitacional en la superficie de la Tierra. (G = 6,67·10⁻¹¹ N·m²/kg²)", "it": "La massa della Terra è M = 6·10²⁴ kg e il suo raggio è R = 6,4·10⁶ m. Calcola l'accelerazione di gravità sulla superficie terrestre. (G = 6,67·10⁻¹¹ N·m²/kg²)", "ru": "Масса Земли M = 6·10²⁴ кг, а её радиус R = 6,4·10⁶ м. Вычисли ускорение свободного падения на поверхности Земли. (G = 6,67·10⁻¹¹ Н·м²/кг²)", "pt": "A massa da Terra é M = 6·10²⁴ kg, e o seu raio é R = 6,4·10⁶ m. Calcula a aceleração gravitacional à superfície da Terra. (G = 6,67·10⁻¹¹ N·m²/kg²)"}, "steps": [{"sr": "Primenjujemo formulu: g = G·M/R².", "en": "We apply the formula: g = G·M/R².", "de": "Wir wenden die Formel an: g = G·M/R².", "fr": "On applique la formule : g = G·M/R².", "es": "Aplicamos la fórmula: g = G·M/R².", "it": "Applichiamo la formula: g = G·M/R².", "ru": "Применяем формулу: g = G·M/R².", "pt": "Aplicamos a fórmula: g = G·M/R²."}, {"sr": "g = (6,67·10⁻¹¹·6·10²⁴)/(6,4·10⁶)² ≈ 9,8 m/s².", "en": "g = (6.67·10⁻¹¹·6·10²⁴)/(6.4·10⁶)² ≈ 9.8 m/s².", "de": "g = (6,67·10⁻¹¹·6·10²⁴)/(6,4·10⁶)² ≈ 9,8 m/s².", "fr": "g = (6,67·10⁻¹¹·6·10²⁴)/(6,4·10⁶)² ≈ 9,8 m/s².", "es": "g = (6,67·10⁻¹¹·6·10²⁴)/(6,4·10⁶)² ≈ 9,8 m/s².", "it": "g = (6,67·10⁻¹¹·6·10²⁴)/(6,4·10⁶)² ≈ 9,8 m/s².", "ru": "g = (6,67·10⁻¹¹·6·10²⁴)/(6,4·10⁶)² ≈ 9,8 м/с².", "pt": "g = (6,67·10⁻¹¹·6·10²⁴)/(6,4·10⁶)² ≈ 9,8 m/s²."}, {"sr": "Odgovor: gravitaciono ubrzanje na površini Zemlje iznosi približno 9,8 m/s², što odgovara poznatoj vrednosti g.", "en": "Answer: the gravitational acceleration at the Earth's surface is approximately 9.8 m/s², which matches the well-known value of g.", "de": "Antwort: Die Fallbeschleunigung an der Erdoberfläche beträgt etwa 9,8 m/s², was dem bekannten Wert von g entspricht.", "fr": "Réponse : l'accélération gravitationnelle à la surface de la Terre est d'environ 9,8 m/s², ce qui correspond à la valeur bien connue de g.", "es": "Respuesta: la aceleración gravitacional en la superficie de la Tierra es de aproximadamente 9,8 m/s², lo que coincide con el valor conocido de g.", "it": "Risposta: l'accelerazione di gravità sulla superficie terrestre è di circa 9,8 m/s², in linea con il noto valore di g.", "ru": "Ответ: ускорение свободного падения на поверхности Земли составляет примерно 9,8 м/с², что соответствует известному значению g.", "pt

<!doctype html>

<head>

<title>Mathia — Mala matura · Matematika · Skripta</title>

<style>
:root{--cream:#FBF6EE;--ink:#5A1024;--ink2:#7A3346;--gold:#C6A05C;--goldlt:#F0DCA8;--malina:#B01E48;--malina2:#CC5E7E;--mint:#3FB98C;--muted:#8A7A80}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#43303A;min-height:100vh;
 background:radial-gradient(520px 400px at 104% -6%,#F6E1EC 0,transparent 56%),radial-gradient(500px 380px at -6% 106%,#F7ECD6 0,transparent 58%),var(--cream);overflow-x:hidden}
#fall{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fall span{position:absolute;top:-8%;font-family:'Spectral',serif;font-style:italic;color:rgba(198,160,92,.22);animation:fl linear infinite}
#fall span.m{color:rgba(176,30,72,.16)}
@keyframes fl{0%{transform:translateY(-10vh) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(112vh) rotate(24deg);opacity:0}}
.wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:14px 16px 30px}
.top{display:flex;align-items:center;gap:10px;padding:4px 2px 10px}
.top .back{color:var(--ink2);text-decoration:none;font-weight:800;font-size:1.1rem}
.top .lang{margin-left:auto;border:1px solid var(--goldlt);border-radius:100px;padding:5px 10px;font-family:inherit;font-weight:800;font-size:.72rem;color:var(--ink);background:#fff}
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:#E6D5CE;transition:.3s}
.dots i.on{background:linear-gradient(90deg,var(--gold),var(--malina));transform:scale(1.25)}
.dots i.done{background:var(--goldlt)}
.stage{position:relative;min-height:62vh}
.card{position:relative;background:linear-gradient(180deg,#FFFDF9,#FDF3EA);border:1px solid var(--goldlt);border-radius:32px;
 padding:26px 22px 22px;box-shadow:0 30px 70px -34px rgba(90,16,36,.5);animation:slidein .45s cubic-bezier(.2,.9,.2,1)}
@keyframes slidein{0%{transform:translateX(28px) scale(.97);opacity:0}100%{transform:translateX(0) scale(1);opacity:1}}
.eyebrow{text-align:center;font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:.64rem;color:var(--malina)}
.mascot{width:82px;height:82px;margin:8px auto 4px;border-radius:50%;display:grid;place-items:center;font-size:2.6rem;background:radial-gradient(circle at 40% 34%,#FFF3F7,#F6E1EC);border:2px solid var(--goldlt);box-shadow:0 14px 28px -12px rgba(176,30,72,.4);animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.tnum{text-align:center;color:var(--muted);font-weight:800;font-size:.78rem;margin-top:6px}
.ttl{font-family:'Spectral',serif;font-weight:700;color:var(--ink);font-size:1.75rem;text-align:center;line-height:1.2;margin:2px 0 8px}
.theory{color:#5a4750;font-size:1.02rem;text-align:center;line-height:1.55;margin:0 auto 14px;max-width:460px}
.theory b{color:var(--ink)}
.fx{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 4px}
.fx span{display:inline-block;background:#fff;border:1px dashed var(--goldlt);border-radius:14px;padding:9px 14px;font-family:'Spectral','Cambria Math',Georgia,serif;color:var(--ink);font-size:1.05rem;animation:pop .4s both}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.zap{margin:16px auto 2px;max-width:460px;background:linear-gradient(180deg,#FFF7FA,#FBEEF2);border:1px solid #F0D6DF;border-radius:18px;padding:13px 16px;display:flex;gap:10px;align-items:flex-start}
.zap .st{font-size:1.4rem;line-height:1}
.zap p{margin:0;color:var(--ink2);font-size:.95rem;font-weight:600}
.nav{display:flex;align-items:center;gap:12px;margin-top:16px}
.nav .prev{background:none;border:none;color:var(--ink2);font-weight:800;cursor:pointer;font-size:1rem;padding:8px}
.nav .next{flex:1;border:none;cursor:pointer;background:linear-gradient(135deg,var(--malina2),var(--malina));color:#fff;font-weight:900;font-size:1.05rem;padding:14px;border-radius:100px;box-shadow:0 16px 30px -14px rgba(176,30,72,.6);transition:transform .15s}
.nav .next:hover{transform:translateY(-2px)}
.fin{text-align:center}
.fin .big{font-size:3.4rem}
.fin h2{font-family:'Spectral',serif;color:var(--ink);font-size:1.9rem;margin:4px 0}
.fin p{color:var(--ink2)}
.fin .cta{display:block;margin-top:12px;text-decoration:none;text-align:center;background:linear-gradient(135deg,var(--malina2),var(--malina));color:#fff;font-weight:900;padding:14px;border-radius:100px;box-shadow:0 16px 30px -14px rgba(176,30,72,.6)}
.fin .cta2{display:block;margin-top:10px;text-decoration:none;color:var(--ink2);font-weight:800}
#conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#conf i{position:absolute;top:-6%;width:10px;height:14px;border-radius:2px;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(560deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
var D={"eyebrow": {"sr": "Mala matura · Matematika", "en": "Final Exam · Mathematics", "de": "Abschlussprüfung · Mathematik", "fr": "Examen final · Mathématiques", "es": "Examen final · Matemáticas", "it": "Esame finale · Matematica", "ru": "Итоговый экзамен · Математика", "pt": "Exame final · Matemática"}, "topics": [{"name": {"sr": "Brojevi i operacije", "en": "Numbers and Operations", "de": "Zahlen und Rechenoperationen", "fr": "Nombres et opérations", "es": "Números y operaciones", "it": "Numeri e operazioni", "ru": "Числа и операции", "pt": "Números e operações"}, "theory": {"sr": "<b>Skupovi brojeva.</b> Prirodni brojevi (N), celi brojevi (Z) i racionalni brojevi (Q). <b>Redosled računskih operacija:</b> prvo zagrade, zatim stepenovanje i korenovanje, pa množenje i deljenje (s leva na desno), na kraju sabiranje i oduzimanje. <b>Deljivost.</b> Prost broj ima tačno dva delioca (1 i sebe), složen broj ima više od dva delioca. NZD (najveći zajednički delilac) i NZS (najmanji zajednički sadržalac) koriste se pri radu sa razlomcima.", "en": "<b>Number sets.</b> Natural numbers (N), integers (Z) and rational numbers (Q). <b>Order of operations:</b> first parentheses, then powers and roots, then multiplication and division (left to right), and finally addition and subtraction. <b>Divisibility.</b> A prime number has exactly two divisors (1 and itself), a composite number has more than two divisors. GCD (greatest common divisor) and LCM (least common multiple) are used when working with fractions.", "de": "<b>Zahlenmengen.</b> Natürliche Zahlen (N), ganze Zahlen (Z) und rationale Zahlen (Q). <b>Reihenfolge der Rechenoperationen:</b> zuerst Klammern, dann Potenzen und Wurzeln, dann Multiplikation und Division (von links nach rechts), zuletzt Addition und Subtraktion. <b>Teilbarkeit.</b> Eine Primzahl hat genau zwei Teiler (1 und sich selbst), eine zusammengesetzte Zahl hat mehr als zwei Teiler. ggT (größter gemeinsamer Teiler) und kgV (kleinstes gemeinsames Vielfaches) werden beim Rechnen mit Brüchen verwendet.", "fr": "<b>Ensembles de nombres.</b> Nombres naturels (N), nombres entiers (Z) et nombres rationnels (Q). <b>Ordre des opérations :</b> d'abord les parenthèses, puis les puissances et les racines, puis la multiplication et la division (de gauche à droite), enfin l'addition et la soustraction. <b>Divisibilité.</b> Un nombre premier a exactement deux diviseurs (1 et lui-même), un nombre composé a plus de deux diviseurs. Le PGCD (plus grand diviseur commun) et le PPCM (plus petit multiple commun) sont utilisés pour les fractions.", "es": "<b>Conjuntos numéricos.</b> Números naturales (N), números enteros (Z) y números racionales (Q). <b>Orden de las operaciones:</b> primero los paréntesis, luego las potencias y raíces, luego la multiplicación y la división (de izquierda a derecha), y por último la suma y la resta. <b>Divisibilidad.</b> Un número primo tiene exactamente dos divisores (1 y él mismo), un número compuesto tiene más de dos divisores. El MCD (máximo común divisor) y el mcm (mínimo común múltiplo) se usan al trabajar con fracciones.", "it": "<b>Insiemi numerici.</b> Numeri naturali (N), numeri interi (Z) e numeri razionali (Q). <b>Ordine delle operazioni:</b> prima le parentesi, poi le potenze e le radici, poi la moltiplicazione e la divisione (da sinistra a destra), infine l'addizione e la sottrazione. <b>Divisibilità.</b> Un numero primo ha esattamente due divisori (1 e se stesso), un numero composto ha più di due divisori. MCD (massimo comune divisore) e mcm (minimo comune multiplo) si usano lavorando con le frazioni.", "ru": "<b>Числовые множества.</b> Натуральные числа (N), целые числа (Z) и рациональные числа (Q). <b>Порядок операций:</b> сначала скобки, затем степени и корни, затем умножение и деление (слева направо), в конце сложение и вычитание. <b>Делимость.</b> Простое число имеет ровно два делителя (1 и само себя), составное число имеет более двух делителей. НОД (наибольший общий делитель) и НОК (наименьшее общее кратное) используются при работе с дробями.", "pt": "<b>Conjuntos numéricos.</b> Números naturais (N), números inteiros (Z) e números racionais (Q). <b>Ordem das operações:</b> primeiro os parênteses, depois as potências e raízes, depois a multiplicação e a divisão (da esquerda para a direita), por fim a adição e a subtração. <b>Divisibilidade.</b> Um número primo tem exatamente dois divisores (1 e ele mesmo), um número composto tem mais de dois divisores. O MDC (máximo divisor comum) e o MMC (mínimo múltiplo comum) são usados ao trabalhar com frações."}, "formulas": [{"sr": "Množenje stepena istih osnova: a^m · a^n = a^(m+n)", "en": "Multiplying powers with the same base: a^m · a^n = a^(m+n)", "de": "Multiplikation von Potenzen mit gleicher Basis: a^m · a^n = a^(m+n)", "fr": "Multiplication de puissances de même base : a^m · a^n = a^(m+n)", "es": "Multiplicación de potencias de igual base: a^m · a^n = a^(m+n)", "it": "Moltiplicazione di potenze con la stessa base: a^m · a^n = a^(m+n)", "ru": "Умножение степеней с одинаковым основанием: a^m · a^n = a^(m+n)", "pt": "Multiplicação de potências com a mesma base: a^m · a^n = a^(m+n)"}, {"sr": "Stepen stepena: (a^m)^n = a^(m·n)", "en": "Power of a power: (a^m)^n = a^(m·n)", "de": "Potenz einer Potenz: (a^m)^n = a^(m·n)", "fr": "Puissance d'une puissance : (a^m)^n = a^(m·n)", "es": "Potencia de una potencia: (a^m)^n = a^(m·n)", "it": "Potenza di potenza: (a^m)^n = a^(m·n)", "ru": "Степень степени: (a^m)^n = a^(m·n)", "pt": "Potência de uma potência: (a^m)^n = a^(m·n)"}, {"sr": "Veza NZD i NZS: NZD(a,b) · NZS(a,b) = a·b", "en": "Relation between GCD and LCM: GCD(a,b) · LCM(a,b) = a·b", "de": "Zusammenhang zwischen ggT und kgV: ggT(a,b) · kgV(a,b) = a·b", "fr": "Relation entre PGCD et PPCM : PGCD(a,b) · PPCM(a,b) = a·b", "es": "Relación entre MCD y mcm: MCD(a,b) · mcm(a,b) = a·b", "it": "Relazione tra MCD e mcm: MCD(a,b) · mcm(a,b) = a·b", "ru": "Связь НОД и НОК: НОД(a,b) · НОК(a,b) = a·b", "pt": "Relação entre MDC e MMC: MDC(a,b) · MMC(a,b) = a·b"}], "remember": {"sr": "Zapamti redosled: zagrade → stepeni i koreni → množenje i deljenje → sabiranje i oduzimanje.", "en": "Remember the order: parentheses → powers and roots → multiplication and division → addition and subtraction.", "de": "Merke dir die Reihenfolge: Klammern → Potenzen und Wurzeln → Multiplikation und Division → Addition und Subtraktion.", "fr": "Retiens l'ordre : parenthèses → puissances et racines → multiplication et division → addition et soustraction.", "es": "Recuerda el orden: paréntesis → potencias y raíces → multiplicación y división → suma y resta.", "it": "Ricorda l'ordine: parentesi → potenze e radici → moltiplicazione e divisione → addizione e sottrazione.", "ru": "Запомни порядок: скобки → степени и корни → умножение и деление → сложение и вычитание.", "pt": "Lembra a ordem: parênteses → potências e raízes → multiplicação e divisão → adição e subtração."}, "problem": {"statement": {"sr": "Izračunaj vrednost izraza: 3² + 12 : 4 − 2 · (5 − 3)", "en": "Calculate the value of the expression: 3² + 12 : 4 − 2 · (5 − 3)", "de": "Berechne den Wert des Ausdrucks: 3² + 12 : 4 − 2 · (5 − 3)", "fr": "Calcule la valeur de l'expression : 3² + 12 : 4 − 2 · (5 − 3)", "es": "Calcula el valor de la expresión: 3² + 12 : 4 − 2 · (5 − 3)", "it": "Calcola il valore dell'espressione: 3² + 12 : 4 − 2 · (5 − 3)", "ru": "Вычисли значение выражения: 3² + 12 : 4 − 2 · (5 − 3)", "pt": "Calcula o valor da expressão: 3² + 12 : 4 − 2 · (5 − 3)"}, "steps": [{"sr": "Prvo reši zagradu: 5 − 3 = 2", "en": "First solve the parentheses: 5 − 3 = 2", "de": "Löse zuerst die Klammer: 5 − 3 = 2", "fr": "Résous d'abord la parenthèse : 5 − 3 = 2", "es": "Primero resuelve el paréntesis: 5 − 3 = 2", "it": "Risolvi prima la parentesi: 5 − 3 = 2", "ru": "Сначала реши скобку: 5 − 3 = 2", "pt": "Primeiro resolve o parêntese: 5 − 3 = 2"}, {"sr": "Izračunaj stepen: 3² = 9", "en": "Calculate the power: 3² = 9", "de": "Berechne die Potenz: 3² = 9", "fr": "Calcule la puissance : 3² = 9", "es": "Calcula la potencia: 3² = 9", "it": "Calcola la potenza: 3² = 9", "ru": "Вычисли степень: 3² = 9", "pt": "Calcula a potência: 3² = 9"}, {"sr": "Izvrši množenje i deljenje: 12 : 4 = 3, a 2 · 2 = 4", "en": "Perform the multiplication and division: 12 : 4 = 3, and 2 · 2 = 4", "de": "Führe Multiplikation und Division aus: 12 : 4 = 3, und 2 · 2 = 4", "fr": "Effectue la multiplication et la division : 12 : 4 = 3, et 2 · 2 = 4", "es": "Realiza la multiplicación y la división: 12 : 4 = 3, y 2 · 2 = 4", "it": "Esegui la moltiplicazione e la divisione: 12 : 4 = 3, e 2 · 2 = 4", "ru": "Выполни умножение и деление: 12 : 4 = 3, а 2 · 2 = 4", "pt": "Realiza a multiplicação e a divisão: 12 : 4 = 3, e 2 · 2 = 4"}, {"sr": "Saberi i oduzmi s leva na desno: 9 + 3 − 4 = 8", "en": "Add and subtract from left to right: 9 + 3 − 4 = 8", "de": "Addiere und subtrahiere von links nach rechts: 9 + 3 − 4 = 8", "fr": "Additionne et soustrais de gauche à droite : 9 + 3 − 4 = 8", "es": "Suma y resta de izquierda a derecha: 9 + 3 − 4 = 8", "it": "Somma e sottrai da sinistra a destra: 9 + 3 − 4 = 8", "ru": "Сложи и вычти слева направо: 9 + 3 − 4 = 8", "pt": "Soma e subtrai da esquerda para a direita: 9 + 3 − 4 = 8"}]}}, {"name": {"sr": "Razlomci i decimalni brojevi", "en": "Fractions and Decimal Numbers", "de": "Brüche und Dezimalzahlen", "fr": "Fractions et nombres décimaux", "es": "Fracciones y números decimales", "it": "Frazioni e numeri decimali", "ru": "Дроби и десятичные числа", "pt": "Frações e números decimais"}, "theory": {"sr": "<b>Razlomak</b> a/b čini brojilac (a) i imenilac (b), pri čemu je b≠0. <b>Skraćivanje</b> razlomka - deljenje brojioca i imenioca istim brojem, <b>proširivanje</b> - množenje istim brojem. Za <b>sabiranje i oduzimanje</b> razlomaka potreban je zajednički imenilac (najbolje NZS imenilaca). Za <b>množenje</b> razlomaka množe se brojioci i imenioci, za <b>deljenje</b> se prvi razlomak množi recipročnom vrednošću drugog. <b>Decimalni broj</b> je drugi zapis razlomka (npr. 3/4 = 0,75).", "en": "<b>A fraction</b> a/b consists of a numerator (a) and a denominator (b), where b≠0. <b>Simplifying</b> a fraction means dividing the numerator and denominator by the same number, <b>expanding</b> means multiplying by the same number. <b>Adding and subtracting</b> fractions requires a common denominator (preferably the LCM of the denominators). To <b>multiply</b> fractions, multiply the numerators and denominators; to <b>divide</b>, multiply the first fraction by the reciprocal of the second. A <b>decimal number</b> is another way of writing a fraction (e.g. 3/4 = 0.75).", "de": "<b>Ein Bruch</b> a/b besteht aus Zähler (a) und Nenner (b), wobei b≠0. <b>Kürzen</b> eines Bruchs bedeutet, Zähler und Nenner durch dieselbe Zahl zu teilen, <b>Erweitern</b> bedeutet Multiplikation mit derselben Zahl. Für <b>Addition und Subtraktion</b> von Brüchen ist ein gemeinsamer Nenner nötig (am besten das kgV der Nenner). Bei der <b>Multiplikation</b> von Brüchen werden Zähler und Nenner multipliziert, bei der <b>Division</b> wird der erste Bruch mit dem Kehrwert des zweiten multipliziert. Eine <b>Dezimalzahl</b> ist eine andere Schreibweise eines Bruchs (z. B. 3/4 = 0,75).", "fr": "<b>Une fraction</b> a/b comprend un numérateur (a) et un dénominateur (b), avec b≠0. <b>Simplifier</b> une fraction consiste à diviser le numérateur et le dénominateur par le même nombre, <b>l'amplifier</b> consiste à les multiplier par le même nombre. <b>Additionner et soustraire</b> des fractions nécessite un dénominateur commun (idéalement le PPCM des dénominateurs). Pour <b>multiplier</b> des fractions, on multiplie les numérateurs et les dénominateurs ; pour <b>diviser</b>, on multiplie la première fraction par l'inverse de la seconde. <b>Un nombre décimal</b> est une autre écriture d'une fraction (par ex. 3/4 = 0,75).", "es": "<b>Una fracción</b> a/b está formada por un numerador (a) y un denominador (b), donde b≠0. <b>Simplificar</b> una fracción significa dividir el numerador y el denominador por el mismo número, <b>amplificar</b> significa multiplicarlos por el mismo número. Para <b>sumar y restar</b> fracciones se necesita un denominador común (preferiblemente el mcm de los denominadores). Para <b>multiplicar</b> fracciones se multiplican los numeradores y los denominadores; para <b>dividir</b>, se multiplica la primera fracción por el recíproco de la segunda. <b>Un número decimal</b> es otra forma de escribir una fracción (por ejemplo, 3/4 = 0,75).", "it": "<b>Una frazione</b> a/b è formata da un numeratore (a) e un denominatore (b), con b≠0. <b>Semplificare</b> una frazione significa dividere numeratore e denominatore per lo stesso numero, <b>ampliarla</b> significa moltiplicarli per lo stesso numero. Per <b>sommare e sottrarre</b> le frazioni serve un denominatore comune (preferibilmente il mcm dei denominatori). Per <b>moltiplicare</b> le frazioni si moltiplicano numeratori e denominatori; per <b>dividere</b>, si moltiplica la prima frazione per il reciproco della seconda. <b>Un numero decimale</b> è un altro modo di scrivere una frazione (ad es. 3/4 = 0,75).", "ru": "<b>Дробь</b> a/b состоит из числителя (a) и знаменателя (b), где b≠0. <b>Сокращение</b> дроби — деление числителя и знаменателя на одно и то же число, <b>расширение</b> — умножение на одно и то же число. Для <b>сложения и вычитания</b> дробей нужен общий знаменатель (лучше всего НОК знаменателей). При <b>умножении</b> дробей перемножаются числители и знаменатели, при <b>делении</b> первая дробь умножается на число, обратное второй. <b>Десятичная дробь</b> — это другая запись дроби (напр. 3/4 = 0,75).", "pt": "<b>Uma fração</b> a/b é formada por um numerador (a) e um denominador (b), sendo b≠0. <b>Simplificar</b> uma fração significa dividir o numerador e o denominador pelo mesmo número, <b>ampliar</b> significa multiplicá-los pelo mesmo número. Para <b>somar e subtrair</b> frações é preciso um denominador comum (de preferência o MMC dos denominadores). Para <b>multiplicar</b> frações multiplicam-se os numeradores e os denominadores; para <b>dividir</b>, multiplica-se a primeira fração pelo inverso da segunda. <b>Um número decimal</b> é outra forma de escrever uma fração (por exemplo, 3/4 = 0,75)."}, "formulas": [{"sr": "Sabiranje razlomaka: a/b + c/d = (a·d + b·c)/(b·d)", "en": "Adding fractions: a/b + c/d = (a·d + b·c)/(b·d)", "de": "Addition von Brüchen: a/b + c/d = (a·d + b·c)/(b·d)", "fr": "Addition de fractions : a/b + c/d = (a·d + b·c)/(b·d)", "es": "Suma de fracciones: a/b + c/d = (a·d + b·c)/(b·d)", "it": "Addizione di frazioni: a/b + c/d = (a·d + b·c)/(b·d)", "ru": "Сложение дробей: a/b + c/d = (a·d + b·c)/(b·d)", "pt": "Adição de frações: a/b + c/d = (a·d + b·c)/(b·d)"}, {"sr": "Množenje razlomaka: a/b · c/d = (a·c)/(b·d)", "en": "Multiplying fractions: a/b · c/d = (a·c)/(b·d)", "de": "Multiplikation von Brüchen: a/b · c/d = (a·c)/(b·d)", "fr": "Multiplication de fractions : a/b · c/d = (a·c)/(b·d)", "es": "Multiplicación de fracciones: a/b · c/d = (a·c)/(b·d)", "it": "Moltiplicazione di frazioni: a/b · c/d = (a·c)/(b·d)", "ru": "Умножение дробей: a/b · c/d = (a·c)/(b·d)", "pt": "Multiplicação de frações: a/b · c/d = (a·c)/(b·d)"}, {"sr": "Deljenje razlomaka: a/b : c/d = a/b · d/c = (a·d)/(b·c)", "en": "Dividing fractions: a/b : c/d = a/b · d/c = (a·d)/(b·c)", "de": "Division von Brüchen: a/b : c/d = a/b · d/c = (a·d)/(b·c)", "fr": "Division de fractions : a/b : c/d = a/b · d/c = (a·d)/(b·c)", "es": "División de fracciones: a/b : c/d = a/b · d/c = (a·d)/(b·c)", "it": "Divisione di frazioni: a/b : c/d = a/b · d/c = (a·d)/(b·c)", "ru": "Деление дробей: a/b : c/d = a/b · d/c = (a·d)/(b·c)", "pt": "Divisão de frações: a/b : c/d = a/b · d/c = (a·d)/(b·c)"}], "remember": {"sr": "Pri deljenju razlomaka, drugi razlomak se okrene (uzme recipročna vrednost) i pomnoži sa prvim.", "en": "When dividing fractions, flip the second fraction (take its reciprocal) and multiply it by the first.", "de": "Bei der Division von Brüchen wird der zweite Bruch umgedreht (Kehrwert gebildet) und mit dem ersten multipliziert.", "fr": "Pour diviser des fractions, on inverse la seconde fraction (on prend son inverse) et on la multiplie par la première.", "es": "Al dividir fracciones, se invierte la segunda fracción (se toma su recíproco) y se multiplica por la primera.", "it": "Nella divisione di frazioni, si capovolge la seconda frazione (se ne prende il reciproco) e si moltiplica per la prima.", "ru": "При делении дробей вторую дробь переворачивают (берут обратную величину) и умножают на первую.", "pt": "Ao dividir frações, inverte-se a segunda fração (toma-se o seu inverso) e multiplica-se pela primeira."}, "problem": {"statement": {"sr": "Izračunaj: 2/3 + 1/4 − 1/6", "en": "Calculate: 2/3 + 1/4 − 1/6", "de": "Berechne: 2/3 + 1/4 − 1/6", "fr": "Calcule : 2/3 + 1/4 − 1/6", "es": "Calcula: 2/3 + 1/4 − 1/6", "it": "Calcola: 2/3 + 1/4 − 1/6", "ru": "Вычисли: 2/3 + 1/4 − 1/6", "pt": "Calcula: 2/3 + 1/4 − 1/6"}, "steps": [{"sr": "Nađi zajednički imenilac (NZS brojeva 3, 4, 6 je 12): 2/3=8/12, 1/4=3/12, 1/6=2/12", "en": "Find the common denominator (the LCM of 3, 4, 6 is 12): 2/3=8/12, 1/4=3/12, 1/6=2/12", "de": "Finde den gemeinsamen Nenner (das kgV von 3, 4, 6 ist 12): 2/3=8/12, 1/4=3/12, 1/6=2/12", "fr": "Trouve le dénominateur commun (le PPCM de 3, 4, 6 est 12) : 2/3=8/12, 1/4=3/12, 1/6=2/12", "es": "Encuentra el denominador común (el mcm de 3, 4, 6 es 12): 2/3=8/12, 1/4=3/12, 1/6=2/12", "it": "Trova il denominatore comune (il mcm di 3, 4, 6 è 12): 2/3=8/12, 1/4=3/12, 1/6=2/12", "ru": "Найди общий знаменатель (НОК чисел 3, 4, 6 равен 12): 2/3=8/12, 1/4=3/12, 1/6=2/12", "pt": "Encontra o denominador comum (o MMC de 3, 4, 6 é 12): 2/3=8/12, 1/4=3/12, 1/6=2/12"}, {"sr": "Saberi i oduzmi brojioce: 8/12 + 3/12 − 2/12 = 9/12", "en": "Add and subtract the numerators: 8/12 + 3/12 − 2/12 = 9/12", "de": "Addiere und subtrahiere die Zähler: 8/12 + 3/12 − 2/12 = 9/12", "fr": "Additionne et soustrais les numérateurs : 8/12 + 3/12 − 2/12 = 9/12", "es": "Suma y resta los numeradores: 8/12 + 3/12 − 2/12 = 9/12", "it": "Somma e sottrai i numeratori: 8/12 + 3/12 − 2/12 = 9/12", "ru": "Сложи и вычти числители: 8/12 + 3/12 − 2/12 = 9/12", "pt": "Soma e subtrai os numeradores: 8/12 + 3/12 − 2/12 = 9/12"}, {"sr": "Skrati dobijeni razlomak: 9/12 = 3/4", "en": "Simplify the resulting fraction: 9/12 = 3/4", "de": "Kürze den erhaltenen Bruch: 9/12 = 3/4", "fr": "Simplifie la fraction obtenue : 9/12 = 3/4", "es": "Simplifica la fracción obtenida: 9/12 = 3/4", "it": "Semplifica la frazione ottenuta: 9/12 = 3/4", "ru": "Сократи полученную дробь: 9/12 = 3/4", "pt": "Simplifica a fração obtida: 9/12 = 3/4"}]}}, {"name": {"sr": "Procenti i proporcije", "en": "Percentages and Proportions", "de": "Prozente und Verhältnisse", "fr": "Pourcentages et proportions", "es": "Porcentajes y proporciones", "it": "Percentuali e proporzioni", "ru": "Проценты и пропорции", "pt": "Percentagens e proporções"}, "theory": {"sr": "<b>Procenat</b> (%) predstavlja deo od sto, tj. p% = p/100. Postoje tri osnovna tipa zadataka: nalaženje procenta od broja, nalaženje broja kada je poznat njegov procenat, i nalaženje koliko procenata jedan broj čini od drugog. <b>Proporcija</b> je jednakost dva razmera (a:b = c:d). Kod <b>direktno proporcionalnih</b> veličina količnik ostaje stalan, kod <b>obrnuto proporcionalnih</b> veličina stalan je proizvod.", "en": "<b>Percent</b> (%) represents a part out of a hundred, i.e. p% = p/100. There are three basic types of problems: finding the percentage of a number, finding a number when its percentage is known, and finding what percentage one number is of another. A <b>proportion</b> is an equality of two ratios (a:b = c:d). For <b>directly proportional</b> quantities the ratio stays constant, for <b>inversely proportional</b> quantities the product stays constant.", "de": "<b>Prozent</b> (%) bedeutet ein Teil von hundert, d. h. p% = p/100. Es gibt drei grundlegende Aufgabentypen: den Prozentsatz einer Zahl finden, eine Zahl finden, wenn ihr Prozentsatz bekannt ist, und herausfinden, wie viel Prozent eine Zahl von einer anderen ausmacht. Eine <b>Verhältnisgleichung (Proportion)</b> ist die Gleichheit zweier Verhältnisse (a:b = c:d). Bei <b>direkt proportionalen</b> Größen bleibt der Quotient konstant, bei <b>umgekehrt proportionalen</b> Größen bleibt das Produkt konstant.", "fr": "<b>Le pourcentage</b> (%) représente une partie sur cent, c'est-à-dire p% = p/100. Il existe trois types de problèmes de base : trouver le pourcentage d'un nombre, trouver un nombre quand son pourcentage est connu, et trouver quel pourcentage un nombre représente par rapport à un autre. <b>Une proportion</b> est l'égalité de deux rapports (a:b = c:d). Pour des grandeurs <b>directement proportionnelles</b>, le quotient reste constant ; pour des grandeurs <b>inversement proportionnelles</b>, c'est le produit qui reste constant.", "es": "<b>El porcentaje</b> (%) representa una parte de cien, es decir, p% = p/100. Existen tres tipos básicos de problemas: hallar el porcentaje de un número, hallar un número cuando se conoce su porcentaje, y hallar qué porcentaje representa un número respecto a otro. <b>Una proporción</b> es la igualdad de dos razones (a:b = c:d). En magnitudes <b>directamente proporcionales</b> el cociente permanece constante, en magnitudes <b>inversamente proporcionales</b> el producto permanece constante.", "it": "<b>La percentuale</b> (%) rappresenta una parte su cento, cioè p% = p/100. Esistono tre tipi fondamentali di problemi: trovare la percentuale di un numero, trovare un numero conoscendo la sua percentuale, e trovare quale percentuale un numero rappresenta rispetto a un altro. <b>Una proporzione</b> è l'uguaglianza di due rapporti (a:b = c:d). Nelle grandezze <b>direttamente proporzionali</b> il quoziente resta costante, in quelle <b>inversamente proporzionali</b> resta costante il prodotto.", "ru": "<b>Процент</b> (%) — это часть от ста, то есть p% = p/100. Существует три основных типа задач: нахождение процента от числа, нахождение числа по известному проценту и нахождение того, сколько процентов одно число составляет от другого. <b>Пропорция</b> — это равенство двух отношений (a:b = c:d). Для <b>прямо пропорциональных</b> величин частное остаётся постоянным, для <b>обратно пропорциональных</b> величин постоянным остаётся произведение.", "pt": "<b>A percentagem</b> (%) representa uma parte de cem, ou seja, p% = p/100. Existem três tipos básicos de problemas: encontrar a percentagem de um número, encontrar um número quando se conhece a sua percentagem, e encontrar que percentagem um número representa de outro. <b>Uma proporção</b> é a igualdade de duas razões (a:b = c:d). Em grandezas <b>diretamente proporcionais</b> o quociente mantém-se constante, em grandezas <b>inversamente proporcionais</b> mantém-se constante o produto."}, "formulas": [{"sr": "Procenat od broja: p% od N = N·p/100", "en": "Percentage of a number: p% of N = N·p/100", "de": "Prozentsatz einer Zahl: p% von N = N·p/100", "fr": "Pourcentage d'un nombre : p% de N = N·p/100", "es": "Porcentaje de un número: p% de N = N·p/100", "it": "Percentuale di un numero: p% di N = N·p/100", "ru": "Процент от числа: p% от N = N·p/100", "pt": "Percentagem de um número: p% de N = N·p/100"}, {"sr": "Proporcija (unakrsno množenje): a:b = c:d ⇒ a·d = b·c", "en": "Proportion (cross-multiplication): a:b = c:d ⇒ a·d = b·c", "de": "Proportion (Kreuzmultiplikation): a:b = c:d ⇒ a·d = b·c", "fr": "Proportion (produit en croix) : a:b = c:d ⇒ a·d = b·c", "es": "Proporción (producto cruzado): a:b = c:d ⇒ a·d = b·c", "it": "Proporzione (prodotto in croce): a:b = c:d ⇒ a·d = b·c", "ru": "Пропорция (правило креста): a:b = c:d ⇒ a·d = b·c", "pt": "Proporção (multiplicação cruzada): a:b = c:d ⇒ a·d = b·c"}, {"sr": "Koliko procenata je deo od celine: procenat = (deo/celina)·100%", "en": "What percentage a part is of the whole: percentage = (part/whole)·100%", "de": "Wie viel Prozent ein Teil vom Ganzen ist: Prozentsatz = (Teil/Ganzes)·100%", "fr": "Quel pourcentage une partie représente du tout : pourcentage = (partie/tout)·100%", "es": "Qué porcentaje es una parte del total: porcentaje = (parte/total)·100%", "it": "Quale percentuale è una parte rispetto al tutto: percentuale = (parte/tutto)·100%", "ru": "Сколько процентов часть составляет от целого: процент = (часть/целое)·100%", "pt": "Que percentagem uma parte representa do todo: percentagem = (parte/todo)·100%"}], "remember": {"sr": "Kod proporcije, proizvod spoljašnjih članova jednak je proizvodu unutrašnjih članova (unakrsno množenje).", "en": "In a proportion, the product of the outer terms equals the product of the inner terms (cross-multiplication).", "de": "Bei einer Proportion ist das Produkt der äußeren Glieder gleich dem Produkt der inneren Glieder (Kreuzmultiplikation).", "fr": "Dans une proportion, le produit des extrêmes est égal au produit des moyens (produit en croix).", "es": "En una proporción, el producto de los extremos es igual al producto de los medios (producto cruzado).", "it": "In una proporzione, il prodotto degli estremi è uguale al prodotto dei medi (prodotto in croce).", "ru": "В пропорции произведение крайних членов равно произведению средних членов (правило креста).", "pt": "Numa proporção, o produto dos extremos é igual ao produto dos meios (multiplicação cruzada)."}, "problem": {"statement": {"sr": "Cena majice od 1600 dinara snižena je za 25%. Kolika je nova cena?", "en": "The price of a T-shirt worth 1600 dinars was reduced by 25%. What is the new price?", "de": "Der Preis eines T-Shirts von 1600 Dinar wurde um 25% gesenkt. Wie hoch ist der neue Preis?", "fr": "Le prix d'un T-shirt de 1600 dinars a été réduit de 25%. Quel est le nouveau prix ?", "es": "El precio de una camiseta de 1600 dinares se redujo un 25%. ¿Cuál es el nuevo precio?", "it": "Il prezzo di una maglietta di 1600 dinari è stato ridotto del 25%. Qual è il nuovo prezzo?", "ru": "Цена футболки в 1600 динаров была снижена на 25%. Какова новая цена?", "pt": "O preço de uma camiseta de 1600 dinares foi reduzido em 25%. Qual é o novo preço?"}, "steps": [{"sr": "Izračunaj iznos popusta: 25% od 1600 = 1600·25/100 = 400 dinara", "en": "Calculate the discount amount: 25% of 1600 = 1600·25/100 = 400 dinars", "de": "Berechne den Rabattbetrag: 25% von 1600 = 1600·25/100 = 400 Dinar", "fr": "Calcule le montant de la remise : 25% de 1600 = 1600·25/100 = 400 dinars", "es": "Calcula el importe del descuento: 25% de 1600 = 1600·25/100 = 400 dinares", "it": "Calcola l'importo dello sconto: 25% di 1600 = 1600·25/100 = 400 dinari", "ru": "Вычисли сумму скидки: 25% от 1600 = 1600·25/100 = 400 динаров", "pt": "Calcula o valor do desconto: 25% de 1600 = 1600·25/100 = 400 dinares"}, {"sr": "Oduzmi popust od stare cene: 1600 − 400 = 1200 dinara", "en": "Subtract the discount from the old price: 1600 − 400 = 1200 dinars", "de": "Ziehe den Rabatt vom alten Preis ab: 1600 − 400 = 1200 Dinar", "fr": "Soustrais la remise de l'ancien prix : 1600 − 400 = 1200 dinars", "es": "Resta el descuento del precio antiguo: 1600 − 400 = 1200 dinares", "it": "Sottrai lo sconto dal vecchio prezzo: 1600 − 400 = 1200 dinari", "ru": "Вычти скидку из старой цены: 1600 − 400 = 1200 динаров", "pt": "Subtrai o desconto do preço antigo: 1600 − 400 = 1200 dinares"}, {"sr": "Nova cena majice iznosi 1200 dinara.", "en": "The new price of the T-shirt is 1200 dinars.", "de": "Der neue Preis des T-Shirts beträgt 1200 Dinar.", "fr": "Le nouveau prix du T-shirt est de 1200 dinars.", "es": "El nuevo precio de la camiseta es 1200 dinares.", "it": "Il nuovo prezzo della maglietta è 1200 dinari.", "ru": "Новая цена футболки составляет 1200 динаров.", "pt": "O novo preço da camiseta é 1200 dinares."}]}}, {"name": {"sr": "Algebarski izrazi i jednačine", "en": "Algebraic Expressions and Equations", "de": "Algebraische Ausdrücke und Gleichungen", "fr": "Expressions algébriques et équations", "es": "Expresiones algebraicas y ecuaciones", "it": "Espressioni algebriche ed equazioni", "ru": "Алгебраические выражения и уравнения", "pt": "Expressões algébricas e equações"}, "theory": {"sr": "<b>Algebarski izraz</b> sadrži brojeve, slova (promenljive) i računske operacije. <b>Sređivanje izraza</b> podrazumeva sabiranje sličnih članova (istih slova sa istim stepenom). Pri <b>množenju</b> jednočlana i višečlana svaki član se množi posebno, a pri <b>oslobađanju od zagrada</b> vodi se računa o znaku ispred zagrade. <b>Linearna jednačina</b> sa jednom nepoznatom rešava se tako što se nepoznate prebace na jednu, a poznati brojevi na drugu stranu, uz promenu znaka.", "en": "<b>An algebraic expression</b> contains numbers, letters (variables) and arithmetic operations. <b>Simplifying an expression</b> means combining like terms (same letters with the same power). When <b>multiplying</b> a monomial by a polynomial, each term is multiplied separately, and when <b>removing parentheses</b>, attention must be paid to the sign in front of the parenthesis. A <b>linear equation</b> with one unknown is solved by moving the unknowns to one side and the known numbers to the other side, changing the sign as they cross the equals sign.", "de": "<b>Ein algebraischer Ausdruck</b> enthält Zahlen, Buchstaben (Variablen) und Rechenoperationen. <b>Das Vereinfachen eines Ausdrucks</b> bedeutet, gleichartige Glieder (gleiche Buchstaben mit gleicher Potenz) zusammenzufassen. Bei der <b>Multiplikation</b> eines Monoms mit einem Polynom wird jedes Glied einzeln multipliziert, und beim <b>Auflösen von Klammern</b> muss auf das Vorzeichen vor der Klammer geachtet werden. Eine <b>lineare Gleichung</b> mit einer Unbekannten wird gelöst, indem man die Unbekannten auf eine Seite und die bekannten Zahlen auf die andere Seite bringt, wobei sich das Vorzeichen ändert.", "fr": "<b>Une expression algébrique</b> contient des nombres, des lettres (variables) et des opérations arithmétiques. <b>Simplifier une expression</b> consiste à regrouper les termes semblables (mêmes lettres avec la même puissance). Lors de la <b>multiplication</b> d'un monôme par un polynôme, chaque terme est multiplié séparément, et lors de la <b>suppression des parenthèses</b>, il faut tenir compte du signe devant la parenthèse. <b>Une équation linéaire</b> à une inconnue se résout en déplaçant les inconnues d'un côté et les nombres connus de l'autre, en changeant le signe.", "es": "<b>Una expresión algebraica</b> contiene números, letras (variables) y operaciones aritméticas. <b>Simplificar una expresión</b> significa reducir términos semejantes (mismas letras con la misma potencia). Al <b>multiplicar</b> un monomio por un polinomio, cada término se multiplica por separado, y al <b>eliminar paréntesis</b>, hay que tener en cuenta el signo delante del paréntesis. <b>Una ecuación lineal</b> con una incógnita se resuelve pasando las incógnitas a un lado y los números conocidos al otro, cambiando el signo.", "it": "<b>Un'espressione algebrica</b> contiene numeri, lettere (variabili) e operazioni aritmetiche. <b>Semplificare un'espressione</b> significa sommare i termini simili (stesse lettere con lo stesso esponente). Nella <b>moltiplicazione</b> di un monomio per un polinomio ogni termine viene moltiplicato separatamente, e nell'<b>eliminazione delle parentesi</b> bisogna fare attenzione al segno davanti alla parentesi. <b>Un'equazione lineare</b> con un'incognita si risolve portando le incognite da un lato e i numeri noti dall'altro, cambiando il segno.", "ru": "<b>Алгебраическое выражение</b> содержит числа, буквы (переменные) и арифметические операции. <b>Упрощение выражения</b> означает приведение подобных членов (одинаковые буквы с одинаковой степенью). При <b>умножении</b> одночлена на многочлен каждый член умножается отдельно, а при <b>раскрытии скобок</b> нужно учитывать знак перед скобкой. <b>Линейное уравнение</b> с одной неизвестной решается переносом неизвестных в одну сторону, а известных чисел в другую, с изменением знака.", "pt": "<b>Uma expressão algébrica</b> contém números, letras (variáveis) e operações aritméticas. <b>Simplificar uma expressão</b> significa reduzir termos semelhantes (mesmas letras com a mesma potência). Ao <b>multiplicar</b> um monómio por um polinómio, cada termo é multiplicado separadamente, e ao <b>eliminar parênteses</b>, deve-se ter atenção ao sinal antes do parêntese. <b>Uma equação linear</b> com uma incógnita resolve-se passando as incógnitas para um lado e os números conhecidos para o outro, mudando o sinal."}, "formulas": [{"sr": "Distributivni zakon: a(b+c) = a·b + a·c", "en": "Distributive law: a(b+c) = a·b + a·c", "de": "Distributivgesetz: a(b+c) = a·b + a·c", "fr": "Loi de distributivité : a(b+c) = a·b + a·c", "es": "Propiedad distributiva: a(b+c) = a·b + a·c", "it": "Proprietà distributiva: a(b+c) = a·b + a·c", "ru": "Распределительный закон: a(b+c) = a·b + a·c", "pt": "Propriedade distributiva: a(b+c) = a·b + a·c"}, {"sr": "Kvadrat zbira: (a+b)² = a² + 2ab + b²", "en": "Square of a sum: (a+b)² = a² + 2ab + b²", "de": "Quadrat einer Summe: (a+b)² = a² + 2ab + b²", "fr": "Carré d'une somme : (a+b)² = a² + 2ab + b²", "es": "Cuadrado de una suma: (a+b)² = a² + 2ab + b²", "it": "Quadrato di un binomio (somma): (a+b)² = a² + 2ab + b²", "ru": "Квадрат суммы: (a+b)² = a² + 2ab + b²", "pt": "Quadrado de uma soma: (a+b)² = a² + 2ab + b²"}, {"sr": "Kvadrat razlike: (a−b)² = a² − 2ab + b²", "en": "Square of a difference: (a−b)² = a² − 2ab + b²", "de": "Quadrat einer Differenz: (a−b)² = a² − 2ab + b²", "fr": "Carré d'une différence : (a−b)² = a² − 2ab + b²", "es": "Cuadrado de una diferencia: (a−b)² = a² − 2ab + b²", "it": "Quadrato di un binomio (differenza): (a−b)² = a² − 2ab + b²", "ru": "Квадрат разности: (a−b)² = a² − 2ab + b²", "pt": "Quadrado de uma diferença: (a−b)² = a² − 2ab + b²"}], "remember": {"sr": "Pri rešavanju jednačine, isti broj se može dodati, oduzeti, pomnožiti ili podeliti na obe strane jednačine, a da se rešenje ne promeni.", "en": "When solving an equation, the same number can be added, subtracted, multiplied or divided on both sides of the equation without changing the solution.", "de": "Beim Lösen einer Gleichung kann dieselbe Zahl auf beiden Seiten der Gleichung addiert, subtrahiert, multipliziert oder dividiert werden, ohne dass sich die Lösung ändert.", "fr": "Lors de la résolution d'une équation, on peut ajouter, soustraire, multiplier ou diviser le même nombre des deux côtés de l'équation sans changer la solution.", "es": "Al resolver una ecuación, se puede sumar, restar, multiplicar o dividir el mismo número a ambos lados de la ecuación sin que cambie la solución.", "it": "Nella risoluzione di un'equazione, lo stesso numero può essere aggiunto, sottratto, moltiplicato o diviso su entrambi i lati dell'equazione senza cambiare la soluzione.", "ru": "При решении уравнения одно и то же число можно прибавить, вычесть, умножить или разделить на обе части уравнения, не изменяя решения.", "pt": "Ao resolver uma equação, o mesmo número pode ser somado, subtraído, multiplicado ou dividido em ambos os lados da equação sem alterar a solução."}, "problem": {"statement": {"sr": "Reši jednačinu: 3x − 7 = 2x + 5", "en": "Solve the equation: 3x − 7 = 2x + 5", "de": "Löse die Gleichung: 3x − 7 = 2x + 5", "fr": "Résous l'équation : 3x − 7 = 2x + 5", "es": "Resuelve la ecuación: 3x − 7 = 2x + 5", "it": "Risolvi l'equazione: 3x − 7 = 2x + 5", "ru": "Реши уравнение: 3x − 7 = 2x + 5", "pt": "Resolve a equação: 3x − 7 = 2x + 5"}, "steps": [{"sr": "Prebaci nepoznate na levu, a brojeve na desnu stranu: 3x − 2x = 5 + 7", "en": "Move the unknowns to the left side and the numbers to the right side: 3x − 2x = 5 + 7", "de": "Bringe die Unbekannten auf die linke, die Zahlen auf die rechte Seite: 3x − 2x = 5 + 7", "fr": "Déplace les inconnues à gauche et les nombres à droite : 3x − 2x = 5 + 7", "es": "Pasa las incógnitas al lado izquierdo y los números al lado derecho: 3x − 2x = 5 + 7", "it": "Sposta le incognite a sinistra e i numeri a destra: 3x − 2x = 5 + 7", "ru": "Перенеси неизвестные влево, а числа вправо: 3x − 2x = 5 + 7", "pt": "Passa as incógnitas para a esquerda e os números para a direita: 3x − 2x = 5 + 7"}, {"sr": "Sredi obe strane: x = 12", "en": "Simplify both sides: x = 12", "de": "Vereinfache beide Seiten: x = 12", "fr": "Simplifie les deux côtés : x = 12", "es": "Simplifica ambos lados: x = 12", "it": "Semplifica entrambi i lati: x = 12", "ru": "Упрости обе части: x = 12", "pt": "Simplifica ambos os lados: x = 12"}, {"sr": "Proveri rešenje: 3·12−7=29 i 2·12+5=29 ✓", "en": "Check the solution: 3·12−7=29 and 2·12+5=29 ✓", "de": "Überprüfe die Lösung: 3·12−7=29 und 2·12+5=29 ✓", "fr": "Vérifie la solution : 3·12−7=29 et 2·12+5=29 ✓", "es": "Comprueba la solución: 3·12−7=29 y 2·12+5=29 ✓", "it": "Verifica la soluzione: 3·12−7=29 e 2·12+5=29 ✓", "ru": "Проверь решение: 3·12−7=29 и 2·12+5=29 ✓", "pt": "Verifica a solução: 3·12−7=29 e 2·12+5=29 ✓"}]}}, {"name": {"sr": "Geometrija (uglovi, trougao, četvorougao, krug)", "en": "Geometry (Angles, Triangle, Quadrilateral, Circle)", "de": "Geometrie (Winkel, Dreieck, Viereck, Kreis)", "fr": "Géométrie (angles, triangle, quadrilatère, cercle)", "es": "Geometría (ángulos, triángulo, cuadrilátero, círculo)", "it": "Geometria (angoli, triangolo, quadrilatero, cerchio)", "ru": "Геометрия (углы, треугольник, четырёхугольник, окружность)", "pt": "Geometria (ângulos, triângulo, quadrilátero, círculo)"}, "theory": {"sr": "<b>Vrste uglova:</b> oštar (0°<α<90°), prav (90°), tup (90°<α<180°), opružen (180°) i pun (360°). <b>Zbir uglova trougla</b> uvek iznosi 180°, a zbir uglova n-tougla je (n−2)·180°. Trouglovi se dele po stranicama (raznostranični, jednakokraki, jednakostranični) i po uglovima (oštrougli, pravougli, tupougli). <b>Pitagorina teorema</b> povezuje stranice pravouglog trougla. Kod kruga razlikujemo poluprečnik, prečnik, tetivu, luk i tangentu.", "en": "<b>Types of angles:</b> acute (0°<α<90°), right (90°), obtuse (90°<α<180°), straight (180°) and full (360°). <b>The sum of the angles of a triangle</b> is always 180°, and the sum of the angles of an n-gon is (n−2)·180°. Triangles are classified by sides (scalene, isosceles, equilateral) and by angles (acute, right, obtuse). <b>The Pythagorean theorem</b> relates the sides of a right triangle. In a circle we distinguish the radius, diameter, chord, arc and tangent.", "de": "<b>Winkelarten:</b> spitz (0°<α<90°), rechter (90°), stumpf (90°<α<180°), gestreckter (180°) und Vollwinkel (360°). <b>Die Winkelsumme eines Dreiecks</b> beträgt immer 180°, und die Winkelsumme eines n-Ecks ist (n−2)·180°. Dreiecke werden nach Seiten (unregelmäßig, gleichschenklig, gleichseitig) und nach Winkeln (spitzwinklig, rechtwinklig, stumpfwinklig) eingeteilt. <b>Der Satz des Pythagoras</b> verbindet die Seiten eines rechtwinkligen Dreiecks. Beim Kreis unterscheidet man Radius, Durchmesser, Sehne, Bogen und Tangente.", "fr": "<b>Types d'angles :</b> aigu (0°<α<90°), droit (90°), obtus (90°<α<180°), plat (180°) et plein (360°). <b>La somme des angles d'un triangle</b> vaut toujours 180°, et la somme des angles d'un n-gone est (n−2)·180°. Les triangles se classent par côtés (scalène, isocèle, équilatéral) et par angles (acutangle, rectangle, obtusangle). <b>Le théorème de Pythagore</b> relie les côtés d'un triangle rectangle. Dans un cercle, on distingue le rayon, le diamètre, la corde, l'arc et la tangente.", "es": "<b>Tipos de ángulos:</b> agudo (0°<α<90°), recto (90°), obtuso (90°<α<180°), llano (180°) y completo (360°). <b>La suma de los ángulos de un triángulo</b> siempre es 180°, y la suma de los ángulos de un polígono de n lados es (n−2)·180°. Los triángulos se clasifican por sus lados (escaleno, isósceles, equilátero) y por sus ángulos (acutángulo, rectángulo, obtusángulo). <b>El teorema de Pitágoras</b> relaciona los lados de un triángulo rectángulo. En una circunferencia distinguimos el radio, el diámetro, la cuerda, el arco y la tangente.", "it": "<b>Tipi di angoli:</b> acuto (0°<α<90°), retto (90°), ottuso (90°<α<180°), piatto (180°) e giro (360°). <b>La somma degli angoli di un triangolo</b> è sempre 180°, e la somma degli angoli di un n-agono è (n−2)·180°. I triangoli si classificano per lati (scaleno, isoscele, equilatero) e per angoli (acutangolo, rettangolo, ottusangolo). <b>Il teorema di Pitagora</b> lega i lati di un triangolo rettangolo. Nella circonferenza distinguiamo raggio, diametro, corda, arco e tangente.", "ru": "<b>Виды углов:</b> острый (0°<α<90°), прямой (90°), тупой (90°<α<180°), развёрнутый (180°) и полный (360°). <b>Сумма углов треугольника</b> всегда равна 180°, а сумма углов n-угольника равна (n−2)·180°. Треугольники делятся по сторонам (разносторонний, равнобедренный, равносторонний) и по углам (остроугольный, прямоугольный, тупоугольный). <b>Теорема Пифагора</b> связывает стороны прямоугольного треугольника. В окружности различают радиус, диаметр, хорду, дугу и касательную.", "pt": "<b>Tipos de ângulos:</b> agudo (0°<α<90°), reto (90°), obtuso (90°<α<180°), raso (180°) e giro completo (360°). <b>A soma dos ângulos de um triângulo</b> é sempre 180°, e a soma dos ângulos de um polígono de n lados é (n−2)·180°. Os triângulos classificam-se pelos lados (escaleno, isósceles, equilátero) e pelos ângulos (acutângulo, retângulo, obtusângulo). <b>O teorema de Pitágoras</b> relaciona os lados de um triângulo retângulo. Numa circunferência distinguimos o raio, o diâmetro, a corda, o arco e a tangente."}, "formulas": [{"sr": "Zbir uglova trougla: α + β + γ = 180°", "en": "Sum of the angles of a triangle: α + β + γ = 180°", "de": "Winkelsumme im Dreieck: α + β + γ = 180°", "fr": "Somme des angles d'un triangle : α + β + γ = 180°", "es": "Suma de los ángulos de un triángulo: α + β + γ = 180°", "it": "Somma degli angoli di un triangolo: α + β + γ = 180°", "ru": "Сумма углов треугольника: α + β + γ = 180°", "pt": "Soma dos ângulos de um triângulo: α + β + γ = 180°"}, {"sr": "Zbir uglova n-tougla: (n−2)·180°", "en": "Sum of the angles of an n-gon: (n−2)·180°", "de": "Winkelsumme eines n-Ecks: (n−2)·180°", "fr": "Somme des angles d'un n-gone : (n−2)·180°", "es": "Suma de los ángulos de un polígono de n lados: (n−2)·180°", "it": "Somma degli angoli di un n-agono: (n−2)·180°", "ru": "Сумма углов n-угольника: (n−2)·180°", "pt": "Soma dos ângulos de um polígono de n lados: (n−2)·180°"}, {"sr": "Pitagorina teorema: c² = a² + b²", "en": "Pythagorean theorem: c² = a² + b²", "de": "Satz des Pythagoras: c² = a² + b²", "fr": "Théorème de Pythagore : c² = a² + b²", "es": "Teorema de Pitágoras: c² = a² + b²", "it": "Teorema di Pitagora: c² = a² + b²", "ru": "Теорема Пифагора: c² = a² + b²", "pt": "Teorema de Pitágoras: c² = a² + b²"}], "remember": {"sr": "Pitagorina teorema važi samo za pravougli trougao, gde je c hipotenuza (stranica naspram pravog ugla), a a i b su katete.", "en": "The Pythagorean theorem only applies to a right triangle, where c is the hypotenuse (the side opposite the right angle), and a and b are the legs.", "de": "Der Satz des Pythagoras gilt nur für ein rechtwinkliges Dreieck, wobei c die Hypotenuse ist (die Seite gegenüber dem rechten Winkel), und a und b die Katheten sind.", "fr": "Le théorème de Pythagore ne s'applique qu'à un triangle rectangle, où c est l'hypoténuse (le côté opposé à l'angle droit), et a et b sont les cathètes.", "es": "El teorema de Pitágoras solo se aplica a un triángulo rectángulo, donde c es la hipotenusa (el lado opuesto al ángulo recto), y a y b son los catetos.", "it": "Il teorema di Pitagora vale solo per un triangolo rettangolo, dove c è l'ipotenusa (il lato opposto all'angolo retto), e a e b sono i cateti.", "ru": "Теорема Пифагора верна только для прямоугольного треугольника, где c — гипотенуза (сторона напротив прямого угла), а a и b — катеты.", "pt": "O teorema de Pitágoras só é válido para um triângulo retângulo, onde c é a hipotenusa (o lado oposto ao ângulo reto), e a e b são os catetos."}, "problem": {"statement": {"sr": "Katete pravouglog trougla su 6 cm i 8 cm. Izračunaj dužinu hipotenuze.", "en": "The legs of a right triangle are 6 cm and 8 cm. Calculate the length of the hypotenuse.", "de": "Die Katheten eines rechtwinkligen Dreiecks sind 6 cm und 8 cm. Berechne die Länge der Hypotenuse.", "fr": "Les cathètes d'un triangle rectangle mesurent 6 cm et 8 cm. Calcule la longueur de l'hypoténuse.", "es": "Los catetos de un triángulo rectángulo miden 6 cm y 8 cm. Calcula la longitud de la hipotenusa.", "it": "I cateti di un triangolo rettangolo misurano 6 cm e 8 cm. Calcola la lunghezza dell'ipotenusa.", "ru": "Катеты прямоугольного треугольника равны 6 см и 8 см. Вычисли длину гипотенузы.", "pt": "Os catetos de um triângulo retângulo medem 6 cm e 8 cm. Calcula o comprimento da hipotenusa."}, "steps": [{"sr": "Primeni Pitagorinu teoremu: c² = a² + b²", "en": "Apply the Pythagorean theorem: c² = a² + b²", "de": "Wende den Satz des Pythagoras an: c² = a² + b²", "fr": "Applique le théorème de Pythagore : c² = a² + b²", "es": "Aplica el teorema de Pitágoras: c² = a² + b²", "it": "Applica il teorema di Pitagora: c² = a² + b²", "ru": "Примени теорему Пифагора: c² = a² + b²", "pt": "Aplica o teorema de Pitágoras: c² = a² + b²"}, {"sr": "Uvrsti vrednosti: c² = 6² + 8² = 36 + 64 = 100", "en": "Substitute the values: c² = 6² + 8² = 36 + 64 = 100", "de": "Setze die Werte ein: c² = 6² + 8² = 36 + 64 = 100", "fr": "Substitue les valeurs : c² = 6² + 8² = 36 + 64 = 100", "es": "Sustituye los valores: c² = 6² + 8² = 36 + 64 = 100", "it": "Sostituisci i valori: c² = 6² + 8² = 36 + 64 = 100", "ru": "Подставь значения: c² = 6² + 8² = 36 + 64 = 100", "pt": "Substitui os valores: c² = 6² + 8² = 36 + 64 = 100"}, {"sr": "Izvuci koren: c = √100 = 10 cm", "en": "Take the square root: c = √100 = 10 cm", "de": "Ziehe die Wurzel: c = √100 = 10 cm", "fr": "Extrais la racine carrée : c = √100 = 10 cm", "es": "Extrae la raíz cuadrada: c = √100 = 10 cm", "it": "Estrai la radice quadrata: c = √100 = 10 cm", "ru": "Извлеки корень: c = √100 = 10 см", "pt": "Extrai a raiz quadrada: c = √100 = 10 cm"}]}}, {"name": {"sr": "Površine i zapremine", "en": "Areas and Volumes", "de": "Flächen und Volumen", "fr": "Aires et volumes", "es": "Áreas y volúmenes", "it": "Aree e volumi", "ru": "Площади и объёмы", "pt": "Áreas e volumes"}, "theory": {"sr": "<b>Površina</b> ravne figure meri se u kvadratnim jedinicama (cm², m²...), a <b>zapremina</b> tela u kubnim jedinicama (cm³, m³...). Za osnovne figure: kvadrat P=a², pravougaonik P=a·b, trougao P=(a·h)/2, krug P=r²π. Za tela: kvadar V=a·b·c, kocka V=a³, valjak V=r²π·H. Pri rešavanju zadataka obavezno je pretvoriti sve dužine u istu jedinicu mere pre računanja.", "en": "<b>The area</b> of a plane figure is measured in square units (cm², m²...), and <b>the volume</b> of a solid in cubic units (cm³, m³...). For basic figures: square P=a², rectangle P=a·b, triangle P=(a·h)/2, circle P=r²π. For solids: cuboid V=a·b·c, cube V=a³, cylinder V=r²π·H. When solving problems, it is essential to convert all lengths to the same unit before calculating.", "de": "<b>Der Flächeninhalt</b> einer ebenen Figur wird in Quadrateinheiten (cm², m²...) gemessen, und <b>das Volumen</b> eines Körpers in Kubikeinheiten (cm³, m³...). Für Grundfiguren gilt: Quadrat P=a², Rechteck P=a·b, Dreieck P=(a·h)/2, Kreis P=r²π. Für Körper: Quader V=a·b·c, Würfel V=a³, Zylinder V=r²π·H. Beim Lösen von Aufgaben müssen alle Längen unbedingt in dieselbe Maßeinheit umgerechnet werden, bevor gerechnet wird.", "fr": "<b>L'aire</b> d'une figure plane se mesure en unités carrées (cm², m²...), et <b>le volume</b> d'un solide en unités cubiques (cm³, m³...). Pour les figures de base : carré P=a², rectangle P=a·b, triangle P=(a·h)/2, cercle P=r²π. Pour les solides : parallélépipède rectangle V=a·b·c, cube V=a³, cylindre V=r²π·H. Lors de la résolution de problèmes, il faut absolument convertir toutes les longueurs dans la même unité avant de calculer.", "es": "<b>El área</b> de una figura plana se mide en unidades cuadradas (cm², m²...), y <b>el volumen</b> de un cuerpo en unidades cúbicas (cm³, m³...). Para las figuras básicas: cuadrado P=a², rectángulo P=a·b, triángulo P=(a·h)/2, círculo P=r²π. Para los cuerpos: ortoedro V=a·b·c, cubo V=a³, cilindro V=r²π·H. Al resolver problemas, es imprescindible convertir todas las longitudes a la misma unidad antes de calcular.", "it": "<b>L'area</b> di una figura piana si misura in unità quadrate (cm², m²...), e <b>il volume</b> di un solido in unità cubiche (cm³, m³...). Per le figure di base: quadrato P=a², rettangolo P=a·b, triangolo P=(a·h)/2, cerchio P=r²π. Per i solidi: parallelepipedo V=a·b·c, cubo V=a³, cilindro V=r²π·H. Nella risoluzione dei problemi è indispensabile convertire tutte le lunghezze nella stessa unità di misura prima di calcolare.", "ru": "<b>Площадь</b> плоской фигуры измеряется в квадратных единицах (см², м²...), а <b>объём</b> тела — в кубических единицах (см³, м³...). Для основных фигур: квадрат P=a², прямоугольник P=a·b, треугольник P=(a·h)/2, круг P=r²π. Для тел: параллелепипед V=a·b·c, куб V=a³, цилиндр V=r²π·H. При решении задач обязательно нужно перевести все длины в одну и ту же единицу измерения перед вычислением.", "pt": "<b>A área</b> de uma figura plana mede-se em unidades quadradas (cm², m²...), e <b>o volume</b> de um sólido em unidades cúbicas (cm³, m³...). Para figuras básicas: quadrado P=a², retângulo P=a·b, triângulo P=(a·h)/2, círculo P=r²π. Para sólidos: paralelepípedo V=a·b·c, cubo V=a³, cilindro V=r²π·H. Ao resolver problemas, é essencial converter todos os comprimentos para a mesma unidade de medida antes de calcular."}, "formulas": [{"sr": "Zapremina kvadra: V = a·b·c", "en": "Volume of a cuboid: V = a·b·c", "de": "Volumen eines Quaders: V = a·b·c", "fr": "Volume d'un parallélépipède rectangle : V = a·b·c", "es": "Volumen de un ortoedro: V = a·b·c", "it": "Volume di un parallelepipedo: V = a·b·c", "ru": "Объём прямоугольного параллелепипеда: V = a·b·c", "pt": "Volume de um paralelepípedo: V = a·b·c"}, {"sr": "Zapremina valjka: V = r²π·H", "en": "Volume of a cylinder: V = r²π·H", "de": "Volumen eines Zylinders: V = r²π·H", "fr": "Volume d'un cylindre : V = r²π·H", "es": "Volumen de un cilindro: V = r²π·H", "it": "Volume di un cilindro: V = r²π·H", "ru": "Объём цилиндра: V = r²π·H", "pt": "Volume de um cilindro: V = r²π·H"}, {"sr": "Površina i obim kruga: P = r²π, O = 2rπ", "en": "Area and circumference of a circle: P = r²π, O = 2rπ", "de": "Fläche und Umfang eines Kreises: P = r²π, O = 2rπ", "fr": "Aire et périmètre d'un cercle : P = r²π, O = 2rπ", "es": "Área y perímetro de un círculo: P = r²π, O = 2rπ", "it": "Area e circonferenza di un cerchio: P = r²π, O = 2rπ", "ru": "Площадь и длина окружности: P = r²π, O = 2rπ", "pt": "Área e perímetro de um círculo: P = r²π, O = 2rπ"}], "remember": {"sr": "Pre računanja obavezno proveri da li su sve dužine izražene u istoj jedinici mere.", "en": "Before calculating, always make sure all lengths are expressed in the same unit of measurement.", "de": "Überprüfe vor dem Rechnen unbedingt, ob alle Längen in derselben Maßeinheit angegeben sind.", "fr": "Avant de calculer, vérifie toujours que toutes les longueurs sont exprimées dans la même unité de mesure.", "es": "Antes de calcular, comprueba siempre que todas las longitudes estén expresadas en la misma unidad de medida.", "it": "Prima di calcolare, controlla sempre che tutte le lunghezze siano espresse nella stessa unità di misura.", "ru": "Перед вычислением обязательно проверь, что все длины выражены в одной и той же единице измерения.", "pt": "Antes de calcular, verifica sempre se todos os comprimentos estão expressos na mesma unidade de medida."}, "problem": {"statement": {"sr": "Izračunaj zapreminu valjka čiji je poluprečnik osnove 3 cm, a visina 10 cm. (π ≈ 3,14)", "en": "Calculate the volume of a cylinder with a base radius of 3 cm and a height of 10 cm. (π ≈ 3.14)",

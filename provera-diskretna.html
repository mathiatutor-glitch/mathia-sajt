<style>
:root{--cream:#FBF6EE;--ink:#5A1024;--ink2:#7A3346;--gold:#C6A05C;--golddk:#A6803C;--goldlt:#F0DCA8;--goldsoft:#F0DCA8;--malina:#B01E48;--malina2:#CC5E7E;--mint:#3FB98C;--muted:#8A7A80;--line:#EFE1DC}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#43303A;min-height:100vh;background:radial-gradient(520px 400px at 104% -6%,#F6E1EC 0,transparent 56%),radial-gradient(500px 380px at -6% 106%,#F7ECD6 0,transparent 58%),var(--cream);overflow-x:hidden}
h1,h2,h3{font-family:'Spectral',Georgia,serif;font-weight:700;margin:0;color:var(--ink);line-height:1.15}
#fall{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fall span{position:absolute;top:-8%;font-family:'Spectral',serif;font-style:italic;color:rgba(198,160,92,.20);animation:fl linear infinite;will-change:transform}
#fall span.m{color:rgba(176,30,72,.15)}

@media(prefers-reduced-motion:reduce){#fall{display:none}}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:14px 18px 40px}
.top{display:flex;align-items:center;gap:12px;padding:6px 2px 14px}
.top .back{color:var(--ink2);text-decoration:none;font-weight:800;font-size:1.15rem}
.top .lang{margin-left:auto;border:1px solid var(--goldlt);border-radius:100px;padding:5px 10px;font-family:inherit;font-weight:800;font-size:.72rem;color:var(--ink);background:#fff;cursor:pointer}
.bar{flex:1;height:14px;border-radius:100px;background:#EEE1D8;overflow:hidden;box-shadow:inset 0 1px 3px rgba(120,60,70,.12)}
.bar>i{display:block;height:100%;width:0;border-radius:100px;background:linear-gradient(90deg,var(--gold),var(--malina));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hearts{font-size:1rem;white-space:nowrap}.streak{font-weight:900;color:var(--gold);font-size:.95rem;white-space:nowrap}
.hero{text-align:center;margin:2px 0 14px}
.hero .free{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(180deg,#FFFBF3,#FBF3E2);border:1px solid var(--goldsoft);border-radius:100px;padding:6px 15px;font-weight:800;font-size:.72rem;color:var(--golddk)}
.card{background:linear-gradient(180deg,#FFFDF9,#FDF3EA);border:1px solid var(--goldlt);border-radius:30px;padding:24px 22px;box-shadow:0 30px 70px -34px rgba(90,16,36,.5);animation:pop .5s cubic-bezier(.2,.9,.2,1);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),#FFF6D6,var(--gold),transparent)}
@keyframes pop{0%{transform:scale(.95) translateY(10px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.eyebrow{text-align:center;font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:.66rem;color:var(--malina)}
.qnum{display:block;text-align:center;margin:2px 0 4px;color:var(--muted);font-weight:800;font-size:.8rem}
.mascot{width:70px;height:70px;margin:4px auto 4px;border-radius:50%;display:grid;place-items:center;font-size:2.15rem;background:radial-gradient(circle at 40% 34%,#FFF3F7,#F6E1EC);border:2px solid var(--goldlt);box-shadow:0 12px 26px -12px rgba(176,30,72,.4);animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.qtag{display:block;text-align:center;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--golddk);margin:2px 0 6px}
.q{font-family:'Spectral',serif;font-weight:700;color:var(--ink);font-size:1.3rem;text-align:center;line-height:1.3;margin:4px 0 6px}
.opts{display:grid;gap:11px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #EFE0D6;border-radius:18px;padding:13px 15px;font-family:'Spectral','Cambria Math',Georgia,serif;font-weight:600;font-size:1.05rem;color:var(--ink);cursor:pointer;transition:transform .12s,border-color .15s,background .15s;text-align:left}
.opt .mk{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:900;font-size:.82rem;color:var(--golddk)}
.opt:hover{transform:translateY(-2px);border-color:var(--gold)}
.opts.locked .opt{cursor:default}
.opt.correct{border-color:var(--mint);background:linear-gradient(180deg,#F1FBF6,#E4F6EE);animation:good .5s}
.opt.correct .mk{border-color:var(--mint);background:var(--mint);color:#fff}
.opt.wrong{border-color:var(--malina);background:linear-gradient(180deg,#FDEFF3,#FBE3EA);animation:shake .4s}
.opt.wrong .mk{border-color:var(--malina);background:var(--malina);color:#fff}
@keyframes good{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:12px;text-align:center;font-weight:900;font-size:1.02rem;min-height:22px}
.fb.ok{color:var(--mint)}.fb.no{color:var(--malina)}
.sol{max-height:0;opacity:0;overflow:hidden;transition:max-height .5s ease,opacity .4s ease,margin .4s ease;margin:0}
.sol.on{max-height:1600px;opacity:1;margin:14px 0 0}
.sol-in{background:linear-gradient(180deg,#FFF7FA,#FBEEF2);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.sol-h{font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:.7rem;color:var(--malina);margin-bottom:6px;text-align:center}
.step{display:block;font-family:'Spectral','Cambria Math',Georgia,serif;font-size:1.06rem;color:var(--ink);white-space:nowrap;overflow-x:auto;margin:10px 0;line-height:1.5}
.res{display:inline-block;margin-top:6px;font-family:'Spectral',serif;font-weight:700;color:var(--malina);border:1.5px solid rgba(176,30,72,.35);border-radius:10px;padding:4px 14px;background:#fff}
.note{color:#7A3346;font-size:.94rem;margin-top:8px}
.rt{border-top:1.5px solid currentColor;padding:0 .12em}
.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .18em}
.frac>span{display:block;line-height:1.12;padding:0 .45em}
.frac .num{border-bottom:1.5px solid currentColor;padding-bottom:.06em}.frac .den{padding-top:.06em}
b{color:var(--ink)}
.cta{display:block;width:100%;margin-top:14px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--malina2),var(--malina));color:#fff;font-weight:900;font-size:1.02rem;padding:14px;border-radius:100px;box-shadow:0 16px 30px -14px rgba(176,30,72,.6);transition:transform .15s;text-decoration:none;text-align:center}
.cta:hover{transform:translateY(-2px)}
.cta.ghost{background:linear-gradient(135deg,#EAD196,#C6A05C);color:#3a2410;box-shadow:0 14px 28px -14px rgba(160,120,40,.7)}
.reveal{display:block;width:100%;margin-top:12px;border:1.5px solid rgba(198,160,92,.5);cursor:pointer;background:#fff;color:var(--golddk);font-weight:800;font-size:.95rem;padding:12px;border-radius:100px;transition:background .15s}
.reveal:hover{background:#FBF3E2}
.hidden{display:none}
.result{text-align:center}.result .big{font-size:3.2rem;margin:4px 0}.result h2{font-size:1.8rem;margin:2px 0}
.result .score{font-weight:900;color:var(--gold);font-size:1.12rem}.result .msg{color:var(--ink2);margin:8px 0 4px}
.rbadge{display:inline-flex;align-items:center;gap:8px;margin:12px auto 4px;background:linear-gradient(135deg,#FFF3D6,#F3DFA6);border:1px solid var(--goldlt);border-radius:100px;padding:10px 18px;font-weight:900;color:#8a6a1e;box-shadow:0 10px 22px -12px rgba(160,120,40,.6)}
.again{margin-top:12px;background:none;border:none;color:var(--ink2);font-weight:800;cursor:pointer;text-decoration:underline}
#conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#conf i{position:absolute;top:-6%;width:10px;height:14px;border-radius:2px;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(560deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

></span>", "<span class=\"frac\"><span class=\"num\">n²</span><span class=\"den\">2</span></span>", "<span class=\"frac\"><span class=\"num\">n(n−1)</span><span class=\"den\">2</span></span>", "<span class=\"frac\"><span class=\"num\">(n+1)²</span><span class=\"den\">2</span></span>"], "c": 0, "sol": "<span class=\"step\">Baza n=1: 1 = <span class=\"frac\"><span class=\"num\">1·2</span><span class=\"den\">2</span></span> ✓</span><span class=\"step\">Korak: <span class=\"frac\"><span class=\"num\">n(n+1)</span><span class=\"den\">2</span></span> + (n+1) = <span class=\"frac\"><span class=\"num\">(n+1)(n+2)</span><span class=\"den\">2</span></span> ✓</span><div class=\"note\">Dokazuje se indukcijom: baza n=1, pa korak n → n+1.</div><span class=\"res\">1 + 2 + … + n = <span class=\"frac\"><span class=\"num\">n(n+1)</span><span class=\"den\">2</span></span></span>"}, {"tag": "Teorija grafova · rukovanje", "q": "Graf ima 6 čvorova, svaki stepena 3. Koliko grana?", "o": ["9", "18", "6", "12"], "c": 0, "sol": "<span class=\"step\">∑ deg(v) = 6 · 3 = 18 = 2·|E|</span><span class=\"step\">|E| = <span class=\"frac\"><span class=\"num\">18</span><span class=\"den\">2</span></span> = 9</span><div class=\"note\">Lema o rukovanju: zbir stepena = dvostruki broj grana.</div><span class=\"res\">9 grana</span>"}], "en": [{"tag": "Logic · tautology", "q": "Is (p → q) ≡ (¬p ∨ q) a tautology?", "o": ["Yes, holds for all values", "No", "Only when p is true", "Only when q is true"], "c": 0, "sol": "<span class=\"step\">p=⊤, q=⊤: ⊤ i ⊤ ✓</span><span class=\"step\">p=⊤, q=⊥: ⊥ i ⊥ ✓</span><span class=\"step\">p=⊥: obe ⊤ ✓</span><div class=\"note\">They match in every row of the truth table → tautology.</div><span class=\"res\">Yes — tautology</span>"}, {"tag": "Combinations", "q": "In how many ways can a team of 5 be chosen from 8 players?", "o": ["56", "336", "40", "120"], "c": 0, "sol": "<span class=\"step\">C(8, 5) = <span class=\"frac\"><span class=\"num\">8!</span><span class=\"den\">5!·3!</span></span> = <span class=\"frac\"><span class=\"num\">8·7·6</span><span class=\"den\">6</span></span> = 56</span><div class=\"note\">Order doesn't matter → combinations.</div><span class=\"res\">56</span>"}, {"tag": "Permutations (order matters)", "q": "How many three-digit numbers with distinct digits from 1–5?", "o": ["60", "125", "10", "120"], "c": 0, "sol": "<span class=\"step\">V(5, 3) = <span class=\"frac\"><span class=\"num\">5!</span><span class=\"den\">2!</span></span> = 5·4·3 = 60</span><span class=\"res\">60</span>"}, {"tag": "Binomial coefficient", "q": "Coefficient of x³ in the expansion (1 + x)<sup>6</sup>?", "o": ["20", "15", "6", "120"], "c": 0, "sol": "<span class=\"step\">C(6, 3) = <span class=\"frac\"><span class=\"num\">6!</span><span class=\"den\">3!·3!</span></span> = 20</span><span class=\"res\">20</span>"}, {"tag": "Inclusion–exclusion", "q": "Of 100 students, 60 study English, 45 German, 25 both. How many study at least one?", "o": ["80", "105", "130", "25"], "c": 0, "sol": "<span class=\"step\">|E ∪ N| = |E| + |N| − |E ∩ N|</span><span class=\"step\">= 60 + 45 − 25 = 80</span><span class=\"res\">80</span>"}, {"tag": "Mathematical induction", "q": "What is 1 + 2 + … + n?", "o": ["<span class=\"frac\"><span class=\"num\">n(n+1)</span><span class=\"den\">2</span></span>", "<span class=\"frac\"><span class=\"num\">n²</span><span class=\"den\">2</span></span>", "<span class=\"frac\"><span class=\"num\">n(n−1)</span><span class=\"den\">2</span></span>", "<span class=\"frac\"><span class=\"num\">(n+1)²</span><span class=\"den\">2</span></span>"], "c": 0, "sol": "<span class=\"step\">Baza n=1: 1 = <span class=\"frac\"><span class=\"num\">1·2</span><span class=\"den\">2</span></span> ✓</span><span class=\"step\">Korak: <span class=\"frac\"><span class=\"num\">n(n+1)</span><span class=\"den\">2</span></span> + (n+1) = <span class=\"frac\"><span class=\"num\">(n+1)(n+2)</span><span class=\"den\">2</span></span> ✓</span><div class=\"note\">Proved by induction: base n=1, then step n → n+1.</div><span class=\"res\">1 + 2 + … + n = <span class=\"frac\"><span class=\"num\">n(n+1)</span><span class=\"den\">2</span></span></span>"}, {"tag": "Graph theory · handshake", "q": "A graph has 6 vertices, each of degree 3. How many edges?", "o": ["9", "18", "6", "12"], "c": 0, "sol": "<span class=\"step\">∑ deg(v) = 6 · 3 = 18 = 2·|E|</span><span class=\"step\">|E| = <span class=\"frac\"><span class=\"num\">18</span><span class=\"den\">2</span></span> = 9</span><div class=\"note\">Handshaking lemma: sum of degrees = twice the number of edges.</div><span class=\"res\">9 edges</span>"}], "de": [{"tag": "Logik · Tautologie", "q": "Ist (p → q) ≡ (¬p ∨ q) eine Tautologie?", "o": ["Ja, gilt für alle Werte", "Nein", "Nur wenn p wahr ist", "Nur wenn q wahr ist"], "c": 0, "sol": "<span class=\"step\">p=⊤, q=⊤: ⊤ i ⊤ ✓</span><span class=\"step\">p=⊤, q=⊥: ⊥ i ⊥ ✓</span><span class=\"step\">p=⊥: obe ⊤ ✓</span><div class=\"note\">Sie stimmen in jeder Zeile der Wahrheitstafel überein → Tautologie.</div><span class=\"res\">Ja — Tautologie</span>"}, {"tag": "Kombinationen", "q": "Auf wie viele Arten wählt man ein Team von 5 aus 8 Spielern?", "o": ["56", "336", "40", "120"], "c": 0, "sol": "<span class=\"step\">C(8, 5) = <span class=\"frac\"><span class=\"num\">8!</span><span class=\"den\">5!·3!</span></span> = <span class=\"frac\"><span class=\"num\">8·7·6</span><span class=\"den\">6</span></span> = 56</span><div class=\"note\">Reihenfolge egal → Kombinationen.</div><span class=\"res\">56</span>"}, {"tag": "Variationen (Reihenfolge zählt)", "q": "Wie viele dreistellige Zahlen mit verschiedenen Ziffern aus 1–5?", "o": ["60", "125", "10", "120"], "c": 0, "sol": "<span class=\"step\">V(5, 3) = <span class=\"frac\"><span class=\"num\">5!</span><span class=\"den\">2!</span></span> = 5·4·3 = 60</span><span class=\"res\">60</span>"}, {"tag": "Binomialkoeffizient", "q": "Koeffizient von x³ in der Entwicklung (1 + x)<sup>6</sup>?", "o": ["20", "15", "6", "120"], "c": 0, "sol": "<span class=\"step\">C(6, 3) = <span class=\"frac\"><span class=\"num\">6!</span><span class=\"den\">3!·3!</span></span> = 20</span><span class=\"res\">20</span>"}, {"tag": "Inklusion–Exklusion", "q": "Von 100 Studenten lernen 60 Englisch, 45 Deutsch, 25 beide. Wie viele mindestens eine Sprache?", "o": ["80", "105", "130", "25"], "c": 0, "sol": "<span class=\"step\">|E ∪ N| = |E| + |N| − |E ∩ N|</span><span class=\"step\">= 60 + 45 − 25 = 80</span><span class=\"res\">80</span>"}, {"tag": "Vollständige Induktion", "q": "Wie viel ist 1 + 2 + … + n?", "o": ["<span class=\"frac\"><span class=\"num\">n(n+1)</span><span class=\"den\">2</span></span>", "<span class=\"frac\"><span class=\"num\">n²</span><span class=\"den\">2</span></span>", "<span class=\"frac\"><span class=\"num\">n(n−1)</span><span class=\"den\">2</span></span>", "<span class=\"frac\"><span class=\"num\">(n+1)²</span><span class=\"den\">2</span></span>"], "c": 0, "sol": "<span class=\"step\">Baza n=1: 1 = <span class=\"frac\"><span class=\"num\">1·2</span><span class=\"den\">2</span></span> ✓</span><span class=\"step\">Korak: <span class=\"frac\"><span class=\"num\">n(n+1)</span><span class=\"den\">2</span></span> + (n+1) = <span class=\"frac\"><span class=\"num\">(n+1)(n+2)</span><span class=\"den\">2</span></span> ✓</span><div class=\"note\">Beweis durch Induktion: Basis n=1, dann Schritt n → n+1.</div><span class=\"res\">1 + 2 + … + n = <span class=\"frac\"><span class=\"num\">n(n+1)</span><span class=\"den\">2</span></span></span>"}, {"tag": "Graphentheorie · Handschlag", "q": "Ein Graph hat 6 Knoten mit Grad 3. Wie viele Kanten?", "o": ["9", "18", "6", "12"], "c": 0, "sol": "<span class=\"step\">∑ deg(v) = 6 · 3 = 18 = 2·|E|</span><span class=\"step\">|E| = <span class=\"frac\"><span class=\"num\">18</span><span class=\"den\">2</span></span> = 9</span><div class=\"note\">Handschlaglemma: Summe der Grade = doppelte Kantenzahl.</div><span class=\"res\">9 Kanten</spa  class=\"num\">n(n+1)</span><span class=\"den\">2</span></span>", "<span class=\"frac\"><span class=\"num\">n²</span><span class=\"den\">2</span></span>", "<span class=\"frac\"><span class=\"num\">n(n−1)</span><span class=\"den\">2</span></span>", "<span class=\"frac\"><span class=\"num\">(n+1)²</span><span class=\"den\">2</span></span>"], "c": 0, "sol": "<span class=\"step\">Baza n=1: 1 = <span class=\"frac\"><span class=\"num\">1·2</span><span class=\"den\">2</span></span> ✓</span><span class=\"step\">Korak: <span class=\"frac\"><span class=\"num\">n(n+1)</span><span class=\"den\">2</span></span> + (n+1) = <span class=\"frac\"><span class=\"num\">(n+1)(n+2)</span><span class=\"den\">2</span></span> ✓</span><div class=\"note\">Preuve par récurrence : base n=1, puis pas n → n+1.</div><span class=\"res\">1 + 2 + … + n = <span class=\"frac\"><span class=\"num\">n(n+1)</span><span class=\"den\">2</span></span></span>"}, {"tag": "Théorie des graphes · poignées de main", "q": "Un graphe a 6 sommets de degré 3. Combien d'arêtes ?", "o": ["9", "18", "6", "12"], "c": 0, "sol": "<span class=\"step\">∑ deg(v) = 6 · 3 = 18 = 2·|E|</span><span class=\"step\">|E| = <span class=\"frac\"><span class=\"num\">18</span><span class=\"den\">2</span></span> = 9</span><div class=\"note\">Lemme des poignées de main : somme des degrés = 2× nombre d'arêtes.</div><span class=\"res\">9 arêtes</span>"}], "es": [{"tag": "Lógica · tautología", "q": "¿Es (p → q) ≡ (¬p ∨ q) una tautología?", "o": ["Sí, vale para todos los valores", "No", "Solo cuando p es verdadero", "Solo cuando q es verdadero"], "c": 0, "sol": "<span class=\"step\">p=⊤, q=⊤: ⊤ i ⊤ ✓</span><span class=\"step\">p=⊤, q=⊥: ⊥ i ⊥ ✓</span><span class=\"step\">p=⊥: obe ⊤ ✓</span><div class=\"note\">Coinciden en cada fila de la tabla de verdad → tautología.</div><span class=\"res\">Sí — tautología</span>"}, {"tag": "Combinaciones", "q": "¿De cuántas formas se elige un equipo de 5 entre 8 jugadores?", "o": ["56", "336", "40", "120"], "c" var SUBJ="Diskretna matematika";
var ASKHREF="predmet-diskretna-matematika.html";
var $=function(id){return document.getElementById(id)};
function lng(){try{var s=localStorage.getItem('mathia_lang');if(s){s=s.slice(0,2).toLowerCase();if(DATA[s])return s;}}catch(e){}return 'sr'}
function U(o){var l=lng();return (o&&(o[l]||o.sr))||''}
var LANG=lng();if(!DATA[LANG])LANG='sr';
var Q=DATA[LANG];
var i=0,score=0,hearts=3,streak=0,answered=false;
var curOrder=[],curCorrect=0,curBtns=[],L=["A","B","C","D","E"];
function chrome(){
 $('eyebrow').textContent=U(I18N.eyebrow);
 $('free').textContent=U(I18N.free);
 $('solH').textContent=U(I18N.solH);

 var s=$('lang');if(s)s.value=LANG;

}
function render(){
 answered=false;Q=DATA[LANG];var it=Q[i];
 $('qnum').textContent=U(I18N.qnum)+' '+(i+1)+' / '+Q.length;
 $('tag').innerHTML=it.tag||'';
 $('q').innerHTML=it.q;
 $('mascot').textContent='🦉';$('fb').textContent='';$('fb').className='fb';

 $('reveal').classList.remove('hidden');
 $('next').classList.add('hidden');
 $('prog').style.width=(i/Q.length*100)+'%';

 curOrder=it.__ord;curCorrect=curOrder.indexOf(it.c);curBtns=[];
 var box=$('opts');box.className='opts';box.innerHTML='';
 curOrder.forEach(function(orig,pos){var b=document.createElement('button');b.className='opt';

}
function pick(pos,btn){
 if(answered)return;answered=true;var ok=(pos===curCorrect);

 curBtns.forEach(function(o,idx){o.style.pointerEvents='none';if(idx===curCorrect)o.classList.add('correct');});

   $('mascot').textContent=['🥳','😻','🌟','💯','🎈'][Math.floor(Math.random()*5)];
   var p=UIX.fbokv[LANG]||UIX.fbokv.sr;$('fb').textContent=p[Math.floor(Math.random()*p.length)];$('fb').className='fb ok';miniConf();
 }else{btn.classList.add('wrong');streak=0;$('streak').textContent='🔥 0';hearts=Math.max(0,hearts-1);
   $('hearts').textContent='❤️'.repeat(hearts)+'🤍'.repeat(3-hearts);
   $('mascot').textContent='🫣';$('fb').textContent=U(I18N.fbNo);$('fb').className='fb no';}

$('reveal').onclick=function(){$('sol').classList.add('on');this.classList.add('hidden');};
$('next').onclick=function(){i++;if(i>=Q.length){finish();return;}render();};
function finish(){

}

function spawnConf(n){var box=$('conf');var cols=['#C6A05C','#B01E48','#CC5E7E','#F0DCA8','#3FB98C','#E7D2A2'];for(var k=0;k<n;k++){var s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.background=cols[k%cols.length];s.style.animationDuration=(1.6+Math.random()*1.4)+'s';s.style.transform='rotate('+Math.random()*360+'deg)';if(Math.random()<.25)s.style.borderRadius='50%';box.appendChild(s);setTimeout(function(el){return function(){el.remove()}}(s),3200);}}
function miniConf(){spawnConf(14)}
function bigConf(){spawnConf(90);var h=['💛','🌸','✨','🎉'];for(var k=0;k<16;k++){(function(k){setTimeout(function(){var s=document.createElement('i');s.textContent=h[k%4];s.style.cssText='position:absolute;top:-6%;font-size:20px;left:'+(Math.random()*100)+'%;animation:cf '+(1.8+Math.random())+'s linear forwards';$('conf').appendChild(s);setTimeout(function(){s.remove()},3200)},k*60)})(k);}}
(function(){var box=$('fall'),g=['∫','∑','√','π','∞','∂','θ','Δ','≈','½','💛','🌸','✦','⭐'];for(var k=0;k<20;k++){var s=document.createElement('span');s.textContent=g[k%g.length];if(k%3===0)s.className='m';s.style.left=Math.random()*100+'%';s.style.fontSize=(13+Math.random()*20)+'px';s.style.animationDuration=(7+Math.random()*8)+'s';s.style.animationDelay=(-Math.random()*10)+'s';box.appendChild(s);}})();
$('lang').addEventListener('change',function(){LANG=this.value;if(!DATA[LANG])LANG='sr';try{localStorage.setItem('mathia_lang',this.value);}catch(e){}try{window.dispatchEvent(new CustomEvent('mathia:lang',{detail:this.value}));}catch(e){}if(!$('report').classList.contains('hidden'))finish();else render();});
window.addEventListener('mathia:lang',function(e){var v=(e&&e.detail)?String(e.detail).slice(0,2):LANG;if(DATA[v])LANG=v;if(!$('report').classList.contains('hidden'))finish();else render();});
render();

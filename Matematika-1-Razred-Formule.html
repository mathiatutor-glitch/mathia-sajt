<style>
:root{--cream:#FBF6EE;--ink:#5A1024;--ink2:#7A3346;--gold:#C6A05C;--goldlt:#F0DCA8;--malina:#B01E48;--malina2:#CC5E7E;--mint:#3FB98C;--muted:#8A7A80}

 background:radial-gradient(520px 400px at 104% -6%,#F6E1EC 0,transparent 56%),radial-gradient(500px 380px at -6% 106%,#F7ECD6 0,transparent 58%),var(--cream);overflow-x:hidden}
#fall{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fall span{position:absolute;top:-8%;font-family:'Spectral',serif;font-style:italic;color:rgba(198,160,92,.22);animation:fl linear infinite}

@keyframes fl{0%{transform:translateY(-10vh) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(112vh) rotate(24deg);opacity:0}}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:14px 18px 40px}
.top{display:flex;align-items:center;gap:10px;padding:4px 2px 8px}
.top .back{color:var(--ink2);text-decoration:none;font-weight:800;font-size:1.1rem}
.top .lang{margin-left:auto;border:1px solid var(--goldlt);border-radius:100px;padding:5px 10px;font-family:inherit;font-weight:800;font-size:.72rem;color:var(--ink);background:#fff}
.head{text-align:center;margin:6px 0 14px}

.head h1{font-family:'Spectral',serif;color:var(--ink);font-size:1.8rem;margin:4px 0 2px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.flip{perspective:1000px;min-height:190px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;min-height:190px;transition:transform .6s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d;animation:pop .4s both}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:18px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 20px 44px -30px rgba(90,16,36,.5)}
.front{background:linear-gradient(180deg,#FFFDF9,#FBF1E4);border:1px solid var(--goldlt)}
.front .em{font-size:2.3rem;margin-bottom:6px}
.front h3{font-family:'Spectral',serif;color:var(--ink);font-size:1.2rem;margin:0}
.front .tap{margin-top:10px;font-size:.76rem;font-weight:800;color:var(--gold);letter-spacing:.04em}
.back{background:linear-gradient(180deg,#FFF7FA,#FBEEF2);border:1px solid #F0D6DF;transform:rotateY(180deg);overflow-y:auto}
.back .fxx{display:block;font-family:'Spectral','Cambria Math',Georgia,serif;color:var(--ink);font-size:1.02rem;margin:5px 0;line-height:1.4}
.back .lbl{font-size:.66rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--malina);margin-bottom:6px}
@media(prefers-reduced-motion:reduce){.inner{transition:none}*{animation:none!important}}

<script>
var D={"eyebrow": {"sr": "Formule ✨", "en": "Formule ✨", "de": "Formule ✨", "fr": "Formule ✨", "es": "Formule ✨", "it": "Formule ✨", "ru": "Formule ✨", "pt": "Formule ✨"}, "title": {"sr": "Formule · 1. razred", "en": "Formulas · Grade 1", "de": "Formeln · 1. Klasse", "fr": "Formules · 1re année", "es": "Fórmulas · 1.º curso", "it": "Formule · 1° anno", "ru": "Формулы · 1 класс", "pt": "Fórmulas · 1.º ano"}, "topics": [{"name": {"sr": "Logika i skupovi", "en": "Logic and Sets", "de": "Logik und Mengen", "fr": "Logique et ensembles", "es": "Lógica y conjuntos", "it": "Logica e insiemi", "ru": "Логика и множества", "pt": "Lógica e conjuntos"}, "theory": {"sr": "<b>Iskazi i logičke operacije.</b> Iskaz je rečenica koja je ili tačna ili netačna. Osnovne logičke operacije su negacija (¬), konjunkcija (∧), disjunkcija (∨), implikacija (⇒) i ekvivalencija (⇔). <b>Skupovi.</b> Skup je kolekcija objekata (elemenata). Pripadnost elementa skupu obeležava se sa ∈, nepripadnost sa ∉. Osnovne operacije sa skupovima su unija (∪), presek (∩) i razlika (\\). Skup A je podskup skupa B (A ⊆ B) ako se svaki element skupa A nalazi i u skupu B. Odnosi među skupovima prikazuju se Venovim dijagramima.", "en": "<b>Statements and logical operations.</b> A statement is a sentence that is either true or false. The basic logical operations are negation (¬), conjunction (∧), disjunction (∨), implication (⇒) and equivalence (⇔). <b>Sets.</b> A set is a collection of objects (elements). Membership of an element in a set is denoted by ∈, non-membership by ∉. The basic operations on sets are union (∪), intersection (∩) and difference (\\). Set A is a subset of set B (A ⊆ B) if every element of A also belongs to B. Relations between sets are shown using Venn diagrams.", "de": "<b>Aussagen und logische Operationen.</b> Eine Aussage ist ein Satz, der entweder wahr oder falsch ist. Die grundlegenden logischen Operationen sind die Negation (¬), die Konjunktion (∧), die Disjunktion (∨), die Implikation (⇒) und die Äquivalenz (⇔). <b>Mengen.</b> Eine Menge ist eine Zusammenfassung von Objekten (Elementen). Die Zugehörigkeit eines Elements zu einer Menge wird mit ∈ bezeichnet, die Nichtzugehörigkeit mit ∉. Die grundlegenden Mengenoperationen sind Vereinigung (∪), Durchschnitt (∩) und Differenz (\\). Die Menge A ist eine Teilmenge der Menge B (A ⊆ B), wenn jedes Element von A auch zu B gehört. Beziehungen zwischen Mengen werden mit Venn-Diagrammen dargestellt.", "fr": "<b>Propositions et opérations logiques.</b> Une proposition est une phrase qui est soit vraie, soit fausse. Les opérations logiques de base sont la négation (¬), la conjonction (∧), la disjonction (∨), l'implication (⇒) et l'équivalence (⇔). <b>Ensembles.</b> Un ensemble est une collection d'objets (éléments). L'appartenance d'un élément à un ensemble se note ∈, la non-appartenance ∉. Les opérations de base sur les ensembles sont l'union (∪), l'intersection (∩) et la différence (\\). L'ensemble A est un sous-ensemble de l'ensemble B (A ⊆ B) si chaque élément de A appartient aussi à B. Les relations entre ensembles se représentent à l'aide de diagrammes de Venn.", "es": "<b>Proposiciones y operaciones lógicas.</b> Una proposición es una oración que es verdadera o falsa. Las operaciones lógicas básicas son la negación (¬), la conjunción (∧), la disyunción (∨), la implicación (⇒) y la equivalencia (⇔). <b>Conjuntos.</b> Un conjunto es una colección de objetos (elementos). La pertenencia de un elemento a un conjunto se denota con ∈, la no pertenencia con ∉. Las operaciones básicas con conjuntos son la unión (∪), la intersección (∩) y la diferencia (\\). El conjunto A es un subconjunto del conjunto B (A ⊆ B) si todo elemento de A pertenece también a B. Las relaciones entre conjuntos se representan mediante diagramas de Venn.", "it": "<b>Enunciati e operazioni logiche.</b> Un enunciato è una frase che è vera o falsa. Le operazioni logiche di base sono la negazione (¬), la congiunzione (∧), la disgiunzione (∨), l'implicazione (⇒) e l'equivalenza (⇔). <b>Insiemi.</b> Un insieme è una collezione di oggetti (elementi). L'appartenenza di un elemento a un insieme si indica con ∈, la non appartenenza con ∉. Le operazioni fondamentali sugli insiemi sono l'unione (∪), l'intersezione (∩) e la differenza (\\). L'insieme A è un sottoinsieme dell'insieme B (A ⊆ B) se ogni elemento di A appartiene anche a B. Le relazioni tra insiemi si rappresentano con i diagrammi di Venn.", "ru": "<b>Высказывания и логические операции.</b> Высказывание - это предложение, которое либо истинно, либо ложно. Основные логические операции - отрицание (¬), конъюнкция (∧), дизъюнкция (∨), импликация (⇒) и эквивалентность (⇔). <b>Множества.</b> Множество - это совокупность объектов (элементов). Принадлежность элемента множеству обозначается ∈, непринадлежность - ∉. Основные операции над множествами - объединение (∪), пересечение (∩) и разность (\\). Множество A является подмножеством множества B (A ⊆ B), если каждый элемент A принадлежит и B. Отношения между множествами изображают с помощью диаграмм Венна.", "pt": "<b>Proposições e operações lógicas.</b> Uma proposição é uma frase que é verdadeira ou falsa. As operações lógicas básicas são a negação (¬), a conjunção (∧), a disjunção (∨), a implicação (⇒) e a equivalência (⇔). <b>Conjuntos.</b> Um conjunto é uma coleção de objetos (elementos). A pertença de um elemento a um conjunto denota-se por ∈, a não pertença por ∉. As operações básicas com conjuntos são a união (∪), a interseção (∩) e a diferença (\\). O conjunto A é subconjunto do conjunto B (A ⊆ B) se todo elemento de A pertencer também a B. As relações entre conjuntos representam-se com diagramas de Venn."}, "formulas": [{"sr": "De Morganov zakon: ¬(A ∨ B) = ¬A ∧ ¬B", "en": "De Morgan's law: ¬(A ∨ B) = ¬A ∧ ¬B", "de": "De-Morgan-Gesetz: ¬(A ∨ B) = ¬A ∧ ¬B", "fr": "Loi de De Morgan : ¬(A ∨ B) = ¬A ∧ ¬B", "es": "Ley de De Morgan: ¬(A ∨ B) = ¬A ∧ ¬B", "it": "Legge di De Morgan: ¬(A ∨ B) = ¬A ∧ ¬B", "ru": "Закон де Моргана: ¬(A ∨ B) = ¬A ∧ ¬B", "pt": "Lei de De Morgan: ¬(A ∨ B) = ¬A ∧ ¬B"}, {"sr": "Distributivnost: A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)", "en": "Distributivity: A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)", "de": "Distributivität: A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)", "fr": "Distributivité : A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)", "es": "Distributividad: A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)", "it": "Distributività: A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)", "ru": "Дистрибутивность: A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)", "pt": "Distributividade: A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)"}, {"sr": "Broj podskupova skupa sa n elemenata: 2ⁿ", "en": "Number of subsets of a set with n elements: 2ⁿ", "de": "Anzahl der Teilmengen einer Menge mit n Elementen: 2ⁿ", "fr": "Nombre de sous-ensembles d'un ensemble à n éléments : 2ⁿ", "es": "Número de subconjuntos de un conjunto de n elementos: 2ⁿ", "it": "Numero di sottoinsiemi di un insieme con n elementi: 2ⁿ", "ru": "Число подмножеств множества из n элементов: 2ⁿ", "pt": "Número de subconjuntos de um conjunto com n elementos: 2ⁿ"}], "remember": {"sr": "Prazan skup je podskup svakog skupa, a svaki skup je podskup samog sebe: ∅ ⊆ A, A ⊆ A.", "en": "The empty set is a subset of every set, and every set is a subset of itself: ∅ ⊆ A, A ⊆ A.", "de": "Die leere Menge ist Teilmenge jeder Menge, und jede Menge ist Teilmenge von sich selbst: ∅ ⊆ A, A ⊆ A.", "fr": "L'ensemble vide est un sous-ensemble de tout ensemble, et tout ensemble est un sous-ensemble de lui-même : ∅ ⊆ A, A ⊆ A.", "es": "El conjunto vacío es subconjunto de todo conjunto, y todo conjunto es subconjunto de sí mismo: ∅ ⊆ A, A ⊆ A.", "it": "L'insieme vuoto è sottoinsieme di ogni insieme, e ogni insieme è sottoinsieme di se stesso: ∅ ⊆ A, A ⊆ A.", "ru": "Пустое множество является подмножеством любого множества, а каждое множество - подмножество самого себя: ∅ ⊆ A, A ⊆ A.", "pt": "O conjunto vazio é subconjunto de qualquer conjunto, e todo conjunto é subconjunto de si mesmo: ∅ ⊆ A, A ⊆ A."}, "problem": {"statement": {"sr": "Dati su skupovi A = {1,2,3,4,5} i B = {3,4,5,6,7}. Odredi A ∪ B, A ∩ B i A \\ B.", "en": "Given the sets A = {1,2,3,4,5} and B = {3,4,5,6,7}. Determine A ∪ B, A ∩ B and A \\ B.", "de": "Gegeben sind die Mengen A = {1,2,3,4,5} und B = {3,4,5,6,7}. Bestimme A ∪ B, A ∩ B und A \\ B.", "fr": "On donne les ensembles A = {1,2,3,4,5} et B = {3,4,5,6,7}. Déterminer A ∪ B, A ∩ B et A \\ B.", "es": "Se dan los conjuntos A = {1,2,3,4,5} y B = {3,4,5,6,7}. Determinar A ∪ B, A ∩ B y A \\ B.", "it": "Sono dati gli insiemi A = {1,2,3,4,5} e B = {3,4,5,6,7}. Determina A ∪ B, A ∩ B e A \\ B.", "ru": "Даны множества A = {1,2,3,4,5} и B = {3,4,5,6,7}. Найди A ∪ B, A ∩ B и A \\ B.", "pt": "São dados os conjuntos A = {1,2,3,4,5} e B = {3,4,5,6,7}. Determinar A ∪ B, A ∩ B e A \\ B."}, "steps": [{"sr": "A ∪ B = {1,2,3,4,5,6,7} - svi elementi iz oba skupa, bez ponavljanja", "en": "A ∪ B = {1,2,3,4,5,6,7} - all elements from both sets, without repetition", "de": "A ∪ B = {1,2,3,4,5,6,7} - alle Elemente aus beiden Mengen, ohne Wiederholung", "fr": "A ∪ B = {1,2,3,4,5,6,7} - tous les éléments des deux ensembles, sans répétition", "es": "A ∪ B = {1,2,3,4,5,6,7} - todos los elementos de ambos conjuntos, sin repetición", "it": "A ∪ B = {1,2,3,4,5,6,7} - tutti gli elementi di entrambi gli insiemi, senza ripetizioni", "ru": "A ∪ B = {1,2,3,4,5,6,7} - все элементы обоих множеств без повторений", "pt": "A ∪ B = {1,2,3,4,5,6,7} - todos os elementos de ambos os conjuntos, sem repetição"}, {"sr": "A ∩ B = {3,4,5} - elementi zajednički za oba skupa", "en": "A ∩ B = {3,4,5} - elements common to both sets", "de": "A ∩ B = {3,4,5} - Elemente, die beiden Mengen gemeinsam sind", "fr": "A ∩ B = {3,4,5} - éléments communs aux deux ensembles", "es": "A ∩ B = {3,4,5} - elementos comunes a ambos conjuntos", "it": "A ∩ B = {3,4,5} - elementi comuni a entrambi gli insiemi", "ru": "A ∩ B = {3,4,5} - элементы, общие для обоих множеств", "pt": "A ∩ B = {3,4,5} - elementos comuns a ambos os conjuntos"}, {"sr": "A \\ B = {1,2} - elementi iz A koji nisu u B", "en": "A \\ B = {1,2} - elements of A that are not in B", "de": "A \\ B = {1,2} - Elemente von A, die nicht in B sind", "fr": "A \\ B = {1,2} - éléments de A qui ne sont pas dans B", "es": "A \\ B = {1,2} - elementos de A que no están en B", "it": "A \\ B = {1,2} - elementi di A che non sono in B", "ru": "A \\ B = {1,2} - элементы A, не принадлежащие B", "pt": "A \\ B = {1,2} - elementos de A que não estão em B"}]}}, {"name": {"sr": "Realni brojevi", "en": "Real Numbers", "de": "Reelle Zahlen", "fr": "Nombres réels", "es": "Números reales", "it": "Numeri reali", "ru": "Действительные числа", "pt": "Números reais"}, "theory": {"sr": "<b>Skupovi brojeva.</b> Prirodni brojevi N = {1,2,3,...}, celi brojevi Z, racionalni brojevi Q (mogu se zapisati kao razlomak a/b, gde je b≠0) i iracionalni brojevi I (beskonačan neperiodičan decimalni zapis, npr. √2, π). Važi N ⊂ Z ⊂ Q ⊂ R, gde je R = Q ∪ I skup realnih brojeva. <b>Apsolutna vrednost.</b> Apsolutna vrednost broja a, u oznaci |a|, predstavlja rastojanje broja a od nule na brojevnoj pravoj. <b>Intervali.</b> Podskupovi skupa R zapisuju se pomoću intervala, na primer (a,b) ili [a,b].", "en": "<b>Number sets.</b> Natural numbers N = {1,2,3,...}, integers Z, rational numbers Q (can be written as a fraction a/b, where b≠0) and irrational numbers I (infinite non-repeating decimal expansion, e.g. √2, π). It holds that N ⊂ Z ⊂ Q ⊂ R, where R = Q ∪ I is the set of real numbers. <b>Absolute value.</b> The absolute value of a number a, denoted |a|, represents the distance of a from zero on the number line. <b>Intervals.</b> Subsets of R are written using intervals, for example (a,b) or [a,b].", "de": "<b>Zahlenmengen.</b> Natürliche Zahlen N = {1,2,3,...}, ganze Zahlen Z, rationale Zahlen Q (lassen sich als Bruch a/b schreiben, wobei b≠0) und irrationale Zahlen I (unendliche, nicht periodische Dezimaldarstellung, z. B. √2, π). Es gilt N ⊂ Z ⊂ Q ⊂ R, wobei R = Q ∪ I die Menge der reellen Zahlen ist. <b>Absolutwert.</b> Der Absolutwert einer Zahl a, geschrieben |a|, gibt den Abstand von a zur Null auf der Zahlengeraden an. <b>Intervalle.</b> Teilmengen von R werden mithilfe von Intervallen geschrieben, zum Beispiel (a,b) oder [a,b].", "fr": "<b>Ensembles de nombres.</b> Nombres naturels N = {1,2,3,...}, nombres entiers Z, nombres rationnels Q (peuvent s'écrire comme une fraction a/b, avec b≠0) et nombres irrationnels I (développement décimal infini non périodique, par exemple √2, π). On a N ⊂ Z ⊂ Q ⊂ R, où R = Q ∪ I est l'ensemble des nombres réels. <b>Valeur absolue.</b> La valeur absolue d'un nombre a, notée |a|, représente la distance de a à zéro sur la droite numérique. <b>Intervalles.</b> Les sous-ensembles de R s'écrivent à l'aide d'intervalles, par exemple (a,b) ou [a,b].", "es": "<b>Conjuntos numéricos.</b> Números naturales N = {1,2,3,...}, números enteros Z, números racionales Q (se pueden escribir como fracción a/b, con b≠0) y números irracionales I (expresión decimal infinita no periódica, por ejemplo √2, π). Se cumple N ⊂ Z ⊂ Q ⊂ R, donde R = Q ∪ I es el conjunto de los números reales. <b>Valor absoluto.</b> El valor absoluto de un número a, denotado |a|, representa la distancia de a al cero en la recta numérica. <b>Intervalos.</b> Los subconjuntos de R se escriben mediante intervalos, por ejemplo (a,b) o [a,b].", "it": "<b>Insiemi numerici.</b> Numeri naturali N = {1,2,3,...}, numeri interi Z, numeri razionali Q (si possono scrivere come frazione a/b, con b≠0) e numeri irrazionali I (rappresentazione decimale infinita non periodica, ad esempio √2, π). Vale N ⊂ Z ⊂ Q ⊂ R, dove R = Q ∪ I è l'insieme dei numeri reali. <b>Valore assoluto.</b> Il valore assoluto di un numero a, indicato con |a|, rappresenta la distanza di a dallo zero sulla retta numerica. <b>Intervalli.</b> I sottoinsiemi di R si scrivono mediante intervalli, ad esempio (a,b) oppure [a,b].", "ru": "<b>Числовые множества.</b> Натуральные числа N = {1,2,3,...}, целые числа Z, рациональные числа Q (можно записать в виде дроби a/b, где b≠0) и иррациональные числа I (бесконечная непериодическая десятичная запись, например √2, π). Верно N ⊂ Z ⊂ Q ⊂ R, где R = Q ∪ I - множество действительных чисел. <b>Абсолютная величина.</b> Абсолютная величина числа a, обозначаемая |a|, представляет собой расстояние от a до нуля на числовой прямой. <b>Промежутки.</b> Подмножества множества R записывают с помощью промежутков, например (a,b) или [a,b].", "pt": "<b>Conjuntos numéricos.</b> Números naturais N = {1,2,3,...}, números inteiros Z, números racionais Q (podem escrever-se como fração a/b, com b≠0) e números irracionais I (representação decimal infinita não periódica, por exemplo √2, π). Verifica-se N ⊂ Z ⊂ Q ⊂ R, onde R = Q ∪ I é o conjunto dos números reais. <b>Valor absoluto.</b> O valor absoluto de um número a, denotado |a|, representa a distância de a a zero na reta numérica. <b>Intervalos.</b> Os subconjuntos de R escrevem-se por meio de intervalos, por exemplo (a,b) ou [a,b]."}, "formulas": [{"sr": "|a| = a, ako je a ≥ 0; |a| = -a, ako je a < 0", "en": "|a| = a, if a ≥ 0; |a| = -a, if a < 0", "de": "|a| = a, wenn a ≥ 0; |a| = -a, wenn a < 0", "fr": "|a| = a, si a ≥ 0 ; |a| = -a, si a < 0", "es": "|a| = a, si a ≥ 0; |a| = -a, si a < 0", "it": "|a| = a, se a ≥ 0; |a| = -a, se a < 0", "ru": "|a| = a, если a ≥ 0; |a| = -a, если a < 0", "pt": "|a| = a, se a ≥ 0; |a| = -a, se a < 0"}, {"sr": "N ⊂ Z ⊂ Q ⊂ R", "en": "N ⊂ Z ⊂ Q ⊂ R", "de": "N ⊂ Z ⊂ Q ⊂ R", "fr": "N ⊂ Z ⊂ Q ⊂ R", "es": "N ⊂ Z ⊂ Q ⊂ R", "it": "N ⊂ Z ⊂ Q ⊂ R", "ru": "N ⊂ Z ⊂ Q ⊂ R", "pt": "N ⊂ Z ⊂ Q ⊂ R"}, {"sr": "Interval (a,b) = {x ∈ R : a < x < b}", "en": "Interval (a,b) = {x ∈ R : a < x < b}", "de": "Intervall (a,b) = {x ∈ R : a < x < b}", "fr": "Intervalle (a,b) = {x ∈ R : a < x < b}", "es": "Intervalo (a,b) = {x ∈ R : a < x < b}", "it": "Intervallo (a,b) = {x ∈ R : a < x < b}", "ru": "Промежуток (a,b) = {x ∈ R : a < x < b}", "pt": "Intervalo (a,b) = {x ∈ R : a < x < b}"}], "remember": {"sr": "Svaki racionalan broj se može zapisati kao razlomak a/b (b≠0) sa konačnim ili periodičnim decimalnim zapisom; iracionalni brojevi to nemaju.", "en": "Every rational number can be written as a fraction a/b (b≠0) with a finite or repeating decimal expansion; irrational numbers cannot.", "de": "Jede rationale Zahl lässt sich als Bruch a/b (b≠0) mit endlicher oder periodischer Dezimaldarstellung schreiben; irrationale Zahlen können das nicht.", "fr": "Tout nombre rationnel peut s'écrire comme une fraction a/b (b≠0) avec un développement décimal fini ou périodique ; les nombres irrationnels ne le peuvent pas.", "es": "Todo número racional puede escribirse como una fracción a/b (b≠0) con expresión decimal finita o periódica; los números irracionales no pueden.", "it": "Ogni numero razionale può essere scritto come frazione a/b (b≠0) con rappresentazione decimale finita o periodica; i numeri irrazionali non possono.", "ru": "Любое рациональное число можно записать в виде дроби a/b (b≠0) с конечной или периодической десятичной записью; иррациональные числа - нет.", "pt": "Todo número racional pode ser escrito como fração a/b (b≠0) com representação decimal finita ou periódica; os números irracionais não podem."}, "problem": {"statement": {"sr": "Uporediti brojeve -3/4 i -2/3, a zatim izračunati |-3/4 - (-2/3)|.", "en": "Compare the numbers -3/4 and -2/3, then calculate |-3/4 - (-2/3)|.", "de": "Vergleiche die Zahlen -3/4 und -2/3 und berechne dann |-3/4 - (-2/3)|.", "fr": "Comparer les nombres -3/4 et -2/3, puis calculer |-3/4 - (-2/3)|.", "es": "Comparar los números -3/4 y -2/3, y luego calcular |-3/4 - (-2/3)|.", "it": "Confrontare i numeri -3/4 e -2/3, quindi calcolare |-3/4 - (-2/3)|.", "ru": "Сравнить числа -3/4 и -2/3, затем вычислить |-3/4 - (-2/3)|.", "pt": "Comparar os números -3/4 e -2/3 e depois calcular |-3/4 - (-2/3)|."}, "steps": [{"sr": "Svedi razlomke na zajednički imenilac: -3/4 = -9/12, -2/3 = -8/12", "en": "Reduce the fractions to a common denominator: -3/4 = -9/12, -2/3 = -8/12", "de": "Bringe die Brüche auf einen gemeinsamen Nenner: -3/4 = -9/12, -2/3 = -8/12", "fr": "Réduire les fractions au même dénominateur : -3/4 = -9/12, -2/3 = -8/12", "es": "Reducir las fracciones a un denominador común: -3/4 = -9/12, -2/3 = -8/12", "it": "Riduci le frazioni allo stesso denominatore: -3/4 = -9/12, -2/3 = -8/12", "ru": "Приведи дроби к общему знаменателю: -3/4 = -9/12, -2/3 = -8/12", "pt": "Reduzir as frações ao mesmo denominador: -3/4 = -9/12, -2/3 = -8/12"}, {"sr": "Uporedi brojioce: -9 < -8, pa je -9/12 < -8/12, tj. -3/4 < -2/3", "en": "Compare the numerators: -9 < -8, so -9/12 < -8/12, i.e. -3/4 < -2/3", "de": "Vergleiche die Zähler: -9 < -8, also -9/12 < -8/12, d. h. -3/4 < -2/3", "fr": "Comparer les numérateurs : -9 < -8, donc -9/12 < -8/12, c'est-à-dire -3/4 < -2/3", "es": "Comparar los numeradores: -9 < -8, así que -9/12 < -8/12, es decir, -3/4 < -2/3", "it": "Confronta i numeratori: -9 < -8, quindi -9/12 < -8/12, cioè -3/4 < -2/3", "ru": "Сравни числители: -9 < -8, значит -9/12 < -8/12, то есть -3/4 < -2/3", "pt": "Comparar os numeradores: -9 < -8, logo -9/12 < -8/12, ou seja, -3/4 < -2/3"}, {"sr": "Izračunaj razliku: -3/4 - (-2/3) = -9/12 + 8/12 = -1/12", "en": "Calculate the difference: -3/4 - (-2/3) = -9/12 + 8/12 = -1/12", "de": "Berechne die Differenz: -3/4 - (-2/3) = -9/12 + 8/12 = -1/12", "fr": "Calculer la différence : -3/4 - (-2/3) = -9/12 + 8/12 = -1/12", "es": "Calcular la diferencia: -3/4 - (-2/3) = -9/12 + 8/12 = -1/12", "it": "Calcola la differenza: -3/4 - (-2/3) = -9/12 + 8/12 = -1/12", "ru": "Вычисли разность: -3/4 - (-2/3) = -9/12 + 8/12 = -1/12", "pt": "Calcular a diferença: -3/4 - (-2/3) = -9/12 + 8/12 = -1/12"}, {"sr": "Apsolutna vrednost: |-1/12| = 1/12", "en": "Absolute value: |-1/12| = 1/12", "de": "Absolutwert: |-1/12| = 1/12", "fr": "Valeur absolue : |-1/12| = 1/12", "es": "Valor absoluto: |-1/12| = 1/12", "it": "Valore assoluto: |-1/12| = 1/12", "ru": "Абсолютная величина: |-1/12| = 1/12", "pt": "Valor absoluto: |-1/12| = 1/12"}]}}, {"name": {"sr": "Proporcionalnost", "en": "Proportionality", "de": "Proportionalität", "fr": "Proportionnalité", "es": "Proporcionalidad", "it": "Proporzionalità", "ru": "Пропорциональность", "pt": "Proporcionalidade"}, "theory": {"sr": "<b>Direktna proporcionalnost.</b> Veličine x i y su direktno proporcionalne ako je njihov količnik konstantan: y/x = k (k je koeficijent proporcionalnosti), odnosno y = k·x. Kada se x poveća, y se povećava u istom razmeru. <b>Obrnuta proporcionalnost.</b> Veličine x i y su obrnuto proporcionalne ako je njihov proizvod konstantan: x·y = k. Kada se x poveća, y se smanjuje. <b>Proporcija.</b> Jednakost dve razmere a:b = c:d naziva se proporcija. Osnovno svojstvo proporcije glasi: proizvod spoljašnjih članova jednak je proizvodu unutrašnjih članova (a·d = b·c).", "en": "<b>Direct proportionality.</b> Quantities x and y are directly proportional if their ratio is constant: y/x = k (k is the proportionality coefficient), i.e. y = k·x. When x increases, y increases in the same ratio. <b>Inverse proportionality.</b> Quantities x and y are inversely proportional if their product is constant: x·y = k. When x increases, y decreases. <b>Proportion.</b> The equality of two ratios a:b = c:d is called a proportion. The fundamental property of proportion states: the product of the outer terms equals the product of the inner terms (a·d = b·c).", "de": "<b>Direkte Proportionalität.</b> Die Größen x und y sind direkt proportional, wenn ihr Verhältnis konstant ist: y/x = k (k ist der Proportionalitätskoeffizient), also y = k·x. Wenn x zunimmt, nimmt y im gleichen Verhältnis zu. <b>Umgekehrte (indirekte) Proportionalität.</b> Die Größen x und y sind umgekehrt proportional, wenn ihr Produkt konstant ist: x·y = k. Wenn x zunimmt, nimmt y ab. <b>Proportion.</b> Die Gleichheit zweier Verhältnisse a:b = c:d nennt man Proportion. Die Grundeigenschaft der Proportion lautet: Das Produkt der äußeren Glieder ist gleich dem Produkt der inneren Glieder (a·d = b·c).", "fr": "<b>Proportionnalité directe.</b> Les grandeurs x et y sont directement proportionnelles si leur rapport est constant : y/x = k (k est le coefficient de proportionnalité), soit y = k·x. Quand x augmente, y augmente dans le même rapport. <b>Proportionnalité inverse.</b> Les grandeurs x et y sont inversement proportionnelles si leur produit est constant : x·y = k. Quand x augmente, y diminue. <b>Proportion.</b> L'égalité de deux rapports a:b = c:d s'appelle une proportion. La propriété fondamentale de la proportion énonce : le produit des extrêmes est égal au produit des moyens (a·d = b·c).", "es": "<b>Proporcionalidad directa.</b> Las magnitudes x e y son directamente proporcionales si su razón es constante: y/x = k (k es el coeficiente de proporcionalidad), es decir, y = k·x. Cuando x aumenta, y aumenta en la misma proporción. <b>Proporcionalidad inversa.</b> Las magnitudes x e y son inversamente proporcionales si su producto es constante: x·y = k. Cuando x aumenta, y disminuye. <b>Proporción.</b> La igualdad de dos razones a:b = c:d se llama proporción. La propiedad fundamental de la proporción establece que el producto de los extremos es igual al producto de los medios (a·d = b·c).", "it": "<b>Proporzionalità diretta.</b> Le grandezze x e y sono direttamente proporzionali se il loro rapporto è costante: y/x = k (k è il coefficiente di proporzionalità), cioè y = k·x. Quando x aumenta, y aumenta nello stesso rapporto. <b>Proporzionalità inversa.</b> Le grandezze x e y sono inversamente proporzionali se il loro prodotto è costante: x·y = k. Quando x aumenta, y diminuisce. <b>Proporzione.</b> L'uguaglianza di due rapporti a:b = c:d si chiama proporzione. La proprietà fondamentale della proporzione afferma che il prodotto degli estremi è uguale al prodotto dei medi (a·d = b·c).", "ru": "<b>Прямая пропорциональность.</b> Величины x и y прямо пропорциональны, если их отношение постоянно: y/x = k (k - коэффициент пропорциональности), то есть y = k·x. Когда x увеличивается, y увеличивается в том же отношении. <b>Обратная пропорциональность.</b> Величины x и y обратно пропорциональны, если их произведение постоянно: x·y = k. Когда x увеличивается, y уменьшается. <b>Пропорция.</b> Равенство двух отношений a:b = c:d называется пропорцией. Основное свойство пропорции: произведение крайних членов равно произведению средних членов (a·d = b·c).", "pt": "<b>Proporcionalidade direta.</b> As grandezas x e y são diretamente proporcionais se a sua razão for constante: y/x = k (k é o coeficiente de proporcionalidade), ou seja, y = k·x. Quando x aumenta, y aumenta na mesma proporção. <b>Proporcionalidade inversa.</b> As grandezas x e y são inversamente proporcionais se o seu produto for constante: x·y = k. Quando x aumenta, y diminui. <b>Proporção.</b> A igualdade de duas razões a:b = c:d chama-se proporção. A propriedade fundamental da proporção diz que o produto dos extremos é igual ao produto dos meios (a·d = b·c)."}, "formulas": [{"sr": "Direktna proporcionalnost: y = k · x", "en": "Direct proportionality: y = k · x", "de": "Direkte Proportionalität: y = k · x", "fr": "Proportionnalité directe : y = k · x", "es": "Proporcionalidad directa: y = k · x", "it": "Proporzionalità diretta: y = k · x", "ru": "Прямая пропорциональность: y = k · x", "pt": "Proporcionalidade direta: y = k · x"}, {"sr": "Obrnuta proporcionalnost: x · y = k", "en": "Inverse proportionality: x · y = k", "de": "Umgekehrte Proportionalität: x · y = k", "fr": "Proportionnalité inverse : x · y = k", "es": "Proporcionalidad inversa: x · y = k", "it": "Proporzionalità inversa: x · y = k", "ru": "Обратная пропорциональность: x · y = k", "pt": "Proporcionalidade inversa: x · y = k"}, {"sr": "Osnovno svojstvo proporcije: a:b = c:d ⇒ a · d = b · c", "en": "Fundamental property of proportion: a:b = c:d ⇒ a · d = b · c", "de": "Grundeigenschaft der Proportion: a:b = c:d ⇒ a · d = b · c", "fr": "Propriété fondamentale de la proportion : a:b = c:d ⇒ a · d = b · c", "es": "Propiedad fundamental de la proporción: a:b = c:d ⇒ a · d = b · c", "it": "Proprietà fondamentale della proporzione: a:b = c:d ⇒ a · d = b · c", "ru": "Основное свойство пропорции: a:b = c:d ⇒ a · d = b · c", "pt": "Propriedade fundamental da proporção: a:b = c:d ⇒ a · d = b · c"}], "remember": {"sr": "Kod direktne proporcionalnosti količnik y/x je stalan; kod obrnute, stalan je proizvod x·y.", "en": "In direct proportionality the ratio y/x is constant; in inverse proportionality the product x·y is constant.", "de": "Bei direkter Proportionalität ist das Verhältnis y/x konstant; bei umgekehrter Proportionalität ist das Produkt x·y konstant.", "fr": "Dans la proportionnalité directe, le rapport y/x est constant ; dans la proportionnalité inverse, c'est le produit x·y qui est constant.", "es": "En la proporcionalidad directa, la razón y/x es constante; en la inversa, es constante el producto x·y.", "it": "Nella proporzionalità diretta il rapporto y/x è costante; in quella inversa è costante il prodotto x·y.", "ru": "При прямой пропорциональности отношение y/x постоянно; при обратной - постоянно произведение x·y.", "pt": "Na proporcionalidade direta, a razão y/x é constante; na inversa, é constante o produto x·y."}, "problem": {"statement": {"sr": "Za 5 radnika potrebno je 12 dana da izgrade zid. Za koliko dana će isti zid izgraditi 6 radnika, ako svi rade istim tempom?", "en": "It takes 5 workers 12 days to build a wall. How many days will it take 6 workers to build the same wall, if everyone works at the same pace?", "de": "5 Arbeiter benötigen 12 Tage, um eine Mauer zu bauen. Wie viele Tage benötigen 6 Arbeiter für dieselbe Mauer, wenn alle im gleichen Tempo arbeiten?", "fr": "Il faut 12 jours à 5 ouvriers pour construire un mur. En combien de jours 6 ouvriers construiront-ils le même mur, si tous travaillent au même rythme ?", "es": "5 obreros tardan 12 días en construir un muro. ¿En cuántos días construirán el mismo muro 6 obreros, si todos trabajan al mismo ritmo?", "it": "5 operai impiegano 12 giorni per costruire un muro. In quanti giorni costruiranno lo stesso muro 6 operai, se tutti lavorano allo stesso ritmo?", "ru": "5 рабочим нужно 12 дней, чтобы построить стену. За сколько дней ту же стену построят 6 рабочих, если все работают в одном темпе?", "pt": "5 operários precisam de 12 dias para construir um muro. Em quantos dias 6 operários construirão o mesmo muro, se todos trabalharem ao mesmo ritmo?"}, "steps": [{"sr": "Broj radnika i broj dana su obrnuto proporcionalni: radnici · dani = const", "en": "The number of workers and the number of days are inversely proportional: workers · days = const", "de": "Die Anzahl der Arbeiter und die Anzahl der Tage sind umgekehrt proportional: Arbeiter · Tage = const", "fr": "Le nombre d'ouvriers et le nombre de jours sont inversement proportionnels : ouvriers · jours = const", "es": "El número de obreros y el número de días son inversamente proporcionales: obreros · días = const", "it": "Il numero di operai e il numero di giorni sono inversamente proporzionali: operai · giorni = cost", "ru": "Число рабочих и число дней обратно пропорциональны: рабочие · дни = const", "pt": "O número de operários e o número de dias são inversamente proporcionais: operários · dias = const"}, {"sr": "Izračunaj konstantu: 5 · 12 = 60 (radnik-dana potrebno za posao)", "en": "Calculate the constant: 5 · 12 = 60 (worker-days needed for the job)", "de": "Berechne die Konstante: 5 · 12 = 60 (Arbeiter-Tage, die für die Arbeit nötig sind)", "fr": "Calculer la constante : 5 · 12 = 60 (ouvriers-jours nécessaires pour le travail)", "es": "Calcular la constante: 5 · 12 = 60 (obrero-días necesarios para el trabajo)", "it": "Calcola la costante: 5 · 12 = 60 (operai-giorno necessari per il lavoro)", "ru": "Вычисли константу: 5 · 12 = 60 (человеко-дней требуется для работы)", "pt": "Calcular a constante: 5 · 12 = 60 (operário-dias necessários para o trabalho)"}, {"sr": "Podeli sa brojem novih radnika: 60 : 6 = 10 dana", "en": "Divide by the new number of workers: 60 : 6 = 10 days", "de": "Teile durch die neue Anzahl der Arbeiter: 60 : 6 = 10 Tage", "fr": "Diviser par le nouveau nombre d'ouvriers : 60 : 6 = 10 jours", "es": "Dividir entre el nuevo número de obreros: 60 : 6 = 10 días", "it": "Dividi per il nuovo numero di operai: 60 : 6 = 10 giorni", "ru": "Раздели на новое число рабочих: 60 : 6 = 10 дней", "pt": "Dividir pelo novo número de operários: 60 : 6 = 10 dias"}, {"sr": "Odgovor: 6 radnika će zid izgraditi za 10 dana.", "en": "Answer: 6 workers will build the wall in 10 days.", "de": "Antwort: 6 Arbeiter bauen die Mauer in 10 Tagen.", "fr": "Réponse : 6 ouvriers construiront le mur en 10 jours.", "es": "Respuesta: 6 obreros construirán el muro en 10 días.", "it": "Risposta: 6 operai costruiranno il muro in 10 giorni.", "ru": "Ответ: 6 рабочих построят стену за 10 дней.", "pt": "Resposta: 6 operários construirão o muro em 10 dias."}]}}, {"name": {"sr": "Racionalni algebarski izrazi", "en": "Rational Algebraic Expressions", "de": "Rationale algebraische Ausdrücke", "fr": "Expressions algébriques rationnelles", "es": "Expresiones algebraicas racionales", "it": "Espressioni algebriche razionali", "ru": "Рациональные алгебраические выражения", "pt": "Expressões algébricas racionais"}, "theory": {"sr": "<b>Algebarski razlomci.</b> Racionalni algebarski izraz je razlomak čiji su brojilac i imenilac polinomi, na primer (x+1)/(x-2). Uslov definisanosti je da imenilac mora biti različit od nule. <b>Rastavljanje na činioce.</b> Pre svake operacije sa algebarskim razlomcima, polinome treba rastaviti na činioce - izvlačenjem zajedničkog činioca, primenom formula a²-b²=(a-b)(a+b) i (a±b)²=a²±2ab+b², ili grupisanjem. <b>Operacije.</b> Sabiranje i oduzimanje razlomaka zahteva zajednički imenilac, dok se množenje i deljenje izvode direktno, uz skraćivanje zajedničkih činilaca.", "en": "<b>Algebraic fractions.</b> A rational algebraic expression is a fraction whose numerator and denominator are polynomials, for example (x+1)/(x-2). The condition for it to be defined is that the denominator must not equal zero. <b>Factoring.</b> Before performing any operation with algebraic fractions, the polynomials should be factored - by taking out a common factor, applying the formulas a²-b²=(a-b)(a+b) and (a±b)²=a²±2ab+b², or by grouping. <b>Operations.</b> Adding and subtracting fractions requires a common denominator, while multiplication and division are performed directly, simplifying common factors.", "de": "<b>Algebraische Brüche.</b> Ein rationaler algebraischer Ausdruck ist ein Bruch, dessen Zähler und Nenner Polynome sind, zum Beispiel (x+1)/(x-2). Bedingung für die Definiertheit ist, dass der Nenner ungleich null sein muss. <b>Faktorisieren.</b> Vor jeder Operation mit algebraischen Brüchen sollten die Polynome faktorisiert werden - durch Ausklammern eines gemeinsamen Faktors, durch Anwendung der Formeln a²-b²=(a-b)(a+b) und (a±b)²=a²±2ab+b², oder durch Gruppieren. <b>Operationen.</b> Addition und Subtraktion von Brüchen erfordern einen gemeinsamen Nenner, während Multiplikation und Division direkt ausgeführt werden, wobei gemeinsame Faktoren gekürzt werden.", "fr": "<b>Fractions algébriques.</b> Une expression algébrique rationnelle est une fraction dont le numérateur et le dénominateur sont des polynômes, par exemple (x+1)/(x-2). La condition d'existence est que le dénominateur soit différent de zéro. <b>Factorisation.</b> Avant toute opération sur des fractions algébriques, il faut factoriser les polynômes - en mettant en évidence un facteur commun, en appliquant les formules a²-b²=(a-b)(a+b) et (a±b)²=a²±2ab+b², ou par regroupement. <b>Opérations.</b> L'addition et la soustraction de fractions exigent un dénominateur commun, tandis que la multiplication et la division s'effectuent directement, en simplifiant les facteurs communs.", "es": "<b>Fracciones algebraicas.</b> Una expresión algebraica racional es una fracción cuyo numerador y denominador son polinomios, por ejemplo (x+1)/(x-2). La condición de existencia es que el denominador sea distinto de cero. <b>Factorización.</b> Antes de cualquier operación con fracciones algebraicas, hay que factorizar los polinomios - extrayendo un factor común, aplicando las fórmulas a²-b²=(a-b)(a+b) y (a±b)²=a²±2ab+b², o agrupando términos. <b>Operaciones.</b> Sumar y restar fracciones requiere un denominador común, mientras que multiplicar y dividir se hace directamente, simplificando los factores comunes.", "it": "<b>Frazioni algebriche.</b> Un'espressione algebrica razionale è una frazione il cui numeratore e denominatore sono polinomi, ad esempio (x+1)/(x-2). La condizione di esistenza è che il denominatore sia diverso da zero. <b>Scomposizione in fattori.</b> Prima di ogni operazione con le frazioni algebriche, i polinomi vanno scomposti in fattori - raccogliendo un fattore comune, applicando le formule a²-b²=(a-b)(a+b) e (a±b)²=a²±2ab+b², oppure raggruppando. <b>Operazioni.</b> Addizione e sottrazione di frazioni richiedono un denominatore comune, mentre moltiplicazione e divisione si eseguono direttamente, semplificando i fattori comuni.", "ru": "<b>Алгебраические дроби.</b> Рациональное алгебраическое выражение - это дробь, числитель и знаменатель которой являются многочленами, например (x+1)/(x-2). Условие существования - знаменатель не равен нулю. <b>Разложение на множители.</b> Перед любой операцией с алгебраическими дробями многочлены следует разложить на множители - вынесением общего множителя, применением формул a²-b²=(a-b)(a+b) и (a±b)²=a²±2ab+b², или группировкой. <b>Операции.</b> Сложение и вычитание дробей требует общего знаменателя, а умножение и деление выполняются напрямую, с сокращением общих множителей.", "pt": "<b>Frações algébricas.</b> Uma expressão algébrica racional é uma fração cujo numerador e denominador são polinómios, por exemplo (x+1)/(x-2). A condição de existência é que o denominador seja diferente de zero. <b>Fatoração.</b> Antes de qualquer operação com frações algébricas, os polinómios devem ser fatorados - colocando em evidência um fator comum, aplicando as fórmulas a²-b²=(a-b)(a+b) e (a±b)²=a²±2ab+b², ou por agrupamento. <b>Operações.</b> A adição e a subtração de frações exigem um denominador comum, enquanto a multiplicação e a divisão se fazem diretamente, simplificando os fatores comuns."}, "formulas": [{"sr": "a² - b² = (a - b)(a + b)", "en": "a² - b² = (a - b)(a + b)", "de": "a² - b² = (a - b)(a + b)", "fr": "a² - b² = (a - b)(a + b)", "es": "a² - b² = (a - b)(a + b)", "it": "a² - b² = (a - b)(a + b)", "ru": "a² - b² = (a - b)(a + b)", "pt": "a² - b² = (a - b)(a + b)"}, {"sr": "(a + b)² = a² + 2ab + b²", "en": "(a + b)² = a² + 2ab + b²", "de": "(a + b)² = a² + 2ab + b²", "fr": "(a + b)² = a² + 2ab + b²", "es": "(a + b)² = a² + 2ab + b²", "it": "(a + b)² = a² + 2ab + b²", "ru": "(a + b)² = a² + 2ab + b²", "pt": "(a + b)² = a² + 2ab + b²"}, {"sr": "Uslov definisanosti razlomka a/b: b ≠ 0", "en": "Condition for the fraction a/b to be defined: b ≠ 0", "de": "Definitionsbedingung des Bruchs a/b: b ≠ 0", "fr": "Condition d'existence de la fraction a/b : b ≠ 0", "es": "Condición de existencia de la fracción a/b: b ≠ 0", "it": "Condizione di esistenza della frazione a/b: b ≠ 0", "ru": "Условие существования дроби a/b: b ≠ 0", "pt": "Condição de existência da fração a/b: b ≠ 0"}], "remember": {"sr": "Pre skraćivanja algebarskog razlomka, brojilac i imenilac rastavi na činioce - skraćuju se samo množioci, nikad sabirci.", "en": "Before simplifying an algebraic fraction, factor the numerator and denominator - only factors can be cancelled, never terms of a sum.", "de": "Bevor du einen algebraischen Bruch kürzt, faktorisiere Zähler und Nenner - gekürzt werden dürfen nur Faktoren, niemals Summanden.", "fr": "Avant de simplifier une fraction algébrique, factorise le numérateur et le dénominateur - seuls les facteurs peuvent être simplifiés, jamais les termes d'une somme.", "es": "Antes de simplificar una fracción algebraica, factoriza el numerador y el denominador - solo se pueden simplificar factores, nunca términos de una suma.", "it": "Prima di semplificare una frazione algebrica, scomponi in fattori numeratore e denominatore - si semplificano solo i fattori, mai i termini di una somma.", "ru": "Перед сокращением алгебраической дроби разложи числитель и знаменатель на множители - сокращать можно только множители, а не слагаемые.", "pt": "Antes de simplificar uma fração algébrica, fatoriza o numerador e o denominador - só se simplificam fatores, nunca termos de uma soma."}, "problem": {"statement": {"sr": "Uprosti izraz (x² - 4) / (x² + 4x + 4), gde je x ≠ -2.", "en": "Simplify the expression (x² - 4) / (x² + 4x + 4), where x ≠ -2.", "de": "Vereinfache den Ausdruck (x² - 4) / (x² + 4x + 4), wobei x ≠ -2.", "fr": "Simplifier l'expression (x² - 4) / (x² + 4x + 4), où x ≠ -2.", "es": "Simplificar la expresión (x² - 4) / (x² + 4x + 4), donde x ≠ -2.", "it": "Semplifica l'espressione (x² - 4) / (x² + 4x + 4), dove x ≠ -2.", "ru": "Упростить выражение (x² - 4) / (x² + 4x + 4), где x ≠ -2.", "pt": "Simplificar a expressão (x² - 4) / (x² + 4x + 4), onde x ≠ -2."}, "steps": [{"sr": "Rastavi brojilac (razlika kvadrata): x² - 4 = (x - 2)(x + 2)", "en": "Factor the numerator (difference of squares): x² - 4 = (x - 2)(x + 2)", "de": "Faktorisiere den Zähler (Differenz von Quadraten): x² - 4 = (x - 2)(x + 2)", "fr": "Factoriser le numérateur (différence de carrés) : x² - 4 = (x - 2)(x + 2)", "es": "Factorizar el numerador (diferencia de cuadrados): x² - 4 = (x - 2)(x + 2)", "it": "Scomponi il numeratore (differenza di quadrati): x² - 4 = (x - 2)(x + 2)", "ru": "Разложи числитель (разность квадратов): x² - 4 = (x - 2)(x + 2)", "pt": "Fatorizar o numerador (diferença de quadrados): x² - 4 = (x - 2)(x + 2)"}, {"sr": "Rastavi imenilac (kvadrat binoma): x² + 4x + 4 = (x + 2)²", "en": "Factor the denominator (square of a binomial): x² + 4x + 4 = (x + 2)²", "de": "Faktorisiere den Nenner (Quadrat eines Binoms): x² + 4x + 4 = (x + 2)²", "fr": "Factoriser le dénominateur (carré d'un binôme) : x² + 4x + 4 = (x + 2)²", "es": "Factorizar el denominador (cuadrado de un binomio): x² + 4x + 4 = (x + 2)²", "it": "Scomponi il denominatore (quadrato di un binomio): x² + 4x + 4 = (x + 2)²", "ru": "Разложи знаменатель (квадрат бинома): x² + 4x + 4 = (x + 2)²", "pt": "Fatorizar o denominador (quadrado de um binómio): x² + 4x + 4 = (x + 2)²"}, {"sr": "Skrati zajednički činilac (x + 2): [(x-2)(x+2)] / (x+2)² = (x - 2) / (x + 2)", "en": "Cancel the common factor (x + 2): [(x-2)(x+2)] / (x+2)² = (x - 2) / (x + 2)", "de": "Kürze den gemeinsamen Faktor (x + 2): [(x-2)(x+2)] / (x+2)² = (x - 2) / (x + 2)", "fr": "Simplifier le facteur commun (x + 2) : [(x-2)(x+2)] / (x+2)² = (x - 2) / (x + 2)", "es": "Simplificar el factor común (x + 2): [(x-2)(x+2)] / (x+2)² = (x - 2) / (x + 2)", "it": "Semplifica il fattore comune (x + 2): [(x-2)(x+2)] / (x+2)² = (x - 2) / (x + 2)", "ru": "Сократи общий множитель (x + 2): [(x-2)(x+2)] / (x+2)² = (x - 2) / (x + 2)", "pt": "Simplificar o fator comum (x + 2): [(x-2)(x+2)] / (x+2)² = (x - 2) / (x + 2)"}, {"sr": "Rezultat: (x - 2) / (x + 2), uz uslov x ≠ -2.", "en": "Result: (x - 2) / (x + 2), with the condition x ≠ -2.", "de": "Ergebnis: (x - 2) / (x + 2), unter der Bedingung x ≠ -2.", "fr": "Résultat : (x - 2) / (x + 2), avec la condition x ≠ -2.", "es": "Resultado: (x - 2) / (x + 2), con la condición x ≠ -2.", "it": "Risultato: (x - 2) / (x + 2), con la condizione x ≠ -2.", "ru": "Результат: (x - 2) / (x + 2), при условии x ≠ -2.", "pt": "Resultado: (x - 2) / (x + 2), com a condição x ≠ -2."}]}}, {"name": {"sr": "Linearna funkcija i jednačine", "en": "Linear Function and Equations", "de": "Lineare Funktion und Gleichungen", "fr": "Fonction linéaire et équations", "es": "Función lineal y ecuaciones", "it": "Funzione lineare ed equazioni", "ru": "Линейная функция и уравнения", "pt": "Função linear e equações"}, "theory": {"sr": "<b>Linearna jednačina.</b> Jednačina oblika ax + b = 0 (a≠0) naziva se linearna jednačina sa jednom nepoznatom, a njeno rešenje je x = -b/a. <b>Linearna funkcija.</b> Funkcija y = kx + n naziva se linearna funkcija; njen grafik je prava linija. Broj k je koeficijent pravca (nagib) i pokazuje koliko se y menja kada se x poveća za 1, a n je odsečak koji prava gradi na y-osi. <b>Sistem jednačina.</b> Sistem od dve linearne jednačine sa dve nepoznate rešava se metodom zamene ili metodom suprotnih koeficijenata (sabiranja), a rešenje je uređen par (x,y) koji zadovoljava obe jednačine.", "en": "<b>Linear equation.</b> An equation of the form ax + b = 0 (a≠0) is called a linear equation with one unknown, and its solution is x = -b/a. <b>Linear function.</b> The function y = kx + n is called a linear function; its graph is a straight line. The number k is the slope and shows how much y changes when x increases by 1, while n is the intercept the line makes on the y-axis. <b>System of equations.</b> A system of two linear equations with two unknowns is solved by substitution or by the elimination (addition) method, and the solution is an ordered pair (x,y) that satisfies both equations.", "de": "<b>Lineare Gleichung.</b> Eine Gleichung der Form ax + b = 0 (a≠0) heißt lineare Gleichung mit einer Unbekannten, ihre Lösung ist x = -b/a. <b>Lineare Funktion.</b> Die Funktion y = kx + n heißt lineare Funktion; ihr Graph ist eine Gerade. Die Zahl k ist die Steigung und zeigt, wie stark sich y ändert, wenn x um 1 zunimmt, und n ist der Abschnitt, den die Gerade auf der y-Achse bildet. <b>Gleichungssystem.</b> Ein System aus zwei linearen Gleichungen mit zwei Unbekannten wird durch Einsetzen oder durch das Additionsverfahren gelöst, und die Lösung ist ein geordnetes Paar (x,y), das beide Gleichungen erfüllt.", "fr": "<b>Équation linéaire.</b> Une équation de la forme ax + b = 0 (a≠0) s'appelle une équation linéaire à une inconnue, et sa solution est x = -b/a. <b>Fonction linéaire (affine).</b> La fonction y = kx + n s'appelle une fonction linéaire (affine) ; son graphique est une droite. Le nombre k est le coefficient directeur (la pente) et montre de combien varie y quand x augmente de 1, tandis que n est l'ordonnée à l'origine. <b>Système d'équations.</b> Un système de deux équations linéaires à deux inconnues se résout par substitution ou par la méthode d'addition (élimination), et la solution est un couple ordonné (x,y) qui vérifie les deux équations.", "es": "<b>Ecuación lineal.</b> Una ecuación de la forma ax + b = 0 (a≠0) se llama ecuación lineal con una incógnita, y su solución es x = -b/a. <b>Función lineal.</b> La función y = kx + n se llama función lineal (afín); su gráfica es una recta. El número k es la pendiente y muestra cuánto cambia y cuando x aumenta en 1, mientras que n es el punto donde la recta corta al eje y. <b>Sistema de ecuaciones.</b> Un sistema de dos ecuaciones lineales con dos incógnitas se resuelve por sustitución o por el método de eliminación (suma), y la solución es un par ordenado (x,y) que satisface ambas ecuaciones.", "it": "<b>Equazione lineare.</b> Un'equazione della forma ax + b = 0 (a≠0) si chiama equazione lineare a un'incognita, e la sua soluzione è x = -b/a. <b>Funzione lineare.</b> La funzione y = kx + n si chiama funzione lineare (affine); il suo grafico è una retta. Il numero k è il coefficiente angolare e indica quanto varia y quando x aumenta di 1, mentre n è l'intersezione che la retta forma con l'asse y. <b>Sistema di equazioni.</b> Un sistema di due equazioni lineari a due incognite si risolve con il metodo di sostituzione o con il metodo di addizione (eliminazione), e la soluzione è una coppia ordinata (x,y) che soddisfa entrambe le equazioni.", "ru": "<b>Линейное уравнение.</b> Уравнение вида ax + b = 0 (a≠0) называется линейным уравнением с одной неизвестной, его решение x = -b/a. <b>Линейная функция.</b> Функция y = kx + n называется линейной функцией; её график - прямая линия. Число k - угловой коэффициент (наклон), показывающий, насколько изменяется y при увеличении x на 1, а n - отрезок, отсекаемый прямой на оси y. <b>Система уравнений.</b> Система из двух линейных уравнений с двумя неизвестными решается методом подстановки или методом сложения (исключения), а решением служит упорядоченная пара (x,y), удовлетворяющая обоим уравнениям.", "pt": "<b>Equação linear.</b> Uma equação da forma ax + b = 0 (a≠0) chama-se equação linear com uma incógnita, e a sua solução é x = -b/a. <b>Função linear.</b> A função y = kx + n chama-se função linear (afim); o seu gráfico é uma reta. O número k é o declive e mostra quanto varia y quando x aumenta 1, enquanto n é a interseção que a reta faz com o eixo y. <b>Sistema de equações.</b> Um sistema de duas equações lineares com duas incógnitas resolve-se por substituição ou pelo método de adição (eliminação), e a solução é um par ordenado (x,y) que satisfaz ambas as equações."}, "formulas": [{"sr": "Linearna jednačina: ax + b = 0 ⇒ x = -b/a (a ≠ 0)", "en": "Linear equation: ax + b = 0 ⇒ x = -b/a (a ≠ 0)", "de": "Lineare Gleichung: ax + b = 0 ⇒ x = -b/a (a ≠ 0)", "fr": "Équation linéaire : ax + b = 0 ⇒ x = -b/a (a ≠ 0)", "es": "Ecuación lineal: ax + b = 0 ⇒ x = -b/a (a ≠ 0)", "it": "Equazione lineare: ax + b = 0 ⇒ x = -b/a (a ≠ 0)", "ru": "Линейное уравнение: ax + b = 0 ⇒ x = -b/a (a ≠ 0)", "pt": "Equação linear: ax + b = 0 ⇒ x = -b/a (a ≠ 0)"}, {"sr": "Linearna funkcija: y = kx + n", "en": "Linear function: y = kx + n", "de": "Lineare Funktion: y = kx + n", "fr": "Fonction linéaire : y = kx + n", "es": "Función lineal: y = kx + n", "it": "Funzione lineare: y = kx + n", "ru": "Линейная функция: y = kx + n", "pt": "Função linear: y = kx + n"}, {"sr": "Koeficijent pravca kroz dve tačke: k = (y₂ - y₁) / (x₂ - x₁)", "en": "Slope through two points: k = (y₂ - y₁) / (x₂ - x₁)", "de": "Steigung durch zwei Punkte: k = (y₂ - y₁) / (x₂ - x₁)", "fr": "Coefficient directeur passant par deux points : k = (y₂ - y₁) / (x₂ - x₁)", "es": "Pendiente que pasa por dos puntos: k = (y₂ - y₁) / (x₂ - x₁)", "it": "Coefficiente angolare per due punti: k = (y₂ - y₁) / (x₂ - x₁)", "ru": "Угловой коэффициент через две точки: k = (y₂ - y₁) / (x₂ - x₁)", "pt": "Declive através de dois pontos: k = (y₂ - y₁) / (x₂ - x₁)"}], "remember": {"sr": "Ako je k>0, funkcija raste; ako je k<0, funkcija opada; ako je k=0, funkcija je konstantna (prava paralelna x-osi).", "en": "If k>0, the function is increasing; if k<0, the function is decreasing; if k=0, the function is constant (a line parallel to the x-axis).", "de": "Ist k>0, ist die Funktion steigend; ist k<0, ist die Funktion fallend; ist k=0, ist die Funktion konstant (eine zur x-Achse parallele Gerade).", "fr": "Si k>0, la fonction est croissante ; si k<0, la fonction est décroissante ; si k=0, la fonction est constante (une droite parallèle à l'axe des x).", "es": "Si k>0, la función es creciente; si k<0, la función es decreciente; si k=0, la función es constante (una recta paralela al eje x).", "it": "Se k>0, la funzione è crescente; se k<0, la funzione è decrescente; se k=0, la funzione è costante (una retta parallela all'asse x).", "ru": "Если k>0, функция возрастает; если k<0, функция убывает; если k=0, функция постоянна (прямая параллельна оси x).", "pt": "Se k>0, a função é crescente; se k<0, a função é decrescente; se k=0, a função é constante (uma reta paralela ao eixo x)."}, "problem": {"statement": {"sr": "Reši sistem jednačina: 2x + y = 7, x - y = 2.", "en": "Solve the system of equations: 2x + y = 7, x - y = 2.", "de": "Löse das Gleichungssystem: 2x + y = 7, x - y = 2.", "fr": "Résoudre le système d'équations : 2x + y = 7, x - y = 2.", "es": "Resolver el sistema de ecuaciones: 2x + y = 7, x - y = 2.", "it": "Risolvi il sistema di equazioni: 2x + y = 7, x - y = 2.", "ru": "Решить систему уравнений: 2x + y = 7, x - y = 2.", "pt": "Resolver o sistema de equações: 2x + y = 7, x - y = 2."}, "steps": [{"sr": "Iz druge jednačine izrazi x: x = y + 2", "en": "From the second equation, express x: x = y + 2", "de": "Löse die zweite Gleichung nach x auf: x = y + 2", "fr": "À partir de la seconde équation, exprimer x : x = y + 2", "es": "De la segunda ecuación, despeja x: x = y + 2", "it": "Dalla seconda equazione, ricava x: x = y + 2", "ru": "Из второго уравнения вырази x: x = y + 2", "pt": "Da segunda equação, isola x: x = y + 2"}, {"sr": "Zameni u prvu jednačinu: 2(y + 2) + y = 7 ⇒ 3y + 4 = 7 ⇒ 3y = 3 ⇒ y = 1", "en": "Substitute into the first equation: 2(y + 2) + y = 7 ⇒ 3y + 4 = 7 ⇒ 3y = 3 ⇒ y = 1", "de": "Setze in die erste Gleichung ein: 2(y + 2) + y = 7 ⇒ 3y + 4 = 7 ⇒ 3y = 3 ⇒ y = 1", "fr": "Substituer dans la première équation : 2(y + 2) + y = 7 ⇒ 3y + 4 = 7 ⇒ 3y = 3 ⇒ y = 1", "es": "Sustituir en la primera ecuación: 2(y + 2) + y = 7 ⇒ 3y + 4 = 7 ⇒ 3y = 3 ⇒ y = 1", "it": "Sostituisci nella prima equazione: 2(y + 2) + y = 7 ⇒ 3y + 4 = 7 ⇒ 3y = 3 ⇒ y = 1", "ru": "Подставь в первое уравнение: 2(y + 2) + y = 7 ⇒ 3y + 4 = 7 ⇒ 3y = 3 ⇒ y = 1", "pt": "Substituir na primeira equação: 2(y + 2) + y = 7 ⇒ 3y + 4 = 7 ⇒ 3y = 3 ⇒ y = 1"}, {"sr": "Vrati u x = y + 2: x = 1 + 2 = 3", "en": "Substitute back into x = y + 2: x = 1 + 2 = 3", "de": "Setze zurück in x = y + 2 ein: x = 1 + 2 = 3", "fr": "Reporter dans x = y + 2 : x = 1 + 2 = 3", "es": "Sustituir de nuevo en x = y + 2: x = 1 + 2 = 3", "it": "Sostituisci di nuovo in x = y + 2: x = 1 + 2 = 3", "ru": "Подставь обратно в x = y + 2: x = 1 + 2 = 3", "pt": "Substituir de volta em x = y + 2: x = 1 + 2 = 3"}, {"sr": "Rešenje sistema: x = 3, y = 1", "en": "Solution of the system: x = 3, y = 1", "de": "Lösung des Systems: x = 3, y = 1", "fr": "Solution du système : x = 3, y = 1", "es": "Solución del sistema: x = 3, y = 1", "it": "Soluzione del sistema: x = 3, y = 1", "ru": "Решение системы: x = 3, y = 1", "pt": "Solução do sistema: x = 3, y = 1"}]}}, {"name": {"sr": "Trigonometrija pravouglog trougla", "en": "Trigonometry of the Right Triangle", "de": "Trigonometrie des rechtwinkligen Dreiecks", "fr": "Trigonométrie du triangle rectangle", "es": "Trigonometría del triángulo rectángulo", "it": "Trigonometria del triangolo rettangolo", "ru": "Тригонометрия прямоугольного треугольника", "pt": "Trigonometria do triângulo retângulo"}, "theory": {"sr": "<b>Trigonometrijske funkcije oštrog ugla.</b> U pravouglom trouglu, za oštar ugao α definišu se: sin α = naspramna kateta / hipotenuza, cos α = nalegla kateta / hipotenuza, tg α = naspramna kateta / nalegla kateta, ctg α = nalegla kateta / naspramna kateta. <b>Pitagorina teorema.</b> Zbir kvadrata kateta jednak je kvadratu hipotenuze: a² + b² = c². <b>Specijalne vrednosti.</b> Vrednosti trigonometrijskih funkcija za uglove 30°, 45° i 60° koriste se za rešavanje pravouglog trougla bez upotrebe kalkulatora.", "en": "<b>Trigonometric functions of an acute angle.</b> In a right triangle, for an acute angle α the following are defined: sin α = opposite leg / hypotenuse, cos α = adjacent leg / hypotenuse, tg α = opposite leg / adjacent leg, ctg α = adjacent leg / opposite leg. <b>Pythagorean theorem.</b> The sum of the squares of the legs equals the square of the hypotenuse: a² + b² = c². <b>Special values.</b> The values of the trigonometric functions for the angles 30°, 45° and 60° are used to solve right triangles without a calculator.", "de": "<b>Trigonometrische Funktionen eines spitzen Winkels.</b> Im rechtwinkligen Dreieck werden für einen spitzen Winkel α definiert: sin α = Gegenkathete / Hypotenuse, cos α = Ankathete / Hypotenuse, tg α = Gegenkathete / Ankathete, ctg α = Ankathete / Gegenkathete. <b>Satz des Pythagoras.</b> Die Summe der Kathetenquadrate ist gleich dem Quadrat der Hypotenuse: a² + b² = c². <b>Spezielle Werte.</b> Die Werte der trigonometrischen Funktionen für die Winkel 30°, 45° und 60° werden verwendet, um rechtwinklige Dreiecke ohne Taschenrechner zu lösen.", "fr": "<b>Fonctions trigonométriques d'un angle aigu.</b> Dans un triangle rectangle, pour un angle aigu α, on définit : sin α = côté opposé / hypoténuse, cos α = côté adjacent / hypoténuse, tg α = côté opposé / côté adjacent, ctg α = côté adjacent / côté opposé. <b>Théorème de Pythagore.</b> La somme des carrés des côtés de l'angle droit est égale au carré de l'hypoténuse : a² + b² = c². <b>Valeurs particulières.</b> Les valeurs des fonctions trigonométriques pour les angles 30°, 45° et 60° servent à résoudre un triangle rectangle sans calculatrice.", "es": "<b>Funciones trigonométricas de un ángulo agudo.</b> En un triángulo rectángulo, para un ángulo agudo α se definen: sen α = cateto opuesto / hipotenusa, cos α = cateto adyacente / hipotenusa, tg α = cateto opuesto / cateto adyacente, ctg α = cateto adyacente / cateto opuesto. <b>Teorema de Pitágoras.</b> La suma de los cuadrados de los catetos es igual al cuadrado de la hipotenusa: a² + b² = c². <b>Valores especiales.</b> Los valores de las funciones trigonométricas para los ángulos 30°, 45° y 60° se usan para resolver triángulos rectángulos sin calculadora.", "it": "<b>Funzioni trigonometriche di un angolo acuto.</b> In un triangolo rettangolo, per un angolo acuto α si definiscono: sen α = cateto opposto / ipotenusa, cos α = cateto adiacente / ipotenusa, tg α = cateto opposto / cateto adiacente, ctg α = cateto adiacente / cateto opposto. <b>Teorema di Pitagora.</b> La somma dei quadrati dei cateti è uguale al quadrato dell'ipotenusa: a² + b² = c². <b>Valori particolari.</b> I valori delle funzioni trigonometriche per gli angoli 30°, 45° e 60° si usano per risolvere un triangolo rettangolo senza calcolatrice.", "ru": "<b>Тригонометрические функции острого угла.</b> В прямоугольном треугольнике для острого угла α определяют: sin α = противолежащий катет / гипотенуза, cos α = прилежащий катет / гипотенуза, tg α = противолежащий катет / прилежащий катет, ctg α = прилежащий катет / противолежащий катет. <b>Теорема Пифагора.</b> Сумма квадратов катетов равна квадрату гипотенузы: a² + b² = c². <b>Особые значения.</b> Значения тригонометрических функций для углов 30°, 45° и 60° используются для решения прямоугольного треугольника без калькулятора.", "pt": "<b>Funções trigonométricas de um ângulo agudo.</b> Num triângulo retângulo, para um ângulo agudo α definem-se: sen α = cateto oposto / hipotenusa, cos α = cateto adjacente / hipotenusa, tg α = cateto oposto / cateto adjacente, ctg α = cateto adjacente / cateto oposto. <b>Teorema de Pitágoras.</b> A soma dos quadrados dos catetos é igual ao quadrado da hipotenusa: a² + b² = c². <b>Valores especiais.</b> Os valores das funções trigonométricas para os ângulos 30°, 45° e 60° são usados para resolver triângulos retângulos sem calculadora."}, "formulas": [{"sr": "sin α = naspramna/hipotenuza, cos α = nalegla/hipotenuza, tg α = naspramna/nalegla", "en": "sin α = opposite/hypotenuse, cos α = adjacent/hypotenuse, tg α = opposite/adjacent", "de": "sin α = Gegenkathete/Hypotenuse, cos α = Ankathete/Hypotenuse, tg α = Gegenkathete/Ankathete", "fr": "sin α = opposé/hypoténuse, cos α = adjacent/hypoténuse, tg α = opposé/adjacent", "es": "sen α = opuesto/hipotenusa, cos α = adyacente/hipotenusa, tg α = opuesto/adyacente", "it": "sen α = opposto/ipotenusa, cos α = adiacente/ipotenusa, tg α = opposto/adiacente", "ru": "sin α = противолежащий/гипотенуза, cos α = прилежащий/гипотенуза, tg α = противолежащий/прилежащий", "pt": "sen α = oposto/hipotenusa, cos α = adjacente/hipotenusa, tg α = oposto/adjacente"}, {"sr": "Pitagorina teorema: a² + b² = c²", "en": "Pythagorean theorem: a² + b² = c²", "de": "Satz des Pythagoras: a² + b² = c²", "fr": "Théorème de Pythagore : a² + b² = c²", "es": "Teorema de Pitágoras: a² + b² = c²", "it": "Teorema di Pitagora: a² + b² = c²", "ru": "Теорема Пифагора: a² + b² = c²", "pt": "Teorema de Pitágoras: a² + b² = c²"}, {"sr": "Osnovni trigonometrijski identitet: sin²α + cos²α = 1", "en": "Basic trigonometric identity: sin²α + cos²α = 1", "de": "Trigonometrischer Grundsatz: sin²α + cos²α =

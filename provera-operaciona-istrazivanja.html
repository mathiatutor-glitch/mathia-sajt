<style>

  #fall{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}

  /* topbar */

  .tb a.back{color:var(--ink2);text-decoration:none;font-weight:800;font-size:.9rem}
  .tb a.brand{font-family:'Spectral',serif;font-weight:700;letter-spacing:.12em;color:var(--ink);text-decoration:none}
  .tb a.brand b{color:var(--gold)}
  /* hero */
  .hero{text-align:center;padding:46px 0 8px}
  .eyebrow{font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;color:var(--malina);font-weight:800}
  .hero h1{font-size:clamp(2rem,5vw,2.9rem);margin:12px 0 8px}
  .hero p{color:var(--ink2);max-width:520px;margin:0 auto;font-size:1.05rem}
  .free{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(180deg,#FFFBF3,#FBF3E2);border:1px solid var(--goldsoft);border-radius:100px;padding:6px 15px;font-weight:800;font-size:.74rem;color:var(--golddk);margin-bottom:6px}
  /* progress */
  .prog{height:8px;border-radius:8px;background:rgba(198,160,92,.16);overflow:hidden;margin:26px 0 6px}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--goldsoft),var(--gold));width:0;transition:width .4s ease}
  .qnum{font-size:.8rem;color:var(--muted);font-weight:800;letter-spacing:.04em;text-align:center;margin-bottom:14px}
  /* card */
  .card{background:var(--card);border:1px solid rgba(198,160,92,.26);border-radius:24px;padding:32px 30px;box-shadow:0 34px 74px -42px rgba(120,40,60,.5);position:relative;overflow:hidden}
  .card:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),#FFF6D6,var(--gold),transparent)}
  .q-tag{display:inline-block;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--golddk);background:#FBF3E2;border:1px solid var(--goldsoft);border-radius:100px;padding:3px 11px;margin-bottom:12px}
  .q-txt{font-family:'Spectral',serif;font-size:clamp(1.35rem,3.4vw,1.7rem);color:var(--ink);line-height:1.35}
  .opts{display:grid;gap:11px;margin-top:20px}
  .opt{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid rgba(198,160,92,.32);background:#fffdf8;border-radius:14px;padding:14px 16px;font-family:'Spectral','Cambria Math',Georgia,serif;font-size:1.08rem;color:var(--ink);cursor:pointer;transition:transform .14s,border-color .14s,background .14s}
  .opt:hover:not(.done){border-color:var(--gold);background:#FBF3E2;transform:translateX(3px)}
  .opt .mk{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:800;font-size:.82rem;color:var(--golddk)}
  .opts.locked .opt{cursor:default}
  .opt.correct{border-color:#2E9E6B;background:linear-gradient(180deg,#F1FBF5,#E7F6EE)}
  .opt.correct .mk{border-color:#2E9E6B;background:#2E9E6B;color:#fff}
  .opt.wrong{border-color:#D08;opacity:.85;background:#FDF2F6}
  .opt.wrong .mk{border-color:#B01E48;background:#B01E48;color:#fff}
  .fb{text-align:center;font-weight:800;font-size:.95rem;margin-top:14px;min-height:1.2em}
  .fb.ok{color:#2E9E6B}.fb.no{color:var(--malina)}
  .sol{max-height:0;opacity:0;overflow:hidden;transition:max-height .5s ease,opacity .4s ease,margin .4s ease;margin:0}
  .sol.on{max-height:1400px;opacity:1;margin:20px 0 0}
  .sol-in{background:linear-gradient(180deg,#FFF7FA,#FBEEF2);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  .sol-h{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.72rem;color:var(--malina);margin-bottom:8px}
  .step{display:block;font-family:'Spectral','Cambria Math',Georgia,serif;font-size:1.1rem;color:var(--ink);white-space:nowrap;overflow-x:auto;margin:11px 0;line-height:1.5}
  .res{display:inline-block;margin-top:6px;font-family:'Spectral',serif;font-weight:700;color:var(--malina);border:1.5px solid rgba(176,30,72,.35);border-radius:10px;padding:4px 14px;background:#fff}
  .note{color:#7A3346;font-size:.96rem;margin-top:8px}
  /* math bits */
  .frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .18em}
  .frac>span{display:block;line-height:1.12;padding:0 .45em}
  .frac .num{border-bottom:1.5px solid currentColor;padding-bottom:.06em}
  .frac .den{padding-top:.06em}
  .lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .18em}
  .lim .und{font-size:.58em;margin-top:.14em;font-style:normal;white-space:nowrap}
  b{color:var(--ink)}
  /* controls */
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  .btn{display:inline-flex;align-items:center;gap:9px;border-radius:100px;padding:13px 26px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.94rem;cursor:pointer;text-decoration:none;border:1.5px solid transparent;transition:transform .16s,box-shadow .16s,background .16s}
  .btn-gold{background:linear-gradient(110deg,#EAD196,#C6A05C 45%,#F4E3B4 55%,#C6A05C 75%,#EAD196);background-size:240% auto;color:#3a2410;box-shadow:0 16px 30px -14px rgba(160,120,40,.7);animation:shim 7s linear infinite}
  @keyframes shim{to{background-position:-240% center}}
  .btn-gold:hover{transform:translateY(-2px)}
  .btn-ghost{background:transparent;border-color:rgba(198,160,92,.5);color:var(--golddk)}
  .btn-ghost:hover{background:#FBF3E2}
  .btn-mal{background:linear-gradient(160deg,#CC5E7E,#B01E48);color:#fff;box-shadow:0 14px 28px -12px rgba(176,30,72,.5)}
  .btn-mal:hover{transform:translateY(-2px)}
  .backbtn{background:none;border:none;color:var(--muted);font-family:inherit;font-weight:700;cursor:pointer;font-size:.86rem}
  /* end */
  #end{display:none;text-align:center}
  #end.on{display:block}
  #end .big{font-size:clamp(2rem,5vw,2.8rem);margin:6px 0 8px;background:linear-gradient(100deg,#9C7838,#E7D2A2 30%,#FFF7E2 48%,#E7D2A2 66%,#C6A05C);-webkit-background-clip:text;background-clip:text;color:transparent}
  .mbox{margin:22px 0 0;background:linear-gradient(160deg,#5A1024,#3A0B18);color:#fff;border-radius:20px;padding:26px;position:relative;overflow:hidden}
  .mbox:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .mbox h3{color:#fff;font-size:1.5rem;margin-bottom:6px}

  .pf{margin-top:56px;text-align:center;padding:34px 22px;color:var(--muted);font-size:.8rem;border-top:1px solid var(--goldsoft);background:linear-gradient(180deg,#FBF6EE,#F5EAD9)}

</style>

var DATA={"sr": [{"tag": "Postavljanje modela", "q": "Stolovi (profit 3), stolice (profit 2); rad 4x+2y ≤ 100, materijal x+y ≤ 40. Model?", "o": ["max 3x + 2y uz data ograničenja", "min 3x + 2y", "max 2x + 3y", "max 3x + 2y bez ograničenja"], "c": 0, "sol": "<span class=\"step\">max z = 3x + 2y</span><span class=\"step\">uz: 4x + 2y ≤ 100, x + y ≤ 40, x, y ≥ 0</span><div class=\"note\">Funkcija cilja = ukupan profit; ograničenja = raspoloživi resursi.</div><span class=\"res\">max 3x + 2y</span>"}, {"tag": "Grafička metoda — teme", "q": "Nađi optimum: max z = x + y uz x ≤ 3, y ≤ 4, x, y ≥ 0.", "o": ["z = 7 u temenu (3, 4)", "z = 3", "z = 4", "z = 12"], "c": 0, "sol": "<span class=\"step\">Optimum u temenu (3, 4)</span><span class=\"step\">z<sub>max</sub> = 3 + 4 = 7</span><div class=\"note\">Optimum linearnog programa je uvek u nekom temenu.</div><span class=\"res\">z = 7 u (3, 4)</span>"}, {"tag": "Dopunske promenljive", "q": "Svedi 2x + 3y ≤ 12 na jednakost.", "o": ["2x + 3y + s = 12, s ≥ 0", "2x + 3y = 12", "2x + 3y − s = 12", "2x + 3y + s = 0"], "c": 0, "sol": "<span class=\"step\">2x + 3y + s = 12, s ≥ 0</span><div class=\"note\">Dodaje se dopunska promenljiva s ≥ 0.</div><span class=\"res\">2x + 3y + s = 12</span>"}, {"tag": "PERT — očekivano vreme", "q": "Nađi očekivano trajanje: a = 2, m = 5, b = 8.", "o": ["5", "6", "4,5", "30"], "c": 0, "sol": "<span class=\"step\">t<sub>e</sub> = <span class=\"frac\"><span class=\"num\">a + 4m + b</span><span class=\"den\">6</span></span> = <span class=\"frac\"><span class=\"num\">30</span><span class=\"den\">6</span></span> = 5</span><span class=\"res\">t<sub>e</sub> = 5</span>"}, {"tag": "Transport — balans", "q": "Ponude 20, 30; potražnje 25, 25. Da li je problem uravnotežen?", "o": ["Da, uravnotežen (50 = 50)", "Ne", "Višak ponude", "Višak potražnje"], "c": 0, "sol": "<span class=\"step\">∑ ponuda = 50</span><span class=\"step\">∑ potražnja = 50</span><div class=\"note\">Jednaki zbirovi ponude i potražnje → uravnotežen.</div><span class=\"res\">Uravnotežen (50 = 50)</span>"}], "en": [{"tag": "Setting up the model", "q": "Tables (profit 3), chairs (profit 2); labour 4x+2y ≤ 100, material x+y ≤ 40. Model?", "o": ["max 3x + 2y s.t. the given constraints", "min 3x + 2y", "max 2x + 3y", "max 3x + 2y with no constraints"], "c": 0, "sol": "<span class=\"step\">max z = 3x + 2y</span><span class=\"step\">uz: 4x + 2y ≤ 100, x + y ≤ 40, x, y ≥ 0</span><div class=\"note\">Objective = total profit; constraints = available resources.</div><span class=\"res\">max 3x + 2y</span>"}, {"tag": "Graphical method — vertices", "q": "Find the optimum: max z = x + y s.t. x ≤ 3, y ≤ 4, x, y ≥ 0.", "o": ["z = 7 at vertex (3, 4)", "z = 3", "z = 4", "z = 12"], "c": 0, "sol": "<span class=\"step\">Optimum u temenu (3, 4)</span><span class=\"step\">z<sub>max</sub> = 3 + 4 = 7</span><div class=\"note\">The LP optimum is always at a vertex.</div><span class=\"res\">z = 7 u (3, 4)</span>"}, {"tag": "Slack variables", "q": "Reduce 2x + 3y ≤ 12 to an equality.", "o": ["2x + 3y + s = 12, s ≥ 0", "2x + 3y = 12", "2x + 3y − s = 12", "2x + 3y + s = 0"], "c": 0, "sol": "<span class=\"step\">2x + 3y + s = 12, s ≥ 0</span><div class=\"note\">Add a slack variable s ≥ 0.</div><span class=\"res\">2x + 3y + s = 12</span>"}, {"tag": "PERT — expected time", "q": "Find the expected duration: a = 2, m = 5, b = 8.", "o": ["5", "6", "4,5", "30"], "c": 0, "sol": "<span class=\"step\">t<sub>e</sub> = <span class=\"frac\"><span class=\"num\">a + 4m + b</span><span class=\"den\">6</span></span> = <span class=\"frac\"><span class=\"num\">30</span><span class=\"den\">6</span></span> = 5</span><span class=\"res\">t<sub>e</sub> = 5</span>"}, {"tag": "Transport — balance", "q": "Supplies 20, 30; demands 25, 25. Is the problem balanced?", "o": ["Yes, balanced (50 = 50)", "No", "Excess supply", "Excess demand"], "c": 0, "sol": "<span class=\"step\">∑ ponuda = 50</span><span class=\"step\">∑ potražnja = 50</span><div class=\"note\">Equal supply and demand totals → balanced.</div><span class=\"res\">Balanced (50 = 50)</span>"}], "de": [{"tag": "Modell aufstellen", "q": "Tische (Gewinn 3), Stühle (Gewinn 2); Arbeit 4x+2y ≤ 100, Material x+y ≤ 40. Modell?", "o": ["max 3x + 2y u. d. Nebenbedingungen", "min 3x + 2y", "max 2x + 3y", "max 3x + 2y ohne Nebenbedingungen"], "c": 0, "sol": "<span class=\"step\">max z = 3x + 2y</span><span class=\"step\">uz: 4x + 2y ≤ 100, x + y ≤ 40, x, y ≥ 0</span><div class=\"note\">Zielfunktion = Gesamtgewinn; Nebenbedingungen = Ressourcen.</div><span class=\"res\">max 3x + 2y</span>"}, {"tag": "Grafisches Verfahren — Ecken", "q": "Bestimme the optimum: max z = x + y s.t. x ≤ 3, y ≤ 4, x, y ≥ 0.", "o": ["z = 7 in Ecke (3, 4)", "z = 3", "z = 4", "z = 12"], "c": 0, "sol": "<span class=\"step\">Optimum u temenu (3, 4)</span><span class=\"step\">z<sub>max</sub> = 3 + 4 = 7</span><div class=\"note\">Das LP-Optimum liegt stets in einer Ecke.</div><span class=\"res\">z = 7 u (3, 4)</span>"}, {"tag": "Schlupfvariablen", "q": "Bringe 2x + 3y ≤ 12 auf eine Gleichung.", "o": ["2x + 3y + s = 12, s ≥ 0", "2x + 3y = 12", "2x + 3y − s = 12", "2x + 3y + s = 0"], "c": 0, "sol": "<span class=\"step\">2x + 3y + s = 12, s ≥ 0</span><div class=\"note\">Eine Schlupfvariable s ≥ 0 hinzufügen.</div><span class=\"res\">2x + 3y + s = 12</span>"}, {"tag": "PERT — Erwartungszeit", "q": "Bestimme the expected duration: a = 2, m = 5, b = 8.", "o": ["5", "6", "4,5", "30"], "c": 0, "sol": "<span class=\"step\">t<sub>e</sub> = <span class=\"frac\"><span class=\"num\">a + 4m + b</span><span class=\"den\">6</span></span> = <span class=\"frac\"><span class=\"num\">30</span><span class=\"den\">6</span></span> = 5</span><span class=\"res\">t<sub>e</sub> = 5</span>"}, {"tag": "Transport — Bilanz", "q": "Angebote 20, 30; Nachfragen 25, 25. Ist das Problem ausgeglichen?", "o": ["Ja, ausgeglichen (50 = 50)", "Nein", "Angebotsüberschuss", "Nachfrageüberschuss"], "c": 0, "sol": "<span class=\"step\">∑ ponuda = 50</span><span class=\"step\">∑ potražnja = 50</span><div class=\"note\">Gleiche Summen von Angebot und Nachfrage → ausgeglichen.</div><span class=\"res\">Ausgeglichen (50 = 50)</span>"}], "fr": [{"tag": "Mise en place du modèle", "q": "Tables (profit 3), chaises (profit 2) ; travail 4x+2y ≤ 100, matière x+y ≤ 40. Modèle ?", "o": ["max 3x + 2y sous les contraintes", "min 3x + 2y", "max 2x + 3y", "max 3x + 2y sans contraintes"], "c": 0, "sol": "<span class=\"step\">max z = 3x + 2y</span><span class=\"step\">uz: 4x + 2y ≤ 100, x + y ≤ 40, x, y ≥ 0</span><div class=\"note\">Objectif = profit total ; contraintes = ressources.</div><span class=\"res\">max 3x + 2y</span>"}, {"tag": "Méthode graphique — sommets", "q": "Trouve the optimum: max z = x + y s.t. x ≤ 3, y ≤ 4, x, y ≥ 0.", "o": ["z = 7 au sommet (3, 4)", "z = 3", "z = 4", "z = 12"], "c": 0, "sol": "<span class=\"step\">Optimum u temenu (3, 4)</span><span class=\"step\">z<sub>max</sub> = 3 + 4 = 7</span><div class=\"note\">L'optimum d'un PL est toujours à un sommet.</div><span class=\"res\">z = 7 u (3, 4)</span>"}, {"tag": "Variables d'écart", "q": "Ramène 2x + 3y ≤ 12 à une égalité.", "o": ["2x + 3y + s = 12, s ≥ 0", "2x + 3y = 12", "2x + 3y − s = 12", "2x + 3y + s = 0"], "c": 0, "sol": "<span class=\"step\">2x + 3y + s = 12, s ≥ 0</span><div class=\"note\">On ajoute une variable d'écart s ≥ 0.</div><span class=\"res\">2x + 3y + s = 12</span>"}, {"tag": "PERT — temps espéré", "q": "Trouve the expected duration: a = 2, m = 5, b = 8.", "o": ["5", "6", "4,5", "30"], "c": 0, "sol": "<span class=\"step\">t<sub>e</sub> = <span class=\"frac\"><span class=\"num\">a + 4m + b</span><span class=\"den\">6</span></span> = <span class=\"frac\"><span class=\"num\">30</span><span class=\"den\">6</span></span> = 5</span><span class=\"res\">t<sub>e</sub> = 5</span>"}, {"tag": "Transport — équilibre", "q": "Offres 20, 30 ; demandes 25, 25. Le problème est-il équilibré ?", "o": ["Oui, équilibré (50 = 50)", "Non", "Excès d'offre", "Excès de demande"], "c": 0, "sol": "<span class=\"step\">∑ ponuda = 50</span><span class=\"step\">∑ potražnja = 50</span><div class=\"note\">Sommes offre = demande → équilibré.</div><span class=\"res\">Équilibré (50 = 50)</span>"}], "es": [{"tag": "Planteamiento del modelo", "q": "Mesas (beneficio 3), sillas (beneficio 2); trabajo 4x+2y ≤ 100, material x+y ≤ 40. ¿Modelo?", "o": ["max 3x + 2y sujeto a las restricciones", "min 3x + 2y", "max 2x + 3y", "max 3x + 2y sin restricciones"], "c": 0, "sol": "<span class=\"step\">max z = 3x + 2y</span><span class=\"step\">uz: 4x + 2y ≤ 100, x + y ≤ 40, x, y ≥ 0</span><div class=\"note\">Objetivo = beneficio total; restricciones = recursos.</div><span class=\"res\">max 3x + 2y</span>"}, {"tag": "Método gráfico — vértices", "q": "Halla the optimum: max z = x + y s.t. x ≤ 3, y ≤ 4, x, y ≥ 0.", "o": ["z = 7 en el vértice (3, 4)", "z = 3", "z = 4", "z = 12"], "c": 0, "sol": "<span class=\"step\">Optimum u temenu (3, 4)</span><span class=\"step\">z<sub>max</sub> = 3 + 4 = 7</span><div class=\"note\">El óptimo de un PL está siempre en un vértice.</div><span class=\"res\">z = 7 u (3, 4)</span>"}, {"tag": "Variables de holgura", "q": "Reduce 2x + 3y ≤ 12 a una igualdad.", "o": ["2x + 3y + s = 12, s ≥ 0", "2x + 3y = 12", "2x + 3y − s = 12", "2x + 3y + s = 0"], "c": 0, "sol": "<span class=\"step\">2x + 3y + s = 12, s ≥ 0</span><div class=\"note\">Se añade una variable de holgura s ≥ 0.</div><span class=\"res\">2x + 3y + s = 12</span>"}, {"tag": "PERT — tiempo esperado", "q": "Halla the expected duration: a = 2, m = 5, b = 8.", "o": ["5", "6", "4,5", "30"], "c": 0, "sol": "<span class=\"step\">t<sub>e</sub> = <span class=\"frac\"><span class=\"num\">a + 4m + b</span><span class=\"den\">6</span></span> = <span class=\"frac\"><span class=\"num\">30</span><span class=\"den\">6</span></span> = 5</span><span class=\"res\">t<sub>e</sub> = 5</span>"}, {"tag": "Transporte — balance", "q": "Ofertas 20, 30; demandas 25, 25. ¿Está equilibrado?", "o": ["Sí, equilibrado (50 = 50)", "No", "Exceso de oferta", "Exceso de demanda"], "c": 0, "sol": "<span class=\"step\">∑ ponuda = 50</span><span class=\"step\">∑ potražnja = 50</span><div class=\"note\">Sumas de oferta y demanda iguales → equilibrado.</div><span class=\"res\">Equilibrado (50 = 50)</span>"}], "it": [{"tag": "Impostazione del modello", "q": "Tavoli (profitto 3), sedie (profitto 2); lavoro 4x+2y ≤ 100, materiale x+y ≤ 40. Modello?", "o": ["max 3x + 2y con i vincoli dati", "min 3x + 2y", "max 2x + 3y", "max 3x + 2y senza vincoli"], "c": 0, "sol": "<span class=\"step\">max z = 3x + 2y</span><span class=\"step\">uz: 4x + 2y ≤ 100, x + y ≤ 40, x, y ≥ 0</span><div class=\"note\">Obiettivo = profitto totale; vincoli = risorse.</div><span class=\"res\">max 3x + 2y</span>"}, {"tag": "Metodo grafico — vertici", "q": "Trova the optimum: max z = x + y s.t. x ≤ 3, y ≤ 4, x, y ≥ 0.", "o": ["z = 7 nel vertice (3, 4)", "z = 3", "z = 4", "z = 12"], "c": 0, "sol": "<span class=\"step\">Optimum u temenu (3, 4)</span><span class=\"step\">z<sub>max</sub> = 3 + 4 = 7</span><div class=\"note\">L'ottimo di un PL è sempre in un vertice.</div><span class=\"res\">z = 7 u (3, 4)</span>"}, {"tag": "Variabili di slack", "q": "Riduci 2x + 3y ≤ 12 a un'uguaglianza.", "o": ["2x + 3y + s = 12, s ≥ 0", "2x + 3y = 12", "2x + 3y − s = 12", "2x + 3y + s = 0"], "c": 0, "sol": "<span class=\"step\">2x + 3y + s = 12, s ≥ 0</span><div class=\"note\">Si aggiunge una variabile di slack s ≥ 0.</div><span class=\"res\">2x + 3y + s = 12</span>"}, {"tag": "PERT — tempo atteso", "q": "Trova the expected duration: a = 2, m = 5, b = 8.", "o": ["5", "6", "4,5", "30"], "c": 0, "sol": "<span class=\"step\">t<sub>e</sub> = <span class=\"frac\"><span class=\"num\">a + 4m + b</span><span class=\"den\">6</span></span> = <span class=\"frac\"><span class=\"num\">30</span><span class=\"den\">6</span></span> = 5</span><span class=\"res\">t<sub>e</sub> = 5</span>"}, {"tag": "Trasporto — bilancio", "q": "Offerte 20, 30; domande 25, 25. È bilanciato?", "o": ["Sì, bilanciato (50 = 50)", "No", "Eccesso di offerta", "Eccesso di domanda"], "c": 0, "sol": "<span class=\"step\">∑ ponuda = 50</span><span class=\"step\">∑ potražnja = 50</span><div class=\"note\">Somme di offerta e domanda uguali → bilanciato.</div><span class=\"res\">Bilanciato (50 = 50)</span>"}], "ru": [{"tag": "Построение модели", "q": "Столы (прибыль 3), стулья (прибыль 2); труд 4x+2y ≤ 100, материал x+y ≤ 40. Модель?", "o": ["max 3x + 2y при данных ограничениях", "min 3x + 2y", "max 2x + 3y", "max 3x + 2y без ограничений"], "c": 0, "sol": "<span class=\"step\">max z = 3x + 2y</span><span class=\"step\">uz: 4x + 2y ≤ 100, x + y ≤ 40, x, y ≥ 0</span><div class=\"note\">Цель = суммарная прибыль; ограничения = ресурсы.</div><span class=\"res\">max 3x + 2y</span>"}, {"tag": "Графический метод — вершины", "q": "Найди the optimum: max z = x + y s.t. x ≤ 3, y ≤ 4, x, y ≥ 0.", "o": ["z = 7 в вершине (3, 4)", "z = 3", "z = 4", "z = 12"], "c": 0, "sol": "<span class=\"step\">Optimum u temenu (3, 4)</span><span class=\"step\">z<sub>max</sub> = 3 + 4 = 7</span><div class=\"note\">Оптимум ЛП всегда в вершине.</div><span class=\"res\">z = 7 u (3, 4)</span>"}, {"tag": "Дополнительные переменные", "q": "Приведи 2x + 3y ≤ 12 к равенству.", "o": ["2x + 3y + s = 12, s ≥ 0", "2x + 3y = 12", "2x + 3y − s = 12", "2x + 3y + s = 0"], "c": 0, "sol": "<span class=\"step\">2x + 3y + s = 12, s ≥ 0</span><div class=\"note\">Добавляем дополнительную переменную s ≥ 0.</div><span class=\"res\">2x + 3y + s = 12</span>"}, {"tag": "PERT — ожидаемое время", "q": "Найди the expected duration: a = 2, m = 5, b = 8.", "o": ["5", "6", "4,5", "30"], "c": 0, "sol": "<span class=\"step\">t<sub>e</sub> = <span class=\"frac\"><span class=\"num\">a + 4m + b</span><span class=\"den\">6</span></span> = <span class=\"frac\"><span class=\"num\">30</span><span class=\"den\">6</span></span> = 5</span><span class=\"res\">t<sub>e</sub> = 5</span>"}, {"tag": "Транспорт — баланс", " var LANG='sr';try{LANG=(localStorage.getItem('mathia_lang')||'sr').toLowerCase();}catch(e){}if(!DATA[LANG])LANG='sr';
var Q=DATA[LANG];
function tr(l){if(!DATA[l])l='sr';LANG=l;Q=DATA[l];try{localStorage.setItem('mathia_lang',l);}catch(e){}document.documentElement.lang=l;document.querySelectorAll('[data-i18n]').forEach(function(e){var k=e.getAttribute('data-i18n');if(I18N[k]&&I18N[k][l])e.textContent=I18N[k][l];});document.querySelectorAll('[data-i18n-html]').forEach(function(e){var k=e.getAttribute('data-i18n-html');if(I18N[k]&&I18N[k][l])e.innerHTML=I18N[k][l];});var sel=document.getElementById('qlang');if(sel)sel.value=l;render();}


  var idx=0, revealed=false, L=["A","B","C","D","E"];
  var qcard=document.getElementById("qcard"),end=document.getElementById("end");
  function pick(k,el){
    var op=document.getElementById("opts"); if(op.classList.contains("locked")) return;
    op.classList.add("locked"); var it=Q[idx], nd=op.children;
    for(var j=0;j<nd.length;j++){ if(j===it.c) nd[j].classList.add("correct"); }
    var fb=document.getElementById("fb");
    if(k===it.c){ fb.className="fb ok"; fb.textContent=I18N.fbOk[LANG]; }
    else{ el.classList.add("wrong"); fb.className="fb no"; fb.textContent=I18N.fbNo[LANG]; }
    document.getElementById("nextBtn").style.display="";
  }
  function render(){
    var it=Q[idx];
    document.getElementById("tag").innerHTML=it.tag;
    document.getElementById("qtxt").innerHTML=it.q;
    var op=document.getElementById("opts"); op.className="opts"; op.innerHTML="";
    (it.o||[]).forEach(function(txt,k){ var b=document.createElement("div"); b.className="opt"; b.innerHTML='<span class="mk">'+L[k]+'</span><span>'+txt+'</span>'; b.addEventListener("click",function(){ pick(k,b); }); op.appendChild(b); });
    var fb=document.getElementById("fb"); fb.className="fb"; fb.textContent="";
    document.getElementById("solbody").innerHTML=it.sol;
    document.getElementById("sol").classList.remove("on");
    document.getElementById("revealBtn").style.display="";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("nextBtn").textContent = (idx===Q.length-1 ? I18N.nextEnd[LANG] : I18N.nextMid[LANG]);
    document.getElementById("prevBtn").style.visibility = idx>0 ? "visible":"hidden";
    document.getElementById("qnum").textContent=I18N.qnum[LANG]+" "+(idx+1)+" / "+Q.length;
    document.getElementById("bar").style.width=((idx)/Q.length*100)+"%";
    revealed=false;
    window.scrollTo({top:0,behavior:"smooth"});
  }
  document.getElementById("revealBtn").addEventListener("click",function(){
    document.getElementById("sol").classList.add("on");
    this.style.display="none";
    document.getElementById("nextBtn").style.display="";
    revealed=true;
  });
  document.getElementById("nextBtn").addEventListener("click",function(){
    if(idx<Q.length-1){idx++;render();}
    else{ // kraj
      document.getElementById("bar").style.width="100%";
      qcard.style.display="none";document.getElementById("qnum").style.display="none";document.querySelector(".prog").style.display="none";
      end.classList.add("on");window.scrollTo({top:0,behavior:"smooth"});
    }
  });
  document.getElementById("prevBtn").addEventListener("click",function(){ if(idx>0){idx--;render();} });
  document.getElementById("againBtn").addEventListener("click",function(){
    idx=0;end.classList.remove("on");qcard.style.display="";document.getElementById("qnum").style.display="";document.querySelector(".prog").style.display="";render();
  });
  var _sel=document.getElementById('qlang');if(_sel){_sel.value=LANG;_sel.addEventListener('change',function(){tr(this.value);});}
  tr(LANG);
})();
</script>
